version: 2

project_name: meko

# The amp import brought amp's tags into this repo: 62 of the 64 tags here are
# amp's (`amp-*`, `amp/*`, and bare `0.<date>.<n>`), against meko's two `v*`.
# `meko-*` is the image build's release namespace (meko/jenkins/) and is not a
# CLI version either.
# Real releases are unaffected — meko-release.yml fires only on `v*` and
# goreleaser then uses the pushed tag — but snapshot builds resolve the version
# via `git describe`, which lands on an amp tag and stamps it into the binary
# through the ldflags below.
git:
  ignore_tags:
    - "amp-*"
    - "amp/*"
    - "0.*"
    - "meko-*"

builds:
  - id: meko
    dir: meko/cli_app
    main: .
    binary: meko
    ldflags:
      - -s -w -X cli_app/cmd.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: yugabyte
    name: meko
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
