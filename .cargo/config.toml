[build]
# This is only present for local builds, as it will be overridden
# by the RUSTDOCFLAGS env var in CI.
rustdocflags = ["-Arustdoc::private_intra_doc_links"]

# Enable frame pointers. This may have a minor performance overhead, but makes it easier and more
# efficient to obtain stack traces (and thus CPU/heap profiles). It may also avoid seg faults that
# we've seen with libunwind-based profiling. See also:
#
# * <https://www.brendangregg.com/blog/2024-03-17/the-return-of-the-frame-pointers.html>
# * <https://github.com/rust-lang/rust/pull/122646>
#
# NB: the RUSTFLAGS envvar will replace this. Make sure to update e.g. Dockerfile as well.
# `--cfg tokio_unstable` + `--cfg tokio_taskdump` enable
# `tokio::runtime::Handle::dump()` (tokio's `cfg_taskdump!` gate) for the
# on-demand task dumps in `utils::tokio_dump` (SIGUSR2 handler on every
# daemon). These apply to all targets except the macOS override below.
rustflags = [
    "-Cforce-frame-pointers=yes",
    "--cfg",
    "tokio_unstable",
    "--cfg",
    "tokio_taskdump",
]

# tokio only supports taskdump on Linux (aarch64/x86/x86_64), so a macOS build
# hits tokio's `compile_error!`. Carve macOS out with tokio_taskdump dropped.
# cargo does not merge rustflags across sources (the highest-priority source
# with a value wins), so this section wholesale-replaces [build].rustflags on
# macOS and must re-list the flags macOS keeps.
[target.'cfg(target_os = "macos")']
rustflags = [
    "-Cforce-frame-pointers=yes",
    "--cfg",
    "tokio_unstable",
]

[alias]
build_testing = ["build", "--features", "testing"]
