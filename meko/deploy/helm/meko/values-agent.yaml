# ============================================================================
# MODE preset — the BYOC pull agent, alone.
#
# For a data-plane / customer cluster that enrolls into a YCP control plane but
# runs none of the Meko stack itself. `mode: agent` suppresses every other
# component regardless of its `enabled` flag, so this replaces the seven separate
# --set <comp>.enabled=false flags an agent install used to need. Forgetting one
# of those put a data-plane workload in someone else's cluster.
#
# All agent traffic is OUTBOUND: agent -> YCP over HTTPS, agent -> its own
# in-cluster Kubernetes API. YCP never dials in, so the cluster needs no inbound
# rules.
#
# Compose with a cloud preset AND an env preset, and pass THIS FILE LAST:
#   helm upgrade --install meko-agent charts/meko -n ycp-agent --create-namespace \
#     -f charts/meko/values-aws.yaml -f charts/meko/values-dev.yaml \
#     -f charts/meko/values-agent.yaml \
#     --set agent.ycpUrl=$YCP \
#     --set agent.envName=$ENV_ID \
#     --set-string agent.image.tag=$TAG
#
# The env preset is not optional: it is what sets global.imageRegistry, and dev
# and prod are different ECR accounts, so the registry cannot live in the cloud
# preset. Without it the image renders as a bare `meko/meko-agent:<tag>` and the
# pull fails.
#
# Required Secret in the release namespace — the chart holds no secret material:
#   meko-agent-api-key, key `api-key` (the YBM API key, shown once by YBM and
#   revocable there). Dev mode against a standalone control plane: keys
#   `dev-admin-secret` + `dev-api-key-id` in the same Secret instead of api-key.
# ============================================================================

mode: agent

agent:
  enabled: true
  # Empty means "the release namespace" (helm -n <ns>), so a normal install needs
  # no override. Set it explicitly only to put the agent somewhere other than the
  # release namespace.
  namespace: ""
  # REQUIRED, no sensible default:
  #   ycpUrl  — the control plane's base URL, reachable from this cluster
  #   envName — must match the id of the environment registered in YCP (the slug
  #             of the name you registered)
  #   image.tag
  ycpUrl: ""
  envName: ""

# Suppressed by `mode: agent` regardless of these flags. Set explicitly so
# `helm get values` is honest about what this release does NOT deploy.
apiServer: { enabled: false }
mekoUi: { enabled: false }
mekoMcpServer: { enabled: false }
inferenceGateway: { enabled: false }
ragAgent: { enabled: false }
langfuse: { enabled: false }
provisioner: { enabled: false }
controlPlaneDb: { enabled: false }
