# ============================================================================
# meko chart — canonical values schema with cloud-neutral safe defaults.
#
# Compose at install time: a cloud preset + an env preset, e.g.
#   helm upgrade --install meko charts/meko -n meko-system --create-namespace \
#     -f charts/meko/values-aws.yaml -f charts/meko/values-prod.yaml \
#     --set-string apiServer.image.tag=$VERSION
#
# Cloud presets (values-aws.yaml / values-gcp.yaml) set only global.*, ingress.*,
# langfuse.lb.annotations, ragAgent.gpu.*, and registry paths. Env presets
# (values-dev.yaml / values-prod.yaml) set hosts, Cognito IDs, DB endpoints,
# tags, replicas, SES. This base file is cloud-neutral: it must never encode
# an AWS-only or GCP-only default.
# ============================================================================

# Deploy mode — selects which component set this release stands up:
#   mcp   (default) DATA PLANE: the full Meko stack (unchanged behavior) —
#         api-server + meko-mcp-server + provisioner + meko-ui + inference-gateway
#         + rag-agent + langfuse. This is what every existing install deploys.
#   ycp  CONTROL PLANE (BYOC / YCP): api-server run with --control-plane-mode
#         (the fleet registry + agent API) plus its console, exposed via an
#         internal LoadBalancer. No data-plane components render. Deployed inside
#         the Meko/Aeon VPC, not a customer cluster.
# Compose with the matching preset, e.g. -f values-gcp.yaml -f values-ycp.yaml.
mode: mcp

global:
  # e.g. 161908593886.dkr.ecr.us-east-2.amazonaws.com (AWS)
  #      us-east1-docker.pkg.dev/<project> (GCP)
  imageRegistry: ""
  # gp2-csi (AWS) / pd-ssd (GCP) — set by the cloud preset. Only controlPlaneDb
  # (ycp mode) claims a volume today. A class the target cluster does not have
  # fails the install rather than leaving a PVC Pending forever.
  storageClassName: ""
  # aws | gcp — selects preset defaults in helpers/NOTES
  cloud: aws
  region: us-east-2
  imagePullPolicy: Always
  # Collapse every component into the RELEASE namespace, ignoring the per-component
  # `namespace` values below. What a BYOC data plane needs: one namespace an operator
  # can grant, inspect and delete as a unit — and the only shape the pull agent can
  # install, since it manages exactly the namespace it runs in. Off keeps the
  # historical split (meko-system / meko-mcp / meko-rag-workers / meko-langfuse) and
  # renders byte-identically to before this existed.
  singleNamespace: false
  # Names of dockerconfigjson Secrets for pulling images. Empty on EKS (node IAM
  # authorizes ECR). On GKE pulling from ECR, set to a Secret holding ECR creds
  # that exists in EVERY namespace the chart deploys into (see values-gcp.yaml).
  imagePullSecrets: []

# Create the namespaces the chart spans. Default false: the GKE/ECR flow needs
# the namespaces to already exist (you create the ECR pull Secret in each before
# `helm install`), and pre-creating them while this is true causes Helm ownership
# conflicts. Set true only for a fresh cluster where nothing is pre-created and
# no cross-namespace Secrets are needed beforehand.
createNamespaces: false
namespaces:
  - meko-system
  - meko-tenants
  - meko-mcp
  - meko-rag-workers
  - meko-langfuse
  - meko-ingress

# ECR image-pull credential refresh (for the GKE-from-ECR path). ECR auth tokens
# expire ~12h, so a static dockerconfigjson pull Secret goes stale; this CronJob
# re-mints global.imagePullSecrets in each namespace on a schedule. Disabled by
# default (EKS uses node IAM); enable it in values-gcp.yaml.
ecrCredentialRefresh:
  enabled: false
  namespace: meko-system         # where the CronJob + its RBAC live
  schedule: "0 */6 * * *"        # every 6h (< 12h token TTL, with margin)
  image: alpine/k8s:1.30.2       # public multi-tool image (aws-cli + kubectl)
  region: ""                     # defaults to global.region
  ecrServer: ""                  # defaults to global.imageRegistry
  secretName: ecr-registry-creds # must match global.imagePullSecrets
  namespaces: []                 # target namespaces; defaults to .Values.namespaces
  serviceAccountName: ecr-token-refresher
  # Referenced Secret (created out-of-band) holding the AWS creds the refresher
  # uses to call `aws ecr get-login-password`. Keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
  # Clear this (set "") when using Workload Identity (awsRoleArn) instead.
  awsCredentialsSecret: aws-ecr-refresher-creds
  # GKE->AWS Workload Identity (no static key): set to an IAM role ARN and the
  # CronJob assumes it via a projected SA token (audience sts.amazonaws.com).
  # See README. When set, also clear awsCredentialsSecret.
  awsRoleArn: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

ingress:
  className: alb                 # alb | nginx | gce
  tls:
    mode: acm-arn                # acm-arn | cert-manager | managed-cert
    acmCertArn: ""               # AWS only (acm-arn mode)
    clusterIssuer: ""            # cert-manager only
  # Extra annotations, merged AFTER the per-cloud base emitted by the
  # meko.ingressAnnotations helper.
  annotations: {}

# ---------------------------------------------------------------------------
# api-server
# ---------------------------------------------------------------------------
apiServer:
  enabled: true
  namespace: meko-system
  tenantsNamespace: meko-tenants
  # Standardized on saas.mekodata.ai (the real CRD group). Base/prod historically
  # drifted to cloud.mekodata.ai — see HELM_MIGRATION_PLAN.md §6.6 (behavior fix).
  crdApiGroup: saas.mekodata.ai
  replicas: 3
  image:
    repository: meko/meko-api-server
    tag: ""                      # REQUIRED at deploy time (per-env)
  service:
    port: 80
    targetPort: 25433
    # Annotations on the ClusterIP Service. Mainly for operators that expose a
    # Service by watching for their own annotations — e.g. Tailscale:
    #   annotations:
    #     tailscale.com/expose: "true"
    #     tailscale.com/hostname: "ycp"
    #     tailscale.com/tags: "tag:k8s-meko"
    annotations: {}
  containerPort: 25433
  # Prometheus /metrics, on its own port so the Ingress in front of containerPort
  # never exposes it. Scraped by the otel collector (see `otel` below); 0 turns
  # the listener off.
  metricsPort: 9464
  # Serve the whole api-server under a URL prefix instead of the domain root:
  # console, /api/v1, the agent API, swagger, the OAuth2 callback. Empty (the
  # default) keeps everything at the root — set it only when a proxy in front
  # forwards the prefix through UNSTRIPPED. That is how YCP is fronted at
  # https://devcloud.yugabyte.com/ycp/, sharing the YBM domain so the browser's
  # auth tokens and session storage carry over.
  #
  # A plain path prefix, not a URL: the api-server refuses to start on anything
  # else rather than mounting where nothing can reach it. Needs an image built
  # with --base-path support; older images ignore the env var and serve at the
  # root, so setting this against one silently does nothing.
  #
  # The probes below stay on the unprefixed healthcheckPath on purpose — the
  # api-server keeps /api/v1/health at the domain root precisely because kubelet
  # reaches the pod directly and never passes through the proxy.
  basePath: ""
  # ycp mode only. Reject fleet calls (/api/v1/environments*, /api/v1/entitlements)
  # that do not carry X-Meko-Account-ID, instead of serving them against the whole
  # fleet. YBM stamps the header on every call it proxies, from the account it has
  # authenticated, so a control plane reached only through YBM should turn this on.
  #
  # OFF by default because it takes the unscoped fleet-admin path away: the built-in
  # console, the ycp e2e and an operator's curl all authenticate with the admin
  # secret alone and have no account to send, so they get 400 from a control plane
  # running with it on.
  #
  # The agent API is unaffected either way — it resolves the environment from the
  # api-key-id header, so it never needs an account header.
  #
  # Needs an image built with --require-account-header; Go's flag package exits on
  # an unknown flag, so an older image will not start rather than ignoring it.
  requireAccountHeader: false
  # DEPRECATED, all four: they configured the stack registration used to seed.
  # Registration seeds nothing now — a data plane's workloads come from this chart —
  # and the api-server ignores these and warns at boot. Leave them empty. They are
  # rendered as args only when set, and go away with the api-server flags once no
  # control plane in the fleet predates that warning.
  dataplane:
    mcpImage: ""
    imagePullSecret: ""
    secretRef: ""
    noBootstrapDefaults: false
  ingress:
    enabled: true                # public Ingress; set false in ycp mode (internal LB only)
    host: api.mekodata.ai
    healthcheckPath: /api/v1/health
    gke:                         # GKE-native (className=gce, tls.mode=managed-cert)
      managedCert: ""            # ManagedCertificate name to create for host
      preSharedCert: ""          # or a pre-uploaded Google cert (wildcard hosts)
      staticIp: ""               # optional GKE global static IP name
  # Cognito auth. Default on (AWS parity). Set enabled=false to bring the service
  # up WITHOUT any Cognito wiring — drops the cognito args, env, and secret
  # reference so no cognito Secret is required. Login/authenticated features stay
  # off until a real IdP is wired (a Cognito pool, or generic OIDC once the
  # api-server supports it).
  cognito:
    enabled: true
  # Generic OpenID Connect, as an alternative to Cognito. Exactly one of the two
  # may be enabled; both on fails the render rather than letting the flag order
  # decide who can sign in.
  #
  # The issuer owns its users, so a deployment on OIDC serves NO signup,
  # password-reset or email-verification routes — those live on the issuer's own
  # pages. Everything but the issuer and client is discovered from
  # /.well-known/openid-configuration.
  oidc:
    enabled: false
    # e.g. https://keycloak.example.com/realms/meko
    issuerUrl: ""
    clientId: ""
    # The callback registered with the issuer. NOT derived from the request: it
    # must match byte-for-byte, and behind a TLS-terminating proxy the server
    # cannot see its own public origin. Typically
    # https://<host>/api/v1/auth/oidc/callback
    redirectUrl: ""
    # Comma-separated, beyond the mandatory openid. Empty means profile,email —
    # what account provisioning reads.
    scopes: ""
    # Read from secrets.existing.oidc (key: oidc-client-secret), optional: empty
    # is a public client, which relies on the PKCE the server always sends.
  # Optional LoadBalancer Service for the api-server (alternative to the Ingress).
  # In `ycp` (control-plane) mode this is the fleet console / agent-API entry
  # point — set lb.enabled=true and use an INTERNAL LB (annotations come from the
  # cloud preset) so it is reachable only inside the Meko/Aeon VPC.
  lb:
    enabled: false
    type: LoadBalancer
    port: 80
    annotations: {}
  # Pod-level additions for the api-server Deployment, none set by default.
  # extraEnv and extraVolumeMounts apply to the serving container only, not the
  # migrate init containers. hostAliases and extraVolumes apply to the whole pod.
  hostAliases: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # --deploy-env value
  deployEnv: dev
  # BYOC data plane: new users are created 'pro' rather than taking the
  # meko_system.users 'free' default, which skips tier caps entirely — metering
  # a customer against plan limits on hardware they pay for themselves is wrong.
  # Paired with mekoUi.env.enableByoc (same env name, one switch per side).
  #
  # DEFAULT TRUE: an unqualified install of this chart is a BYOC data plane.
  # The hosted deployments are the exception and opt OUT explicitly —
  # values-dev, values-prod and values-ycp each set this false. A new hosted
  # preset MUST do the same, or its signups land uncapped and its billing UI
  # disappears.
  enableByoc: true
  # Feature flags rendered as bare --enable-projects / --enable-link-sharing,
  # only when true. Off here; values-byoc.yaml turns projects on and keeps link
  # sharing off. Each pairs with the
  # mekoUi.env key of the same name, which the UI reads from the same env var
  # (MEKO_ENABLE_PROJECTS, MEKO_ENABLE_LINK_SHARING), so set both sides together.
  enableProjects: false
  enableLinkSharing: false
  ses:
    fromAddress: ""
    region: us-east-2
  # Non-secret config -> ConfigMap meko-api-server-config
  config:
    DB_HOST: ""
    DB_PORT: "5433"
    DB_USER_NAME: yugabyte
    DB_NAME: ""
    DB_SSL_MODE: require
    SYSTEM_DB_HOST: ""
    SYSTEM_DB_PORT: "5433"
    SYSTEM_DB_USER_NAME: yugabyte
    SYSTEM_DB_NAME: meko_system
    SYSTEM_DB_SSL_MODE: require
    COGNITO_REGION: us-east-2
    COGNITO_POOL_ID: ""
    COGNITO_CLIENT_ID: ""
    COGNITO_DOMAIN: ""
    S3_BUCKET: ""
    S3_REGION: us-east-2
    LANGFUSE_HOST: ""
    LANGFUSE_DB_HOST: ""
    LANGFUSE_DB_SSL_MODE: require
  # Hardcoded flags from the base deployment, surfaced so they can change without
  # editing templates. Values mirror kustomize/api-server/base/deployment.yaml.
  staticArgs:
    crdNamespace: meko-tenants
    langfuseAdminApiKey: meko-local-admin-key
    s3AuthMode: iam-user
    openaiLlmModel: gpt-4.1-nano-2025-04-14
    openaiEmbeddingModel: text-embedding-3-small
    langfuseDbPort: "5433"
    langfuseDbUser: yugabyte
    langfuseDbName: langfuse
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  # References to pre-created Secrets (no secret material lives in the chart).
  # Create these Secrets in the target cluster out-of-band; keys per §5 inventory.
  # The top-level `controlPlaneSecrets` block can render the ycp-mode subset of
  # them for you instead of you creating them by hand.
  secrets:
    existing:
      cognito: meko-api-server-cognito
      oidc: meko-api-server-oidc
      db: meko-api-server-db
      s3: meko-api-server-s3
      llm: meko-api-server-llm
      systemDb: meko-api-server-system-db
      mcpInternal: meko-mcp-internal-secret
      # ycp mode only. Gates the fleet/console routes (X-Meko-Admin-Secret); with
      # no secret those routes return 503, so the console is unusable. Key:
      # admin-api-key.
      adminApiKey: meko-admin-api-key
  migrate:
    # Create the extensions the data-plane migrations depend on before migrating.
    # Needed wherever the database is fresh — a BYOC data plane the agent brings up —
    # and harmless where they already exist (CREATE EXTENSION IF NOT EXISTS). Off by
    # default: an existing shared YugabyteDB had these created when it was provisioned.
    ensureExtensions: false
    # pg_dist_rag provides dist_rag.vector_indexes; vector is pgvector; mage provides
    # mag_catalog (the Apache-AGE graph catalog) and is no longer needed by the data
    # migrations. An install that predates that change already has mage (the old 000001
    # could not apply without it), so on those this list changes nothing, and on a new
    # install nothing in the api-server's database uses the mage it creates: cli_app's
    # per-agent helper makes its own database and runs CREATE EXTENSION mage there. What
    # that does need is the server-wide ysql_yb_enable_mage gflag below, so the gflag
    # stays while cli_app creates graphs and this list entry can go whenever you like.
    # All three ship in the ybdb-meko-release image and none are created by default.
    extensions: [vector, pg_dist_rag, mage]
    # Image with ysqlsh in it — the database's own image is the reliable place to
    # find a client that matches the server.
    extensionsImage: 161908593886.dkr.ecr.us-east-2.amazonaws.com/yugabyte-db/ybdb-meko-release:2026.1.0.0-b1-meko-2
    enabled: false               # runs the DB migration as an initContainer on the Deployment
    # all | datapack | system | controlplane
    #
    # controlplane runs only the YCP fleet-registry set. It is the scope to use in
    # `ycp` mode: the other sets need YugabyteDB (HASH primary keys, SPLIT INTO
    # ... TABLETS), while this one is portable SQL and runs on plain Postgres. It
    # is also idempotent over a YugabyteDB that already applied system/000008.
    scope: all
    # Partition count of each hash-partitioned data table (MEKO_HASH_PARTITIONS),
    # for every table a pending migration creates. A table that already exists
    # keeps its count. Empty keeps 128, which bounds each partition's HNSW index:
    # with fewer, vector search slows down as the data grows. Lower it only where
    # the data stays small, such as a test stack.
    hashPartitions: ""
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

# ---------------------------------------------------------------------------
# controlPlaneDb — a small Postgres holding the YCP fleet registry, so a
# control-plane release is self-contained rather than borrowing the data plane's
# shared YugabyteDB. Control-plane-mode only: suppressed in `mcp` mode, and OFF by
# default so the data-plane stack is unchanged. values-ycp.yaml turns it on.
#
# Postgres rather than YugabyteDB because control-plane mode runs the portable
# `migrations/controlplane` set. To use an external database instead, leave this
# disabled and set apiServer.config SYSTEM_DB_*/DB_* to point at it.
# ---------------------------------------------------------------------------
controlPlaneDb:
  enabled: false
  name: ycp-postgres
  namespace: ""                  # defaults to apiServer.namespace
  image: postgres:16-alpine      # public image; no registry credentials needed
  auth:
    user: ycp
    database: ycp
    # Password comes from a pre-created Secret — no credential material in the
    # chart. Create it alongside the api-server DB Secrets, e.g.
    #   kubectl -n <ns> create secret generic ycp-postgres \
    #     --from-literal=password="$(openssl rand -hex 16)"
    # The same value must appear in the api-server db/systemDb Secrets, since
    # api_server reads its password from those.
    existingSecret: ycp-postgres
    passwordKey: password
  storage:
    size: 8Gi
    # Defaults to global.storageClassName from the cloud preset. Override when the
    # target cluster does not have that class — e.g. meko-dev-eks offers gp2 and
    # gp2-csi, not the values-aws.yaml default, and a PVC naming a missing class
    # stays Pending forever with no obvious error on the StatefulSet.
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# ---------------------------------------------------------------------------
# yugabyte — the data-plane database, as the upstream YugabyteDB subchart.
#
# Required for a self-contained BYOC data plane: the data plane's system migrations
# are YB-only DDL (SPLIT INTO … TABLETS, HASH primary keys), so api_server cannot
# migrate against Postgres at all. The upstream chart rather than a StatefulSet of
# our own — it is what YB operators already know how to tune, back up and upgrade,
# and reimplementing it would be a second implementation of somebody else's product.
#
# Off by default: every deployment today points at a YugabyteDB someone else runs.
# The values below are only read when it is on (Chart.yaml `condition`).
#
# The defaults here are a SINGLE NODE — replication factor 1, one master, one
# tserver. That is right for a BYOC environment being brought up by an agent and
# wrong for anything holding data you care about: no replication, no fault
# tolerance. Raise `replicas` and give it real storage for that.
# ---------------------------------------------------------------------------
yugabyte:
  enabled: false
  # NOT the public yugabytedb/yugabyte image.
  #
  # The data plane's migrations use YugabyteDB features that only a Meko-enabled build
  # (ybdb-meko-release, or a yugabyte-itest build that bundles pg_dist_rag) ships —
  # `dist_rag.vector_indexes`, the distributed-RAG vector index catalog.
  # Against stock YugabyteDB the very first data migration dies with
  #
  #   relation "dist_rag.vector_indexes" does not exist
  #
  # so a vanilla image cannot host Meko at all, however healthy the database looks.
  # This is the same build the shared dev data plane runs.
  Image:
    repository: 161908593886.dkr.ecr.us-east-2.amazonaws.com/yugabyte-db/ybdb-meko-release
    tag: 2026.1.0.0-b1-meko-2
    pullPolicy: IfNotPresent
    # Private registry: set to a dockerconfigjson Secret in the release namespace
    # (the same ecr-registry-creds the rest of the chart uses on GKE).
    pullSecretName: ""
  # Without ysql_yb_enable_mage the `mage` extension is present on disk and still
  # refuses to install — `CREATE EXTENSION mage` answers "extension is not available",
  # which fails apiServer.migrate.ensureExtensions while `mage` is in its list. The
  # data migrations themselves no longer need MAGE. It is a server gflag, so it cannot
  # be fixed from the client side afterwards. This is the same flag the shared dev
  # universe runs with.
  gflags:
    tserver:
      ysql_yb_enable_mage: "true"
  replicas:
    master: 1
    tserver: 1
    totalMasters: 1
  # A LoadBalancer per service is the upstream default and wrong here: nothing
  # outside the namespace talks to this database, and on GKE each one costs an IP
  # and several minutes of provisioning.
  enableLoadBalancer: false
  storage:
    # storageClass is NOT set here and cannot be defaulted from
    # global.storageClassName: Helm resolves values before rendering, so a parent
    # cannot compute a subchart's. Pass it at install time alongside the global one
    # (see values-byoc.yaml's header) or the database lands on the cluster's default
    # class while everything else lands where you asked —
    # templates/yugabyte-storage-guard.yaml refuses that rather than letting it hide.
    #
    # Set this instead to accept the cluster default on purpose. Required on any
    # database whose volumes already exist: volumeClaimTemplates are immutable, so
    # naming a class after the fact fails the upgrade outright.
    acceptClusterDefault: false
    master:
      count: 1
      size: 10Gi
    tserver:
      count: 1
      size: 20Gi
  resource:
    master:
      requests: { cpu: "0.5", memory: 1Gi }
      limits: { cpu: "1", memory: 2Gi }
    tserver:
      requests: { cpu: "0.5", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }

# ---------------------------------------------------------------------------
# controlPlaneSecrets — render the ycp-mode Secrets from values instead of
# creating them by hand (issue #42, item 7).
#
# A control-plane install needs four Secrets, five with the bundled Postgres, and
# creating them by hand is both the longest step in the runbook and the easiest to
# get wrong: the SAME database password has to appear in three separate Secrets,
# and a mismatch shows up as an api-server that starts, passes its probes, and
# fails every query. Set one value here and the chart fans it out.
#
# OFF by default, deliberately. Two consequences to accept before enabling it:
#
#   1. Whatever you pass lands in Helm release state (the release Secret in the
#      namespace, and `helm get values <release>`). That is fine for a dev or
#      demo control plane and a judgement call for anything else — an external
#      secret manager, or the by-hand path, keeps credentials out of it.
#   2. Helm refuses to adopt objects it did not create. Enabling this on a release
#      whose Secrets were made with `kubectl create secret` fails with "invalid
#      ownership metadata"; delete those Secrets first (the DB one only when the
#      database's own password can be reset, i.e. before the volume exists).
#
# Only the entries you fill in are rendered, so partial adoption works: supply
# just adminApiKey and keep the DB Secrets out-of-band, for instance.
#
# Nothing is auto-generated. A chart that generated a password would have to read
# it back with `lookup` on every upgrade, and `lookup` returns nothing under
# `helm template` or a client dry-run — so the generated value silently rotates
# and locks you out of your own database. Generate at the call site instead, where
# the value is visible and can be saved:
#   --set controlPlaneSecrets.adminApiKey=$(openssl rand -hex 24)
#
# One reinstall hazard, for the same reason: the bundled Postgres' PVC outlives both
# the release and this Secret, and Postgres keeps the password it was initialised
# with. Reinstalling into a namespace whose PVC survived, with a NEW dbPassword,
# gives a healthy-looking database that rejects every connection. Reuse the password
# or delete the PVC.
# ---------------------------------------------------------------------------
controlPlaneSecrets:
  enabled: false
  # Fans out to apiServer.secrets.existing.db and .systemDb (key `db-password`),
  # and to controlPlaneDb.auth.existingSecret (key `password`) when the bundled
  # Postgres is enabled. One value, so they cannot disagree.
  dbPassword: ""
  # Gates the fleet/console routes. Losing it means no console: it cannot be
  # recovered from the chart, only replaced.
  adminApiKey: ""
  # api_server's internal machine-to-machine validate endpoint.
  mcpInternalSecret: ""

# ---------------------------------------------------------------------------
# dataPlaneSecrets — the same idea for a data plane, and the reason a BYOC
# install needs no `kubectl create secret` at all.
#
# The by-hand version is worse here than on the control plane: the SAME database
# password has to appear in THREE Secrets under two different key names
# (`db-password` twice, then `password` and `system_password`), and it also has to
# match whatever the database was initialised with. Set dbPassword once and the
# chart writes all of them — and because `yugabyte.enabled` means this release
# installs the database too, both sides of that match come from this one value.
#
# What you can leave empty:
#   - openaiApiKey — memory extraction and RAG stop working; nothing fails to start,
#     because those refs are optional. Fill it in to get a Meko that remembers.
#   - mcpInternalSecret — needed by api_server and meko-mcp-server, and deliberately
#     NOT optional at the ref: an absent internal secret is a data plane whose two
#     halves silently reject each other, which is worse than a pod that won't start.
#   - the three this block does not cover — cognito-client-secret, meko-ui-secret
#     and openai-credentials are read with optional=true, so a missing one costs
#     its feature (auth, analytics) and nothing else. meko-api-server-s3 used to
#     be a fourth; s3AccessKey/s3SecretKey below now render it.
#
# Same no-generation rule as controlPlaneSecrets, for the same reason: `lookup` is
# empty under `helm template`, so a chart-generated password rotates itself out of
# its own database. values-byoc.yaml sets dbPassword to the well-known `yugabyte`
# instead — the bundled database ships with YSQL auth off, so it guards nothing.
# Turning auth on means a real password here AND
# `yugabyte.authCredentials.ysql.passwordSecretName: yugabytedb-credentials`, which
# points the subchart's credential job at the very Secret this renders (key
# `ysqlPassword`): one value, both sides, no way to disagree.
#
# Reinstall hazard, unchanged from the control plane's: the database's PVC outlives
# the release. A new dbPassword against a surviving volume, with auth on, is a
# healthy-looking database that rejects every connection.
# ---------------------------------------------------------------------------
dataPlaneSecrets:
  enabled: false
  # Fans out to apiServer.secrets.existing.db and .systemDb (key `db-password`) and
  # to mekoMcpServer.secrets.existing.yugabytedb (keys `password`, `system_password`,
  # plus `ysqlPassword` for the YugabyteDB subchart).
  dbPassword: ""
  # apiServer.secrets.existing.llm (key `openai-api-key`) and
  # mekoMcpServer.secrets.existing.openai (key `password`).
  openaiApiKey: ""
  # Shared between api_server and meko-mcp-server. Both must see the same value.
  mcpInternalSecret: ""
  # Bedrock credentials for inferenceGateway.secrets.existing.aws (keys
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY). Rendered only when BOTH are set,
  # the gateway is enabled and INFERENCE_LLM_PROVIDER is bedrock. Under the
  # openai provider that same Secret carries OPENAI_API_KEY instead, from
  # openaiApiKey above.
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  # Object storage for knowledge-base uploads → apiServer.secrets.existing.s3
  # (keys s3-access-key / s3-secret-key). The api-server reads the pair into
  # BOTH S3_ACCESS_KEY/S3_SECRET_KEY and AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY,
  # so these two values configure all four env vars.
  #
  # Only for apiServer.staticArgs.s3AuthMode = iam-user or minio. Under
  # iam-role leave them empty: the SDK resolves IRSA / the instance profile,
  # and static keys would shadow it.
  #
  # Distinct from awsAccessKeyId above — that is Bedrock for the inference
  # gateway, this is S3 for the api-server. Same cloud, different grants, and
  # nothing requires them to be the same principal.
  #
  # IAM policy this principal needs, scoped to apiServer.config.S3_BUCKET.
  # TWO statements, not one — s3:ListBucket is a bucket-level action and only
  # works on the bucket ARN itself, never on a /* object ARN:
  #   { "Effect": "Allow",
  #     "Action": "s3:ListBucket",
  #     "Resource": "arn:aws:s3:::<bucket>" }
  #   { "Effect": "Allow",
  #     "Action": ["s3:PutObject", "s3:GetObject", "s3:DeleteObject"],
  #     "Resource": "arn:aws:s3:::<bucket>/*" }
  # PutObject signs the presigned upload URL; GetObject serves the file back
  # (viewing/downloading a previously uploaded KB document); DeleteObject
  # backs the per-file delete handler. ListBucket is easy to miss because
  # nothing here looks like a listing call, but s3_service.go's upload path
  # calls ListObjectsV2 first (content-hash dedup: does an object with this
  # hash already exist under the user/datapack prefix?), and KB sync/listing
  # does the same — both AccessDenied without it. Losing ListBucket also
  # breaks ObjectExists in a way that is easy to miss in testing: S3 answers a
  # HeadObject on a missing key with 403 instead of 404 when the caller can't
  # list, so the "not found" branch never triggers and the call surfaces as an
  # error instead of a clean false.
  #
  # A SEPARATE grant is needed for ragAgent: the RAG workers process what lands
  # in this bucket, but there is no S3-specific credential slot in their pod
  # spec — only ragAgent.secrets.existing.rag's AWS_ACCESS_KEY_ID/
  # AWS_SECRET_ACCESS_KEY (see ragAgent.config.AWS_S3_BUCKET_NAME below), the
  # same pair already used for Bedrock, set by ragAwsAccessKeyId/
  # ragAwsSecretAccessKey below. That principal needs s3:GetObject
  # (and, if the worker enumerates rather than being handed an exact key,
  # s3:ListBucket on the bucket ARN, same as above) added to its
  # bedrock:InvokeModel grant. Two different buckets are not supported — set
  # the same bucket name in both places.
  s3AccessKey: ""
  s3SecretKey: ""
  # The rag workers' AWS credential → ragAgent.secrets.existing.rag (keys
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), rendered with the rest of that
  # Secret when ragAgent is enabled. Both or neither: half a pair fails the
  # render. With neither the workers still start, but every source scan fails with
  # "Unable to locate credentials", so an uploaded file is never registered.
  # Grants are described under s3AccessKey above, plus bedrock:InvokeModel on
  # amazon.titan-embed-text-v1: the seeded knowledge_bases and conversation_history_search
  # indexes embed with it.
  ragAwsAccessKeyId: ""
  ragAwsSecretAccessKey: ""
  # The MCP server's AWS credential → mekoMcpServer.secrets.existing.aws (keys
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), rendered when mekoMcpServer is enabled.
  # It embeds KB and conversation search queries with whatever provider the index's
  # dist_rag.vector_indexes row names, so against the seeded Bedrock Titan rows it
  # needs bedrock:InvokeModel on amazon.titan-embed-text-v1 and nothing else. Both or
  # neither: the render fails on half a pair. With neither, those searches embed
  # nothing and answer empty. Region: mekoMcpServer.staticEnv.awsRegion.
  mcpAwsAccessKeyId: ""
  mcpAwsSecretAccessKey: ""
  # apiServer.secrets.existing.oidc (key `oidc-client-secret`), when the data
  # plane authenticates against an OIDC issuer with a confidential client. Empty
  # is a public client, which relies on the PKCE the server always sends.
  oidcClientSecret: ""
  # langfuse.secrets.existing.langfuse (rendered by templates/dataplane-secrets.yaml
  # when langfuse.migrate.enabled — see that template). Four of these are real
  # cryptographic material, not a shared/no-op value like dbPassword above (the
  # bundled YugabyteDB runs with YSQL auth off, so that one guards nothing;
  # these do). None has a default in values-byoc.yaml — the chart FAILS the
  # render when BOTH dataPlaneSecrets.enabled and langfuse.migrate.enabled are
  # true and one of the seven fields in this section (see below for the other
  # three) is empty, rather than letting a demo password ship:
  # LANGFUSE_INIT_USER_PASSWORD, unset, is the exact credential a HackerOne
  # report (4037821) already used for an RCE against this same default, in the
  # equivalent kustomize deploy path.
  langfuseNextauthSecret: ""
  langfuseSalt: ""
  langfuseEncryptionKey: ""
  langfuseAdminApiKey: ""
  # Creates the org/project/user LANGFUSE_INIT_ORG_ID et al. (in langfuse.config)
  # seed on first boot — see meko-langfuse/web/src/initialize.ts. The operator
  # supplies both at install time:
  #   --set dataPlaneSecrets.langfuseInitUserEmail=owner@<your-domain> \
  #   --set dataPlaneSecrets.langfuseInitUserPassword=$(openssl rand -hex 16)
  langfuseInitUserEmail: ""
  langfuseInitUserPassword: ""
  # The seeded project's own API secret key (sk-...). LANGFUSE_INIT_PROJECT_PUBLIC_KEY
  # is public and lives in langfuse.config; this is its pair and was missing from
  # every values file before this — the seeded project had a public key and no
  # working secret key to call the API with.
  langfuseInitProjectSecretKey: ""
  # S3 for Langfuse's own event/media/batch-export uploads — a THIRD S3
  # credential surface, distinct from apiServer's (s3AccessKey above) and
  # ragAgent's. Verified against meko-langfuse's StorageService.ts: one
  # principal, reused across all three LANGFUSE_S3_*_ACCESS_KEY_ID env vars
  # (langfuse's schema allows three independent pairs; nothing here uses that).
  # IAM policy needed, scoped to langfuse.config.LANGFUSE_S3_EVENT_UPLOAD_BUCKET:
  #   { "Effect": "Allow", "Action": "s3:ListBucket",
  #     "Resource": "arn:aws:s3:::<bucket>" }
  #   { "Effect": "Allow",
  #     "Action": ["s3:PutObject","s3:GetObject","s3:DeleteObject","s3:AbortMultipartUpload"],
  #     "Resource": "arn:aws:s3:::<bucket>/*" }
  # Required under the default langfuse.s3AuthMode=iam-user: dataplane-secrets.yaml
  # FAILS the render for a chart-managed langfuse without this pair, because the
  # S3 event-upload store is the conversation ingestion buffer (MEKO-832). Leave
  # the pair empty only with langfuse.s3AuthMode=iam-role (EKS IRSA), where the pods
  # reach S3 through langfuse.serviceAccount's eks.amazonaws.com/role-arn annotation.
  langfuseS3AccessKey: ""
  langfuseS3SecretKey: ""
  # REDIS_AUTH for an external, authenticated Valkey (langfuse.valkey.managed:
  # false). Unused — and forced to "" instead — when the bundled Valkey is
  # managed, since that one runs with auth off (see the top-level valkey:
  # block's auth.enabled).
  langfuseRedisAuth: ""

# ---------------------------------------------------------------------------
# valkey — langfuse's job queue + cache, as a subchart (mirrors how yugabyte is
# bundled below). Only rendered when langfuse.valkey.managed is true; hosted
# dev/prod point langfuse.config.REDIS_HOST at a Valkey release they already
# run outside this chart, and this block is inert for them.
# ---------------------------------------------------------------------------
valkey:
  # Keeps the bundled Service named "valkey" regardless of the release name —
  # langfuse.config.REDIS_HOST: "valkey" must resolve the same way whether
  # Valkey came from this subchart or the hosted envs' separate release.
  fullnameOverride: valkey
  # NOT overridable from here: a cloud preset's global.imageRegistry reaches
  # this subchart too (Helm passes global.* down unconditionally), and
  # charts/valkey's common.image helper lets it win over image.registry with
  # no per-subchart escape hatch — confirmed empirically, `--set
  # valkey.global.imageRegistry=...` has no effect regardless of value or
  # precedence. values-byoc.yaml resets global.imageRegistry itself instead
  # (see its comment) since our own components don't depend on it either way.
  auth:
    # Bundled, in-namespace, unreachable outside this release — same "auth
    # guards nothing a network boundary doesn't already" reasoning as the
    # bundled YugabyteDB's dbPassword.
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  dataStorage:
    # Standalone (non-replica) persistence. The worker uses this as a BullMQ
    # job queue, not just a cache, so the chart's own emptyDir default would
    # drop in-flight ingestion jobs on every pod restart. Sized off the
    # resources block above (Valkey's disk use is its AOF/RDB rewrite of the
    # in-memory dataset, not an independent number) rather than picked
    # separately — roughly 5x the memory limit covers a rewrite running
    # alongside the file it is replacing.
    enabled: true
    requestedSize: 5Gi

# ---------------------------------------------------------------------------
# meko-ui
# ---------------------------------------------------------------------------
mekoUi:
  enabled: true
  namespace: meko-system
  replicas: 1
  image:
    repository: meko/meko-ui
    tag: ""                      # REQUIRED every env (§6.5 — no implicit base tag)
  proxyImage: nginx:1.27-alpine
  # UI container resources (configurable; lower these for dev). Default matches
  # the original manifest.
  resources:
    requests: { cpu: "2", memory: "4Gi" }
    limits: { cpu: "2", memory: "4Gi" }
  # nginx proxy sidecar resources (configurable; the default is generous —
  # lower it for smaller clusters).
  proxyResources:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "2", memory: "4Gi" }
  ingress:
    # Public Ingress; set false for a self-contained install. Without this the UI
    # claims `host` in whatever namespace it lands in, and `host` comes from whichever
    # env preset was composed in — app.mekodev.com under values-dev, this default with
    # values-prod or none — so a throwaway release can take a shared name from the real
    # deployment.
    enabled: true
    host: cloud.mekodata.ai
    healthcheckPath: /
    acmCertArn: ""               # per-component override; falls back to global
    gke:
      managedCert: ""
      preSharedCert: ""
      staticIp: ""
  # Optional LoadBalancer Service for the UI (alternative to the Ingress —
  # handy for an internal LB reachable inside the VPC without an ingress/cert).
  # Per-cloud internal-vs-external annotations come from the cloud preset.
  lb:
    enabled: false
    type: LoadBalancer
    port: 80
    annotations: {}
  env:
    rudderstackDataPlaneUrl: "https://yugabyteklhgka.dataplane.rudderstack.com"
    freeTierQuotaEnabled: "true"
    # Hides the surfaces that only make sense on the hosted product: pricing,
    # tier names, delete-account, the password tile, Labs, Feedback, sign-out.
    # Paired with apiServer.enableByoc — the api-server reads the SAME env name
    # to create users pro instead of free, so the two must agree.
    # Default true, opted out by values-dev / values-prod; see apiServer.enableByoc.
    enableByoc: "true"
    # Pair with apiServer.enableProjects / apiServer.enableLinkSharing.
    enableProjects: "false"
    enableLinkSharing: "false"
  # nginx proxy upstream server addresses (host:port), injected into default.conf.
  upstreams:
    ui: 127.0.0.1:5000
    api: meko-api-server-service.meko-system.svc.cluster.local:80
    langfuse: langfuse-web.meko-langfuse.svc.cluster.local:3000
    inference: inference-gateway-service.meko-system.svc.cluster.local:8088
  secrets:
    existing:
      ui: meko-ui-secret

# ---------------------------------------------------------------------------
# memory — where mem0 memories live and how searches over them run
# ---------------------------------------------------------------------------
memory:
  # Table in the datapacks schema. meko-mcp-server writes it and the api-server
  # reads it, so this one value feeds MEM0_COLLECTION_NAME to both: switching
  # only one of them leaves the api-server missing new memories. Empty keeps
  # meko_mem0_collection. Switch to meko_mem0_memories only after steps 1-2 of
  # scripts/migrate-mem0-collection/README.md, which keep both tables in sync.
  collectionName: ""
  # meko-mcp-server only. Empty leaves the variable unset: off, or the server
  # default. Rendered only when set because an older meko-mem0 rejects the
  # options these turn on.
  exactSearchMaxRows: ""     # MEM0_EXACT_SEARCH_MAX_ROWS
  hnswEfSearch: ""           # MEM0_HNSW_EF_SEARCH
  kbExactSearchMaxRows: ""   # KB_EXACT_SEARCH_MAX_ROWS (needs migration 000006's KB index)
  kbHnswEfSearch: ""         # KB_HNSW_EF_SEARCH

# ---------------------------------------------------------------------------
# meko-mcp-server
# ---------------------------------------------------------------------------
mekoMcpServer:
  enabled: true
  # Prometheus /metrics on its own port, scraped by the otel collector; 0 turns it off.
  metricsPort: 9464
  namespace: meko-mcp
  replicas: 3
  # Extra container env entries (name/value or valueFrom). Nothing renders when empty.
  extraEnv: []
  image:
    repository: meko/meko-mcp-server
    tag: ""
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }
  config:
    DB_HOST: ""
    DB_PORT: "5433"              # templated into YUGABYTEDB_URL
    DB_NAME: ""
    SYSTEM_DB_HOST: ""
    SYSTEM_DB_PORT: "5433"       # templated into YUGABYTEDB_SYSTEM_URL
    SYSTEM_DB_NAME: meko_system
    COGNITO_USER_POOL_ID: ""
    COGNITO_CLIENT_ID: ""
    MEKO_BASE_URL: ""
    MCP_BASE_URL: ""
    LANGFUSE_HOST: ""
    MEM0_HOST: ""
    MEM0_DB_NAME: ""
    CONVERSATION_SEARCH_ENABLED: "true"
    MEKO_FREE_TIER_QUOTA_ENABLED: "true"
    # BYOC data plane: skip every tier check in the MCP tools — the per-metric
    # quota and the free-tier feature gates on the DB and vector-index tools.
    # Same env name api_server and meko_ui read. Default true here and opted
    # out by values-dev / values-prod; see apiServer.enableByoc.
    MEKO_ENABLE_BYOC: "true"
    ENABLE_ASYNC_MEMORY_EXTRACTION: "true"
  # Tunable static env (rest are literal in the template, matching source).
  staticEnv:
    transport: http
    logLevel: DEBUG
    llmModel: gpt-4.1-nano-2025-04-14
    # Which IdP the MCP server authenticates against: cognito | oidc | auth0 |
    # azure | meko_tkn. `meko_tkn` is PAT-only — no IdP at all, callers present
    # `mko_tkn_*` tokens issued by this Meko — and is what a BYOC data plane wants,
    # since it has no Cognito pool. Anything other than `meko_tkn` also needs that
    # IdP's credentials present: the server reads them at startup and exits if they
    # are missing, so this cannot be left on `cognito` and simply unconfigured.
    authProvider: cognito
    cognitoAwsRegion: us-east-2
    # Region the server calls Bedrock in to embed search queries. Unset, the server
    # falls back to us-east-1, so only set it for another region.
    awsRegion: ""
  secrets:
    existing:
      yugabytedb: yugabytedb-credentials
      openai: openai-credentials
      # Hosted dev's name for it. Optional at the ref, so an install that never
      # creates it starts and only loses Bedrock query embedding.
      aws: mcp-server-bedrock-credentials
      cognito: cognito-client-secret
      mcpInternal: meko-mcp-internal-secret

# ---------------------------------------------------------------------------
# otel — metrics and logs, the meko twin of the amp controller chart's collectors
# (amp/controller/architecture/ac-metrics.md, ac-logs.md). Two OpenTelemetryCollector
# CRs, reconciled by the OpenTelemetry Operator: one scrapes this release's
# api-server and bundled YugabyteDB and ships to a Prometheus remote-write store,
# the BYOC door, or both; a daemonset tails this release's container logs and ships
# to an OTLP log store, Datadog, or both. The keys mean what they mean there, so one
# install hint can drive both.
#
# Rendered only when enabled AND the cluster has the opentelemetry.io CRDs, so
# turning it on cannot fail an install on a cluster without the operator.
# `helm template` sees no CRDs either: pass --api-versions opentelemetry.io/v1beta1.
# ---------------------------------------------------------------------------
otel:
  # Off by default, unlike amp's: this chart also deploys the hosted stack, which
  # runs no collector and has no store at remoteWriteEndpoint. The BYOC install
  # hint turns it on. When it is off, the reconcile-agent reports that and YCP
  # shows the environment DEGRADED.
  enabled: false
  # Collector image. Empty -> the operator's default, which must be the contrib
  # distro (prometheus receiver, prometheusremotewrite exporter).
  image: ""
  # Prometheus remote-write endpoint. "" drops the exporter, which is what a BYOC
  # install does; an ABSENT key keeps this default, so --reuse-values cannot lose
  # a store. With byoc off too, the render fails: nothing would export.
  remoteWriteEndpoint: "http://victoria-metrics-server.monitoring.svc.cluster.local:8428/api/v1/write"
  # Fleet identity, stamped on every series. Set by the install hint: the YCP
  # environment id (the same value as reconcileAgent.envName) and the YBM account,
  # which the hint omits for a standalone YCP.
  environmentId: ""
  accountId: ""
  # Ship off-cluster to yugabyte-cloud: metrics to YBM Thanos over the BYOC OTLP
  # door, logs to Datadog. Each half reads its own Secret, and both must exist
  # before the install — a missing one stops that collector starting:
  #   kubectl -n <ns> create secret generic byoc-metrics-auth \
  #     --from-literal=password='<byoc password>'
  #   kubectl -n <ns> create secret generic datadog-api \
  #     --from-literal=api-key='<datadog api key>'
  byoc:
    enabled: false
    metricsEndpoint: "https://byoc.devcloud.yugabyte.com/api/v1/otlp/metrics"
    username: "byoc"
    # The `source` label on every datapoint, which separates meko series from
    # amp's in the shared store.
    source: "meko"
    passwordSecret:
      name: "byoc-metrics-auth"
      key: "password"
  # OTLP/HTTP logs endpoint. Same "" contract as remoteWriteEndpoint: "" drops the
  # in-cluster exporter (the BYOC shape), an absent key keeps this default.
  logsEndpoint: "http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs"
  # The logs daemonset has to schedule wherever this release's pods run, or those
  # nodes' logs are silently missing.
  logsTolerations: []
  # The Datadog sink's parameters, used when byoc.enabled.
  datadog:
    site: "us3.datadoghq.com"
    apiKeySecret:
      name: "datadog-api"
      key: "api-key"
  collectors:
    logs:
      enabled: true
  # Per-pod CPU/memory/network from each node's kubelet (cAdvisor), kept to the
  # namespaces this release runs in. Needs a ClusterRole on nodes; with
  # scrape.provisioner off too, the collector needs no cluster-scoped rights.
  podMetrics: true
  scrape:
    apiServer: true
    mcpServer: true
    inferenceGateway: true
    reconcileAgent: true
    # controller-runtime's own /metrics, authenticated by service-account token.
    # Needs a ClusterRoleBinding to the provisioner's metrics-reader role.
    provisioner: true
    # Langfuse's DogStatsD metrics, received by the collector on UDP 8125.
    langfuse: true
    # yb-master, yb-tserver and YSQL, when yugabyte.enabled. Table- and
    # tablet-level series are dropped at the collector: every datapack is several
    # tables, so they grow with the customer's data rather than with the stack.
    yugabyte: true

# ---------------------------------------------------------------------------
# reconcile-agent — the BYOC pull agent, run INSIDE this data plane. When enabled
# it enrolls this environment into a YCP control plane and converges the agents
# and datapacks the environment declares over the api-server's REST API, over
# OUTBOUND HTTPS only (agent -> YCP, agent -> api-server). It applies no
# manifests: this release's workloads are the chart's.
#
# It is the api-server's only caller and is authoritative over it — anything
# desired state stops declaring is collected — so do not enable it against an
# api-server people use directly.
#
# Data-plane only: suppressed in `ycp` mode. OFF by default; an install opts in
# with reconcileAgent.enabled=true + ycpUrl + an agent API key Secret.
# ---------------------------------------------------------------------------
reconcileAgent:
  enabled: false
  namespace: meko-system
  # Keep this at 1: replicas would share one API-key identity, race on the
  # reconcile-agent-state Secret, and each garbage-collect the other's work.
  replicas: 1
  # Prometheus /metrics: tick outcomes, desired-state fetches and status reports.
  # 0 turns it off.
  metricsPort: 9464
  image:
    # Quay rather than the Meko ECR — the same registry the control-plane image
    # uses, so a cluster pulls it without ECR cross-account pull-secret setup.
    registry: quay.io
    repository: yugabyte/ycp-reconciler-agent
    tag: ""                      # REQUIRED when enabled
  # YCP control-plane base URL (outbound), including its API path — YBM's
  # pass-through, or the control plane's own /api/v1 behind any --base-path.
  ycpUrl: ""
  # Environment identity as registered in YCP. Empty -> the release namespace.
  envName: ""
  placement: cloud               # cloud | onprem
  reconcileInterval: ""          # e.g. 30s; empty -> the agent's own default
  # The api-server to converge against, including its /api/v1 path. Empty -> the
  # one this release deploys.
  mekoApiUrl: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  secrets:
    existing:
      # The YBM API key every YCP call authenticates with (key: api-key), or
      # the dev-mode pair (dev-admin-secret + dev-api-key-id) against a
      # standalone control plane.
      apiKey: meko-agent-api-key
      # Optional Secret holding the MCP token this agent drives the api-server
      # with (key: meko-api-token). Not needed for a BYOC data plane, whose
      # api-server runs without Cognito and authenticates nobody; required
      # against one with Cognito on, where the token names the account whose
      # datapacks the reconciler creates.
      mekoApiToken: meko-reconcile-agent-token

# ---------------------------------------------------------------------------
# inference-gateway
# ---------------------------------------------------------------------------
inferenceGateway:
  enabled: true
  # Prometheus /metrics on its own port, scraped by the otel collector; 0 turns it off.
  metricsPort: 9464
  namespace: meko-system
  replicas: 1
  image:
    repository: meko/inference-gateway
    tag: ""
  resources:
    requests: { cpu: "1", memory: "1Gi" }
    limits: { cpu: "2", memory: "2Gi" }
  config:
    INFERENCE_LLM_PROVIDER: bedrock
    INFERENCE_LLM_MODEL: "openai.gpt-oss-120b-1:0"
    INFERENCE_PORT: "8088"
    INFERENCE_LOG_LEVEL: INFO
    AWS_REGION: us-east-2
    # Empty means "fill from this release" (templates/inference-gateway/configmap.yaml):
    # the in-cluster meko-mcp-server, and the UI's Ingress origin if it has one.
    INFERENCE_MCP_ENDPOINT: ""
    INFERENCE_CORS_ORIGINS: ""
    INFERENCE_CONV_SUMMARY_MODEL: mistral.ministral-3-3b-instruct
    # Route retrieval through one unified `context_search` call (conversation
    # cache + memory + knowledgebase) instead of separate knowledgebase_search +
    # memory_search calls. This is the GATEWAY's own flag and nothing else reads
    # it: the MCP server's matching flag was retired when that tool became
    # always-registered (inference_gateway/chain.py), and this chart plumbs the
    # key only into inference-gateway-config.
    MEKO_ENABLE_CONTEXTUAL_PROMINENCE_SEARCH: "false"
    # Agentic chat (MEKO-407): bind a curated set of read-only Meko MCP tools onto
    # the main LLM call, so tool-shaped intents ("list all my memories") are
    # answered by calling the tool rather than by a semantic search.
    MEKO_AGENTIC_CHAT: "false"
  secrets:
    existing:
      aws: inference-gateway-aws

# ---------------------------------------------------------------------------
# rag-agent
# ---------------------------------------------------------------------------
ragAgent:
  enabled: true
  namespace: meko-rag-workers
  # Resources default to base (= prod); dev overrides in values-dev.yaml.
  #
  # text/conversations/pdf.image.tag are each REQUIRED at deploy time (meko.image
  # fails a render on an empty one) whenever ragAgent.enabled is true — which is
  # the default. An install that sets its own component tags without also using
  # values-dev.yaml/values-prod.yaml (which already supply all three) needs to
  # set every one of these explicitly, not just the ones it means to change.
  text:
    image: { repository: meko/rag-agent, tag: "" }
    nodeSelector: { node_type: rag-worker }
    resources:
      requests: { cpu: "500m", memory: "4Gi", ephemeral-storage: "8Gi" }
      limits: { cpu: "2", memory: "6Gi", ephemeral-storage: "12Gi" }
  # AUTO_COLUMN_EMBEDDING worker (kustomize's rag-agent-conversations): same
  # image family and CPU footprint as text, on the same rag-worker pool — it
  # differs only in WORKER_TYPE and reads its own YB connection string as
  # COLUMN_EMBED_SOURCE_DB_CONNECTION_STRING (see deployment-conversations.yaml).
  conversations:
    image: { repository: meko/rag-agent, tag: "" }
    nodeSelector: { node_type: rag-worker }
    resources:
      requests: { cpu: "500m", memory: "4Gi", ephemeral-storage: "8Gi" }
      limits: { cpu: "2", memory: "6Gi", ephemeral-storage: "12Gi" }
  pdf:
    image: { repository: meko/rag-agent, tag: "" }
    resources:
      requests: { cpu: "2", memory: "6Gi", ephemeral-storage: "8Gi", nvidia.com/gpu: "1" }
      limits: { cpu: "3", memory: "6Gi", ephemeral-storage: "12Gi", nvidia.com/gpu: "1" }
    # Used instead of `resources` above when gpu.enabled is false (see below):
    # same worker, no nvidia.com/gpu request. UNVERIFIED against rag-agent's own
    # source (private image, no source checkout available to this chart): the
    # assumption is that nothing in it requires a GPU to run, only to run fast,
    # so PDF ingestion still works — slower per document — rather than crashing.
    # If the image initializes CUDA unconditionally, this degrades to a
    # crash-looping pod instead; confirm against a real rollout before relying
    # on it, and see the matching caveat in NOTES.txt.
    resourcesCpuOnly:
      requests: { cpu: "2", memory: "6Gi", ephemeral-storage: "8Gi" }
      limits: { cpu: "3", memory: "6Gi", ephemeral-storage: "12Gi" }
  gpu:
    enabled: true
    # Also gates rag-agent-pdf's own scheduling (deployment-pdf.yaml): when
    # false, the Deployment still renders but drops this nodeSelector and
    # toleration and uses pdf.resourcesCpuOnly instead, so it lands on an
    # ordinary CPU node. Set false — rather than disabling pdf — on a cluster
    # with no GPU pool, e.g. a BYOC customer's.
    nodeSelector: { node_type: gpu }
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    # nvidia DaemonSet is UNWIRED today (§6.3 — no overlay renders it; the GPU
    # driver is provided out-of-band by gpu-operator). Keep OFF to preserve
    # cutover parity; turn on only for a genuinely self-managed GPU node pool.
    selfManagedPlugin: false
    pluginNamespace: kube-system
    pluginImage: nvcr.io/nvidia/k8s-device-plugin:v0.15.0
  config:
    AWS_REGION: us-east-1
    TASK_LEASE_DURATION: "600"
    TXT_LANGFUSE_HOST: ""
    PDF_LANGFUSE_HOST: ""
    # Same bucket as apiServer.config.S3_BUCKET — this is what these workers
    # read to process an uploaded KB file. The IAM policy secrets.existing.rag
    # needs for that is documented at dataPlaneSecrets.s3AccessKey above.
    AWS_S3_BUCKET_NAME: ""
    ENABLE_FINETUNING: "true"
  openai:
    enabled: false               # prod-with-openai overlay → OPENAI_API_KEY env
  # The workers' database, for the Secret dataPlaneSecrets renders. Empty +
  # yugabyte.enabled builds it from the bundled database; empty with no bundled
  # database fails the render rather than shipping a worker that cannot reach one.
  #
  # Nothing here looks for a Secret you created yourself: with
  # dataPlaneSecrets.enabled the chart renders rag-agent-secret whenever the
  # component is on, so a hand-made one of the same name is either overwritten or
  # collides on helm's ownership check. Supplying your own means leaving
  # dataPlaneSecrets off — or pointing ragAgent.secrets.existing.rag at another name.
  dbConnectionString: ""
  secrets:
    existing:
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY here is the ONE AWS credential
      # these workers get — no separate slot for S3. It needs bedrock:InvokeModel
      # (for embedding/inference) AND s3:GetObject on config.AWS_S3_BUCKET_NAME
      # (to read what api-server's presigned upload put there). See
      # dataPlaneSecrets.s3AccessKey above for the exact policy shape.
      rag: rag-agent-secret

# ---------------------------------------------------------------------------
# langfuse
# ---------------------------------------------------------------------------
langfuse:
  enabled: true
  namespace: meko-langfuse
  replicas: 1
  web:
    image: { repository: meko/langfuse-web, tag: "" }
  worker:
    image: { repository: meko/langfuse-worker, tag: "" }
  lb:
    enabled: true
    type: LoadBalancer
    annotations: {}              # per-cloud (NLB on AWS)
  # Mirrors apiServer.migrate.enabled: off by default (hosted dev/prod apply the
  # langfuse schema as an explicit Jenkins step, same as api-server's), on in
  # values-byoc.yaml. Gates the metadata-schema-init/tracing-schema-init init
  # containers on the langfuse Deployment (templates/langfuse/deployment.yaml).
  # Reuses apiServer.migrate.extensionsImage — same ysqlsh-carrying YugabyteDB
  # image, nothing langfuse-specific to pin separately.
  migrate:
    enabled: false
  # S3 auth mode for langfuse's object store (its event-upload bucket is the
  # ingestion buffer — every conversation event lands there first, see
  # templates/dataplane-secrets.yaml). iam-user: static keys in
  # dataPlaneSecrets.langfuseS3AccessKey/SecretKey (works on any cloud). iam-role:
  # no keys — EKS IRSA only, via the serviceAccount.annotations below. langfuse
  # reaches S3 through the AWS SDK, and only the EKS pod-identity webhook injects
  # AWS credentials from an SA annotation; a GKE Workload Identity annotation gives
  # a Google identity the SDK cannot use for S3, so on GKE (or AWS without IRSA)
  # use iam-user. Mirrors apiServer.staticArgs.s3AuthMode.
  s3AuthMode: iam-user
  # The chart-managed langfuse pods' ServiceAccount (created only with
  # migrate.enabled — hosted keeps its own SA). Under s3AuthMode=iam-role put the
  # EKS IRSA role ARN here so the pods get the role:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
  # dataplane-secrets.yaml REFUSES iam-role without that exact annotation, so the
  # mode can't pass the render yet silently fail to reach S3.
  serviceAccount:
    name: meko-langfuse
    annotations: {}
  # §5 SECURITY FIX (flagged for confirmation): these keys carried secrets in
  # the ConfigMap today — DATABASE_URL/TRACING_DATABASE_URL embed the YB
  # password, and the S3 *_ACCESS_KEY_ID keys are AWS creds. The chart does NOT
  # put them in langfuse-config; Jenkins must add them to langfuse-secrets.env
  # instead (they arrive as env via the existing secretRef). Prod also had a
  # placeholder (<change-me>) password gap that this closes.
  # BYOC (migrate.enabled) composes DATABASE_URL/TRACING_DATABASE_URL itself
  # from dataPlaneSecrets.dbPassword and the bundled YugabyteDB's Service, the
  # same pattern meko-mcp-server's configmap already uses for DB_HOST/MEKO_BASE_URL
  # — see templates/dataplane-secrets.yaml. Hosted dev/prod still supply these
  # two literally in their own langfuse-secrets.env, unchanged.
  # MEKO-650: LANGFUSE_INIT_USER_EMAIL/PASSWORD create the Langfuse org
  # owner account (see meko-langfuse's web/src/initialize.ts) and are just
  # as sensitive as DATABASE_URL below -- their plaintext defaults
  # (owner@local.langfuse / password123) were left in this chart's
  # identical dev/prod config and, via the equivalent kustomize deploy
  # path, used for an RCE (HackerOne 4037821). Keep them out of `config:`
  # and require them from the deploy-time secrets file instead, like every
  # other credential here.
  secretKeys:
    - DATABASE_URL
    - TRACING_DATABASE_URL
    - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
    - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
    - LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID
    - LANGFUSE_INIT_USER_EMAIL
    - LANGFUSE_INIT_USER_PASSWORD
  # Non-sensitive config (identical dev/prod). Rendered into langfuse-config.
  config:
    REDIS_HOST: "valkey"
    REDIS_PORT: "6379"
    LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse-meko-bucket"
    LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-2"
    LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"
    LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "langfuse-meko-bucket"
    LANGFUSE_S3_MEDIA_UPLOAD_REGION: "us-east-2"
    LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "media/"
    LANGFUSE_S3_BATCH_EXPORT_ENABLED: "true"
    LANGFUSE_S3_BATCH_EXPORT_BUCKET: "langfuse-meko-bucket"
    LANGFUSE_S3_BATCH_EXPORT_PREFIX: "exports/"
    LANGFUSE_S3_BATCH_EXPORT_REGION: "us-east-2"
    # BYOC leaves this empty: templates/langfuse/configmap.yaml fills it with
    # this release's own langfuse-web Service when unset, the same "auto-fill
    # from the release" treatment MEKO_BASE_URL/INFERENCE_MCP_ENDPOINT already
    # get elsewhere in this chart. Hosted dev/prod keep this literal value.
    NEXTAUTH_URL: "http://localhost:5000"
    LANGFUSE_EE_LICENSE_KEY: "langfuse_ee_local_dev"
    TELEMETRY_ENABLED: "false"
    LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    LANGFUSE_AUTO_POSTGRES_MIGRATION_DISABLED: "true"
    LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED: "true"
    NEXT_PUBLIC_LANGFUSE_RUN_NEXT_INIT: "true"
    NEXT_PUBLIC_BASE_PATH: ""
    LANGFUSE_INIT_ORG_ID: "11111111-1111-4111-8111-111111111111"
    LANGFUSE_INIT_ORG_NAME: "Tracing Only Org"
    LANGFUSE_INIT_PROJECT_ID: "22222222-2222-4222-8222-222222222222"
    LANGFUSE_INIT_PROJECT_NAME: "Tracing Project"
    LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-local-tracing-project"
    LANGFUSE_INIT_USER_NAME: "Tracing Owner"
    LANGFUSE_ENABLE_BACKGROUND_MIGRATIONS: "false"
    LANGFUSE_BATCH_PROJECT_CLEANER_ENABLED: "false"
    LANGFUSE_BATCH_DATA_RETENTION_CLEANER_ENABLED: "false"
    LANGFUSE_BATCH_TRACE_DELETION_CLEANER_ENABLED: "false"
    LANGFUSE_DISABLE_CLICKHOUSE_WRITES: "true"
    QUEUE_CONSUMER_INGESTION_QUEUE_IS_ENABLED: "true"
    QUEUE_CONSUMER_OTEL_INGESTION_QUEUE_IS_ENABLED: "true"
  secrets:
    existing:
      # Rendered by templates/dataplane-secrets.yaml when migrate.enabled — see
      # dataPlaneSecrets.langfuseNextauthSecret et al. above for what goes in
      # it and why none of those have a default. Hosted dev/prod still create
      # this out-of-band (migrate.enabled stays false there), unchanged.
      langfuse: langfuse-secrets
  valkey:
    # Wires the Chart.yaml `condition: langfuse.valkey.managed` dependency —
    # true bundles the top-level valkey: subchart in-namespace (BYOC); false
    # (the default) keeps pointing config.REDIS_HOST at a Valkey release
    # deployed separately, unchanged from before this existed.
    managed: false

# ---------------------------------------------------------------------------
# provisioner (operator + CRD + per-tenant mcp-proxy)
# ---------------------------------------------------------------------------
provisioner:
  enabled: true
  namespace: meko-system
  installCRD: true               # templated CRD w/ resource-policy: keep (§6.7)
  image:
    repository: meko/meko-provisioner
    tag: ""
  mcpIngressDomain: mcp.mekodev.com
  # Prereq Secret the controller reads at runtime to seed per-tenant creds.
  # Create it out-of-band (reference-only model, §5): meko-shared-credentials in
  # meko-system with OPENAI_API_KEY (+ optional AWS_ACCESS_KEY_ID/SECRET).
  sharedCredentialsSecret: meko-shared-credentials
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
  metricsPort: 8443
  mcpProxy:
    enabled: true
    namespace: meko-ingress
    replicas: 2
    image: nginx:1.27-alpine
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
    hpa: { minReplicas: 2, maxReplicas: 10, cpuTarget: 70 }
    ingress:
      host: "*.mcp.mekodev.com"
      healthcheckPath: /healthz
      acmCertArn: ""             # mcp-proxy has its own wildcard ACM cert (AWS)
      gke:
        managedCert: ""          # wildcard can't use ManagedCertificate — use preSharedCert
        preSharedCert: ""        # pre-uploaded Google wildcard cert name
        staticIp: ""
