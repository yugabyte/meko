# ============================================================================
# MODE preset — a self-contained Meko data plane in ONE namespace.
#
# What the BYOC agent installs into the namespace it runs in: the full stack plus
# its own YugabyteDB, with nothing outside that namespace and nothing to configure
# by hand. This file is the difference between a working install and fifteen --set
# flags, three of which are not guessable.
#
# Compose with a cloud preset and an env preset, and pass THIS FILE LAST:
#   helm upgrade --install meko charts/meko -n <ns> \
#     -f charts/meko/values-gcp.yaml -f charts/meko/values-dev.yaml \
#     -f charts/meko/values-byoc.yaml \
#     --set-string apiServer.image.tag=$TAG
#
# No storage class to pass, on purpose. Two subcharts claim PVCs in a BYOC release
# — the bundled YugabyteDB and, now, bundled Valkey (langfuse.valkey.managed) — and
# neither names one: controlPlaneDb is off and the rag-agent workers claim none, so
# there is nothing else for them to be consistent WITH, and in a customer's cluster
# we cannot know the class names anyway. The cluster's default class is both the
# right answer and the only one we can rely on being appropriate there.
# `global.storageClassName` from the cloud preset governs neither: it cannot reach a
# subchart's values (Helm resolves values before rendering). YugabyteDB's own guard
# (acceptClusterDefault below, templates/yugabyte-storage-guard.yaml) fails the
# install loudly if the cluster has no default class; Valkey's upstream chart has no
# equivalent, so a cluster with no default class leaves its PVC quietly Pending
# instead — pin valkey.dataStorage.className explicitly if that cluster is a
# possibility.
#
# The chart does still refuse to install when the cluster has NO default class,
# because then the PVCs sit Pending forever and the StatefulSet never becomes ready
# with nothing saying why. To pin a class instead:
#   --set yugabyte.storage.master.storageClass=<c> --set yugabyte.storage.tserver.storageClass=<c>
#
# The one thing this preset deliberately does NOT decide is image tags, which are
# per-release.
#
# There is no `kubectl create secret` step. The chart renders the Secrets that
# matter (dataPlaneSecrets, below) and reads the rest with optional=true, so an
# unused credential costs its own feature instead of leaving a pod stuck in
# CreateContainerConfigError. What you lose by supplying nothing:
#   - no OpenAI key    -> no memory extraction (llmProvider default openai) and no
#                         RAG. Memory EMBEDDING uses Bedrock here (mekoMcpServer.
#                         staticEnv.embedderProvider=aws_bedrock), so it needs the MCP
#                         Bedrock creds below, not this key.
#   - no MCP Bedrock creds (dataPlaneSecrets.mcpAwsAccessKeyId/.mcpAwsSecretAccessKey)
#                      -> memory_add/search and KB/conversation search cannot embed;
#                         the install hint supplies these from BEDROCK_KEY.
#   - no S3 creds      -> knowledge-base file uploads fail at upload time.
#   - no Cognito       -> already off in this preset (apiServer.cognito.enabled).
#   - no Rudderstack   -> no product analytics from the UI.
# Override in a values file of your own, passed AFTER this one:
#
#   # my-values.yaml
#   dataPlaneSecrets:
#     openaiApiKey: sk-...
#     mcpInternalSecret: <openssl rand -hex 24>
#
#   helm upgrade --install ... -f charts/meko/values-byoc.yaml -f my-values.yaml
# ============================================================================

global:
  # One namespace: the only shape an agent can install, since it manages exactly the
  # namespace it runs in.
  singleNamespace: true
  # Every image in this release is on private Quay. The chart's default is an empty
  # list because ECR-on-EKS needed no secret — node IAM authorized the pull — and node
  # IAM authorizes nothing on quay.io, so leaving it empty is ImagePullBackOff on every
  # pod. Named here rather than left to the caller so this preset installs on its own;
  # the install hint creates a Secret under this name.
  imagePullSecrets: [quay-registry-creds]
  # The cloud+env preset composed before this one sets this to OUR ECR/GCR path —
  # meaningless to every component that actually deploys here, since each already
  # names its own quay.io/yugabyte registry explicitly (meko.image: component
  # registry beats global). It is NOT meaningless to the valkey subchart: Helm
  # always passes global.* down to every subchart, valkey's own common.image
  # helper lets global.imageRegistry override its image.registry UNCONDITIONALLY
  # (no per-component escape hatch the way our own components have), and a
  # customer's cluster has no credential for our ECR/GCR either way. Resetting
  # it here is what lets valkey fall through to its own public docker.io
  # default instead of a path that 404s.
  #
  # The one component this also affects: ecrCredentialRefresh (off by default,
  # below) falls back to global.imageRegistry for its own ecrServer when unset.
  # With this reset, turning it on needs ecrCredentialRefresh.ecrServer set
  # explicitly — see the comment there.
  imageRegistry: ""

yugabyte:
  # Its own database. Needs a build that bundles pg_dist_rag and mage, and the mage gflag — see values.yaml.
  enabled: true
  # From Quay, like the rest of the stack, so the namespace needs one pull credential
  # rather than also an ECR token that expires every ~12h. Until a release ships this
  # reads an integration-test build, not a release, from quay.io/yugabyte/yugabyte-itest
  # (where unreleased -bNNN builds live, and the same place the functional tests take their
  # database from), so the robot behind pullSecretName needs read on that repository as well
  # as meko-*. A shipped release is published to
  # quay.io/yugabyte/meko-yugabytedb (meko/jenkins/scripts/mirror-database-image.sh) and
  # this moves back to it then. Bump the tag rather than re-pushing one in place: a node
  # that already pulled it keeps the old manifest.
  Image:
    repository: quay.io/yugabyte/yugabyte-itest
    tag: 2026.1.3.0-b57
    # Its own lever: global.imagePullSecrets is resolved by this chart's templates and
    # never reaches a subchart, so the database pod would get nothing from the list
    # above. Must name the same Secret.
    pullSecretName: quay-registry-creds
  # The yugabyte-itest build runs as uid 10001, not root as the meko-yugabytedb mirror
  # did, and a PVC is mounted root-owned unless fsGroup says otherwise: without this
  # the master cannot write /mnt/disk0 ("Permission denied" in its post-start disk
  # check) and crash-loops before the database ever starts. The other keys keep the
  # subchart's defaults (uid/gid and fsGroup 10001, runAsNonRoot).
  podSecurityContext:
    enabled: true
  storage:
    # Use whatever this cluster puts volumes on. See the header: these are the only
    # PVCs in the release, and a customer's class names are not ours to guess. The
    # guard still fails the install if the cluster has no default class at all.
    acceptClusterDefault: true

dataPlaneSecrets:
  enabled: true
  # The well-known password, on purpose. The bundled YugabyteDB runs with YSQL auth
  # off, so this guards nothing — it exists because api_server and meko-mcp-server
  # both insist on reading *a* password, from three Secrets, under two key names.
  # Writing them from one value is what removes the "these must all match" step.
  #
  # To actually authenticate: set a real password here and add
  #   yugabyte:
  #     authCredentials: { ysql: { passwordSecretName: yugabytedb-credentials } }
  # which points the database's own credential job at the same Secret. Do it on a
  # fresh namespace — the PVC outlives the release, and a database keeps the
  # password it was initialised with.
  dbPassword: yugabyte
  # No key, no memory. Left empty because a chart cannot invent one, and because the
  # refs that read it are optional — the stack starts and extraction fails at the
  # point of use, which says so in the logs. See the header for how to supply it.
  openaiApiKey: ""
  # Shared between api_server and meko-mcp-server, and NOT optional at either ref:
  # empty here means the api-server never starts. Hence a default rather than "".
  # It is a real credential — the machine-to-machine validate endpoint — so replace
  # it in your own values file for anything reachable beyond this namespace:
  #   --set dataPlaneSecrets.mcpInternalSecret=$(openssl rand -hex 24)
  mcpInternalSecret: meko-byoc-internal

# Images from Quay, not the Meko ECR. A customer's cluster cannot hold an ECR token: it
# expires every ~12h and refreshing it means AWS keys in their namespace, which is why
# ecrCredentialRefresh stays off below. A Quay robot credential is one static
# docker-registry Secret, and with the database on Quay too (see `yugabyte` above, which
# needs read on a second repository until a release ships) it is the only one this release
# needs.
#
# Set per component rather than through global.imageRegistry, so a caller who passes an
# env preset for its other settings does not have to fight it over the registry. Quay
# repositories are flat, so the ECR-style `meko/<name>` path is replaced rather than
# re-hosted. The components that stay off get theirs further down, so that enabling one
# is a flag rather than a flag plus two image values.
apiServer:
  image:
    registry: quay.io/yugabyte
    repository: meko-api-server
  # New users are created 'pro', skipping tier caps outright — there is no plan
  # to meter a customer against on hardware they pay for themselves.
  #
  # This matches the chart default and is stated anyway: this preset IS the
  # BYOC install, so a later change to that default must not be able to turn it
  # off here silently. Must stay in step with mekoUi.env.enableByoc below.
  enableByoc: true
  # Projects & folders are on for BYOC; datapack share links stay off for now.
  # Must stay in step with mekoUi.env.enableProjects / enableLinkSharing below.
  enableProjects: true
  enableLinkSharing: false
  migrate:
    # The database's own image, for a ysqlsh matching the server — from Quay for the
    # same reason as everything else here. Must be the same image as yugabyte.Image above
    # (kept in step by hand). Besides ensure-extensions, langfuse's metadata-schema-init and
    # tracing-schema-init run it too, so a bump moves their schema import to this ysqlsh.
    extensionsImage: quay.io/yugabyte/yugabyte-itest:2026.1.3.0-b57
    # Create pg_dist_rag / vector (and mage, which the migrations no longer need) before
    # migrating. Without pg_dist_rag the first data migration dies partway on
    # `dist_rag.vector_indexes` and golang-migrate marks the schema dirty; the api-server
    # clears a dirty version 1 and reruns it on the next start, but creating the
    # extensions first avoids the failed attempt.
    ensureExtensions: true
  cognito:
    # No IdP in a BYOC bring-up. api_server then treats every request as its dev
    # account, which is fine for an environment nobody else can reach and NOT fine
    # as a permanent answer.
    #
    # The real answer for a customer cluster is OIDC, not Cognito: a Cognito pool
    # is ours, in our AWS account, which is the opposite of BYOC. Point the stack
    # at the customer's own issuer instead —
    #
    #   apiServer:
    #     oidc:
    #       enabled: true
    #       issuerUrl: https://keycloak.customer.example/realms/meko
    #       clientId: meko
    #       redirectUrl: https://meko.customer.example/api/v1/auth/oidc/callback
    #   dataPlaneSecrets:
    #     oidcClientSecret: <from the issuer>   # omit for a public client
    #
    # — in a values file passed after this one. The issuer owns its users, so no
    # signup or password-reset routes are served; sign-in happens on its pages.
    #
    # Turning an IdP on also makes the api-server authenticate the reconcile-agent,
    # whose MEKO_API_TOKEN is optional precisely because this preset has none. Create
    # reconcileAgent.secrets.existing.mekoApiToken (key meko-api-token) with a meko
    # PAT in the same change, or the agent runs and every call it makes 401s.
    enabled: false
  ingress:
    # Reached by port-forward or whatever the operator puts in front. An Ingress
    # would need a hostname and a certificate this chart has no way to know.
    enabled: false
  config:
    # Emptied on purpose: the chart fills these with the bundled database's Service
    # when yugabyte.enabled, which a values file cannot express (it needs the release
    # namespace). The env presets point them at a shared YugabyteDB; this unsets that.
    DB_HOST: ""
    SYSTEM_DB_HOST: ""
    # One database holding both the data-plane schemas and meko_system. api_server
    # supports the colocated layout, and a fresh YugabyteDB has no meko_system
    # database for the split one to use.
    DB_NAME: yugabyte
    SYSTEM_DB_NAME: yugabyte
    # In-namespace traffic to a database this release owns.
    DB_SSL_MODE: disable
    SYSTEM_DB_SSL_MODE: disable
    # Emptied for the same reason as DB_HOST above: the env preset points these
    # at hosted dev's own langfuse (its ELB) and its own YugabyteDB, and left
    # that way a BYOC api-server provisions orgs/projects and reads traces
    # against the SHARED hosted instance instead of the one bundled here. The
    # ConfigMap fills both with this release's own langfuse-web Service and its
    # own YugabyteDB when yugabyte.enabled and these are empty.
    LANGFUSE_HOST: ""
    LANGFUSE_DB_HOST: ""
    # In-namespace traffic to a database this release owns, same as DB_SSL_MODE.
    LANGFUSE_DB_SSL_MODE: disable

mekoMcpServer:
  image:
    registry: quay.io/yugabyte
    repository: meko-mcp-server
  config:
    # Same fill and same reason as apiServer.config.LANGFUSE_HOST above.
    LANGFUSE_HOST: ""
    # Skip every tier check in the MCP tools: the per-metric quota and the
    # free-tier feature gates on the DB and vector-index tools. Stated here for
    # the same reason as apiServer.enableByoc — this preset is composed LAST,
    # over an env preset that sets it "false", so leaving it to the chart
    # default would let values-dev win and quietly re-enable gating.
    MEKO_ENABLE_BYOC: "true"
    # Emptied for the same reason as the api-server's: the env preset points these
    # at the SHARED dev YugabyteDB, and the chart refills them with this release's
    # own database. Left as the preset had them, the api-server reads the database
    # beside it while the MCP server reads a cluster in another namespace — both
    # green, one of them serving someone else's data.
    DB_HOST: ""
    SYSTEM_DB_HOST: ""
    # Emptied for the same reason, and filled the same way: this is the api-server
    # whose /internal/meko-tokens/validate decides whether a Meko PAT is valid.
    # The env preset points it at the HOSTED api-server, so a BYOC install would
    # reject every token minted by the api-server running beside it — and accept
    # ones minted somewhere else entirely.
    MEKO_BASE_URL: ""
    # One colocated database, matching apiServer.config above: a fresh YugabyteDB has
    # no separate meko_system database to point the system connection at.
    DB_NAME: yugabyte
    SYSTEM_DB_NAME: yugabyte
  staticEnv:
    # No Cognito pool in a BYOC data plane, matching apiServer.cognito.enabled=false
    # above. PAT-only: callers present `mko_tkn_*` tokens this Meko issued. Left on
    # `cognito` the MCP server reads COGNITO_CLIENT_SECRET at startup and exits with
    # a KeyError, so this is not optional dressing — it is what makes the component
    # start without an IdP.
    authProvider: meko_tkn
    # Embed memories with Bedrock Titan v1, not OpenAI: a BYOC data plane should need no
    # OpenAI key for embedding. Same family as the seeded KB/conversation indexes (data
    # migrations 000001/000007). Titan v1 emits a fixed 1536, matching the vector(1536)
    # memory columns (000001/000004); Titan v2 (1024) would not fit. Reuses the MCP
    # server's Bedrock credential (dataPlaneSecrets.mcpAwsAccessKeyId / .mcpAwsSecretAccessKey)
    # and region (staticEnv.awsRegion, default us-east-1) — no new secret.
    embedderProvider: aws_bedrock
    embedderModel: amazon.titan-embed-text-v1
    # Memory EXTRACTION LLM, stated so the BYOC choice is visible here. Still OpenAI,
    # so extraction (conversation_add_message) needs the OpenAI key.
    llmProvider: openai
    llmModel: gpt-4.1-nano-2025-04-14

# Pulled from quay with the same robot as the other meko-* images, which therefore needs read on
# meko-datapack-metrics-consumer before this is enabled (meko/jenkins/README.md). Still off here until a
# release asks for it, so the preset only names the image.
datapackMetricsConsumer:
  image:
    registry: quay.io/yugabyte
    repository: meko-datapack-metrics-consumer

mekoUi:
  image:
    registry: quay.io/yugabyte
    repository: meko-ui
  env:
    # Hides the hosted-only surfaces: pricing, tier names, delete-account, the
    # password tile, Labs, Feedback, sign-out. Pairs with apiServer.enableByoc.
    enableByoc: "true"
    # Pairs with apiServer.enableProjects / apiServer.enableLinkSharing.
    enableProjects: "true"
    enableLinkSharing: "false"
  ingress:
    # This was already set here and was silently ignored: the template gated only on
    # the component being enabled, so a BYOC release created an Ingress claiming
    # whatever host the composed env preset carries — app.mekodev.com under
    # values-dev, which is the compose the install hint prints. The template now
    # reads it.
    enabled: false

# inferenceGateway is ON. What it still needs from the installer: an image tag,
# the two endpoints blanked below, and — for the default bedrock provider —
# dataPlaneSecrets.awsAccessKeyId / .awsSecretAccessKey, which render the
# inference-gateway-aws Secret its Deployment mounts with envFrom. `-f
# values-byoc-full.yaml` after this file switches it to openai instead, and turns on
# the rag workers.
#
# Off here:
#   ragAgent    — enableable with that overlay, or directly: text and conversations
#                 run anywhere (null their nodeSelector if the cluster has no
#                 rag-worker pool); pdf runs CPU-degraded without a GPU pool
#                 (ragAgent.gpu.enabled=false) rather than needing one. Needs
#                 dataPlaneSecrets.ragAwsAccessKeyId / .ragAwsSecretAccessKey for
#                 S3 reads and Bedrock Titan embeddings (the seeded indexes' embedder):
#                 without them every source scan fails and no uploaded file is
#                 processed. mekoMcpServer, which stays on, needs dataPlaneSecrets.
#                 mcpAwsAccessKeyId / .mcpAwsSecretAccessKey for the same embedder,
#                 or KB and conversation search embed nothing.
#   provisioner — deliberately not: it renders ClusterRoles and a CRD, and manages
#                 per-tenant namespaces, which is the opposite of one namespace.
#
# langfuse is ON, bundled the same way as the database: valkey.managed=true adds the
# valkey subchart in-namespace, and migrate.enabled=true runs its schema-init the
# same install (no ClickHouse anywhere — this fork's "tracing" backend is a
# `clickhouse`-named Postgres schema in the SAME YugabyteDB database, not a real
# ClickHouse deployment; see templates/langfuse/deployment.yaml). What it still
# needs from the installer: an image tag for web/worker; an S3 event-upload store —
# your own bucket in langfuse.config.LANGFUSE_S3_EVENT_UPLOAD_BUCKET (set the MEDIA
# and BATCH_EXPORT buckets and all three REGIONs too — they default to the hosted
# bucket in us-east-2, so a bare event override still writes media/export to the
# hosted bucket and breaks a non-us-east-2 event bucket) plus auth: static keys in
# dataPlaneSecrets.langfuseS3AccessKey/SecretKey, or langfuse.s3AuthMode=iam-role
# with a role annotation on langfuse.serviceAccount. The event store is REQUIRED —
# every conversation event is uploaded there before ingestion, so the render fails
# without it (MEKO-832). See deploy/helm/meko/README.md for the exact --set flags.
# Plus the required dataPlaneSecrets.langfuse* crypto fields below, no defaults.
#
# Image coordinates are carried here whether or not a component is on, so enabling
# one is a flag and not a flag plus two image values: meko.image falls back to
# global.imageRegistry, which the cloud preset points at ECR, and a BYOC cluster
# holds no ECR credential. All four publish to Quay
# (meko/jenkins/scripts/build-images-aws.sh).
inferenceGateway:
  enabled: true
  image:
    registry: quay.io/yugabyte
    repository: meko-inference-gateway
  config:
    # Both on for BYOC, matching the dev overlay in meko-devops
    # (kustomize/inference-gateway/overlays/dev).
    MEKO_ENABLE_CONTEXTUAL_PROMINENCE_SEARCH: "true"
    MEKO_AGENTIC_CHAT: "true"
    # Blanked deliberately, NOT inherited, so the ConfigMap fills them. The env
    # preset points CORS at hosted dev (app.mekodev.com), which a customer's
    # cluster should not be told to trust. Filled with:
    #   INFERENCE_MCP_ENDPOINT — this release's meko-mcp-server,
    #     http://meko-mcp-server.<ns>.svc.cluster.local/mcp
    #   INFERENCE_CORS_ORIGINS — https://<mekoUi.ingress.host> when the UI has an
    #     Ingress; otherwise empty, meaning no cross-origin callers. The UI does
    #     not need one: it reaches the gateway same-origin through its nginx.
    # Set either here only to point somewhere else.
    INFERENCE_MCP_ENDPOINT: ""
    INFERENCE_CORS_ORIGINS: ""
ragAgent:
  enabled: false
  text: { image: { registry: quay.io/yugabyte, repository: meko-rag-agent } }
  conversations: { image: { registry: quay.io/yugabyte, repository: meko-rag-agent } }
  pdf: { image: { registry: quay.io/yugabyte, repository: meko-rag-agent } }
langfuse:
  enabled: true
  # The chart default (values.yaml) is an internet-facing LoadBalancer on both
  # cloud presets (aws-load-balancer-scheme: internet-facing / GKE l4-rbs) —
  # exactly what this preset otherwise keeps a BYOC release from getting
  # (mekoUi.ingress.enabled/apiServer.ingress.enabled are both off below, for
  # the same reason). Left on, every BYOC install gets a public endpoint in
  # front of a freshly-seeded owner account and its ADMIN_API_KEY.
  # scripts/deploy-gke.sh already sets this; the preset itself didn't.
  lb:
    enabled: false
  valkey:
    managed: true
  migrate:
    enabled: true
  web: { image: { registry: quay.io/yugabyte, repository: meko-langfuse-web } }
  worker: { image: { registry: quay.io/yugabyte, repository: meko-langfuse-worker } }
  config:
    # Emptied for the same reason as apiServer's LANGFUSE_HOST/LANGFUSE_DB_HOST
    # below: the env preset points this at hosted dev's own langfuse, and the
    # ConfigMap fills it with this release's own langfuse-web Service when empty.
    NEXTAUTH_URL: ""
provisioner:
  enabled: false
  image: { registry: quay.io/yugabyte, repository: meko-provisioner }

# The refresher keeps the ECR pull Secret alive (tokens last ~12h) but needs AWS
# credentials of its own. Off by default here; turn it on with
# ecrCredentialRefresh.awsCredentialsSecret or awsRoleArn set — and, since
# global.imageRegistry is reset to "" above, also ecrCredentialRefresh.ecrServer
# (its own default falls back to global.imageRegistry, which is empty here).
ecrCredentialRefresh:
  enabled: false
