# ============================================================================
# BYOC opt-in — the components values-byoc.yaml leaves off, for the ones that can
# actually run in one namespace.
#
# Pass it AFTER values-byoc.yaml, which is what lets it win:
#   helm upgrade --install meko charts/meko -n <ns> \
#     -f charts/meko/values-gcp.yaml -f charts/meko/values-dev.yaml \
#     -f charts/meko/values-byoc.yaml -f charts/meko/values-byoc-full.yaml \
#     --set dataPlaneSecrets.openaiApiKey=sk-... \
#     --set-string dataPlaneSecrets.ragAwsAccessKeyId=... \
#     --set-string dataPlaneSecrets.ragAwsSecretAccessKey=... \
#     --set-string dataPlaneSecrets.mcpAwsAccessKeyId=... \
#     --set-string dataPlaneSecrets.mcpAwsSecretAccessKey=... \
#     --set-string apiServer.image.tag=$TAG ...
#
# Image coordinates are NOT here — values-byoc.yaml carries them for these
# components whether or not they are on, so enabling one is a flag and not a flag
# plus two image values. Their tags are per-release, like the rest of the stack's.
#
# Requires an OpenAI key, for the gateway's chat model and memory extraction. The gateway
# selects the openai provider rather than bedrock for its LLM. Without a key the gateway's
# render fails outright (it exits at construction, so a running-but-broken pod would be
# worse).
#
# The rag workers also need an AWS pair, whatever the gateway uses: they read uploaded
# files from the knowledge-base bucket and embed them with Bedrock Titan, the embedder
# the knowledge_bases and conversation_history_search indexes are seeded with (data
# migrations 000001 and 000007), as on hosted dev/prod. Without it every source scan
# fails with "Unable to locate credentials" and nothing a user uploads is processed.
# The principal needs s3:GetObject and s3:ListBucket on the knowledge-base bucket and
# bedrock:InvokeModel on amazon.titan-embed-text-v1, with Bedrock model access enabled in
# the workers' ragAgent.config.AWS_REGION.
#
# The MCP server needs its own AWS pair for the same reason: it embeds KB and conversation
# search queries with the index's provider. That one needs only bedrock:InvokeModel on the
# same model (region: mekoMcpServer.staticEnv.awsRegion, default us-east-1). Without it
# both searches embed nothing and answer empty.
#
# Still off, and not a matter of flipping a flag:
#   langfuse    — v3 wants ClickHouse, its own Valkey release (valkey.managed: false)
#                 and object storage. Nothing here stands those up.
#   provisioner — renders ClusterRoles and a CRD, and manages per-tenant namespaces.
#                 Cluster-scoped objects break the one thing this preset promises:
#                 a namespace an operator can grant, inspect and delete as a unit.
# ============================================================================

inferenceGateway:
  enabled: true
  config:
    # llm.py branches on this; "openai" reads OPENAI_API_KEY from the environment,
    # which dataPlaneSecrets puts in the Secret this component consumes as envFrom.
    INFERENCE_LLM_PROVIDER: openai
    # config.py's DEFAULT_OPENAI_MODEL. Named rather than left to the default so the
    # env preset's bedrock model id cannot leak through into an openai client.
    INFERENCE_LLM_MODEL: gpt-4o-mini
    # Emptied for the same reason, and empty is meaningful: build_summary_llm falls
    # back to the main model. The base default is a Bedrock mistral id, which an
    # openai client would send to OpenAI verbatim and fail on.
    INFERENCE_CONV_SUMMARY_MODEL: ""
    # The MCP server beside it. A bare Service name resolves because singleNamespace
    # puts both in the release namespace — which is also why this can be a values
    # file at all, where an FQDN would need the namespace a values file cannot see.
    INFERENCE_MCP_ENDPOINT: http://meko-mcp-server/mcp
    # No browser origin to allow: nothing is exposed outside the namespace by this
    # preset. Set it if you put an ingress in front.
    INFERENCE_CORS_ORIGINS: ""

ragAgent:
  enabled: true
  # PDF runs CPU-degraded (slower per document) without a GPU pool, rather than
  # being unschedulable — see ragAgent.pdf.resourcesCpuOnly in values.yaml. Turn
  # this on where there is a GPU pool for pdf to request nvidia.com/gpu instead.
  gpu:
    enabled: false
  text:
    # null, not {}: Helm MERGES maps, so an empty one leaves the base and env preset
    # selectors (node_type=rag-worker, and on GKE a rag-worker nodepool) in place and
    # the worker sits Pending on a cluster that has neither.
    nodeSelector: null
  # Same reason as text — this worker has no BYOC-side nodeSelector gate of its
  # own either, unlike pdf's gpu.enabled above.
  conversations:
    nodeSelector: null
  openai:
    # A fresh install seeds Bedrock Titan indexes, which embed with the AWS pair and not
    # this key. An install that predates that keeps the OPENAI knowledge_bases row it was
    # seeded with (data/000001 never reruns), and that row embeds with this key: leave
    # it set there, or all KB ingestion stops. The ref is optional, so no key fails at
    # the point of use.
    enabled: true
  config:
    # Langfuse is off in this preset, so there is nowhere to trace to. The env
    # presets point these at a shared Langfuse ELB that a customer cluster cannot
    # reach; empty is the honest value. The keys stay present because the workers
    # read them by configMapKeyRef, which a missing key would block startup on.
    TXT_LANGFUSE_HOST: ""
    PDF_LANGFUSE_HOST: ""
