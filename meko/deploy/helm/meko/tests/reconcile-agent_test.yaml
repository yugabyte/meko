# The reconcile-agent is the environment's only YCP client. What this pins:
#
#   1. ENV_KIND is meko, which is what selects the backend at all — the default is
#      amp, so an unset one drives the wrong API.
#   2. MEKO_API_URL defaults to the api-server this release deploys, by FQDN, so the
#      agent works from a namespace other than the api-server's.
#   3. get/patch on its state Secret are pinned by resourceNames; create cannot be.
#
#   helm unittest charts/meko
suite: reconcile-agent
templates:
  - templates/reconcile-agent/deployment.yaml
  - templates/reconcile-agent/rbac.yaml
tests:
  - it: requires a control-plane URL
    template: templates/reconcile-agent/deployment.yaml
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.image.tag: t
    asserts:
      - failedTemplate:
          errorMessage: "reconcileAgent.ycpUrl is required when reconcileAgent.enabled=true"

  - it: selects the meko backend and takes an optional token from a Secret
    template: templates/reconcile-agent/deployment.yaml
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.envName: acme
      reconcileAgent.image.tag: custom-abc
    asserts:
      # Optional: a BYOC api-server runs without Cognito and has no token to give,
      # and a required key the Secret does not hold blocks the pod from starting.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: meko-reconcile-agent-token
                key: meko-api-token
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENV_KIND
            value: meko

  - it: defaults the api-server URL to the one this release deploys
    template: templates/reconcile-agent/deployment.yaml
    release:
      namespace: meko-dp
    set:
      global.imageRegistry: reg.example.com
      global.singleNamespace: true
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_URL
            value: "http://meko-api-server-service.meko-dp.svc.cluster.local.:80/api/v1"

  # basePath prefixes the whole api-server, /api/v1 included, so the auto-derived
  # URL has to carry it or the agent dials a path this release does not serve.
  - it: carries the api-server base path into the derived URL
    template: templates/reconcile-agent/deployment.yaml
    release:
      namespace: meko-dp
    set:
      global.imageRegistry: reg.example.com
      global.singleNamespace: true
      apiServer.basePath: /ycp
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_URL
            value: "http://meko-api-server-service.meko-dp.svc.cluster.local.:80/ycp/api/v1"

  - it: honours an explicit api-server URL
    template: templates/reconcile-agent/deployment.yaml
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.mekoApiUrl: https://meko.example/ycp/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_URL
            value: "https://meko.example/ycp/api/v1"

  # A namespaced Role, not the meko-agent's ClusterRole: this agent touches k8s to
  # persist the environment id its check-in confirmed and to read workload status.
  - it: grants its own state Secret and read-only workload status, nothing wider
    template: templates/reconcile-agent/rbac.yaml
    documentIndex: 1
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - isKind:
          of: Role
      # get/patch are pinned to the one Secret. create cannot be — Kubernetes
      # matches resourceNames against an existing object — so it stays
      # namespace-wide and is deliberately split into its own rule.
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["reconcile-agent-state"]
              verbs: ["get", "patch"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create"]
            # list only, and only the two workload kinds a BYOC release runs. Pods are
            # absent because nothing reads them — readyReplicas and the image come off
            # the workload object, whose pod template this grant already exposes.
            - apiGroups: ["apps"]
              resources: ["deployments", "statefulsets"]
              verbs: ["list"]

  - it: renders nothing when disabled
    asserts:
      - hasDocuments:
          count: 0
