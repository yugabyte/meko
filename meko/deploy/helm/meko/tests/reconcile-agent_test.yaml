# The reconcile-agent is the meko-agent's alternative, not its companion: both
# authenticate with one api-key identity and both POST /agent/status, so a release
# running the pair has two writers racing on one environment. What this pins:
#
#   1. Enabling both fails the install, rather than producing that race.
#   2. MEKO_AGENT_ID is always set, and set to the same id the agent stamps. The
#      agent defaults it and List matches on equality, so an unset one converges
#      nothing rather than everything — but a value that drifts from what a
#      previous release stamped orphans every datapack it already created.
#   3. MEKO_API_URL defaults to the api-server this release deploys, by FQDN, so the
#      agent works from a namespace other than the api-server's.
#
#   helm unittest charts/meko
suite: reconcile-agent
templates:
  - templates/reconcile-agent/deployment.yaml
  - templates/reconcile-agent/rbac.yaml
tests:
  - it: refuses to render when both agents are enabled
    template: templates/reconcile-agent/deployment.yaml
    set:
      global.imageRegistry: reg.example.com
      agent.enabled: true
      agent.ycpUrl: https://ycp.example
      agent.image.tag: t
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - failedTemplate:
          errorMessage: "agent and reconcileAgent are both enabled: an environment has exactly one YCP client. Enable the meko-agent (it reconciles the stack into k8s) or the reconcile-agent (it converges datapacks over the api-server), not both."

  - it: requires a control-plane URL
    template: templates/reconcile-agent/deployment.yaml
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.image.tag: t
    asserts:
      - failedTemplate:
          errorMessage: "reconcileAgent.ycpUrl is required when reconcileAgent.enabled=true"

  - it: stamps an agent id and takes an optional token from a Secret
    template: templates/reconcile-agent/deployment.yaml
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.envName: acme
      reconcileAgent.image.tag: custom-abc
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_AGENT_ID
            value: ycp-reconcile-agent
      # Optional: a BYOC api-server runs without Cognito and has no token to give,
      # and a required key the Secret does not hold blocks the pod from starting.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: meko-reconcile-agent-token
                key: meko-api-token
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENV_KIND
            value: meko

  - it: defaults the api-server URL to the one this release deploys
    template: templates/reconcile-agent/deployment.yaml
    release:
      namespace: meko-dp
    set:
      global.imageRegistry: reg.example.com
      global.singleNamespace: true
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_URL
            value: "http://meko-api-server-service.meko-dp.svc.cluster.local:80/api/v1"

  # basePath prefixes the whole api-server, /api/v1 included, so the auto-derived
  # URL has to carry it or the agent dials a path this release does not serve.
  - it: carries the api-server base path into the derived URL
    template: templates/reconcile-agent/deployment.yaml
    release:
      namespace: meko-dp
    set:
      global.imageRegistry: reg.example.com
      global.singleNamespace: true
      apiServer.basePath: /ycp
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_URL
            value: "http://meko-api-server-service.meko-dp.svc.cluster.local:80/ycp/api/v1"

  - it: honours an explicit api-server URL
    template: templates/reconcile-agent/deployment.yaml
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.mekoApiUrl: https://meko.example/ycp/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEKO_API_URL
            value: "https://meko.example/ycp/api/v1"

  # A namespaced Role, not the meko-agent's ClusterRole: this agent touches k8s
  # only to persist the environment id its check-in confirmed.
  - it: grants read/write on its own state Secret only
    template: templates/reconcile-agent/rbac.yaml
    documentIndex: 1
    set:
      global.imageRegistry: reg.example.com
      reconcileAgent.enabled: true
      reconcileAgent.ycpUrl: https://ycp.example/api/v1
      reconcileAgent.image.tag: t
    asserts:
      - isKind:
          of: Role
      # get/patch are pinned to the one Secret. create cannot be — Kubernetes
      # matches resourceNames against an existing object — so it stays
      # namespace-wide and is deliberately split into its own rule.
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["reconcile-agent-state"]
              verbs: ["get", "patch"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create"]

  - it: renders nothing when disabled
    asserts:
      - hasDocuments:
          count: 0
