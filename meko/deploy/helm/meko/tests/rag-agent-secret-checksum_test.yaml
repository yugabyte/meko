# rag-agent-secret is read through secretKeyRef env, which the kubelet resolves once
# at container start. The worker pod templates carry a hash of the rendered Secret so
# a change rolls them; without it a changed Secret restarts nothing and running
# workers keep the old values. The hash is only added when the chart manages the AWS
# pair, so an install that patches the Secret by hand renders exactly as before.
#
# Kept apart from rag-agent_test.yaml: loading dataplane-secrets.yaml there changes
# how that suite's template-wide assertions are evaluated.
#
#   helm unittest charts/meko
suite: rag-agent secret checksum
templates:
  - templates/rag-agent/configmap.yaml
  - templates/rag-agent/deployment-text.yaml
  - templates/rag-agent/deployment-conversations.yaml
  - templates/rag-agent/deployment-pdf.yaml
  # The checksum renders this and hashes the rag document out of it.
  - templates/dataplane-secrets.yaml
set:
  global.imageRegistry: docker.io/library
  ragAgent.enabled: true
  ragAgent.text.image.tag: t
  ragAgent.conversations.image.tag: t
  ragAgent.pdf.image.tag: t
tests:
  - it: rolls the text worker on rag-agent-secret changes once the chart manages the AWS pair
    template: templates/rag-agent/deployment-text.yaml
    set:
      yugabyte.enabled: true
      dataPlaneSecrets.enabled: true
      dataPlaneSecrets.ragAwsAccessKeyId: AK
      dataPlaneSecrets.ragAwsSecretAccessKey: SK
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/rag-secret"]
          pattern: ^[0-9a-f]{64}$

  - it: rolls the pdf worker on rag-agent-secret changes once the chart manages the AWS pair
    template: templates/rag-agent/deployment-pdf.yaml
    set:
      yugabyte.enabled: true
      dataPlaneSecrets.enabled: true
      dataPlaneSecrets.ragAwsAccessKeyId: AK
      dataPlaneSecrets.ragAwsSecretAccessKey: SK
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/rag-secret"]
          pattern: ^[0-9a-f]{64}$

  - it: rolls the conversations worker on rag-agent-secret changes once the chart manages the AWS pair
    template: templates/rag-agent/deployment-conversations.yaml
    set:
      yugabyte.enabled: true
      dataPlaneSecrets.enabled: true
      dataPlaneSecrets.ragAwsAccessKeyId: AK
      dataPlaneSecrets.ragAwsSecretAccessKey: SK
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/rag-secret"]
          pattern: ^[0-9a-f]{64}$

  - it: adds no annotation when the pair is not chart-managed, so a hand-patched install renders as before
    template: templates/rag-agent/deployment-text.yaml
    set:
      yugabyte.enabled: true
      dataPlaneSecrets.enabled: true
    asserts:
      - isNull:
          path: spec.template.metadata.annotations["checksum/rag-secret"]
