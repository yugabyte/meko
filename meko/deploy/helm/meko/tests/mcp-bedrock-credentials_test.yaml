# The MCP server embeds KB and conversation search queries with whatever provider the
# index's dist_rag.vector_indexes row names. A fresh install seeds both rows as Bedrock
# Titan, so the pod needs an AWS credential and, optionally, a region. The chart renders
# them only when the pair is set, so an install that supplies its own through extraEnv
# (the mekoqa stack) is untouched and never gets the same env name twice.
#
#   helm unittest charts/meko
suite: mcp-server bedrock credentials
templates:
  - templates/meko-mcp-server/deployment.yaml
  - templates/meko-mcp-server/configmap.yaml
  - templates/dataplane-secrets.yaml
values:
  - ../values-gcp.yaml
  - ../values-dev.yaml
  - ../values-byoc.yaml
set:
  mekoMcpServer.image.tag: t
  apiServer.image.tag: t
  # values-byoc turns langfuse on, which needs these to render at all.
  langfuse.s3AuthMode: iam-role
  langfuse.config.LANGFUSE_S3_EVENT_UPLOAD_BUCKET: b
  langfuse.serviceAccount.annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/langfuse
  dataPlaneSecrets.langfuseNextauthSecret: t
  dataPlaneSecrets.langfuseSalt: t
  dataPlaneSecrets.langfuseEncryptionKey: t
  dataPlaneSecrets.langfuseAdminApiKey: t
  dataPlaneSecrets.langfuseInitUserEmail: t@example.com
  dataPlaneSecrets.langfuseInitUserPassword: t
  dataPlaneSecrets.langfuseInitProjectSecretKey: t
tests:
  - it: renders the credential Secret under the hosted-dev name when both halves are set
    template: templates/dataplane-secrets.yaml
    documentSelector:
      path: metadata.name
      value: mcp-server-bedrock-credentials
    set:
      dataPlaneSecrets.mcpAwsAccessKeyId: MAK
      dataPlaneSecrets.mcpAwsSecretAccessKey: MSK
    asserts:
      - equal:
          path: stringData.AWS_ACCESS_KEY_ID
          value: MAK
      - equal:
          path: stringData.AWS_SECRET_ACCESS_KEY
          value: MSK

  - it: refuses half of the pair
    template: templates/dataplane-secrets.yaml
    set:
      dataPlaneSecrets.mcpAwsAccessKeyId: MAK
    asserts:
      - failedTemplate:
          errorMessage: "dataPlaneSecrets.mcpAwsAccessKeyId and mcpAwsSecretAccessKey must be set together: half a credential fails at the first query embedding, not at deploy."

  - it: references that Secret from the container and rolls the pod on it when the pair is set
    template: templates/meko-mcp-server/deployment.yaml
    set:
      dataPlaneSecrets.mcpAwsAccessKeyId: MAK
      dataPlaneSecrets.mcpAwsSecretAccessKey: MSK
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: mcp-server-bedrock-credentials
                key: AWS_ACCESS_KEY_ID
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/mcp-aws"]
          pattern: ^[0-9a-f]{64}$

  - it: adds no AWS env and no annotation when the pair is unset, so extraEnv can supply its own
    template: templates/meko-mcp-server/deployment.yaml
    set:
      mekoMcpServer.extraEnv:
        - name: AWS_ACCESS_KEY_ID
          value: dummy
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: mcp-server-bedrock-credentials
                key: AWS_ACCESS_KEY_ID
      - isNull:
          path: spec.template.metadata.annotations["checksum/mcp-aws"]

  - it: sets AWS_REGION only when asked
    template: templates/meko-mcp-server/deployment.yaml
    set:
      mekoMcpServer.staticEnv.awsRegion: us-west-2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-west-2
