# The bundled BYOC database image is set twice: yugabyte.Image (the server, in
# values-byoc-bundled-db.yaml) and apiServer.migrate.extensionsImage (the ysqlsh
# that api-server's bootstrap-databases and ensure-extensions and langfuse's two
# schema-init containers run, in values-byoc.yaml). They must be the same build —
# a ysqlsh older than its server — and nothing but this suite ties them together.
#
# Every consumer is pinned to the SAME literal below, so bumping one setting and
# not the other fails here. When you bump the image, change it in both files and
# in every `value:` below.
#
#   helm unittest charts/meko
suite: byoc database image
templates:
  # service.yaml hashes these three siblings into its pod annotations, and
  # helm-unittest only loads the templates listed here.
  - charts/yugabyte/templates/service.yaml
  - charts/yugabyte/templates/controller-gflags-secret.yaml
  - charts/yugabyte/templates/master-gflags-secret.yaml
  - charts/yugabyte/templates/tserver-gflags-secret.yaml
  # The Deployments hash these into their pod annotations, same reason.
  - templates/api-server/deployment.yaml
  - templates/api-server/configmap.yaml
  - templates/langfuse/deployment.yaml
  - templates/langfuse/configmap.yaml
  - templates/langfuse/schema-configmap.yaml
values:
  - ../values-gcp.yaml
  - ../values-dev.yaml
  - ../values-byoc.yaml
  - ../values-byoc-bundled-db.yaml
set:
  apiServer.image.tag: t
  mekoUi.image.tag: t
  mekoMcpServer.image.tag: t
  inferenceGateway.image.tag: t
  langfuse.web.image.tag: t
  langfuse.worker.image.tag: t
  langfuse.config.LANGFUSE_S3_EVENT_UPLOAD_BUCKET: b
  dataPlaneSecrets.langfuseS3AccessKey: t
  dataPlaneSecrets.langfuseS3SecretKey: t
  dataPlaneSecrets.langfuseNextauthSecret: t
  dataPlaneSecrets.langfuseSalt: t
  dataPlaneSecrets.langfuseEncryptionKey: t
  dataPlaneSecrets.langfuseAdminApiKey: t
  dataPlaneSecrets.langfuseInitUserEmail: t@example.com
  dataPlaneSecrets.langfuseInitUserPassword: t
  dataPlaneSecrets.langfuseInitProjectSecretKey: t
tests:
  - it: runs the database servers on the pinned image
    template: charts/yugabyte/templates/service.yaml
    documentSelector:
      path: metadata.name
      value: yb-tserver
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/yugabyte/yugabyte-itest:2026.1.3.0-b57

  - it: runs api-server's bootstrap-databases and ensure-extensions on the same image
    template: templates/api-server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="bootstrap-databases")].image
          value: quay.io/yugabyte/yugabyte-itest:2026.1.3.0-b57
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="ensure-extensions")].image
          value: quay.io/yugabyte/yugabyte-itest:2026.1.3.0-b57

  - it: runs langfuse's schema-init containers on the same image
    template: templates/langfuse/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="metadata-schema-init")].image
          value: quay.io/yugabyte/yugabyte-itest:2026.1.3.0-b57
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="tracing-schema-init")].image
          value: quay.io/yugabyte/yugabyte-itest:2026.1.3.0-b57
