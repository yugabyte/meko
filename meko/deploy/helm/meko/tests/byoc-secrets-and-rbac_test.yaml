# Three renders a BYOC install depends on, each of which fails silently if it
# regresses:
#
#   1. MEKO_BASE_URL is the api-server meko-mcp-server validates PATs against.
#      Inherited from the env preset it points at the HOSTED api-server, so
#      tokens minted beside it are rejected and hosted ones accepted — with
#      every pod green. values-byoc empties it and the ConfigMap fills it.
#   2. The two Secrets dataPlaneSecrets can now render. Both are mounted in ways
#      that do NOT degrade: absent, the pods fail to start or the feature dies at
#      the point of use, so "rendered only when set" has to stay exact.
#   3. The tenants-namespace Role is skipped for a single-namespace install,
#      which cannot create it — but only when the provisioner is off, because
#      the provisioner is what renders the CRD the Role grants against.
#
#   helm unittest charts/meko
suite: byoc secrets, base url and rbac
templates:
  - templates/meko-mcp-server/configmap.yaml
  - templates/api-server/configmap.yaml
  - templates/api-server/deployment.yaml
  - templates/dataplane-secrets.yaml
  - templates/api-server/rbac.yaml
  - templates/langfuse/service-lb.yaml
tests:
  - it: fills MEKO_BASE_URL with this release's own api-server
    template: templates/meko-mcp-server/configmap.yaml
    release:
      namespace: acme
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
      - ../values-byoc.yaml
    set:
      mekoMcpServer.image.tag: t
      # values-byoc.yaml enables langfuse.migrate, which fails the render
      # without these — unrelated to what this case actually asserts.
      dataPlaneSecrets.langfuseNextauthSecret: t
      dataPlaneSecrets.langfuseSalt: t
      dataPlaneSecrets.langfuseEncryptionKey: t
      dataPlaneSecrets.langfuseAdminApiKey: t
      dataPlaneSecrets.langfuseInitUserEmail: t@example.com
      dataPlaneSecrets.langfuseInitUserPassword: t
      dataPlaneSecrets.langfuseInitProjectSecretKey: t
    asserts:
      - equal:
          path: data.MEKO_BASE_URL
          value: http://meko-api-server-service.acme.svc.cluster.local.:80/api/v1

  - it: leaves a hosted MEKO_BASE_URL alone
    template: templates/meko-mcp-server/configmap.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
    set:
      mekoMcpServer.image.tag: t
    asserts:
      - equal:
          path: data.MEKO_BASE_URL
          value: https://mekodev.com/api/v1

  - it: renders no S3 or Bedrock Secret when the values are unset
    template: templates/dataplane-secrets.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
      - ../values-byoc.yaml
    set:
      apiServer.image.tag: t
      inferenceGateway.image.tag: t
      dataPlaneSecrets.langfuseNextauthSecret: t
      dataPlaneSecrets.langfuseSalt: t
      dataPlaneSecrets.langfuseEncryptionKey: t
      dataPlaneSecrets.langfuseAdminApiKey: t
      dataPlaneSecrets.langfuseInitUserEmail: t@example.com
      dataPlaneSecrets.langfuseInitUserPassword: t
      dataPlaneSecrets.langfuseInitProjectSecretKey: t
    asserts:
      - notMatchRegex:
          path: metadata.name
          pattern: ^meko-api-server-s3$
      - notMatchRegex:
          path: metadata.name
          pattern: ^inference-gateway-aws$

  - it: skips the tenants Role in a single-namespace install
    template: templates/api-server/rbac.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
      - ../values-byoc.yaml
    set:
      apiServer.image.tag: t
      dataPlaneSecrets.langfuseNextauthSecret: t
      dataPlaneSecrets.langfuseSalt: t
      dataPlaneSecrets.langfuseEncryptionKey: t
      dataPlaneSecrets.langfuseAdminApiKey: t
      dataPlaneSecrets.langfuseInitUserEmail: t@example.com
      dataPlaneSecrets.langfuseInitUserPassword: t
      dataPlaneSecrets.langfuseInitProjectSecretKey: t
    asserts:
      - notMatchRegex:
          path: kind
          pattern: ^Role$

  - it: still renders the Role when the provisioner is on, even single-namespace
    template: templates/api-server/rbac.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
    set:
      apiServer.image.tag: t
      global.singleNamespace: true
      provisioner.enabled: true
    asserts:
      - matchRegex:
          path: kind
          pattern: ^(ServiceAccount|Role|RoleBinding)$

  - it: fills the api-server's LANGFUSE_HOST/LANGFUSE_DB_HOST with this release's own langfuse and database
    template: templates/api-server/configmap.yaml
    release:
      namespace: acme
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
      - ../values-byoc.yaml
    set:
      apiServer.image.tag: t
      dataPlaneSecrets.langfuseNextauthSecret: t
      dataPlaneSecrets.langfuseSalt: t
      dataPlaneSecrets.langfuseEncryptionKey: t
      dataPlaneSecrets.langfuseAdminApiKey: t
      dataPlaneSecrets.langfuseInitUserEmail: t@example.com
      dataPlaneSecrets.langfuseInitUserPassword: t
      dataPlaneSecrets.langfuseInitProjectSecretKey: t
    asserts:
      - equal:
          path: data.LANGFUSE_HOST
          value: http://langfuse-web.acme.svc.cluster.local.:3000
      - equal:
          path: data.LANGFUSE_DB_HOST
          value: yb-tservers.acme.svc.cluster.local.

  - it: fills the mcp-server's LANGFUSE_HOST the same way
    template: templates/meko-mcp-server/configmap.yaml
    release:
      namespace: acme
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
      - ../values-byoc.yaml
    set:
      mekoMcpServer.image.tag: t
      dataPlaneSecrets.langfuseNextauthSecret: t
      dataPlaneSecrets.langfuseSalt: t
      dataPlaneSecrets.langfuseEncryptionKey: t
      dataPlaneSecrets.langfuseAdminApiKey: t
      dataPlaneSecrets.langfuseInitUserEmail: t@example.com
      dataPlaneSecrets.langfuseInitUserPassword: t
      dataPlaneSecrets.langfuseInitProjectSecretKey: t
    asserts:
      - equal:
          path: data.LANGFUSE_HOST
          value: http://langfuse-web.acme.svc.cluster.local.:3000

  - it: leaves a hosted LANGFUSE_HOST alone when langfuse is not bundled here
    template: templates/api-server/configmap.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
    set:
      apiServer.image.tag: t
    asserts:
      - matchRegex:
          path: data.LANGFUSE_HOST
          pattern: "^http://k8s-mekolang-langfuse-"

  - it: points the api-server at its OWN bundled langfuse admin key, not the shared static default
    template: templates/api-server/deployment.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
      - ../values-byoc.yaml
    set:
      apiServer.image.tag: t
      dataPlaneSecrets.langfuseNextauthSecret: t
      dataPlaneSecrets.langfuseSalt: t
      dataPlaneSecrets.langfuseEncryptionKey: t
      dataPlaneSecrets.langfuseAdminApiKey: t
      dataPlaneSecrets.langfuseInitUserEmail: t@example.com
      dataPlaneSecrets.langfuseInitUserPassword: t
      dataPlaneSecrets.langfuseInitProjectSecretKey: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--langfuse-admin-api-key=$(LANGFUSE_ADMIN_API_KEY)"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_ADMIN_API_KEY
            valueFrom:
              secretKeyRef:
                name: langfuse-secrets
                key: ADMIN_API_KEY

  - it: keeps the static langfuse admin key when langfuse isn't bundled here
    template: templates/api-server/deployment.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
    set:
      apiServer.image.tag: t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--langfuse-admin-api-key=meko-local-admin-key"

  - it: renders no internet-facing LoadBalancer for langfuse in the BYOC preset
    template: templates/langfuse/service-lb.yaml
    values:
      - ../values-gcp.yaml
      - ../values-dev.yaml
      - ../values-byoc.yaml
    set:
      apiServer.image.tag: t
      dataPlaneSecrets.langfuseNextauthSecret: t
      dataPlaneSecrets.langfuseSalt: t
      dataPlaneSecrets.langfuseEncryptionKey: t
      dataPlaneSecrets.langfuseAdminApiKey: t
      dataPlaneSecrets.langfuseInitUserEmail: t@example.com
      dataPlaneSecrets.langfuseInitUserPassword: t
      dataPlaneSecrets.langfuseInitProjectSecretKey: t
    asserts:
      - hasDocuments:
          template: templates/langfuse/service-lb.yaml
          count: 0
