{{- if and (eq (include "meko.componentEnabled" (dict "root" $ "comp" "provisioner")) "true") .Values.provisioner.mcpProxy.enabled }}
{{- $m := .Values.provisioner.mcpProxy }}
apiVersion: v1
kind: Service
metadata:
  name: mcp-proxy
  namespace: {{ include "meko.ns" (dict "root" $ "ns" $m.namespace) }}
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/part-of: meko
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
{{- end }}
