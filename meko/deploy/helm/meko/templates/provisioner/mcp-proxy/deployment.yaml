{{- if and (eq (include "meko.componentEnabled" (dict "root" $ "comp" "provisioner")) "true") .Values.provisioner.mcpProxy.enabled }}
{{- $m := .Values.provisioner.mcpProxy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-proxy
  namespace: {{ include "meko.ns" (dict "root" $ "ns" $m.namespace) }}
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/part-of: meko
spec:
  replicas: {{ $m.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-proxy
        app.kubernetes.io/part-of: meko
      annotations:
        {{- include "meko.configChecksum" (dict "root" $ "files" (list "provisioner/mcp-proxy/configmap.yaml")) | nindent 8 }}
    spec:
      {{- include "meko.imagePullSecrets" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: {{ $m.image }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
        resources:
          {{- toYaml $m.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: {{ $m.ingress.healthcheckPath }}
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: {{ $m.ingress.healthcheckPath }}
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: mcp-proxy-config
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
{{- end }}
