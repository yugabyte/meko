{{- if .Values.controlPlaneSecrets.enabled }}
{{- $s := .Values.controlPlaneSecrets }}
{{- $names := .Values.apiServer.secrets.existing }}
{{- $ns := include "meko.ns" (dict "root" $ "ns" .Values.apiServer.namespace) }}
{{/*
The ycp-mode Secrets, rendered from values so a control-plane install needs no
out-of-band `kubectl create secret` step. Opt-in — see controlPlaneSecrets in
values.yaml for what enabling it costs.

Names and keys are NOT invented here: they come from apiServer.secrets.existing
and controlPlaneDb.auth, the same values the Deployment's secretKeyRefs read. So
renaming a Secret moves both the reference and the rendered object together, and
this file cannot drift from what the pods look for.

Each entry renders only when its value is non-empty. An empty string means "I am
providing this one myself", not "create it blank": a blank credential would give
an api-server that starts and then rejects everything, which is exactly the
failure this file exists to remove.
*/}}
{{- if ne (include "meko.mode" .) "ycp" }}
{{- /*
  Refuse rather than quietly render. In mcp mode these same Secret names hold the
  credentials for the SHARED data-plane YugabyteDB — a database this release does
  not own — so rendering them would overwrite a live password with whatever was
  passed here, and the failure would land on every other release pointed at that
  database, not on this one.
*/}}
{{- fail (printf "controlPlaneSecrets.enabled is only supported in ycp mode (mode=%s). In mcp mode %s / %s hold the shared data-plane database's credentials, which this release must not overwrite — create data-plane Secrets out-of-band." (include "meko.mode" .) $names.db $names.systemDb) }}
{{- end }}
{{- if $s.dbPassword }}
{{- /*
  Three Secrets, one password. api_server opens a data-plane and a system
  connection and reads a password for each, and the bundled Postgres takes the
  same value as POSTGRES_PASSWORD. They are separate Secrets pointing at one
  database, and the by-hand version of this is where the runbook's "the three DB
  passwords must be the same value" warning comes from.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $names.db }}
  namespace: {{ $ns }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ $s.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $names.systemDb }}
  namespace: {{ $ns }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ $s.dbPassword | quote }}
{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "controlPlaneDb")) "true") }}
{{- /*
  Only with the bundled Postgres. Pointing at an external database means its
  password is not ours to set, so rendering this Secret would be claiming
  ownership of a credential the chart does not control.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.controlPlaneDb.auth.existingSecret }}
  namespace: {{ .Values.controlPlaneDb.namespace | default $ns }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.controlPlaneDb.auth.passwordKey }}: {{ $s.dbPassword | quote }}
{{- end }}
{{- end }}
{{- if $s.adminApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $names.adminApiKey }}
  namespace: {{ $ns }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-api-key: {{ $s.adminApiKey | quote }}
{{- end }}
{{- if $s.mcpInternalSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $names.mcpInternal }}
  namespace: {{ $ns }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ $s.mcpInternalSecret | quote }}
{{- end }}
{{- end }}
