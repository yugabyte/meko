{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "inferenceGateway")) "true") }}
{{- $c := .Values.inferenceGateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: {{ include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/part-of: meko
spec:
  replicas: {{ $c.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
      app.kubernetes.io/part-of: meko
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
        app.kubernetes.io/part-of: meko
      annotations:
        {{- include "meko.configChecksum" (dict "root" $ "files" (list "inference-gateway/configmap.yaml")) | nindent 8 }}
    spec:
      {{- include "meko.imagePullSecrets" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "meko.image" (dict "image" $c.image "global" $.Values.global) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          envFrom:
            - configMapRef:
                name: inference-gateway-config
            - secretRef:
                name: {{ $c.secrets.existing.aws }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
{{- end }}
