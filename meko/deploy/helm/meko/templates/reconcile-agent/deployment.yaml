{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "reconcileAgent")) "true") }}
{{- $c := .Values.reconcileAgent }}
{{- $ns := include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
{{- $metricsPort := dig "metricsPort" 9464 $c }}
{{- $otel := .Values.otel | default dict }}
{{- $collecting := eq (include "meko.otel.collectorRendered" .) "true" }}
{{- if not $c.ycpUrl }}{{ fail "reconcileAgent.ycpUrl is required when reconcileAgent.enabled=true" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-reconcile-agent
  namespace: {{ $ns }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-reconcile-agent") | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "meko.selectorLabels" (dict "app" "meko-reconcile-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meko.selectorLabels" (dict "app" "meko-reconcile-agent") | nindent 8 }}
    spec:
      {{- include "meko.imagePullSecrets" . }}
      serviceAccountName: meko-reconcile-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-agent
          image: {{ include "meko.image" (dict "image" $c.image "global" $.Values.global) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: ENV_KIND
              value: meko
            - name: YCP_URL
              value: {{ $c.ycpUrl | quote }}
            - name: MEKO_API_URL
              value: {{ include "meko.reconcileAgentApiUrl" . | quote }}
            - name: ENV_NAME
              value: {{ $c.envName | default .Release.Namespace | quote }}
            - name: ENV_PLACEMENT
              value: {{ $c.placement | quote }}
            - name: AGENT_VERSION
              value: {{ $c.image.tag | quote }}
            - name: AGENT_METRICS_PORT
              value: {{ $metricsPort | quote }}
            {{- /* What this release's collector ships, for the control plane to check
                   against the door it issued (ycp/cmd/reconcile-agent/preflight.go).
                   OTEL_ENABLED is whether a collector actually renders — otel on, a
                   data-plane release, the operator's CRDs present — not the raw
                   value: otel on with no collector ships nothing, and has to read as
                   off so the environment is DEGRADED. */}}
            - name: OTEL_ENABLED
              value: {{ $collecting | quote }}
            - name: OTEL_BYOC_ENABLED
              value: {{ dig "byoc" "enabled" false $otel | quote }}
            - name: BYOC_METRICS_ENDPOINT
              value: {{ dig "byoc" "metricsEndpoint" "" $otel | quote }}
            - name: OTEL_LOGS_SINK
              value: {{ if and $collecting (dig "byoc" "enabled" false $otel) (dig "collectors" "logs" "enabled" true $otel) }}"datadog"{{ else }}""{{ end }}
            {{- if $collecting }}
            {{- /* The collector's own counters, so the agent reports whether metrics
                   are still LEAVING, not only where they are configured to go. */}}
            - name: OTEL_COLLECTOR_METRICS_URL
              value: "http://meko-metrics-collector-monitoring.{{ .Release.Namespace }}.svc.cluster.local:8888/metrics"
            {{- end }}
            {{- with $c.reconcileInterval }}
            - name: RECONCILE_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            - name: YCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secrets.existing.apiKey }}
                  key: api-key
                  # Optional so the same Secret can instead carry the dev-mode
                  # pair below; the agent enforces that one of the two is set.
                  optional: true
            - name: YCP_DEV_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secrets.existing.apiKey }}
                  key: dev-admin-secret
                  optional: true
            - name: YCP_DEV_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secrets.existing.apiKey }}
                  key: dev-api-key-id
                  optional: true
            # Optional, because an api-server with no identity provider
            # authenticates nobody — there is no token to give. With EITHER
            # provider on (cognito or oidc) it is required and the Secret below
            # must exist: it is a meko PAT, which this server issues and validates
            # whichever IdP is on, and it names the account whose inventory this
            # agent converges. Without it every call the agent makes 401s.
            - name: MEKO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secrets.existing.mekoApiToken }}
                  key: meko-api-token
                  optional: true
          {{- if gt (int $metricsPort) 0 }}
          ports:
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
      restartPolicy: Always
{{- end }}
