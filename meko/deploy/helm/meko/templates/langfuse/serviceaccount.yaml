{{- $c := .Values.langfuse }}
{{- /* Chart-managed (migrate.enabled / BYOC) langfuse only. Hosted dev/prod manage
       langfuse out of band and keep whatever SA they already run on, so this never
       changes them. Note this renders on migrate.enabled alone, whereas the S3
       guard in dataplane-secrets.yaml also requires dataPlaneSecrets.enabled. */}}
{{- if and (eq (include "meko.componentEnabled" (dict "root" $ "comp" "langfuse")) "true") $c.migrate.enabled }}
{{- /* The langfuse pods run as this SA. It exists whatever the auth mode, so the
       Deployment can always name it; under s3AuthMode=iam-role (EKS IRSA) the
       operator's eks.amazonaws.com/role-arn annotation rides here and the EKS
       pod-identity webhook injects the AWS credentials that reach the S3 event
       store. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.serviceAccount.name | default "meko-langfuse" }}
  namespace: {{ include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-langfuse") | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
