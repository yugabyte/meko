{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "mekoMcpServer")) "true") }}
{{- $c := .Values.mekoMcpServer }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: meko-mcp-server-config
  namespace: {{ include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-mcp-server") | nindent 4 }}
data:
  {{- /* Same fill as the api-server's ConfigMap. Without it, a BYOC install whose
         api-server correctly found its own YugabyteDB had an MCP server still
         dialling the SHARED dev database from the env preset — a stack that looks
         healthy and reads the wrong data. */}}
  {{- $ybHost := include "meko.dbHost" $ }}
  {{- /* MEKO_BASE_URL is the api-server this MCP server validates Meko PATs
         against — mcp_auth/pat_verifier.py POSTs /internal/meko-tokens/validate
         to it. Same failure as the DB hosts above and worse: left at the env
         preset's value a BYOC install authenticates its tokens against the
         SHARED hosted api-server, so a PAT minted here is rejected and one
         minted there is accepted. Fill it with this release's own api-server
         when the values leave it empty. basePath is honoured because the
         api-server mounts every route under it when set. */}}
  {{- $apiBase := "" }}
  {{- if eq (include "meko.componentEnabled" (dict "root" $ "comp" "apiServer")) "true" }}
  {{- $apiNs := include "meko.ns" (dict "root" $ "ns" $.Values.apiServer.namespace) }}
  {{- /* Absolute (trailing dot): ndots:5 sends the relative form down the search list first.
         basePath is trimmed of a trailing slash so it cannot yield //api/v1. */}}
  {{- $apiBase = printf "http://meko-api-server-service.%s.svc.cluster.local.:%v%s/api/v1" $apiNs $.Values.apiServer.service.port (trimSuffix "/" $.Values.apiServer.basePath) }}
  {{- end }}
  {{- /* Same fill as the api-server's LANGFUSE_HOST (templates/api-server/configmap.yaml):
         left at the env preset's hosted-dev value, this MCP server's own langfuse
         calls go to the SHARED hosted instance instead of the one bundled here. */}}
  {{- $lfHost := "" }}
  {{- if eq (include "meko.componentEnabled" (dict "root" $ "comp" "langfuse")) "true" }}
  {{- $lfNs := include "meko.ns" (dict "root" $ "ns" $.Values.langfuse.namespace) }}
  {{- $lfHost = printf "http://langfuse-web.%s.svc.cluster.local.:3000" $lfNs }}
  {{- end }}
  {{- /* mem0's connection (HOST/DBNAME in the container) is the data database in
         every preset, so an empty MEM0_HOST/MEM0_DB_NAME follows DB_HOST/DB_NAME.
         Left at the env preset's values, a BYOC MCP server stores memories in the
         shared hosted database. */}}
  {{- $dataHost := $c.config.DB_HOST | default $ybHost }}
  {{- range $k, $v := $c.config }}
  {{- $val := $v }}
  {{- if and $ybHost (or (eq $k "DB_HOST") (eq $k "SYSTEM_DB_HOST")) (not $v) }}
  {{- $val = $ybHost }}
  {{- end }}
  {{- if and (eq $k "MEM0_HOST") (not $v) }}
  {{- $val = $dataHost }}
  {{- end }}
  {{- if and (eq $k "MEM0_DB_NAME") (not $v) }}
  {{- $val = $c.config.DB_NAME }}
  {{- end }}
  {{- if and $apiBase (eq $k "MEKO_BASE_URL") (not $v) }}
  {{- $val = $apiBase }}
  {{- end }}
  {{- if and $lfHost (eq $k "LANGFUSE_HOST") (not $v) }}
  {{- $val = $lfHost }}
  {{- end }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
{{- end }}
