{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "mekoUi")) "true") }}
{{- $c := .Values.mekoUi }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-ui
  namespace: {{ include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-ui") | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "meko.selectorLabels" (dict "app" "meko-ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meko.selectorLabels" (dict "app" "meko-ui") | nindent 8 }}
      annotations:
        {{- include "meko.configChecksum" (dict "root" $ "files" (list "meko-ui/nginx-configmap.yaml")) | nindent 8 }}
    spec:
      {{- include "meko.imagePullSecrets" . }}
      containers:
        - name: meko-ui
          image: {{ include "meko.image" (dict "image" $c.image "global" $.Values.global) }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: VITE_RUDDERSTACK_DATA_PLANE_URL
              value: {{ $c.env.rudderstackDataPlaneUrl | quote }}
            - name: VITE_RUDDERSTACK_WRITE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secrets.existing.ui }}
                  key: RUDDERSTACK_WRITE_KEY
                  # Product analytics. Its absence should cost telemetry, not the UI.
                  optional: true
            - name: MEKO_FREE_TIER_QUOTA_ENABLED
              value: {{ $c.env.freeTierQuotaEnabled | quote }}
            - name: MEKO_ENABLE_BYOC
              value: {{ $c.env.enableByoc | quote }}
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
            {{- toYaml $c.resources | nindent 12 }}

        - name: meko-proxy
          image: {{ $c.proxyImage }}
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            # nginx writes its pid to /run/nginx.pid (the stock nginx.conf
            # default); with readOnlyRootFilesystem that path needs a writable
            # volume. Provide one rather than overriding the main-context `pid`
            # directive (which the http-included conf.d/default.conf cannot set).
            - name: run
              mountPath: /run
          readinessProbe:
            httpGet:
              path: {{ $c.ingress.healthcheckPath }}
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $c.ingress.healthcheckPath }}
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml $c.proxyResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: nginx-config
          configMap:
            name: meko-ui-nginx-config
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
{{- end }}
