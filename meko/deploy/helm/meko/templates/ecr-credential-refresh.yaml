{{- if .Values.ecrCredentialRefresh.enabled }}
{{- $r := .Values.ecrCredentialRefresh }}
{{- $region := default .Values.global.region $r.region }}
{{- $server := default .Values.global.imageRegistry $r.ecrServer }}
{{- $nss := $r.namespaces | default .Values.namespaces }}
{{- $refresherNS := $r.namespace }}
{{- /* An agent release lives in ONE namespace, so the refresher stays inside it.

       .Values.namespaces is the data plane's list (meko-system, meko-mcp,
       meko-rag-workers, meko-langfuse, meko-ingress, meko-tenants) and
       ecrCredentialRefresh.namespace defaults to meko-system — none of which a
       customer cluster running only the agent has. Inheriting them made an
       agent-only install fail with six `namespaces "meko-…" not found` errors
       before it created anything, on a cluster where the agent itself was
       perfectly installable. `mode: agent` already suppresses seven components;
       it has to scope this too, or the release is not really one namespace. */}}
{{- if or (eq (include "meko.mode" .) "agent") .Values.global.singleNamespace }}
{{- $refresherNS = .Release.Namespace }}
{{- $nss = list .Release.Namespace }}
{{- end }}
{{- if not $server }}{{ fail "ecrCredentialRefresh: ecrServer (or global.imageRegistry) must be set" }}{{ end }}
# Periodically re-mints the ECR dockerconfigjson pull Secret ({{ $r.secretName }})
# in each namespace, because ECR auth tokens expire ~12h. Uses AWS creds from the
# referenced Secret {{ $r.awsCredentialsSecret }} (reference-only; created out-of-band).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $r.serviceAccountName }}
  namespace: {{ $refresherNS }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
    app.kubernetes.io/name: ecr-token-refresher
---
{{- /* Namespace-scoped Role/RoleBinding per target namespace (least privilege —
       no cluster-wide secrets access). The SA lives in $r.namespace; each
       RoleBinding grants it secret write in one target namespace. */}}
{{- range $ns := $nss }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-ecr-token-refresher
  namespace: {{ $ns }}
  labels:
    {{- include "meko.labels" $ | nindent 4 }}
    app.kubernetes.io/name: ecr-token-refresher
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-ecr-token-refresher
  namespace: {{ $ns }}
  labels:
    {{- include "meko.labels" $ | nindent 4 }}
    app.kubernetes.io/name: ecr-token-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-ecr-token-refresher
subjects:
- kind: ServiceAccount
  name: {{ $r.serviceAccountName }}
  namespace: {{ $refresherNS }}
---
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresher
  namespace: {{ $refresherNS }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
    app.kubernetes.io/name: ecr-token-refresher
spec:
  schedule: {{ $r.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ecr-token-refresher
        spec:
          serviceAccountName: {{ $r.serviceAccountName }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: refresher
            image: {{ $r.image }}
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -euo pipefail
              echo "Fetching ECR token for ${ECR_SERVER}..."
              PW="$(aws ecr get-login-password --region "${AWS_REGION}")"
              for ns in ${TARGET_NAMESPACES}; do
                echo "Refreshing ${SECRET_NAME} in ${ns}"
                kubectl create secret docker-registry "${SECRET_NAME}" \
                  --namespace "${ns}" \
                  --docker-server="${ECR_SERVER}" \
                  --docker-username=AWS \
                  --docker-password="${PW}" \
                  --dry-run=client -o yaml | kubectl apply -f -
              done
              echo "Done."
            env:
            - name: AWS_REGION
              value: {{ $region | quote }}
            - name: ECR_SERVER
              value: {{ $server | quote }}
            - name: SECRET_NAME
              value: {{ $r.secretName | quote }}
            - name: TARGET_NAMESPACES
              value: {{ join " " $nss | quote }}
            # aws-cli + kubectl need a writable HOME/tmp under readOnlyRootFilesystem.
            - name: HOME
              value: /tmp
            {{- if $r.awsRoleArn }}
            # GKE Workload Identity: assume an AWS role via a projected SA token
            # instead of a static key (see README).
            - name: AWS_ROLE_ARN
              value: {{ $r.awsRoleArn | quote }}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/aws-token/token
            {{- end }}
            {{- if and $r.awsCredentialsSecret (not $r.awsRoleArn) }}
            envFrom:
            - secretRef:
                name: {{ $r.awsCredentialsSecret }}
            {{- end }}
            resources:
              {{- toYaml $r.resources | nindent 14 }}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $r.awsRoleArn }}
            - name: aws-token
              mountPath: /var/run/secrets/aws-token
              readOnly: true
            {{- end }}
          volumes:
          - name: tmp
            emptyDir: {}
          {{- if $r.awsRoleArn }}
          - name: aws-token
            projected:
              sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
          {{- end }}
{{- end }}
