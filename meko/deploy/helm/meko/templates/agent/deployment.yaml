{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "agent")) "true") }}
{{- $c := .Values.agent }}
{{- $ns := include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
{{- if not $c.ycpUrl }}{{ fail "agent.ycpUrl is required when agent.enabled=true" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-agent
  namespace: {{ $ns }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-agent") | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "meko.selectorLabels" (dict "app" "meko-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meko.selectorLabels" (dict "app" "meko-agent") | nindent 8 }}
    spec:
      {{- include "meko.imagePullSecrets" . }}
      serviceAccountName: meko-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meko-agent
          image: {{ include "meko.image" (dict "image" $c.image "global" $.Values.global) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          # All config is passed by env; the agent reaches YCP and the k8s API
          # over outbound connections only (the SA token is projected by k8s).
          env:
            - name: YCP_URL
              value: {{ $c.ycpUrl | quote }}
            - name: ENV_NAME
              value: {{ $c.envName | default .Release.Namespace | quote }}
            - name: ENV_PLACEMENT
              value: {{ $c.placement | quote }}
            {{- with $c.provider }}
            - name: ENV_PROVIDER
              value: {{ . | quote }}
            {{- end }}
            {{- with $c.region }}
            - name: ENV_REGION
              value: {{ . | quote }}
            {{- end }}
            - name: ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secrets.existing.enrollment }}
                  key: enrollment-token
            - name: AGENT_VERSION
              value: {{ $c.agentVersion | quote }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
      restartPolicy: Always
{{- end }}
