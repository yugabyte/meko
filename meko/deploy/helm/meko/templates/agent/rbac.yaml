{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "agent")) "true") }}
{{- $c := .Values.agent }}
{{- $ns := include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
{{- /* Cluster-scoped names are release-scoped, namespaced ones are not.

       A ClusterRole has no namespace to be unique within, so a fixed `meko-agent`
       means one agent per CLUSTER: a second release fails with "invalid ownership
       metadata", and — worse — a DELETED release leaves the ClusterRole behind
       (deleting a namespace never removes cluster-scoped objects), so it keeps
       blocking installs that have nothing to do with it. Observed on itest-mcs.
       Keyed by NAMESPACE rather than release name: the agent is one per namespace
       (its ServiceAccount and Deployment collide otherwise), so the namespace is
       the honest uniqueness key — and `meko-agent-ycp-agent` reads better than the
       `meko-agent-meko-agent` a release name produces here.

       The ServiceAccount below stays `meko-agent`: it is namespaced, the agent's
       Deployment refers to it by that name, and it is one-per-namespace already. */}}
{{- $clusterName := printf "meko-agent-%s" $ns }}
# The agent reads cluster facts (nodes) and lists namespaces (as datapacks), creates
# labeled namespaces + per-datapack workloads, and reconciles the Meko data-plane
# stack (database / mcp-server / rag-worker) into its own namespace — whatever the
# control plane has declared as that environment's desired state.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meko-agent
  namespace: {{ $ns }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-agent") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-agent") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  # per-datapack service workloads the agent provisions into datapack namespaces, the
  # ConfigMaps and Secrets the stack components need, and its own meko-agent-state
  # Secret. `update` is what lets it replace the persisted status token in place:
  # without it the only option is delete-then-create, which leaves a window with no
  # stored credential where a restart loses it.
  #
  # `patch` is server-side apply, which is how the stack reconcilers converge. Without
  # it a declared component is created once and then never updated again: a changed
  # image in desired state is accepted, reported as applied, and never rolls out.
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # statefulsets: a `database` resource the agent runs itself, rather than an external
  # one the operator points it at.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-agent") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: meko-agent
    namespace: {{ $ns }}
{{- end }}
