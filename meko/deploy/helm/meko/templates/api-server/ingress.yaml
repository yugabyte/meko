{{- if and .Values.apiServer.enabled .Values.apiServer.ingress.enabled }}
{{- $c := .Values.apiServer }}
{{- include "meko.managedCertificate" (dict "root" $ "name" $c.ingress.gke.managedCert "namespace" (include "meko.ns" (dict "root" $ "ns" $c.namespace)) "host" $c.ingress.host) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meko-api-server-ingress
  namespace: {{ include "meko.ns" (dict "root" $ "ns" $c.namespace) }}
  labels:
    {{- include "meko.componentLabels" (dict "app" "meko-api-server") | nindent 4 }}
  annotations:
    {{- include "meko.ingressAnnotations" (dict "root" $ "healthcheckPath" $c.ingress.healthcheckPath "gke" $c.ingress.gke) | nindent 4 }}
spec:
  {{- include "meko.ingressClassField" (dict "root" $) | nindent 2 }}
  {{- include "meko.ingressTLS" (dict "root" $ "host" $c.ingress.host "secretName" "meko-api-server-tls") | nindent 2 }}
  rules:
    - host: {{ $c.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meko-api-server-service
                port:
                  number: {{ $c.service.port }}
{{- end }}
