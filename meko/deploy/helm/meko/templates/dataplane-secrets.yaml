{{- if .Values.dataPlaneSecrets.enabled }}
{{- $s := .Values.dataPlaneSecrets }}
{{- $api := .Values.apiServer.secrets.existing }}
{{- $mcp := .Values.mekoMcpServer.secrets.existing }}
{{- $inf := .Values.inferenceGateway.secrets.existing }}
{{- $apiNs := include "meko.ns" (dict "root" $ "ns" .Values.apiServer.namespace) }}
{{- $mcpNs := include "meko.ns" (dict "root" $ "ns" .Values.mekoMcpServer.namespace) }}
{{- $infNs := include "meko.ns" (dict "root" $ "ns" .Values.inferenceGateway.namespace) }}
{{/*
The data-plane Secrets, rendered from values so a BYOC install needs no
out-of-band `kubectl create secret` step. Opt-in — see dataPlaneSecrets in
values.yaml for what enabling it costs.

Names and keys come from each component's own secrets.existing, the same values the
Deployments' secretKeyRefs read, so a rename moves the reference and the rendered
object together. Every block is gated on its component being enabled, so turning one
on is what brings its Secret with it.

Each entry renders only when its value is non-empty: an empty string means "I am
providing this one myself", not "create it blank".
*/}}
{{- if eq (include "meko.mode" .) "ycp" }}
{{- fail (printf "dataPlaneSecrets.enabled is for data-plane installs, not mode=%s — a control plane has no meko-mcp-server and its DB Secrets are controlPlaneSecrets' job." (include "meko.mode" .)) }}
{{- end }}
{{- if $s.dbPassword }}
{{- /*
  One password, three Secrets, two key spellings. api_server opens a data-plane
  and a system connection and reads `db-password` for each; meko-mcp-server reads
  `password` and `system_password` from a third. They all point at ONE database —
  which, when yugabyte.enabled, this release installs, so `ysqlPassword` goes in
  alongside for the subchart's credential job to read (see values.yaml).
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $api.db }}
  namespace: {{ $apiNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ $s.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $api.systemDb }}
  namespace: {{ $apiNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ $s.dbPassword | quote }}
{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "mekoMcpServer")) "true") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mcp.yugabytedb }}
  namespace: {{ $mcpNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $s.dbPassword | quote }}
  system_password: {{ $s.dbPassword | quote }}
  # For yugabyte.authCredentials.ysql.passwordSecretName, whose job looks for
  # exactly this key. Present whether or not YSQL auth is on, so turning it on is
  # one value away and cannot introduce a mismatch.
  ysqlPassword: {{ $s.dbPassword | quote }}
{{- end }}
{{- end }}
{{- if $s.openaiApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $api.llm }}
  namespace: {{ $apiNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ $s.openaiApiKey | quote }}
{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "mekoMcpServer")) "true") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mcp.openai }}
  namespace: {{ $mcpNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $s.openaiApiKey | quote }}
{{- end }}
{{- end }}
{{- if and $s.s3AccessKey $s.s3SecretKey }}
{{- /*
  Knowledge-base object storage. ONE Secret, TWO keys, FOUR env vars: the
  api-server's Deployment reads s3-access-key/s3-secret-key into S3_ACCESS_KEY
  and S3_SECRET_KEY for its own --s3-* flags, and into AWS_ACCESS_KEY_ID and
  AWS_SECRET_ACCESS_KEY for the AWS SDK's default chain. Supplying the pair
  here therefore configures all four.

  Only meaningful under --s3-auth-mode=iam-user or minio (static credentials).
  Under iam-role the SDK resolves IRSA / the instance profile instead, and
  setting these would shadow it — so leave them empty there.

  All four env refs are optional:true, so a missing Secret leaves the pod
  Running with S3 unconfigured: KB upload fails later at the presign, not at
  boot. That is the failure this block exists to avoid.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $api.s3 }}
  namespace: {{ $apiNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3-access-key: {{ $s.s3AccessKey | quote }}
  s3-secret-key: {{ $s.s3SecretKey | quote }}
{{- end }}
{{- if $s.mcpInternalSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $api.mcpInternal }}
  namespace: {{ $apiNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ $s.mcpInternalSecret | quote }}
{{- if and (eq (include "meko.componentEnabled" (dict "root" $ "comp" "mekoMcpServer")) "true") (ne $mcpNs $apiNs) }}
{{- /*
  Separate namespaces need a copy: a Secret is not visible across one, and
  meko-mcp-server reads the same key under the same name in its own.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mcp.mcpInternal }}
  namespace: {{ $mcpNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ $s.mcpInternalSecret | quote }}
{{- end }}
{{- end }}
{{- if and $s.oidcClientSecret .Values.apiServer.oidc.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $api.oidc }}
  namespace: {{ $apiNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  oidc-client-secret: {{ $s.oidcClientSecret | quote }}
{{- end }}
{{- $infProvider := lower (default "bedrock" .Values.inferenceGateway.config.INFERENCE_LLM_PROVIDER) }}
{{- $infBedrock := and (eq $infProvider "bedrock") $s.awsAccessKeyId $s.awsSecretAccessKey }}
{{- $infOpenAI := and (eq $infProvider "openai") $s.openaiApiKey }}
{{- if and (eq (include "meko.componentEnabled" (dict "root" $ "comp" "inferenceGateway")) "true") (or $infBedrock $infOpenAI) }}
{{- /*
  The gateway's credential Secret, consumed whole as envFrom — so its KEYS are the
  env var names the process reads, not a spelling of our own.

  Which key is rendered follows INFERENCE_LLM_PROVIDER, and ONLY that, because the
  absence of this Secret is load-bearing: the Deployment does a bare
  `envFrom.secretRef` with no `optional: true`, so a bedrock gateway with no AWS
  credential is meant to sit in CreateContainerConfigError, which is what NOTES.txt
  and the install hint promise an operator. Rendering it because some OTHER
  provider's key happened to be set would produce a pod that goes Ready, passes
  `helm --wait`, and fails every Bedrock call at runtime instead.

  The AWS pair needs both halves: half a credential fails at the first Bedrock call,
  not at deploy. An openai gateway with no key never gets here at all — the
  Deployment fails the render, because the process exits at construction.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $inf.aws }}
  namespace: {{ $infNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- if $infBedrock }}
  AWS_ACCESS_KEY_ID: {{ $s.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $s.awsSecretAccessKey | quote }}
{{- else }}
  OPENAI_API_KEY: {{ $s.openaiApiKey | quote }}
{{- end }}
{{- end }}
{{- if (eq (include "meko.componentEnabled" (dict "root" $ "comp" "ragAgent")) "true") }}
{{- /*
  The rag workers' Secret. YUGABYTEDB_CONNECTION_STRING is not optional at the ref
  and cannot be written in a values file — like the api-server's DB_HOST it needs
  the release namespace — so the chart builds it from the bundled database when it
  is the thing that deployed one. An external database means supplying
  ragAgent.dbConnectionString here instead.
*/}}
{{- $ragNs := include "meko.ns" (dict "root" $ "ns" .Values.ragAgent.namespace) }}
{{- $dsn := .Values.ragAgent.dbConnectionString }}
{{- if and (not $dsn) $.Values.yugabyte.enabled }}
{{- $user := .Values.apiServer.config.DB_USER_NAME | default "yugabyte" }}
{{- $db := .Values.apiServer.config.DB_NAME | default "yugabyte" }}
{{- $port := .Values.apiServer.config.DB_PORT | default "5433" }}
{{- /* urlquery on the password: it is a DSN, and an unescaped @ / : or % in one
       truncates the host or the port rather than failing loudly. */}}
{{- $dsn = printf "postgresql://%s:%s@yb-tservers.%s.svc.cluster.local.:%s/%s" $user (urlquery $s.dbPassword) $.Release.Namespace $port $db }}
{{- end }}
{{- if not $dsn }}
{{- fail "ragAgent.enabled with no database to point it at: set ragAgent.dbConnectionString, or enable the bundled database (yugabyte.enabled)." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ragAgent.secrets.existing.rag }}
  namespace: {{ $ragNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  YUGABYTEDB_CONNECTION_STRING: {{ $dsn | quote }}
{{- if $s.openaiApiKey }}
  OPENAI_API_KEY: {{ $s.openaiApiKey | quote }}
{{- end }}
{{- end }}
{{- if and (eq (include "meko.componentEnabled" (dict "root" $ "comp" "langfuse")) "true") .Values.langfuse.migrate.enabled }}
{{- /*
  langfuse-secrets, chart-rendered only when this release also bootstraps the
  schema (langfuse.migrate.enabled) — hosted dev/prod still create it out of
  band via Jenkins, same as before this existed.

  DATABASE_URL/TRACING_DATABASE_URL follow the DSN-construction pattern of
  ragAgent's above and point at the bundled YugabyteDB. Without it they point at
  apiServer.config.LANGFUSE_DB_HOST (else DB_HOST), with DB_USER_NAME and DB_PORT.

  Six of the seven langfuse* fields below are real cryptographic material
  (NextAuth, the field-level encryption key, the seeded org owner's password)
  — unlike dbPassword, which the bundled database's auth-off config makes
  meaningless. The seventh, langfuseInitUserEmail, is not a secret but is
  required for the same reason: no default lets the seeded owner account
  exist without a way to log into it. `fail` rather than rendering an empty
  string for the crypto fields: the alternative is exactly the password
  (password123) a HackerOne report already used for an RCE via this chart's
  kustomize equivalent.
*/}}
{{- $lfExtHost := .Values.apiServer.config.LANGFUSE_DB_HOST | default .Values.apiServer.config.DB_HOST | default "" }}
{{- if and (not $.Values.yugabyte.enabled) (not $lfExtHost) }}
{{- fail "langfuse.migrate.enabled needs a database: enable the bundled one (yugabyte.enabled) or name an external one in apiServer.config.LANGFUSE_DB_HOST (or DB_HOST)." }}
{{- end }}
{{- if not $.Values.apiServer.enabled }}
{{- fail "langfuse.migrate.enabled requires apiServer.enabled — the schema-init containers read the bundled database's host/credentials from apiServer's ConfigMap/Secret." }}
{{- end }}
{{- if not $.Values.global.singleNamespace }}
{{- fail "langfuse.migrate.enabled outside global.singleNamespace: the schema-init containers reference apiServer's ConfigMap/Secret by name only, which resolves in the langfuse pod's OWN namespace and requires both components to share one." }}
{{- end }}
{{- range $field := (list "langfuseNextauthSecret" "langfuseSalt" "langfuseEncryptionKey" "langfuseAdminApiKey" "langfuseInitUserEmail" "langfuseInitUserPassword" "langfuseInitProjectSecretKey") }}
{{- if not (index $s $field) }}
{{- $example := "$(openssl rand -hex 16)" }}
{{- if eq $field "langfuseEncryptionKey" }}
{{- /* Upstream langfuse requires exactly 64 hex chars (256 bits) and rejects
       the env at startup otherwise — confirmed against meko-langfuse's own
       packages/shared/src/env.ts, which names this exact command. */}}
{{- $example = "$(openssl rand -hex 32)" }}
{{- else if eq $field "langfuseInitUserEmail" }}
{{- $example = "owner@your-domain" }}
{{- end }}
{{- fail (printf "langfuse.migrate.enabled with dataPlaneSecrets.%s unset — supply it at install time, e.g. --set dataPlaneSecrets.%s=%s." $field $field $example) }}
{{- end }}
{{- end }}
{{- /*
  The S3 event-upload bucket is langfuse's ingestion buffer, not optional: every
  conversation event is uploaded there first, then a worker reads it back into the
  tracing store (MEKO-832). With no store, langfuse-web drops every trace and
  conversations vanish silently (accepted on write, never found on read). Require
  a real bucket and an auth path here, the same as the crypto fields above. Only
  chart-managed langfuse reaches this — it sits under dataPlaneSecrets.enabled (top
  of file) and migrate.enabled, so hosted dev/prod, which wire S3 out of band,
  never render this block.
*/}}
{{- $lfBucket := .Values.langfuse.config.LANGFUSE_S3_EVENT_UPLOAD_BUCKET | default "" }}
{{- if or (eq $lfBucket "") (eq $lfBucket "langfuse-meko-bucket") }}
{{- fail "langfuse.migrate.enabled: set langfuse.config.LANGFUSE_S3_EVENT_UPLOAD_BUCKET to your own S3 bucket. Langfuse uploads every conversation event there before ingesting it, so without a real bucket conversations are dropped silently; the default 'langfuse-meko-bucket' is the hosted bucket, not yours." }}
{{- end }}
{{- $lfS3Mode := .Values.langfuse.s3AuthMode | default "iam-user" }}
{{- if not (has $lfS3Mode (list "iam-user" "iam-role")) }}
{{- fail (printf "langfuse.s3AuthMode must be iam-user or iam-role, got %q." $lfS3Mode) }}
{{- end }}
{{- if and (eq $lfS3Mode "iam-user") (not (and $s.langfuseS3AccessKey $s.langfuseS3SecretKey)) }}
{{- fail "langfuse.migrate.enabled with langfuse.s3AuthMode=iam-user needs dataPlaneSecrets.langfuseS3AccessKey and langfuseS3SecretKey for the S3 event store — or, on EKS, set langfuse.s3AuthMode=iam-role to authenticate through EKS IRSA (eks.amazonaws.com/role-arn) instead." }}
{{- end }}
{{- if and (eq $lfS3Mode "iam-role") (not (index (.Values.langfuse.serviceAccount.annotations | default dict) "eks.amazonaws.com/role-arn")) }}
{{- fail "langfuse.s3AuthMode=iam-role is EKS IRSA: set langfuse.serviceAccount.annotations.\"eks.amazonaws.com/role-arn\" to the role ARN that can reach the S3 event bucket — the EKS pod-identity webhook then injects the AWS credentials. On GKE, or on AWS without IRSA, use iam-user with static keys instead: a GKE Workload Identity annotation gives a Google identity the AWS SDK cannot use for S3, so iam-role would render green and still drop every conversation." }}
{{- end }}
{{- $lfNs := include "meko.ns" (dict "root" $ "ns" .Values.langfuse.namespace) }}
{{- $lfUser := .Values.apiServer.config.DB_USER_NAME | default "yugabyte" }}
{{- $lfPort := .Values.apiServer.config.DB_PORT | default "5433" }}
{{- $lfHost := printf "yb-tservers.%s.svc.cluster.local." $.Release.Namespace }}
{{- if not $.Values.yugabyte.enabled }}
{{- $lfHost = $lfExtHost }}
{{- end }}
{{- $lfDatabaseUrl := printf "postgresql://%s:%s@%s:%s/langfuse" $lfUser (urlquery $s.dbPassword) $lfHost $lfPort }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.langfuse.secrets.existing.langfuse }}
  namespace: {{ $lfNs }}
  labels:
    {{- include "meko.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $lfDatabaseUrl | quote }}
  TRACING_DATABASE_URL: {{ printf "%s?schema=clickhouse" $lfDatabaseUrl | quote }}
  # Empty is only correct for the bundled Valkey, which runs with auth off
  # (values.yaml's valkey.auth.enabled). An external, authenticated Valkey
  # (langfuse.valkey.managed: false) needs its own password supplied instead.
  {{- if .Values.langfuse.valkey.managed }}
  REDIS_AUTH: ""
  {{- else }}
  REDIS_AUTH: {{ $s.langfuseRedisAuth | quote }}
  {{- end }}
  NEXTAUTH_SECRET: {{ $s.langfuseNextauthSecret | quote }}
  SALT: {{ $s.langfuseSalt | quote }}
  ENCRYPTION_KEY: {{ $s.langfuseEncryptionKey | quote }}
  ADMIN_API_KEY: {{ $s.langfuseAdminApiKey | quote }}
  LANGFUSE_INIT_USER_EMAIL: {{ $s.langfuseInitUserEmail | quote }}
  LANGFUSE_INIT_USER_PASSWORD: {{ $s.langfuseInitUserPassword | quote }}
  LANGFUSE_INIT_PROJECT_SECRET_KEY: {{ $s.langfuseInitProjectSecretKey | quote }}
{{- if and $s.langfuseS3AccessKey $s.langfuseS3SecretKey }}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: {{ $s.langfuseS3AccessKey | quote }}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: {{ $s.langfuseS3SecretKey | quote }}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: {{ $s.langfuseS3AccessKey | quote }}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: {{ $s.langfuseS3SecretKey | quote }}
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: {{ $s.langfuseS3AccessKey | quote }}
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: {{ $s.langfuseS3SecretKey | quote }}
{{- end }}
{{- end }}
{{- end }}
