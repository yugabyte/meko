openapi: 3.1.0
info:
  title: Yugabyte Control Plane (YCP) API
  version: 0.1.0-draft
  description: |
    Control-plane API for the Meko BYOC architecture. YCP runs inside the YBM Aeon VPC,
    owns the fleet registry and desired state, and federates identity + entitlements from
    YBM Aeon. It holds **no customer data and no customer cloud credentials**.

    Three auth surfaces (see `securitySchemes`):
      * **Human / console** — OIDC relying party of YBM Aeon (`aeonOIDC`).
      * **Agent** — `meko-agent` in the customer cluster, authenticating every call
        with a YBM-minted API key (`agentAPIKey`); YBM's pass-through validates it and
        forwards the key id, which alone resolves the environment. Outbound-only; YCP
        never dials into the customer cloud.
      * **Internal** — MCP server → api_server, shared secret header (`internalSecret`).

    This is a design stub: shapes are illustrative and not yet frozen.
  contact: { name: Meko Platform }

servers:
  - url: https://ycp.mekodata.ai
    description: Cloud YCP (inside the YBM Aeon VPC)
  - url: https://ycp.{customer}.internal
    description: On-prem YCP (alongside self-managed Aeon)
    variables:
      customer: { default: acme }

tags:
  - name: environments
    description: Fleet of customer data-plane environments (console / OIDC).
  - name: datapacks
    description: Datapack metadata + placement (console / OIDC). Data itself lives in the customer cloud.
  - name: entitlements
    description: Read-only plan/caps, sourced upstream from YBM Aeon.
  - name: agent
    description: Pull-agent surface (YBM API key). Enroll, reconcile desired state, report status.
  - name: internal
    description: MCP server → api_server calls (shared secret).

paths:
  # ------------------------------------------------------------------ environments
  /api/v1/environments:
    get:
      tags: [environments]
      summary: List environments
      operationId: listEnvironments
      security: [{ aeonOIDC: ['fleet:read'] }]
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/EnvState' } }
        - { name: placement, in: query, schema: { type: string, enum: [cloud, onprem] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Page of environments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Environment' } }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [environments]
      summary: Register an environment (optionally requesting a new cluster)
      operationId: createEnvironment
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentCreate' }
      responses:
        '201':
          description: |
            Environment registered in state `PENDING`, bound to the request's `api_key_id`.
            Response carries the install hint. A name already registered under this account
            is refused with 409, not rebound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Aeon entitlement does not permit another environment.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/environments/{envId}:
    parameters: [{ $ref: '#/components/parameters/EnvId' }]
    get:
      tags: [environments]
      summary: Get one environment (state, health, components, endpoints)
      operationId: getEnvironment
      security: [{ aeonOIDC: ['fleet:read'] }]
      responses:
        '200':
          description: |
            The environment, carrying the same `install_hint` register returned — the
            console shows it until the operator has run it. The list omits it.
          content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [environments]
      summary: Lifecycle action — suspend, resume, or drain
      operationId: updateEnvironment
      description: Requests a target lifecycle state. The agent reconciles toward it (§7 state machine).
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [suspend, resume, drain, deregister] }
                reason: { type: string }
      responses:
        '200':
          description: |
            `deregister` only — the same operation as DELETE reached this way, so the body
            carries the environment's `api_key_id` for revocation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key_id: { type: string, format: uuid }
        '202': { description: Accepted; transition queued as desired state. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    delete:
      tags: [environments]
      summary: Deregister an environment
      operationId: deregisterEnvironment
      description: Moves the environment to `DRAINING` then `DEREGISTERED`; returns the api_key_id binding so YBM can revoke the key.
      security: [{ aeonOIDC: ['fleet:write'] }]
      responses:
        '200':
          description: Deregistered; the body carries the environment's `api_key_id` for revocation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key_id: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/environments/{envId}/desired:
    parameters: [{ $ref: '#/components/parameters/EnvId' }]
    get:
      tags: [environments]
      summary: Read what this environment is declared to run
      operationId: getEnvironmentDesiredState
      description: The operator-facing read. The agent has its own route, `/api/v1/agent/desired-state`.
      security: [{ aeonOIDC: ['fleet:read'] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources: { type: array, items: { $ref: '#/components/schemas/DesiredResource' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [environments]
      summary: Replace what this environment is declared to run
      operationId: setEnvironmentDesiredState
      description: |
        Replaces the set; nothing is merged, and a resource left out is garbage-collected by
        the agent on its next tick.

        Because omission is deletion, `resources` is required (an absent key is not an empty
        set) and an unknown field at any level is a 400 rather than silently dropped. Withdrawing
        everything is still one call, but `"resources": []` must carry `"allow_empty": true`.
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DesiredStateWrite' } }
      responses:
        '202': { description: Accepted; the agent converges on its next tick. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  # ------------------------------------------------------------------ datapacks
  /api/v1/datapacks:
    get:
      tags: [datapacks]
      summary: List datapack metadata
      operationId: listDatapacks
      security: [{ aeonOIDC: ['datapacks:read'] }]
      parameters:
        - { name: envId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Datapack' } } } }
    post:
      tags: [datapacks]
      summary: Create a datapack (metadata + placement only)
      operationId: createDatapack
      description: Writes metadata and emits desired state. Does NOT touch Kubernetes — the agent reconciles.
      security: [{ aeonOIDC: ['datapacks:write'] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3, maxLength: 60 }
                envId: { type: string, description: Target environment; omit to auto-place. }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Datapack' } } } }
        '402': { description: Free-tier cap reached (per Aeon entitlement). }

  /api/v1/datapacks/{datapackId}:
    parameters: [{ name: datapackId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [datapacks]
      summary: Get datapack metadata
      operationId: getDatapack
      security: [{ aeonOIDC: ['datapacks:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Datapack' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [datapacks]
      summary: Mark a datapack for teardown
      operationId: deleteDatapack
      security: [{ aeonOIDC: ['datapacks:write'] }]
      responses:
        '202': { description: Teardown queued; agent reconciles. }

  # ------------------------------------------------------------------ entitlements
  /api/v1/entitlements:
    get:
      tags: [entitlements]
      summary: Read the caller's plan and caps (from YBM Aeon)
      operationId: getEntitlements
      description: YCP runs no billing; this reflects the plan resolved from YBM Aeon upstream.
      security: [{ aeonOIDC: ['fleet:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }

  # ------------------------------------------------------------------ agent (API key)
  /api/v1/agent/enroll:
    post:
      tags: [agent]
      summary: Key-authenticated first check-in, repeated at every agent startup
      operationId: agentEnroll
      security: [{ agentAPIKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: For logs only; identity comes from the key. }
                cluster_facts: { $ref: '#/components/schemas/ClusterFacts' }
      responses:
        '200':
          description: The bound environment's identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  environment_id: { type: string }
                  environment_uuid: { type: string, description: The row key; the id is a slug unique only within an account. }
                  mcp_base_url: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: No environment is bound to the API key. }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/agent/bootstrap-progress:
    post:
      tags: [agent]
      summary: Pre-agent installer reports cluster-provisioning / install steps
      operationId: agentBootstrapProgress
      description: Key-authed like every agent call; used by the pre-agent installer (§7.1).
      security: [{ agentAPIKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase: { $ref: '#/components/schemas/EnvState' }
                step: { type: string, examples: [creating-eks-cluster] }
                message: { type: string }
                error: { type: string, nullable: true }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/agent/desired-state:
    get:
      tags: [agent]
      summary: Long-poll the desired state for this environment
      operationId: agentDesiredState
      description: |
        Returns the components, datapack specs, and target versions the agent should reconcile
        toward. Supports long-poll via `wait`. Datapack specs reference secret *names* only —
        never secret values.
      security: [{ agentAPIKey: [] }]
      parameters:
        - { name: since, in: query, description: Last revision the agent has applied., schema: { type: integer } }
        - { name: wait, in: query, description: Long-poll seconds., schema: { type: integer, default: 30, maximum: 90 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DesiredState' } } } }
        '304': { description: No change since `since`. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/agent/status:
    post:
      tags: [agent]
      summary: Heartbeat + component/datapack phases
      operationId: agentStatus
      description: |
        Drives the fleet registry and the §7 state machine. Bulk time-series metrics do NOT
        travel here — in-cluster Prometheus remote-writes those to Thanos (§9).
      security: [{ agentAPIKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatusReport' } } }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  # ------------------------------------------------------------------ internal
  /api/v1/internal/meko-tokens/validate:
    post:
      tags: [internal]
      summary: Validate an inbound MCP PAT
      operationId: validateMcpToken
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, examples: [mko_tkn_...] } } }
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  datapack_id: { type: string, nullable: true }
                  scopes: { type: array, items: { type: string } }
        '503': { description: Internal secret not configured. }

components:
  parameters:
    EnvId:
      name: envId
      in: path
      required: true
      schema: { type: string, examples: [acme-prod] }

  securitySchemes:
    aeonOIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.aeon.yugabyte.com/.well-known/openid-configuration
      description: Human identity federated from YBM Aeon (cloud or on-prem issuer).
    agentAPIKey:
      type: http
      scheme: bearer
      description: |
        YBM-minted API key, sent on every agent call. YBM validates it and forwards
        X-Meko-Admin-Secret + X-Meko-Api-Key-ID to YCP; the key id alone resolves the
        environment (one key drives one environment). Revocable from YBM; enrollment
        is an idempotent check-in, so there is no bootstrap credential to expire.
    internalSecret:
      type: apiKey
      in: header
      name: X-Meko-Internal-Secret
      description: Shared secret for MCP server → api_server internal calls.

  responses:
    Unauthorized: { description: Missing or invalid credentials., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadRequest: { description: Invalid request., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflicting state., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    UnsupportedMediaType:
      description: |
        The request did not carry `Content-Type: application/json`. Every write on
        this API requires it, and a body-less write is a `400` — a request whose body
        was dropped in transit must not be mistaken for a report of empty fields.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    EnvState:
      type: string
      description: |
        Bootstrapping / lifecycle state (§7 state machine). A reported state must be
        present — absent or blank is `400` — but one outside this list is accepted
        and stored, because the agent is upgraded on the customer's schedule and can
        be ahead of the control plane. This list is the set the control plane
        recognises; adding to it means adding to `envStates` in the api_server and to
        `EnvState` in `ycp/internal/api` in the same change.
      enum: [PENDING, CLUSTER_PROVISIONING, ENROLLING, ATTESTING, PROVISIONING, VALIDATING, READY, DEGRADED, SUSPENDED, DRAINING, DEREGISTERED]

    Environment:
      type: object
      properties:
        id: { type: string, examples: [acme-prod] }
        account_id: { type: string }
        placement: { type: string, enum: [cloud, onprem] }
        region: { type: string, examples: [us-east-1] }
        state: { $ref: '#/components/schemas/EnvState' }
        k8s_version: { type: string, examples: ['1.30'] }
        capacity: { type: object, properties: { datapacks: { type: integer }, max_datapacks: { type: integer } } }
        agent_version: { type: string, examples: [v1.4.2] }
        last_heartbeat_at: { type: string, format: date-time }
        mcp_base_url: { type: string, examples: ['https://acme.mcp.customer-domain'] }
        cert_fingerprint: { type: string }
        components: { type: array, items: { $ref: '#/components/schemas/Component' } }
        install_hint:
          type: string
          description: Runnable install commands, kind-aware. Get-one only; absent from the list.
      required: [id, state, placement, region]

    Component:
      type: object
      properties:
        name: { type: string, examples: [mcp-server] }
        healthy: { type: integer }
        total: { type: integer }
        version: { type: string }

    EnvironmentCreate:
      type: object
      required: [name, placement, region, api_key_id]
      properties:
        name: { type: string, examples: [acme-prod] }
        account_id: { type: string }
        api_key_id:
          type: string
          format: uuid
          description: The YBM API key the environment's agent authenticates with. One key = one environment.
        agent_base_url:
          type: string
          description: |
            YBM pass-through base for the install hint; absent ⇒ the address this call arrived
            on. Stored with the environment, so the hint a later get-one renders points the
            agent at the same place.
        placement: { type: string, enum: [cloud, onprem] }
        region: { type: string }
        cluster_spec:
          $ref: '#/components/schemas/ClusterSpec'
          description: Present ⇒ provision-new-cluster mode; absent ⇒ attach-existing-cluster.

    ClusterSpec:
      type: object
      description: Requested new cluster (provision mode, §7.1).
      required: [provider, region]
      properties:
        provider: { type: string, enum: [aws, gcp, azure, aeon] }
        region: { type: string }
        node_count: { type: integer, default: 3, minimum: 1 }
        node_size: { type: string, examples: [m6i.2xlarge] }

    EnvironmentCreated:
      type: object
      properties:
        environment: { $ref: '#/components/schemas/Environment' }
        install_hint: { type: string, description: Runnable install commands, kind-aware. }

    ClusterFacts:
      type: object
      properties:
        k8s_version: { type: string }
        region: { type: string }
        node_count: { type: integer }

    Datapack:
      type: object
      description: Metadata + placement only — the data lives in the customer cloud.
      properties:
        id: { type: string }
        name: { type: string }
        account_id: { type: string }
        environment_id: { type: string }
        desired_versions: { type: object, properties: { mcp: { type: string }, rag: { type: string } } }
        phase: { type: string, examples: [Active] }
      required: [id, name, environment_id]

    DesiredState:
      type: object
      description: |
        Generic, resource-typed desired state the agent reconciles toward. The protocol
        is transport-agnostic (currently HTTP/JSON long-poll); adding a new resource type
        needs only a new agent-side reconciler for that Kind, not a schema change.
      properties:
        revision: { type: integer }
        target_versions: { type: object, properties: { agent: { type: string }, mcp: { type: string }, rag: { type: string } } }
        resources:
          type: array
          items: { $ref: '#/components/schemas/DesiredResource' }

    DesiredStateWrite:
      type: object
      additionalProperties: false
      # resources is required so that an absent key cannot pass for an empty set: the
      # agent garbage-collects what desired state omits, so the two readings differ by
      # the environment's whole resource tree.
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: '#/components/schemas/DesiredResource' }
        allow_empty:
          type: boolean
          default: false
          description: |
            Confirms an empty `resources`, which withdraws everything the environment
            declares. Required for that case and ignored otherwise. A body field rather
            than a query parameter because YBM's pass-through forwards the JSON body and
            nothing else.

    DesiredResource:
      type: object
      # additionalProperties: false mirrors the server, which rejects an unknown key
      # at every level, not just the top — a typo beside `kind` is refused the same way
      # one beside `resources` is. Keys inside `spec` are free: it is opaque to the
      # control plane.
      additionalProperties: false
      required: [kind, name]
      properties:
        # Constrained by the environment's kind: a meko environment serves agent and
        # datapack, an amp one storage-pool, cluster, branch and endpoint. Declaring
        # anything else is refused with 400 at declare time, on registration and on
        # POST /environments/{id}/desired, rather than reaching the agent and coming
        # back as permanent drift.
        kind: { type: string, examples: [datapack], enum: [agent, datapack, storage-pool, cluster, branch, endpoint], description: Resource type; dispatched to a reconciler. }
        name: { type: string, examples: [alpha] }
        # spec references secret NAMES only — never secret values
        spec: { type: object, additionalProperties: true, examples: [{ yugabytedb_secret_ref: meko-shared-credentials }] }
        # Server-owned, but NOT readOnly: this schema is shared with the write body, and
        # re-posting an edited read is the normal way to change one resource, so a write
        # carrying generation has to validate. ReplaceDesired derives the value in SQL
        # and ignores whatever was sent.
        generation: { type: integer, format: int64 }

    StatusReport:
      type: object
      required: [environment_state]
      properties:
        environment_state: { $ref: '#/components/schemas/EnvState' }
        agent_version: { type: string }
        applied_revision: { type: integer }
        components: { type: array, items: { $ref: '#/components/schemas/Component' } }

    Entitlement:
      type: object
      description: Plan and caps resolved from YBM Aeon (read-only in YCP).
      properties:
        plan: { type: string, enum: [free, pro, enterprise] }
        source: { type: string, const: ybm-aeon }
        max_environments: { type: integer, nullable: true }
        max_datapacks: { type: integer, nullable: true }

    Error:
      type: object
      properties:
        code: { type: string, examples: [not_found] }
        message: { type: string }
      required: [code, message]
