openapi: 3.1.0
info:
  title: Yugabyte Control Plane (YCP) API
  version: 0.1.0-draft
  description: |
    Control-plane API for the Meko BYOC architecture. YCP runs inside the YBM Aeon VPC,
    owns the fleet registry and desired state, and federates identity + entitlements from
    YBM Aeon. It holds **no customer data and no customer cloud credentials**.

    Four auth surfaces (see `securitySchemes`):
      * **Human / console** — OIDC relying party of YBM Aeon (`aeonOIDC`).
      * **Agent** — `meko-agent` in the customer cluster, authenticating every call
        with a YBM-minted API key (`agentAPIKey`); YBM's pass-through validates it and
        forwards the key id, which alone resolves the environment. Outbound-only; YCP
        never dials into the customer cloud.
      * **Admin** — SRE-only writes that move an environment's software, under
        `/api/v1/admin/*` (`adminSecret`). Kept off YBM's customer pass-through.
      * **Internal** — MCP server → api_server, shared secret header (`internalSecret`).

    This is a design stub: shapes are illustrative and not yet frozen.
  contact: { name: Meko Platform }

servers:
  - url: https://ycp.mekodata.ai
    description: Cloud YCP (inside the YBM Aeon VPC)
  - url: https://ycp.{customer}.internal
    description: On-prem YCP (alongside self-managed Aeon)
    variables:
      customer: { default: acme }

tags:
  - name: environments
    description: Fleet of customer data-plane environments (console / OIDC).
  - name: datapacks
    description: Datapack metadata + placement (console / OIDC). Data itself lives in the customer cloud.
  - name: entitlements
    description: Read-only plan/caps, sourced upstream from YBM Aeon.
  - name: agent
    description: Pull-agent surface (YBM API key). Enroll, reconcile desired state, report status.
  - name: admin
    description: SRE surface (admin secret). Declares the software an amp environment runs.
  - name: internal
    description: MCP server → api_server calls (shared secret).

paths:
  # ------------------------------------------------------------------ environments
  /api/v1/environments:
    get:
      tags: [environments]
      summary: List environments
      operationId: listEnvironments
      security: [{ aeonOIDC: ['fleet:read'] }]
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/EnvState' } }
        - { name: placement, in: query, schema: { type: string, enum: [cloud, onprem] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Page of environments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Environment' } }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [environments]
      summary: Register an environment (optionally requesting a new cluster)
      operationId: createEnvironment
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentCreate' }
      responses:
        '201':
          description: |
            Environment registered in state `PENDING`, bound to the request's `api_key_id`.
            Response carries the install hint. A name already registered under this account
            is refused with 409, not rebound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Aeon entitlement does not permit another environment.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: |
            A scoped (account-bound) caller requested `type: MANAGED`. MANAGED is
            Yugabyte-operated shared infrastructure and may only be registered on the
            unscoped operator path; a customer registering one would have other tenants'
            storage pools pinned onto its own agent.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/environments/{envId}:
    parameters: [{ $ref: '#/components/parameters/EnvId' }]
    get:
      tags: [environments]
      summary: Get one environment (state, health, components, endpoints)
      operationId: getEnvironment
      security: [{ aeonOIDC: ['fleet:read'] }]
      responses:
        '200':
          description: |
            The environment, carrying the same `install_hint` register returned — the
            console shows it until the operator has run it. The list omits it.
          content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [environments]
      summary: Lifecycle action — suspend, resume, or drain
      operationId: updateEnvironment
      description: Requests a target lifecycle state. The agent reconciles toward it (§7 state machine).
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [suspend, resume, drain, deregister] }
                reason: { type: string }
      responses:
        '200':
          description: |
            `deregister` only — the same operation as DELETE reached this way, so the body
            carries the environment's `api_key_id` for revocation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key_id: { type: string, format: uuid }
        '202': { description: Accepted; transition queued as desired state. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    delete:
      tags: [environments]
      summary: Deregister an environment
      operationId: deregisterEnvironment
      description: Moves the environment to `DRAINING` then `DEREGISTERED`; returns the api_key_id binding so YBM can revoke the key.
      security: [{ aeonOIDC: ['fleet:write'] }]
      responses:
        '200':
          description: Deregistered; the body carries the environment's `api_key_id` for revocation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key_id: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/environments/{envId}/desired:
    parameters: [{ $ref: '#/components/parameters/EnvId' }]
    get:
      tags: [environments]
      summary: Read what this environment is declared to run
      operationId: getEnvironmentDesiredState
      description: |
        The operator-facing read. The agent has its own route, `/api/v1/agent/desired-state`.
        Omits `controller` and `fleet-version`, which the admin routes read.
      security: [{ aeonOIDC: ['fleet:read'] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources: { type: array, items: { $ref: '#/components/schemas/DesiredResource' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [environments]
      summary: Replace what this environment is declared to run
      operationId: setEnvironmentDesiredState
      description: |
        Replaces the set; nothing is merged, and a resource left out is garbage-collected by
        the agent on its next tick. `controller` and `fleet-version` are outside the set: a
        body naming either is a 400, even one matching what is stored, and a body omitting
        them leaves them in place. They are written through the admin routes.

        Because omission is deletion, `resources` is required (an absent key is not an empty
        set) and an unknown field at any level is a 400 rather than silently dropped. Withdrawing
        everything is still one call, but `"resources": []` must carry `"allow_empty": true`.
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DesiredStateWrite' } }
      responses:
        '202': { description: Accepted; the agent converges on its next tick. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/environments/resources:
    get:
      tags: [environments]
      summary: List a MANAGED storage pool's resources (desired + observed)
      operationId: listStoragePoolResources
      description: |
        Region-addressed and environment-agnostic: no environment id in the path. Returns a
        storage pool's resources across every MANAGED environment it is mapped to, each as a
        declared `desired` set and an agent-reported `observed` inventory. The storage pool is
        the first path segment of `name`, so the endpoint stays generic across kinds.

        A pool nothing is mapped to returns an empty `environments` list, not a 404 — a LIST
        never assigns.

        Desired and observed spell a resource's path differently: a desired row's `name` is the
        full path (`pool-a/main-db`), while an observed row's `name` is the leaf (`main-db`) and
        the full path is in its `id` (`cluster/pool-a/main-db`). The filters below match on the
        full path in both.

        The environment-wide `controller` and `fleet-version` rows are never listed, desired or
        observed: these environments are shared across tenants.
      security: [{ aeonOIDC: ['fleet:read'] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string }, description: A resource's full hierarchical path; its first segment is the storage pool. Exact match by default. }
        - { name: kind, in: query, schema: { type: string, enum: [storage-pool, cluster, branch, endpoint, extension] }, description: Keep only this resource kind. }
        - { name: subtree, in: query, schema: { type: boolean, default: false }, description: With `name`, also return the resource's descendants. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  environments: { type: array, items: { $ref: '#/components/schemas/EnvironmentResources' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    patch:
      tags: [environments]
      summary: Apply targeted desired-state changes to a MANAGED storage pool, by region
      operationId: patchStoragePoolResources
      description: |
        Region-addressed: the body names the storage pool once and a batch of changes per region.
        Each region resolves to ONE MANAGED amp environment via the sticky `(storage_pool, region)`
        mapping — the first call for a pair pins an eligible environment, later calls reuse it — so a
        pool's resources never scatter across environments.

        Every resource across every region is applied in one ATOMIC transaction. Each item names
        one resource (`kind`+`name`, the name confined to the `<storage_pool>` subtree) and carries
        at most one intent flag (`create`/`update`/`delete`, mutually exclusive):

          - none — a partial-spec merge: only the top-level keys present are changed, an absent
            resource is created with the patch as its whole spec.
          - `create: true` — write, but fail if the resource already exists (409).
          - `update: true` — write, but fail if the resource does not exist (404).
          - `delete: true` — cascade-remove the resource and every descendant (no `spec`).

        Create-only default: a write with NO flag is treated as `create`, so a flagless write onto
        an existing resource is a 409 — pass `update: true` to modify one. The auto-created
        storage-pool row (synthesized on first touch, owner derived from the pool name) is exempt.

        Cluster names are unique per storage pool ACROSS regions: a cluster `create` whose name is
        already used by any environment the pool is mapped to is a 409 `CLUSTER_NAME_IN_USE`.

        The whole call is validated first: a `storage_pool` that is not a UUID, or any invalid
        item — a kind the environment does not serve, `controller` or `fleet-version` (with any
        intent, `delete` included), more than one of `create`/`update`/`delete`,
        a `delete` carrying a `spec`, a missing `kind`/`name`, a non-object `spec`, a name outside
        the pool subtree — fails with 400 and writes nothing. A create onto an existing resource is
        409 `RESOURCE_EXISTS` (409 `CLUSTER_NAME_IN_USE` for a cluster); an update on an absent one
        is 404 `RESOURCE_NOT_FOUND`. A region with no MANAGED amp environment is a 404; one whose
        environments cannot take a new storage pool right now is a retryable 503
        `ENVIRONMENT_UNAVAILABLE`. A new pool pins to an environment whose heartbeat is under 90s
        old and which is READY, or DEGRADED with `accepts_new_pools` reported. The batch is capped at 100 items across all regions.

        An update that changes an endpoint field amp fixes at create — `connectivity.mode`,
        `role`, `tags`, `extended_config` — is 400 `CREATE_TIME_FIELD` once the agent reports the
        endpoint, rather than stored and left as drift; a value equal to what the agent reports is
        allowed, so a drifted spec can be put back. `connectivity.allowed_cidrs` is applied in
        place, but `connectivity` is a top-level key and so replaced whole: send `mode` with the
        new list, or the omitted mode reads as `cluster_ip` and the write is refused.

        The response mirrors the LIST: the pool's desired and observed resources per environment
        touched.
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StoragePoolRegionPatch' } }
      responses:
        '200':
          description: OK; the whole batch applied. The agent converges on its next tick.
          content:
            application/json:
              schema:
                type: object
                properties:
                  environments: { type: array, items: { $ref: '#/components/schemas/EnvironmentResources' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/environments/resources/tasks:
    get:
      tags: [environments]
      summary: List a MANAGED storage pool's amp task history, merged across its environments
      operationId: listStoragePoolTasks
      description: |
        Region-addressed and environment-agnostic, like the resources LIST: no environment id in
        the path, admin-secret auth, the storage pool (first segment of `name`) as the tenant key.
        Returns the amp controller's task history for the pool, merged across every MANAGED
        environment it is mapped to.

        The response is ONE flat `items` list (not grouped per environment), sorted newest-first by
        `created_at` and paginated globally; each item carries its own `environment_id`/`region`.

        Scoping is the load-bearing part. A task is keyed by its amp `cluster_id`, and the task
        table has no pool column. The pool → `cluster_id` bridge is the agent-reported OBSERVED
        inventory: a cluster under the pool carries its amp UUID in `attrs.id`. So the history is
        scoped to the clusters the pool's observed inventory names. Two consequences:
        observed-dependent (a just-created cluster whose inventory has not arrived yet shows no
        tasks until the next agent tick), and a task with no `cluster_id` is not attributable to a
        pool and is excluded. 30-day retention applies.

        A pool nothing is mapped to returns an empty `items` list with 200, not a 404.
      security: [{ aeonOIDC: ['fleet:read'] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string }, description: A path whose first segment is the storage pool. }
        - { name: status, in: query, schema: { type: array, items: { type: string, enum: [pending, running, succeeded, failed] } }, description: Repeatable; keep only these statuses. An unknown value is dropped, not rejected. }
        - { name: active, in: query, schema: { type: boolean }, description: Shorthand for status=pending&status=running. }
        - { name: kind, in: query, schema: { type: string }, description: Keep only this task kind. }
        - { name: cluster_id, in: query, schema: { type: string, format: uuid }, description: A single amp cluster UUID; ignored unless it belongs to the pool. }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 25, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolTaskList' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------------ datapacks
  /api/v1/datapacks:
    get:
      tags: [datapacks]
      summary: List datapack metadata
      operationId: listDatapacks
      security: [{ aeonOIDC: ['datapacks:read'] }]
      parameters:
        - { name: envId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Datapack' } } } }
    post:
      tags: [datapacks]
      summary: Create a datapack (metadata + placement only)
      operationId: createDatapack
      description: Writes metadata and emits desired state. Does NOT touch Kubernetes — the agent reconciles.
      security: [{ aeonOIDC: ['datapacks:write'] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3, maxLength: 60 }
                envId: { type: string, description: Target environment; omit to auto-place. }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Datapack' } } } }
        '402': { description: Free-tier cap reached (per Aeon entitlement). }

  /api/v1/datapacks/{datapackId}:
    parameters: [{ name: datapackId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [datapacks]
      summary: Get datapack metadata
      operationId: getDatapack
      security: [{ aeonOIDC: ['datapacks:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Datapack' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [datapacks]
      summary: Mark a datapack for teardown
      operationId: deleteDatapack
      security: [{ aeonOIDC: ['datapacks:write'] }]
      responses:
        '202': { description: Teardown queued; agent reconciles. }

  # ------------------------------------------------------------------ entitlements
  /api/v1/entitlements:
    get:
      tags: [entitlements]
      summary: Read the caller's plan and caps (from YBM Aeon)
      operationId: getEntitlements
      description: YCP runs no billing; this reflects the plan resolved from YBM Aeon upstream.
      security: [{ aeonOIDC: ['fleet:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }

  # ------------------------------------------------------------------ agent (API key)
  /api/v1/agent/enroll:
    post:
      tags: [agent]
      summary: Key-authenticated first check-in, repeated at every agent startup
      operationId: agentEnroll
      security: [{ agentAPIKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: For logs only; identity comes from the key. }
                cluster_facts: { $ref: '#/components/schemas/ClusterFacts' }
      responses:
        '200':
          description: The bound environment's identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  environment_id: { type: string }
                  environment_uuid: { type: string, description: The row key; the id is a slug unique only within an account. }
                  mcp_base_url: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: No environment is bound to the API key. }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/agent/bootstrap-progress:
    post:
      tags: [agent]
      summary: Pre-agent installer reports cluster-provisioning / install steps
      operationId: agentBootstrapProgress
      description: Key-authed like every agent call; used by the pre-agent installer (§7.1).
      security: [{ agentAPIKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase: { $ref: '#/components/schemas/EnvState' }
                step: { type: string, examples: [creating-eks-cluster] }
                message: { type: string }
                error: { type: string, nullable: true }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/environments/{envId}/extensions:
    parameters: [{ $ref: '#/components/parameters/EnvId' }]
    get:
      tags: [environments]
      summary: The extension catalog this environment's controller serves
      operationId: getEnvironmentExtensions
      description: |
        Builtins plus every extension an operator registered on the amp controller — the
        set a cluster in this environment can be created with — as the agent last relayed
        it. `extensions: null` means no catalog has been relayed (an agent that predates
        this, a meko environment, one not yet reported): a console must fall back rather
        than offer nothing. `[]` is a reported, empty catalog.
      security: [{ aeonOIDC: ['fleet:read'] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  extensions:
                    type: array
                    nullable: true
                    items: { $ref: '#/components/schemas/Extension' }
                  reported_at: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/environments/{envId}/extensions/{name}:
    parameters:
      - { $ref: '#/components/parameters/EnvId' }
      - { name: name, in: path, required: true, schema: { type: string, examples: [postgis] }, description: The catalog name a branch opts in by. }
    put:
      tags: [environments]
      summary: Import an extension into this environment's catalog
      operationId: importEnvironmentExtension
      description: |
        Declares an `extension` resource, which the amp agent registers with its
        controller (`PUT /extensions/{name}`) on its next tick. A full replace: the same
        body again is a no-op, a changed one re-registers. Only the name and `image`
        are checked here; the controller's refusal of anything else (a `:latest` tag,
        a builtin name) is reported on the `extension` resource as `rejected`. Shorthand
        for an edit of the whole set through `POST /environments/{envId}/desired`.
      security: [{ aeonOIDC: ['fleet:write'] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExtensionImport' } } }
      responses:
        '202':
          description: Declared; the agent registers it on its next tick.
          content: { application/json: { schema: { $ref: '#/components/schemas/DesiredResource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [environments]
      summary: Remove an extension from this environment's catalog
      operationId: removeEnvironmentExtension
      description: |
        Withdraws the `extension` declaration; the agent deregisters it on its next tick.
        The controller refuses while any branch enables it, and the agent retries on
        backoff — the environment reads DEGRADED, with the reason on the `extension`
        resource — until those branches are deleted or it is declared again. Nothing
        takes an extension off a branch. Idempotent.
      security: [{ aeonOIDC: ['fleet:write'] }]
      responses:
        '202': { description: Withdrawn; the agent deregisters it on its next tick. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/agent/desired-state:
    get:
      tags: [agent]
      summary: Long-poll the desired state for this environment
      operationId: agentDesiredState
      description: |
        Returns the components, datapack specs, and target versions the agent should reconcile
        toward. Supports long-poll via `wait`. Datapack specs reference secret *names* only —
        never secret values. Carries every declared resource, `controller` and
        `fleet-version` included — the only non-admin read that does — and `revision` covers
        them.
      security: [{ agentAPIKey: [] }]
      parameters:
        - { name: since, in: query, description: Last revision the agent has applied., schema: { type: integer } }
        - { name: wait, in: query, description: Long-poll seconds., schema: { type: integer, default: 30, maximum: 90 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DesiredState' } } } }
        '304': { description: No change since `since`. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/agent/status:
    post:
      tags: [agent]
      summary: Heartbeat + component/datapack phases
      operationId: agentStatus
      description: |
        Drives the fleet registry and the §7 state machine. Bulk time-series metrics do NOT
        travel here — in-cluster Prometheus remote-writes those to Thanos (§9).
      security: [{ agentAPIKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatusReport' } } }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/agent/extensions:
    post:
      tags: [agent]
      summary: Replace this environment's extension catalog
      operationId: agentExtensions
      description: |
        The amp controller's `GET /extensions`, relayed when it changes and at least
        hourly — not on the status heartbeat, which goes out every tick. Replaces the
        stored catalog. `extensions` is required: an absent or null value is a `400`,
        never stored as an empty catalog. Only an amp environment has a catalog; any
        other kind is a `400`.
      security: [{ agentAPIKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extensions]
              properties:
                extensions: { type: array, items: { $ref: '#/components/schemas/Extension' } }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  # ------------------------------------------------------------------ admin (SRE)
  # The only writers of `controller` and `fleet-version`. Each PUT is a full replace of
  # one singleton (the route fixes kind and name); there is no DELETE — a declaration
  # is moved, never withdrawn. amp environments only.
  /api/v1/admin/environments/{envId}/desired/controller:
    parameters: [{ $ref: '#/components/parameters/EnvId' }, { $ref: '#/components/parameters/AdminAccountId' }]
    get:
      tags: [admin]
      summary: Read the declared controller release beside what the agent reports
      operationId: adminGetControllerVersion
      security: [{ adminSecret: [] }]
      responses:
        '200':
          description: |
            `observed` is normally present even when nothing is declared: the agent reports
            the controller on every tick.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminVersion' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AmbiguousId' }
    put:
      tags: [admin]
      summary: Declare the amp controller release an environment runs
      operationId: adminPutControllerVersion
      description: |
        Writes the `controller` resource, which the agent converges with a `helm upgrade` of
        the release it runs in. The same body again keeps the generation; a changed one
        bumps it.
      security: [{ adminSecret: [] }]
      parameters: [{ $ref: '#/components/parameters/AdminActor' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ControllerVersion' } } }
      responses:
        '202':
          description: Declared; the agent converges it on its next tick.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminDesired' } } }
        '400':
          description: An unknown field, a missing or padded `version`, a padded `chart_version`, or a non-amp environment.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AmbiguousId' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/admin/environments/{envId}/desired/fleet-version:
    parameters: [{ $ref: '#/components/parameters/EnvId' }, { $ref: '#/components/parameters/AdminAccountId' }]
    get:
      tags: [admin]
      summary: Read the declared fleet version beside what the agent reports
      operationId: adminGetFleetVersion
      security: [{ adminSecret: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminVersion' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AmbiguousId' }
    put:
      tags: [admin]
      summary: Declare the version every endpoint should run
      operationId: adminPutFleetVersion
      description: |
        Writes the `fleet-version` resource. The agent rolls the endpoints onto it once the
        controller deploys it, gated on the controller being Ready at its declared version —
        so declare the controller first; the two may go back to back. The same body again
        keeps the generation; a changed one bumps it.
      security: [{ adminSecret: [] }]
      parameters: [{ $ref: '#/components/parameters/AdminActor' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FleetVersion' } } }
      responses:
        '202':
          description: Declared; the agent rolls on a later tick.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminDesired' } } }
        '400':
          description: An unknown field, a missing or padded `version`, or a non-amp environment.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `CONTROLLER_NOT_DECLARED`: no `controller` is declared. An undeclared controller is
            never Ready, so the roll would wait forever; declaring the version it already runs
            is enough. Or `AMBIGUOUS_ID`, as on the GET.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  # ------------------------------------------------------------------ internal
  /api/v1/internal/meko-tokens/validate:
    post:
      tags: [internal]
      summary: Validate an inbound MCP PAT
      operationId: validateMcpToken
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, examples: [mko_tkn_...] } } }
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  datapack_id: { type: string, nullable: true }
                  scopes: { type: array, items: { type: string } }
        '503': { description: Internal secret not configured. }

components:
  parameters:
    EnvId:
      name: envId
      in: path
      required: true
      schema: { type: string, examples: [acme-prod] }
    AdminAccountId:
      name: X-Meko-Account-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: |
        Optional on the admin routes, whatever `--require-account-header` says. Narrows the
        lookup to one account, which resolves an id two accounts hold. Malformed is a 400.
    AdminActor:
      name: X-Meko-Admin-Actor-Email
      in: header
      required: false
      schema: { type: string, format: email }
      description: Optional. The operator making the write; logged with it.

  securitySchemes:
    aeonOIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.aeon.yugabyte.com/.well-known/openid-configuration
      description: Human identity federated from YBM Aeon (cloud or on-prem issuer).
    agentAPIKey:
      type: http
      scheme: bearer
      description: |
        YBM-minted API key, sent on every agent call. YBM validates it and forwards
        X-Meko-Admin-Secret + X-Meko-Api-Key-ID to YCP; the key id alone resolves the
        environment (one key drives one environment). Revocable from YBM; enrollment
        is an idempotent check-in, so there is no bootstrap credential to expire.
    adminSecret:
      type: apiKey
      in: header
      name: X-Meko-Admin-Secret
      description: |
        The fleet-wide admin secret, on the `/api/v1/admin/*` routes. Separation from the
        customer surface is by path: YBM's customer pass-through must not forward them.
    internalSecret:
      type: apiKey
      in: header
      name: X-Meko-Internal-Secret
      description: Shared secret for MCP server → api_server internal calls.

  responses:
    Unauthorized: { description: Missing or invalid credentials., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadRequest: { description: Invalid request., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflicting state., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ServiceUnavailable: { description: Temporarily unavailable; retry., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    AmbiguousId: { description: '`AMBIGUOUS_ID`: two accounts hold this id and no `X-Meko-Account-ID` was sent.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    UnsupportedMediaType:
      description: |
        The request did not carry `Content-Type: application/json`. Every write on
        this API requires it, and a body-less write is a `400` — a request whose body
        was dropped in transit must not be mistaken for a report of empty fields.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    EnvState:
      type: string
      description: |
        Bootstrapping / lifecycle state (§7 state machine). A reported state must be
        present — absent or blank is `400` — but one outside this list is accepted
        and stored, because the agent is upgraded on the customer's schedule and can
        be ahead of the control plane. This list is the set the control plane
        recognises; adding to it means adding to `envStates` in the api_server and to
        `EnvState` in `ycp/internal/api` in the same change.
      enum: [PENDING, CLUSTER_PROVISIONING, ENROLLING, ATTESTING, PROVISIONING, VALIDATING, READY, DEGRADED, SUSPENDED, DRAINING, DEREGISTERED]

    Environment:
      type: object
      properties:
        id: { type: string, examples: [acme-prod] }
        account_id: { type: string }
        type:
          type: string
          enum: [BYOC, MANAGED]
          default: BYOC
          description: BYOC (customer-run data plane) or MANAGED. Fixed at registration.
        placement: { type: string, enum: [cloud, onprem] }
        region: { type: string, examples: [us-east-1] }
        state: { $ref: '#/components/schemas/EnvState' }
        k8s_version: { type: string, examples: ['1.30'] }
        capacity: { type: object, properties: { datapacks: { type: integer }, max_datapacks: { type: integer } } }
        agent_version: { type: string, examples: [v1.4.2] }
        last_heartbeat_at: { type: string, format: date-time }
        mcp_base_url: { type: string, examples: ['https://acme.mcp.customer-domain'] }
        cert_fingerprint: { type: string }
        components: { type: array, items: { $ref: '#/components/schemas/Component' } }
        install_hint:
          type: string
          description: Runnable install commands, kind-aware. Get-one only; absent from the list.
      required: [id, state, placement, region]

    Component:
      type: object
      properties:
        name: { type: string, examples: [mcp-server] }
        healthy: { type: integer }
        total: { type: integer }
        version: { type: string }

    EnvironmentCreate:
      type: object
      required: [name, placement, region, api_key_id]
      properties:
        name: { type: string, examples: [acme-prod] }
        account_id: { type: string }
        type:
          type: string
          enum: [BYOC, MANAGED]
          default: BYOC
          description: |
            BYOC (customer-run data plane) or MANAGED (Yugabyte-operated shared
            infrastructure); empty defaults to BYOC. Fixed at registration. MANAGED is
            operator-only: a scoped (account-bound) caller requesting it is refused with
            403, so type='MANAGED' is a marker a customer cannot set.
        api_key_id:
          type: string
          format: uuid
          description: The YBM API key the environment's agent authenticates with. One key = one environment.
        agent_base_url:
          type: string
          description: |
            YBM pass-through base for the install hint; absent ⇒ the address this call arrived
            on. Stored with the environment, so the hint a later get-one renders points the
            agent at the same place.
        placement: { type: string, enum: [cloud, onprem] }
        region: { type: string }
        cluster_spec:
          $ref: '#/components/schemas/ClusterSpec'
          description: Present ⇒ provision-new-cluster mode; absent ⇒ attach-existing-cluster.

    ClusterSpec:
      type: object
      description: Requested new cluster (provision mode, §7.1).
      required: [provider, region]
      properties:
        provider: { type: string, enum: [aws, gcp, azure, aeon] }
        region: { type: string }
        node_count: { type: integer, default: 3, minimum: 1 }
        node_size: { type: string, examples: [m6i.2xlarge] }

    EnvironmentCreated:
      type: object
      properties:
        environment: { $ref: '#/components/schemas/Environment' }
        install_hint: { type: string, description: Runnable install commands, kind-aware. }

    ClusterFacts:
      type: object
      properties:
        k8s_version: { type: string }
        region: { type: string }
        node_count: { type: integer }

    Datapack:
      type: object
      description: Metadata + placement only — the data lives in the customer cloud.
      properties:
        id: { type: string }
        name: { type: string }
        account_id: { type: string }
        environment_id: { type: string }
        desired_versions: { type: object, properties: { mcp: { type: string }, rag: { type: string } } }
        phase: { type: string, examples: [Active] }
      required: [id, name, environment_id]

    DesiredState:
      type: object
      description: |
        Generic, resource-typed desired state the agent reconciles toward. The protocol
        is transport-agnostic (currently HTTP/JSON long-poll); adding a new resource type
        needs only a new agent-side reconciler for that Kind, not a schema change.
      properties:
        revision: { type: integer }
        target_versions: { type: object, properties: { agent: { type: string }, mcp: { type: string }, rag: { type: string } } }
        resources:
          type: array
          items: { $ref: '#/components/schemas/DesiredResource' }

    DesiredStateWrite:
      type: object
      additionalProperties: false
      # resources is required so that an absent key cannot pass for an empty set: the
      # agent garbage-collects what desired state omits, so the two readings differ by
      # the environment's whole resource tree.
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: '#/components/schemas/DesiredResource' }
        allow_empty:
          type: boolean
          default: false
          description: |
            Confirms an empty `resources`, which withdraws everything the environment
            declares except `controller` and `fleet-version`. Required for that case and
            ignored otherwise. A body field rather
            than a query parameter because YBM's pass-through forwards the JSON body and
            nothing else.

    DesiredResource:
      type: object
      # additionalProperties: false mirrors the server, which rejects an unknown key
      # at every level, not just the top — a typo beside `kind` is refused the same way
      # one beside `resources` is. Keys inside `spec` are free: it is opaque to the
      # control plane.
      additionalProperties: false
      required: [kind, name]
      properties:
        # Constrained by the environment's kind: a meko environment serves agent and
        # datapack, an amp one storage-pool, cluster, branch, endpoint and extension.
        # Declaring anything else is refused with 400 at declare time, on registration
        # and on POST /environments/{id}/desired, rather than reaching the agent and
        # coming back as permanent drift. amp's controller and fleet-version stay in the
        # enum because /agent/desired-state returns them, but only the admin routes
        # write them: every public write refuses them the same way.
        kind: { type: string, examples: [datapack], enum: [agent, datapack, storage-pool, cluster, branch, endpoint, controller, fleet-version, extension], description: Resource type; dispatched to a reconciler. }
        name: { type: string, examples: [alpha] }
        # spec references secret NAMES only — never secret values
        spec: { type: object, additionalProperties: true, examples: [{ yugabytedb_secret_ref: meko-shared-credentials }] }
        # Server-owned, but NOT readOnly: this schema is shared with the write body, and
        # re-posting an edited read is the normal way to change one resource, so a write
        # carrying generation has to validate. ReplaceDesired derives the value in SQL
        # and ignores whatever was sent.
        generation: { type: integer, format: int64 }

    ResourceStatus:
      type: object
      description: |
        One item of an environment's observed inventory, as the agent last reported it.
        Kind-agnostic and flat: `parent` links a resource to its owner by id, so new kinds
        need no schema change. `name` is the LEAF; the full hierarchical path is in `id` as
        `<kind>/<path>`.
      properties:
        kind: { type: string, examples: [cluster] }
        id: { type: string, examples: [cluster/pool-a/main-db] }
        name: { type: string, examples: [main-db] }
        parent: { type: string, examples: [storage-pool/pool-a] }
        state: { type: string, examples: [ready] }
        error: { type: string, description: Why the resource is not converged, when the agent can say. }
        attrs: { type: object, additionalProperties: { type: string } }

    ControllerVersion:
      type: object
      # additionalProperties: false mirrors the server's strict bind; the agent would
      # silently drop a misspelled key, so the API refuses it instead.
      additionalProperties: false
      required: [version]
      description: The `controller` spec.
      properties:
        version: { type: string, examples: [0.260901.0-abc1234], description: 'The image tag for the controller, the agent and the endpoint pin. Non-empty, no surrounding whitespace; the format is not checked here.' }
        chart_version: { type: string, examples: [0.260901.0], description: The yb-amp-controller chart version. No surrounding whitespace. }
        values: { type: object, additionalProperties: true, description: Helm value overrides the environment carries, passed through verbatim. }

    FleetVersion:
      type: object
      additionalProperties: false
      required: [version]
      description: The `fleet-version` spec.
      properties:
        version: { type: string, examples: [0.260901.0-abc1234], description: 'The version every endpoint should run. Non-empty, no surrounding whitespace.' }

    AdminDesired:
      type: object
      required: [kind, name, spec, generation]
      description: A stored `controller` or `fleet-version` declaration.
      properties:
        kind: { type: string, enum: [controller, fleet-version] }
        name: { type: string, enum: [controller, fleet] }
        spec: { type: object, additionalProperties: true }
        # Always present, 0 included -- unlike DesiredResource, which omits a 0.
        generation: { type: integer, format: int64, description: Bumped only when the spec changes. }

    AdminVersion:
      type: object
      required: [desired, observed]
      properties:
        desired:
          oneOf: [{ $ref: '#/components/schemas/AdminDesired' }, { type: 'null' }]
          description: The declaration; null when none has been made.
        observed:
          oneOf: [{ $ref: '#/components/schemas/ResourceStatus' }, { type: 'null' }]
          description: The agent-reported inventory row whose `id` is `<kind>/<name>`; null when there is none.

    StoragePoolRegionPatch:
      type: object
      additionalProperties: false
      required: [storage_pool, regions]
      description: |
        A region-addressed batch: one storage pool, and its targeted changes grouped by region.
        Applied atomically across every region in one transaction; capped at 100 patches total.
      properties:
        storage_pool: { type: string, format: uuid, examples: ['3f0b5a2c-1d4e-4a9b-8c7d-2e6f9a0b1c2d'], description: The storage pool (an aeon account id, a UUID), equal to its `storage-pool` resource name. Every resource name below must be it or under it. }
        regions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RegionResources' }

    RegionResources:
      type: object
      additionalProperties: false
      required: [region, resources]
      properties:
        region: { type: string, examples: [us-east-1], description: The region whose MANAGED environment these patches target. }
        resources:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ResourcePatch' }

    EnvironmentResources:
      type: object
      description: One environment's slice of a region-addressed response — desired and observed resources for the storage pool.
      properties:
        environment_id: { type: string, examples: [acme-prod], description: The operator-facing id of the environment that answered. }
        region: { type: string, examples: [us-east-1] }
        desired: { type: array, items: { $ref: '#/components/schemas/DesiredResource' } }
        observed: { type: array, items: { $ref: '#/components/schemas/ResourceStatus' } }

    PoolTask:
      type: object
      description: |
        One amp controller task in a pool-scoped listing merged across environments. The
        `environment_id`/`region` identify which environment it ran in; the rest is the task as the
        reconcile agent relayed it. Kind-agnostic — `kind` and `result` are stored and served
        without interpretation.
      properties:
        environment_id: { type: string, examples: [demo-amp-east], description: The environment the task ran in. }
        region: { type: string, examples: [us-east-1] }
        task_id: { type: string, examples: ['9f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f'] }
        kind: { type: string, examples: [resize_endpoint] }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        cluster_id: { type: string, format: uuid, description: The amp cluster the task targets; absent for a task not scoped to a cluster. }
        target_ref: { type: string, examples: [endpoint/ep-1] }
        error: { type: string, description: The controller's failure reason, set when status is failed. }
        result: { type: object, additionalProperties: true, description: Opaque task result, served verbatim. }
        ycp_generation: { type: integer, format: int64, description: Absent for a task an operator or the amp UI planned directly rather than YCP driving it. }
        created_at: { type: string, format: date-time, description: The controller's create time. }
        updated_at: { type: string, format: date-time, description: The controller's last-update time. }
        reported_at: { type: string, format: date-time, description: When the agent last relayed this row. }

    PoolTaskList:
      type: object
      description: One page of a storage pool's task history merged across environments, newest first.
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PoolTask' } }
        total: { type: integer, description: Count the page was taken from, across all environments. }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }

    ResourcePatch:
      type: object
      # additionalProperties: false mirrors the server, which rejects an unknown key at
      # every level. Keys inside spec are free — it is opaque to the control plane.
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [agent, datapack, storage-pool, cluster, branch, endpoint], description: Resource type; constrained by the environment's kind. }
        name: { type: string, examples: [pool-a/main-db], description: The resource's full hierarchical path. }
        # A PARTIAL, shallow-merge patch: only the top-level keys present are changed, the rest
        # are preserved, and a nested object is replaced wholesale. An absent resource is created
        # with this as its whole spec. References secret NAMES only — never secret values.
        spec: { type: object, additionalProperties: true, examples: [{ pg_version: 17 }] }
        delete:
          type: boolean
          default: false
          description: |
            When true, cascade-removes the named resource and every descendant from desired
            state. Mutually exclusive with `spec` — a delete must not carry one — and with
            `create`/`update`.
        create:
          type: boolean
          default: false
          description: |
            Assert the resource does not yet exist; a collision is rejected (409
            `RESOURCE_EXISTS`, or `CLUSTER_NAME_IN_USE` for a cluster already named elsewhere in
            the pool). A flagless non-delete write defaults to this. Mutually exclusive with
            `update`/`delete`.
        update:
          type: boolean
          default: false
          description: |
            Assert the resource already exists; an absent one is rejected (404
            `RESOURCE_NOT_FOUND`). This is how you modify an existing resource, since a flagless
            write is create-only. Mutually exclusive with `create`/`delete`.

    StatusReport:
      type: object
      required: [environment_state]
      properties:
        environment_state: { $ref: '#/components/schemas/EnvState' }
        accepts_new_pools:
          type: boolean
          description: |
            The environment can take a storage pool it does not hold yet: true when READY, and when
            DEGRADED only by resources under one storage pool. A DEGRADED environment is eligible for
            a new pool only with this set; absent reads false.
        agent_version: { type: string }
        applied_revision: { type: integer }
        components: { type: array, items: { $ref: '#/components/schemas/Component' } }

    Extension:
      type: object
      required: [name, builtin, preload]
      properties:
        name: { type: string, examples: [pgvector] }
        builtin: { type: boolean, description: Shipped with amp, as opposed to registered by an operator. }
        preload: { type: boolean, description: Enabling it needs a compute restart (shared_preload_libraries). }
        version: { type: string }
        description: { type: string }

    ExtensionImport:
      type: object
      additionalProperties: false
      required: [image]
      description: The amp controller's registerExtension body, sent to it verbatim.
      properties:
        image: { type: string, examples: ['quay.io/acme/postgis:3.5'], description: 'Pinned to a tag or @sha256 digest; :latest is refused.' }
        version: { type: string }
        description: { type: string }
        library: { type: string, description: Shared-library basename when it differs from the name. }
        preload: { type: boolean, description: Must be in shared_preload_libraries. }
        layout:
          type: object
          additionalProperties: false
          description: Where the image keeps its pieces, relative to its mount root.
          properties:
            share_path: { type: string }
            lib_path: { type: string }
            library_path: { type: array, items: { type: string } }
            env_paths: { type: object, additionalProperties: { type: string } }
        abi_extra_exempt: { type: array, items: { type: string }, description: Modules allowed a stock-PostgreSQL ABI string. }

    Entitlement:
      type: object
      description: Plan and caps resolved from YBM Aeon (read-only in YCP).
      properties:
        plan: { type: string, enum: [free, pro, enterprise] }
        source: { type: string, const: ybm-aeon }
        max_environments: { type: integer, nullable: true }
        max_datapacks: { type: integer, nullable: true }

    Error:
      type: object
      properties:
        code: { type: string, examples: [not_found] }
        message: { type: string }
      required: [code, message]
