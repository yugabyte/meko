apiVersion: v1
kind: Service
metadata:
  name: mcp-proxy
  namespace: meko-ingress
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/part-of: meko
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
