# This rule is not used by the project meko-provisioner itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to saas.mekodata.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: meko-provisioner
    app.kubernetes.io/managed-by: kustomize
  name: mekouseraccount-viewer-role
rules:
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts/status
  verbs:
  - get
