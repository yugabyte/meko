# This rule is not used by the project meko-provisioner itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the saas.mekodata.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: meko-provisioner
    app.kubernetes.io/managed-by: kustomize
  name: mekouseraccount-editor-role
rules:
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts/status
  verbs:
  - get
