{{/* Meko Kapa search trigger. The navbar override renders it before the main
     menu; Docsy also renders it in the sidebar, where project CSS hides it. On
     the home page it focuses the hero chat; elsewhere it opens the overlay. */ -}}
<button
  type="button"
  class="meko-nav-search"
  data-meko-nav-search
  aria-label="Ask Meko Docs"
>
  <i class="fa fa-search" aria-hidden="true"></i>
  <span class="meko-nav-search__label">Ask Meko</span>
  <span class="meko-nav-search__hint" aria-hidden="true">/</span>
</button>
