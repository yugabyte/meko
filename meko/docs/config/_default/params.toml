author = "Team Meko"
copyright = 'Meko. All Rights Reserved'
version = false

# Docsy page-meta-links: Feedback dropdown for GitHub issues
github_repo = "https://github.com/yugabyte/meko"

[ui]
  navbar_logo = true
  sidebar_menu_compact = true
  sidebar_menu_foldable = true
  sidebar_search_disable = true
  sidebar_root_enabled = true
  ul_show = 1

# Feedback widget (docs top bar + right TOC + footer block). Temporarily off.
[ui.feedback]
  enable = false

[[links.developer]]
  name = "Discord"
  url = "https://discord.gg/GWcSST7GqZ"
  icon = "fab fa-discord"

[kapa]
  # Client-facing URL of our server-side Kapa proxy. The Kapa API key and
  # project/integration IDs live as env vars on the backend (Netlify
  # Functions in prod, local proxy server in Docker) — never in params.toml.
  # See docs/netlify/functions/kapa-chat.mjs for the server implementation.
  chat_endpoint = "/api/kapa/chat"
