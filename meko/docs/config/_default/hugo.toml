baseURL = 'https://docs.mekodata.ai/'
languageCode = 'en-us'
title = 'Meko Docs'
resourceDir = 'docs/resources'

# Publish docs pages/sections at site root (no /docs prefix).
[permalinks.page]
  docs = "/:sections[1:]/:contentbasename/"

[permalinks.section]
  docs = "/:sections[1:]"

# Suppress auto-rendered child page lists on all section pages
[[cascade]]
  no_list = true

# Make home pages link-only so docs section landing pages can own root URLs
[[cascade]]
  [cascade.build]
    render = "link"
  [cascade.target]
    path = "/"

# Fetchable Markdown at /path/page.md. Sections publish at /path/index.md,
# and layouts/_partials/markdown-section.md also publishes /path.md.
# ugly publishes a regular page as page.md instead of page/index.md.
[outputFormats.Markdown]
  mediaType = "text/markdown"
  isPlainText = true
  ugly = true

[outputs]
  page = ["HTML", "Markdown"]
  section = ["HTML", "Markdown"]
