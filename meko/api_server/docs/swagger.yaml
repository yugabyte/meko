  /admin/token-savings:
    get:
      description: Legacy combined executive rollup (users, datapacks, conversations,
        token savings, top savers). Superseded by the /admin/executive/* panels; retained
        only for compatibility.
      parameters:
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
