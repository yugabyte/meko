basePath: /api/v1
definitions:
  handlers.APIError:
    properties:
      code:
        type: string
      details:
        items:
          type: string
        type: array
      message:
        type: string
    type: object
  handlers.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/handlers.APIError'
    type: object
  handlers.AuthConfig:
    properties:
      login_url:
        description: |-
          LoginURL is where the sign-in button sends the browser, for a provider
          whose flow is a redirect. Empty for cognito, whose sign-in is a form this
          server posts to.
        type: string
      password_login:
        description: |-
          PasswordLogin and Signup are false for OIDC: the issuer owns its users, so
          there is no password form and no signup page to route to.
        type: boolean
      provider:
        description: |-
          Provider is "cognito", "oidc", or "none" (dev auth, every request sharing
          one account).
        type: string
      signup:
        type: boolean
      social_providers:
        description: |-
          SocialProviders are the Cognito-brokered buttons. Empty under OIDC, where
          federation is the issuer's configuration and invisible from here.
        items:
          type: string
        type: array
    type: object
  handlers.DatapackListPage:
    properties:
      has_more:
        type: boolean
      items:
        items:
          type: object
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  handlers.DatapackSummary:
    properties:
      created_at:
        type: string
      created_by_agent_id:
        type: string
      datapack_id:
        type: string
      datapack_name:
        type: string
      datapack_owner_email_id:
        type: string
      datapack_owner_name:
        type: string
      description:
        type: string
      grant:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handlers.artifactPutRequest:
    properties:
      content_base64:
        description: base64-encoded file bytes
        type: string
      content_type:
        type: string
      filename:
        type: string
    type: object
  handlers.checkoutSessionRequest:
    properties:
      plan_id:
        description: |-
          PlanID is one of "starter" | "growth" | "scale". Free and
          enterprise are not Checkout-eligible -- the handler 400s.
        type: string
    type: object
  handlers.confirmByocDeploymentRequest:
    properties:
      role_arn:
        type: string
    type: object
  handlers.createDeploymentRequest:
    properties:
      agent_slug:
        type: string
    type: object
  handlers.downloadURLRequest:
    properties:
      document_uri:
        type: string
    type: object
  handlers.setConversationSearchOptOutRequest:
    properties:
      opted_out:
        type: boolean
    type: object
  handlers.startByocDeploymentRequest:
    properties:
      agent_slug:
        type: string
    type: object
  handlers.uploadCompleteRequest:
    properties:
      filename:
        type: string
      key:
        type: string
      size:
        type: integer
    type: object
  handlers.uploadURLRequest:
    properties:
      content_hash:
        description: |-
          ContentHash is the hex-encoded SHA-256 of the file bytes, computed by
          the client before requesting the presigned URL. It is used as the S3
          sub-directory so that (a) the same filename with different content gets
          a unique path, and (b) re-uploading identical bytes is idempotent.
        type: string
      filename:
        type: string
      size:
        description: |-
          Size is the client's *declared* size — only a UX-nicety early
          rejection. The actual cap signed into the policy (see RequestUploadURL's
          signedCap) is derived entirely from server-side state, so a lied-about
          Size can't get more past S3 than an honest one could.
        type: integer
    type: object
  models.CreateFeedbackRequest:
    properties:
      category:
        type: string
      created_at:
        type: string
      datapack_id:
        type: string
      datapack_name:
        type: string
      feedback_text:
        type: string
      meko_version:
        type: string
      source:
        type: string
      source_identifier:
        type: string
      user_id:
        type: string
      user_path:
        type: string
    type: object
  models.CreateMCPTokenRequest:
    properties:
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
      ttl_days:
        type: integer
    type: object
  models.PromoteMemoriesRequest:
    properties:
      agent_id:
        type: string
      datapack_id:
        type: string
      memory_ids:
        items:
          type: string
        type: array
      user_id:
        type: string
    type: object
  models.ValidatePATRequest:
    properties:
      client_ip:
        type: string
      client_user_agent:
        type: string
      token:
        type: string
    type: object
  service.AddRequest:
    properties:
      details:
        items:
          type: integer
        type: array
      url:
        type: string
    type: object
  service.BulkInviteRequest:
    properties:
      emails:
        items:
          type: string
        type: array
      grant:
        type: string
    type: object
  service.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  service.CompleteNewPasswordRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      new_password:
        type: string
      session:
        type: string
    type: object
  service.ConfirmSignupRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  service.CreateProjectRequest:
    properties:
      description:
        type: string
      folders:
        description: |-
          Folders replaces the theme's own folder list. The Blank theme exists for
          exactly this: it ships no meaningful layout, so the caller names the
          first folder instead. Omitted, the theme's folders are used.
        items:
          type: string
        type: array
      project_name:
        type: string
      theme_key:
        type: string
    type: object
  service.CreateRequest:
    properties:
      agent_id:
        type: string
      description:
        type: string
      folder_id:
        description: |-
          FolderID files the new datapack into a project folder. Required once the
          Projects feature is on and the caller has at least one project — see
          ProjectService.ValidateNewDatapackFolder. Ignored when the feature is
          off, so the field is additive for existing clients.
        type: string
      name:
        type: string
      user_id:
        type: string
    type: object
  service.CreateUserAgentRequest:
    properties:
      agent_details:
        items:
          type: integer
        type: array
      agent_id:
        type: string
    type: object
  service.DatapackCounts:
    properties:
      owned:
        type: integer
      shared:
        type: integer
      total:
        type: integer
    type: object
  service.ForgotPasswordConfirmRequest:
    properties:
      code:
        type: string
      confirm_password:
        type: string
      email:
        type: string
      new_password:
        type: string
    type: object
  service.ForgotPasswordStartRequest:
    properties:
      email:
        type: string
    type: object
  service.InviteActionRequest:
    properties:
      invite_id:
        type: string
      user_action:
        type: string
    type: object
  service.InviteRequest:
    properties:
      grant:
        type: string
      recipient_email:
        type: string
    type: object
  service.LinkAgentRequest:
    properties:
      agent_id:
        type: string
    type: object
  service.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  service.ResendConfirmationRequest:
    properties:
      email:
        type: string
    type: object
  service.SignupRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
    type: object
  service.StartEmailChangeRequest:
    properties:
      email:
        type: string
    type: object
  service.UpdateGrantRequest:
    properties:
      grant:
        type: string
    type: object
  service.UpdateOnboardingRequest:
    properties:
      has_completed_onboarding:
        type: boolean
    type: object
  service.UpdateProfileRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    type: object
  service.UpdateRequest:
    properties:
      datapack_ysql_connection_string:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  service.VerifyEmailChangeRequest:
    properties:
      code:
        type: string
    type: object
host: localhost:25433
info:
  contact: {}
  description: REST API for managing datapacks, agents, and knowledge bases in the
    meko platform.
  title: Meko Datapack API
  version: "1.0"
paths:
  /admin/dataplane:
    get:
      description: Live YugabyteDB Anywhere universe configuration (nodes, instance
        type, storage, region, version) plus best-effort CPU/memory/disk utilization.
        `configured` is false when no YBA token is set; `available` is false when
        the universe can't be read.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Data plane status (admin)
      tags:
      - admin
  /admin/executive/engagement:
    get:
      description: Conversations (total and by agent, Langfuse) and promoted memories
        created in the date range.
      parameters:
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Executive: engagement (admin)'
      tags:
      - admin
  /admin/executive/growth:
    get:
      description: Users and datapacks created in the date range, plus week-over-week
        datapack creation.
      parameters:
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Executive: growth (admin)'
      tags:
      - admin
  /admin/executive/knowledge:
    get:
      description: Indexed (RAG'd) KB documents and chunks created in the date range,
        plus indexed documents grouped by file type.
      parameters:
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Executive: knowledge (admin)'
      tags:
      - admin
  /admin/executive/savings:
    get:
      description: Contextual-search requests and tokens saved in the date range,
        plus a top-10 leaderboard of users by tokens saved.
      parameters:
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Executive: token savings (admin)'
      tags:
      - admin
  /admin/feedback:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: List product feedback (admin)
      tags:
      - admin
  /admin/metrics:
    get:
      parameters:
      - description: User UUID, or 'all'/omitted for overall
        in: query
        name: user_id
        type: string
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Admin dashboard metrics (overall or per-user)
      tags:
      - admin
  /admin/metrics/conversations:
    get:
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Per-user metrics: conversations (admin)'
      tags:
      - admin
  /admin/metrics/knowledge:
    get:
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Per-user metrics: knowledge (admin)'
      tags:
      - admin
  /admin/metrics/memories:
    get:
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Per-user metrics: memories (admin)'
      tags:
      - admin
  /admin/metrics/overview:
    get:
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Per-user metrics: overview (admin)'
      tags:
      - admin
  /admin/metrics/searches:
    get:
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: 'Per-user metrics: searches (admin)'
      tags:
      - admin
  /admin/metrics/tokens:
    get:
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      - description: Range start (inclusive), YYYY-MM-DD
        in: query
        name: start
        type: string
      - description: Range end (inclusive), YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
