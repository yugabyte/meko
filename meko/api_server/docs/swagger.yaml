        name: sort
        type: string
      - description: Case-insensitive substring of datapack_name (max 200 chars)
        in: query
        name: q
        type: string
      - description: Exact datapack_name
        in: query
        name: name
        type: string
      - description: owner or shared (default both)
        enum:
        - owner
        - shared
        in: query
        name: grant
        type: string
      - description: summary (default) or full
        enum:
        - summary
        - full
        in: query
        name: fields
        type: string
