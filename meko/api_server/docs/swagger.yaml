        Follow next_cursor for the next page.
      parameters:
      - description: Page size 1-1000 (larger is clamped). A non-empty value selects
          paged mode.
        in: query
        name: limit
        type: integer
      - description: next_cursor from the previous page, with the same sort and filters
        in: query
        name: cursor
        type: string
      - description: created (newest first, default) or name (bytewise)
        enum:
        - created
        - name
