# Mirrors meko_ui/deploy/nginx/default.conf with one change: the /api/v1/
# upstream targets the containerized api_server in our compose project,
# not host.docker.internal (which the team's local-dev setup uses because
# they run api_server natively on the Mac).
#
# Designed for VITE_OBSERVE_EMBED_PATH=/ — the iframe loads root-relative
# Langfuse paths (/organization/<id>, /project/<id>, etc.) directly, and
# the explicit location blocks below route those to langfuse-web.

# Handle Connection header correctly for websocket upgrades
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Local Langfuse upstream (Docker network service).
upstream langfuse_backend {
  server langfuse-web:3000;
}

server {
  # Nginx listens on container port 80 (mapped to host 5000 by compose)
  listen 80;
  server_name _;

  # Allow moderate payloads for API requests/uploads
  client_max_body_size 25m;

  # Preserve original request host/port/proto for upstream redirects and logs
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Observe entry from deployed UI points here; keep /observe UX.
  location = /observe {
    return 302 $scheme://$http_host/observe/;
  }

  # Local Langfuse now runs with root basePath. Strip /observe prefix before proxying.
  location ^~ /observe/ {
    rewrite ^/observe/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  # Root-path compatibility for deployments where Langfuse may still emit
  # non-/observe links (for example /project/* or /api/auth/*).
  location ^~ /project/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  location ^~ /organization/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  location ^~ /auth/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  location ^~ /_next/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  location = /icon.svg {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  location ^~ /api/public/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  location ^~ /api/auth/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  # Meko API server (Go backend). DIFFERENCE from meko_ui/deploy/nginx:
  # api_server runs in compose here, so target the in-network hostname.
  location ^~ /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    # Login returns multiple auth cookies; increase upstream header buffer.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;
    proxy_pass http://meko-api-server:25433;
  }

  # Keep any other /api/* requests on Langfuse while preserving /api/v1/* above for Meko.
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  # Fallback: everything else is served by Meko UI.
  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://meko-ui:5000/;
  }
}
