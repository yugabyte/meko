# This rule is not used by the project meko-provisioner itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over saas.mekodata.ai.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: meko-provisioner
    app.kubernetes.io/managed-by: kustomize
  name: mekouseraccount-admin-role
rules:
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts
  verbs:
  - '*'
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts/status
  verbs:
  - get
