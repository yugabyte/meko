---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts/finalizers
  verbs:
  - update
- apiGroups:
  - saas.mekodata.ai
  resources:
  - mekouseraccounts/status
  verbs:
  - get
  - patch
  - update
