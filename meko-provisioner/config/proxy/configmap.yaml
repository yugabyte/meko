apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-proxy-config
  namespace: meko-ingress
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/part-of: meko
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 10240;
        multi_accept on;
    }

    http {
        access_log /dev/stdout;
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        upstream_keepalive 64;

        map $host $account_id {
            ~^(?P<id>[^.]+)\. $id;
        }

        server {
            listen 8080;

            location /healthz {
                access_log off;
                return 200 "ok\n";
            }

            location / {
                set $target "mcp-server.tenant-${account_id}.svc.cluster.local:8000";

                proxy_pass http://$target;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Meko-Account-ID $account_id;
                proxy_set_header Connection "";

                proxy_connect_timeout 5s;
                proxy_read_timeout 60s;
                proxy_send_timeout 60s;

                proxy_next_upstream error timeout http_502 http_503;
                proxy_next_upstream_tries 2;
            }
        }
    }
