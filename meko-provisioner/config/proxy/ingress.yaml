apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-proxy
  namespace: meko-ingress
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/part-of: meko
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Replace with your ACM certificate ARN for *.mcp.mekodev.com
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-2:ACCOUNT_ID:certificate/REPLACE_ME"
spec:
  ingressClassName: alb
  rules:
  - host: "*.mcp.mekodev.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-proxy
            port:
              number: 8080
