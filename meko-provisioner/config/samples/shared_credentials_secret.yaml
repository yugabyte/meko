# Shared credentials for all tenant RAG workers.
# The meko-provisioner controller reads this Secret and copies the values
# into per-tenant Secrets in each tenant-{accountId} namespace.
#
# Apply once per cluster (the meko-system namespace must already exist):
#   kubectl apply -f config/samples/shared_credentials_secret.yaml
#
# In production, prefer an external secrets operator (e.g. External Secrets
# Operator, Vault Agent, Sealed Secrets) instead of storing values here.
apiVersion: v1
kind: Secret
metadata:
  name: meko-shared-credentials
  namespace: meko-system
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-replace-me"
  # Optional -- leave empty if using IAM Roles for Service Accounts (IRSA).
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
