[package]
name = "endpoint_supervisor"
version = "0.1.0"
edition = "2024"
license.workspace = true

# PID 1 of the endpoint pod: renders the daemons' config and supervises them.
# See `src/main.rs` for the module layout.
[[bin]]
name = "endpoint-supervisor"
path = "src/main.rs"

# Build-time tool, not shipped in the image: emits the override keys the daemons
# accept, for the controller API to validate against. Lives here because this is
# the crate that already depends on both daemons' config types.
[[bin]]
name = "dump-config-keys"
path = "src/bin/dump_config_keys.rs"

[dependencies]
anyhow.workspace = true
camino.workspace = true
# Only to type-check the rendered compute spec against what compute_ctl reads.
compute_api.workspace = true
libc.workspace = true
md5.workspace = true
serde_json.workspace = true
# The daemons' own config types: rendering is type-checked against what they
# parse, which is the point of doing this in Rust.
pageserver_api.workspace = true
# The daemons' HTTP control plane: their readiness endpoints, and the
# safekeeper's branch create.
reqwest = { workspace = true, features = ["blocking", "json"] }
# The settings API: the same server machinery the daemons serve their own
# control planes with, so one HTTP surface in this pod is not a second shape.
http-utils.workspace = true
hyper0.workspace = true
routerify.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio-util.workspace = true
safekeeper_api.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "sync"] }
toml_edit.workspace = true
tracing.workspace = true
# The write fence: the token store client, the wire types, and the deadline
# arithmetic — one definition shared with the daemons that enforce it.
utils.workspace = true
# `uuid` because `amp_registry.endpoints.id` is a `uuid` and the override read
# binds it as one — see registry.rs's QUERY.
uuid.workspace = true
ysql_client.workspace = true
metrics.workspace = true
once_cell.workspace = true
tracing-subscriber.workspace = true
workspace_hack.workspace = true

[dev-dependencies]
camino-tempfile.workspace = true
# A real certificate for the expiry gauge test, generated rather than checked in
# so a fixture cannot expire and fail the suite on a date nobody chose.
rcgen.workspace = true
# The compute spec's storage connection is deserialized into the type compute_ctl
# parses it with, so a wrong shape fails here rather than at the compute's startup.
remote_storage.workspace = true
serde = { workspace = true, features = ["derive"] }
