openapi: "3.0.2"
info:
  title: Endpoint Storage API
  description: Endpoint Storage API
  version: "1.0"
  license:
    name: "Apache"
    url: https://github.com/neondatabase/neon/blob/main/LICENSE
servers:
  - url: ""
paths:
  /status:
    description: Healthcheck endpoint
    get:
      description: Healthcheck
      responses:
        "200":
          description: OK

  /{branch_id}/{endpoint_id}/{key}:
    parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
      - name: endpoint_id
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      description: Get file from blob storage
      responses:
        "200":
          description: "File stream from blob storage"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Key escapes its branch/endpoint prefix
        "404":
          description: File was not found
    put:
      description: Insert file into blob storage. If file exists, override it
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File was inserted successfully
        "400":
          description: Key escapes its branch/endpoint prefix, or the body exceeds the size limit
