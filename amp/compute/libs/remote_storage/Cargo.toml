[package]
name = "remote_storage"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
async-stream.workspace = true
once_cell.workspace = true
base64.workspace = true
bytes.workspace = true
camino = { workspace = true, features = ["serde1"] }
humantime-serde.workspace = true
futures.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
toml_edit.workspace = true
tracing.workspace = true
scopeguard.workspace = true
metrics.workspace = true
utils = { path = "../utils", default-features = false }
pin-project-lite.workspace = true

futures-util.workspace = true
itertools.workspace = true
sync_wrapper = { workspace = true, features = ["futures"] }
md5.workspace = true
# YsqlClient + TLS connector. Lives in its own crate so the
# pageserver/safekeeper/controller can depend on the YSQL
# layer without pulling the whole remote_storage shell.
ysql_client.workspace = true
# YB smart-driver fork of tokio-postgres. yb_store talks directly
# to YB tables (blobs/wals) via this client; the higher-level
# reconnect / retry / prepared-statement caching lives in
# `ysql_client`.
yb-tokio-postgres.workspace = true
uuid.workspace = true

byteorder = "1.4"
rand.workspace = true

[dev-dependencies]
camino-tempfile.workspace = true
test-context.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["test-util"] }
