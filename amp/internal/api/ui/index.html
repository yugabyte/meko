<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>amp — control plane</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e3e8ee;
      --text: #1a2b3c;
      --muted: #6b7785;
      --accent: #ff6e42;
      --accent-ink: #ffffff;
      --accent-soft: #fff1ec;
      --ok: #1f9d6b;
      --ok-soft: #e7f6ef;
      --info: #2f6feb;
      --info-soft: #e9f0fe;
      --danger: #d64545;
      --danger-soft: #fbeaea;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: var(--info); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    header.topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand .logo {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .brand .logo .dot { color: var(--accent); }
    .brand .tag { color: var(--muted); font-size: 13px; }
    header.topbar .spacer { flex: 1; }
    header.topbar .docs-link { font-size: 13px; color: var(--muted); }

    main { max-width: 980px; margin: 0 auto; padding: 28px 24px 64px; }

    .crumbs { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .crumbs a { color: var(--muted); }
    .crumbs .sep { margin: 0 8px; opacity: 0.6; }

    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
    h2 { font-size: 16px; margin: 28px 0 12px; }
    .sub { color: var(--muted); margin: 0 0 20px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 14px; }
    .card-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .card-head h3 { margin: 0; font-size: 15px; }
    .card-head .spacer { flex: 1; }
    .card-body { padding: 16px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #fafbfc; }

    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 600; line-height: 1.6;
    }
    .badge.admin { background: var(--accent-soft); color: var(--accent); }
    .badge.main { background: var(--info-soft); color: var(--info); }
    .badge.rw { background: var(--ok-soft); color: var(--ok); }
    .badge.ro { background: var(--info-soft); color: var(--info); }
    .badge.muted { background: #eef1f4; color: var(--muted); }

    .id { color: var(--muted); }
    .id .short { color: var(--text); }
    button.copy {
      border: none; background: transparent; cursor: pointer; color: var(--muted);
      padding: 0 2px; margin-left: 2px; line-height: 0; vertical-align: middle;
    }
    button.copy svg { width: 12px; height: 12px; display: block; }
    button.copy:hover { color: var(--text); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      padding: 7px 13px; border-radius: 6px; font-size: 13px; font-weight: 500;
      cursor: pointer; line-height: 1;
    }
    .btn:hover { background: #f3f5f7; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { filter: brightness(0.96); }
    .btn:disabled { opacity: 0.55; cursor: default; }

    .inline-form { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    input[type="text"] {
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
      font-size: 13px; min-width: 200px; color: var(--text); background: var(--surface);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }

    .empty { color: var(--muted); padding: 18px 16px; font-size: 13px; }
    .muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }

    .pool { margin-top: 14px; }
    .pool .timelines { padding: 0; }
    .timeline { border-top: 1px solid var(--border); padding: 14px 16px; }
    .timeline:first-child { border-top: none; }
    .timeline .tl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .timeline .tl-name { font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 16px; flex-wrap: wrap; }
    .meta .k { color: var(--muted); }
    .endpoints { margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--border); }
    .endpoint { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 3px 0; }
    .endpoint .addr { font-family: ui-monospace, monospace; }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--danger-soft); color: var(--danger); border: 1px solid #f1c7c7;
      padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow);
      font-size: 13px; max-width: 80vw; display: none; z-index: 50;
    }
    #toast.ok { background: var(--ok-soft); color: var(--ok); border-color: #bfe6d3; }

    .spinner { color: var(--muted); padding: 24px 16px; font-size: 13px; }
    .section-actions { margin-bottom: 12px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">amp<span class="dot">.</span></span>
      <span class="tag">control plane</span>
    </div>
    <div class="spacer"></div>
    <a class="docs-link" href="/api/v1/docs" target="_blank" rel="noopener">API docs ↗</a>
  </header>
  <main id="app"><div class="spinner">Loading…</div></main>
  <div id="toast"></div>

  <script>
    "use strict";

    const API = "/api/v1";

    // --- tiny helpers --------------------------------------------------------

    const app = document.getElementById("app");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;

    function toast(msg, ok) {
      toastEl.textContent = msg;
      toastEl.classList.toggle("ok", !!ok);
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 4000);
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function shortId(id) {
      const s = String(id || "");
      return s.length > 8 ? s.slice(0, 8) : s;
    }

    // Inline clipboard glyph — an SVG (not a unicode codepoint) so it renders
    // identically everywhere, independent of installed fonts.
    const COPY_ICON =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="9" y="9" width="11" height="11" rx="2"/>' +
      '<path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

    // Render a uuid as a short, copyable chip.
    function idChip(id) {
      const s = esc(id);
      return `<span class="id mono" title="${s}"><span class="short">${esc(shortId(id))}</span>` +
        `<button class="copy" data-copy="${s}" title="Copy full id">${COPY_ICON}</button></span>`;
    }

    function fmtDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleString();
    }

    // REST call against the controller API. Throws Error(message) on non-2xx,
    // surfacing the API's {error:{code,message}} envelope when present.
    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(API + path, opts);
      const text = await res.text();
      let data = null;
      if (text) { try { data = JSON.parse(text); } catch (_) { /* non-JSON */ } }
      if (!res.ok) {
        const msg = data && data.error && data.error.message
          ? data.error.message
          : `${method} ${path} failed (${res.status})`;
        throw new Error(msg);
      }
      // A 2xx with no/garbled body would otherwise return null and blow up the
      // caller on data.users/u.id; surface it as a catchable error instead.
      if (res.status !== 204 && data === null) {
        throw new Error(`invalid or empty response from ${method} ${path}`);
      }
      return data;
    }

    // Lists are paginated; this UI is simple, so pull a generous single page.
    const PAGE = "?limit=1000";

    // --- data fetchers -------------------------------------------------------

    const listUsers     = () => api("GET", `/users${PAGE}`);
    const getUser       = (id) => api("GET", `/users/${id}`);
    const createUser    = (isAdmin) => api("POST", "/users", { is_admin: isAdmin });
    const listPools     = () => api("GET", `/storage-pools${PAGE}`);
    const createPool    = (name, owner) => api("POST", "/storage-pools", { name, owner_user_id: owner });
    const listTimelines = (poolId) => api("GET", `/storage-pools/${poolId}/timelines${PAGE}`);
    const createTimeline= (poolId, name) => api("POST", `/storage-pools/${poolId}/timelines`, { name });
    const listEndpoints = (poolId, tlId) => api("GET", `/storage-pools/${poolId}/timelines/${tlId}/endpoints${PAGE}`);
    const createEndpoint= (poolId, tlId, role) => api("POST", `/storage-pools/${poolId}/timelines/${tlId}/endpoints`, { role });

    // --- router --------------------------------------------------------------

    function route() {
      const hash = location.hash.replace(/^#/, "") || "/";
      const m = hash.match(/^\/users\/([0-9a-fA-F-]+)$/);
      if (m) return renderUser(m[1]);
      return renderHome();
    }

    function go(path) { location.hash = path; }

    // Wire copy-to-clipboard chips. Called after each (partial) render; the
    // dataset guard keeps it idempotent so re-renders don't stack listeners.
    function bind() {
      app.querySelectorAll("[data-copy]").forEach((el) => {
        if (el.dataset.bound) return;
        el.dataset.bound = "1";
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const v = el.getAttribute("data-copy");
          // clipboard is undefined outside secure contexts (plain HTTP, not
          // localhost); guard so the chip degrades instead of throwing.
          if (!navigator.clipboard) {
            toast("Copy needs HTTPS or localhost");
            return;
          }
          navigator.clipboard.writeText(v).then(
            () => toast("Copied id to clipboard", true),
            () => toast("Copy failed"));
        });
      });
    }

    // --- home: users ---------------------------------------------------------

    async function renderHome() {
      app.innerHTML = `<div class="spinner">Loading users…</div>`;
      let data;
      try { data = await listUsers(); }
      catch (e) { app.innerHTML = errorPanel(e.message); return; }

      const users = data.users || [];
      const rows = users.map((u) => `
        <tr class="clickable" data-user="${esc(u.id)}">
          <td>${idChip(u.id)}</td>
          <td>${u.is_admin ? '<span class="badge admin">admin</span>' : '<span class="badge muted">user</span>'}</td>
          <td class="nowrap muted">${fmtDate(u.created_at)}</td>
          <td class="nowrap"><a href="#/users/${esc(u.id)}">Open →</a></td>
        </tr>`).join("");

      app.innerHTML = `
        <h1>Users</h1>
        <p class="sub">Select a user to manage its storage pools, timelines, and endpoints.</p>

        <div class="card">
          <div class="card-head">
            <h3>Create user</h3>
          </div>
          <div class="card-body">
            <div class="inline-form">
              <label class="check"><input type="checkbox" id="new-admin" /> Admin</label>
              <button class="btn primary" id="create-user">Create user</button>
            </div>
          </div>
        </div>

        <div class="card" style="margin-top:18px">
          <div class="card-head">
            <h3>All users</h3>
            <div class="spacer"></div>
            <span class="muted">${data.total} total</span>
          </div>
          ${users.length ? `<table>
            <thead><tr><th>ID</th><th>Role</th><th>Created</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>` : `<div class="empty">No users yet. Create one above.</div>`}
        </div>`;

      document.getElementById("create-user").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        const isAdmin = document.getElementById("new-admin").checked;
        btn.disabled = true;
        try {
          const u = await createUser(isAdmin);
          toast("User created", true);
          go(`/users/${u.id}`);
        } catch (err) {
          toast(err.message); btn.disabled = false;
        }
      });

      app.querySelectorAll("tr[data-user]").forEach((tr) => {
        tr.addEventListener("click", () => go(`/users/${tr.getAttribute("data-user")}`));
      });
      bind();
    }

    // --- user detail: pools -> timelines -> endpoints ------------------------

    async function renderUser(userId) {
      app.innerHTML = `<div class="spinner">Loading user…</div>`;

      let user, allPools;
      try {
        [user, allPools] = await Promise.all([getUser(userId), listPools()]);
      } catch (e) {
        app.innerHTML = errorPanel(e.message, true);
        return;
      }

      // Pools are top-level and the list returns every pool; show the ones this
      // user owns (owner filtering is not yet an API feature).
      const pools = (allPools.storage_pools || []).filter((p) => p.owner_user_id === userId);

      app.innerHTML = `
        <div class="crumbs"><a href="#/">Users</a><span class="sep">/</span>${esc(shortId(userId))}</div>
        <h1>User ${esc(shortId(userId))}
          ${user.is_admin ? '<span class="badge admin">admin</span>' : ''}</h1>
        <p class="sub">${idChip(userId)} &nbsp;·&nbsp; created ${fmtDate(user.created_at)}</p>

        <h2>Storage pools</h2>
        <div class="section-actions">
          <div class="inline-form">
            <input type="text" id="new-pool" placeholder="New pool name" />
            <button class="btn primary" id="create-pool">Create pool</button>
          </div>
        </div>
        <div id="pools">
          ${pools.length
            ? pools.map(poolCard).join("")
            : `<div class="card"><div class="empty">This user owns no storage pools yet. Create one above.</div></div>`}
        </div>`;

      document.getElementById("create-pool").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        const input = document.getElementById("new-pool");
        const name = input.value.trim();
        if (!name) { toast("Enter a pool name"); return; }
        btn.disabled = true;
        try {
          await createPool(name, userId);
          toast("Pool created", true);
          renderUser(userId);
        } catch (err) { toast(err.message); btn.disabled = false; }
      });

      // Hydrate each pool's timelines (and their endpoints) independently.
      pools.forEach((p) => hydratePool(p.id, userId));
      bindPoolForms(userId);
      bind();
    }

    function poolCard(p) {
      return `
        <div class="card pool" data-pool="${esc(p.id)}">
          <div class="card-head">
            <h3>${esc(p.name)}</h3>
            <div class="spacer"></div>
            <span class="muted nowrap">${idChip(p.id)} · ${fmtDate(p.created_at)}</span>
          </div>
          <div class="card-body">
            <div class="inline-form">
              <input type="text" class="new-timeline" data-pool="${esc(p.id)}" placeholder="New timeline (database) name" />
              <button class="btn primary create-timeline" data-pool="${esc(p.id)}">Create timeline</button>
              <span class="muted">pg 17</span>
            </div>
          </div>
          <div class="timelines" id="tl-${esc(p.id)}">
            <div class="spinner">Loading timelines…</div>
          </div>
        </div>`;
    }

    function bindPoolForms(userId) {
      app.querySelectorAll(".create-timeline").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const poolId = btn.getAttribute("data-pool");
          const input = app.querySelector(`.new-timeline[data-pool="${poolId}"]`);
          const name = input.value.trim();
          if (!name) { toast("Enter a timeline name"); return; }
          btn.disabled = true;
          try {
            await createTimeline(poolId, name);
            toast("Timeline created", true);
            input.value = "";
            await hydratePool(poolId, userId);
          } catch (err) { toast(err.message); }
          btn.disabled = false;
        });
      });
    }

    async function hydratePool(poolId, userId) {
      const host = document.getElementById(`tl-${poolId}`);
      if (!host) return;
      let tldata;
      try { tldata = await listTimelines(poolId); }
      catch (e) { host.innerHTML = `<div class="empty">Failed to load timelines: ${esc(e.message)}</div>`; return; }

      const timelines = tldata.timelines || [];
      if (!timelines.length) {
        host.innerHTML = `<div class="empty">No timelines yet.</div>`;
        return;
      }
      host.innerHTML = timelines.map((t) => `
        <div class="timeline" id="tlrow-${esc(t.timeline_id)}">
          <div class="tl-head">
            <span class="tl-name">${esc(t.name)}</span>
            ${t.is_main ? '<span class="badge main">main</span>' : ''}
            <span class="badge muted">pg ${esc(t.pg_version)}</span>
          </div>
          <div class="meta">
            <span><span class="k">tenant</span> ${idChip(t.tenant_id)}</span>
            <span><span class="k">timeline</span> ${idChip(t.timeline_id)}</span>
            <span><span class="k">created</span> ${fmtDate(t.created_at)}</span>
          </div>
          <div class="endpoints" id="ep-${esc(t.timeline_id)}">
            <div class="muted" style="font-size:12px">Loading endpoints…</div>
          </div>
        </div>`).join("");

      bind();
      // Endpoints per timeline, in parallel.
      timelines.forEach((t) => hydrateEndpoints(poolId, t.timeline_id));
    }

    async function hydrateEndpoints(poolId, tlId) {
      const host = document.getElementById(`ep-${tlId}`);
      if (!host) return;
      let data;
      try { data = await listEndpoints(poolId, tlId); }
      catch (e) { host.innerHTML = `<div class="muted" style="font-size:12px">Failed to load endpoints: ${esc(e.message)}</div>`; return; }

      const eps = data.endpoints || [];
      const list = eps.length
        ? eps.map((ep) => {
            const cls = ep.role === "read_write" ? "rw" : "ro";
            const label = ep.role === "read_write" ? "read-write" : "read-only";
            // Demo-only: every endpoint uses the fixed cloud_admin default.
            const conn = `postgresql://cloud_admin:cloud_admin@${ep.address}/postgres`;
            return `<div class="endpoint">
              <span class="badge ${cls}">${label}</span>
              <span class="addr">${esc(ep.address)}</span>
              ${idChip(ep.id)}
              <div class="cred" style="font-size:12px; margin-top:4px; color:var(--muted)">
                user <code>cloud_admin</code> · password <code>cloud_admin</code> · db <code>postgres</code>
                <button class="copy" data-copy="${esc(conn)}" title="Copy connection string">${COPY_ICON}</button>
              </div>
            </div>`;
          }).join("")
        : `<div class="muted" style="font-size:12px">No endpoints yet.</div>`;
      // Compute is provisioned in a separate, synchronous step: the controller
      // Helm-deploys the endpoint pod and waits for it to be ready before the
      // call returns (so the button blocks for the duration).
      const provision = `
        <div class="inline-form" style="margin-top:8px">
          <select class="ep-role" aria-label="endpoint role">
            <option value="read_write">read-write</option>
            <option value="read_only">read-only</option>
          </select>
          <button class="btn create-endpoint" data-pool="${esc(poolId)}" data-timeline="${esc(tlId)}">Provision compute</button>
        </div>`;
      host.innerHTML = list + provision;
      bind();

      const epBtn = host.querySelector(".create-endpoint");
      if (epBtn) {
        epBtn.addEventListener("click", async () => {
          const role = host.querySelector(".ep-role").value;
          const prev = epBtn.textContent;
          epBtn.disabled = true;
          epBtn.textContent = "Provisioning… (~30–60s)";
          try {
            await createEndpoint(poolId, tlId, role);
            toast("Endpoint provisioned", true);
            await hydrateEndpoints(poolId, tlId);
          } catch (err) {
            toast(err.message);
            epBtn.disabled = false;
            epBtn.textContent = prev;
          }
        });
      }
    }

    // --- error panel ---------------------------------------------------------

    function errorPanel(msg, withBack) {
      return `<div class="card"><div class="card-body">
        ${withBack ? '<div class="crumbs"><a href="#/">← Users</a></div>' : ''}
        <strong>Something went wrong.</strong>
        <p class="muted">${esc(msg)}</p>
      </div></div>`;
    }

    // --- boot ----------------------------------------------------------------

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
