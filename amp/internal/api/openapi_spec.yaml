openapi: 3.0.3

info:
  title: amp controller API
  version: 0.1.0
  description: |
    Control-plane REST API for the **amp controller** (yblight-controller): the
    control plane for a single placement group. See `amp/architecture/`.

    The resource ladder is **storage pool → timeline → endpoint**. Users are a
    basic, *unauthenticated* notion of an identity; there is no auth yet (the
    user/grant model is designed but authentication is deferred).

    - **Users** — created and fetched by id, and listed. A user owns the storage
      pools it creates.
    - **Storage pools** — *top-level* resources (not nested under a user): any
      user can create a pool (passing its `owner_user_id`) and becomes its owner.
      Pool sharing (pool grants) is out of scope here, but a pool is addressed by
      its own id because multiple users will eventually act on it. Listing
      returns every pool.
    - **Timelines** — create / list / delete / branch a timeline in a pool.
      *Create* provisions the control-plane record: it creates a tenant (a
      "database") and its main timeline under the pool and returns their
      storage-layer ids (`tenant_id`, `timeline_id`). *Delete* and *branch* are
      still **logged only** (202): the write-ahead task framework that will
      execute them is not yet wired up.
    - **Endpoints** — the compute bound to a timeline; listed under the timeline.

    **Pagination.** List endpoints take `limit` and `offset` query parameters
    (values outside the documented range are clamped) and return a `total` (the
    count of *all* matching items, ignoring `limit`/`offset`) alongside a `count`
    (the number of items in *this* response).

    Every non-2xx response uses the same `Error` envelope. `500` is possible on
    any operation; it is documented per operation so generated clients get a
    typed handle.

    The spec is the source of truth: server stubs and the Go client are
    generated from this file (`oapi-codegen`), and the controller serves both
    this document (`GET /api/v1/openapi.yaml`) and an interactive explorer
    (`GET /api/v1/docs`).

servers:
  - url: /api/v1
    description: Versioned API root (the controller serves the API under /api/v1).

tags:
  - name: users
    description: A basic, unauthenticated notion of a user.
  - name: storage-pools
    description: Storage pools (≈ a Meko datapack); top-level, created and owned by a user.
  - name: timelines
    description: Timelines (PG clusters) in a pool. Create is real; delete/branch are logged only for now.
  - name: endpoints
    description: Compute endpoints bound to a timeline.
  - name: tasks
    description: Status of long-running operations (the write-ahead task log).

paths:
  /users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: Creates a user and returns it. No authentication; the new id is how a caller addresses resources as this user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools:
    post:
      tags: [storage-pools]
      operationId: createStoragePool
      summary: Create a storage pool
      description: Creates a storage pool owned by the user named in `owner_user_id`. Pool names are unique across the placement group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoragePoolRequest'
      responses:
        '201':
          description: Storage pool created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [storage-pools]
      operationId: listStoragePools
      summary: List storage pools
      description: Lists every storage pool in the placement group. Owner filtering is out of scope for now (pool sharing is deferred).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of storage pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePoolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
    get:
      tags: [storage-pools]
      operationId: getStoragePool
      summary: Get a storage pool
      responses:
        '200':
          description: The storage pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/timelines:
    parameters:
      - $ref: '#/components/parameters/PoolId'
    post:
      tags: [timelines]
      operationId: createTimeline
      summary: Create a tenant and its main timeline in a pool
      description: |
        Creates a tenant (a "database") in the pool together with its main
        timeline (a PG cluster), and returns their storage-layer ids
        (`tenant_id`, `timeline_id`). The name is unique within the pool. Returns
        404 if the pool does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimelineRequest'
      responses:
        '201':
          description: Tenant and main timeline created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [timelines]
      operationId: listTimelines
      summary: List the timelines in a pool
      description: Lists the timelines across all tenants in the pool. Returns 404 if the pool does not exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of timelines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/timelines/{timelineId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/TimelineId'
    delete:
      tags: [timelines]
      operationId: deleteTimeline
      summary: Delete a timeline (logged only)
      description: Records the intent to delete a timeline and returns 202. Logged only for now (see createTimeline); the timeline is not validated.
      responses:
        '202':
          description: Request accepted and logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/timelines/{timelineId}/branch:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/TimelineId'
    post:
      tags: [timelines]
      operationId: branchTimeline
      summary: Branch (fork) a timeline into a new timeline (logged only)
      description: |
        Records the intent to fork the addressed timeline into a new branch
        timeline under the same tenant, and returns 202. Branching is explicit
        (it is not part of timeline create). Logged only for now; the parent
        timeline is not validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchTimelineRequest'
      responses:
        '202':
          description: Request accepted and logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/timelines/{timelineId}/endpoints:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/TimelineId'
    get:
      tags: [endpoints]
      operationId: listEndpoints
      summary: List the endpoints bound to a timeline
      description: Lists the compute endpoints bound to the timeline. Returns 404 if the pool or timeline does not exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get the status of a task
      description: Returns the status of a write-ahead task so a caller can poll a long-running operation.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: The user's id.
      schema:
        type: string
        format: uuid
    PoolId:
      name: poolId
      in: path
      required: true
      description: The storage pool's id.
      schema:
        type: string
        format: uuid
    TimelineId:
      name: timelineId
      in: path
      required: true
      description: The timeline's id.
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      description: The task's id.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Clamped to 1..1000; defaults to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip from the start of the result set. Negative values are clamped to 0.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with existing state (e.g. a duplicate name).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: An unexpected error occurred serving the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    User:
      type: object
      required: [id, is_admin, created_at]
      properties:
        id:
          type: string
          format: uuid
        is_admin:
          type: boolean
          description: Admins skip all pool/tenant grants. Until auth lands, anyone may create an admin.
        created_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      properties:
        is_admin:
          type: boolean
          default: false
          description: Create the user as an admin.

    UserList:
      type: object
      required: [users, total, count]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    StoragePool:
      type: object
      required: [id, name, owner_user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    StoragePoolList:
      type: object
      required: [storage_pools, total, count]
      properties:
        storage_pools:
          type: array
          items:
            $ref: '#/components/schemas/StoragePool'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateStoragePoolRequest:
      type: object
      required: [name, owner_user_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: Pool name; unique across the placement group.
        owner_user_id:
          type: string
          format: uuid
          description: The user that will own the pool.

    CreateTimelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Tenant (database) name; unique within the pool. Also names the main timeline.
        pg_version:
          type: integer
          description: Postgres major version for the timeline's cluster. Defaults to 17.

    Timeline:
      type: object
      required: [tenant_id, timeline_id, name, pg_version, is_main, created_at]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: The storage-layer tenant id this timeline belongs to.
        timeline_id:
          type: string
          format: uuid
          description: The storage-layer timeline id.
        name:
          type: string
        pg_version:
          type: integer
        is_main:
          type: boolean
          description: True for a tenant's root (main) timeline.
        created_at:
          type: string
          format: date-time
        endpoint:
          description: The compute endpoint provisioned for the timeline, when endpoint deployment is enabled. Connect to its address with psql (user cloud_admin, database postgres).
          $ref: '#/components/schemas/Endpoint'

    TimelineList:
      type: object
      required: [timelines, total, count]
      properties:
        timelines:
          type: array
          items:
            $ref: '#/components/schemas/Timeline'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    Endpoint:
      type: object
      required: [id, role, address]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [read_write, read_only]
        address:
          type: string
          description: 'host:port for the Postgres wire protocol.'

    EndpointList:
      type: object
      required: [endpoints, total, count]
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    BranchTimelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Name for the new branch timeline.

    OperationAck:
      type: object
      required: [acknowledged, detail]
      properties:
        acknowledged:
          type: boolean
          description: Always true; the request was accepted and logged.
        detail:
          type: string
          description: Human-readable note about what was logged.

    Task:
      type: object
      required: [id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        tenant_id:
          type: string
          format: uuid
          nullable: true
        target_ref:
          type: string
          nullable: true
        params:
          description: The originating request, as opaque JSON.
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TotalCount:
      type: integer
      description: The number of items matching the request across all pages (ignores limit/offset).

    PageCount:
      type: integer
      description: The number of items returned in this response (this page).

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
