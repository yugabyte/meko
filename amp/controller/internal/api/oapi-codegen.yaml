# oapi-codegen configuration. The spec (openapi_spec.yaml) is the source of
# truth; this generates the request/response models, the echo strict-server
# interface the controllers implement, and the Go client the tests drive.
#
# Regenerate with `make controller-generate` (or `go -C controller generate ./...`).
package: api
output: api.gen.go
generate:
  models: true
  echo-server: true
  strict-server: true
  client: true
output-options:
  skip-prune: true
