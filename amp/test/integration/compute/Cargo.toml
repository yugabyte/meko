# Integration test harness. A driver binary (not a `cargo test` target):
# the suite shares one cluster across all scenarios and must run them in
# a fixed order with a corruption-marker gate after each, which the
# default test harness (parallel, unordered) can't express. Invoked as
# `cargo run -p integration_tests -- fast|slow|all`, or via `test/integration/compute/run.sh`.
[package]
name = "integration_tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "integration_tests"
path = "main.rs"

[dependencies]
integration_common = { path = "../libs/integration_common" }
anyhow.workspace = true
nix.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
tokio-postgres.workspace = true
reqwest = { workspace = true, features = ["json"] }
# Direct pageserver GetPage@LSN testing (direct_getpage* scenarios).
pageserver_client_grpc.workspace = true
pageserver_page_api.workspace = true
pageserver_api.workspace = true
utils.workspace = true
bytes.workspace = true
# Direct safekeeper WAL reads over physical replication (sk_wal scenario).
postgres-protocol.workspace = true
futures.workspace = true
# Crafting tricky WAL-end shapes (crafted_wal_end scenario); the wal_craft
# Crafter API takes the sync `postgres` client.
wal_craft = { path = "../../../compute/libs/postgres_ffi/wal_craft" }
postgres.workspace = true
workspace_hack.workspace = true
