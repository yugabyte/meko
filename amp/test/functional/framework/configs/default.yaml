# ampqa canonical defaults — the ONE place every framework default lives.
#
# Embedded into the binary (configs/configs.go) and loaded first as layer zero.
# Precedence (later wins): embedded default.yaml → -c files (deep-merged, in
# order) → -jc JSON files → -o typed key=value overrides.
#
# Every default the code reads lives here (core/defaults_test.go asserts this).
# A commented-out key, or a struct field with no key, has no sensible default:
# the owning provider/task requires the caller to set it (e.g. env.sharedk8s.context).
# --no-default-config skips this file entirely (debugging only).

# owner is stamped as the yb_owner ownership tag/label on every cloud resource
# this framework creates (apps/cloud/aws, apps/cloud/gcp, apps/yba universe
# instance tags) and used as the resource name prefix. The dev-account
# governance SCP conditions RunInstances on yb_owner being present, so the tag
# itself is mandatory — only its value is configurable. Override per run with
# -o owner=<name> (e.g. your username) to make resources identifiable as yours.
owner: "ampqa"

# --- Scheduler (sched/scheduler.go, sched/lease.go) ---
sched:
  # Total environments that may exist at once across the whole run.
  capacity: 8
  # cluster_slots caps the stacks self-provisioning tests (EnvSpec.ClusterSlots:
  # a benchmark with its live arm takes 6) stand up on the run's k8s cluster,
  # across EVERY run pointed at it, via the ConfigMap default/ampqa-cluster-slots.
  # A test waits for its slots before its body and its timeout start. Only runs
  # naming a cluster (apps.ybk8s.kubecontext/kubeconfig, env.ampstack.context,
  # env.sharedk8s.context) take part. 0 turns the cap off.
  cluster_slots:
    capacity: 12
  # Worker-pool size (default for --parallel; an explicit flag wins).
  parallel: 1
  # SHARED tests packed onto one shared env (default for --per-env-parallelism).
  per_env_parallelism: 4
  # Extra attempts after a SCHEDULING-CLASS env failure (unschedulable,
  # insufficient cpu/memory, PV node affinity, readiness timeout), a failed
  # provision_yba create-universe task, or an attested harness port-forward
  # drop. The drop case re-runs the whole body, so a retried long test costs its
  # budget twice. 0 = off.
  env_retries: 1
  # Pause before a retry — 60s ≈ a GKE node add.
  env_retry_backoff: 60s
  # Lease weight per env Shape (used when a test's EnvSpec sets no Weight).
  # Shapes not listed fall back to 1 (2 for dedicated_stack).
  weights:
    single_container: 1
    shared_control_plane: 1
    dedicated_stack: 2
    remote: 1
    universe: 1

# --- Per-test / lifecycle timeouts (core/timeouts.go, core/lifecycle.go) ---
# time.ParseDuration strings (bare numbers = seconds).
timeouts:
  # Category default test-body timeout (when a Test sets none).
  functional: 10m
  stress: 60m
  # Sized for perf.provisions=3 fresh-stack repeats of the heaviest workload
  # (tpcc: ~20m per provision).
  perf: 150m
  long_running: 24h
  # EnvProvider.Provision deadline (a pod wait pays a node add + image pull).
  # Single-node budget. Left UNSET-equivalent on purpose: when
  # env.yb_deploy=yb_k8s the effective default scales with the store's node
  # count (10m base + 2m30s per node beyond the first — 3 nodes 15m, 6 nodes
  # 22m30s), because a 3-node store + control plane + endpoint died at exactly
  # 10m00s while a stuck single-node run should still fail fast. Setting a
  # value here overrides the scaling verbatim.
  # provision: 10m
  # Provision deadline for a Shape: DedicatedStack test, whose provision stands
  # up its own backing (YBA + universe under the yba backing) and control plane
  # before the cluster: ~16m on amp-dev when nothing is queued.
  provision_dedicated: 45m
  # EnvProvider.Teardown deadline (runs even after a body timeout, own budget).
  teardown: 5m
  # Environment.Collect deadline (best-effort, before teardown).
  collect: 2m
  # Factor applied to EVERY provisioning wait above (provision,
  # provision_dedicated, endpoint_create). One knob for a slow or contended
  # cluster, instead of raising each constant. <= 0 reads as 1.0.
  provision_multiplier: 1.0
  # Wait on one endpoint's compute becoming ready. A cold create waits on a
  # freshly autoscaled node and a multi-GB image pull: 10 to 19 minutes observed
  # on amp-dev (meko#698) against a warm median of seconds. The ceiling is the
  # controller's own 35m deploy budget (apps.ampstack.deploy_timeout), past
  # which a create that cannot schedule fails by itself, so anything between
  # 20m and 35m only trades detection speed for flakiness.
  endpoint_create: 20m

# --- Environment providers ---
env:
  # yb_deploy: the run-level selector for the YugabyteDB the amp control plane sits
  # on, applied by the sharedk8s/exclusivek8s providers via apps/ybdeploy.
  # Precedence: this knob (when non-empty) OVERRIDES a test's PreferredYBDeploy
  # hint, which overrides the built-in default. Empty → honour the test's
  # preference, else builtin_yugabyted. Values:
  #   "" / builtin_yugabyted → ampstack deploys its own single-node yugabyted.
  #   external        → a cluster owned elsewhere, from env.ampstack.backing.*.
  #   yb_k8s          → a YugabyteDB deployed into k8s (apps.ybk8s.*), co-located.
  #   yb_pod          → a yugabyted-in-pod from the release TARBALL (apps.ybpod.*),
  #                     co-located; image-promotion-independent (unlike yb_k8s).
  #   yba_universe    → attach env.universe.yba.universe, else create from
  #                     functional.yba.create_spec (apps/yba).
  #   yba_provisioned → stand up an owned YBA + universe (env.universe provision_yba).
  # A shared control plane (sharedk8s deploy mode) serves every test off one
  # deployment, so its selection is knob-only — a per-test preference cannot apply.
  # Empty → the built-in single-node yugabyted, unless a caller sets the knob.
  # The amp run pipeline selects the backing per YB_BACKING (default yba →
  # a YBA-provisioned kubernetes universe — RF=1 while the path is validated,
  # apps.yba.k8s.replication_factor to raise — wiring the kubeconfig + quay
  # pull secrets that provisioning needs); it sets env.yb_deploy=yba_provisioned
  # itself for that branch. A framework-wide yba_provisioned default is wrong
  # here — it would force a doomed YBA attempt on runs that carry no YBA creds.
  yb_deploy: ""
  # stack: move every control-plane test between the two stack shapes for one
  # run — "dedicated" gives each test its own backing and control plane,
  # "shared" packs them onto the run-scoped one. Empty keeps what each test
  # declares (stress and perf tests declare dedicated, features shared).
  stack: ""

  # env/sharedk8s: cluster-per-test on a control plane.
  # controller_url/context/namespace/user_id/pool_id: no default —
  # Configured() is true only once controller_url or context (deploy: a context)
  # is set.
  #   deploy (dynamic default): when true this provider self-builds ONE
  #     run-scoped amp control plane (the same ampstack the exclusivek8s provider
  #     and deploy-amp task build, read from env.ampstack.* below) in an owned
  #     ampqa-labelled namespace, and carves clusters out of it — "self-building
  #     k8s". When false it ATTACHES to a standing control plane. Defaults on
  #     unless a standing controller is already configured (controller_url or a
  #     namespace to attach to), so a bare kube-context self-builds and
  #     `run --env <id>` attaches.
  #   deploy_timeout (dynamic default): bounds the one-time control-plane
  #     bring-up (rooted in a background deadline, NOT a per-test provision
  #     timeout, since the control plane must outlive any single Provision).
  #     Defaults to env.ampstack.yb_ready_timeout + controller_ready_timeout + 2m.
  sharedk8s:
    controller_service: "amp-controller"
    controller_port: 8080
    endpoint_port: 55433
    # 0 → kubectl auto-allocates each local forward port (parallel-safe); a
    # positive value restores the legacy deterministic base/base+1 scheme.
    local_port_base: 0
    pool_name: "ampqa"
    controller_ready_timeout: 2m
    pg_ready_timeout: 3m

  # apps/ampstack: the amp control-plane App, driven by the deploy/status/
  # teardown-amp tasks and composed by exclusivek8s.
  # namespace: no default (Deploy requires it). context: empty → current
  # kube-context. storage_class empty → endpoint /data is an emptyDir.
  # pull_secret_b64 empty → auth is assembled per the registry knob below.
  ampstack:
    # The controller helm chart ships in this repo; the default resolves from
    # the module dir (test/functional) where ampqa runs. Override for
    # out-of-tree charts, or set controller_manifest for a pre-rendered deploy.
    controller_chart: "../../deploy/helm/yb-amp-controller"
    # Where bare image refs resolve and which auth the pull secret carries:
    # quay (default; quay.io/yugabyte/amp-*), ecr (the minted ECR login), or
    # ghcr (ghcr.io/yugabyte/amp-*; token from ghcr_token or the local
    # `gh auth token`). Fully-qualified refs always win over this knob.
    registry: "quay"
    # GiB of endpoint memory per vCPU the deployed control plane enforces: it
    # fills in the memory when a create names only cpu, and is the floor every
    # create and resize is held to. The product's own is 8; these clusters run 2
    # because the perf and scale suites pack many small endpoints and scale_tenants
    # alone would reserve hundreds of GiB at the product shape. Raise it to
    # exercise what real endpoints get, at the cost of what those suites can fit.
    endpoint_memory_gib_per_vcpu: 2
    # Pinned to known-good tags; bump as new builds publish, and keep the pair
    # from one build: the chart in the controller image names the libraries the
    # endpoint image must ship. custom-99ef0d8ddbe9 is the first build that bakes
    # pgsentinel (#1446), which pg_extensions_matrix requires. Tags before #280
    # (custom-4f1ca53, custom-0e2131d) ran the storage controller as a separate
    # subprocess that crash-loops on "Insecure config!", so avoid them. The ecr
    # flavor's equivalents, amp/controller:tailnet-mig0010 and
    # amp/endpoint:phase1-20260703-154251, predate pgsentinel: a `registry: ecr`
    # run without an image override fails pg_extensions_matrix on it until those
    # are rebuilt.
    controller_image: "amp-controller:custom-99ef0d8ddbe9"
    endpoint_image: "amp-endpoint:custom-99ef0d8ddbe9"
    # quay.io robot credentials for the pull secret (custom/release builds
    # pushed by the amp build pipeline live there). Empty -> no quay auth.
    # quay_token is redacted from the recorded config snapshot and masked in
    # logs (core/secret.go), so it never reaches the report portal.
    quay_user: ""
    quay_token: ""
    # ghcr credentials; token empty falls back to the local `gh auth token`
    # when a ghcr image needs pulling. User empty -> "oauth".
    ghcr_user: ""
    ghcr_token: ""
    # yb_image: the built-in yugabyted image. A fully-qualified ref always wins.
    # Empty (default) → derived version-aware as "<yb_image_registry>:<version>"
    # where version is versions.yb (run override) or ampstack.DefaultYBVersion.
    # NOT versions.yugabytedb: that is the awsvm provisioners' LTS pin, and amp's
    # endpoint needs a tserver carrying ThinClientService (2026.1.2 and later).
    # yb_image_registry: the registry+repo the derived image uses. PREVIEW trains
    # (odd 2.N builds) live at the PRIVATE quay.io/yugabyte/yugabyte-itest — to run
    # a preview build set yb_image_registry there, versions.yb to the -bNNN build,
    # and quay_user/quay_token (the pull secret then lands on the StatefulSet).
    # (No auto-switch by train parity — the registry is always explicit.)
    yb_image: ""
    # quay itest carries unreleased builds; Docker Hub does not.
    yb_image_registry: "quay.io/yugabyte/yugabyte-itest"
    yb_storage: "20Gi"
    # BUILT-IN yugabyted PVC class (storage_class is the endpoints'). Needs a
    # WaitForFirstConsumer class; "" falls back to the cluster default.
    yb_storage_class: "standard-rwo"
    db_name: "yb_storage"
    # backing: where the control plane's YugabyteDB lives.
    #   builtin_yugabyted (default) → ampstack deploys the single-node yugabyted
    #     and wires the controller at it.
    #   external → ampstack deploys NO yugabyted; it ensures yb_storage on a
    #     cluster owned elsewhere and points controller+endpoints at it (teardown
    #     never touches it). host_ports (CSV of tserver host:port) required;
    #     user/db_name/sslmode default to yugabyte/yb_storage/disable. List every
    #     tserver: the whole CSV reaches both the endpoints and the controller's
    #     own DSN, so the controller has somewhere to fail over to when one pod
    #     goes. (This is hardening, not the fix for the control-plane stall in
    #     https://github.com/yugabyte/meko/issues/961 — that was the pool holding
    #     sockets to a departed pod.)
    # admin_host_ports: coordinator-reachable CSV used ONLY for the one-shot
    #   CREATE DATABASE; empty → host_ports. Set only for co-located YB-in-k8s
    #   where host_ports is an in-cluster name this coordinator cannot resolve.
    backing:
      mode: "builtin_yugabyted"
      host_ports: ""
      user: ""
      db_name: ""
      password: ""
      sslmode: ""
      admin_host_ports: ""
    # tls: the controller and every endpoint authenticate to the backing with
    # cert-manager client certificates from issuer_name (the trust root
    # deploy/tls/trust-root.sh stands up; ca_configmap is its bundle). Needs an
    # external backing that accepts them (apps.ybk8s.tls.enabled). Endpoints
    # connect as storage_role, the CN of their certificate. Off by default.
    tls:
      enabled: false
      issuer_kind: "ClusterIssuer"
      issuer_name: "amp-ca"
      issuer_group: "cert-manager.io"
      ca_configmap: "amp-ca-bundle"
      storage_role: "amp_storage"
    # The controller's own endpoint deploy budget (AMP_DEPLOY_TIMEOUT, helm
    # --wait). The binary default is 10m — sized for a warm single-node cluster;
    # a multi-node backing's first endpoint (node scale-up + multi-GB pull)
    # needs more. Empty = leave the binary default.
    #
    # 20m was not enough: an endpoint requests 40Gi ephemeral storage against
    # ~43.8Gi allocatable per node, so one lands per node and a cold tenant
    # waits on a freshly autoscaled node — ~15m observed on amp-dev, which
    # leaves 20m no headroom for the image pull behind it.
    deploy_timeout: 35m
    # true → install the helm shim that strips --create-namespace (needed until
    # a controller image built without that flag ships).
    helm_shim: true
    mcp_enabled: false
    ui_enabled: false
    ecr_registry: "454529406029.dkr.ecr.us-west-2.amazonaws.com"
    region: "us-west-2"
    pull_secret_name: "pull-secret"
    controller_service: "amp-controller"
    controller_container: "controller"
    controller_name: "amp-controller"
    controller_port: 8080
    endpoint_service_type: "ClusterIP"
    controller_expose: "none"
    helm_release: "yb-amp-controller"
    # How the controller is reached once deployed:
    #   tailnet (default) — resolve its cluster-internal address (ClusterIP, then
    #     pod IP) and talk direct; if neither answers (cluster ranges not
    #     routable from the coordinator) it falls back to the exec relay, and
    #     only when the relay pod cannot come up to a kubectl port-forward.
    #   exec — always carry controller HTTP over `kubectl exec` + curl through
    #     the relay pod: no local socket, so nothing that dies mid-run.
    #   portforward — always use the kubectl port-forward (reconnected on death).
    controller_reach: "tailnet"
    # The relay pod's image; must carry curl. Default: the same public image
    # the perf client pods run, already pullable on every suite cluster.
    relay_image: "eclipse-temurin:21-jdk"
    # 0 → kubectl auto-allocates the port-forward local port.
    local_port: 0
    yb_ready_timeout: 20m
    controller_ready_timeout: 5m

  # env/universe: a YugabyteDB universe used directly as the test TARGET (not the
  # amp control plane). Off unless env.universe.mode is set.
  #   mode (no default): attach_yba (existing YBA universe by name/id),
  #     attach_address (host:port list), provision_yugabyted (fresh yugabyted on
  #     ssh nodes), provision_yba (stand up our own YBA in k8s [apps.ybastack.*],
  #     create a provider+universe [apps.yba.*], always owned — teardown deletes
  #     the universe then the YBA).
  #   attach_yba.*: url/api_token/customer_uuid/universe required; insecure_tls
  #     defaults true (YBA is commonly self-signed).
  #   attach_address.addresses: "host:port" list (host alone takes ysql_port).
  #   provision_yugabyted.*: hosts required; ssh_*/install_dir/base_dir/data_dir/
  #     rf optional (yugabyted defaults apply).
  universe:
    # owned (attach_yba only): true → Teardown DELETES the universe. Default
    # false so an attached (someone else's) universe is never destroyed.
    owned: false
    ysql_port: 5433
    yba:
      insecure_tls: true
    yugabyted:
      rf: 0

  # env/vm: N cloud VMs as a bare cluster HOST. Cloud-agnostic: cloud selects the
  # driver; per-cloud instance settings live under apps.cloud.<cloud>.*.
  vm:
    # aws (default; the only Wave-1 driver), later gcp/azure. An unimplemented
    # cloud fails fast. node_count/instance_type are read from env.awsvm.* below;
    # set env.vm.node_count/env.vm.instance_type here to override.
    cloud: "aws"

  # env.awsvm: node-set knobs for the env/vm host (documented home + back-compat
  # alias of env.vm.node_count/env.vm.instance_type). AWS instance settings come
  # from apps.cloud.aws.*.
  awsvm:
    # Instances to launch (minimal RF=3 host is 3).
    node_count: 3
    # empty → inherit the driver default (aws m7g.xlarge).
    instance_type: ""

  # env/exclusivek8s: namespace-per-test dedicated stack.
  # context: no default (Configured() true only once set). helm_chart/
  # helm_values/controller_image/controller_manifest/pull_secret_b64: no default
  # (one of helm_chart or controller_manifest must be set).
  exclusivek8s:
    namespace_prefix: "ampqa"
    pull_secret_name: "pull-secret"
    # Empty → exclusivek8s.DefaultYBImage, the pinned build (never `latest`: the
    # pod pulls IfNotPresent). Set a fully-qualified ref to override.
    yb_image: ""
    yb_storage: "20Gi"
    helm_release: "amp-controller"
    controller_service: "amp-controller"
    controller_port: 8080
    # "" inherits apps/ampstack's default (tailnet: direct if reachable, else a
    # port-forward); "portforward" always uses the kubectl forward.
    controller_reach: ""
    # 0 lets kubectl pick each local port; a fixed base collides with anything
    # already holding it, including a second run on the same machine.
    local_port_base: 0
    yb_ready_timeout: 20m
    controller_ready_timeout: 5m
    # Rolling an already-deployed controller cannot assume a warm node the way the
    # initial deploy can: a long-lived env may have scaled its pool down.
    controller_roll_timeout: 20m

# --- Functional suite (suites/features) ---
# The backing shape and workload knobs the tests that stand up their own backing
# read (also the StandUp path behind `ampqa setup` and the presets suite). Those
# tests self-provision real infra, so they need env.ampstack.controller_chart and
# their shape's own config present.
functional:
  # Backing-cluster host shape (awsvm tests); override env.awsvm.*/apps.cloud.aws.*.
  nodes: 3
  instance_type: ""
  # IP nodes advertise / the coordinator reaches YSQL at: "private" or "public".
  advertise: "private"
  # Workload shape: rows per table. Small = cheap.
  rows_per_table: 2000
  # Bounded parallelism across namespaces.
  concurrency: 4
  # amp cluster/endpoint PG version (0 → the controller chooses).
  pg_version: 0
  # Backing-cluster runtime layout on the bare awsvm AMI (no YugabyteDB baked in).
  #   install_dir empty + deploy true (defaults) → deploy the versions.yugabytedb
  #     artifact onto every node, use its extracted dir as install_dir.
  #   install_dir set → deploy SKIPPED (pre-baked-AMI path).
  #   deploy false + install_dir empty → binaries assumed on PATH.
  # base_dir is yugabyted's --base_dir only; empty → yugabyted default
  # (/home/ec2-user/yugabyte-data — must NOT default under /root).
  cluster:
    install_dir: ""
    deploy: true
    deploy_dir: "/home/ec2-user/yb-software"
    data_dir: ""
    base_dir: ""
    rf: 0
    ysql_port: 5433
  # features/amp_tls_ca_rotation: rehearse a CA rotation (runbooks/tls.md) on a
  # TLS stack (apps.ybk8s.tls + env.ampstack.tls). It adds a root to
  # roots_configmap, repoints the configured ClusterIssuer at it, renews every
  # leaf and rolls the database, then restores the issuer. That rewrites
  # cluster-wide trust, so it stays off unless the run owns the issuer — and
  # `enabled: true` is not enough on its own: the rehearsal also refuses the
  # cluster-wide default `env.ampstack.tls.issuer_name: amp-ca`, because a
  # ClusterIssuer is shared with every other stack in the cluster and the
  # scheduler cannot serialise against runs it does not own. Point the run at
  # an issuer created for it.
  tls_rotation:
    enabled: false
    cert_manager_namespace: "cert-manager"
    bootstrap_issuer: "amp-ca-bootstrap"
    roots_configmap: "amp-ca-roots"
    renew_timeout: "10m"
  # amp endpoint connection knobs (layer 2). Every amp compute endpoint
  # provisions this cloud_admin superuser (NOT postgres/postgres). sslmode empty
  # → apps/pg default (disable). create_spec (yba, owned): no default.
  amp:
    endpoint_user: "cloud_admin"
    endpoint_password: "cloud_admin"
    endpoint_db: "postgres"
    endpoint_sslmode: ""
  # backing_contract pins the YugabyteDB settings AMP's storage schema depends
  # on, as source:name=value; guc: reads pg_settings on the amp storage database,
  # gflag: reads a tserver's /varz (meko#970: auto analyze off left
  # amp_storage.pages unanalyzed and GC deletes planned as 20-minute SeqScans,
  # and the GC deletes now carry a TidScan hint that pg_hint_plan must honour).
  # This list overrides defaultBackingContract in backing_config_contract.go;
  # keep the two in step.
  backing_contract:
    settings: ["guc:yb_enable_cbo=on", "gflag:ysql_enable_auto_analyze=true", "guc:pg_hint_plan.enable_hint=on"]
  # failed_create_reclaim: sweep_timeout bounds how long the orphan sweeper may
  # take to remove a failed-create endpoint. The controller leaves an orphan alone
  # for gc-grace (30m) so a fresh failure can be inspected, then sweeps every
  # gc-interval (5m).
  failed_create_reclaim:
    sweep_timeout: "45m"
  # redpath: the features/amp_task_redpath_* family, which injects one fault per
  # test and asserts the same five things about the task it breaks.
  #   inject: off runs the test with NO fault, so the task succeeds and the test
  #     must fail. That is the red proof for every assertion in the family; it is
  #     a debug knob, never a lane setting.
  #   wedge_deadline: how long a task whose fault has been removed may stay
  #     non-terminal before it counts as wedged (meko#1007).
  #   retry_wait: the settle before the same request is retried once the fault is
  #     gone.
  #   api_deadline: how long a read the controller cannot serve may take to say
  #     so (meko#1242 reports about two minutes).
  #   orphan_timeout: the sweeper budget for compute left behind by a failed
  #     task. The controller leaves an orphan alone for gc-grace (30m), then
  #     sweeps every gc-interval (5m).
  #   quota_headroom: how many more Deployments the injected ResourceQuota allows
  #     beyond what the namespace already has. 0 leaves room for none. It caps
  #     Deployments and not pods because a pod cap also denies the controller its
  #     own replacement pod.
  #   fault_hold: how long a fault injected mid-task is held before removal.
  #   task_start_timeout: the wait for the task a mid-task fault lands on to be
  #     past pending.
  #   helper_image: the privileged hostPID pod that enters the controller pod's
  #     network namespace to drop its route to the backing (iptables and nsenter
  #     are in neither the controller nor the YugabyteDB image).
  redpath:
    inject: true
    wedge_deadline: "20m"
    retry_wait: "60s"
    api_deadline: "10s"
    orphan_timeout: "45m"
    quota_headroom: 0
    fault_hold: "90s"
    task_start_timeout: "5m"
    helper_image: "nicolaka/netshoot:v0.13"
  # mcp: the chart's MCP Service (ac-mcp.md) the amp_mcp_tools test port-forwards.
  mcp:
    service: "amp-controller-mcp"
    port: 8000
  # voyager: the source Postgres image amp_voyager_migration stands up next to the
  # control plane, and how long each migration phase (assess, provision, migrate)
  # may take to reach its state.
  voyager:
    source_image: "postgres:16-alpine"
    phase_timeout: "25m"
  # The extension set the release commits to shipping, pinned here rather than
  # read back from the database (a test that enumerates pg_available_extensions
  # cannot detect a missing extension).
  #   baked: built into the compute image (PG contrib, and pgsentinel from
  #     compute/pgxn), available with no opt-in.
  #   catalog: externalized, opt-in per branch, as catalogName:sqlName — the two
  #     differ (the pgvector image ships the "vector" extension).
  extensions:
    # require_catalog turns the two catalog softenings (control plane reports no
    # extension catalog, node's kubelet predates ImageVolume) into hard failures.
    # ON by default: the externalized catalog is a shipping commitment, and with
    # this off the exact field incident this test exists for — btree_gin absent
    # from the catalog — still passes. Turn it off for a cluster whose kubelet
    # genuinely predates ImageVolume, and say so in the run.
    require_catalog: true
    baked:
      - pg_prewarm
      - pg_buffercache
      - pg_visibility
      - pageinspect
      - pg_trgm
      - btree_gin
      - amcheck
      - pg_stat_statements
      - tsm_system_rows
      - postgres_fdw
      - pgsentinel
    catalog:
      - "pgvector:vector"
      - "pg_cron:pg_cron"
      - "hexabridge:hexabridge"
  # features/amp_byoc_scope: the namespace-scoped (BYOC) permission shape.
  #   require_impersonation: fail instead of falling back to the weaker
  #     binding-level check when `kubectl auth can-i --as` is not permitted.
  #   assert_no_public_lb: also FAIL on any LoadBalancer Service in the run's
  #     namespaces (meko#709). Off: the ybk8s backing creates three by design,
  #     so the count is only recorded.
  byoc:
    require_impersonation: false
    assert_no_public_lb: false
  # features/amp_otel_pipeline: health of the metrics pipeline the control-plane
  # chart deploys.
  #   collectors: the collector CR name suffixes the chart renders (chart values
  #     otel.collectors.<name>.enabled). Drop one for an install that disables it.
  #   expect_collectors: on a cluster whose opentelemetry.io CRDs let the chart
  #     render the collectors, a missing or unhealthy one FAILS. Set false only for
  #     an install that deploys with otel.enabled=false; the state is then only
  #     recorded.
  #   ready_timeout: how long the collectors get to come up ready, and the
  #     postgres-exporter sidecar to start serving.
  #   max_collector_restarts: restart budget per collector pod.
  otel:
    collectors:
      - controller
      - compute
    expect_collectors: true
    ready_timeout: "5m"
    max_collector_restarts: 0
  # GIN search dataset: rows seeded before the index, extra_rows inserted after
  # it exists (the GIN pending-list merge path).
  gin_search:
    rows: 5000
    extra_rows: 1000
  # features/amp_upgrade: in-place upgrade from the previous release to the run's
  # env.ampstack.*_image, on the test's own backing and control plane. The
  # previous release is resolved from the report portal's /releases: the newest
  # release older than the one under test, or the newest release at all when the
  # run tests a branch build. from_*_image override that lookup (adjacent
  # releases only: chart and controller move in lockstep). portal_url empty →
  # report.portal.url.
  upgrade:
    from_controller_image: ""
    from_endpoint_image: ""
    portal_url: ""
    rows: 2000
    # load: the writers features/amp_upgrade, amp_endpoint_upgrade_roll and
    # amp_mixed_versions keep on an endpoint across the upgrade. writers insert
    # into a journal every acknowledged id is checked against afterwards;
    # accounts/initial seed a bank whose total no upgrade may change.
    load:
      writers: 2
      accounts: 20
      initial: 1000
  # features/amp_format_compat: data written by an older release, read by the
  # current one. trains_back is how many releases back the stack is deployed at
  # (2 = two trains back); the previous release is used instead when the portal
  # lists no older one, and the train that was used is recorded on the result.
  # from_image overrides the lookup with a release tag (or a full image ref, the
  # tag is taken from it) and names both the controller and the endpoint image.
  # gc_timeout bounds the drain of a table the older release dropped.
  format_compat:
    from_image: ""
    trains_back: 2
    rows: 2000
    toast_rows: 50
    chain_updates: 2000
    gc_timeout: "8m"
  # features/amp_mixed_versions: a new controller over old endpoints. hold is how
  # long the pair is held there under load before the fleet roll closes the
  # window, poll_interval how often the new controller's task feed and the
  # endpoint image are read. max_hold_gap is the longest a write may go
  # unacknowledged while nothing is being upgraded; max_roll_gap the same across
  # the roll, where the compute is replaced and a client has to reconnect.
  mixed_versions:
    hold: "10m"
    poll_interval: "30s"
    max_hold_gap: "60s"
    max_roll_gap: "15m"
  # features/amp_upgrade_chain: rolling upgrades across REAL releases.
  # hops upgrades in a row, so hops+1 releases are installed and walked, oldest
  # first. The releases come from the report portal's /releases (the ones
  # amp-build actually cut); versions overrides that with an explicit
  # oldest-first list of release tags when the portal cannot be reached or a
  # specific window is wanted. portal_url empty → report.portal.url.
  # reinstall_on_failure keeps the chain going after a failed hop by installing
  # that release clean and re-seeding; the failed hop stays failed and the test
  # still ends red.
  upgrade_chain:
    hops: 5
    rows: 2000
    wide_rows: 50
    versions: []
    portal_url: ""
    reinstall_on_failure: true

# --- Apps ---
apps:
  # apps/cloud/aws: EC2 lifecycle app, shelling the ambient-authed `aws` CLI. The
  # shared us-west-2 dev-VPC settings (AWS_TEST_INSTANCES.md) are real defaults.
  # key_name is the SHARED yb-dev-aws-2 keypair — this app NEVER mints one.
  cloud:
    aws:
      region: "us-west-2"
      subnet: "subnet-11798e59"
      security_groups:
        - "sg-0427247c274837cdc"
        - "sg-0ab0af5e93728f73a"
        - "sg-05b6d45d3ab93c852"
        - "sg-0271332bdd9fa1313"
      key_name: "yb-dev-aws-2"
      key_file: "~/.ssh/yb-dev-aws-2.pem"
      ami: "ami-0eb514f4c0f885334" # AlmaLinux 9 ARM (aarch64) — must match instance_type arch
      instance_type: "m7g.xlarge"
      ssh_user: "ec2-user"
      # name_prefix has NO entry here (unlike other keys): its default is
      # DERIVED from the top-level `owner` value at read time (FromConfig), so
      # instances are named "<owner>-<run>-<n>" by default. A key present here
      # — even as "" — would short-circuit that fallback (GetString only
      # applies its default on a lookup MISS). Set apps.cloud.aws.name_prefix
      # explicitly only to prefix names differently from the owner tag.
      # reach: "private" (default) is the VPC private IP — the only inbound path
      # the dev VPC's SGs allow. Instances still get a public IP for outbound
      # (artifact downloads). Set "public" only for a VPC allowing public SSH.
      reach: "private"
      # WaitSSH budget: an unreachable instance fails here instead of hanging the
      # whole provision, so teardown can reclaim it promptly.
      ssh_wait_timeout: "4m"
      # access_key_secret/secret_key_secret name secrets holding static AWS creds.
      # Both empty (default) → the aws CLI uses its AMBIENT chain (the working
      # default; don't set unless you need explicit creds). Set BOTH or neither
      # (partial errors); values go into the process env only, never argv/logs.
      access_key_secret: ""
      secret_key_secret: ""

    # apps/cloud/gcp: GCE lifecycle app, shelling `gcloud`. project/zone/region/
    # network/subnetwork/disk_type/ssh_user are the shared dev-project values.
    gcp:
      project: "yugabyte"
      zone: "us-west1-b"
      region: "us-west1"
      network: "yugabyte-network"
      subnetwork: "subnet-us-west1"
      disk_type: "pd-standard"
      machine_type: "e2-standard-4"
      # image/image_family/image_project: one of image or image_family MUST be
      # set before a live GCP run (no reusable shared image identified).
      # image_family (`--image-family`, e.g. almalinux-8) resolves to the current
      # family image; image (`--image`) pins a build; image_family wins if both.
      image: ""
      image_family: ""
      image_project: ""
      ssh_user: "centos"
      # key_file/public_key_file: no GCP shared key exists yet — MUST be filled
      # before a live run. public_key_file's CONTENT is injected into instance
      # metadata so RunInstances never mints a key or uses OS Login.
      key_file: ""
      public_key_file: ""
      # name_prefix has NO entry here — its default is DERIVED from the
      # top-level `owner` value at read time; see apps.cloud.aws.name_prefix.
      # reach/ssh_wait_timeout mirror aws.
      reach: "private"
      ssh_wait_timeout: "4m"
      # service_account_secret names a secret resolving to a PATH to a
      # service-account JSON key. Empty (default) → ambient `gcloud auth`. The
      # path is injected as CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE, never logged.
      service_account_secret: ""

  # apps/yba: YugabyteDB Anywhere REST app. base_url/customer_uuid/
  # api_token_secret (NAME of a secret) have NO default — all three required to
  # reach a YBA. aws.*/gcp.*/k8s.* are provider specs, universe.* the universe spec.
  yba:
    base_url: ""
    customer_uuid: ""
    api_token_secret: ""
    # provider_type: backing cloud the provision_yba flow stands a universe on.
    #   aws (default) — EC2 provider (apps.yba.aws.*); teardown backstop is the
    #     ampqa-run=<tag> EC2 tag sweep.
    #   kubernetes — universe ON the same k8s cluster the YBA runs in (cheapest,
    #     fully-in-cluster); reads apps.yba.k8s.*; needs kubecontext + quay.
    #   gcp — GCE VMs (apps.yba.gcp.*); needs the gcp_key SA-JSON secret.
    # Default kubernetes: the amp feature/regression tests stand a YBA-provisioned
    # RF=3 universe up co-located in the same cluster as amp (no cloud creds).
    provider_type: "kubernetes"
    # release_url: DB-release tarball the provision_yba flow imports before
    # universe-create. Empty → derived from versions.yugabytedb + aws.arch as the
    # public software.yugabyte.com el8 tarball.
    release_url: ""
    aws:
      # provider_name is the idempotent identity: an existing provider with this
      # name is REUSED, never duplicated.
      provider_name: "ampqa-aws"
      ssh_user: "ec2-user"
      arch: "arm"
      # keypair_name+keypair_file are the SHARED yb-dev-aws-2 keypair, passed with
      # skipKeyValidateAndUpload so YBA REUSES it and NEVER mints a new AWS key.
      keypair_name: "yb-dev-aws-2"
      keypair_file: "~/.ssh/yb-dev-aws-2.pem"
      # access_key_secret/secret_key_secret name secrets with the static AWS creds
      # baked into the provider — REQUIRED (YBA stores them; unlike ambient chain).
      access_key_secret: "aws_access_key"
      secret_key_secret: "aws_secret_key"
      # regions → zones → subnets. security_group_id/vpc_id empty (env-specific).
      # ami is the region ybImage and MUST match arch — an empty ami makes YBA
      # default to x86_64, which RunInstances rejects against the arm64 m7g.xlarge.
      # Default is the shared us-west-2 ARM server AMI; for x86 set arch: x86 +
      # an x86_64 ami + an x86 instance_type.
      regions:
        - code: "us-west-2"
          security_group_id: ""
          vpc_id: ""
          ami: "ami-03cd4ec64de195719"
          zones:
            - name: "us-west-2a"
              subnet: "subnet-11798e59"
    universe:
      # name_prefix tags every universe (name = "<prefix>-<run-tag>") so it is
      # identifiable and reapable.
      name_prefix: "ampqa"
      num_nodes: 3
      replication_factor: 3
      instance_type: "m7g.xlarge"
      # instance_num_cores/instance_mem_gb describe instance_type (m7g.xlarge =
      # 4 vCPU / 16 GiB) and are registered on the provider — YBA does not
      # auto-populate an API-created provider's instance-type catalog.
      instance_num_cores: 4
      instance_mem_gb: 16
      region: "us-west-2"
      # yb_version empty → fall back to versions.yugabytedb.
      yb_version: ""
      volume_size_gb: 100
      volume_count: 1
      # storage_type EBS class. GP3 (default) requires disk_iops+throughput (YBA
      # 400s without them; these are the GP3 baseline). IO1/IO2 use disk_iops
      # only; gp2/other ignore both.
      storage_type: "GP3"
      disk_iops: 3000
      throughput: 125
      # instance_tags stamp every node. The dev-account SCP conditions
      # ec2:RunInstances on ownership tags, so a universe missing them is DENIED.
      # The mandatory set (yb_owner/yb_task/yb_dept/autoclean/ampqa) is always
      # applied; keys here override/extend it; ampqa-run is added automatically.
      instance_tags: {}
      # enable_ybc toggles YBC install. false skips it + the WaitForYbcServer
      # subtask, which on a VM universe times out pinging a yb-controller
      # nothing here installs — a create-task failure with cloud nodes already
      # launched (see env/universe: TestProvisionYBACreateTaskFailureReapsNodes).
      # The amp-compute workload needs no YBC. Set true only for a VM universe
      # a backup test will drive; the kubernetes universe has its own
      # apps.yba.k8s.enable_ybc, which is on.
      enable_ybc: false
      # master_gflags/tserver_gflags go onto every universe built from a
      # UniverseSpec, whatever the provider. tserver_gflags defaults to the
      # settings AMP's storage schema depends on and
      # features/backing_config_contract asserts (auto analyze on,
      # yb_enable_cbo=on through ysql_pg_conf_csv); keys here override or extend
      # that, and an empty value drops one of the defaults. They are set at
      # create because they are cluster-wide: a session GUC would not reach the
      # branch-drop reaper's own connections.
      # NOT read by env.yb_deploy=yba_universe with functional.yba.create_spec,
      # which posts a hand-written create body straight to YBA (ybdeploy.go) and
      # so has to carry its own tserverGFlags, nor by an attached universe
      # someone else created.
      master_gflags: {}
      tserver_gflags: {}
    # k8s.*: KUBERNETES provider+universe (provider_type "kubernetes"): a universe
    # ON the same k8s cluster the YBA runs in (apps.ybastack.kubecontext), no VMs.
    k8s:
      # provider_name idempotent identity. kube_provider = KUBECONFIG_PROVIDER
      # hint. service_account = in-namespace ServiceAccount YBA uses.
      provider_name: "ampqa-k8s"
      kube_provider: "gke"
      service_account: "yugabyte-helm"
      # universe DB image registry (quay itest) — k8s universes pull from here.
      image_registry: "quay.io/yugabyte/yugabyte-itest"
      # in-cluster image-pull Secret YBA references.
      pull_secret_name: "quay-secret"
      # StorageClass the universe PVCs bind to; must bind WaitForFirstConsumer.
      storage_class: "standard-rwo"
      # cluster DNS domain (KUBE_DOMAIN); empty → cluster.local.
      kube_domain: ""
      # use_in_cluster true → YBA uses its OWN in-cluster service account (no
      # kubeconfig sent); false (default) → kubeconfig from kubeconfig_secret.
      # On GKE the in-cluster namespace SA lacks universe-create RBAC, so the run
      # pipeline hands YBA a cluster-admin ServiceAccount-token kubeconfig
      # (apps.yba.k8s.kubeconfig_secret) — which requires use_in_cluster=false.
      # kubeconfig_secret/pull_secret_secret name secrets; kubeconfig required at
      # a live run unless use_in_cluster.
      use_in_cluster: false
      kubeconfig_secret: ""
      pull_secret_secret: ""
      # region + zones (co-located GKE; shared dev us-west1). empty → single zone.
      region: "us-west1"
      zones:
        - code: "us-west1-b"
      # Universe shape: RF3, the shape every schedule used to pass as an option.
      # RF1 skips backing_maintenance and is not the product customers run.
      num_nodes: 3
      replication_factor: 3
      # enable_ybc: on here, unlike the VM default above — the chart brings
      # yb-controller, and stress/backing_backup_restore skips without YBC.
      enable_ybc: true
      volume_count: 1
      # 200G, not the old 50. Measured on the depth ladder: 25 TPC-C warehouses
      # (~2.5G logical) put 36G on EACH tserver before YugabyteDB started
      # rejecting writes below its 5% free threshold — roughly 14x amplification
      # once WAL retention and uncollected page versions are counted. A 50G
      # volume could not survive the SMALLEST rung.
      # 200 fits what runs by default (every functional and stress test writes
      # single-digit GB) and clears the ladder's first rungs. The high rungs
      # want more than any sane default: pass volume_size_gb explicitly there.
      volume_size_gb: 200
      # master/tserver K8SNodeResourceSpec cpu cores + memory GiB (within YBA's
      # MIN_CPU 0.5 / MIN_MEMORY 2.0 GiB bounds).
      master_cpu: 2
      master_mem_gib: 4
      tserver_cpu: 2
      tserver_mem_gib: 4
      # Encryption in transit for the universe. Off (plaintext) by default; the
      # amp side (controller, endpoints) does not present certificates yet, so
      # a TLS universe needs a permissive HBA rule to admit them — there is no
      # key for it here; write it into apps.yba.universe.tserver_gflags
      # (ysql_hba_conf_csv) above. root_ca is
      # the UUID of a K8S cert-manager certificate already added to YBA, issued
      # by the issuer named on the provider region (cert_manager_issuer_*).
      # See controller/architecture/ac-endpoint-tls.md.
      cert_manager_issuer_kind: ""
      cert_manager_issuer_name: ""
      cert_manager_issuer_group: ""
      tls:
        node_to_node: false
        client_to_node: false
        root_ca: ""
        root_and_client_root_ca_same: true
        # The gflags TLS needs (client certificates demanded on RPC, an HBA with
        # cert login for the storage role) go under apps.yba.universe.*_gflags
        # above, which every provider already merges over its defaults.
    # gcp.*: GCP provider+universe (provider_type "gcp"): a universe on GCE VMs.
    gcp:
      # provider_name idempotent identity. project/network/subnetwork/region/zone
      # are the shared dev-project values; network is the existing VPC (destVpcId).
      provider_name: "ampqa-gcp"
      project: "yugabyte"
      network: "yugabyte-network"
      subnetwork: "subnet-us-west1"
      region: "us-west1"
      zone: "us-west1-b"
      ssh_user: "centos"
      ssh_port: 22
      # arch x86 by default (GCP universes run x86); tarball+image bundle resolve
      # for this arch.
      arch: "x86"
      # credentials_secret names a secret resolving to a PATH to the SA JSON key.
      # Contents go into gceApplicationCredentials (never logged); the path
      # re-auths gcloud for the teardown reap. REQUIRED for a live gcp run.
      credentials_secret: "gcp_key"
      # keypair_name+keypair_file: the SAME shared yb-dev-aws-2 key the aws
      # provider reuses, passed with skipKeyValidateAndUpload so YBA never mints
      # one. GCE has no registered-keypair concept (YBA injects the public half
      # as instance metadata), so the key material is cloud-agnostic — this is
      # what the stress framework hands its own GCP provider. A host without the
      # key still builds a provider: an unreadable DEFAULT omits the
      # allAccessKeys block (YBA falls back to project/OS-login keys), while a
      # path set explicitly here is required and errors when it is absent.
      keypair_name: "yb-dev-aws-2"
      keypair_file: "~/.ssh/yb-dev-aws-2.pem"
      # image: optional GCE image (name or family) for the default image bundle;
      # empty → YBA's default GCP image. regions optional; empty → single us-west1.
      image: ""
      # placement pins tservers per zone per region and preferred_region marks
      # where tablet leaders sit (isAffinitized on its zones). Every placement
      # region must be one of `regions` above. Empty → YBA spreads num_nodes
      # over the single region.
      #   placement:
      #     - region: us-west1
      #       zones: [{name: us-west1-b, nodes: 1}]
      #     - region: us-east1
      #       zones: [{name: us-east1-b, nodes: 1}]
      #   preferred_region: us-west1
      placement: []
      preferred_region: ""
      # Universe shape (cheap RF1). instance_type is the GCE machine type
      # (n2-standard-4, analogous to AWS m7g.xlarge). storage_type Persistent.
      instance_type: "n2-standard-4"
      num_nodes: 1
      replication_factor: 1
      volume_size_gb: 100
      volume_count: 1
      storage_type: "Persistent"

  # apps/ybastack: YugabyteDB-Anywhere-in-Kubernetes deploy App. Stands up our
  # OWN YBA in a per-run namespace and returns a token-bootstrapped yba.Client
  # (what env.universe.yba.* needs). kubectl/helm shelled, ambient-authed.
  ybastack:
    # kubecontext empty → current context. kubeconfig empty → ambient KUBECONFIG;
    # set → exported into the shelled child env only (parallel-safe).
    kubecontext: ""
    kubeconfig: ""
    namespace_prefix: "ampqa-yba"
    # chart_version empty → versions.yugabytedb. Chart tarball:
    # s3://releases.yugabyte.com/<chart_version>/helm/yugaware-<short>.tgz
    # (<short> = first three version components).
    chart_version: ""
    # image_registry patches the chart's YBA control-plane image repo.
    # yb_image_registry is the SEPARATE universe image registry (provider wave).
    image_registry: "quay.io/yugabyte/yugaware-itest"
    yb_image_registry: "quay.io/yugabyte/yugabyte-itest"
    # quay_secret is the NAME of the secret with the quay pull credential;
    # pull_secret_name is the in-cluster Secret it becomes.
    quay_secret: "quay_images"
    pull_secret_name: "quay-secret"
    service_account: "yw-sa"
    # Must bind WaitForFirstConsumer (an Immediate class zone-pins yugaware-0).
    storage_class: "standard-rwo"
    # rbac_dir: optional universe-management RBAC templates; each
    # ClusterRoleBinding is renamed "<name>-<namespace>" so parallel YBAs never
    # clobber a cluster-scoped binding. Empty → the chart's own namespaced RBAC.
    rbac_dir: ""
    # reach: tailnet (default) resolves the yugaware Service cluster-internal
    # address and talks direct; loadbalancer reads the external ingress IP.
    # tailnet PROBES the address it picks and falls back to a kubectl
    # port-forward when neither the ClusterIP nor the pod IP answers — on a
    # cluster whose pod CIDR is shadowed by another advertised tailnet route,
    # every pod-IP dial times out rather than being refused.
    reach: "tailnet"
    # empty → service_name "<release>-yugaware-ui", pod_selector
    # "app=<release>-yugaware", helm_release "<namespace>-yugaware".
    service_name: ""
    pod_selector: ""
    helm_release: ""
    service_port: 80
    # local_port is the port-forward fallback's local port; 0 lets kubectl pick
    # one, which is what parallel runs on one agent need.
    local_port: 0
    helm_timeout: "40m"
    # insecure_tls true (default) → reach client skips TLS verify (self-signed).
    insecure_tls: true
    # bootstrap.* are the first-customer credentials (well-known non-secret YBA
    # dev default, routed through config not hardcoded). bootstrap_timeout bounds
    # the retry-until-the-pod-answers loop.
    bootstrap:
      name: "demo"
      email: "demo@yugabyte.com"
      password: "Password#123"
    bootstrap_timeout: "10m"

  # apps/ybk8s: YugabyteDB-in-Kubernetes deploy App. Stands up a YB cluster in a
  # per-run namespace via the upstream `yugabyte` helm chart, for the cheapest
  # fully-GCP CO-LOCATED mode (YB + amp in one GKE cluster).
  ybk8s:
    # kubecontext empty → env.sharedk8s.context, then env.ampstack.context (the
    # context the run already provides), then the ambient current context. For
    # co-location the amp deploy must target the SAME cluster.
    kubecontext: ""
    kubeconfig: ""
    namespace_prefix: "ampqa-yb"
    # chart_version empty → versions.yb (the run-level YB version a CI run
    # sets), then the pinned versions.yugabytedb. Chart tarball:
    # s3://releases.yugabyte.com/<chart_version>/helm/yugabyte-<short>.tgz.
    chart_version: ""
    # image_registry is the chart Image.repository; image_tag empty → chart_version.
    # quay itest carries unreleased builds (see env.ampstack.yb_image_registry).
    image_registry: "quay.io/yugabyte/yugabyte-itest"
    image_tag: ""
    # image_pull_secret: NAME of a secrets: entry whose value is a "<user>:<pass>"
    # registry token, for pulling build-specific images from a PRIVATE registry
    # (e.g. quay.io/yugabyte/yugabyte-itest, where -bNNN builds live but public
    # Docker Hub does not). "" → no pull secret (public yugabytedb/yugabyte,
    # unchanged). image_pull_registry is the registry the token authenticates
    # (the dockerconfigjson "auths" key); image_pull_secret_name is the k8s Secret
    # object created in the YB namespace and set as the chart's Image.pullSecretName.
    image_pull_secret: ""
    image_pull_registry: "quay.io"
    image_pull_secret_name: "yb-pull-secret"
    # replication_factor drives default master/tserver counts (RF1 = cheap: 1+1;
    # set 3 for RF3). master_replicas/tserver_replicas (0 → RF) override each.
    replication_factor: 1
    master_replicas: 0
    tserver_replicas: 0
    # Must bind WaitForFirstConsumer (an Immediate class zone-pins the pods).
    storage_class: "standard-rwo"
    storage_size: "10Gi"
    # service_name is the tserver Service whose in-cluster DNS the amp controller
    # connects at — the product's own connection target, so it is NOT changed to
    # suit the harness. The framework itself reaches YSQL through kubectl
    # (exec / port-forward), never a routable address.
    service_name: "yb-tserver-service"
    ysql_port: 5433
    # Small resource requests keep a real run cheap.
    master_cpu: "0.5"
    master_memory: "1Gi"
    tserver_cpu: "0.5"
    tserver_memory: "2Gi"
    # Limits equal to requests (Guaranteed QoS). Off: the chart's own limits
    # stand and the pods burst into whatever their neighbours leave.
    guaranteed_qos: false
    # reach: tailnet (default, only mode) resolves tserver pod IPs (a ClusterIP is
    # not routable from the coordinator).
    reach: "tailnet"
    # helm_release empty → the per-run namespace name.
    helm_release: ""
    helm_timeout: "45m"
    # TLS via the chart's cert-manager mode: TLS on YSQL and tserver RPC,
    # client certificates demanded on RPC, certificate login for storage_role.
    # Needs an issuer already in the cluster and root_ca_file, the PEM CA chain
    # it signs with. permissive keeps plaintext admitted beside TLS, which the
    # amp side needs until it presents certificates. Off by default.
    tls:
      enabled: false
      issuer_kind: "ClusterIssuer"
      issuer_name: "amp-ca"
      issuer_group: "cert-manager.io"
      root_ca_file: ""
      permissive: true
      storage_role: "amp_storage"

  # apps/ybpod: yugabyted-in-pod deploy App. Stands up a single-node (RF1)
  # YugabyteDB inside a bare pod by installing the release TARBALL and running
  # `yugabyted start` by hand — image-promotion-INDEPENDENT (unlike ybk8s, which
  # needs a promoted container image at a tag). The tarball always exists in the
  # S3 release bucket for every build.
  ybpod:
    # kubecontext/kubeconfig as ybk8s. For co-location the amp deploy must target
    # the SAME cluster: set env.ampstack.context to match (or both empty).
    kubecontext: ""
    kubeconfig: ""
    namespace_prefix: "ampqa-ybpod"
    # base_image: a PUBLIC el8 base that can run the el8 tarball — needs glibc,
    # tar/gzip (remote untar) and dnf (yugabyted needs Python 3.7+; almalinux:8's
    # stock python3 is 3.6, provisioned on start). base_image_pull_secret: NAME of
    # a PRE-EXISTING docker-registry Secret in the namespace for a PRIVATE base
    # image; "" → public.
    base_image: "almalinux:8"
    base_image_pull_secret: ""
    # version empty → versions.yugabytedb. arch selects the S3 tarball variant:
    # x86_64 → yugabyte-<ver>-centos-x86_64.tar.gz, aarch64 → -almalinux8-aarch64.
    # The k8s node the pod lands on MUST match arch.
    version: ""
    arch: "x86_64"
    # tarball_url: release-tarball source. Empty (default) → the S3 release-bucket
    # form (s3://releases.yugabyte.com/<ver>/yugabyte-<ver>-<osarch>.tar.gz). A
    # template over {yugabytedb}/{yugabytedb_base}/{osarch} placeholders — e.g.
    # "https://mirror/{yugabytedb_base}/yugabyte-{yugabytedb}-{osarch}.tar.gz" for
    # an http mirror. tarball_secret: NAME of a declared secret authenticating the
    # fetch (private/authenticated http only); "" → anonymous (S3 is ambient-authed
    # on the coordinator). Either way the tarball is fetched coordinator-side and
    # pushed into the pod, so the pod never needs fetch credentials.
    tarball_url: ""
    tarball_secret: ""
    # install_dir: pod dir the tarball lands in + unpacks under (install root is
    # <install_dir>/yugabyte-<base>). base_dir: yugabyted --base_dir. Both under
    # /root (the pod runs as root, unlike the awsvm ec2-user default).
    install_dir: "/root/yb-software"
    base_dir: "/root/yugabyte-data"
    # service_name: the YSQL Service whose in-cluster DNS the amp controller
    # connects at; the framework reaches YSQL over the tailnet via the pod IP.
    service_name: "ybpod-ysql"
    ysql_port: 5433
    ready_timeout: "10m"

  # apps/sampleapp: the YugabyteDB Java sample-apps jar (yb-stress-sample-apps
  # fork), run against the backing YB as a real workload. workload is the
  # --workload value (Sql* → YSQL, Cassandra* → YCQL). skip_workload = create
  # schema only; skip_ddl = load data into existing tables — the two together are
  # the two-phase SqlDataLoad pattern. run_time 0 → the jar runs until stopped.
  sampleapp:
    workload: "SqlInserts"
    num_tables: 1
    num_value_columns: 0
    num_threads_read: 0
    num_threads_write: 0
    run_time: "0s"
    uuid: ""
    skip_workload: false
    skip_ddl: false
    ysql_port: 5433
    ycql_port: 9042

  # apps/sqlancer: SQLancer (yugabyte fork) installed in a client pod from its
  # master-yb release and run through its amp provider. The release is deleted
  # and recreated on every push to master-yb, so the tag moves: the install
  # step records the commit it pointed at and the tarball's sha256, and fails
  # (env_failed) if the tag moved during the download. The tarball is ~430 MB.
  sqlancer:
    image: "eclipse-temurin:21-jre"
    release_repo: "yugabyte/sqlancer"
    release_tag: "sqlancer_2.0.0-yb"
    release_asset: "sqlancer-2.0.0-yb.tar.gz"
    install_dir: "/opt/ampqa/sqlancer"
    install_timeout: "20m"
    # threads is --num-threads; each thread fuzzes a database of its own.
    # SKIP_LOCKED opens 2 connections per thread, so 16 stays well under an
    # endpoint's max_connections of 100.
    threads: 16
    # time_per_oracle is --timeout-seconds for each oracle run.
    time_per_oracle: "10m"
    max_heap: "4g"
    poll_interval: "5s"
    # collect_max_bytes caps EACH collected file; a capped file is its tail.
    collect_max_bytes: 10485760
    # extra_args are appended to SQLancer's global options, before `amp`.
    # --num-queries is how many queries a thread issues before it builds a new
    # database. SQLancer's default of 100000 kept each thread on one schema for
    # most of an oracle (0.00 dbs/s in run e9ec2452); 5000 is a new schema
    # every 10-50 s.
    extra_args: ["--num-queries", "5000"]

  # apps/benchbase: the BenchBase benchmark suite (yugabyte fork), run against the
  # backing YSQL. TPC-C default with small load params so a real run stays cheap.
  # For TPC-C the warehouse count IS the scalefactor; scalefactor 0 → warehouses.
  benchbase:
    benchmark: "tpcc"
    warehouses: 1
    terminals: 1
    duration: "60s"
    scalefactor: 0
    rate: "unlimited"

  # apps/metrics: the background server-metrics sampler. Any test holding a
  # namespace-scoped kubectl can start it; the perf tier (tpcc/pgbench/sysbench)
  # starts it over the YB backing, and perf/microbench over the amp compute
  # endpoint pod. ON by default — a test that does not compose the app is
  # unaffected.
  #
  # Every sample_interval it reads, per sampled pod:
  #   - container CPU + memory from the cgroup (v2 and v1 both handled) in one
  #     exec; CPU is a counter, reported as cores used over wall-clock. These are
  #     emitted as "[<section>] CPU" / "[<section>] Memory" and need no entry.
  #   - the pod's prometheus exposition — /prometheus-metrics on tserver_port /
  #     master_port for YB, /metrics on endpoint_port for the endpoint's
  #     pageserver — keeping only what `collect` / `endpoint_collect` declare.
  # max_points caps each line (drop-oldest): 15s over 1h is 240 points, so 2000
  # is generous headroom for a soak.
  #
  # collect / endpoint_collect are the SET, and they carry the DISPLAY METADATA:
  # every emitted key is "[<section>] <title>" — never a raw prometheus name.
  # The raw names ride along on the metric's `raw` field instead. Replace either
  # list to collect a different set — no code change. Per entry:
  #   match         REGEX over the bare metric name (labels stripped, same-name
  #                 lines summed). Required.
  #   title         the human name in the key. Required.
  #   kind          gauge (default) | counter | latency
  #                   gauge   — value passes through
  #                   counter — per-second rate of the delta
  #                   latency — the entry matches a histogram's _count AND _sum
  #                             and yields TWO series: `title` = rate(count),
  #                             and `latency_title` = delta(sum)/delta(count),
  #                             the MEAN LATENCY, emitted in ms. This is the
  #                             point of the structured list: two raw rates
  #                             ("sum per second") tell a reader nothing.
  #   unit          display unit; defaults to "/s" for counter and latency
  #   divide_by     divides the emitted value (1048576 for bytes → MiB)
  #   round         display decimals, default 2 (a derived latency uses 3)
  #   latency_title name of the derived mean-latency series; default
  #                 "<title> latency"
  #   sum_unit      time unit of the histogram _sum: ns | us | ms | s. Default
  #                 us — YB handler latencies are microseconds.
  #
  # cpu_utime / cpu_stime are deliberately absent: "[<section>] CPU" from the
  # cgroup already measures the container's CPU in cores, counting every thread.
  metrics:
    # enabled turns on the background server-metrics sampler. It is collected for
    # EVERY test — the environment samples the backing YugabyteDB (in whichever
    # namespace its pods actually run) and the amp compute endpoints across the
    # test body, and the series land on the result. Best-effort throughout: a
    # sampler that cannot start is logged, never a test failure.
    enabled: true
    # sample_interval paces every scrape. 5s resolves a 3-minute measured window
    # into ~36 points per series — enough to see a stall inside a window, which
    # 15s flattened away — while max_points still bounds a long soak.
    sample_interval: "5s"
    max_points: 2000
    tserver_port: 9000
    master_port: 7000
    endpoint_port: 9898
    collect:
      - match: "^handler_latency_yb_tserver_TabletServerService_Read_(count|sum)$"
        title: "Read RPCs"
        kind: "latency"
        latency_title: "Read latency"
        sum_unit: "us"
      - match: "^handler_latency_yb_tserver_TabletServerService_Write_(count|sum)$"
        title: "Write RPCs"
        kind: "latency"
        latency_title: "Write latency"
        sum_unit: "us"
      - match: "^log_append_latency_(count|sum)$"
        title: "WAL appends"
        kind: "latency"
        latency_title: "WAL append latency"
        sum_unit: "us"
      - match: "^log_sync_latency_(count|sum)$"
        title: "WAL syncs"
        kind: "latency"
        latency_title: "WAL sync latency"
        sum_unit: "us"
      - match: "^log_bytes_logged$"
        title: "WAL bytes"
        kind: "counter"
        unit: "MiB/s"
        divide_by: 1048576
      - match: "^rocksdb_compact_read_bytes$"
        title: "Compactions read"
        kind: "counter"
        unit: "MiB/s"
        divide_by: 1048576
      - match: "^rocksdb_compact_write_bytes$"
        title: "Compactions written"
        kind: "counter"
        unit: "MiB/s"
        divide_by: 1048576
      - match: "^rocksdb_flush_write_bytes$"
        title: "Flushes written"
        kind: "counter"
        unit: "MiB/s"
        divide_by: 1048576
      - match: "^rpc_inbound_calls_created$"
        title: "Inbound RPCs"
        kind: "counter"
      - match: "^rpcs_in_queue_yb_(tserver|master)_"
        title: "RPC queue depth"
        unit: "rpcs"
      - match: "^total_sst_files_size$"
        title: "SST files size"
        unit: "MiB"
        divide_by: 1048576
      - match: "^mem_tracker$"
        title: "Memory tracker"
        unit: "MiB"
        divide_by: 1048576
    # The amp compute endpoint pod's pageserver (/metrics on endpoint_port). The
    # pod also contributes cgroup CPU + Memory, which need no entry.
    endpoint_collect:
      - match: "^pageserver_smgr_query_seconds_(count|sum)$"
        title: "Page requests"
        kind: "latency"
        latency_title: "Page request latency"
        sum_unit: "s"
      - match: "^pageserver_wait_lsn_seconds_(count|sum)$"
        title: "LSN waits"
        kind: "latency"
        latency_title: "LSN wait latency"
        sum_unit: "s"
      - match: "^pageserver_replayed_wal_records_total$"
        title: "WAL records replayed"
        kind: "counter"
      - match: "^pageserver_io_operations_bytes_total$"
        title: "Pageserver I/O"
        kind: "counter"
        unit: "MiB/s"
        divide_by: 1048576
      - match: "^pageserver_resident_physical_size$"
        title: "Resident layer size"
        unit: "MiB"
        divide_by: 1048576

# --- Artifacts (artifact/artifact.go, artifact/deploy.go) ---
artifact:
  # Local download cache dir. Empty (default) → ~/.ampqa/artifacts at use.
  cache_dir: ""

# versions{}: short name → version string, consumed by {name} placeholder
# substitution in artifacts{} (artifact.Resolve) and the pre-provision version
# gate (versions.product/versions.yb, cmd/ampqa/run.go). Otherwise per-project.
#
# yugabytedb is the one framework-owned entry: the functional suite's awsvm host
# is bare (no YugabyteDB), so the release its cluster provisioners deploy is a
# genuine framework default. A single build-suffixed string; consumers derive the
# bare form ({yugabytedb_base}, "-bNNN" stripped — the public release DIRECTORY)
# from it. A real current stable (LTS); bump for a newer build, or override
# artifacts.yugabytedb.glob_path/url for a different line.
versions:
  yugabytedb: "2025.2.1.0-b141"
  # sampleapp: the yb-stress-sample-apps jar release tag suffix (github release
  # ssa_<version> in yugabyte/yb-stress-test). benchbase: the yugabyte/benchbase
  # release tag. Both mirror the stress framework's pinned versions.
  sampleapp: "1.4.90"
  benchbase: "1.12"
  # benchbase_stress: the stress fork's release tag (yb-stress-test
  # benchbase_<version>). Mirrors the stress framework's pinned version.
  benchbase_stress: "1.0"

# artifacts{}: fetchable artifacts by name (glob_path, url, type, target, secret,
# delivery flags). Consumed by artifact.Resolve and the deploy-artifact task.
# Otherwise per-project.
#
# yugabytedb: the release the functional awsvm cluster provisioners deploy onto
# the bare-AMI host (functional.cluster.deploy). remote_download (curl on the
# node) + remote_unzip; the public URL needs no secret/AWS creds. target "server"
# matches the Label the provisioners pass.
#
# ARCH el8-aarch64 — the awsvm AMI is ARM AlmaLinux. For x86_64, override
# glob_path/url to the linux-x86_64 filename.
#
# version is declared as "yugabyte-{yugabytedb_base}": the tarball extracts to a
# directory named just yugabyte-<base-version> (no build/os/arch suffix). The
# provisioners join it onto functional.cluster.deploy_dir for install_dir.
artifacts:
  yugabytedb:
    version: "yugabyte-{yugabytedb_base}"
    glob_path: "yugabyte-{yugabytedb}-el8-aarch64.tar.gz"
    url: "https://software.yugabyte.com/releases/{yugabytedb_base}/yugabyte-{yugabytedb}-el8-aarch64.tar.gz"
    type: http
    remote_download: true
    remote_unzip: true
    target: "server"

  # sampleapp: the yb-stress-sample-apps jar, a github_release asset in the
  # yugabyte/yb-stress-test repo under the tag ssa_<version>. Private repo → the
  # fetch authenticates with the gh_package secret (see secrets{} below). The url
  # is the GitHub "get a release by tag" API endpoint; the fetcher resolves the
  # asset matching glob_path and downloads it into the local cache, then delivers
  # it to the client. Mirrors stress artifacts.conf `stress-sample-app-tool`.
  sampleapp:
    glob_path: "yb-stress-sample-apps-{sampleapp}.jar"
    url: "https://api.github.com/repos/yugabyte/yb-stress-test/releases/tags/ssa_{sampleapp}"
    type: github_release
    secret: "gh_package"
    target: "client"

  # benchbase_stress: the stress team's BenchBase fork (vendored in
  # yb-stress-test as tools/benchbase, released there as benchbase_<version>).
  # Two additions matter here: its workers RECONNECT and retry on a dropped
  # connection instead of killing the terminal thread — an amp compute that
  # restarts mid-run otherwise ends that tenant's load permanently — and its
  # per-window results CSV carries operations/sec and latency, not throughput
  # alone. Private repo → the fetch authenticates with gh_package, like the
  # sample-app jar. Extracts to the same benchbase-yugabyte/ directory.
  benchbase_stress:
    glob_path: "benchbase-{benchbase_stress}.tgz"
    url: "https://api.github.com/repos/yugabyte/yb-stress-test/releases/tags/benchbase_{benchbase_stress}"
    type: github_release
    secret: "gh_package"
    target: "client"
    remote_unzip: true

  # benchbase: the BenchBase (yugabyte fork) release tarball — a PUBLIC github
  # release asset, no secret needed. remote_download (curl on the client) +
  # remote_unzip extracts benchbase-yugabyte/. Mirrors stress artifacts.conf
  # `benchbase`.
  benchbase:
    glob_path: "benchbase-yugabyte.tgz"
    url: "https://github.com/yugabyte/benchbase/releases/download/{benchbase}/benchbase-yugabyte.tgz"
    type: http
    target: "client"
    remote_download: true
    remote_unzip: true

  # pgbench: the YugabyteDB release tarball, delivered to the perf CLIENT pod
  # ONLY to obtain postgres/bin/ysql_bench — YB's fork of pgbench. Upstream
  # `pgbench` is NOT bundled in the release; perf/pgbench symlinks/wraps
  # ysql_bench as `pgbench` on the client PATH (apps/pgbench shells the bare
  # `pgbench` name). It is the SAME S3 tarball apps/ybpod/apps/yugabyted deploy,
  # fetched coordinator-side (aws s3 cp, ambient-authed) then kubectl-cp'd into
  # the pod and untarred there — the pod needs no AWS creds (mirrors ybpod).
  # version "yugabyte-{yugabytedb_base}" is the tarball's real extracted
  # directory (build/os/arch suffix dropped). centos-x86_64 by default (GKE nodes
  # are x86); for an arm client node override glob_path/url to the
  # -almalinux8-aarch64 tarball. remote_unzip needs tar+gzip on the client image.
  pgbench:
    version: "yugabyte-{yugabytedb_base}"
    glob_path: "yugabyte-{yugabytedb}-centos-x86_64.tar.gz"
    url: "s3://releases.yugabyte.com/{yugabytedb}/yugabyte-{yugabytedb}-centos-x86_64.tar.gz"
    type: s3
    target: "client"
    remote_unzip: true

# --- Secrets (core/secret.go) ---
# Named credentials, resolved by name and NEVER recorded into results (the
# secrets subtree is redacted from every config snapshot; resolved values are
# masked in logs/errors). Each entry supplies its value EXACTLY ONE way:
#
#   secrets:
#     gh_package:     {env: GH_PACKAGE_TOKEN}   # value = the env var's value
#     gcp_key:        {file: /path/to/key.json} # value = file CONTENTS; Path() = path
#     inline_token:   {token: "ghp_..."}        # literal (prefer env/file)
#
# Referenced BY NAME elsewhere (an artifact's `secret:`, apps.cloud.aws.
# access_key_secret, ...). Empty by default; declare per-project.
#
# A credential set as a plain knob instead (quay_token, *.password) is redacted
# from the config snapshot by key name, and masked everywhere else once it
# differs from the default here — but declare it as a secret where you can.
secrets: {}

# --- Reporting sinks (cmd/ampqa/run.go, report/jsonfile, report/junit) ---
report:
  # Per-result JSON dir, under <out_dir>/<runid>/. Empty → sink not attached.
  out_dir: ""
  # JUnit XML path. Empty → sink not attached.
  junit_path: ""
  # Self-contained HTML report path, rendered when the run finishes (same output
  # as `ampqa report --from`). Empty → sink not attached.
  html_path: ""
  # Live streaming to the amp report portal (--portal / --report override).
  # url empty → sink not attached. The sink is non-critical: a portal outage
  # never fails or slows a run.
  portal:
    # Portal base URL, e.g. https://amp-qa.dev.yugabyte.com
    url: ""
    # Report bucket the run files under on the portal (e.g. regression).
    report: ""
    # Adopt an existing portal run (created at trigger time) instead of
    # opening a new one — CI passes the trigger's run id here.
    run_id: ""
    # Run-identity stamps, all optional (CI sets them; empty ones are omitted).
    branch: ""
    commit: ""
    build_tag: ""
    trigger_type: ""
    triggered_by: ""
  # Per-test caps on how many steps/metrics a single Result retains in memory.
  # The live sink already got every event; these only bound the snapshot so a
  # 24h soak emitting per-cycle events can't balloon RAM. Beyond the cap the
  # oldest are dropped and a dropped-count is recorded. 0 → unbounded.
  max_steps_retained: 10000
  max_metrics_retained: 10000
  # When to collect Kubernetes diagnostics (controller/endpoint/YB pod logs —
  # current AND previous-instance — plus namespace events and pod describes)
  # into the run's artifacts BEFORE teardown deletes the namespace. on_failure
  # (default) collects only for a run that needs explaining — nobody reads a
  # green run's controller logs, and collecting them costs a pod-log pull per
  # pod at teardown and tens of megabytes of stored blobs per run. always
  # collects every run; never disables it.
  collect_diagnostics: on_failure

# task.* keys are per-invocation `ampqa task <name>` arguments (task.host,
# task.artifact, ...), not framework defaults, so they are not declared here
# (task.dry_run's "false" default is the zero value, no entry needed).

# --- Chaos engine (chaos/chaos.go, chaos/config.go) ---
# The fault-injection ("nemesis") loop: named, always-recoverable disruptions run
# against resources a test OWNS (YB pods on k8s / YB nodes on a host) while a
# workload runs. Severity/cadence are deliberately moderate so a background loop
# disrupts a workload without permanently wedging it. chaos.FromConfig reads these.
chaos:
  # actions restricts the loop to these action names (empty → every registered
  # action, in a stable order). Names: pod_delete, process_kill, process_restart,
  # node_restart, network_partition, network_slowdown, packet_loss, node_stop,
  # process_stall, pod_freeze.
  actions: []
  # owner_prefix guards which resources may be targeted: a pod whose namespace
  # does not CONTAIN this marker is refused (the loop will not start). Contains,
  # not prefix: a YBA-provisioned universe lives in yb-dev-ampqa-<tag>.
  owner_prefix: "ampqa-"
  # net_device is the interface tc/iptables actions operate on.
  net_device: "eth0"
  # partition_ports are the TCP ports network_partition drops (YB RPC/SQL/CQL).
  partition_ports: [7100, 9100, 5433, 9042]
  # delay_ms / loss_percent are the network_slowdown latency and packet_loss rate.
  delay_ms: 200
  loss_percent: 30
  # process_pattern / service_unit are the pkill match and systemd unit the
  # process_* actions signal/recover; node_units are the units node_restart cycles.
  process_pattern: "yb-tserver"
  service_unit: "yb-tserver"
  node_units: ["yb-master", "yb-tserver"]
  stall:
    # pattern matches the process process_stall SIGSTOPs and SIGCONTs (pkill -f).
    # The endpoint supervisor is the default: stalling it leaves postgres and the
    # storage daemons running with nobody renewing the branch's write lease.
    pattern: "endpoint-supervisor"
  freeze:
    # helper_image is the privileged hostPID pod pod_freeze writes the target's
    # cgroup.freeze from (a frozen pod cannot be exec-ed into). It needs nsenter.
    helper_image: "nicolaka/netshoot:v0.13"
  # hold_min/max bound how long a fault stays applied; gap_min/max the quiet
  # interval between recovery and the next injection.
  hold_min: "15s"
  hold_max: "45s"
  gap_min: "20s"
  gap_max: "60s"
  # wait_timeout bounds "wait until healthy again" recovery steps; recover_timeout
  # bounds each Recover's own background context so recovery survives cancellation.
  wait_timeout: "3m"
  recover_timeout: "2m"

# --- Global product health (suites/features/amp_product_health.go) ---
# One end-to-end scenario: sample-app workloads run in the background THROUGH an
# amp compute endpoint (client pod in the control-plane namespace) while the
# foreground exercises the control plane (LSN fork, endpoint delete+recreate),
# gated by a workloadgen consistency oracle and controller health. No enabled
# flag — selection (--tag health) is intent; it skips without a k8s cluster or
# the private sample-app jar secret.
health:
  # run_time is how long the three background workloads run.
  run_time: "5m"
  # client_image is the client-pod image the workloads run in. It MUST carry
  # java, sh, coreutils (tail/cat), procps (pgrep/pkill), curl and tar.
  client_image: "eclipse-temurin:21-jdk"
  # client_pull_secret names a PRE-EXISTING docker-registry Secret in the
  # control-plane namespace for a private client_image ("" → public image).
  client_pull_secret: ""
  # remote_dir is where the sample-app jar lands in the client pod.
  remote_dir: "/opt/ampqa"
  # jar_secret is the config secret authenticating the PRIVATE sample-app jar
  # fetch (github_release in yugabyte/yb-stress-test): GH_PACKAGE_TOKEN.
  jar_secret: "gh_package"
  # Background sample-app load shape (kept small; the endpoint is one compute pod).
  sample_tables: 2
  sample_threads_read: 1
  sample_threads_write: 2
  # workloadgen consistency-oracle dataset (loaded on base before the fork,
  # verified on the child and again on base at the end).
  verify_tables: 4
  verify_rows: 500
  # Timeouts.
  ready_timeout: "5m"
  verify_timeout: "5m"

# --- Stress suite (suites/stress) ---
stress:
  # The pre-flight gate every fault window opens with, and the attestation it
  # closes with (suites/stress/settle_helper.go). Without it a slow image pull
  # or a node hiccup inside the window reads as the product stalling.
  settle:
    # How long the writers must sustain min_tps before the fault is injected.
    duration: "20s"
    # Acknowledged rows per second, PER TENANT, the gate holds each writer to.
    # One a second is a floor a healthy endpoint clears by orders of magnitude;
    # it is here to catch a write path that is already dead, not to measure.
    min_tps: 1.0
    # How long the gate waits for every pod to be Running and Ready and for the
    # controller to answer /readyz. Covers a cold endpoint's node add and image
    # pull (10 to 19 minutes is the create budget; the pods are already up by
    # the time a fault window opens, so this is the recovery tail only).
    pod_ready_timeout: "5m"
    # false → a pod the test never aimed at restarting or being replaced during
    # the fault window is environment damage (env_failed, the pod named).
    # true → it is a product failure. stress/backing_disk_full has its own
    # key, defaulting true: a backing out of disk cascading into other pods IS
    # its subject.
    non_target_restart_is_failure: false
  # load_sustain: RandomOps phase length (suites/stress/load_sustain.go).
  duration: "60s"
  # combined: the signature COMBINED STRESS scenario (suites/stress/combined_load.go)
  # — sample-app workloads (SqlTransactions + SqlBankTransfer + two-phase
  # SqlDataLoad) run IN PARALLEL with BenchBase TPC-C in an in-cluster client pod,
  # while the chaos NemesisLoop injects faults against the co-located YB pods; then
  # it asserts the cluster is healthy and a seeded workloadgen dataset is still
  # consistent. Self-provisions real infra (k8s + secrets), so it is opt-in.
  # amp_nemesis kills the endpoint compute pods amp deployed while tenants
  # write through them; backing_nemesis kills the pods of the backing
  # YugabyteDB itself — whichever backing the run deployed (a YBA universe's
  # tservers, a ybk8s deploy's tservers, or the built-in yugabyted). Both read
  # every acknowledged row back and then check the pages themselves.
  amp_nemesis:
    tenants: 3
    # duration is the fault window; settle_timeout bounds recovery after it.
    duration: "3m"
    settle_timeout: "10m"
    payload_bytes: 256
  backing_nemesis:
    tenants: 3
    duration: "3m"
    settle_timeout: "10m"
    payload_bytes: 256
    # resume_duration is the throughput window after recovery, not a budget for it.
    resume_duration: "30s"
    # control_plane_recovery_max bounds how long the controller may keep answering
    # errors after the last backing pod kill (meko#961: ~2m of 503 while the
    # endpoints served normally). Any 500 during the window fails outright
    # (meko#886: an unreachable store is a 503, never a 500).
    control_plane_recovery_max: "2m"
  # sqlancer: SQLancer's logic-bug oracles against amp endpoints, `endpoints`
  # oracles at once, one endpoint each (suites/stress/sqlancer.go). NOTHING faults the stack:
  # SQLancer counts any exception a thread throws as a bug, a dropped connection
  # included. A finding is a reproducer log in the sqlancer/<oracle>/
  # attachments; it does not stop the remaining oracles.
  sqlancer:
    # Opt-in until it has a green run against a real amp endpoint: the test is
    # tagged stress, so enabling it puts ~3h on the daily-stress schedule.
    enabled: false
    # oracles are queued in this order; empty -> every oracle the amp provider
    # accepts (apps/sqlancer.Oracles). 16 oracles at time_per_oracle 10m over 4
    # endpoints is about 40m.
    oracles: []
    # endpoints is how many oracles run at once, each on an endpoint of its own.
    endpoints: 4
    # endpoint_cpu / endpoint_memory size each tenant endpoint (default: the
    # fleet's 500m / 4Gi). Memory must be at least 8Gi per vCPU.
    endpoint_cpu: "2"
    endpoint_memory: "16Gi"
    # Storage pressure: SQLancer's databases are a few MB, and an endpoint gives
    # shared_buffers half its memory plus a local file cache, so without these
    # no query ever reads a page from the pageserver and amp's own storage path
    # is never under test. 2MB is 256 buffers: enough pins for 32 connections
    # (SKIP_LOCKED doubles 16 threads) without "no unpinned buffers available".
    # file_cache_size_limit 0 turns the local file cache off.
    endpoint_pg_settings:
      shared_buffers: "2MB"
      yb_amp.file_cache_size_limit: "0"
    # GC as aggressive as suites/features/amp_gc_reclaim.go runs it, so history
    # is trimmed under the reads above. Keys are the controller's dotted paths.
    endpoint_pageserver_settings:
      tenant_config.enable_gc: true
      tenant_config.gc_candidate_every_n_bases: 1
      tenant_config.gc_period: "1s"
      tenant_config.gc_queue_floor_reset_interval: "5s"
      tenant_config.pitr_interval: "0s"
      tenant_config.gc_horizon: 1024
      tenant_config.lsn_lease_length: "2s"
    # qpg_oracles get --qpg-enable true (Query Plan Guidance: mutate the tables
    # until a query yields no new plan). Only an oracle that implements
    # getLastQueryString can run under QPG; in the YSQL provider that is NoREC.
    # The TLP oracles throw "Not supported!" on their first query (run 3ae29420).
    qpg_oracles: ["NOREC"]
  # fault_metrics: the last step of wal_tail_nemesis, backing_node_partition and
  # control_plane_nemesis (suites/stress/fault_metrics_helper.go). It samples the
  # product's OWN prometheus exposition across the fault and holds each named
  # metric to rising inside the window and coming back after it, so the signal an
  # operator would be paged on is proved to exist. A metric the exposition does
  # not carry fails the step naming it: that absence is the finding.
  fault_metrics:
    enabled: true
    # rise_factor is how many times its pre-fault baseline a metric must reach
    # inside the window to count as having moved, and the margin it must come
    # back within afterwards. A counter whose baseline is zero only has to leave
    # zero and return.
    rise_factor: 2.0
  # consistency: the final physical-consistency step every stress test that
  # drives amp tenants ends with (suites/stress/consistency_helper.go). amcheck
  # reads the pages themselves, so a heap or index rebuilt wrongly after a fault
  # fails here rather than passing a row count.
  consistency:
    enabled: true
    # timeout bounds the step per endpoint: bt_index_check(heapallindexed) and
    # verify_heapam each read the entire relation.
    timeout: "10m"
    # max_relations caps how many relations, indexes and primary-key tables are
    # checked per endpoint. 0 means all, and anything left out is recorded on
    # the step rather than passed over silently.
    max_relations: 0
    # probe_sql is DEBUG ONLY. When set it runs in place of bt_index_check, once
    # per index, so the step can be shown to fail (a page cannot be corrupted
    # over the wire). Leave it empty in any real run.
    probe_sql: ""
  # backing_unreachable_api: deletes the backing's serving pods, then drives
  # reads and cluster creates on a transport that retries nothing, so the 503 the
  # controller sends for an unreachable store is seen rather than retried away
  # (meko#886). max_call_latency is the hang ceiling for one call: an unreachable
  # store is reported, not waited on.
  backing_unreachable_api:
    fault_duration: "90s"
    settle_timeout: "10m"
    call_interval: "2s"
    # max_call_latency is the hang ceiling, not a latency bar: the slowest call is
    # reported as a metric, and only a call that never returns inside this fails.
    max_call_latency: "120s"
  # backing_disk_full: fills every backing data disk to within a few MiB, writes
  # through amp, and holds each statement to erroring or committing inside
  # stall_limit. A COMMIT parked forever on a full backing (meko#727 signature)
  # is the failure; once the disks are freed writes must resume and every
  # acknowledged row must be present.
  backing_disk_full:
    tenants: 2
    baseline_duration: "20s"
    # fault_duration is the write window while the disks are full.
    fault_duration: "90s"
    # stall_limit is how long one INSERT may take before it counts as hung.
    stall_limit: "60s"
    # keep_free_mib is what the filler leaves on each data disk.
    keep_free_mib: 16
    # fill is "all" (every backing pod, the write path has nowhere to go) or
    # "one" (a single pod, RF should absorb it and writes must keep flowing).
    fill: "all"
    settle_timeout: "10m"
    resume_duration: "30s"
    payload_bytes: 256
    # A tenant endpoint or other pod going down while the disks are full is a
    # product failure (meko#1110), not environment damage.
    non_target_restart_is_failure: true
  # commit_durability: journals every commit's acknowledgement per id under faults,
  # then holds storage to the EXACT acked set. A count check cannot do this: a lost
  # acked row net-cancelled by an unacknowledged one passes it.
  commit_durability:
    tenants: 3
    baseline_duration: "20s"
    duration: "3m"
    settle_timeout: "10m"
    resume_duration: "30s"
    payload_bytes: 256
    # cancel_probability is the share of inserts cancelled mid-flight. A commit the
    # server acks despite an in-flight cancel becomes a durability obligation.
    cancel_probability: 0.1
    cancel_delay_max: "50ms"
  # linearizable_bank: records every bank operation to a JSONL history and checks
  # it offline for a changed total, a negative balance, a snapshot that went
  # backwards, an acknowledged transfer the final state does not reflect, and
  # write skew under serializable.
  linearizable_bank:
    tenants: 3
    # accounts are the plain bank accounts; skew_pairs more pairs are added for
    # the pair-guarded operations write skew needs, plus one sink account.
    accounts: 10
    skew_pairs: 4
    writers: 4
    readers: 2
    # isolation of the transfer transactions: read committed, repeatable read or
    # serializable. The write-skew invariant is only checked under serializable.
    isolation: "read committed"
    # unguarded drops the WHERE bal >= amount predicate. Stock PostgreSQL then
    # overdraws an account, which is the red proof for the negative-balance check.
    unguarded: false
    initial_balance: 2000
    max_amount: 500
    # flush_ops bounds how many operations the history holds before it hits disk.
    flush_ops: 200
    read_interval: "200ms"
    baseline_duration: "20s"
    duration: "3m"
    settle_timeout: "10m"
    resume_duration: "30s"
  # storage_proc_nemesis: kills the pageserver/safekeeper PROCESSES inside a
  # tenant's endpoint pod, under a live postgres, and holds the endpoint
  # supervisor to respawning them in place within its restart budget.
  storage_proc_nemesis:
    tenants: 2
    baseline_duration: "20s"
    # fault_duration is the write window the kills land inside.
    fault_duration: "90s"
    # daemons are the supervisor's children aimed at (boot.rs services()).
    # compute_ctl runs as the compute-ctl binary and takes its postmaster down
    # with it (meko#898); the supervisor must respawn it in place like the two
    # storage daemons.
    daemons: ["pageserver", "safekeeper", "compute_ctl"]
    # kills_per_daemon stays under the supervisor's budget of 5 restarts per
    # 180s, above which it exits and the pod is recreated instead.
    kills_per_daemon: 1
    kill_gap: "15s"
    settle_timeout: "10m"
    # resume_duration is the post-kill write window proving COMMIT works again.
    resume_duration: "30s"
    payload_bytes: 256
  # sync_commit_levels: one session per synchronous_commit level, all writing at
  # once. local_txn sets local with SET LOCAL inside each transaction.
  sync_commit_levels:
    levels: ["on", "local", "remote_write", "remote_apply", "local_txn", "off"]
    baseline_duration: "20s"
    # The safekeeper is frozen freeze_lead into the round for freeze_duration;
    # compute_ctl is killed kill_lead before the thaw. Writes issued within
    # freeze_grace of the freeze may already have been durable.
    freeze_lead: "5s"
    freeze_duration: "10s"
    freeze_grace: "1s"
    kill_lead: "3s"
    # The plain crash lands crash_lead into a crash_lead + crash_tail window.
    crash_lead: "10s"
    crash_tail: "20s"
    settle_timeout: "10m"
    resume_duration: "20s"
    payload_bytes: 256
  # wal_segment_switch: first a safekeeper kill on top of one record larger than
  # its 64 MiB anchor scan window (large_record_bytes, 0 = skip that round), then
  # pg_switch_wal on a timer and a restart per round: safekeeper, compute_ctl, then
  # safekeeper again after the amp_storage.wals tablets are split
  # (split_wal_tablets).
  wal_segment_switch:
    tenants: 1
    baseline_duration: "20s"
    rounds: 3
    round_duration: "30s"
    switch_interval: "3s"
    # post_switch_writes is how long acked commits pile up above the last
    # switch's padding before the kill.
    post_switch_writes: "2s"
    large_record_bytes: 83886080
    split_wal_tablets: true
    settle_timeout: "10m"
    resume_duration: "30s"
    payload_bytes: 256
  # partition: shared by the two partition tests below. The rules are inserted in
  # the TARGET pod's network namespace by a privileged, hostPID helper pod on the
  # same node (nsenter + iptables), because neither the endpoint image nor the YB
  # pods carry iptables or NET_ADMIN, and amp-dev's CNI does not enforce
  # NetworkPolicy. helper_image needs nsenter, iptables, bash-less sh, grep, sed.
  partition:
    helper_image: "nicolaka/netshoot:v0.13"
    # device, shape_verify_pings and shape_tolerance are the netem shaping
    # knobs of backing_node_partition_multi_region: the interface delayed, the
    # echoes each round-trip check averages, and the fraction of the requested
    # round trip (never under 1 ms) a measured one may deviate.
    device: "eth0"
    shape_verify_pings: 10
    shape_tolerance: 0.3
  # backing_node_partition: cuts ONE backing tserver pod off the network
  # (every packet in and out dropped; the pod stays up, so peers and clients sit
  # in RPC timeouts instead of seeing a connection refused) while tenants write
  # through amp. With a quorum left, every INSERT must commit or error inside
  # stall_limit. The partition is probed from inside the pod before the test
  # relies on it.
  backing_node_partition:
    tenants: 3
    # rounds: each cuts the next backing pod in a seeded order.
    rounds: 2
    baseline_duration: "20s"
    # hold_duration is how long the pod stays partitioned while writers run;
    # longer than stall_limit so a stall that ends is measured, not just seen.
    hold_duration: "5m"
    # stall_limit is the longest the write path may go without an
    # acknowledgement; one INSERT past it is also cut off and journaled unknown.
    stall_limit: "2m"
    # min_backing_pods: below RF3 one node out legitimately stops the writes,
    # so a smaller backing skips instead of failing.
    min_backing_pods: 3
    settle_timeout: "10m"
    resume_duration: "30s"
    payload_bytes: 256
    control_plane_recovery_max: "2m"
    # multi_region_topology is the netshape topology
    # backing_node_partition_multi_region shapes the backing and the endpoints
    # into before writing: tserver N by name order is site N, the endpoints sit
    # in the @ site (0 when absent). Format as perf.latency_topology.topologies.
    multi_region_topology: "multi_region: 0-1=12 0-2=47 1-2=60"
  # endpoint_backing_partition: cuts ONE tenant's endpoint pod off the backing
  # (its egress to every backing pod and Service IP dropped; the pod stays up
  # and reachable for clients) while journaled writes run. The write lease
  # (endpoint_supervisor fence.rs) must then stop the endpoint acknowledging
  # commits, every acknowledged id must be in storage once the link is back, the
  # other tenants must keep committing, and the endpoint must come back by itself.
  endpoint_backing_partition:
    tenants: 2
    rounds: 2
    baseline_duration: "20s"
    hold_duration: "90s"
    # stall_limit bounds an INSERT on an UNCUT endpoint; on the cut one a hang
    # is the expected outcome and only journaled.
    stall_limit: "60s"
    # fence_within is how long after the cut a commit may still be acknowledged:
    # the lease TTL (15s) plus a renewal in flight, with margin.
    fence_within: "45s"
    settle_timeout: "10m"
    resume_duration: "30s"
    payload_bytes: 256
  # fence_stall: stalls the writer of a branch past its write lease and resumes
  # it, without taking anything away. stress/fence_stall freezes the whole
  # endpoint pod through cgroup v2, stress/fence_stall_supervisor SIGSTOPs the
  # supervisor alone so postgres keeps running with nobody renewing the lease.
  fence_stall:
    # lease_ttl and skew_grace are the product's numbers (compute/architecture/
    # compute-fencing.md): a 15s token renewed every 5s, and the 500ms a
    # replacement waits out because two PG clocks disagree. Retune them here to
    # match a branch whose write_token_settings were changed.
    lease_ttl: "15s"
    skew_grace: "500ms"
    # freeze is how long the writer stays stalled. It MUST exceed
    # lease_ttl + skew_grace, or the lease never lapses, and fence_deadline, or
    # the window closes before a late acknowledgement could be seen.
    freeze: "90s"
    # fence_deadline is how long after the stall began a commit may still be
    # acknowledged, and how long after the resume the safekeeper that ran before
    # it may still be running.
    fence_deadline: "60s"
    baseline_duration: "20s"
    resume_duration: "30s"
    # stall_limit bounds one INSERT; on the stalled endpoint a hang is the
    # expected outcome and only journaled.
    stall_limit: "60s"
    settle_timeout: "10m"
    payload_bytes: 256
  # bulk_load_kill: deletes a tenant's endpoint compute pod while ONE large
  # write is streaming into it, and holds that write to all-or-nothing. Sizes
  # here are the nightly ones: 4M baseline + eight 1.5M blocks + the commit-kill
  # block, so 17.5M rows. The total is baseline + one block per LOADING round +
  # the commit-kill block, so adding an op to ops{} grows the dataset without any
  # size knob changing — check dataset_rows_planned on load_baseline. Raise
  # row counts, not payload_bytes, to go bigger — rows are what make a write last
  # long enough to be killed mid-flight, bytes only make the verification slower.
  #
  # Going bigger means sizing the BACKING too. amp stores pages, WAL and the
  # image chains an update round leaves behind, so the volume holds several times
  # the user data: 18M rows fits the default env.ampstack.yb_storage of 20Gi, and
  # 36M rows does not — the tserver starts rejecting writes for want of space,
  # the compute wedges, and it reads exactly like a product bug (runs 79e5de84,
  # 1d6134df, 12bbd532). Raise env.ampstack.yb_storage with the row counts.
  bulk_load_kill:
    baseline_rows: 4000000
    # batch_rows is one killed write. Too small and it commits before the
    # kubelet acts, which the run then reports as proving nothing.
    batch_rows: 1500000
    # rounds: the op cycles every round and the kill mode advances once every op
    # has had a turn, so ops (5) * kill_modes (2) = ten rounds cover every write
    # shape against both ways the compute can die.
    rounds: 10
    # ops are cycled over the rounds. copy streams from the client; insert_select
    # is one server-side statement (an in-database ETL); batch_insert is what an
    # application does — one transaction holding thousands of small parameterised
    # INSERTs, the client sending rows throughout; txn spans a few large
    # statements plus COMMIT; update rewrites the block the round before it
    # loaded (so it cannot be first) instead of adding rows.
    ops: ["copy", "insert_select", "batch_insert", "txn", "update"]
    # rows_per_statement is one batch_insert statement, sized like an
    # application's batch so the transaction is thousands of statements long.
    rows_per_statement: 1000
    # kill_modes: graceful is a rolling update (postgres shuts down and aborts
    # tidily); force kills the container outright, no chance to abort anything.
    kill_modes: ["graceful", "force"]
    # payload_bytes is what makes the dataset big in BYTES; row counts are what
    # make a write take long enough to be killed mid-flight. Verification reads
    # every byte back, so this is the knob that decides how long a run takes.
    payload_bytes: 128
    # update_rows is how many rows an update round rewrites, off the front of the
    # block before it. Every updated row is a version the later scans have to
    # read, so a whole block would double the cost of every check after it.
    update_rows: 500000
    # baseline_probe_rows is the rotating slice of the baseline each round
    # re-reads. Reading all of it every round costs more than everything else
    # together; verify_dataset covers the whole of it at the end.
    baseline_probe_rows: 500000
    # secondary_index adds an index on v. Without it the only index is the primary
    # key, and a bulk load's index maintenance — the part a kill is most likely to
    # leave half-done — is never exercised.
    secondary_index: true
    # commit_kill runs one more block after the rounds, to completion, and kills
    # the compute the instant the server acknowledges it: the rounds tear writes
    # that never committed, this one tests that an acknowledged write survives.
    commit_kill: true
    # visibility_probe polls the range from a second connection while the write
    # runs. Each poll is its own snapshot, so it may only see none of the write or
    # all of it; anything else is a reader seeing an uncommitted bulk write.
    visibility_probe: true
    visibility_period: "500ms"
    # visibility_window_rows is how many rows at the front of the range a poll
    # counts. Counting the whole range takes seconds, which left the probe with
    # one or two polls per write; a window this size answers at once.
    visibility_window_rows: 10000
    # verify_parallel is how many verification chunks are read at once. Scans are
    # what a big dataset costs, and one connection reads them one at a time.
    verify_parallel: 4
    # load_chunk_rows bounds one baseline COPY.
    load_chunk_rows: 50000
    # kill_fraction is how far into the batch the pod is deleted — exact for a
    # copy, and for the ops the client cannot observe a delay derived from the
    # rate the baseline loaded at, bounded by kill_delay_min/max.
    kill_fraction: 0.4
    kill_delay_min: "2s"
    kill_delay_max: "2m"
    # endpoint_cpu/endpoint_memory size the single tenant's compute. The
    # multitenant reservation (500m/1Gi) exists to fit many tenants on a shared
    # cluster, and 2/4Gi is still not enough here: reading an 18M-row table back
    # OOM-killed the container twice (run 6fe61127), while 4/8Gi did it fine.
    endpoint_cpu: "4"
    endpoint_memory: "8Gi"
    # verify_chunk_rows bounds one verification query. A count over millions of
    # rows sends nothing for minutes and the port-forward to the endpoint does
    # not survive that; the chunked total is the same number.
    verify_chunk_rows: 500000
    load_timeout: "20m"
    settle_timeout: "10m"
  combined:
    # enabled gates the whole scenario (self-provisioning + private jar + k8s).
    enabled: false
    # rf is the co-located YB replication factor. >=3 so the cluster survives
    # single-node chaos (pod delete / process kill); the deploy clamps up to this.
    rf: 3
    # run_time is how long the four concurrent workloads run (kept short + cheap).
    run_time: "3m"
    # client_image is the client-pod image the workloads run in. It MUST carry
    # java, sh, coreutils (tail/cat), procps (pgrep/pkill), curl and tar. The
    # default is a public JDK image; override to an amp/quay workload image (and
    # set client_pull_secret) for a private one.
    client_image: "eclipse-temurin:21-jdk"
    # client_pull_secret names a PRE-EXISTING docker-registry Secret in the YB
    # namespace for a private client_image ("" → the image is public).
    client_pull_secret: ""
    # remote_dir is where the sample-app jar and benchbase unpack in the client pod.
    remote_dir: "/opt/ampqa"
    # jar_secret is the config secret authenticating the PRIVATE sample-app jar
    # fetch (github_release in yugabyte/yb-stress-test): GH_PACKAGE_TOKEN.
    jar_secret: "gh_package"
    # Small load params keep the run cheap.
    sample_tables: 2
    sample_value_columns: 10
    sample_threads_read: 1
    sample_threads_write: 2
    benchbase_warehouses: 1
    benchbase_terminals: 2
    # workloadgen consistency-oracle dataset (loaded before chaos, verified after).
    verify_tables: 4
    verify_rows: 500
    # chaos_actions is the k8s-safe subset the loop draws from (pod/process level;
    # the tc/iptables ones need privileged host tooling not present in YB pods;
    # stress.backing_node_partition and stress.endpoint_backing_partition bring
    # their own through a helper pod, see stress.partition).
    chaos_actions: ["pod_delete", "process_kill", "process_restart"]
    # Timeouts.
    ready_timeout: "5m"
    verify_timeout: "5m"
    health_timeout: "5m"
  # backing_maintenance: amp tenants write THROUGH their endpoints while the
  # YugabyteDB under amp is put through planned maintenance on YBA — gflag
  # change, data move, software upgrade. backing_nemesis covers the ungraceful
  # case; this covers what an operator does. The workload goes through amp on
  # purpose: writing straight to YugabyteDB says nothing about amp compute or
  # the pageserver. After every operation amp must have ACKNOWLEDGED commits
  # while it was in flight, and every acknowledged row must read back at the
  # end. Maintains the run's OWN backing, so it needs
  # env.yb_deploy=yba_provisioned.
  backing_maintenance:
    # enabled gates the whole scenario.
    enabled: true
    # rf must be >=3 (gated) and match apps.yba.k8s.replication_factor: below
    # that, a node going out stops the writes for a legitimate reason.
    rf: 3
    # The ordered sequence. rolling_restart is absent on purpose: a full roll
    # that proves less than the gflag change, which is the same restart with
    # something to verify. data_move needs apps.yba.k8s.num_nodes > rf, which
    # the default universe lacks. software_upgrade is absent because it needs a
    # universe CREATED a train behind the target (see upgrade_to below) and one
    # already at or past it fails the run — a scheduled sweep on the current
    # release would go red on configuration, not on a bug. All three stay
    # selectable; add software_upgrade together with a pinned
    # apps.yba.universe.yb_version.
    # The topology operations (leader_stepdown, tablet_split,
    # master_leader_change) move where the data or its leadership lives while
    # the tenants write, which is the class of bug meko#811, #1048 and #1119
    # came from. add_remove_tserver grows the universe by one tserver and
    # drains it back; disk_latency slows one replica.
    operations: ["gflag_change", "leader_stepdown", "tablet_split", "master_leader_change", "add_remove_tserver", "disk_latency"]
    # Each tenant gets its own amp cluster, endpoint, journaled writer and a
    # distinct workload: 0 SqlTransactions, 1 SqlBankTransfer, 2 TPC-C, then
    # repeating. Below 3 tenants some workloads do not run.
    tenants: 3
    payload_bytes: 256
    # baseline_duration makes a later zero-commit verdict about the maintenance
    # rather than a workload that never worked; resume_duration is the probe for
    # a backing that came back but can no longer commit.
    baseline_duration: "20s"
    resume_duration: "30s"
    # upgrade_to: leave empty and the target is the YBA's OWN version, which is
    # the ceiling anyway. The universe must then be CREATED a train behind
    # (apps.yba.universe.yb_version), and one already at or past the target
    # fails the run. A release the YBA has never seen is imported first.
    upgrade_to: ""
    upgrade_image_tag: ""
    # upgrade_arch is the release architecture imported when the YBA's catalog
    # does not already carry the target version.
    upgrade_arch: "x86_64"
    # gflag_key/gflag_value is the tserver gflag the gflag_change operation
    # sets. The default only lengthens WAL retention, so it changes no behaviour
    # the workload depends on while still forcing a real rolling restart. YBA
    # REJECTS a gflag upgrade that changes nothing, so the value must differ
    # from what the universe already carries.
    gflag_key: "log_min_seconds_to_retain"
    gflag_value: "1800"
    # min_commits_per_op is how many commits must be acknowledged DURING each
    # operation for amp to count as having stayed writable through it.
    # Deliberately low: the assertion is "the write path survived", not a
    # throughput target.
    min_commits_per_op: 1
    # max_nodes_out_at_once is what makes an operation rolling rather than an
    # outage: pods are sampled WHILE it runs. The task succeeding proves
    # nothing — an all-at-once restart that finishes looks the same.
    max_nodes_out_at_once: 1
    rolling_sample_interval: "5s"
    # node_restart_sleep is the pause YBA leaves after a node comes back before
    # taking the next one down.
    node_restart_sleep: "180s"
    # The workloads run in a client pod beside amp. client_image MUST carry
    # java, sh, coreutils, procps, curl and tar. jar_secret authenticates the
    # PRIVATE sample-app jar fetch.
    client_image: "eclipse-temurin:21-jdk"
    client_pull_secret: ""
    remote_dir: "/opt/ampqa"
    jar_secret: "gh_package"
    workload_threads_read: 1
    workload_threads_write: 2
    # workload_run_time only has to outlast the maintenance; the run collects
    # and kills the workloads when the sequence ends.
    workload_run_time: "4h"
    benchbase_warehouses: 1
    benchbase_terminals: 2
    # benchbase_start_grace: TPC-C has no "generating load" signal while it
    # creates and loads, so this is how long a bad connection gets to surface.
    benchbase_start_grace: "30s"
    # SqlBankTransfer's conserved total is the invariant a lost or duplicated
    # write breaks; it runs with --bank_exit_on_fail so it stops on a mismatch.
    bank_accounts: 200
    # move_timeout bounds the blacklist drain and the rebalance after it;
    # settle_timeout bounds endpoints coming back once the maintenance ends.
    move_timeout: "30m"
    settle_timeout: "10m"
    # tablet_tables are the tables in amp's storage database (yb_storage) the
    # topology operations move: the WAL the writes land in and the pages they
    # are materialized into.
    # tablet_split takes the LAST of them, the one that grows fastest under the
    # workloads and therefore the one YB will accept a split on.
    tablet_tables: ["wals", "pages"]
    # stepdown_interval paces leader_stepdown and master_leader_change;
    # stepdown_duration bounds the whole leader_stepdown walk, which would
    # otherwise run as long as the table has tablets.
    stepdown_interval: "10s"
    stepdown_duration: "3m"
    master_stepdowns: 3
    # resume_deadline is the product statement every topology operation is
    # judged by: amp rides a leader change, a split or a node edit out, so the
    # tenants must never go longer than this without an acknowledged commit
    # while one runs. stall_sample_interval is how finely that span is measured
    # (the acknowledged-commit counter is sampled, not each INSERT timed).
    resume_deadline: "2m"
    stall_sample_interval: "1s"
    # split_timeout bounds the new tablets appearing and the rebalance after
    # them; edit_timeout bounds a YBA node add or drain, which provisions or
    # removes a whole node.
    split_timeout: "10m"
    edit_timeout: "45m"
    # disk_latency delays one tserver's traffic to its peers' RPC port for
    # disk_latency_duration: a slow replica, not a cut one. tc cannot slow a
    # disk from outside the pod, and the replication path is where the
    # slowness shows up anyway.
    disk_latency: "200ms"
    disk_latency_duration: "3m"
  # backing_backup_restore: amp tenants write THROUGH their endpoints while the
  # YugabyteDB under amp runs YBA's data-protection operations — full backup,
  # restore, PITR rewind, a recurring backup schedule. Restores only ever roll
  # probe databases created for the purpose; amp's own keyspace is backed up
  # (the distributed snapshot under live write traffic is the point) but never
  # restored over. The backup store is a MinIO the test deploys beside the
  # universe, so no cloud credentials are needed. Backups require YBC on the
  # universe (apps.yba.k8s.enable_ybc, on for kubernetes universes) and
  # env.yb_deploy=yba_provisioned (kubernetes); the test skips without either.
  backing_backup_restore:
    # enabled gates the whole scenario.
    enabled: true
    # The ordered sequence; restore must come after backup. scheduled_backup
    # dominates the runtime when schedule_fire_timeout is non-zero.
    operations: ["backup", "restore", "pitr", "scheduled_backup"]
    # Tenant 0 runs SqlTransactions, tenant 1 SqlBankTransfer, tenant 2 TPC-C,
    # then repeating; the default 2 keeps exactly the two sample-app workloads.
    # At 3 or more the benchbase_* knobs below start driving a TPC-C tenant.
    tenants: 2
    # backup_amp_keyspace also takes a full backup of amp's yb_storage keyspace
    # while the tenants write into it.
    backup_amp_keyspace: true
    # storage_config_name is the YBA storage config registered for the MinIO
    # (reused when it already exists, so kept envs don't stack duplicates).
    storage_config_name: "ampqa-minio"
    minio_server_image: "cgr.dev/chainguard/minio:latest"
    minio_client_image: "cgr.dev/chainguard/minio-client:latest"
    # storage_ready_timeout bounds the MinIO pod start and bucket bootstrap.
    storage_ready_timeout: "5m"
    # probe_rows sizes each probe database (backup/restore round-trip checksum,
    # and each half of the PITR before/after mark).
    probe_rows: 2000
    # PITR window: retention must cover the whole operation; interval matters
    # little since the config-creation snapshot already covers the mark.
    pitr_retention: "4h"
    pitr_interval: "1h"
    # pitr_mark_margin separates the mark from the writes on either side, so
    # commit-time granularity cannot blur which rows the restore should keep.
    pitr_mark_margin: "5s"
    # schedule_frequency is the recurring backup period (YBA's floor is 1h).
    # The FIRST scheduled backup fires immediately, within YBA's 2-minute
    # scheduler tick, so observing one costs minutes rather than a full period.
    # schedule_fire_timeout of 0 skips the wait and only asserts the schedule
    # registered.
    schedule_frequency: "1h"
    schedule_fire_timeout: "10m"
    payload_bytes: 256
    baseline_duration: "20s"
    resume_duration: "30s"
    min_commits_per_op: 1
    client_image: "eclipse-temurin:21-jdk"
    client_pull_secret: ""
    remote_dir: "/opt/ampqa"
    jar_secret: "gh_package"
    workload_threads_read: 1
    workload_threads_write: 2
    workload_run_time: "4h"
    bank_accounts: 200
    # benchbase_*: only reached at tenants >= 3, where a TPC-C tenant appears.
    benchbase_warehouses: 1
    benchbase_terminals: 2
    benchbase_start_grace: "30s"
    settle_timeout: "10m"

  # soak: the hours-long lane (stress/soak). Untagged, selected by name from a
  # schedule. Three tenants — steady OLTP, bank, and one forking and dropping a
  # branch every churn_interval — run for duration while a sampler reads the
  # tenants' pageservers, amp_storage.wals and the controller task table, and
  # six trends are asserted over the sampled series at the end.
  soak:
    # enabled gates the whole scenario.
    enabled: true
    # duration is the soak itself. The registered test Timeout is 14h, so a
    # duration past ~13h leaves no room for tenant creation and verification.
    # A review run uses 30m.
    duration: "8h"
    # Tenant 0 is the steady OLTP tenant (SqlTransactions), tenant 1 the bank
    # (SqlBankTransfer, whose conserved total a lost write breaks), the LAST one
    # churns branches. Below 3 the test skips.
    tenants: 3
    payload_bytes: 256
    churn_interval: "10m"
    # sample_interval paces both the soak's own probes and the per-tenant
    # endpoint metrics samplers; max_samples is the per-line ring that keeps a
    # 14h run's heap flat (4000 at 30s covers 33h).
    sample_interval: "30s"
    max_samples: 4000
    # rss_slope_mib_per_hour is the leak gate: a least-squares fit of pageserver
    # RSS over the last rss_fit_fraction of the run, per endpoint pod, after
    # rss_warmup is dropped. A pageserver filling its caches climbs as fast as a
    # leaking one, so a run leaving fewer than min_fit_samples past the warm-up
    # reports the slope as a datapoint and asserts nothing.
    rss_slope_mib_per_hour: 50.0
    rss_fit_fraction: 0.75
    rss_warmup: "30m"
    # amp_storage.wals must not end past wals_growth_factor times what it held
    # wals_baseline_after into the run.
    wals_growth_factor: 2.0
    wals_baseline_after: "1h"
    # gc_lag_monotonic_limit is how long the GC drain lag may rise without once
    # falling before the drain counts as not keeping up.
    gc_lag_monotonic_limit: "30m"
    # chain_limit mirrors the pageserver's own image_chain_limit (20); the test
    # allows chain_limit + chain_limit_slack for chain_sample_fraction of the
    # samples. Raise chain_limit with the product setting, never to hide drift.
    chain_limit: 20.0
    chain_limit_slack: 5.0
    chain_sample_fraction: 0.95
    # The steady tenant's p99 point-read latency is bucketed by latency_bucket;
    # the last bucket may not exceed latency_growth_factor times the first.
    latency_growth_factor: 2.0
    latency_bucket: "10m"
    latency_probe_interval: "1s"
    # max_tasks bounds the controller task table at the end of the run.
    max_tasks: 20000
    # min_fit_samples is what a slope or a percentile needs before it is
    # asserted rather than merely published.
    min_fit_samples: 10
    # The two sample-app workloads run in a client pod beside the endpoints.
    # client_image MUST carry java, sh, coreutils, procps, curl and tar;
    # jar_secret authenticates the PRIVATE sample-app jar fetch.
    workload_threads_read: 1
    workload_threads_write: 2
    bank_accounts: 200
    client_image: "eclipse-temurin:21-jdk"
    client_pull_secret: ""
    remote_dir: "/opt/ampqa"
    jar_secret: "gh_package"
    # settle_timeout bounds every endpoint answering SQL again once the load stops.
    settle_timeout: "10m"

# --- Perf suite (suites/perf) ---
# perf/tpcc, perf/pgbench, perf/sysbench: provision a co-located RF3
# YugabyteDB-in-k8s cluster, stand an amp control plane + ONE compute endpoint on
# it (env.ampstack.*), launch an in-cluster client pod, and drive the benchmark
# THROUGH that endpoint — the product under test is amp, so compute + pageserver
# are in every measured request and the backing YugabyteDB is only the store
# behind them. Throughput + latency are parsed and gated against a stored
# baseline (a regression fails the test). BenchBase is a PUBLIC release, so —
# unlike the combined stress scenario — no private jar secret is needed.
# Self-provisions real infra (k8s + a chart), so it is opt-in, and it needs
# env.ampstack.controller_chart to have a control plane to deploy.
perf:
  # rf is the replication factor of the co-located YB cluster the amp control
  # plane is backed by (the deploy clamps up to this).
  rf: 3
  # provisions is how many FRESH backing + control plane + endpoint stacks the
  # heavy bench workloads (tpcc, pgbench, sysbench) stand up and benchmark, ALL
  # CONCURRENTLY, so N stacks cost one wall clock; the gated headline is the
  # MEDIAN across provisions. Iterations inside one stack agree to ~1% while
  # stack-to-stack spread runs 20%+, so this is the repeat that actually
  # samples the variance that matters. 1 restores the single-stack behaviour.
  provisions: 3
  # Small but perf-meaningful TPC-C load, fixed so runs are comparable. For
  # TPC-C the warehouse count IS the scalefactor. Kept modest to stay cheap, but
  # above the 1-2 warehouse floor where run-to-run variance (throughput ~14%,
  # tail latency up to ~48% observed at 2wh) drowns any real regression signal.
  warehouses: 4
  terminals: 8
  # client_image is the client-pod image benchbase runs in. It MUST carry java,
  # sh, coreutils, curl and tar. The default is a public JDK image; override to a
  # private one (and set client_pull_secret) if needed.
  client_image: "eclipse-temurin:21-jdk"
  # client_pull_secret names a PRE-EXISTING docker-registry Secret in the YB
  # namespace for a private client_image ("" → the image is public).
  client_pull_secret: ""
  # remote_dir is where benchbase unpacks in the client pod.
  remote_dir: "/opt/ampqa"
  # max_heap is the benchmark JVM's -Xmx. A small TPC-C needs little; the modest
  # default fits a client pod with no explicit memory limit (a large -Xmx can
  # fail JVM init on a small node).
  max_heap: "2g"
  # gate is the HISTORY gate: when the run streams to a report portal
  # (report.portal.url), the portal serves each datapoint's rolling median/MAD
  # over the last `window` comparable runs (same load signature + YugabyteDB
  # train, latest run per build) — DATA only. The band and the verdict are
  # computed here: regressed when the worse-direction delta exceeds
  # max(mad_k x MAD%, floor_pct). The portal is just the history store; the
  # baseline file below is the fallback for portal-less runs (and a portal
  # outage never fails a run on its own). When the live baseline arm ran
  # (perf.baseline.live below), this gate is informational — the live
  # comparison is the verdict.
  gate:
    # window is how many prior comparable runs the rolling median is over.
    window: 10
    mad_k: 3.0
    # floor_pct is the minimum band: steadier history than this still gets
    # this much tolerance.
    floor_pct: 5.0
    # min_runs is the history floor below which a datapoint is no_signal.
    min_runs: 5
    # A band wider than this means one run cannot resolve anything short of a
    # collapse, so the datapoint is reported "noisy" and left to the trend.
    max_band_pct: 50.0
  # baseline.live runs the SAME workload on a second set of stacks deployed
  # from a prior amp release, CONCURRENTLY with the run's own, and gates
  # current-vs-that under identical cluster conditions (thresholds:
  # throughput_drop_pct / latency_rise_pct below). The arm's release is
  # baseline.image_version when set; else the release before the current tag;
  # else (custom tag) the newest release — resolved from the portal's builds
  # list, and skipped (history gate takes over) when none is resolvable.
  # Doubles the run's stacks; applies to the self-provisioning bench workloads
  # (tpcc, pgbench, sysbench).
  baseline:
    live: true
    image_version: ""
    # allow_same_image keeps the arm up when the baseline resolves to the image
    # under test. That is an A/A run: the arms differ in nothing, so every delta
    # it reports is this harness measuring its own noise. Run 9cadd192 reported
    # lifecycle.delete_fork_branch +118.2% that way.
    allow_same_image: false
    # aa runs the arm on the image under test on purpose, never fails on the
    # live verdict, and stores its deltas under the A/A load signature. Those
    # deltas are the arm-to-arm noise model every A/B run reads its bands from.
    aa: false
  # live_arm turns the two arms' per-datapoint deltas into one verdict. Where
  # perf.gate.min_runs A/A runs exist (perf.baseline.aa) a datapoint's allowance
  # is its A/A band, |median| + mad_k x MAD of the A/A deltas. Otherwise it is
  # the flat throughput_drop_pct / latency_rise_pct below, which
  # use_history_band may widen to the portal's cross-run dispersion. A benchmark
  # pairs provision i of each arm, independent stacks, and a violation also needs
  # a sign test: enough pairs worse for one-sided p <= 0.125, which for three
  # pairs is all three. lifecycle and microbench arms are one stack each, so
  # they have no pairs, and a datapoint with no A/A or history band is reported
  # no_band rather than judged on the flat threshold.
  live_arm:
    use_history_band: true
    # An allowance past this is reported "noisy" and not failed on.
    max_band_pct: 50.0
    # A datapoint this many times past its allowance fails on its own.
    gross_factor: 2.0
    # Otherwise it takes this many datapoints past their allowance in one run.
    # A lone moderate outlier across ten datapoints and six nightly perf tests is
    # the shape noise takes here.
    min_violations: 2
  # baseline_path is the JSON baseline store (per version → test → datapoint). A
  # relative path resolves against the process working directory. A first run (no
  # baseline) establishes it and WARNs; a later run gates against it. Baselines
  # are ENVIRONMENT-SPECIFIC (hardware, cluster size, node contention) and are NOT
  # committed — each operator establishes their own on their target cluster
  # (baselines/ is gitignored). Ship default: no baseline → the tier runs in WARN
  # mode, emitting datapoints without a hard gate until a baseline is established.
  baseline_path: "baselines/perf.json"
  # update_baseline forces a refresh of the baseline from this run's datapoints
  # instead of asserting against it (the write-back knob; the CLI equivalent is
  # -o perf.update_baseline=bool:true).
  update_baseline: false
  # Regression tolerance, per direction: throughput may DROP up to
  # throughput_drop_pct, latency may RISE up to latency_rise_pct, before the
  # datapoint is flagged regressed and the test fails. Sized to absorb the
  # residual run-to-run variance of a small co-located TPC-C (tail latency is the
  # noisiest); tighten these once you drive a larger, steadier load. For the
  # two-arm suites these are the FLOOR: perf.live_arm.use_history_band may raise
  # a datapoint's allowance, and perf.live_arm.min_violations decides how many
  # datapoints past their allowance it takes to fail.
  throughput_drop_pct: 20.0
  latency_rise_pct: 35.0
  # Timeouts.
  ready_timeout: "5m"
  health_timeout: "5m"
  # pin_zone keeps every pod of a benchmark stack (tservers, masters, client,
  # endpoint) in one zone of the arm pool, discovered from its nodes at run
  # time. Provision i of both arms shares a zone, so a pair's delta carries no
  # cross-zone round trips. Off, the stacks straddle zones as the scheduler
  # places them.
  pin_zone: true
  # isolation is the resource shape of a benchmark stack (tpcc, pgbench,
  # sysbench, pgbench_uncached, latency_topology, and the lifecycle/microbench
  # arms): tservers, masters and the client pod pinned to arm_node_selector with
  # limits equal to requests. Unisolated, a 0.5-CPU tserver burst into whatever
  # its neighbours left: iterations on one stack agreed to 1% while stacks
  # spread 20%. Off marks the load signature "-shared", a separate series.
  isolation:
    enabled: true
    tserver_cpu: "2"
    tserver_memory: "4Gi"
    master_cpu: "1"
    master_memory: "2Gi"
    client_cpu: "2"
    client_memory: "4Gi"
  # bench is the multi-iteration benchmark HARNESS shared by every perf workload
  # (perf/tpcc, perf/pgbench). A workload is prepared ONCE (schema + initial
  # load), then driven for a discarded warmup + N measured iterations; the kept
  # iterations are aggregated with robust statistics and the MEDIAN — never the
  # mean — is the gated headline; only the medians are reported (the raw
  # per-iteration numbers are attached, so spread stats belong report-side).
  # The measured-iteration run length is measurement_duration (it supersedes
  # any per-workload duration knob).
  bench:
    # iterations is the number of MEASURED runs (excludes the warmup below).
    iterations: 5
    # warmup is one discarded run before the measured iterations (0 → skip). It
    # absorbs cold-cache / JIT / compaction warmup so the measured runs are steady.
    warmup: "30s"
    # measurement_duration is the length of each measured iteration.
    measurement_duration: "60s"
    # cooldown is an optional pause between measured iterations (0 → none).
    cooldown: "0s"
    # discard_first drops the first MEASURED iteration from the aggregate (still
    # recorded) — a second line of defence against a not-fully-warm first run.
    discard_first: false
    # fixed_rate_fraction runs one more measured window at this fraction of the
    # saturated median tps, the lowest any concurrent arm proposed. Latency is
    # gated there: at saturation it is queueing delay. 0 skips it.
    fixed_rate_fraction: 0.6
    # fixed_rate_iterations is how many fixed-rate windows run per stack; the
    # gated latency is their median. One window per stack read 74, 11 and 709 ms
    # p95 on the three stacks of one arm (run 48df0220).
    fixed_rate_iterations: 5
    # sample_interval requests periodic in-run progress (for the time series);
    # a workload whose tool cannot report progress leaves the series empty.
    sample_interval: "1s"
    # min_iterations is the aggregation floor: fewer kept iterations than this
    # (iterations minus the discarded first) fails fast before any provisioning.
    min_iterations: 1
    # Phase control (config-only, no code change), mutually exclusive:
    #   skip_load  — run ONLY the measured phase against an ALREADY-loaded cluster
    #                (pair with --env-mode attach to execute on a standing, loaded
    #                env). Skips the workload's load/schema step.
    #   load_only  — run ONLY the load phase and stop (no measurement) — e.g.
    #                stand up + load an env once (with --env-mode keep), then later
    #                re-run execute-only against it via skip_load.
    skip_load: false
    load_only: false
    # SHAPE gates. The baseline gate compares an absolute median against a stored
    # reference, so in a fresh CI workspace (baselines/ is gitignored, so there is
    # no stored baseline) a perf run asserts NOTHING. These two gates instead
    # threshold RATIOS computed INSIDE one run, from samples the harness already
    # collects, so they assert on the very first run at no extra runtime. Both are
    # expressed as a regression percent in the metric's own worse direction (a drop
    # for throughput, a rise for latency): positive is worse, negative is
    # improving, and 0 is flat. Assertion-only, no datapoints: a violation names
    # its numbers in the failure. Set a limit to 0 to drop the assertion.
    #
    # Both defaults deliberately sit ABOVE the run-to-run spread a small
    # co-located load already shows (see perf.warehouses: ~14% throughput and up
    # to ~48% tail-latency spread at a 2-warehouse TPC-C) — they exist to catch
    # MULTIPLES (a phase getting 5x slower), and a limit inside the noise band
    # would fire on healthy runs. Tighten them once you drive a steadier load.

    # max_iter_drift_pct gates the FIRST measured iteration against the LAST:
    # state that accumulates across iterations (a statement that is permanently
    # slower after the first pass) is invisible to the median headline. It
    # compares two SINGLE iterations, with no median smoothing, so it is the
    # noisier of the two and gets the looser limit.
    max_iter_drift_pct: 50.0
    # max_decay_pct gates the median of the FIRST THIRD of a measured run's
    # progress readings against the median of the LAST THIRD (per iteration, then
    # the median across iterations): throughput that degrades while the run
    # proceeds is averaged away by a whole-run median. Each third is ~20 readings
    # at the 1s sample_interval, materially steadier than a single-iteration
    # comparison, so this limit is tighter. Needs a driver that reports periodic
    # progress (pgbench -P, sysbench --report-interval); BenchBase does not, so
    # perf/tpcc emits no decay datapoint.
    max_decay_pct: 35.0
  # pgbench sub-tier (perf/pgbench): the same self-provisioned backing + client
  # pod as perf/tpcc, but the workload is pgbench (YugabyteDB ships its fork
  # `ysql_bench` in postgres/bin; perf/pgbench delivers it via the `pgbench`
  # artifact and bridges it to the `pgbench` name on the client PATH). It reuses
  # the perf.* knobs above (rf, client_image, remote_dir, baseline_path,
  # thresholds, timeouts); only the pgbench load shape lives here. Cheap defaults.
  pgbench:
    # scale is pgbench -s (the pgbench_accounts row multiplier at init).
    scale: 10
    # clients / jobs are pgbench -c / -j (concurrent sessions / worker threads).
    clients: 8
    jobs: 2
    # duration is the pgbench -T surfaced in the pgbench_client preset's copy-paste
    # dev command. The perf/pgbench TEST times its measured iterations by
    # perf.bench.measurement_duration instead (the harness owns run length).
    duration: "90s"
  # pgbench_uncached is perf/pgbench with shared_buffers and the LFC capped far
  # under the dataset (scale 50 is ~750 MiB), so the steady state reads through
  # the pageserver. It reports pgbench_uncached.lfc_hit_pct as proof the cap bit.
  pgbench_uncached:
    scale: 50
    clients: 8
    jobs: 2
    shared_buffers: "128MB"
    file_cache_size_limit: "128MB"
  # sysbench is the perf/sysbench load shape: sysbench's bundled oltp_* lua
  # workloads over the pgsql driver. sysbench is a distro package — the test
  # apt-installs it into the (Debian/Ubuntu-family) client pod at deploy, no
  # artifact needed. Only the load shape lives here; the backing + gate knobs
  # are the shared perf.* above, and run length is perf.bench.measurement_duration.
  sysbench:
    # script is the bundled lua workload to drive (oltp_read_write, oltp_read_only,
    # oltp_write_only, oltp_point_select, oltp_update_index, ...).
    script: "oltp_read_write"
    # tables / table_size shape the dataset: the number of sbtest tables and the
    # rows per table (sysbench --tables / --table-size, at prepare AND run).
    tables: 4
    table_size: 100000
    # threads is sysbench --threads (concurrent client threads) for each run.
    threads: 8
  # latency_topology is perf/latency_topology: the perf tier's sysbench stack,
  # benchmarked unshaped and then under each topology below, with tc netem
  # delay injected into the tservers' and the endpoint's own network namespaces
  # (apps/netshape). Tserver N is site N; the endpoint sits in the site after
  # the @ (site 0 when absent). Each pair's round trip is split in half and
  # applied as egress delay on both ends, then measured with ping before the
  # benchmark runs. The default round trips are the ones measured between the
  # AWS regions the multi-region amp environment spans.
  latency_topology:
    # workload is the benchmark driven under every topology: sysbench
    # (perf.sysbench.*) or pgbench (perf.pgbench.*).
    workload: "sysbench"
    # helper_image needs nsenter, tc, ping and sh.
    helper_image: "nicolaka/netshoot:v0.13"
    device: "eth0"
    # topologies: "<name>[@<endpoint site>]: <i>-<j>=<round trip ms> ...".
    # Unlisted pairs are co-located. Site RF (3) is one with no tserver in it,
    # for an endpoint remote from its whole universe.
    topologies:
      - "multi_az: 0-1=1 0-2=1 1-2=1"
      - "multi_region: 0-1=12 0-2=47 1-2=60"
      - "amp_cross_az@3: 0-3=1 1-3=1 2-3=1"
      - "amp_cross_region@3: 0-3=12 1-3=12 2-3=12"
    # verify_pings is how many echoes each round-trip check averages.
    verify_pings: 10
    # tolerance is the fraction of the requested round trip (never under 1 ms)
    # a measured one may deviate before the shape counts as not taken.
    tolerance: 0.3
    # iterations is how many measured windows each topology runs. It replaces
    # perf.bench.iterations here: one stack, so they are every sample it gets.
    iterations: 5
  # microbench is the phase-timed workload (perf/microbench): labelled DDL/bulk-DML
  # statements, each one timed Exec, run `rounds` times on a fresh table each;
  # each phase's median across rounds is a `microbench.<phase>` datapoint in ms.
  # Unlike the rest of the tier it needs NO backing of its own and NO client pod —
  # it measures the amp COMPUTE ENDPOINT the env provider serves (sharedk8s /
  # universe), which is the layer the tserver-connected workloads
  # cannot see. Its gate is an intra-run RATIO, so it asserts on the first run
  # with no stored baseline.
  microbench:
    # rows is the row count of every bulk statement (insert / update / delete).
    # The gate is a dimensionless ratio between two phases of the SAME run, so it
    # holds at any row count — this default is sized for what CI can afford, not
    # for the shape being reproduced. 200k keeps the six bulk statements in the
    # low minutes on a single-container env, well inside the 60m perf timeout,
    # while staying large enough that per-statement fixed costs do not dominate.
    # Set 1000000 to reproduce the originally reported 1M-row shape.
    rows: 200000
    # truncate_cycles is how many TRUNCATE + re-INSERT cycles follow the cold
    # insert. Three is the minimum that shows a degradation is PERSISTENT rather
    # than a one-off, and gives the gate a median instead of a single value.
    truncate_cycles: 3
    # max_phase_ratio is the gate: median(insert_after_truncate) / insert_cold.
    # A re-insert into a truncated table costing twice the cold insert is already
    # a finding, and the shape this was written for is ~5x. It compares two phases
    # of the same run, so it needs no baseline — but it DOES need calibration
    # against real hardware: treat the first runs as establishing what the healthy
    # ratio is on your target. 0 disables the assertion, keeping the datapoint.
    max_phase_ratio: 2.0
    # rounds is how many times the whole phase list runs, each round on a table
    # of its own, so every DELETE removes its own freshly inserted rows. One
    # DELETE of 200k rows read 303 to 989 ms on the same release.
    rounds: 5
  # lifecycle is perf/lifecycle: the data lifecycle a customer runs on a
  # loaded tenant, each step timed as a lifecycle.<phase> datapoint — fork off a
  # near-empty branch and off `rows` rows, endpoint up on the fork, cold/warm
  # count, write into the fork, pause/resume, delete half the parent, drop the
  # table, delete the fork and the cluster. Runs on the standing control plane
  # (sharedk8s), no backing or client pod of its own.
  lifecycle:
    # iterations runs the WHOLE lifecycle that many times CONCURRENTLY, each on
    # its own fresh tenant; the median of each tracked phase is what gets gated
    # (per-iteration timings live in phases.txt). One shot is not a signal here:
    # create_endpoint has shown a 0.49 coefficient of variation in one run, and
    # three iterations left each phase's median resting on two draws.
    iterations: 5
    # rows is the parent's dataset; ~100 bytes a row with the default payload.
    rows: 3000000
    # batch_rows is the size of one INSERT ... SELECT during the load.
    batch_rows: 200000
    # fork_write_rows is what gets written into the fork after it is up.
    fork_write_rows: 200000
    payload_bytes: 64
    # max_fork_ratio gates fork_loaded / fork_small: a copy-on-write fork should
    # not scale with the parent. 0 keeps the datapoint and drops the assertion.
    max_fork_ratio: 5.0
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"
    # pause_resume times fork_pause/fork_resume/fork_resume_first_count. Off
    # until the controller grows the pause/resume routes (meko#518): the POST
    # 404s today, which is also why features/amp_endpoint_pause_resume is skipped.
    pause_resume: false
  # ops_latency is perf/ops_latency: every control-plane operation timed on
  # fresh objects, at two layers — the API call that hands back a task, and the
  # wait to a usable result. Runs on a stack of its own.
  ops_latency:
    # repeats is how many times each operation runs, each on its own cluster.
    # A single shot is not a signal: endpoint create has shown a 0.49
    # coefficient of variation within one run, so the gated value is the median
    # of the repeats and the CV rides along as its own datapoint. Endpoint
    # create is the exception: it splits cold from warm by node, so each of
    # those two keys carries only the repeats that landed in its bucket, and on
    # a one-node stack cold has a single sample.
    repeats: 10
    # poll_interval is the fixed cadence tasks are polled at, so an operation's
    # end-to-end time is resolved to it. The client's default backoff (250ms
    # doubling to 2s) read a 1.6s operation as up to 3.75s.
    poll_interval: "100ms"
    # seed_rows is the parent dataset a fork is timed against, sized so
    # copy-on-write behaviour is visible rather than assumed. batch_rows is one
    # INSERT ... SELECT of that load; payload_bytes is the per-row filler.
    seed_rows: 1000000
    batch_rows: 200000
    payload_bytes: 64
    # endpoint_cpu/memory is what every timed endpoint is created with;
    # resize_cpu/memory is what the timed resize moves it to. Both shapes are
    # explicit because an unsized endpoint takes the product's generous default
    # reservation, which a shared test cluster cannot fit several of.
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"
    resize_cpu: "1"
    resize_memory: "2Gi"
  # chain_depth is perf/chain_depth_read: cold single-page read latency as a
  # function of how many deltas have accumulated on a page since its last
  # anchor image.
  chain_depth:
    # pages is how many one-row pages each rung's table holds; payload_bytes is
    # the PLAIN-stored filler that makes a row fill its own page. samples is how
    # many distinct pages are read per rung after the compute restart. Below 100
    # samples a p99 is just the maximum, so the test refuses that with max_ratio
    # set rather than gate the ratio on two single reads.
    pages: 1000
    payload_bytes: 700
    samples: 300
    # depths is the ladder of update rounds applied per rung — one delta per
    # page per round. It straddles the pageserver's image_chain_limit (20), so
    # the rungs below, at and above it are all measured.
    depths: [1, 5, 10, 20, 40]
    # max_ratio gates p99 at ratio_depth over p99 at the shallowest rung. The
    # materialiser folds a chain once it crosses image_chain_limit, so a read at
    # the limit must not cost proportionally more than a read at depth 1.
    # p50 is steady across the whole ladder (2.5 to 2.8 ms in runs 5a527679 and
    # 97521a40), but the p99 tail is what the contract is about and it swings:
    # those two runs reported 1.17x and 2.43x. 4.0 is the headroom that leaves.
    # Raise it if the tail turns out wider on other hardware. 0 keeps the
    # datapoints and drops the assertion.
    max_ratio: 4.0
    ratio_depth: 20
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"
    # ready_timeout bounds the compute workload becoming ready again after the
    # pod is rolled for the cold read.
    ready_timeout: 10m
  # branch_depth is perf/branch_depth: read, insert, update and delete latency
  # at each depth of a fork chain root -> child -> grandchild, every level on a
  # fresh endpoint.
  # A page miss on a branch is looked up in the branch and then in each
  # ancestor, so the cost is on the cold read path and grows with depth.
  branch_depth:
    # max_depth is how many forks deep the chain goes; level 0 is the root.
    # Every level is measured, so this is also the run's length: each rung is a
    # fork, an endpoint, a read set, a full scan and an update, and the scan and
    # the update both grow with depth.
    max_depth: 20
    # rows is the root's dataset, ~100 bytes a row with the default payload;
    # batch_rows is one INSERT ... SELECT of that load.
    rows: 2000000
    batch_rows: 200000
    payload_bytes: 64
    # samples is how many random point reads are timed cold, then warm, per
    # level, inside the server (the tunnel would hide a page miss).
    samples: 300
    # touch_rows sizes each level's own band: it INSERTS that many rows above
    # the loaded ones, UPDATEs that many and DELETEs that many, so a deeper
    # branch has pages whose newest version lives at every ancestor and all
    # four operations are timed at every depth. Insert and delete are the same
    # size, so count(*) is unchanged and the cold scan asserts the same number
    # at every depth. The id space holds an update band and a delete band per
    # level plus a pristine region the reads sample, so
    # 2 * (max_depth + 1) * touch_rows must leave rows over.
    touch_rows: 25000
    # repeats cuts each band into that many disjoint slices, one timed statement
    # each, and the cold scan into that many disjoint ctid block ranges; each
    # datapoint is the median, so no write or scan rests on one statement.
    repeats: 5
    # gate_depths are the rungs whose numbers become GATED datapoints; every
    # other depth still reports its numbers as informational. Gating all 21
    # rungs would put 105 series on the portal, most of them saying what their
    # neighbour says. Rungs past max_depth are dropped, not rejected, so
    # lowering max_depth needs no edit here.
    gate_depths: [0, 1, 5, 10, 20]
    # max_ratio gates cold p50 at ratio_depth over cold p50 at the root. A fork
    # one level down pays one extra lookup on a miss, not a multiple of the
    # read. p50, not p99: two fresh pods differ in their tails by more than a
    # page miss costs. Depth 1 measured 1.38x (run 68906b60) and 1.26x (run
    # 58e317e4), so 2.0 is roughly a 45% margin over the wider of the two; the
    # per-ancestor cost is ~2.7 ms against a ~5 ms root read, so a legitimate
    # depth-1 read cannot approach it. The deep rungs are deliberately NOT
    # asserted — walking 20 ancestors costs 11.8x today, and what that SHOULD
    # cost is the product's call, so the ladder reports it and history tracks
    # it. 0 keeps the datapoints and drops the assertion.
    max_ratio: 2.0
    ratio_depth: 1
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"
    # ready_timeout bounds the root's compute becoming ready again after its
    # pod is rolled for the cold read.
    ready_timeout: 10m
  # idle_footprint is perf/idle_footprint: what one endpoint costs while nobody
  # is connected to it, split per process inside the endpoint container.
  idle_footprint:
    # hold is how long the endpoint is left alone. Long enough that startup
    # transients are a small share of the window, short enough to fit a run.
    hold: 10m
    # interval paces the /proc sweeps inside the hold.
    interval: 30s
    # settle is waited before the first sweep: a just-created endpoint is still
    # finishing its own startup, which is not idle cost.
    settle: 1m
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"
  # client_window is perf/client_window: what a client sees while each amp
  # operation runs. One tenant, a pgx pool, a pinned pgx session carrying a
  # prepared statement and an idle transaction, and the Java sample app in a
  # client pod, all driving the endpoint while the operation happens. The
  # window of an operation the controller runs as a task (resize, the upgrade
  # rolls, pause/resume) is timed from that task's own created_at; the rest
  # (compute_restart, settings_update, backing_roll) from when the harness
  # issued the call.
  client_window:
    # operations is the set to measure, in this order. upgrade_roll also rolls
    # BACK, measured as its own upgrade_roll_back window. pause_resume skips
    # itself until perf.lifecycle.pause_resume turns it on (meko#518).
    operations: ["compute_restart", "resize", "settings_update", "upgrade_roll", "pause_resume", "backing_roll"]
    # rate_tps is how often each pgx client issues a statement. Low on purpose:
    # the question is when the endpoint answers, not how much it can take, and
    # the endpoint tunnel already adds ~29ms to every statement.
    rate_tps: 10
    # grace is what separates "the endpoint came back" from "it flickered": the
    # window closes at the first success the pooled client got that was followed
    # by this much unbroken service, and an error after that fails the test. 0
    # closes the window at the very first success, which is the red proof.
    grace: "5s"
    # sample_interval is how often the Java client prints a progress window.
    sample_interval: "1s"
    # statement_timeout bounds one probe. A statement that has not answered in
    # this long is recorded as a timeout, not as a hang of the whole test.
    statement_timeout: "15s"
    # hold is the quiet time watched either side of an operation, which is what
    # makes "no error outside the window" a claim about an observed interval.
    hold: "30s"
    # recover_timeout bounds the wait for a replaced compute pod. Sized from the
    # cold endpoint create budget (10 to 19 minutes).
    recover_timeout: "20m"
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"
    # The shape the resize operation moves to. Down, not up: a bigger shape can
    # wait for a node and measure the autoscaler instead of the operation.
    resize_cpu: "1"
    resize_memory: "2Gi"
    # java_client runs the JDBC client. It needs the private sample-app jar, so
    # a deployment without that secret falls back to the two pgx clients alone.
    java_client: true
    # backing_roll_sleep is YBA's pause after each node comes back before it
    # takes the next one.
    backing_roll_sleep: "30s"
    # backing_settle keeps the backing roll's window open past the moment YBA
    # calls the restart done: YugabyteDB goes on electing tablet leaders for
    # minutes after the last tserver is back, and a statement that stalls in
    # that tail is the roll's cost, not an error outside the window. Only the
    # backing roll uses it.
    backing_settle: "2m"
    # repeats is how many rounds of every operation run, round-robin; each
    # datapoint is the median across them. Resize and the settings update
    # alternate their target by round so every repeat changes something.
    repeats: 5
  # scale is the shape every ladder shares: ONE tenant (one cluster, one
  # branch, one endpoint) that keeps getting more concurrent drivers —
  # perf/scale_tpcc, scale_ycsb, scale_pgbench escalate copies of one workload,
  # scale_apps alternates the two sample-app drivers. Each driver gets its own
  # DATABASE on that shared endpoint (benchbase always names its tables the
  # same, so copies would otherwise load over each other). Hitting the ceiling
  # is a passing outcome; the datapoints record where it is.
  scale:
    # max_drivers is how far the ladder climbs: stage N runs N drivers at once.
    # High on purpose — this is a stress ladder, so the run ends when the
    # endpoint breaks, not when the config runs out. budget is the wall-clock
    # backstop for an endpoint that never breaks.
    max_drivers: 64
    budget: "3h"
    stage_duration: "6m"
    # Hard stops. Diminishing returns (a falling aggregate, a starved driver)
    # are RECORDED and climbed past; only these end the ladder.
    #   min_tps      — at or below this the endpoint is serving nothing.
    #   collapse_pct — share of the PEAK aggregate under which throughput counts
    #                  as collapsed rather than merely degraded.
    min_tps: 1.0
    collapse_pct: 25
    # floor_pct stops the ladder when the slowest driver falls below this share
    # of what a single driver achieved alone.
    floor_pct: 25.0
    # read_timeout bounds the post-stage storage probe (a write, then a read of
    # it): a wedged WAL path never answers, so the deadline IS the detector.
    read_timeout: "2m"
    # The endpoint is the thing under test, so it is sized to be worth loading.
    endpoint_cpu: "4"
    endpoint_memory: "8Gi"
  # scale_depth is the perf/scale_depth_tpcc shape: ONE endpoint whose dataset
  # and concurrency grow stage by stage. This is the axis that finds
  # storage-layer walls — meko#739 wedged a WAL fetch at TPC-C SF 150 / 75
  # terminals against a single endpoint, a scale no breadth test reaches.
  # perf/scale_tables grows the CATALOG on one endpoint: how many relations can
  # a single compute carry? Different pressure from the other two ladders —
  # pg_class/pg_attribute rows, a relfilenode per table for the storage layer to
  # track, and relcache in every backend. Each table stays tiny on purpose.
  scale_tables:
    # batch_size is how many tables one stage adds.
    batch_size: 500
    # max_tables is a backstop; the ladder is meant to end on the product.
    # 250k, not 100k: measured endpoint memory grows ~63Mi per 1000 tables in
    # this access pattern (2072Mi at 21k, 2906Mi at 34k), so an 8Gi endpoint is
    # projected to run out somewhere past 110k — a 100k backstop would have
    # stopped the ladder just short of the wall it exists to find.
    max_tables: 250000
    rows_per_table: 3
    budget: "4h"
    # batch_timeout bounds one batch, catalog_timeout the count(*) after it. A
    # catalog that stops answering is a wall even while creates still succeed,
    # and it is what a customer notices first.
    batch_timeout: "30m"
    catalog_timeout: "2m"
    endpoint_cpu: "4"
    endpoint_memory: "8Gi"

  # perf/scale_connections holds connections open INSIDE the endpoint pod until
  # a batch stops landing or a fresh probe connection fails. The wall is
  # max_connections or memory-per-backend, whichever arrives first.
  scale_connections:
    batch_size: 50
    max_connections: 5000
    budget: "1h"
    probe_timeout: "30s"
    hold_seconds: 7200
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"

  # perf/scale_tenants grows the POPULATION on one control plane and one
  # backing: clusters + branches + endpoints, a few at a time, writing to a
  # sample of the existing ones after every batch. The wall is the control
  # plane, the k8s pool's ability to schedule another endpoint pod, or the
  # shared YugabyteDB — which one it is, is the finding.
  # Sized for the ratio QA deploys, not the product's memory-per-vCPU floor — as
  # every endpoint in this file is. This suite is why that ratio is configurable
  # at all: its whole point is population, up to max_tenants endpoints at once,
  # and 8 GiB per vCPU across that many is hundreds of GiB of reservation no test
  # pool holds. 2 cores / 4Gi is 2 GiB per vCPU, which is what
  # env.ampstack.endpoint_memory_gib_per_vcpu deploys the QA control plane at. A
  # deployment left at the product's 8 refuses these creates.
  scale_tenants:
    batch_size: 3
    max_tenants: 200
    seed_rows: 50
    budget: "3h"
    # verify_sample: oldest, middle and newest. Checking every tenant every
    # batch is quadratic and would spend the budget verifying instead of
    # growing.
    verify_sample: 3
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"

  # The four ladders below publish a LIMIT rather than a comparison: each climbs
  # until a stop condition, emits the last rung that held as a datapoint, and
  # then holds the product's failure at that ceiling to a clean one (no compute
  # restart, no daemon respawn, the endpoint still serving). A ladder that runs
  # out of stages without reaching a ceiling FAILS: its last rung is the config,
  # not the product. They all share perf.scale.stage_duration where they measure
  # over a window, and every one of them costs hours.
  #
  # start / factor / max_stages are the rung geometry: stage i is
  # start * factor^i, capped at max_stages stages.

  # perf/scale_wal_ingest doubles the number of writers committing small batches
  # inside the endpoint pod, and measures the WAL the endpoint actually wrote.
  # The writers run in-pod because the coordinator's tunnel adds ~29ms per round
  # trip, which would be most of a healthy commit.
  scale_wal_ingest:
    start: 2
    factor: 2.0
    # 8 stages, up to 256 writers: on amp-dev eight writers still committed at a
    # p99 well under 200ms, so a shorter ladder finds no ceiling at all.
    max_stages: 8
    # stop_max_p99 is the commit latency past which the endpoint is no longer
    # sustaining the load, and stop_throughput_drop_pct the fall in WAL
    # throughput stage over stage that says the same thing without a latency
    # spike.
    stop_max_p99: "2s"
    stop_throughput_drop_pct: 5.0
    # batch_rows x payload_bytes is one commit's payload. Kept small: the stage
    # writes for stage_duration at every writer count, and the backing has to
    # hold it (the table is truncated between stages).
    batch_rows: 100
    payload_bytes: 64
    # statement_timeout is what makes a writer at the wall report a timeout
    # rather than hang: the clean-failure check demands an answer. It must stay
    # ABOVE perf.scale.stage_duration: a writer's whole stage is one CALL, and
    # the procedure's internal COMMITs do not re-arm the timeout, so a value
    # below the stage cancels every healthy writer with 57014.
    statement_timeout: "10m"
    endpoint_cpu: "4"
    endpoint_memory: "8Gi"

  # perf/scale_endpoints creates endpoints on ONE cluster until a create refuses
  # or runs past the bound. factor 1.0 keeps the batch flat at five: the cost
  # here is per endpoint, not per stage.
  scale_endpoints:
    start: 5
    factor: 1.0
    max_stages: 10
    # stop_max_create_time is read off the elapsed time, not imposed as a
    # deadline: a create cancelled on the test's own clock reports "context
    # deadline exceeded" and hides what the control plane would have said.
    # A create that cannot schedule fails on its own after 35 minutes.
    stop_max_create_time: "20m"
    budget: "6h"
    probe_timeout: "60s"
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"

  # perf/scale_branches forks one seeded branch, more forks every stage, and
  # reads the parent after each one.
  scale_branches:
    start: 5
    factor: 2.0
    # 9 stages, 2555 branches: a fork stayed flat at ~2s all the way to 35
    # branches on amp-dev, so a shorter ladder finds no ceiling at all.
    max_stages: 9
    # The stage's MEAN fork time, not its worst: one tail outlier is not a limit.
    stop_max_fork_time: "2m"
    # max_parent_read_ratio is the clean-failure bound: forks may cost the
    # parent's reads up to this multiple of the first stage, no more.
    max_parent_read_ratio: 2.0
    # seed_rows is sized so the parent read is hundreds of ms: the tunnel adds
    # ~29ms to every round trip and a sub-10ms measurement would be mostly that.
    seed_rows: 2000000
    budget: "3h"
    read_timeout: "5m"
    endpoint_cpu: "4"
    endpoint_memory: "8Gi"

  # perf/scale_transaction doubles the rows in ONE transaction until the commit
  # fails, on a pinned backend so a severed connection is visible.
  scale_transaction:
    start: 100000
    factor: 2.0
    max_stages: 12
    # stop_statement_timeout is both the stage bound and the stop condition: a
    # transaction that outruns it comes back as SQLSTATE 57014, which is a
    # clean refusal.
    stop_statement_timeout: "30m"
    # recover_timeout is how long the endpoint gets to take the next, smaller
    # transaction after the ceiling.
    recover_timeout: "60s"
    budget: "3h"
    payload_bytes: 64
    endpoint_cpu: "4"
    endpoint_memory: "8Gi"

  scale_depth:
    # warehouses and terminals pair index for index: stage i loads
    # warehouses[i] and drives it with terminals[i] clients.
    # The rungs to walk explicitly; past the last one the ladder keeps
    # multiplying by growth until something fails, so there is no fixed top.
    warehouses: ["25", "50", "100", "200", "400", "800"]
    terminals: ["16", "32", "50", "75", "100", "150"]
    growth: 2.0
    # budget caps the whole ladder in wall-clock. Loading runs ~60s per
    # warehouse (measured: 25 warehouses in 28m), so the rungs above are hours
    # of loading before any driving happens, and the registered timeout is 12h.
    budget: "10h"
    # min_tps is the no-throughput floor: a stage this slow has found the wall
    # even without an error.
    min_tps: 1.0
    # stage_duration is one stage's drive window (the reload before it is not
    # timed and grows with the scale factor).
    stage_duration: "15m"
    # read_timeout bounds the post-stage read that must be served above what
    # the stage just wrote. A wedged replay never answers, so this deadline IS
    # the detector — keep it well above a healthy read and well below a hang.
    read_timeout: "2m"
    # load_timeout bounds a stage's dataset load: unbounded, a load that makes
    # no progress eats the run instead of reporting a ceiling (the first depth
    # run sat at 0.06 cores for 1h47m before its connection broke).
    load_timeout: "45m"
    # ... and grows with the dataset, because a flat budget kills a big stage
    # that is loading perfectly well.
    load_timeout_per_warehouse: "90s"
    # A dataset this size needs compute; the ladder is pointless if the client
    # is throttled before storage is.
    endpoint_cpu: "4"
    endpoint_memory: "8Gi"
  # multitenant is the perf/multitenant load shape: N tenants on ONE control
  # plane, each its own cluster + endpoint driven by its own real benchmark
  # client, measured alone and then all together. Everything here is overridable
  # per run (-o perf.multitenant.<key>=...), because the useful shape depends on
  # what the cluster can actually schedule that day — see endpoint_cpu.
  # Same shape and the same reason as scale_tenants: five tenants held to the
  # product's 8 GiB per vCPU would be 80Gi of reservation. At 2 cores / 4Gi it is
  # 20Gi.
  multitenant:
    # tenants is the population: one per workload in the mix, each tenant a
    # different KIND. Population size belongs to the scale schedules, which raise
    # it per run — changing it here moves every interference ratio and voids
    # max_interference along with every version comparison gated on it.
    tenants: 5
    # workloads is the mix each tenant is assigned round-robin: tpcc and ycsb
    # (benchbase), bank_transfer and sql_transactions (yb-stress-sample-apps),
    # pgbench. A single-entry list turns this into a same-workload contention
    # test.
    workloads: ["tpcc", "ycsb", "bank_transfer", "sql_transactions", "pgbench"]
    # endpoint_cpu / endpoint_memory size EVERY tenant's compute. Requests ==
    # limits, so these are hard cgroup ceilings (Guaranteed QoS), not
    # preferences. Raising them is not free: an endpoint also requests 40Gi of
    # ephemeral storage against ~43.8Gi allocatable (one endpoint per node
    # whatever the CPU), and the autoprovisioned e2-standard-4 has 3920m
    # allocatable — a request of "4" fits NO default node and waits for a bigger
    # one per tenant. 15 tenants at 4 cores got 0/26 nodes and burned the full
    # 35-minute helm budget. Scale tenants down when scaling these up.
    endpoint_cpu: "2"
    endpoint_memory: "4Gi"
    # measurement_duration is one measured window, and iterations is how many of
    # them (the reported figure is the median, with a coefficient of variation).
    # Every phase pays this twice — once solo per workload, once mixed.
    measurement_duration: "3m"
    iterations: 5
    # terminals is the per-tenant client concurrency for the benchbase drivers,
    # sampleapp_threads the reader AND writer count for the sample-app ones. A
    # tenant that is not driven hard enough shows no interference no matter how
    # many tenants there are.
    terminals: 16
    sampleapp_threads: 8
    # sampleapp_ready_timeout bounds how long to wait for a sample-app client to
    # report load actually flowing before calling the phase broken.
    sampleapp_ready_timeout: "10m"
    # benchbase_fork drives benchbase tenants from a forked branch rather than
    # the parent, so the mix exercises copy-on-write storage too.
    benchbase_fork: true
    # seed_rows is the dataset a tenant is seeded with before measurement;
    # fork_seed_rows is the separate, larger parent used to time a fork against a
    # non-trivial ancestor (a branch with no writes has no fork point at all).
    seed_rows: 2000
    fork_seed_rows: 20000
    # fork_repeats is how many forks are timed off each of the two parents; the
    # reported fork time is their median.
    fork_repeats: 5
    # max_interference is the GATE: the worst allowed mixed-vs-solo throughput
    # ratio across workloads. 4x tolerates real contention while still failing a
    # collapse.
    max_interference: 4.0
  # history is the HISTORICAL perf tracking store: distinct from the baseline
  # (which holds ONE reference value per test/metric to gate against), the
  # history APPENDS every run's aggregate so the report can render a TREND of
  # median TPS (and latency) across past runs/versions — drawn with the same
  # chart primitive as the per-run graphs. Like the baseline it is
  # ENVIRONMENT-SPECIFIC and NOT committed (baselines/ is gitignored).
  history:
    # enabled turns the append + trend chart on (best-effort: a store IO failure
    # is logged, never fails an otherwise-passing perf run).
    enabled: true
    # path is the JSON history store (a flat, append-ordered list of run records).
    # A relative path resolves against the process working directory.
    path: "baselines/perf-history.json"
    # max_runs bounds the trend to the most-recent N runs (the file keeps every
    # record; only the chart is tailed), so the trend stays readable.
    max_runs: 20
  # compare turns a perf test into an A/B (N-way) VARIANT COMPARISON: instead of
  # gating one run against a (possibly stale) local baseline, it runs the SAME
  # workload at the SAME load (perf.bench.* / perf.warehouses / perf.pgbench.* /
  # perf.sysbench.* held constant) across labelled variants that differ ONLY in the overrides
  # below, then reports each variant's median + noise and the delta vs the FIRST
  # (reference) variant. This is the meaningful comparison: like-with-like, so a
  # delta is a real signal, not a config artifact. Empty variants → the test runs
  # the normal single-run path.
  compare:
    # variants accepts two shapes (never mixed in one list). Supply via a -c YAML
    # file, a -jc JSON file, or a json_text override. Default: none.
    #
    #   {label, overrides} — the full form. overrides are config KEYS applied on
    #     top of the base config for that variant only (e.g. apps.ybk8s.image_tag,
    #     apps.ybk8s.image_registry, env.ampstack.controller_image). The list is
    #     the complete set of arms; at least 2 are required and variant[0] is the
    #     reference.
    #
    #   {image_version, yb_version} — the version shorthand the report portal
    #     sends. yb_version becomes versions.yb (the deployed backing's version);
    #     image_version becomes the amp image refs
    #     (quay.io/yugabyte/amp-{controller,endpoint}:<tag>). Each arm is labelled
    #     by its versions, and the run's OWN configuration is prepended as the
    #     "primary" reference arm — so one shorthand variant already makes a
    #     2-arm comparison. An image_version WITHOUT a yb_version is rejected: the
    #     comparison benchmarks the YugabyteDB backing directly, with no amp
    #     control plane in the loop, so an amp image alone cannot make an arm
    #     differ from the reference.
    variants: []
    # fail_on_regression turns a SIGNIFICANT regression vs the reference variant
    # (delta beyond combined noise, in the metric's worse direction) into a test
    # failure. Default false: a comparison reports deltas, it does not gate.
    fail_on_regression: false
    # mode picks the STRATEGY over the SAME ordered variants list above:
    #   all    — benchmark EVERY variant and report the N-way comparison (default).
    #   bisect — binary-search the ordered variants (oldest→newest / good→bad) for
    #            the FIRST one whose metric regressed beyond bisect.threshold_pct
    #            vs the assumed-good reference (variant[0]), like `git bisect` for
    #            a perf metric. It probes only ~log2(N) variants (+1 reference),
    #            NOT all N — the same per-variant benchmark at the same fixed load.
    #            A bisect PASSES (it is diagnostic), reporting the localized
    #            first-regressed variant; it fails only if a probe can't
    #            provision/benchmark. Needs at least 2 variants.
    mode: "all"
    # bisect parameterizes mode=bisect (ignored by mode=all).
    bisect:
      # metric decides good/bad: one of tps, latency_avg, latency_p95,
      # latency_p99. Direction is the metric's own (tps drop / latency rise).
      metric: "tps"
      # threshold_pct: a candidate is BAD when its metric regressed (dropped for
      # tps, rose for latency) more than this % vs the reference variant[0].
      threshold_pct: 10.0
