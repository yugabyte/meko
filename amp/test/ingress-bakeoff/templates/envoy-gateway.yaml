apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: bakeoff }
spec: { controllerName: gateway.envoyproxy.io/gatewayclass-controller }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bakeoff
  labels: { bakeoff: gateway }
spec:
  gatewayClassName: bakeoff
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: bakeoff-clusterip
  listeners:
${PORTS}
