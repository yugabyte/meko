# yb-amp externalized extensions — build manifest.
#
# Each entry is built into a minimal OCI image (see extension.Dockerfile) that
# the endpoint mounts as a Kubernetes ImageVolume.
#
# Adding one is NOT just a row here — the Quay repository has to exist first (CI
# can push to an existing repo but cannot create one), the `regress:` block is
# required, and its CI step has to be added by hand. See
# compute/architecture/extensions.md, "Adding a new extension". build.sh reads this file,
# builds the ABI-anchor base once, then each extension, and (optionally) pushes
# them. Keep this the single source of truth for versions. Checksums are not
# here: every `url` (and anything a `prep` fetches) is pinned in
# downloads_checksum.txt, and a URL with no pin there fails the build.
#
# Image tags are immutable: build.sh never rebuilds a tag that exists. A row
# whose recipe changes (its patch, prep, Dockerfile, build flags) under the
# same `version` therefore sets `image_revision:`, which makes the tag
# <version>-r<N> from 2 on; the controller catalog carries the same number.
# build.sh labels each image with a hash of its recipe and fails, rather than
# skipping, on an existing registry tag whose label differs — so for any tag
# built with the label, a forgotten bump is a build error, not a stale image in
# the registry. The revision-1 pgvector, pg_cron, hexabridge and age tags were
# published before the label, so a recipe change to one of those is NOT caught:
# bump its image_revision with the change, which also brings it under the guard.
# The recipe is the row, its Dockerfile and its patch; the ABI-anchor base
# (pg18-build.Dockerfile, the vendored PG) is not in it, so a base change that
# can affect the extensions has to bump their revisions by hand.

# Container registry the built images are tagged/pushed under. Extension images
# are <registry>/amp-ext-<name>:<version>; the base is <registry>/amp-pg18-build.
registry: quay.io/yugabyte

# The ABI-anchor base image name (built from pg18-build.Dockerfile). Extensions
# are compiled FROM this so they link against the exact forked PG18 the endpoint
# ships. build.sh builds it as <base_image>:local and pushes as
# <registry>/<base_image>:<pg_tag>.
base_image: amp-pg18-build
pg_tag: v18

# Engines — named bundles of the extensions below, offered as product flavours.
# The controller resolves an engine to its bundle at createCluster and records
# the engine on the cluster; the UI generates its picker from this list
# (amp_ui/scripts/gen-extensions.py). Keep in step with
# controller/internal/extensions/engines.go, which TestEngineTableMatchesManifest
# enforces. Every name under `extensions:` must appear in the catalog below.
engines:
  - name: postgres
    label: PostgreSQL
    description: Plain PostgreSQL 18
    extensions: []
  - name: aidb
    label: AI Database
    description: Vector search, graph, and scheduled jobs
    extensions: [pgvector, age, pg_cron]
  - name: oracle
    label: Oracle
    description: Oracle compatibility layer
    extensions: [hexabridge]
  - name: sqlserver
    label: SQL Server
    description: SQL Server (T-SQL) compatibility layer
    extensions: [hexabridge_mssql]
  - name: documentdb
    label: DocumentDB
    description: MongoDB-compatible document store
    extensions: [documentdb, pgvector, pg_cron]

extensions:
  - name: pgvector
    # Shown on the UI picker's card (generated into amp_ui's catalog).
    description: Vector similarity search
    # 0.8.1 was the first release to build against PostgreSQL 18 (0.8.0 calls the
    # pre-18 vacuum_delay_point() with no args); 0.8.2 is the current release.
    version: "0.8.2"
    url: https://github.com/pgvector/pgvector/archive/refs/tags/v0.8.2.tar.gz
    # Carried from the legacy compute image and refreshed for 0.8.2: adds the
    # YB_AMP_SMGR unlogged-build hooks (no data loss on HNSW/IVFFlat index build)
    # and ships the per-version vector--0.7.4.sql upgrade path.
    patch: pgvector-pg18.patch
    # The extension's lead .control basename (CREATE EXTENSION vector).
    control: vector
    # trusted => a non-superuser can CREATE EXTENSION (legacy image did this).
    trusted: true
    # pgvector needs no shared_preload_libraries entry.
    preload: false
    # Runs in the extracted source dir before the patch: the patch's Makefile
    # references sql/vector--0.7.4.sql, which upstream ships only in the 0.7.4 tag.
    # $SAFE_CURL is scripts/safe_curl.sh, set by whatever runs the prep.
    prep: >-
      sh "$SAFE_CURL" fetch https://github.com/pgvector/pgvector/raw/refs/tags/v0.7.4/sql/vector.sql ./sql/vector--0.7.4.sql
    # Empty => build with the generic extension.Dockerfile. Set to a path
    # (relative to repo root) for a complex extension needing its own recipe.
    dockerfile: ""
    # Run the extension's own upstream pg_regress suite (test/sql + test/expected)
    # against the mounted ImageVolume — see extensions.sh --regress.
    regress:
      driver: pgxs

  - name: pg_cron
    description: Cron-style job scheduler
    # 1.6.6 is the first release with Postgres 18 support (PG18 dropped the
    # run_once arg from PortalRun, which 1.6.4 still passed); 1.6.7 adds fixes for
    # -Werror on newer GCC, which this pipeline compiles with. Pure PGXS, so the
    # generic extension.Dockerfile builds it with no patch/prep.
    version: "1.6.7"
    url: https://github.com/citusdata/pg_cron/archive/refs/tags/v1.6.7.tar.gz
    patch: ""
    # The extension's lead .control basename (CREATE EXTENSION pg_cron).
    control: pg_cron
    # trusted => a non-superuser can CREATE EXTENSION (legacy image did this).
    trusted: true
    # pg_cron runs a background-worker scheduler, so its library must be in
    # shared_preload_libraries — adding it to a live endpoint needs a restart.
    preload: true
    prep: ""
    dockerfile: ""
    # pg_regress suite (sql/pg_cron-test.sql). Its Makefile REGRESS_OPTS start a
    # private --temp-instance; extensions.sh --regress ignores those and drives
    # pg_regress straight at the live compute instead.
    regress:
      driver: pgxs

  - name: hexabridge
    description: Oracle compatibility (DBMS_*/UTL_* packages)
    # HexaCluster's Oracle-compatibility layer (DBMS_*/UTL_* packages). Closed
    # source in a PRIVATE repo, so the source is fetched from the GitHub API
    # tarball endpoint with an auth header — build.sh mounts $AMP_EXT_GH_TOKEN as
    # the gh_token BuildKit secret (see extension.Dockerfile). Pin to a commit
    # (no upstream release yet); the /tarball/<sha> archive is byte-stable for a
    # given commit, so its pinned checksum is reproducible. This commit is the first
    # that ships the upstream regression suite (scripts/regression.sh + test/pg/).
    version: "0.1"
    url: https://api.github.com/repos/HexaCluster/hexabridge-ybamp/tarball/4f1bb16db442d8b3fe66246bc9c1f0ad79ed949a
    patch: ""
    # SQL name == package name: CREATE EXTENSION hexabridge.
    control: hexabridge
    # The .control ships no `trusted`, so CREATE EXTENSION is superuser-only —
    # keep trusted: false rather than forcing it open.
    trusted: false
    # hexabridge's _PG_init registers a dbms_scheduler background worker and sets
    # up dbms_alert/dbms_pipe shared memory, so its library must be in
    # shared_preload_libraries — adding it to a live endpoint needs a restart.
    preload: true
    prep: ""
    # Pure PGXS (make && make install) — the generic extension.Dockerfile builds
    # it; its link deps (libcurl/libxml2/openssl/zlib) live in the ABI base.
    dockerfile: ""
    # Run the extension's own regression suite (its custom bash runner, not
    # pg_regress) against the mounted ImageVolume — see extensions.sh --regress.
    regress:
      driver: script
      script: scripts/regression.sh

  - name: hexabridge_mssql
    description: SQL Server (T-SQL) compatibility functions
    # HexaCluster's SQL Server-compatibility layer, hexabridge's sibling. Same
    # private-repo, commit-pinned fetch (AMP_EXT_GH_TOKEN); no upstream release yet.
    version: "0.1"
    url: https://api.github.com/repos/HexaCluster/hexabridge-mssql-ybamp/tarball/d0b159b31fb5f71d9ebb9f9da6ea1871df8f205c
    patch: ""
    # Installs into schema `sys` (the .control pins it, not relocatable).
    control: hexabridge_mssql
    # The .control ships no `trusted`, so CREATE EXTENSION is superuser-only.
    trusted: false
    # _PG_init only defines a GUC (hexabridge_mssql.passphrase_version): no
    # background worker, no shared memory, so opting in is a mount, not a restart.
    preload: false
    # The PGXS tree is under extension/, and extension.Dockerfile builds at the
    # tarball root. Lifting it up here keeps that Dockerfile — part of every
    # generic extension's recipe hash — unchanged. The tree also installs
    # hexabridge_mssql_spatial, which `requires` postgis: amp ships none built
    # in, so it only creates on a branch that also mounts a registered postgis.
    prep: cp -a extension/. . && rm -rf extension
    dockerfile: ""
    # Upstream's self-contained pg_regress suite (`make installcheck`). Its
    # differential suite (installcheck-diff) needs a live SQL Server and is not run.
    regress:
      driver: pgxs

  - name: age
    description: Apache AGE — openCypher graph
    # Apache AGE (openCypher graph). AGE ships a per-Postgres-major release line;
    # v1.8.0 is the PG18 one (tag PG18/v1.8.0-rc0), so it builds against the
    # forked PG18 ABI base. Pure PGXS => the generic extension.Dockerfile builds
    # it (the patch below only trims a regress test, not the build).
    version: "1.8.0"
    url: https://github.com/apache/age/archive/refs/tags/PG18/v1.8.0-rc0.tar.gz
    # Drops scan's EUC_KR (non-UTF8 server encoding) sub-test: amp compute forces
    # the C.UTF-8 locale, so its CREATE DATABASE ... ENCODING EUC_KR is rejected
    # and would abort scan.sql before it cleans up. Regress-only; no build effect.
    patch: age-regress-euc-kr.patch
    # SQL name == package name: CREATE EXTENSION age (schema ag_catalog).
    control: age
    # The .control ships no `trusted`, so CREATE EXTENSION is superuser-only.
    trusted: false
    # AGE loads per session via `LOAD 'age'`; shared_preload_libraries is
    # optional (1.8.0's #2438 makes it usable that way, but not required), so it
    # is a non-preload extension like pgvector — no restart to enable.
    preload: false
    prep: ""
    dockerfile: ""
    # AGE ships a pg_regress suite under regress/ — run it against the mounted
    # ImageVolume (see extensions.sh --regress).
    regress:
      driver: pgxs

  - name: documentdb
    description: MongoDB-compatible document store
    # The 1.0 GA release. Only a GA tag goes here: the 1.0 RCs install the same
    # extversion, 1.0-0, with no supported upgrade from an RC to GA.
    version: "1.0-0"
    url: https://github.com/documentdb/documentdb/archive/refs/tags/v1.0-0.tar.gz
    # Drops postgis from `requires` AND gates the postgis-dependent geospatial
    # GIST op classes out of the install SQL (the `requires` line alone is not
    # enough — see compute/architecture/extensions.md), and points the build at
    # the libbson/BID the ABI base installs, neither of which ships a .pc file.
    patch: documentdb-no-postgis.patch
    # One source tree, three extensions: documentdb_core, documentdb and
    # documentdb_extended_rum. `CREATE EXTENSION documentdb CASCADE` installs
    # documentdb_core and the requirements below with it; without CASCADE it
    # fails on the first missing one. documentdb_extended_rum is not a
    # requirement: compute_ctl creates it separately, after documentdb.
    control: documentdb
    # documentdb.control names these in its own `requires`, so CREATE EXTENSION
    # documentdb fails with "extension pg_cron is not available" unless they are
    # on the endpoint's paths too. Manifest names, not control names (pgvector's
    # control is `vector`). tsm_system_rows is also required but ships inside the
    # compute's Postgres as a contrib module, so it is not an image to mount.
    requires: [pgvector, pg_cron]
    # documentdb.control ships `superuser = true`, so CREATE EXTENSION is
    # superuser-only — not trusted.
    trusted: false
    # shared_preload_libraries must carry pg_documentdb_core, pg_documentdb and
    # pg_documentdb_extended_rum (upstream also requires pg_cron there, which the
    # engine bundle brings), so opting in on a live endpoint needs a postmaster
    # restart.
    preload: true
    # The libraries to preload, which are NOT the CREATE EXTENSION name: this one
    # image ships pg_documentdb_core.so, pg_documentdb.so and
    # pg_documentdb_extended_rum.so, and preloading "documentdb" is a
    # `could not access file "documentdb"` FATAL at startup. Comma-separated
    # because shared_preload_libraries takes a list. pg_documentdb_extended_rum
    # errors out of _PG_init unless it is preloaded, and compute_ctl creates its
    # extension only when it is.
    library: pg_documentdb_core,pg_documentdb,pg_documentdb_extended_rum
    # Server settings an endpoint mounting it starts with; the controller
    # catalog's Settings mirror these. compute_ctl creates the extension in a
    # `documentdb` database whenever pg_documentdb is preloaded — the gateway
    # serves nothing until it exists — and both name that database: pg_cron
    # refuses CREATE EXTENSION anywhere but cron.database_name, and documentdb's
    # background index builds run in documentdb.bg_worker_database_name.
    # alternate_index_handler_name builds new indexes on the extended_rum access
    # method, as upstream's own setup does; that access method exists only once
    # documentdb_extended_rum is created.
    settings:
      cron.database_name: documentdb
      documentdb.bg_worker_database_name: documentdb
      documentdb.alternate_index_handler_name: extended_rum
    prep: ""
    dockerfile: ""
    # A bare `make` also descends into internal/pg_documentdb_distributed, which
    # wants Citus. install-documentdb builds and installs just the three we ship.
    # DISABLE_STRICT_CFLAGS is upstream's own switch: from 1.0 it builds with
    # -Werror -Wstrict-prototypes, and the forked server's storage/ipc.h declares
    # pg_signal_backend_hook_type with an empty parameter list.
    make_targets: install-documentdb DISABLE_STRICT_CFLAGS=yes
    # Upstream's own pg_regress suite. The patch names the tests in REGRESS and
    # puts the extension loads in REGRESS_OPTS, so the pgxs driver can run it at
    # the live compute. REGRESS is derived from upstream's basic_schedule (104
    # tests) at make time, so a version bump cannot silently narrow it.
    #
    # dir: this is a multi-module tree, so REGRESS is not in the tarball root —
    # and the root Makefile is a delegating one whose `%:` catch-all would
    # swallow the harness's print target and report no tests at all.
    regress:
      driver: pgxs
      dir: pg_documentdb/src/test/regress
      # What upstream's --temp-config sets, which the pgxs driver strips because
      # it runs against a live compute. These go in the endpoint's
      # postgresql.conf, not a per-session PGOPTIONS: documentdb decides whether
      # to emit extended-RUM explain output when the rum library loads, so a
      # per-session GUC is too late and 11 tests diverge on plan detail.
      # The PGC_POSTMASTER ones belong here too — that was the point of using
      # postgresql.conf rather than PGOPTIONS. Upstream points both the pg_cron
      # scheduler and documentdb's background worker at the database the suite
      # runs in; leaving them on the default `postgres` means the worker never
      # sees the jobs the tests queue, and
      # commands_create_indexes_background_{cron,bgworker} sit for 73s and fail
      # with "Waited too long for index build to complete".
      pg_settings:
        # Without this every bson value prints as BSONHEX<hex> and every
        # expected file mismatches.
        - documentdb_core.bsonUseEJson=on
        # The three that keep EXPLAIN output stable.
        - documentdb.disableExtendedRumExplainPlans=true
        - documentdb.enableExplainScanIndexCosts=false
        - documentdb.enable_default_extended_explain=false
        - documentdb.enableLocalRetryTable=false
        - documentdb.indexBuildsScheduledOnBgWorker=off
        - documentdb.enableContinuationFastBitmapLookup=true
        - documentdb.blockedRolePrefixList=documentdb,pg
        # Both must name the database pg_regress runs the tests in, which
        # REGRESS_OPTS pins to contrib_regression.
        - cron.database_name=contrib_regression
        - documentdb.bg_worker_database_name=contrib_regression
        # basic_schedule runs on the built-in rum handler and never creates
        # documentdb_extended_rum, so undo the row's extended_rum setting.
        - documentdb.alternate_index_handler_name=rum

  - name: pgaudit
    description: Session and object audit logging
    # The PG18 release, and the version Aurora 18 ships.
    version: "18.0"
    url: https://github.com/pgaudit/pgaudit/archive/refs/tags/18.0.tar.gz
    patch: ""
    control: pgaudit
    # The .control ships no `trusted`, so CREATE EXTENSION is superuser-only.
    trusted: false
    # _PG_init errors unless it runs from shared_preload_libraries, and CREATE
    # EXTENSION loads the library, so it cannot even be created without preload.
    preload: true
    prep: ""
    dockerfile: ""
    regress:
      driver: pgxs

  - name: pg_hint_plan
    description: Planner hints in SQL comments
    # The latest PG18 release. Aurora 18 ships 1.8.0, which crashes planning an
    # index hint on a table with a hypopg index.
    version: "1.8.1"
    url: https://github.com/ossc-db/pg_hint_plan/archive/refs/tags/REL18_1_8_1.tar.gz
    patch: ""
    control: pg_hint_plan
    trusted: false
    # Hints apply only in a session that has loaded the library, and CREATE
    # EXTENSION does not load it: it only creates the hint table.
    preload: true
    prep: ""
    dockerfile: ""
    regress:
      driver: pgxs
      # The hint-table tests need query IDs, which extensions.sh turns off.
      pg_settings:
        - compute_query_id=auto

  - name: hypopg
    description: Hypothetical indexes
    version: "1.4.3"
    url: https://github.com/HypoPG/hypopg/archive/refs/tags/1.4.3.tar.gz
    patch: ""
    control: hypopg
    trusted: false
    # CREATE EXTENSION loads the library, which installs the planner hooks.
    preload: false
    prep: ""
    dockerfile: ""
    regress:
      driver: pgxs

  - name: hll
    description: HyperLogLog distinct-count sketches
    version: "2.21"
    url: https://github.com/citusdata/postgresql-hll/archive/refs/tags/v2.21.tar.gz
    patch: ""
    control: hll
    trusted: false
    preload: false
    prep: ""
    dockerfile: ""
    regress:
      driver: pgxs
