suite: endpoint-serviceaccount
templates:
  - templates/endpoint-serviceaccount.yaml
  - templates/rbac.yaml
  - templates/agent-rbac.yaml
  - templates/otel-collectors.yaml
tests:
  - it: creates the endpoint ServiceAccount without a token
    template: templates/endpoint-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: amp-endpoint
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep

  - it: carries the Workload Identity annotation it is given
    template: templates/endpoint-serviceaccount.yaml
    set:
      controller.endpoint.serviceAccount.annotations:
        iam.gke.io/gcp-service-account: amp-compute@example.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: amp-compute@example.iam.gserviceaccount.com
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: creates nothing when an existing ServiceAccount is named
    template: templates/endpoint-serviceaccount.yaml
    set:
      controller.endpoint.serviceAccount:
        create: false
        name: tenant-compute
    asserts:
      - hasDocuments:
          count: 0

  # A --reuse-values upgrade of a release predating the key has no
  # serviceAccount map; it must still get the ServiceAccount, not a nil error.
  - it: still creates it for a release whose values predate the key
    template: templates/endpoint-serviceaccount.yaml
    set:
      controller.endpoint.serviceAccount: null
    asserts:
      - equal:
          path: metadata.name
          value: amp-endpoint

  # The point of the ServiceAccount is that it can do nothing: no binding the
  # chart renders may name it. Every binding document is selected, not just the
  # first.
  - it: is bound by no RoleBinding the chart renders
    templates:
      - templates/rbac.yaml
      - templates/agent-rbac.yaml
      - templates/otel-collectors.yaml
    set:
      agent.enabled: true
      rbac.clusterScoped: true
    documentSelector:
      path: kind
      value: RoleBinding
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - notContains:
          path: subjects
          content:
            kind: ServiceAccount
            name: amp-endpoint
          any: true

  - it: is bound by no ClusterRoleBinding the chart renders
    templates:
      - templates/rbac.yaml
      - templates/agent-rbac.yaml
      - templates/otel-collectors.yaml
    set:
      agent.enabled: true
      rbac.clusterScoped: true
    documentSelector:
      path: kind
      value: ClusterRoleBinding
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - notContains:
          path: subjects
          content:
            kind: ServiceAccount
            name: amp-endpoint
          any: true
