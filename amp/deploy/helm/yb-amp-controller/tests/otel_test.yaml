suite: otel collectors
templates:
  - templates/otel-collectors.yaml
# Rendering is gated on the OpenTelemetry Operator's CRDs as well as
# otel.enabled, so each case that expects output declares the CRD itself. There
# is no suite-level `capabilities` on purpose: helm unittest MERGES a per-test
# apiVersions list into the suite's rather than replacing it, so a suite-level
# declaration cannot be cleared and the CRD-absent cases below could never be
# expressed.
tests:
  - it: renders nothing when otel is explicitly disabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the collectors by default
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    asserts:
      - hasDocuments:
          count: 12

  - it: renders nothing when the opentelemetry.io CRDs are absent, though enabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the CRDs are absent and otel is explicitly enabled
    set:
      otel.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders all three collector CRs, kube-state-metrics and RBAC (SA + Role/binding + ClusterRole/binding) when enabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
    asserts:
      - hasDocuments:
          count: 12

  - it: the controller collector is a deployment-mode OpenTelemetryCollector
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isAPIVersion:
          of: opentelemetry.io/v1beta1
      - equal:
          path: spec.mode
          value: deployment

  - it: the compute collector is a deployment-mode OpenTelemetryCollector
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.mode
          value: deployment

  - it: points the exporter at the configured remote-write endpoint
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
      otel.remoteWriteEndpoint: http://vm.example:8428/api/v1/write
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - equal:
          path: spec.config.exporters.prometheus_remote_write.endpoint
          value: http://vm.example:8428/api/v1/write

  # The controller collector is the one the agent watches for its own counters,
  # and it runs whenever the agent does, so the agent's series ride on it.
  - it: scrapes the reconcile-agent on its named metrics port
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      agent.enabled: true
      agent.ycpUrl: https://ycp.example/api/v1
      agent.envName: amp-acme-prod
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[1].job_name
          value: amp-reconcile-agent
      - contains:
          path: spec.config.receivers.prometheus.config.scrape_configs[1].relabel_configs
          content: {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], action: keep, regex: reconcile-agent}

  - it: has no agent job without an agent
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - lengthEqual:
          path: spec.config.receivers.prometheus.config.scrape_configs
          count: 1

  # Fleet identity labels. Both metrics collectors must stamp them, because the
  # controller and the compute sources land in the same store and a series from
  # either has to say which environment and account it came from.
  - it: does not stamp identity labels by default
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    asserts:
      - notExists:
          path: spec.config.processors.transform/identity
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [batch]
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller

  - it: stamps environment and account on every series the controller collector scrapes
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.environmentId: amp-acme-prod
      otel.accountId: 3f2b1c00-0000-0000-0000-000000000009
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      # datapoint context, not resource: Prometheus's OTLP receiver promotes
      # datapoint attributes to labels without promote_resource_attributes.
      - equal:
          path: spec.config.processors.transform/identity.metric_statements[0].context
          value: datapoint
      - equal:
          path: spec.config.processors.transform/identity.metric_statements[0].statements
          value:
            - 'set(attributes["environment_id"], "amp-acme-prod")'
            - 'set(attributes["account_id"], "3f2b1c00-0000-0000-0000-000000000009")'
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: transform/identity

  - it: stamps the same labels on the compute collector
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.environmentId: amp-acme-prod
      otel.accountId: 3f2b1c00-0000-0000-0000-000000000009
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - equal:
          path: spec.config.processors.transform/identity.metric_statements[0].statements
          value:
            - 'set(attributes["environment_id"], "amp-acme-prod")'
            - 'set(attributes["account_id"], "3f2b1c00-0000-0000-0000-000000000009")'
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: transform/identity

  # A standalone YCP has no account to attribute an environment to, so the install
  # hint sends the environment id alone. An empty accountId must not render as an
  # empty label on every series.
  - it: stamps the environment id alone when no account is given
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.environmentId: amp-acme-prod
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - equal:
          path: spec.config.processors.transform/identity.metric_statements[0].statements
          value:
            - 'set(attributes["environment_id"], "amp-acme-prod")'

  # The identity labels apply to both exporters; the byoc source label is gated on
  # the byoc fan-out. Two independent processors, both in the pipeline.
  - it: keeps the identity and byoc transforms independent
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.environmentId: amp-acme-prod
      otel.accountId: 3f2b1c00-0000-0000-0000-000000000009
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: transform/identity
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: transform/byoc
      - equal:
          path: spec.config.processors.transform/byoc.metric_statements[0].statements[0]
          value: 'set(attributes["source"], "amp")'

  # The log pipeline is a separate concern (ac-logs.md); k8sattributes already
  # attaches its own identity there.
  - it: leaves the logs collector alone
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.environmentId: amp-acme-prod
      otel.accountId: 3f2b1c00-0000-0000-0000-000000000009
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - notExists:
          path: spec.config.processors.transform/identity

  # BYOC OTLP fan-out is opt-in: an install that does not set otel.byoc.enabled
  # must not gain the extra exporter/extension/processor, and must keep pushing
  # only to the remote-write store.
  - it: does not add the byoc fan-out by default
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - notExists:
          path: spec.config.exporters.otlphttp/byoc
      - notExists:
          path: spec.config.extensions.basicauth/byoc
      - notExists:
          path: spec.config.processors.transform/byoc
      - notExists:
          path: spec.env
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value: [prometheus_remote_write]

  - it: wires the byoc otlp exporter, auth, source label and secret when enabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.byoc.enabled: true
      otel.byoc.metricsEndpoint: https://byoc.example/api/v1/otlp/metrics
      otel.byoc.username: byoc
      otel.byoc.source: amp
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - equal:
          path: spec.config.exporters.otlphttp/byoc.metrics_endpoint
          value: https://byoc.example/api/v1/otlp/metrics
      # gzip is mandatory — the ingress returns 415 without Content-Encoding: gzip.
      - equal:
          path: spec.config.exporters.otlphttp/byoc.compression
          value: gzip
      - equal:
          path: spec.config.exporters.otlphttp/byoc.auth.authenticator
          value: basicauth/byoc
      # https endpoint must verify TLS, never fall back to insecure.
      - equal:
          path: spec.config.exporters.otlphttp/byoc.tls.insecure
          value: false
      - equal:
          path: spec.config.extensions.basicauth/byoc.client_auth.username
          value: byoc
      - equal:
          path: spec.config.processors.transform/byoc.metric_statements[0].statements[0]
          value: 'set(attributes["source"], "amp")'
      - contains:
          path: spec.config.service.extensions
          content: basicauth/byoc
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: transform/byoc
      - contains:
          path: spec.config.service.pipelines.metrics.exporters
          content: otlphttp/byoc
      # The BasicAuth password is injected from a Secret, never rendered inline.
      - contains:
          path: spec.env
          content:
            name: BYOC_METRICS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: byoc-metrics-auth
                key: password

  - it: also fans the compute collector out to byoc when enabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - contains:
          path: spec.config.service.pipelines.metrics.exporters
          content: otlphttp/byoc
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: transform/byoc

  - it: omits the controller collector when only compute is enabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
      otel.collectors.controller.enabled: false
    asserts:
      # SA + Role + RoleBinding + ClusterRole + ClusterRoleBinding + compute CR
      # + logs CR + kube-state-metrics (SA + Role + RoleBinding + Deployment).
      - hasDocuments:
          count: 11

  - it: omits the logs collector when it is disabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.collectors.logs.enabled: false
    asserts:
      # The default renders 12, so 11 is exactly the logs CR being absent.
      - hasDocuments:
          count: 11

  # `helm upgrade --reuse-values` replays the previous release's values and
  # ignores new chart defaults, so an install predating this collector has an
  # otel.collectors map with no `logs` key. A direct lookup nil-pointers there
  # and fails the whole upgrade; this asserts the collector still renders.
  - it: still renders the logs collector when otel.collectors has no logs key
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.collectors:
        controller:
          enabled: true
        compute:
          enabled: true
    asserts:
      # 12 is the full default set; the sibling case above renders 11 when logs
      # is explicitly disabled, so this count is exactly "the logs CR is present".
      - hasDocuments:
          count: 12

  # Same --reuse-values path: an unset logsEndpoint reaches hasPrefix as nil and
  # fails the render on a type error, so the exporter has to fall back.
  - it: falls back to the default logs endpoint when the value is unset
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.logsEndpoint: null
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.config.exporters.otlphttp/logs.logs_endpoint
          value: http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs
      - equal:
          path: spec.config.exporters.otlphttp/logs.tls.insecure
          value: true

  # The pod's own view of what it is serving, as against cert-manager's view of
  # what it issued. Appended rather than inserted: the LFC assertion above pins a
  # job by index, so a job added mid-list moves it.
  - it: scrapes the supervisor's certificate expiries off every endpoint pod
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[5].job_name
          value: amp-supervisor
      - contains:
          path: spec.config.receivers.prometheus.config.scrape_configs[5].relabel_configs
          content:
            source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            regex: (.+)
            replacement: "$1:9899"
            target_label: __address__

  - it: includes the cadvisor job only when podMetrics is on
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
      otel.podMetrics: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - lengthEqual:
          path: spec.config.receivers.prometheus.config.scrape_configs
          count: 8

  - it: drops the cadvisor job when podMetrics is off
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
      otel.podMetrics: false
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - lengthEqual:
          path: spec.config.receivers.prometheus.config.scrape_configs
          count: 7

  # The LFC counters are the only ones behind a non-default metrics_path, so a
  # job that silently loses it scrapes compute_ctl's own /metrics twice and the
  # cache dashboards go blank rather than erroring.
  - it: scrapes the LFC gauges off compute_ctl's /autoscaling_metrics
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
      otel.podMetrics: false
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[4].job_name
          value: amp-compute-lfc
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[4].metrics_path
          value: /autoscaling_metrics

  - it: podMetrics off needs no cluster-scoped RBAC at all
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.podMetrics: false
    asserts:
      # SA + Role + RoleBinding + all three collectors + kube-state-metrics' four,
      # and NO ClusterRole/binding: the default renders 12, so 10 here is exactly
      # the two cluster-scoped documents being absent. The log collector adds no
      # cluster-scoped RBAC — it is namespace-filtered by design.
      - hasDocuments:
          count: 10

  - it: pod discovery is a namespaced Role, scoped to pods and replicasets
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    # kube-state-metrics' own Role is the other one in this template.
    set:
      otel.kubeStateMetrics.enabled: false
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: rules[0].resources
          value: [pods]
      # k8sattributes resolves a log's owning workload through its ReplicaSet.
      - equal:
          path: rules[1].resources
          value: [replicasets]

  # Cluster-scoped, so the names must be namespace-prefixed the way rbac.yaml's
  # pair is: unprefixed, two installs into one cluster share them and either
  # uninstall strips the other's node access.
  - it: namespace-prefixes the cluster-scoped names so releases don't collide
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    release:
      namespace: staging
    asserts:
      - equal:
          path: metadata.name
          value: staging-RELEASE-NAME-yb-amp-controller-otel
        documentIndex: 3
      - equal:
          path: metadata.name
          value: staging-RELEASE-NAME-yb-amp-controller-otel
        documentIndex: 4
      # The binding must follow the ClusterRole's new name, not the old one.
      - equal:
          path: roleRef.name
          value: staging-RELEASE-NAME-yb-amp-controller-otel
        documentIndex: 4
      # The namespaced Role/RoleBinding are already unique per namespace and keep
      # the unprefixed name.
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-controller-otel
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-controller-otel
        documentIndex: 2

  - it: the node ClusterRole exists only for cadvisor and grants only node access
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules[0].resources
          value: [nodes, nodes/proxy, nodes/metrics]
      - equal:
          path: rules[1].nonResourceURLs
          value: ["/metrics/cadvisor"]

  # Container logs are node-local files, so anything but daemonset mode silently
  # collects only from the nodes the replicas happen to land on.
  - it: the logs collector is a daemonset-mode OpenTelemetryCollector
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isAPIVersion:
          of: opentelemetry.io/v1beta1
      - equal:
          path: spec.mode
          value: daemonset
      - equal:
          path: spec.config.service.pipelines.logs.receivers
          value: [filelog]

  - it: scopes the log tail to the release namespace and excludes its own collectors
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    release:
      namespace: amp-dev
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.config.receivers.filelog.include
          value: [/var/log/pods/amp-dev_*/*/*.log]
      - equal:
          path: spec.config.receivers.filelog.exclude
          value: [/var/log/pods/amp-dev_RELEASE-NAME-yb-amp-controller-*-collector-*/*/*.log]

  - it: points the log exporter at the configured OTLP logs endpoint
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.logsEndpoint: https://logs.example/insert/opentelemetry/v1/logs
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.config.exporters.otlphttp/logs.logs_endpoint
          value: https://logs.example/insert/opentelemetry/v1/logs
      # https:// endpoints must not fall back to the plaintext default.
      - equal:
          path: spec.config.exporters.otlphttp/logs.tls.insecure
          value: false

  # Off-cluster shipping is one switch: otel.byoc.enabled. Default OFF, so a plain
  # install ships logs to VictoriaLogs alone — no datadog exporter, no shaping, no
  # key env, no secret dependency.
  - it: does not ship logs off-cluster by default, keeping VictoriaLogs primary
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - notExists:
          path: spec.config.exporters.datadog
      - notExists:
          path: spec.config.processors.transform/severity
      - notExists:
          path: spec.config.processors.transform/datadog
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8sattributes, batch]
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: [otlphttp/logs]
      - notContains:
          path: spec.env
          content:
            name: DD_API_KEY

  # byoc.enabled turns on the direct datadog exporter for logs (alongside
  # metrics->Thanos on the metrics collectors). Added to the SAME logs pipeline as
  # the VictoriaLogs exporter, so VictoriaLogs stays primary and Datadog is a
  # second sink.
  - it: fans logs out to datadog when byoc is enabled, keeping VictoriaLogs primary
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.config.exporters.datadog.api.site
          value: us3.datadoghq.com
      # The key is read from env, never rendered inline.
      - equal:
          path: spec.config.exporters.datadog.api.key
          value: ${env:DD_API_KEY}
      # A Datadog outage must not back up the shared pipeline.
      - equal:
          path: spec.config.exporters.datadog.sending_queue.enabled
          value: true
      # Both exporters on the one pipeline; memory_limiter still first, shaping added.
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8sattributes, transform/severity, transform/datadog, batch]
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: [otlphttp/logs, datadog]

  # The api key is injected from a Secret via secretKeyRef — required, not
  # optional: an empty key fails the exporter's startup validation and takes the
  # whole logs daemonset (VictoriaLogs export included) down with it.
  - it: injects the datadog api key from a secret when byoc is enabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.byoc.enabled: true
      otel.datadog.apiKeySecret.name: my-dd-secret
      otel.datadog.apiKeySecret.key: token
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - contains:
          path: spec.env
          content:
            name: DD_API_KEY
            valueFrom:
              secretKeyRef:
                name: my-dd-secret
                key: token

  # ddsource, service and tags are what Datadog groups on. Fleet identity, when
  # set, rides along as ddtags so a log and its metrics share one scope.
  - it: shapes ddsource, service and identity tags for datadog
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.byoc.enabled: true
      otel.environmentId: amp-acme-prod
      otel.accountId: 3f2b1c00-0000-0000-0000-000000000009
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.config.processors.transform/datadog.log_statements[0].statements[0]
          value: 'set(attributes["datadog.log.source"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil'
      - equal:
          path: spec.config.processors.transform/datadog.log_statements[0].statements[1]
          value: 'set(attributes["ddtags"], "env:amp-acme-prod,account:3f2b1c00-0000-0000-0000-000000000009")'

  # No environment/account => no empty ddtags stamped.
  - it: stamps no ddtags when there is no fleet identity
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - notContains:
          path: spec.config.processors.transform/datadog.log_statements[0].statements
          content: 'set(attributes["ddtags"], "")'

  # The secret name/key default so the deploy tooling and the chart agree on where
  # the api key lives.
  - it: defaults the datadog secret name and key
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - contains:
          path: spec.env
          content:
            name: DD_API_KEY
            valueFrom:
              secretKeyRef:
                name: datadog-api
                key: api-key

  # memory_limiter has to run before anything else, or a log storm OOMs the
  # node's collector before the limiter ever sees it. With byoc off (the default)
  # this is the whole processor chain.
  - it: runs memory_limiter first in the logs pipeline
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8sattributes, batch]

  # Both filters matter: the namespace filter is what keeps the chart's RBAC a
  # namespaced Role, and without KUBE_NODE_NAME the node filter cannot resolve.
  - it: filters k8sattributes to this namespace and the collector's own node
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    release:
      namespace: amp-dev
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.config.processors.k8sattributes.filter.namespace
          value: amp-dev
      - equal:
          path: spec.config.processors.k8sattributes.filter.node_from_env_var
          value: KUBE_NODE_NAME
      - contains:
          path: spec.env
          content:
            name: KUBE_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

  # Non-root cannot write the root-owned hostPath checkpoint dir, and the filelog
  # receiver fails to start at all when its storage client can't open — taking
  # the whole pipeline down, not just checkpointing.
  - it: runs the log collector as root so it can read logs and write checkpoints
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.securityContext.runAsUser
          value: 0
      - equal:
          path: spec.securityContext.runAsGroup
          value: 0

  - it: mounts the host log dir read-only and a checkpoint dir for read offsets
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - contains:
          path: spec.volumeMounts
          content:
            name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
      - equal:
          path: spec.config.receivers.filelog.storage
          value: file_storage/checkpoints
      - contains:
          path: spec.config.service.extensions
          content: file_storage/checkpoints

  # The dir is node-shared, and bbolt's exclusive lock means the second release
  # to open it never starts its filelog receiver at all.
  - it: namespace-keys the checkpoint hostPath so two releases do not share it
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    release:
      namespace: staging
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - contains:
          path: spec.volumes
          content:
            name: checkpoints
            hostPath:
              path: /var/lib/otelcol/staging-RELEASE-NAME-yb-amp-controller-logs
              type: DirectoryOrCreate
      # The in-container mount is namespace-independent, so the file_storage
      # extension's directory stays put.
      - equal:
          path: spec.config.extensions.file_storage/checkpoints.directory
          value: /var/lib/otelcol

  - it: passes tolerations through so tainted endpoint nodes still get a collector
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.logsTolerations:
        - key: amp-compute
          operator: Exists
          effect: NoSchedule
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - equal:
          path: spec.tolerations[0].key
          value: amp-compute

  # The in-cluster sinks are optional, and an explicit "" is what drops one. This
  # is the BYOC shape: a customer cluster runs neither VictoriaMetrics nor
  # VictoriaLogs, and an exporter aimed at one that is not there retries forever.
  - it: drops the remote-write exporter when the endpoint is emptied
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.remoteWriteEndpoint: ""
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - notExists:
          path: spec.config.exporters.prometheus_remote_write
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value: [otlphttp/byoc]

  - it: drops the remote-write exporter on the compute collector too
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.remoteWriteEndpoint: ""
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - notExists:
          path: spec.config.exporters.prometheus_remote_write
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value: [otlphttp/byoc]

  # The log shaping must survive the sink drop: severity and ddtags are what make
  # a Datadog-only pipeline legible, and they are gated on byoc, not on the sink.
  - it: drops the in-cluster logs exporter when logsEndpoint is emptied
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.logsEndpoint: ""
      otel.byoc.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-logs
    asserts:
      - notExists:
          path: spec.config.exporters.otlphttp/logs
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: [datadog]
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8sattributes, transform/severity, transform/datadog, batch]

  # One switch for the BYOC shape: it wins over endpoints left at (or set to) a
  # store, since a --reuse-values upgrade replays the old chart's defaults.
  - it: drops both in-cluster exporters when inClusterStores is off
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.inClusterStores.enabled: false
      otel.remoteWriteEndpoint: http://vm.example:8428/api/v1/write
      otel.byoc.enabled: true
    asserts:
      - notExists:
          path: spec.config.exporters.prometheus_remote_write
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-controller-controller
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value: [otlphttp/byoc]
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-controller-compute
      - notExists:
          path: spec.config.exporters.otlphttp/logs
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-controller-logs
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: [datadog]
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-controller-logs

  # The acceptance case for the whole BYOC shape: three collectors, all of them
  # shipping only off-cluster.
  - it: a byoc-only install still renders every collector
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.remoteWriteEndpoint: ""
      otel.logsEndpoint: ""
      otel.byoc.enabled: true
    asserts:
      - hasDocuments:
          count: 12

  # The defaults are load-bearing for every non-BYOC install, and the endpoint is
  # otherwise only ever asserted under an override.
  - it: keeps the in-cluster remote-write endpoint by default
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - equal:
          path: spec.config.exporters.prometheus_remote_write.endpoint
          value: http://victoria-metrics-server.monitoring.svc.cluster.local:8428/api/v1/write
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value: [prometheus_remote_write]

  # null is NOT "": `helm upgrade --reuse-values` on a release predating these keys
  # replays values that name neither endpoint, and that must keep its store rather
  # than silently stop exporting. Twin of the logs case above.
  - it: falls back to the default remote-write endpoint when the value is unset
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.remoteWriteEndpoint: null
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-controller
    asserts:
      - equal:
          path: spec.config.exporters.prometheus_remote_write.endpoint
          value: http://victoria-metrics-server.monitoring.svc.cluster.local:8428/api/v1/write

  # A pipeline with no exporter at all is rejected by the operator's webhook, so
  # this has to fail before anything is applied rather than after.
  - it: refuses to render metrics collectors with no exporter at all
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.remoteWriteEndpoint: ""
    asserts:
      - failedTemplate:
          errorMessage: >-
            no in-cluster metrics store (otel.inClusterStores.enabled=false or an empty
            otel.remoteWriteEndpoint) and otel.byoc.enabled is false: the metrics collectors
            would have no exporter at all. Turn one of them on, or turn the collectors off
            with otel.collectors.controller.enabled=false and
            otel.collectors.compute.enabled=false.

  - it: refuses to render the logs collector with no exporter at all
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.logsEndpoint: ""
    asserts:
      - failedTemplate:
          errorMessage: >-
            no in-cluster log store (otel.inClusterStores.enabled=false or an empty
            otel.logsEndpoint) and otel.byoc.enabled is false: the logs collector would have
            no exporter at all. Turn one of them on, or turn the collector off with
            otel.collectors.logs.enabled=false.

  - it: refuses to render with the in-cluster stores off and byoc off
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.inClusterStores.enabled: false
    asserts:
      - failedTemplate: {}

  # collectors.*.enabled is the supported way to say "run none", which is what
  # makes the fail above a guard rather than a trap.
  - it: an empty remote-write endpoint is fine when the metrics collectors are off
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.remoteWriteEndpoint: ""
      otel.collectors.controller.enabled: false
      otel.collectors.compute.enabled: false
    asserts:
      # SA + Role + RoleBinding + ClusterRole + ClusterRoleBinding + the logs CR.
      - hasDocuments:
          count: 6

  - it: an empty logsEndpoint is fine when the logs collector is off
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.logsEndpoint: ""
      otel.collectors.logs.enabled: false
    asserts:
      - hasDocuments:
          count: 11

  # The endpoint pod's identity labels ride every series scraped from it, so a
  # query can group by cluster, pool, branch or role without a join.
  - it: copies the endpoint pod's identity labels onto the Postgres exporter's series
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[0].job_name
          value: amp-endpoint-pg
      - contains:
          path: spec.config.receivers.prometheus.config.scrape_configs[0].relabel_configs
          content:
            source_labels: [__meta_kubernetes_pod_label_amp_yugabyte_com_cluster_id]
            target_label: cluster_id
      - contains:
          path: spec.config.receivers.prometheus.config.scrape_configs[0].relabel_configs
          content:
            source_labels: [__meta_kubernetes_pod_label_amp_yugabyte_com_branch_id]
            target_label: branch_id

  # The pageserver already labels its branch-scoped series with the same id, and
  # a target label of that name would rename theirs to exported_branch_id. So the
  # pod's branch arrives as pod_branch_id and fills only the series without one.
  - it: fills branch_id on the pageserver's series only where it set none
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[1].job_name
          value: amp-pageserver
      - contains:
          path: spec.config.receivers.prometheus.config.scrape_configs[1].relabel_configs
          content:
            source_labels: [__meta_kubernetes_pod_label_amp_yugabyte_com_endpoint_id]
            target_label: endpoint_id
      - notContains:
          path: spec.config.receivers.prometheus.config.scrape_configs[1].relabel_configs
          content:
            source_labels: [__meta_kubernetes_pod_label_amp_yugabyte_com_branch_id]
            target_label: branch_id
      - contains:
          path: spec.config.receivers.prometheus.config.scrape_configs[1].relabel_configs
          content:
            source_labels: [__meta_kubernetes_pod_label_amp_yugabyte_com_branch_id]
            target_label: pod_branch_id
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[1].metric_relabel_configs
          value:
            - {source_labels: [branch_id, pod_branch_id], regex: ";(.+)", target_label: branch_id, replacement: "$1"}
            - {action: labeldrop, regex: pod_branch_id}

  - it: fills branch_id the same way on the safekeeper's series
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[2].job_name
          value: amp-safekeeper
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[2].metric_relabel_configs
          value:
            - {source_labels: [branch_id, pod_branch_id], regex: ";(.+)", target_label: branch_id, replacement: "$1"}
            - {action: labeldrop, regex: pod_branch_id}

  # Its own ServiceAccount: the collectors' is also bound to the nodes/proxy
  # ClusterRole whenever podMetrics is on.
  - it: runs kube-state-metrics on the release namespace's pods under its own ServiceAccount
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    release:
      namespace: amp-ns
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-yb-amp-controller-kube-state-metrics
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=amp-ns
      - contains:
          path: spec.template.spec.containers[0].args
          content: --resources=pods
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-labels-allowlist=pods=[amp.yugabyte.com/endpoint-id,amp.yugabyte.com/branch-id,amp.yugabyte.com/cluster-id,amp.yugabyte.com/storage-pool-id,amp.yugabyte.com/ep-type]

  # Appended after cadvisor, so the indexed assertions above do not move.
  - it: scrapes kube-state-metrics for endpoint pods only, with the identity labels renamed
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[7].job_name
          value: amp-kube-state-metrics
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[7].metric_relabel_configs
          value:
            - {source_labels: [pod], action: keep, regex: "(yb-ep-.*)"}
            - {action: labelmap, regex: label_amp_yugabyte_com_(.+), replacement: "$1"}
            - {action: labeldrop, regex: label_amp_yugabyte_com_.+}

  - it: drops the kube-state-metrics Deployment when disabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.kubeStateMetrics.enabled: false
    asserts:
      - hasDocuments:
          count: 8

  - it: drops the kube-state-metrics job when disabled
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.kubeStateMetrics.enabled: false
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yb-amp-controller-compute
    asserts:
      - lengthEqual:
          path: spec.config.receivers.prometheus.config.scrape_configs
          count: 7

  # --reuse-values from a release predating the key.
  - it: still renders kube-state-metrics when otel has no kubeStateMetrics key
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    set:
      otel.kubeStateMetrics: null
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1

  # Template order: the collectors' SA/Role/binding, ClusterRole/binding, the
  # controller and compute CRs, then kube-state-metrics' SA (7), Role (8),
  # RoleBinding (9). The kind/name asserts fail loudly if that order moves.
  - it: grants kube-state-metrics list/watch on pods and nothing else
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentIndex: 8
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-controller-kube-state-metrics
      - equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [list, watch]}

  - it: binds kube-state-metrics' Role to its own ServiceAccount only
    capabilities:
      apiVersions:
        - opentelemetry.io/v1beta1
    documentIndex: 9
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-yb-amp-controller-kube-state-metrics
      - equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: RELEASE-NAME-yb-amp-controller-kube-state-metrics, namespace: NAMESPACE}
