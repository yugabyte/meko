suite: rbac
templates:
  - templates/rbac.yaml
# Two independent cluster-scoped grants, and the matrix between them is what this
# suite exists for:
#   rbac.nodeRead      read-only `nodes get, list`. DEFAULT ON — it is what lets the
#                      controller read spec.providerID to pick the cloud for the
#                      nlb_* connectivity modes, and what the NodePort address
#                      resolver reads node IPs with.
#   rbac.clusterScoped namespace get/list/create for Helm --create-namespace.
#                      Default off: this is the grant that can change the cluster.
#
# Document order is the file's: SA, Role, RoleBinding, then the nodeRead pair,
# then the clusterScoped pair. Indices below follow that.
tests:
  - it: grants the node read on a default install, and nothing that can change the cluster
    release:
      namespace: amp
    asserts:
      # 5 = the three namespaced docs + the nodeRead pair. The namespace grant is
      # absent, which is the half of this that matters.
      - hasDocuments:
          count: 5
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-amp-controller-nodes
        documentIndex: 3
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-amp-controller-nodes
        documentIndex: 4

  - it: keeps the node grant read-only
    release:
      namespace: amp
    documentIndex: 3
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get, list]

  - it: binds the node ClusterRole to the controller ServiceAccount in the release namespace
    release:
      namespace: amp
    documentIndex: 4
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: amp-controller
            namespace: amp

  - it: renders the namespaced SA, Role and RoleBinding always
    release:
      namespace: amp
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: amp-controller
        documentIndex: 0
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-controller
        documentIndex: 1
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-controller
        documentIndex: 2

  - it: lets the controller manage the cert-manager Certificates its endpoint releases carry
    release:
      namespace: amp
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["cert-manager.io"]
            resources: [certificates]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: grants the namespaced workload access the controller deploys with
    release:
      namespace: amp
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: [deployments, replicasets, statefulsets]
            verbs: ["*"]
      # In-place pod resize is gated on the pods/resize subresource (separate
      # from `pods`), granted explicitly so the controller can resize endpoints.
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/resize]
            verbs: [patch]

  - it: adds the namespace grant only when rbac.clusterScoped is set
    release:
      namespace: amp
    set:
      rbac.clusterScoped: true
    asserts:
      - hasDocuments:
          count: 7
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-amp-controller-namespaces
        documentIndex: 5
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-amp-controller-namespaces
        documentIndex: 6

  # An install that may hold no cluster-scoped binding at all. nlb_internal then
  # needs controller.endpoint.cloud, since nothing can read a node's providerID.
  - it: drops every cluster-scoped doc when both grants are off
    release:
      namespace: amp
    set:
      rbac.nodeRead: false
      rbac.clusterScoped: false
    asserts:
      - hasDocuments:
          count: 3
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-controller
        documentIndex: 2

  # Cluster-scoped names are namespace-prefixed so two installs of this chart in
  # different namespaces do not collide on one cluster-wide object.
  - it: namespace-prefixes the cluster-scoped names so releases don't collide
    release:
      namespace: staging
    set:
      rbac.clusterScoped: true
    asserts:
      - equal:
          path: metadata.name
          value: staging-amp-controller-nodes
        documentIndex: 3
      - equal:
          path: metadata.name
          value: staging-amp-controller-namespaces
        documentIndex: 5
