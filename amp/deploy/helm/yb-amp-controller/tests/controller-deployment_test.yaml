suite: controller-deployment
templates:
  - templates/controller-deployment.yaml
# Pin appVersion so the image-tag assertion is deterministic — the real
# appVersion is stamped from the repo-root VERSION file (scripts/version.sh).
chart:
  appVersion: "1.2.3"
tests:
  - it: renders the controller Deployment with its ServiceAccount
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: amp-controller
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: amp-controller
      # The image runs as uid/gid 1000; without this group a 0440 Secret mount
      # (the TLS client key) is unreadable and the controller fails at boot.
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: renders no TLS env or mounts by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_YB_TLS_MODE
          any: true
      - notExists:
          path: spec.template.spec.volumes

  - it: hands the endpoint TLS mode and issuer to the controller
    set:
      controller.endpoint.ybTlsMode: verify-full
      tls.issuerRef.name: corp-ca
      tls.caBundleConfigMap: corp-bundle
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_YB_TLS_MODE
            value: verify-full
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_YB_TLS_ISSUER_NAME
            value: corp-ca
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_YB_TLS_CA_CONFIGMAP
            value: corp-bundle
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_YB_TLS_CERT_DURATION
            value: "720h"

  - it: mounts the controller's own certificate and the CA bundle when TLS is on
    set:
      tls.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-client-tls
            secret:
              secretName: amp-controller-db-tls
              defaultMode: 0440
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca-bundle
            configMap:
              name: amp-ca-bundle
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-client-tls
            mountPath: /etc/amp/tls/client
            readOnly: true

  - it: defaults the controller image tag to the chart appVersion
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/yugabyte/amp-controller:1.2.3

  - it: honours controller image repository and tag overrides
    set:
      controller.image.repository: registry.example.com/amp/controller
      controller.image.tag: "20260618-221855"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/amp/controller:20260618-221855

  - it: applies imageTag to the controller and the endpoint it deploys
    set:
      imageTag: custom-7f195e43e51f
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/yugabyte/amp-controller:custom-7f195e43e51f
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_ENDPOINT_IMAGE_TAG
            value: custom-7f195e43e51f
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_ENDPOINT_IMAGE_REPO
            value: quay.io/yugabyte/amp-endpoint

  - it: prefers a per-image tag over imageTag
    set:
      imageTag: custom-7f195e43e51f
      controller.image.tag: "20260618-221855"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/yugabyte/amp-controller:20260618-221855

  # A repository that already names a registry host must survive imageRegistry
  # untouched — that is what up-gke.sh (GCR), redeploy.sh (ECR) and the QA
  # framework pass, and prefixing them would corrupt every one.
  - it: leaves a repository that carries its own registry host alone
    set:
      imageRegistry: quay.io/yugabyte
      controller.image.repository: 454529406029.dkr.ecr.us-west-2.amazonaws.com/amp/controller
      controller.image.tag: x
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 454529406029.dkr.ecr.us-west-2.amazonaws.com/amp/controller:x

  - it: exposes the api and sc container ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: api
            containerPort: 8080

  - it: wires the endpoint control-surface URL helper to the controller Service DNS
    release:
      namespace: amp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_CONTROLLER_URL
            value: http://amp-controller.amp.svc.cluster.local:8080

  - it: carries the AMP_* deploy env block
    set:
      controller.databaseUrl: postgres://yugabyte@yb-tserver.amp.svc.cluster.local:5433/yb_storage?sslmode=disable
    release:
      namespace: amp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DATABASE_URL
            value: postgres://yugabyte@yb-tserver.amp.svc.cluster.local:5433/yb_storage?sslmode=disable
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DB_SCHEMA
            value: controller
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_DRIVER
            value: kubernetes
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_NAMESPACE
            value: amp

  # #602: a test cluster whose nodes cannot back 20 GiB per endpoint vCPU pins a
  # flat /data size instead. Empty is the default and must stay empty, or prod
  # would silently lose CPU-proportional sizing.
  - it: leaves the endpoint disk size override empty by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_DISK_SIZE_OVERRIDE
            value: ""

  - it: passes the endpoint disk size override through when set
    set:
      controller.endpoint.diskSizeOverride: 10Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_DISK_SIZE_OVERRIDE
            value: "10Gi"

  - it: derives the endpoint pull secret from the first imagePullSecret
    set:
      imagePullSecrets:
        - name: pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: pull-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_PULL_SECRET
            value: pull-secret

  - it: probes readiness only — a liveness probe would kill a slow migration (#398)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: api
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: passes the deploy cloud through, so nlb_* works where the node read is not granted
    set:
      controller:
        endpoint:
          cloud: gcp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_CLOUD
            value: "gcp"

  - it: leaves the deploy cloud empty by default, falling back to node detection
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_DEPLOY_CLOUD
            value: ""

  # The controller validates this at startup and EXITS on a bad value, so an
  # unchecked typo would install cleanly and then CrashLoopBackOff the whole
  # control plane. Failing the render turns that into a helm error.
  - it: refuses a deploy cloud outside the enum
    set:
      controller:
        endpoint:
          cloud: GCP
    asserts:
      - failedTemplate:
          errorMessage: controller.endpoint.cloud must be one of aws|gcp|azure (or empty to detect it), got "GCP"
