suite: cert-manager preflight
templates:
  - templates/cert-manager-preflight.yaml
  - templates/controller-certificate.yaml
chart:
  appVersion: "1.2.3"
tests:
  # The preflight renders nothing itself; it exists to stop an install that
  # would produce a Certificate the API server cannot accept.
  - it: is silent with TLS off, whoever owns cert-manager
    set:
      tls.enabled: false
    template: templates/cert-manager-preflight.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: is silent when cert-manager is present
    set:
      tls.enabled: true
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    template: templates/cert-manager-preflight.yaml
    asserts:
      - hasDocuments:
          count: 0

  # The case the check is for: TLS is on and the cluster has no cert-manager,
  # so the Certificate below would be unappliable.
  - it: refuses the render when cert-manager is absent
    set:
      tls.enabled: true
    template: templates/cert-manager-preflight.yaml
    asserts:
      - failedTemplate:
          errorMessage: >-
            tls.enabled, controller.endpoint.ybTlsMode or
            controller.endpoint.computeTlsMode=issue is set but cert-manager is not
            installed on this cluster (no cert-manager.io/v1). Install it with
            `deploy/tls/trust-root.sh`. Rendering offline? pass --api-versions
            cert-manager.io/v1.

  # The endpoint mode alone also needs it: the controller renders a Certificate
  # into every endpoint release from this install's issuerRef.
  - it: refuses the render when only the endpoint TLS mode is set
    set:
      tls.enabled: false
      controller.endpoint.ybTlsMode: verify-full
    template: templates/cert-manager-preflight.yaml
    asserts:
      - failedTemplate:
          errorMessage: >-
            tls.enabled, controller.endpoint.ybTlsMode or
            controller.endpoint.computeTlsMode=issue is set but cert-manager is not
            installed on this cluster (no cert-manager.io/v1). Install it with
            `deploy/tls/trust-root.sh`. Rendering offline? pass --api-versions
            cert-manager.io/v1.

  - it: renders the controller certificate when cert-manager is present
    set:
      tls.enabled: true
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    template: templates/controller-certificate.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Certificate

  # The compute's client-facing certificate is rendered by the endpoint chart
  # from this install's issuerRef too, so it needs cert-manager on the same
  # terms as the YB one.
  - it: refuses the render when only the compute TLS mode issues certificates
    set:
      tls.enabled: false
      controller.endpoint.computeTlsMode: issue
    template: templates/cert-manager-preflight.yaml
    asserts:
      - failedTemplate:
          errorMessage: >-
            tls.enabled, controller.endpoint.ybTlsMode or
            controller.endpoint.computeTlsMode=issue is set but cert-manager is not
            installed on this cluster (no cert-manager.io/v1). Install it with
            `deploy/tls/trust-root.sh`. Rendering offline? pass --api-versions
            cert-manager.io/v1.

  # existing-secret mounts a Secret this chart does not create, so it says
  # nothing about cert-manager being installed here.
  - it: is silent for a shared secret, which this chart does not issue
    set:
      tls.enabled: false
      controller.endpoint.computeTlsMode: existing-secret
      controller.endpoint.computeTlsSecret: amp-endpoints-wildcard-tls
    template: templates/cert-manager-preflight.yaml
    asserts:
      - hasDocuments:
          count: 0
