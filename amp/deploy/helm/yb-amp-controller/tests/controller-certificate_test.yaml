suite: controller-certificate
templates:
  - templates/controller-certificate.yaml
tests:
  - it: renders nothing when TLS is off
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a client-auth Certificate for the controller's YB role
    set:
      tls.enabled: true
      tls.controllerUser: yugabyte
    release:
      namespace: amp
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: metadata.name
          value: amp-controller-db
      - equal:
          path: spec.secretName
          value: amp-controller-db-tls
      - equal:
          path: spec.commonName
          value: yugabyte
      - contains:
          path: spec.dnsNames
          content: amp-controller.amp.svc.cluster.local
      - equal:
          path: spec.usages
          value: [client auth]
      - equal:
          path: spec.privateKey.rotationPolicy
          value: Always
      - equal:
          path: spec.issuerRef
          value:
            kind: ClusterIssuer
            name: amp-ca
            group: cert-manager.io
