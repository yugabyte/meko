suite: reconcile-agent
templates:
  - templates/agent-deployment.yaml
# Pin appVersion so the image-tag assertion is deterministic — the real
# appVersion is stamped from the repo-root VERSION file (scripts/version.sh).
chart:
  appVersion: "1.2.3"
tests:
  - it: renders nothing when the agent is off
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the agent Deployment wired to YCP and the in-cluster controller
    set:
      agent.enabled: true
      agent.ycpUrl: https://devcloud.yugabyte.com/ycp/api/v1
      agent.envName: amp-acme-prod
    release:
      namespace: amp-acme-prod
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: amp-reconcile-agent
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: YCP_URL
            value: https://devcloud.yugabyte.com/ycp/api/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENV_NAME
            value: amp-acme-prod
      # Empty agent.controllerUrl resolves to the release namespace's own
      # controller Service, with the /api/v1 base the agent's client expects.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AMP_CONTROLLER_URL
            value: http://amp-controller.amp-acme-prod.svc.cluster.local:8080/api/v1

  # Both are hard `fail`s rather than a pod that starts and cannot work.
  - it: refuses to render without agent.ycpUrl
    set:
      agent.enabled: true
      agent.envName: amp-acme-prod
    asserts:
      - failedTemplate:
          errorMessage: agent.ycpUrl is required when agent.enabled

  - it: refuses to render without agent.envName
    set:
      agent.enabled: true
      agent.ycpUrl: https://devcloud.yugabyte.com/ycp/api/v1
    asserts:
      - failedTemplate:
          errorMessage: agent.envName is required when agent.enabled

  # The agent resolves through the same registry and tag rule as the amp
  # images, so one imageTag covers the whole install.
  - it: takes imageRegistry and imageTag like every other image
    set:
      agent.enabled: true
      agent.ycpUrl: https://ycp.example.com/api/v1
      agent.envName: amp-acme-prod
      imageTag: custom-7f195e43e51f
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/yugabyte/ycp-reconciler-agent:custom-7f195e43e51f
      # AGENT_VERSION reports whatever tag was resolved.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AGENT_VERSION
            value: custom-7f195e43e51f

  - it: falls back to the chart appVersion when no tag is set anywhere
    set:
      agent.enabled: true
      agent.ycpUrl: https://ycp.example.com/api/v1
      agent.envName: amp-acme-prod
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/yugabyte/ycp-reconciler-agent:1.2.3

  - it: prefers an explicit agent image tag over imageTag
    set:
      agent.enabled: true
      agent.ycpUrl: https://ycp.example.com/api/v1
      agent.envName: amp-acme-prod
      imageTag: custom-7f195e43e51f
      agent.image.tag: latest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/yugabyte/ycp-reconciler-agent:latest

  # The agent is what attests this deployment's telemetry to the control plane, so
  # these come from the same otel values the collectors render from: the agent must
  # not be able to report something the collectors are not doing. The control plane
  # compares the endpoint against the one it printed in the install hint and marks the
  # environment DEGRADED on a mismatch — the one check a customer cannot edit away,
  # since the install runs from a checkout they have.
  - it: reports the deployment's telemetry configuration to the control plane
    set:
      agent.enabled: true
      agent.ycpUrl: https://devcloud.yugabyte.com/ycp/api/v1
      agent.envName: amp-acme-prod
      otel.byoc.enabled: true
      otel.byoc.metricsEndpoint: https://byoc.cloud.yugabyte.com/api/v1/otlp/metrics
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_ENABLED, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_BYOC_ENABLED, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: BYOC_METRICS_ENDPOINT, value: "https://byoc.cloud.yugabyte.com/api/v1/otlp/metrics"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_LOGS_SINK, value: "datadog"}

  # An agent deployed without byoc still attests — reporting "off" is what lets the
  # control plane say so, where reporting nothing is indistinguishable from an old
  # agent image.
  - it: attests honestly when byoc is off
    set:
      agent.enabled: true
      agent.ycpUrl: https://devcloud.yugabyte.com/ycp/api/v1
      agent.envName: amp-acme-prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_BYOC_ENABLED, value: "false"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_LOGS_SINK, value: ""}

  # The agent watches the CONTROLLER collector's own telemetry so it can report
  # whether the environment is still shipping, not just what it was configured to
  # ship. Not the compute collector's: that one scrapes endpoint pods, so an
  # environment owning no endpoints has no targets and a legitimately flat counter.
  - it: points the agent at the controller collector's own telemetry
    release:
      namespace: amp-acme-prod
    set:
      agent.enabled: true
      agent.ycpUrl: https://devcloud.yugabyte.com/ycp/api/v1
      agent.envName: amp-acme-prod
      otel.byoc.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_COLLECTOR_METRICS_URL
            value: http://RELEASE-NAME-yb-amp-controller-controller-collector-monitoring.amp-acme-prod.svc.cluster.local:8888/metrics

  # With the controller collector off there is nothing whose counter means anything,
  # so the agent is given no endpoint rather than a URL that answers nothing.
  - it: omits the watch endpoint when the controller collector is off
    set:
      agent.enabled: true
      agent.ycpUrl: https://devcloud.yugabyte.com/ycp/api/v1
      agent.envName: amp-acme-prod
      otel.byoc.enabled: true
      otel.collectors.controller.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_COLLECTOR_METRICS_URL
          any: true

  # The chart the agent helm-upgrades this release to. It has to be settable here
  # because the agent's built-in default is an OCI ref nobody has published — an
  # environment whose controller version comes from YCP cannot resolve it, so
  # without this value the upgrade fails on every tick with nothing to change.
  - it: passes agent.controllerChart through as CONTROLLER_CHART
    set:
      agent.enabled: true
      agent.ycpUrl: https://ycp.example.com/api/v1
      agent.envName: amp-acme-prod
      agent.controllerChart: https://uploads.dev.yugabyte.com/charts/yb-amp-controller-0.1.0.tgz
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROLLER_CHART
            value: https://uploads.dev.yugabyte.com/charts/yb-amp-controller-0.1.0.tgz

  # Unset means "the binary decides", not "the empty string" — an empty
  # CONTROLLER_CHART would override the agent's own default with nothing.
  - it: omits CONTROLLER_CHART when agent.controllerChart is unset
    set:
      agent.enabled: true
      agent.ycpUrl: https://ycp.example.com/api/v1
      agent.envName: amp-acme-prod
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROLLER_CHART
          any: true
