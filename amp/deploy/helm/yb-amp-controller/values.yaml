# Default values for yb-amp-controller.
#
# Two workloads: the amp controller (always) and its MCP server (gated by
# mcp.enabled). The release namespace (-n / --namespace) is the deploy namespace;
# nothing here creates it.

# -- Pull secrets for the controller + MCP images (ECR). List of {name: ...}.
imagePullSecrets: []

# -- Registry (and org) the amp images live in, prefixed onto any image
# repository below that names no registry host of its own. A repository that
# already carries a host (gcr.io/..., <acct>.dkr.ecr...) is used verbatim, so
# the deploy scripts that pass full paths are unaffected.
imageRegistry: "quay.io/yugabyte"
# -- Tag for every image that does not set its own. Empty falls back to the
# chart appVersion, which is not published — so a real deploy sets this (or a
# per-image tag) rather than relying on the fallback.
imageTag: ""
nameOverride: ""
fullnameOverride: ""

# RBAC. The namespaced ServiceAccount + Role + RoleBinding are always created.
rbac:
  # -- Create a read-only cluster-scoped ClusterRole for `nodes get, list`. The
  # controller reads a node's spec.providerID to tell which cloud it is on,
  # which selects the load-balancer annotations for the per-endpoint `nlb_*`
  # connectivity modes; the NodePort address resolver reads node IPs from the
  # same objects. Read-only, and cluster-wide only because Node is a
  # cluster-scoped kind.
  #
  # Default ON: without it an `nlb_internal` create fails outright, since the
  # endpoint chart refuses to render an internal load balancer for an unknown
  # cloud rather than silently defaulting it to internet-facing. Set it false
  # only where the install may hold no cluster-scoped binding at all — and then
  # set controller.endpoint.cloud, or `nlb_internal` will not work.
  nodeRead: true
  # -- Grant the controller the two third-party CRDs the shared-ingress modes
  # write: Traefik's IngressRouteTCP/MiddlewareTCP (an endpoint's route and its
  # allowlist) and external-dns's DNSEndpoint (its published name). Both travel
  # in the endpoint's own Helm release, so without these an `ingress_*` create
  # is rejected by the API server mid-install.
  #
  # Default ON but harmless when unused: an RBAC rule naming a CRD that is not
  # installed is simply inert, whereas discovering the grant is missing costs a
  # failed deploy. Set false for an install that must hold no rules for APIs it
  # does not use.
  ingress: true
  # -- Also create a ClusterRole + ClusterRoleBinding for namespaces
  # get/list/create, which Helm's --create-namespace probing needs. Default off:
  # this is the grant that can change the cluster, and the deploy namespace is
  # the controller's own, so nothing creates one in the normal path. The node
  # read moved to rbac.nodeRead above — it is read-only and defaults on.
  #
  # This governs the controller only. The metrics collectors carry their own
  # RBAC, sized to what they scrape: a namespaced Role for pod discovery always,
  # plus a ClusterRole for node access when `otel.podMetrics` is on (see there).
  # A wholly namespace-scoped install therefore wants this false AND
  # otel.podMetrics false.
  clusterScoped: false

# Certificate trust to the backing YugabyteDB (controller/architecture/ac-endpoint-tls.md).
# The issuer and CA bundle here are what the controller's own certificate and
# every endpoint's certificate (controller.endpoint.ybTlsMode) are issued from
# and verified against. deploy/tls/trust-root.sh stands both up.
# cert-manager is what issues the controller's and the endpoints' certificates.

tls:
  # -- Give the controller its own client certificate (CN = tls.controllerUser)
  # and mount it with the CA bundle at /etc/amp/tls/client and /etc/amp/tls/ca.
  # controller.databaseUrl must then carry sslmode and those three paths.
  enabled: false
  issuerRef:
    kind: ClusterIssuer
    name: amp-ca
    group: cert-manager.io
  # -- ConfigMap in the release namespace holding the CA bundle under key ca.crt
  # (trust-manager keeps it current).
  caBundleConfigMap: amp-ca-bundle
  # -- The YB role the controller connects as; the certificate's CN.
  controllerUser: yugabyte
  certificate:
    duration: 720h
    renewBefore: 240h
    algorithm: ECDSA
    size: 256

controller:
  # -- Number of controller pods. The controller holds in-pod state (its managed
  # controller subprocess), so keep this at 1.
  replicaCount: 1

  image:
    # -- Controller image repository.
    repository: amp-controller
    # -- Image tag. Empty falls back to .Values.imageTag, then the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # -- Postgres DSN for the controller's backing YugabyteDB (AMP_DATABASE_URL).
  databaseUrl: "postgres://yugabyte@yb-tserver:5433/yb_storage?sslmode=disable"
  # -- Schema the controller's own tables live in (AMP_DB_SCHEMA).
  dbSchema: "controller"
  # -- Log format: text | json (AMP_LOG_FORMAT).
  logFormat: "text"

  # Container ports.
  ports:
    # -- REST API + UI + storage-layer control surface port (AMP serves /api/v1,
    # /healthz and /readyz here).
    api: 8080

  # External exposure of the controller UI/API. The in-cluster ClusterIP Service
  # (api + sc) is always created; this `service` block selects an EXTRA external
  # Service. The MCP server is exposed the same way (see mcp below).
  service:
    # -- How to expose the controller externally: nodeport | internal-lb | external-lb | none.
    type: "internal-lb"
    # -- Fixed nodePort when type=nodeport (30000-32767); empty => auto-assign.
    nodePortValue: ""
    # -- Annotations for the LoadBalancer Service when type=internal-lb, as a list
    # of "key=value" strings. Defaults to the GKE internal-LB annotations.
    annotations:
      - "networking.gke.io/load-balancer-type=Internal"
      - "networking.gke.io/internal-load-balancer-allow-global-access=true"

  # Config the controller hands to each endpoint it deploys. This chart only ever
  # deploys on Kubernetes, so the deploy driver is fixed to "kubernetes" in the
  # template — there is no driver knob here.
  # How long the controller waits for an endpoint deploy/retire to converge
  # (helm --wait → AMP_DEPLOY_TIMEOUT). Empty = the binary's own default (10m).
  # A multi-node or cold-cache cluster can need more: the first endpoint pull
  # alone can exceed 10m there.
  deployTimeout: ""
  endpoint:
    image:
      # -- Endpoint image repository (AMP_ENDPOINT_IMAGE_REPO).
      repository: amp-endpoint
      # -- Endpoint image tag (AMP_ENDPOINT_IMAGE_TAG); empty falls back to
      # .Values.imageTag, then the chart appVersion.
      tag: ""
    # -- CSV of backing-YB tserver host:port the controller hands to endpoints (AMP_DEPLOY_YB_HOST_PORTS).
    ybHostPorts: "yb-tserver:5433"
    # -- YB role endpoints connect as (AMP_DEPLOY_YB_USER).
    ybUser: "yugabyte"
    # -- YB database endpoints use (AMP_DEPLOY_YB_DBNAME).
    ybDbname: "yb_storage"
    # -- libpq sslmode endpoints use to reach YB (AMP_DEPLOY_YB_TLS_MODE). Empty
    # or disable = plaintext. Anything else gives every endpoint release a
    # cert-manager Certificate (CN = ybUser, from tls.issuerRef) mounted with
    # the CA bundle (tls.caBundleConfigMap), so a `cert` HBA rule logs it in.
    ybTlsMode: ""
    # -- Lifetime and renewal lead of each endpoint's client certificate.
    ybTlsCertDuration: "720h"
    ybTlsCertRenewBefore: "240h"
    # -- StorageClass for each endpoint's /data PVC; empty => emptyDir (AMP_DEPLOY_STORAGE_CLASS).
    # -- Shared ingress: put endpoints on a port of a shared load balancer
    # instead of one each (controller/architecture/ac-ingress.md). `enabled` is
    # the opt-in — off (the default) means this deployment has no shards and the
    # ingress_* connectivity modes are refused with 400 rather than falling back
    # to a dedicated load balancer, which would reinstate the per-endpoint cost
    # without anyone choosing it.
    ingress:
      # -- Route endpoints through shared ingress shards. Off (the default) means
      # the ingress_* connectivity modes are refused.
      enabled: false
      # -- DNS zone INTERNAL endpoint names are published under, e.g.
      # internal.byoc.example.com. OPTIONAL and separate from `enabled`: with no
      # zone the names are allocated but not published, and an endpoint's address
      # is its shard's host:port. That is what a cluster with no external-dns
      # (kind, CI) gets, and it routes identically.
      zoneInternal: ""
      # -- DNS zone EXTERNAL endpoint names are published under, e.g.
      # external.byoc.example.com. Kept separate from the internal zone so
      # external-dns can be pinned to each with --zone-id-filter, and an internal
      # endpoint's name can never be published to a public zone. The allocator
      # stores the name it mints, so pointing both at one zone is not something a
      # later config change can undo.
      zoneExternal: ""
      # -- Listener range each shard provisions in full at build; its width is
      # how many endpoints one shard holds.
      portRange: "20000-20049"
      # -- Free ports kept per family before another shard is built, so a slow
      # shard build never lands on an endpoint create. Must be below the range's
      # width or every new shard arrives already short of headroom.
      headroom: 10
      # -- Ceiling on shards the control plane may build unattended.
      maxShards: 24
      # -- How long a released port stays unissued, so a client holding a cached
      # address cannot reach whichever database takes the slot next.
      quarantine: "10m"
      # -- `spread` (emptiest shard: smallest blast radius, but no shard ever
      # empties so none can be reclaimed) or `pack` (fullest with room: shards
      # drain by themselves as endpoints retire).
      placement: spread
    storageClass: ""
    # -- Size of each endpoint's /data PVC when storageClass is set (AMP_DEPLOY_DISK_SIZE).
    diskSize: "10Gi"
    # -- Flat /data size for every endpoint regardless of CPU, bypassing the
    # 20 GiB-per-vCPU policy and the diskSize floor (AMP_DEPLOY_DISK_SIZE_OVERRIDE).
    # Empty (default) keeps CPU-proportional sizing; leave it empty in prod. For a
    # test cluster whose nodes cannot back the ratio: a 100GB GKE boot disk leaves
    # ~43.8Gi allocatable, so a 2-vCPU endpoint's 40Gi packs one per node, "10Gi" four.
    diskSizeOverride: ""
    # -- GiB of memory per endpoint vCPU (AMP_DEPLOY_MEMORY_GIB_PER_VCPU). Fills
    # in the memory when a create names only CPU, and is the floor every request
    # is held to — a pair below it is refused with a 400. 0 (default) uses the
    # built-in 8 GiB/vCPU. Lower it only for a cluster whose nodes cannot back
    # that shape: a test pool packing many small tenants is the case it exists
    # for, and every endpoint there gets a Postgres with less cache than the
    # product intends.
    memoryGiBPerVCPU: 0
    # -- Node labels endpoint pods must schedule onto, as a list of "key=value"
    # strings (joined into the AMP_DEPLOY_NODE_SELECTOR CSV). Leave storageClass
    # empty and point this at a local-NVMe-SSD ephemeral node pool (GKE:
    # "cloud.google.com/gke-ephemeral-storage-local-ssd=true") to put each
    # endpoint's emptyDir /data on NVMe. Empty => no selector (schedules anywhere).
    nodeSelector: []
    # -- Tailscale MagicDNS suffix (e.g. "tail5955.ts.net") used to derive each
    # endpoint's tailnet address when its Service is tailnet-exposed
    # (tailscale.com/expose=true in service.annotations). Empty disables tailnet
    # address reporting (AMP_DEPLOY_TAILNET_SUFFIX).
    tailnetSuffix: ""
    # -- Override the cloud whose load-balancer annotations the per-endpoint
    # `nlb_*` connectivity modes render: "aws", "gcp" or "azure"
    # (AMP_DEPLOY_CLOUD). Empty (the normal case) = detect it from a node's
    # spec.providerID, which rbac.nodeRead grants by default. Set this only
    # where that read is unavailable, or where the provider IDs say something
    # the controller reads wrongly.
    cloud: ""
    service:
      # -- Service type for each deployed endpoint: ClusterIP | NodePort | LoadBalancer (AMP_DEPLOY_SERVICE_TYPE).
      type: "ClusterIP"
      # -- Reserved for a fixed endpoint NodePort. The controller's deployer
      # currently auto-assigns it, so this is not yet wired through.
      nodePortValue: ""
      # -- Annotations for LoadBalancer endpoint Services, as a list of "key=value"
      # strings (joined into the AMP_DEPLOY_SERVICE_ANNOTATIONS CSV).
      annotations: []

  # YCP integration is no longer wired on the controller itself: the standalone
  # reconcile-agent (the `agent` block below) is the sole YCP client for the
  # environment. It drives this controller over the REST API and pins itself via
  # the write-once binding endpoint. A standalone controller needs no YCP config.

  # -- Compute resources for the controller container.
  resources: {}
  # -- Readiness probe (HTTP /readyz on the api port). The controller has NO
  # liveness probe: startup migrations run before anything answers /healthz,
  # and a liveness kill mid-migration leaves the schema dirty (#398).
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

# reconcile-agent: the standalone YCP client that converges this environment to
# YCP's desired state, driving the controller over its REST API. Off by default.
# It is the SOLE YCP client for the environment (one API key drives one
# environment); the controller itself no longer talks to YCP.
agent:
  # -- Deploy the reconcile-agent (Deployment + ServiceAccount + RBAC).
  enabled: false
  # -- Number of agent pods. Keep at 1: single YCP client, unsharded loop.
  replicaCount: 1

  image:
    # -- Reconcile-agent image repository. Published as
    # quay.io/yugabyte/ycp-reconciler-agent; the host comes from imageRegistry.
    repository: ycp-reconciler-agent
    # -- Image tag. Empty falls back to .Values.imageTag, then the chart
    # appVersion. /ci amp_deploy_gke_ycp publishes this image under the same
    # custom-<sha> as the amp images, so imageTag covers all of them; its own
    # build also publishes latest, which an explicit tag here selects.
    tag: ""
    pullPolicy: IfNotPresent

  # -- YCP base URL the agent dials (YCP_URL) — YBM's per-account pass-through,
  # or a direct address like https://devcloud.yugabyte.com/ycp/api/v1. Take it
  # from the install hint verbatim: it already carries the API base path.
  # Required when enabled.
  ycpUrl: ""
  # -- Environment name to enroll as; must match the environment registered in
  # the YCP console (ENV_NAME). Required when enabled.
  envName: ""
  # -- Placement reported to YCP: cloud | onprem (ENV_PLACEMENT).
  placement: "cloud"
  # -- Controller REST base URL the agent drives (AMP_CONTROLLER_URL). Empty =>
  # the in-cluster controller Service DNS on the api port, with /api/v1.
  controllerUrl: ""
  # -- Reconcile loop interval (RECONCILE_INTERVAL). Empty => the binary's default (10s).
  reconcileInterval: ""
  # The YBM API key every YCP call authenticates with is read from a Secret, not
  # set inline, so it never lands in the release values. Create it before install:
  #   kubectl -n <ns> create secret generic amp-agent-api-key \
  #     --from-literal=api-key=<the key YBM showed once>
  # Dev mode (a standalone control plane, no YBM): put dev-admin-secret and
  # dev-api-key-id keys in the same Secret instead of api-key; the agent then
  # sends them as the X-Meko-Admin-Secret / X-Meko-Api-Key-ID headers.
  apiKeySecret:
    # -- Secret name holding the API key. Empty => "amp-agent-api-key".
    name: ""
    # -- Key within the Secret holding the API key.
    key: "api-key"

  # -- Compute resources for the agent container.
  resources: {}

# MCP server: a thin, stateless HTTP wrapper of the controller REST API, in its
# own pod. Reaches the controller over the in-cluster Service DNS.
mcp:
  # -- Deploy the MCP server (Deployment + Service). false drops both.
  enabled: true
  # -- Number of MCP pods. Stateless, so this is safe to scale.
  replicaCount: 1

  image:
    # -- MCP server image repository (built from controller/mcp/Dockerfile).
    repository: amp-mcp
    # -- Image tag. Empty falls back to .Values.imageTag, then the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # -- Controller base URL the MCP server points at (AMP_CONTROLLER_URL). Empty =>
  # the in-cluster controller Service DNS on the api port (computed in a helper).
  controllerUrl: ""
  # -- MCP transport: http (for k8s) | stdio (AMP_MCP_TRANSPORT).
  transport: "http"
  # -- Port the MCP server binds and the Service exposes (AMP_MCP_PORT).
  port: 8000

  # -- Compute resources for the MCP container.
  resources: {}
  # -- HTTP GET /healthz liveness/readiness probes on the MCP port. The server
  # serves /healthz under the http transport (which this pod always runs), so a
  # 200 confirms the MCP application is serving, not just that the port is bound.
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

  # The MCP server is exposed the SAME way as the controller: an in-cluster
  # ClusterIP Service (amp-controller-mcp) is always created, and `controller.expose`
  # additionally creates a matching external Service (amp-controller-mcp-np /
  # amp-controller-mcp-lb) alongside the controller's. So dev (nodeport / none) keeps
  # the MCP endpoint internal, and a prod `external-lb` exposes it externally — one
  # knob, no separate MCP exposure setting.

# UI: the amp_ui React SPA served by nginx, in its own pod. nginx serves the
# static build and reverse-proxies /api/ to the controller over the in-cluster
# Service DNS, so the SPA uses relative /api/v1 URLs with no CORS.
ui:
  # -- Deploy the UI (Deployment + Service). false drops both.
  enabled: true
  # -- Number of UI pods. Stateless (static assets + a stateless proxy), so this
  # is safe to scale.
  replicaCount: 1

  image:
    # -- UI image repository (built from amp_ui/Dockerfile).
    repository: amp-controller-ui
    # -- Image tag. Empty falls back to .Values.imageTag, then the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # -- Controller base URL nginx proxies /api/ to (CONTROLLER_URL). Empty => the
  # in-cluster controller Service DNS on the api port (computed in a helper). Must
  # be an origin with no trailing path (nginx forwards the original /api/... URI).
  controllerUrl: ""
  # -- Port nginx listens on and the Service exposes (UI_PORT).
  port: 80

  # -- Compute resources for the UI (nginx) container.
  resources: {}
  # -- HTTP GET /healthz liveness/readiness probes on the UI port. nginx serves
  # /healthz itself (a static 200), so a 200 confirms nginx is serving — it does
  # not depend on the controller being reachable.
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

  # The UI is exposed the SAME way as the controller (controller.service.type): an
  # in-cluster ClusterIP Service (amp-controller-ui) is always created, plus a
  # matching external Service (amp-controller-ui-np / amp-controller-ui-lb)
  # alongside the controller's — so the one exposure knob puts the UI wherever the
  # controller UI/API is. With controller.service.type=internal-lb (the default),
  # the UI is reachable on an internal LoadBalancer (amp-controller-ui-lb) out of
  # the box — this is the front door for the SPA (it reverse-proxies /api/ to the
  # controller in-cluster).
  service:
    # -- How to expose the UI externally, on its OWN Service independent of the
    # controller: nodeport | internal-lb | external-lb | none. Default internal-lb
    # => the UI gets its own internal LoadBalancer (amp-controller-ui-lb) out of the
    # box (the SPA reverse-proxies /api/ to the controller in-cluster). Set to none
    # to only keep the in-cluster ClusterIP Service.
    type: "internal-lb"
    # -- Annotations for the UI LoadBalancer when type=internal-lb, as a list of
    # "key=value" strings. Defaults to the GKE internal-LB annotations.
    annotations:
      - "networking.gke.io/load-balancer-type=Internal"
      - "networking.gke.io/internal-load-balancer-allow-global-access=true"

# Pod-level security context. fsGroup is the controller image's "yugabyte" gid
# (uid/gid 1000): Secret volumes mount root-owned at 0440, and this gid is what
# lets the non-root process read the TLS client key under tls.enabled.
podSecurityContext:
  fsGroup: 1000
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# OpenTelemetry metrics collectors (controller/architecture/ac-metrics.md).
# Deployed as OpenTelemetryCollector CRs reconciled by the OpenTelemetry
# Operator. Two deployment-mode collectors scrape the amp components' Prometheus
# endpoints and remote-write to a Prometheus-compatible store.
otel:
  # -- Deploy the OTel collector CRs. On by default, so a deployment gets its
  # dashboards populated without a second, separately-remembered setting — an
  # install that names a remote-write endpoint and runs no collector reports
  # nothing, silently, which is the failure this default exists to prevent.
  #
  # Rendering is additionally gated on the opentelemetry.io CRDs being present,
  # so this default cannot fail an install on a cluster without the
  # OpenTelemetry Operator — there the collectors are skipped and NOTES.txt says
  # they were. Set false to opt out on a cluster that has the operator but
  # should not run these collectors.
  enabled: true
  # -- Collector image. Empty => the operator's configured default (must be a
  # distro with the prometheus + filelog receivers, the k8sattributes processor
  # and the prometheusremotewrite exporter, i.e. opentelemetry-collector-contrib).
  image: ""
  # -- Prometheus remote-write endpoint of the metrics store (VictoriaMetrics,
  # Prometheus, Thanos receive, …).
  remoteWriteEndpoint: "http://victoria-metrics-server.monitoring.svc.cluster.local:8428/api/v1/write"
  # Fleet identity, stamped as a label on EVERY series both metrics collectors
  # scrape (controller/architecture/ac-metrics.md). Normally set by the install
  # hint the YCP console prints; unset stamps nothing.
  #
  # -- The YCP environment id — the slug, e.g. "acme-prod", the same value as
  # agent.envName. Unique per account, which accountId resolves.
  environmentId: ""
  # -- The YBM account that owns this environment. The install hint omits it for a
  # standalone YCP, whose all-zeros sentinel account would label every series
  # identically.
  accountId: ""
  # The single switch for shipping telemetry OFF-cluster to the yugabyte-cloud
  # managed backends, IN ADDITION to the in-cluster stores. Off by default: a
  # normal install ships only to VictoriaMetrics/VictoriaLogs and needs no external
  # credentials. When enabled, BOTH fan-outs turn on together, each needing its own
  # out-of-band Secret:
  #   - metrics also -> YBM Thanos, over the BYOC OTLP door on an AWS PrivateLink
  #     endpoint. Both metrics collectors gain a `basicauth/byoc` extension, a
  #     `transform/byoc` processor stamping the `source` label, and an
  #     `otlphttp/byoc` exporter to metricsEndpoint. Auth: passwordSecret below
  #     (BasicAuth — the "metrics ingest auth").
  #   - logs also -> Datadog US3, direct. The logs daemonset gains severity/tag
  #     shaping and a `datadog` exporter. Auth: datadog.apiKeySecret below (the
  #     Datadog API key).
  # So a byoc-enabled install needs BOTH Secrets present first (byoc-metrics-auth
  # AND datadog-api) — a missing either fails the collectors that reference it to
  # start. Thanos is internal so it needs the ingress door; Datadog is a public
  # SaaS so logs go straight there.
  byoc:
    enabled: false
    # -- Full OTLP/HTTP metrics POST URL (lands in Thanos).
    metricsEndpoint: "https://byoc.devcloud.yugabyte.com/api/v1/otlp/metrics"
    # -- BasicAuth username the ingress nginx checks against its htpasswd.
    username: "byoc"
    source: "amp"
    # -- Secret in the release namespace holding the BasicAuth password for the
    # metrics door. Create it out-of-band before a byoc-enabled install:
    #   kubectl -n <ns> create secret generic byoc-metrics-auth \
    #     --from-literal=password='<byoc htpasswd password>'
    passwordSecret:
      name: "byoc-metrics-auth"
      key: "password"
  # -- OTLP/HTTP logs endpoint of the log store. Defaults to the VictoriaLogs
  # OTLP ingest path served by the amp-monitoring chart; any OTLP/HTTP logs
  # receiver works (a central collector, a vendor endpoint, …).
  logsEndpoint: "http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs"
  # -- Tolerations for the logs daemonset. Set these when endpoint pods run on
  # tainted nodes — the daemonset has to be schedulable there or those nodes'
  # logs are silently missing.
  logsTolerations: []
  # Datadog config for the logs fan-out. It has NO `enabled` of its own — the
  # `datadog` exporter is gated on byoc.enabled above (logs -> Datadog US3 is one
  # half of the byoc off-cluster shipping). These are just the sink's parameters,
  # consumed only when byoc is on. The apiKeySecret MUST exist in the release
  # namespace before a byoc-enabled install: the exporter validates its key at
  # collector startup and fails on an empty one, which — because it shares the one
  # logs daemonset with the VictoriaLogs exporter — takes the WHOLE log pipeline
  # down. Create it out-of-band (same convention as byoc.passwordSecret):
  #   kubectl -n <ns> create secret generic datadog-api \
  #     --from-literal=api-key='<datadog api key>'
  datadog:
    # -- Datadog site (regional intake). Matches the yugabyte-cloud control
    # plane's us3 tenant; change it for a different Datadog org.
    site: "us3.datadoghq.com"
    # -- Secret in the release namespace holding the Datadog API key. Referenced
    # via secretKeyRef so the key never lands in the rendered CR.
    apiKeySecret:
      name: "datadog-api"
      key: "api-key"
  # -- Also scrape per-pod cAdvisor resource metrics (CPU/mem/net) for the
  # endpoint pods, via each node's kubelet. Feeds the whole "amp — Pod resources"
  # dashboard (all 7 panels); the controller, postgres and storage dashboards do
  # not use it.
  #
  # REQUIRES CLUSTER-SCOPED RBAC. cAdvisor lives in the kubelet, so this is the
  # one collector job that cannot be namespaced: turning it on renders a
  # ClusterRole granting nodes/nodes-proxy/nodes-metrics reads. Set false for an
  # install that must stay namespace-scoped — the other three dashboards are
  # unaffected and this one reports no data.
  podMetrics: true
  # -- Pod-name regex the compute collector keeps for cAdvisor metrics. Defaults
  # to the controller's endpoint naming (yb-ep-*); widen it (e.g.
  # ".*yb-amp-endpoint.*") for manually-installed endpoint releases.
  podMetricsSelector: "yb-ep-.*"
  # Scrape ports for the Neon services on each endpoint pod. Keep these in sync
  # with the yb-amp-endpoint chart's ports.{pageserverHttp,safekeeperHttp,computeCtlHttp}
  # if you override them there.
  scrapePorts:
    pageserver: 9898
    safekeeper: 7676
    computeCtl: 3080
  collectors:
    # Scrapes the amp controller (:8080) + in-pod controller (:50051).
    controller:
      enabled: true
    # Scrapes every endpoint pod: postgres_exporter/pageserver/safekeeper/compute_ctl.
    compute:
      enabled: true
    # Tails every amp container's stdout on the node (pageserver, safekeeper,
    # compute_ctl, Postgres, the controller) and exports OTLP to logsEndpoint.
    # Namespace-scoped: needs no cluster-wide RBAC, unlike podMetrics above.
    logs:
      enabled: true
