apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yb-amp-controller.controllerName" . }}
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
---
# The controller drives Helm to deploy endpoint workloads, and reads
# pods/services (pod-IP / LoadBalancer-IP lookups), so it needs broad access in
# its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "yb-amp-controller.controllerName" . }}
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims, endpoints, events, serviceaccounts]
    verbs: ["*"]
  # In-place vertical pod resize (k8s 1.33+) is gated on the pods/resize
  # SUBRESOURCE, which is separate from `pods` above — the controller PATCHes it
  # to resize a running endpoint without a restart.
  - apiGroups: [""]
    resources: [pods/resize]
    verbs: [patch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets]
    verbs: ["*"]
  # Voyager migrations create and observe batch Jobs; the Job owns the
  # short-lived assess/migrate pod while the controller polls its status.
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: ["*"]
  # Each TLS-mode endpoint release carries a cert-manager Certificate, applied
  # by helm under this ServiceAccount. Harmless where cert-manager is absent.
  - apiGroups: ["cert-manager.io"]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "yb-amp-controller.controllerName" . }}
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "yb-amp-controller.controllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "yb-amp-controller.controllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.nodeRead }}
---
# Read-only node access, on its own so it does not ride along with the namespace
# grant below. The controller reads a node's spec.providerID to tell which cloud
# it is on, which is what selects the load-balancer annotations for the nlb_*
# endpoint connectivity modes; the NodePort address resolver reads node IPs from
# the same objects. Both are read-only and cluster-wide only because Node is a
# cluster-scoped kind — this grants nothing that can change the cluster.
#
# Default on, because without it an nlb_internal create fails outright: the
# endpoint chart refuses to render an internal load balancer for an unknown
# cloud rather than defaulting it to internet-facing. Turn it off only where a
# tenant may hold no cluster-scoped binding at all, and then set
# controller.endpoint.cloud so the controller does not need to look.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "yb-amp-controller.controllerName" . }}-nodes
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "yb-amp-controller.controllerName" . }}-nodes
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "yb-amp-controller.controllerName" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "yb-amp-controller.controllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.clusterScoped }}
---
# Namespace get/list/create, for Helm's --create-namespace probing. This is the
# grant that can change the cluster, which is why it stays default-off and
# separate from the node read above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "yb-amp-controller.controllerName" . }}-namespaces
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "yb-amp-controller.controllerName" . }}-namespaces
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "yb-amp-controller.controllerName" . }}-namespaces
subjects:
  - kind: ServiceAccount
    name: {{ include "yb-amp-controller.controllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
