{{- /*
cert-manager is installed by deploy/tls/trust-root.sh, not by this chart. When
it is absent the Certificate below would be a kind the API server does not know,
and Helm's own error for that names a resource mapping rather than the thing to
fix. Worse, a chart that skipped the Certificate silently would leave the
Deployment mounting a Secret nobody creates, and the pod would sit in
FailedMount forever.

.Capabilities.APIVersions is the cluster's real API surface on install and
upgrade. Under `helm template` there is no cluster to ask, so a caller that
renders offline passes --api-versions (the QA framework does, from the CRDs it
finds).
*/ -}}
{{- /*
Three knobs need cert-manager: tls.enabled is this pod's own certificate,
controller.endpoint.ybTlsMode makes the controller render a Certificate into
every endpoint release, and computeTlsMode=issue renders a second one there. An
install that set only one of the latter two used to pass here and then fail one
endpoint deploy task at a time.

computeTlsMode=existing-secret is deliberately NOT here: it mounts a Secret this
chart does not create, which may have been issued anywhere.
*/ -}}
{{- if or .Values.tls.enabled .Values.controller.endpoint.ybTlsMode (eq .Values.controller.endpoint.computeTlsMode "issue") }}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
{{- fail (printf "tls.enabled, controller.endpoint.ybTlsMode or controller.endpoint.computeTlsMode=issue is set but cert-manager is not installed on this cluster (no cert-manager.io/v1). Install it with `deploy/tls/trust-root.sh`. Rendering offline? pass --api-versions cert-manager.io/v1.") }}
{{- end }}
{{- end }}
