{{- if include "yb-amp-controller.endpointServiceAccountCreate" . }}
# What every endpoint pod runs as. Bound to nothing, deliberately, and the pods
# mount no token: an endpoint owner who gets code running inside Postgres must
# not be able to reach the Kubernetes API, and a binding someone adds to
# `default` would otherwise reach every endpoint in the namespace.
#
# Kept on delete: endpoint Deployments are their own releases and name it, and
# nothing re-renders them when this release rolls back or stops creating it, so
# deleting it would leave each endpoint unable to replace its pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yb-amp-controller.endpointServiceAccountName" . }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: endpoint
  annotations:
    helm.sh/resource-policy: keep
    {{- with dig "serviceAccount" "annotations" dict .Values.controller.endpoint }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
