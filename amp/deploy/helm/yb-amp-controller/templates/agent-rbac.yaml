{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yb-amp-controller.agentName" . }}
  labels:
    {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 4 }}
---
# The agent persists its status token + identity in a Secret in its own namespace
# (create on first enroll, merge-patch after) so a restart resumes without
# re-enrolling. That Secret is all it touches through the k8s API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "yb-amp-controller.agentName" . }}
  labels:
    {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "yb-amp-controller.agentName" . }}
  labels:
    {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "yb-amp-controller.agentName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "yb-amp-controller.agentName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
