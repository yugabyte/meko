{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yb-amp-controller.agentName" . }}
  labels:
    {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 4 }}
---
# The agent persists its identity (environment id, uuid and name) in its own state
# Secret in its own namespace (create on first check-in, merge-patch after) so a
# restart that cannot reach the control plane still knows which environment it
# is. Its credential lives in a separate, operator-planted Secret
# (amp-agent-api-key) that the agent never writes; this Role's get/create/patch
# grant is for the state Secret only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "yb-amp-controller.agentName" . }}
  labels:
    {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
  # Read-only workload status, for the console's components tab: the agent reads
  # readyReplicas and the container image off each object. Same grant the meko chart
  # gives its agent — one binary, one collector. An agent whose Role predates this
  # logs the refusal once and reports no components, rather than retrying every tick.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "yb-amp-controller.agentName" . }}
  labels:
    {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "yb-amp-controller.agentName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "yb-amp-controller.agentName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
