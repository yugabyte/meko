{{- if .Values.agent.enabled }}
{{- if not .Values.agent.ycpUrl }}{{ fail "agent.ycpUrl is required when agent.enabled" }}{{- end }}
{{- if not .Values.agent.envName }}{{ fail "agent.envName is required when agent.enabled" }}{{- end }}
{{- $chartPullSecret := .Values.agent.chartPullSecret | default (dig "name" "" (first (.Values.imagePullSecrets | default (list dict)))) }}
{{- /* dig: --reuse-values on a release predating the key leaves it unset. */}}
{{- $metricsPort := dig "metricsPort" 9464 .Values.agent }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yb-amp-controller.agentName" . }}
  labels:
    {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 4 }}
spec:
  # Single YCP client for the environment; the reconcile loop is not sharded.
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yb-amp-controller.agentSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yb-amp-controller.agentName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: reconcile-agent
          image: {{ include "yb-amp-controller.agentImage" . }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            {{- /*
            FIRST, deliberately. Duplicate env names resolve last-wins in the
            container, so anything rendered after this overrides it, which is
            what keeps the chart's own vars authoritative. In particular the
            OTEL_* attestation vars below must not be settable from values: the
            agent reports them to YCP as evidence the collectors are running
            (#1337), and an operator who could overwrite them could report
            SHIPPING while shipping nothing.
            */}}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.agent.controllerChart }}
            - name: CONTROLLER_CHART
              value: {{ . | quote }}
            {{- end }}
            {{- /* A dockerconfigjson Secret is already the file helm reads OCI
                   registry credentials from, so pointing helm at the mounted copy
                   is the whole login. Mounted, not copied into env, so a rotated
                   secret reaches the next helm invocation without a restart. */}}
            {{- if $chartPullSecret }}
            - name: HELM_REGISTRY_CONFIG
              value: /etc/helm-registry/config.json
            {{- end }}
            - name: YCP_URL
              value: {{ .Values.agent.ycpUrl | quote }}
            - name: AMP_CONTROLLER_URL
              value: {{ include "yb-amp-controller.agentControllerUrl" . | quote }}
            - name: ENV_NAME
              value: {{ .Values.agent.envName | quote }}
            - name: ENV_PLACEMENT
              value: {{ .Values.agent.placement | quote }}
            - name: AGENT_VERSION
              value: {{ include "yb-amp-controller.imageTag" (dict "tag" .Values.agent.image.tag "ctx" .) | quote }}
            - name: AGENT_METRICS_PORT
              value: {{ $metricsPort | quote }}
            {{- with .Values.agent.reconcileInterval }}
            - name: RECONCILE_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- /* What this deployment ships and where, from the same otel values
                   the collectors render from — so the agent cannot attest to
                   something the collectors are not doing. The agent sends it on
                   enroll and on every status tick; the control plane compares the
                   endpoint against the one it printed in the install hint and
                   DEGRADES the environment on a mismatch rather than refusing it.
                   The install runs from a checkout the customer has, so this is the
                   only side of the check a customer cannot edit away. */}}
            - name: OTEL_ENABLED
              value: {{ dig "enabled" true .Values.otel | quote }}
            - name: OTEL_BYOC_ENABLED
              value: {{ dig "byoc" "enabled" false .Values.otel | quote }}
            - name: BYOC_METRICS_ENDPOINT
              value: {{ include "yb-amp-controller.byocMetricsEndpoint" . | quote }}
            - name: OTEL_LOGS_SINK
              value: {{ if include "yb-amp-controller.byocLogsEndpoint" . }}"datadog"{{ else }}""{{ end }}
            {{- /* The CONTROLLER collector's own-telemetry endpoint, so the agent can
                   report whether this environment is still SHIPPING rather than only
                   what it was configured to ship. Deliberately not the compute
                   collector's: that one scrapes endpoint pods, so an environment with
                   no endpoints has no targets and a legitimately flat counter. */}}
            {{- if dig "collectors" "controller" "enabled" true .Values.otel }}
            - name: OTEL_COLLECTOR_METRICS_URL
              value: "http://{{ include "yb-amp-controller.fullname" . }}-controller-collector-monitoring.{{ .Release.Namespace }}.svc.cluster.local:8888/metrics"
            {{- end }}
            {{- $keySecret := .Values.agent.apiKeySecret.name | default "amp-agent-api-key" }}
            - name: YCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $keySecret | quote }}
                  key: {{ .Values.agent.apiKeySecret.key | quote }}
                  # Optional so the same Secret can instead carry the dev-mode
                  # pair below; the agent enforces that one of the two is set.
                  optional: true
            - name: YCP_DEV_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $keySecret | quote }}
                  key: dev-admin-secret
                  optional: true
            - name: YCP_DEV_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $keySecret | quote }}
                  key: dev-api-key-id
                  optional: true
          {{- if gt (int $metricsPort) 0 }}
          ports:
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
          {{- end }}
          {{- if $chartPullSecret }}
          volumeMounts:
            - name: chart-pull-secret
              mountPath: /etc/helm-registry
              readOnly: true
          {{- end }}
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if $chartPullSecret }}
      volumes:
        - name: chart-pull-secret
          secret:
            secretName: {{ $chartPullSecret | quote }}
            items:
              - key: .dockerconfigjson
                path: config.json
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
