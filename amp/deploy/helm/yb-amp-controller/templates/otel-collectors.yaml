{{- if and .Values.otel.enabled (.Capabilities.APIVersions.Has "opentelemetry.io/v1beta1") }}
{{- /*
OpenTelemetry Collector CRs (reconciled by the OpenTelemetry Operator) that
implement the collect-and-export step of the amp metrics pipeline
(controller/architecture/ac-metrics.md) and log pipeline
(controller/architecture/ac-logs.md). Three collectors ship with the control
plane:
  - controller: scrapes the amp controller (:8080).
  - compute:    scrapes every endpoint pod's Prometheus sources — the
    postgres_exporter sidecar (:9187), pageserver (:9898), safekeeper (:7676),
    compute_ctl (:3080) — plus per-pod cAdvisor resource metrics.
  - logs:       tails every amp container's stdout off the node — pageserver,
    safekeeper, compute_ctl and Postgres itself — and exports OTLP to a log
    store (VictoriaLogs by default).
The two metrics collectors run deployment-mode and remote-write to a
Prometheus-compatible store (VictoriaMetrics by default); the log collector must
be a daemonset, since container logs are only readable node-locally.

Gated on the opentelemetry.io CRDs being present as well as otel.enabled, so
that enabled-by-default cannot fail an install on a cluster without the
OpenTelemetry Operator: there, the collectors are skipped and NOTES.txt says
so. `helm template`/`--dry-run` without a live cluster reports no CRDs either,
so rendering locally needs `--api-versions opentelemetry.io/v1beta1`.
*/}}
{{- $fullName := include "yb-amp-controller.fullname" . }}
{{- $saName := printf "%s-otel" $fullName }}
{{- $ns := .Release.Namespace }}
{{- /* Namespace-prefixed like rbac.yaml's cluster-scoped pair: $fullName comes
       from the release name alone, so without the prefix two installs into
       different namespaces of one cluster share these objects and uninstalling
       either strips the other's node access (#888). */}}
{{- $clusterName := printf "%s-%s-otel" $ns $fullName }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
---
{{- /*
Pod discovery for every app scrape job. All of them are namespace-restricted
(`role: pod, namespaces: {names: [<release ns>]}`), so this is a Role, not a
ClusterRole: an install that does not scrape node metrics needs no cluster-scoped
rights at all. The log collector's k8sattributes processor is namespace-filtered
for the same reason, and reads replicasets to name a pod's owning workload.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-otel
  namespace: {{ $ns }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-otel
  namespace: {{ $ns }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-otel
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $ns }}
{{- if .Values.otel.podMetrics }}
---
{{- /*
Node access, for the kubelet-cadvisor job alone (otel.podMetrics). cAdvisor runs
inside the kubelet and publishes per-container CPU/memory/network at
https://<nodeIP>:10250/metrics/cadvisor, so `role: node` discovery and
nodes/metrics are cluster-scoped by nature — there is no namespaced equivalent,
which is why this is the one piece of otel RBAC that cannot be a Role. Rendered
only when that job exists: with podMetrics off, nothing here is created.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $ns }}
{{- end }}
{{- if .Values.otel.collectors.controller.enabled }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ $fullName }}-controller
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
spec:
  mode: deployment
  serviceAccount: {{ $saName }}
  {{- with .Values.otel.image }}
  image: {{ . }}
  {{- end }}
  {{- if dig "byoc" "enabled" false .Values.otel }}
  env:
    - name: BYOC_METRICS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.otel.byoc.passwordSecret.name | quote }}
          key: {{ .Values.otel.byoc.passwordSecret.key | quote }}
  {{- end }}
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if dig "byoc" "enabled" false .Values.otel }}
      basicauth/byoc:
        client_auth:
          username: {{ .Values.otel.byoc.username | quote }}
          password: ${env:BYOC_METRICS_PASSWORD}
      {{- end }}
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: amp-controller
              scrape_interval: 15s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], action: keep, regex: controller}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ .Values.controller.ports.api }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
    processors:
      batch: {}
      {{- if dig "byoc" "enabled" false .Values.otel }}
      # Stamp the source label on every datapoint. A datapoint attribute (not a
      # resource attribute) so Prometheus's OTLP receiver promotes it to a label
      # without the control plane needing promote_resource_attributes.
      transform/byoc:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["source"], {{ .Values.otel.byoc.source | quote }})
      {{- end }}
    exporters:
      prometheus_remote_write:
        endpoint: {{ .Values.otel.remoteWriteEndpoint | quote }}
        tls:
          # Plaintext for in-cluster http:// stores; TLS for an https:// endpoint.
          insecure: {{ if hasPrefix "https://" .Values.otel.remoteWriteEndpoint }}false{{ else }}true{{ end }}
        resource_to_telemetry_conversion:
          enabled: true
      {{- if dig "byoc" "enabled" false .Values.otel }}
      # Fan-out to the BYOC OTLP ingress (Thanos in yugabyte-cloud) over
      # PrivateLink. gzip is mandatory — the ingress nginx returns 415 without
      # Content-Encoding: gzip. TLS verifies against the public LE cert; SNI is
      # the byoc hostname, resolved to the in-VPC endpoint by a private zone.
      otlphttp/byoc:
        metrics_endpoint: {{ .Values.otel.byoc.metricsEndpoint | quote }}
        compression: gzip
        auth:
          authenticator: basicauth/byoc
        tls:
          insecure: false
      {{- end }}
    service:
      extensions: [health_check{{ if dig "byoc" "enabled" false .Values.otel }}, basicauth/byoc{{ end }}]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch{{ if dig "byoc" "enabled" false .Values.otel }}, transform/byoc{{ end }}]
          exporters: [prometheus_remote_write{{ if dig "byoc" "enabled" false .Values.otel }}, otlphttp/byoc{{ end }}]
{{- end }}
{{- if .Values.otel.collectors.compute.enabled }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ $fullName }}-compute
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
spec:
  mode: deployment
  serviceAccount: {{ $saName }}
  {{- with .Values.otel.image }}
  image: {{ . }}
  {{- end }}
  {{- if dig "byoc" "enabled" false .Values.otel }}
  env:
    - name: BYOC_METRICS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.otel.byoc.passwordSecret.name | quote }}
          key: {{ .Values.otel.byoc.passwordSecret.key | quote }}
  {{- end }}
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if dig "byoc" "enabled" false .Values.otel }}
      basicauth/byoc:
        client_auth:
          username: {{ .Values.otel.byoc.username | quote }}
          password: ${env:BYOC_METRICS_PASSWORD}
      {{- end }}
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: amp-endpoint-pg
              scrape_interval: 15s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
                - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+)}
                - {source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: (.+);(.+), replacement: "$1:$2", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
            - job_name: amp-pageserver
              scrape_interval: 30s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "pageserver" 9898 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
            - job_name: amp-safekeeper
              scrape_interval: 30s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "safekeeper" 7676 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
            - job_name: amp-compute-ctl
              scrape_interval: 30s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "computeCtl" 3080 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
            {{- if .Values.otel.podMetrics }}
            - job_name: kubelet-cadvisor
              scrape_interval: 30s
              scheme: https
              metrics_path: /metrics/cadvisor
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs: [{role: node}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_node_address_InternalIP], action: replace, regex: (.+), replacement: "$1:10250", target_label: __address__}
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
              metric_relabel_configs:
                - {source_labels: [pod], action: keep, regex: "({{ .Values.otel.podMetricsSelector | default "yb-ep-.*" }})"}
            {{- end }}
    processors:
      batch: {}
      {{- if dig "byoc" "enabled" false .Values.otel }}
      # Stamp the source label on every datapoint. A datapoint attribute (not a
      # resource attribute) so Prometheus's OTLP receiver promotes it to a label
      # without the control plane needing promote_resource_attributes.
      transform/byoc:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["source"], {{ .Values.otel.byoc.source | quote }})
      {{- end }}
    exporters:
      prometheus_remote_write:
        endpoint: {{ .Values.otel.remoteWriteEndpoint | quote }}
        tls:
          # Plaintext for in-cluster http:// stores; TLS for an https:// endpoint.
          insecure: {{ if hasPrefix "https://" .Values.otel.remoteWriteEndpoint }}false{{ else }}true{{ end }}
        resource_to_telemetry_conversion:
          enabled: true
      {{- if dig "byoc" "enabled" false .Values.otel }}
      # Fan-out to the BYOC OTLP ingress (Thanos in yugabyte-cloud) over
      # PrivateLink. gzip is mandatory — the ingress nginx returns 415 without
      # Content-Encoding: gzip. TLS verifies against the public LE cert; SNI is
      # the byoc hostname, resolved to the in-VPC endpoint by a private zone.
      otlphttp/byoc:
        metrics_endpoint: {{ .Values.otel.byoc.metricsEndpoint | quote }}
        compression: gzip
        auth:
          authenticator: basicauth/byoc
        tls:
          insecure: false
      {{- end }}
    service:
      extensions: [health_check{{ if dig "byoc" "enabled" false .Values.otel }}, basicauth/byoc{{ end }}]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch{{ if dig "byoc" "enabled" false .Values.otel }}, transform/byoc{{ end }}]
          exporters: [prometheus_remote_write{{ if dig "byoc" "enabled" false .Values.otel }}, otlphttp/byoc{{ end }}]
{{- end }}
{{- /*
`dig` rather than a direct lookup: `helm upgrade --reuse-values` replays the
previous release's values and ignores new chart defaults, so upgrading an install
that predates this collector leaves otel.collectors.logs unset — a direct
reference nil-pointers and fails the upgrade outright.
*/}}
{{- if dig "collectors" "logs" "enabled" true .Values.otel }}
{{- /* Defaulted for the same --reuse-values reason: an unset logsEndpoint reaches
       hasPrefix as nil and fails the render on a type error. */}}
{{- $logsEndpoint := .Values.otel.logsEndpoint | default "http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs" }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ $fullName }}-logs
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
spec:
  # Container logs are node-local files, so this one collects per node rather
  # than scraping over the network like the metrics pair.
  mode: daemonset
  serviceAccount: {{ $saName }}
  # Both hostPaths below are root-owned: the operator otherwise runs the
  # collector under a non-root uid that cannot write the checkpoint dir
  # ("permission denied" on receiver_filelog_, which fails the whole pipeline)
  # and cannot read every container log. Running the log tailer as root is what
  # promtail, fluent-bit and the upstream collector's logsCollection preset do.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  {{- with .Values.otel.image }}
  image: {{ . }}
  {{- end }}
  {{- with .Values.otel.logsTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  env:
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    # Read offsets survive a collector restart, so a rescheduled pod neither
    # replays nor skips what it already shipped.
    - name: checkpoints
      hostPath:
        path: /var/lib/otelcol/{{ $fullName }}-logs
        type: DirectoryOrCreate
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: checkpoints
      mountPath: /var/lib/otelcol
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/checkpoints:
        directory: /var/lib/otelcol
    receivers:
      filelog:
        # Scoped to this namespace: the daemonset can see every pod on the node,
        # and shipping the node's other tenants is both a volume and a privacy
        # problem.
        include: [/var/log/pods/{{ $ns }}_*/*/*.log]
        # Without this the collector's own stdout feeds back into its pipeline.
        exclude: [/var/log/pods/{{ $ns }}_{{ $fullName }}-*-collector-*/*/*.log]
        include_file_path: true
        # Not `end`: an endpoint pod that dies during startup is exactly the case
        # these logs exist to explain, and the checkpoint prevents replay.
        start_at: beginning
        storage: file_storage/checkpoints
        retry_on_failure:
          enabled: true
        operators:
          # Strips the CRI/containerd (or docker) envelope, reassembles lines
          # the runtime split at 16 KiB, and lifts k8s.{namespace,pod,container}
          # off the file path.
          - type: container
            id: container-parser
            add_metadata_from_filepath: true
    processors:
      # First in the pipeline: a log storm from one pod must not OOM the node's
      # collector.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Pod uid, workload identity and the amp labels the file path can't carry.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          # Namespace-scoped to match the Role above — without this the processor
          # lists pods cluster-wide and the chart would need a ClusterRole.
          namespace: {{ $ns }}
          # A daemonset pod only ever reads its own node; unfiltered, each replica
          # would watch every pod in the cluster.
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.node.name
          labels:
            # `endpoint` matches the label the metrics collectors relabel onto
            # every per-endpoint series, so a log line and its metrics join.
            - {tag_name: endpoint, key: app.kubernetes.io/instance, from: pod}
            - {tag_name: component, key: app.kubernetes.io/component, from: pod}
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
          - sources: [{from: resource_attribute, name: k8s.namespace.name}, {from: resource_attribute, name: k8s.pod.name}]
      batch: {}
    exporters:
      otlphttp/logs:
        logs_endpoint: {{ $logsEndpoint | quote }}
        tls:
          # Plaintext for in-cluster http:// stores; TLS for an https:// endpoint.
          insecure: {{ if hasPrefix "https://" $logsEndpoint }}false{{ else }}true{{ end }}
    service:
      extensions: [health_check, file_storage/checkpoints]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/logs]
{{- end }}
{{- end }}
