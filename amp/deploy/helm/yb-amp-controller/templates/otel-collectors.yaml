{{- if and .Values.otel.enabled (.Capabilities.APIVersions.Has "opentelemetry.io/v1beta1") }}
{{- /*
OpenTelemetry Collector CRs (reconciled by the OpenTelemetry Operator) that
implement the collect-and-export step of the amp metrics pipeline
(controller/architecture/ac-metrics.md) and log pipeline
(controller/architecture/ac-logs.md). Three collectors ship with the control
plane:
  - controller: scrapes the amp controller (:8080).
  - compute:    scrapes every endpoint pod's Prometheus sources — the
    postgres_exporter sidecar (:9187), pageserver (:9898), safekeeper (:7676),
    compute_ctl (:3080), the supervisor's certificate expiries (:9899) — plus
    per-pod cAdvisor resource metrics.
  - logs:       tails every amp container's stdout off the node — pageserver,
    safekeeper, compute_ctl and Postgres itself — and exports OTLP to a log
    store (VictoriaLogs by default).
The two metrics collectors run deployment-mode and remote-write to a
Prometheus-compatible store (VictoriaMetrics by default); the log collector must
be a daemonset, since container logs are only readable node-locally.

Gated on the opentelemetry.io CRDs being present as well as otel.enabled, so
that enabled-by-default cannot fail an install on a cluster without the
OpenTelemetry Operator: there, the collectors are skipped and NOTES.txt says
so. `helm template`/`--dry-run` without a live cluster reports no CRDs either,
so rendering locally needs `--api-versions opentelemetry.io/v1beta1`.
*/}}
{{- $fullName := include "yb-amp-controller.fullname" . }}
{{- $saName := printf "%s-otel" $fullName }}
{{- $ns := .Release.Namespace }}
{{- /* Namespace-prefixed like rbac.yaml's cluster-scoped pair: $fullName comes
       from the release name alone, so without the prefix two installs into
       different namespaces of one cluster share these objects and uninstalling
       either strips the other's node access (#888). */}}
{{- $clusterName := printf "%s-%s-otel" $ns $fullName }}
{{- /* Fleet identity, set by the install hint the control plane prints. `dig` for
       the --reuse-values reason documented at the logs collector below: upgrading
       an install that predates these keys leaves them unset, and a direct
       reference nil-pointers the render. */}}
{{- $envID := dig "environmentId" "" .Values.otel }}
{{- $acctID := dig "accountId" "" .Values.otel }}
{{- /* The in-cluster sinks are OPTIONAL, and the contract is that an empty string
       is not the same as an absent key. An EXPLICIT "" means "no in-cluster sink"
       and drops that exporter, which is what makes a BYOC-only install possible; a
       MISSING key keeps the chart default, so `helm upgrade --reuse-values` on a
       release predating this cannot silently lose its store. `| default` cannot
       express that difference — it collapses both onto the default — so `dig` plus
       an explicit nil guard, for the --reuse-values reason at the logs collector
       below. */}}
{{- $rwEndpoint := dig "remoteWriteEndpoint" "http://victoria-metrics-server.monitoring.svc.cluster.local:8428/api/v1/write" .Values.otel }}
{{- if kindIs "invalid" $rwEndpoint }}{{ $rwEndpoint = "http://victoria-metrics-server.monitoring.svc.cluster.local:8428/api/v1/write" }}{{ end }}
{{- $inClusterStores := dig "inClusterStores" "enabled" true .Values.otel }}
{{- if not $inClusterStores }}{{ $rwEndpoint = "" }}{{ end }}
{{- /* The single switch for shipping telemetry off-cluster: metrics to Thanos (the
       metrics collectors below) and logs to Datadog (the logs daemonset). Hoisted
       here because both halves of the file need it. */}}
{{- $byocEnabled := dig "byoc" "enabled" false .Values.otel }}
{{- /* Built as a list, like $ddTags below: with both halves optional an inline
       [{{if}}...{{end}}{{if}}, ...{{end}}] has to hand-manage the comma. */}}
{{- $metricsExporters := list }}
{{- if $rwEndpoint }}{{ $metricsExporters = append $metricsExporters "prometheus_remote_write" }}{{ end }}
{{- if $byocEnabled }}{{ $metricsExporters = append $metricsExporters "otlphttp/byoc" }}{{ end }}
{{- /* A pipeline with no exporter at all is rejected by the operator's webhook, so
       refuse to render rather than apply it. collectors.*.enabled is the supported
       way to say "run none", and the message names it. */}}
{{- $metricsWanted := or (dig "collectors" "controller" "enabled" true .Values.otel) (dig "collectors" "compute" "enabled" true .Values.otel) }}
{{- if and $metricsWanted (eq (len $metricsExporters) 0) }}
{{- fail "no in-cluster metrics store (otel.inClusterStores.enabled=false or an empty otel.remoteWriteEndpoint) and otel.byoc.enabled is false: the metrics collectors would have no exporter at all. Turn one of them on, or turn the collectors off with otel.collectors.controller.enabled=false and otel.collectors.compute.enabled=false." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
---
{{- /*
Pod discovery for every app scrape job. All of them are namespace-restricted
(`role: pod, namespaces: {names: [<release ns>]}`), so this is a Role, not a
ClusterRole: an install that does not scrape node metrics needs no cluster-scoped
rights at all. The log collector's k8sattributes processor is namespace-filtered
for the same reason, and reads replicasets to name a pod's owning workload.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-otel
  namespace: {{ $ns }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-otel
  namespace: {{ $ns }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-otel
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $ns }}
{{- if .Values.otel.podMetrics }}
---
{{- /*
Node access, for the kubelet-cadvisor job alone (otel.podMetrics). cAdvisor runs
inside the kubelet and publishes per-container CPU/memory/network at
https://<nodeIP>:10250/metrics/cadvisor, so `role: node` discovery and
nodes/metrics are cluster-scoped by nature — there is no namespaced equivalent,
which is why this is the one piece of otel RBAC that cannot be a Role. Rendered
only when that job exists: with podMetrics off, nothing here is created.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $ns }}
{{- end }}
{{- if .Values.otel.collectors.controller.enabled }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ $fullName }}-controller
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
spec:
  mode: deployment
  serviceAccount: {{ $saName }}
  {{- with .Values.otel.image }}
  image: {{ . }}
  {{- end }}
  {{- if $byocEnabled }}
  env:
    - name: BYOC_METRICS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.otel.byoc.passwordSecret.name | quote }}
          key: {{ .Values.otel.byoc.passwordSecret.key | quote }}
  {{- end }}
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if $byocEnabled }}
      basicauth/byoc:
        client_auth:
          username: {{ .Values.otel.byoc.username | quote }}
          password: ${env:BYOC_METRICS_PASSWORD}
      {{- end }}
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: amp-controller
              scrape_interval: 15s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], action: keep, regex: controller}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ .Values.controller.ports.api }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
    processors:
      batch: {}
      {{- if or $envID $acctID }}
      # Fleet identity on every scraped series, so one store can attribute a
      # datapoint to its environment and account. Datapoint attributes, for the
      # same reason as transform/byoc below.
      transform/identity:
        metric_statements:
          - context: datapoint
            statements:
              {{- if $envID }}
              - set(attributes["environment_id"], {{ $envID | quote }})
              {{- end }}
              {{- if $acctID }}
              - set(attributes["account_id"], {{ $acctID | quote }})
              {{- end }}
      {{- end }}
      {{- if $byocEnabled }}
      # Stamp the source label on every datapoint. A datapoint attribute (not a
      # resource attribute) so Prometheus's OTLP receiver promotes it to a label
      # without the control plane needing promote_resource_attributes.
      transform/byoc:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["source"], {{ .Values.otel.byoc.source | quote }})
      {{- end }}
    exporters:
      {{- if $rwEndpoint }}
      prometheus_remote_write:
        endpoint: {{ $rwEndpoint | quote }}
        tls:
          # Plaintext for in-cluster http:// stores; TLS for an https:// endpoint.
          insecure: {{ if hasPrefix "https://" $rwEndpoint }}false{{ else }}true{{ end }}
        resource_to_telemetry_conversion:
          enabled: true
      {{- end }}
      {{- if $byocEnabled }}
      # Fan-out to the BYOC OTLP ingress (Thanos in yugabyte-cloud) over
      # PrivateLink. gzip is mandatory — the ingress nginx returns 415 without
      # Content-Encoding: gzip. TLS verifies against the public LE cert; SNI is
      # the byoc hostname, resolved to the in-VPC endpoint by a private zone.
      otlphttp/byoc:
        metrics_endpoint: {{ .Values.otel.byoc.metricsEndpoint | quote }}
        compression: gzip
        auth:
          authenticator: basicauth/byoc
        tls:
          insecure: false
      {{- end }}
    service:
      extensions: [health_check{{ if $byocEnabled }}, basicauth/byoc{{ end }}]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [{{ if or $envID $acctID }}transform/identity, {{ end }}batch{{ if $byocEnabled }}, transform/byoc{{ end }}]
          exporters: [{{ $metricsExporters | join ", " }}]
{{- end }}
{{- if .Values.otel.collectors.compute.enabled }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ $fullName }}-compute
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
spec:
  mode: deployment
  serviceAccount: {{ $saName }}
  {{- with .Values.otel.image }}
  image: {{ . }}
  {{- end }}
  {{- if $byocEnabled }}
  env:
    - name: BYOC_METRICS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.otel.byoc.passwordSecret.name | quote }}
          key: {{ .Values.otel.byoc.passwordSecret.key | quote }}
  {{- end }}
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if $byocEnabled }}
      basicauth/byoc:
        client_auth:
          username: {{ .Values.otel.byoc.username | quote }}
          password: ${env:BYOC_METRICS_PASSWORD}
      {{- end }}
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: amp-endpoint-pg
              scrape_interval: 15s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
                - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+)}
                - {source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: (.+);(.+), replacement: "$1:$2", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                {{- include "yb-amp-controller.endpointIdentityRelabels" (dict) | nindent 16 }}
            - job_name: amp-pageserver
              scrape_interval: 30s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "pageserver" 9898 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
                {{- include "yb-amp-controller.endpointIdentityRelabels" (dict "branchFill" true) | nindent 16 }}
              metric_relabel_configs:
                {{- include "yb-amp-controller.endpointBranchFill" . | nindent 16 }}
            - job_name: amp-safekeeper
              scrape_interval: 30s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "safekeeper" 7676 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
                {{- include "yb-amp-controller.endpointIdentityRelabels" (dict "branchFill" true) | nindent 16 }}
              metric_relabel_configs:
                {{- include "yb-amp-controller.endpointBranchFill" . | nindent 16 }}
            - job_name: amp-compute-ctl
              scrape_interval: 30s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "computeCtl" 3080 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
                {{- include "yb-amp-controller.endpointIdentityRelabels" (dict) | nindent 16 }}
            # The compute's local file cache (LFC) counters live in the
            # communicator worker process and are served over a unix socket in
            # PGDATA, which nothing outside the container can reach. compute_ctl
            # proxies them at /autoscaling_metrics (lfc_hits / lfc_misses /
            # lfc_used / lfc_writes / lfc_cache_size_limit) — the LFC is the layer
            # between shared_buffers and a getpage over the network, so without
            # this job a miss is only visible once it has already cost a round trip.
            - job_name: amp-compute-lfc
              scrape_interval: 30s
              metrics_path: /autoscaling_metrics
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "computeCtl" 3080 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
                {{- include "yb-amp-controller.endpointIdentityRelabels" (dict) | nindent 16 }}
            # Certificate expiries, from the supervisor. Two gauges, both read from
            # the files the postmaster is actually configured with rather than from
            # what cert-manager believes it issued — those diverge exactly when a
            # renewal has not reached the pod, which is the case worth alerting on
            # and the one a cluster-level cert-manager metric cannot see. Served
            # only when the endpoint has a controller, which a controller-driven
            # install always sets; a standalone install scrapes nothing here.
            - job_name: amp-supervisor
              scrape_interval: 60s
              kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ $ns }}]}}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: keep, regex: yb-amp-endpoint}
                - {source_labels: [__meta_kubernetes_pod_ip], action: replace, regex: (.+), replacement: "$1:{{ dig "scrapePorts" "supervisor" 9899 .Values.otel }}", target_label: __address__}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], target_label: endpoint}
                - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
                {{- include "yb-amp-controller.endpointIdentityRelabels" (dict) | nindent 16 }}
            {{- if .Values.otel.podMetrics }}
            - job_name: kubelet-cadvisor
              scrape_interval: 30s
              scheme: https
              metrics_path: /metrics/cadvisor
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs: [{role: node}]
              relabel_configs:
                - {source_labels: [__meta_kubernetes_node_address_InternalIP], action: replace, regex: (.+), replacement: "$1:10250", target_label: __address__}
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
              metric_relabel_configs:
                - {source_labels: [pod], action: keep, regex: "({{ .Values.otel.podMetricsSelector | default "yb-ep-.*" }})"}
            {{- end }}
    processors:
      batch: {}
      {{- if or $envID $acctID }}
      # Fleet identity on every scraped series, so one store can attribute a
      # datapoint to its environment and account. Datapoint attributes, for the
      # same reason as transform/byoc below.
      transform/identity:
        metric_statements:
          - context: datapoint
            statements:
              {{- if $envID }}
              - set(attributes["environment_id"], {{ $envID | quote }})
              {{- end }}
              {{- if $acctID }}
              - set(attributes["account_id"], {{ $acctID | quote }})
              {{- end }}
      {{- end }}
      {{- if $byocEnabled }}
      # Stamp the source label on every datapoint. A datapoint attribute (not a
      # resource attribute) so Prometheus's OTLP receiver promotes it to a label
      # without the control plane needing promote_resource_attributes.
      transform/byoc:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["source"], {{ .Values.otel.byoc.source | quote }})
      {{- end }}
    exporters:
      {{- if $rwEndpoint }}
      prometheus_remote_write:
        endpoint: {{ $rwEndpoint | quote }}
        tls:
          # Plaintext for in-cluster http:// stores; TLS for an https:// endpoint.
          insecure: {{ if hasPrefix "https://" $rwEndpoint }}false{{ else }}true{{ end }}
        resource_to_telemetry_conversion:
          enabled: true
      {{- end }}
      {{- if $byocEnabled }}
      # Fan-out to the BYOC OTLP ingress (Thanos in yugabyte-cloud) over
      # PrivateLink. gzip is mandatory — the ingress nginx returns 415 without
      # Content-Encoding: gzip. TLS verifies against the public LE cert; SNI is
      # the byoc hostname, resolved to the in-VPC endpoint by a private zone.
      otlphttp/byoc:
        metrics_endpoint: {{ .Values.otel.byoc.metricsEndpoint | quote }}
        compression: gzip
        auth:
          authenticator: basicauth/byoc
        tls:
          insecure: false
      {{- end }}
    service:
      extensions: [health_check{{ if $byocEnabled }}, basicauth/byoc{{ end }}]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [{{ if or $envID $acctID }}transform/identity, {{ end }}batch{{ if $byocEnabled }}, transform/byoc{{ end }}]
          exporters: [{{ $metricsExporters | join ", " }}]
{{- end }}
{{- /*
`dig` rather than a direct lookup: `helm upgrade --reuse-values` replays the
previous release's values and ignores new chart defaults, so upgrading an install
that predates this collector leaves otel.collectors.logs unset — a direct
reference nil-pointers and fails the upgrade outright.
*/}}
{{- if dig "collectors" "logs" "enabled" true .Values.otel }}
{{- /* Same empty-vs-absent contract as the metrics endpoint above: an explicit ""
       drops the in-cluster exporter, an unset key keeps the default (and would
       otherwise reach hasPrefix as nil and fail the render on a type error). */}}
{{- $logsEndpoint := dig "logsEndpoint" "http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs" .Values.otel }}
{{- if kindIs "invalid" $logsEndpoint }}{{ $logsEndpoint = "http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs" }}{{ end }}
{{- if not $inClusterStores }}{{ $logsEndpoint = "" }}{{ end }}
{{- $logsExporters := list }}
{{- if $logsEndpoint }}{{ $logsExporters = append $logsExporters "otlphttp/logs" }}{{ end }}
{{- if $byocEnabled }}{{ $logsExporters = append $logsExporters "datadog" }}{{ end }}
{{- if eq (len $logsExporters) 0 }}
{{- fail "no in-cluster log store (otel.inClusterStores.enabled=false or an empty otel.logsEndpoint) and otel.byoc.enabled is false: the logs collector would have no exporter at all. Turn one of them on, or turn the collector off with otel.collectors.logs.enabled=false." }}
{{- end }}
{{- /* Datadog logs fan-out — gated on byoc.enabled, the single switch for shipping
       telemetry off-cluster: metrics to Thanos (the metrics collectors above) and
       logs to Datadog (here). The site and api-key Secret are plain config,
       consumed only when byoc is on. `dig` for the --reuse-values path: an install
       predating these keys has an otel map with no `datadog`/`byoc`, and a direct
       reference nil-pointers the render. $ddTags carries the same fleet identity
       the metrics collectors stamp, so a log and its metrics share one scope. */}}
{{- $ddSite := dig "datadog" "site" "us3.datadoghq.com" .Values.otel }}
{{- $ddSecretName := dig "datadog" "apiKeySecret" "name" "datadog-api" .Values.otel }}
{{- $ddSecretKey := dig "datadog" "apiKeySecret" "key" "api-key" .Values.otel }}
{{- $ddTags := list }}
{{- if $envID }}{{ $ddTags = append $ddTags (printf "env:%s" $envID) }}{{ end }}
{{- if $acctID }}{{ $ddTags = append $ddTags (printf "account:%s" $acctID) }}{{ end }}
{{- $ddTagsStr := $ddTags | join "," }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ $fullName }}-logs
  labels:
    {{- include "yb-amp-controller.labels" . | nindent 4 }}
spec:
  # Container logs are node-local files, so this one collects per node rather
  # than scraping over the network like the metrics pair.
  mode: daemonset
  serviceAccount: {{ $saName }}
  # Both hostPaths below are root-owned: the operator otherwise runs the
  # collector under a non-root uid that cannot write the checkpoint dir
  # ("permission denied" on receiver_filelog_, which fails the whole pipeline)
  # and cannot read every container log. Running the log tailer as root is what
  # promtail, fluent-bit and the upstream collector's logsCollection preset do.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  {{- with .Values.otel.image }}
  image: {{ . }}
  {{- end }}
  {{- with .Values.otel.logsTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  env:
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    {{- if $byocEnabled }}
    # secretKeyRef, not inline, keeps the key out of the rendered CR. Required, not
    # optional: the datadog exporter fails startup validation on an empty key and
    # takes the whole daemonset — VictoriaLogs export included — down with it, so
    # the datadog-api Secret must exist before a byoc-enabled install.
    - name: DD_API_KEY
      valueFrom:
        secretKeyRef:
          name: {{ $ddSecretName | quote }}
          key: {{ $ddSecretKey | quote }}
    {{- end }}
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    # Read offsets survive a collector restart, so a rescheduled pod neither
    # replays nor skips what it already shipped. Namespace-keyed because the dir
    # is node-shared and bbolt takes an exclusive lock: two releases on one
    # cluster otherwise crash-loop whichever collector opens it second (#889).
    - name: checkpoints
      hostPath:
        path: /var/lib/otelcol/{{ $ns }}-{{ $fullName }}-logs
        type: DirectoryOrCreate
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: checkpoints
      mountPath: /var/lib/otelcol
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/checkpoints:
        directory: /var/lib/otelcol
    receivers:
      filelog:
        # Scoped to this namespace: the daemonset can see every pod on the node,
        # and shipping the node's other tenants is both a volume and a privacy
        # problem.
        include: [/var/log/pods/{{ $ns }}_*/*/*.log]
        # Without this the collector's own stdout feeds back into its pipeline.
        exclude: [/var/log/pods/{{ $ns }}_{{ $fullName }}-*-collector-*/*/*.log]
        include_file_path: true
        # Not `end`: an endpoint pod that dies during startup is exactly the case
        # these logs exist to explain, and the checkpoint prevents replay.
        start_at: beginning
        storage: file_storage/checkpoints
        retry_on_failure:
          enabled: true
        operators:
          # Strips the CRI/containerd (or docker) envelope, reassembles lines
          # the runtime split at 16 KiB, and lifts k8s.{namespace,pod,container}
          # off the file path.
          - type: container
            id: container-parser
            add_metadata_from_filepath: true
    processors:
      # First in the pipeline: a log storm from one pod must not OOM the node's
      # collector.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Pod uid, workload identity and the amp labels the file path can't carry.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          # Namespace-scoped to match the Role above — without this the processor
          # lists pods cluster-wide and the chart would need a ClusterRole.
          namespace: {{ $ns }}
          # A daemonset pod only ever reads its own node; unfiltered, each replica
          # would watch every pod in the cluster.
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.node.name
          labels:
            # `endpoint` matches the label the metrics collectors relabel onto
            # every per-endpoint series, so a log line and its metrics join.
            - {tag_name: endpoint, key: app.kubernetes.io/instance, from: pod}
            - {tag_name: component, key: app.kubernetes.io/component, from: pod}
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
          - sources: [{from: resource_attribute, name: k8s.namespace.name}, {from: resource_attribute, name: k8s.pod.name}]
      {{- if $byocEnabled }}
      # Datadog shaping runs after k8sattributes (it reads the container name and
      # `component` label that processor attaches) and before batch. Both are
      # best-effort (error_mode: ignore): a line that doesn't match ships unshaped
      # rather than dropping, and is skipped entirely when byoc (hence the datadog
      # exporter) is off.
      transform/severity:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # Lift the app's level word out of the structured line, then map it
              # onto Datadog's status vocabulary. Rust `tracing` and the Go slog
              # controller both emit "level":"WORD" in JSON; a text-format line
              # simply won't match and keeps no status.
              - set(cache["lvl"], ExtractPatterns(body, "\"level\"\\s*:\\s*\"(?P<lvl>[A-Za-z]+)\"")["lvl"]) where IsMatch(body, "\"level\"\\s*:\\s*\"")
              - set(severity_text, "critical") where cache["lvl"] == "FATAL" or cache["lvl"] == "CRITICAL"
              - set(severity_text, "error") where cache["lvl"] == "ERROR" or cache["lvl"] == "SEVERE"
              - set(severity_text, "warn") where cache["lvl"] == "WARN" or cache["lvl"] == "WARNING"
              - set(severity_text, "info") where cache["lvl"] == "INFO"
              - set(severity_text, "debug") where cache["lvl"] == "DEBUG"
              - set(severity_text, "trace") where cache["lvl"] == "TRACE"
              # severity_number is the field Datadog actually reads for `status`.
              - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "critical"
              - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "error"
              - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "warn"
              - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "info"
              - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "debug"
              - set(severity_number, SEVERITY_NUMBER_TRACE) where severity_text == "trace"
      transform/datadog:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # ddsource drives Datadog's integration pipelines and facets; amp's
              # container name (endpoint/controller/mcp/ui/postgres-exporter) is the
              # natural source.
              - set(attributes["datadog.log.source"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil
              {{- if $ddTagsStr }}
              # Fleet identity as Datadog tags, mirroring the metrics collectors'
              # environment_id/account_id labels so a log and its metrics join.
              - set(attributes["ddtags"], {{ $ddTagsStr | quote }})
              {{- end }}
          - context: resource
            statements:
              # Datadog `service` = the amp component, falling back to the container.
              - set(attributes["service.name"], attributes["component"]) where attributes["service.name"] == nil and attributes["component"] != nil
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil
      {{- end }}
      batch: {}
    exporters:
      {{- if $logsEndpoint }}
      otlphttp/logs:
        logs_endpoint: {{ $logsEndpoint | quote }}
        tls:
          # Plaintext for in-cluster http:// stores; TLS for an https:// endpoint.
          insecure: {{ if hasPrefix "https://" $logsEndpoint }}false{{ else }}true{{ end }}
      {{- end }}
      {{- if $byocEnabled }}
      # Fan-out to Datadog IN ADDITION to VictoriaLogs. The api key comes from
      # ${env:DD_API_KEY} (secretKeyRef above). sending_queue + retry_on_failure
      # cap the blast radius of a Datadog outage: a failed POST is queued and
      # retried on this exporter alone, never backing up the otlphttp/logs exporter
      # that shares the pipeline. host_metadata is off — it is for host tiles, not
      # a logs-only forwarder.
      datadog:
        api:
          site: {{ $ddSite | quote }}
          key: ${env:DD_API_KEY}
        host_metadata:
          enabled: false
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          queue_size: 100
          num_consumers: 10
      {{- end }}
    service:
      extensions: [health_check, file_storage/checkpoints]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes{{ if $byocEnabled }}, transform/severity, transform/datadog{{ end }}, batch]
          exporters: [{{ $logsExporters | join ", " }}]
{{- end }}
{{- end }}
