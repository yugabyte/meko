apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yb-amp-controller.controllerName" . }}
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yb-amp-controller.controllerName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "yb-amp-controller.controllerImage" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.controller.ports.api }}
          env:
            - name: AMP_DATABASE_URL
              value: {{ .Values.controller.databaseUrl | quote }}
            {{- /* key defaults here as well as in values.yaml: --reuse-values replays
                   the old release's values, so a release predating this block that
                   sets only .name has no .key, and an empty secretKeyRef key is
                   rejected by the API server. */}}
            {{- with .Values.controller.ybPasswordSecret }}{{ if .name }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | default "password" | quote }}
            {{- end }}{{ end }}
            - name: AMP_DB_SCHEMA
              value: {{ .Values.controller.dbSchema | quote }}
            - name: AMP_LOG_FORMAT
              value: {{ .Values.controller.logFormat | quote }}
            # Endpoint deployer. This chart only ever runs on Kubernetes, so the
            # driver is fixed to the Kubernetes/Helm driver (not a value).
            - name: AMP_DEPLOY
              value: "true"
            - name: AMP_DEPLOY_DRIVER
              value: "kubernetes"
            - name: AMP_DEPLOY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- with .Values.controller.deployTimeout }}
            - name: AMP_DEPLOY_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            - name: AMP_ENDPOINT_IMAGE_REPO
              value: {{ include "yb-amp-controller.endpointImageRepo" . | quote }}
            - name: AMP_ENDPOINT_IMAGE_TAG
              value: {{ include "yb-amp-controller.endpointImageTag" . | quote }}
            {{- with .Values.imagePullSecrets }}
            - name: AMP_DEPLOY_PULL_SECRET
              value: {{ (first .).name | quote }}
            {{- end }}
            - name: AMP_DEPLOY_YB_HOST_PORTS
              value: {{ .Values.controller.endpoint.ybHostPorts | quote }}
            - name: AMP_DEPLOY_YB_USER
              value: {{ .Values.controller.endpoint.ybUser | quote }}
            - name: AMP_DEPLOY_YB_DBNAME
              value: {{ .Values.controller.endpoint.ybDbname | quote }}
            {{- with .Values.controller.ybPasswordSecret }}{{ if .name }}
            - name: AMP_DEPLOY_YB_EXISTING_SECRET
              value: {{ .name | quote }}
            - name: AMP_DEPLOY_YB_EXISTING_SECRET_KEY
              value: {{ .key | default "password" | quote }}
            {{- end }}{{ end }}
            {{- if .Values.controller.endpoint.ybTlsMode }}
            # Endpoints reach YB over TLS with a per-release client certificate
            # from this issuer, verified against this CA bundle.
            - name: AMP_DEPLOY_YB_TLS_MODE
              value: {{ .Values.controller.endpoint.ybTlsMode | quote }}
            - name: AMP_DEPLOY_YB_TLS_ISSUER_KIND
              value: {{ .Values.tls.issuerRef.kind | quote }}
            - name: AMP_DEPLOY_YB_TLS_ISSUER_NAME
              value: {{ .Values.tls.issuerRef.name | quote }}
            - name: AMP_DEPLOY_YB_TLS_ISSUER_GROUP
              value: {{ .Values.tls.issuerRef.group | default "cert-manager.io" | quote }}
            - name: AMP_DEPLOY_YB_TLS_CA_CONFIGMAP
              value: {{ .Values.tls.caBundleConfigMap | quote }}
            - name: AMP_DEPLOY_YB_TLS_CERT_DURATION
              value: {{ .Values.controller.endpoint.ybTlsCertDuration | quote }}
            - name: AMP_DEPLOY_YB_TLS_CERT_RENEW_BEFORE
              value: {{ .Values.controller.endpoint.ybTlsCertRenewBefore | quote }}
            {{- end }}
            {{- if .Values.controller.endpoint.computeTlsMode }}
            # Each compute presents a server certificate to its own clients, so
            # sslmode=verify-full against its published name works. Its issuer is
            # separate from the stack's internal one: a client-facing name usually
            # wants a public CA, an internal one never does.
            - name: AMP_DEPLOY_COMPUTE_TLS_MODE
              value: {{ .Values.controller.endpoint.computeTlsMode | quote }}
            - name: AMP_DEPLOY_COMPUTE_TLS_ISSUER_KIND
              value: {{ .Values.controller.endpoint.computeTlsIssuerRef.kind | quote }}
            - name: AMP_DEPLOY_COMPUTE_TLS_ISSUER_NAME
              value: {{ .Values.controller.endpoint.computeTlsIssuerRef.name | quote }}
            - name: AMP_DEPLOY_COMPUTE_TLS_ISSUER_GROUP
              value: {{ .Values.controller.endpoint.computeTlsIssuerRef.group | default "cert-manager.io" | quote }}
            - name: AMP_DEPLOY_COMPUTE_TLS_SECRET
              value: {{ .Values.controller.endpoint.computeTlsSecret | quote }}
            - name: AMP_DEPLOY_COMPUTE_TLS_CERT_DURATION
              value: {{ .Values.controller.endpoint.computeTlsCertDuration | quote }}
            - name: AMP_DEPLOY_COMPUTE_TLS_CERT_RENEW_BEFORE
              value: {{ .Values.controller.endpoint.computeTlsCertRenewBefore | quote }}
            - name: AMP_DEPLOY_COMPUTE_TLS_INCLUDE_SERVICE_DNS
              value: {{ .Values.controller.endpoint.computeTlsIncludeServiceDns | quote }}
            {{- end }}
            # The in-cluster URL endpoints use to reach this controller's storage-layer surface.
            - name: AMP_DEPLOY_CONTROLLER_URL
              value: {{ include "yb-amp-controller.endpointControllerUrl" . | quote }}
            # Endpoint Service exposure. ClusterIP (default) avoids a per-endpoint
            # cloud LB; LoadBalancer uses the annotations (e.g. internal-LB). The
            # controller parses the annotations as a "k=v,k=v" CSV.
            - name: AMP_DEPLOY_SERVICE_TYPE
              value: {{ .Values.controller.endpoint.service.type | quote }}
            - name: AMP_DEPLOY_SERVICE_ANNOTATIONS
              value: {{ join "," .Values.controller.endpoint.service.annotations | quote }}
            # Cloud for the per-endpoint nlb_* load-balancer annotations. Empty
            # falls back to detection from a node's spec.providerID, which needs
            # the cluster-scoped node read (rbac.nodeRead).
            #
            # Checked here because the controller validates this value at startup
            # and EXITS on a bad one — so an unchecked typo installs cleanly and
            # then CrashLoopBackOffs the whole control plane, not just nlb_*.
            {{- if not (has (.Values.controller.endpoint.cloud | default "") (list "" "aws" "gcp" "azure")) }}
            {{- fail (printf "controller.endpoint.cloud must be one of aws|gcp|azure (or empty to detect it), got %q" .Values.controller.endpoint.cloud) }}
            {{- end }}
            - name: AMP_DEPLOY_CLOUD
              value: {{ .Values.controller.endpoint.cloud | default "" | quote }}
            # Tailscale MagicDNS suffix (e.g. tail5955.ts.net) for deriving each
            # endpoint's tailnet address when its Service is tailnet-exposed;
            # empty disables tailnet address reporting.
            - name: AMP_DEPLOY_TAILNET_SUFFIX
              value: {{ .Values.controller.endpoint.tailnetSuffix | quote }}
            # Shared ingress. `enabled` is the off switch and the default, not the
            # zones: with it off the controller refuses the ingress_* connectivity
            # modes rather than deploying an endpoint into a deployment that has
            # no shards (controller/architecture/ac-ingress.md).
            #
            # No zone is required. A cluster with no external-dns (kind, CI) runs
            # ingress with neither set: names are allocated but unpublished, and
            # an endpoint's address is its shard's own host:port.
            - name: AMP_DEPLOY_INGRESS_ENABLED
              value: {{ .Values.controller.endpoint.ingress.enabled | quote }}
            # Optional, and separate from the switch above: with no zone the
            # names are allocated but not published, and an endpoint's address is
            # its shard's host:port. One zone per family so external-dns can be
            # pinned per zone and an internal name never reaches a public one.
            - name: AMP_DEPLOY_INGRESS_ZONE_INTERNAL
              value: {{ .Values.controller.endpoint.ingress.zoneInternal | quote }}
            - name: AMP_DEPLOY_INGRESS_ZONE_EXTERNAL
              value: {{ .Values.controller.endpoint.ingress.zoneExternal | quote }}
            - name: AMP_DEPLOY_INGRESS_PORT_RANGE
              value: {{ .Values.controller.endpoint.ingress.portRange | quote }}
            - name: AMP_DEPLOY_INGRESS_HEADROOM
              value: {{ .Values.controller.endpoint.ingress.headroom | quote }}
            - name: AMP_DEPLOY_INGRESS_MAX_SHARDS
              value: {{ .Values.controller.endpoint.ingress.maxShards | quote }}
            - name: AMP_DEPLOY_INGRESS_QUARANTINE
              value: {{ .Values.controller.endpoint.ingress.quarantine | quote }}
            - name: AMP_DEPLOY_INGRESS_PLACEMENT
              value: {{ .Values.controller.endpoint.ingress.placement | quote }}
            # Endpoint data volume: a PVC of this storage class (empty => emptyDir).
            - name: AMP_DEPLOY_STORAGE_CLASS
              value: {{ .Values.controller.endpoint.storageClass | quote }}
            - name: AMP_DEPLOY_DISK_SIZE
              value: {{ .Values.controller.endpoint.diskSize | quote }}
            # Flat /data size for every endpoint, whatever its CPU — bypasses the
            # per-vCPU ratio. Empty (the default) = CPU-proportional sizing.
            - name: AMP_DEPLOY_DISK_SIZE_OVERRIDE
              value: {{ .Values.controller.endpoint.diskSizeOverride | default "" | quote }}
            {{- /* Omitted when absent, not defaulted: --reuse-values on a release
                   predating the key would otherwise render 0 and turn prewarm off,
                   and `default` cannot tell that from an explicit 0. */}}
            {{- if hasKey .Values.controller.endpoint "lfcOffloadIntervalSeconds" }}
            - name: AMP_DEPLOY_LFC_OFFLOAD_INTERVAL_SECONDS
              value: {{ .Values.controller.endpoint.lfcOffloadIntervalSeconds | quote }}
            {{- end }}
            # Memory per endpoint vCPU: fills in the memory when a create names
            # only CPU, and is the floor every request is held to. 0 = the
            # built-in 8 GiB/vCPU.
            - name: AMP_DEPLOY_MEMORY_GIB_PER_VCPU
              value: {{ .Values.controller.endpoint.memoryGiBPerVCPU | default 0 | quote }}
            # Node labels endpoint pods must match (e.g. a local-NVMe-SSD ephemeral
            # pool). The controller parses this as a "k=v,k=v" CSV.
            - name: AMP_DEPLOY_NODE_SELECTOR
              value: {{ join "," (.Values.controller.endpoint.nodeSelector | default (list)) | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: {{ .Values.controller.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.controller.readinessProbe.periodSeconds }}
          # No liveness probe, deliberately (#398). The controller migrates its
          # schema BEFORE serving, so nothing answers /healthz during a slow
          # migration (an index backfill on an RF=3 backing runs for minutes) —
          # a liveness probe kills that work mid-DDL and leaves schema_migrations
          # dirty, wedging every later start. Readiness alone degrades safely: a
          # not-ready pod is out of traffic but never killed.
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.tls.enabled }}
          # Whole-directory mounts (no subPath) so a renewed certificate reaches
          # the pod; the DSN names the files by these paths.
          volumeMounts:
            - name: db-client-tls
              mountPath: /etc/amp/tls/client
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/amp/tls/ca
              readOnly: true
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: db-client-tls
          secret:
            secretName: {{ include "yb-amp-controller.controllerName" . }}-db-tls
            defaultMode: 0440
        - name: ca-bundle
          configMap:
            name: {{ .Values.tls.caBundleConfigMap }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
