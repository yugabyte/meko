{{- if .Values.ui.enabled }}
# In-cluster Service (always): reach the UI on the http port in-cluster or via
# `kubectl port-forward`.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yb-amp-controller.uiName" . }}
  labels:
    {{- include "yb-amp-controller.uiSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "yb-amp-controller.uiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
{{- if eq .Values.ui.service.type "nodeport" }}
---
# NodePort — the UI on its OWN Service (ui.service.type), independent of the
# controller's exposure. Auto-assigned nodePort.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yb-amp-controller.uiName" . }}-np
  labels:
    {{- include "yb-amp-controller.uiSelectorLabels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "yb-amp-controller.uiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
{{- else if or (eq .Values.ui.service.type "internal-lb") (eq .Values.ui.service.type "external-lb") }}
---
# LoadBalancer ({{ .Values.ui.service.type }}) — the UI's OWN LoadBalancer,
# independent of the controller's exposure. internal-lb carries
# ui.service.annotations (private VPC IP); external-lb gets a public IP.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yb-amp-controller.uiName" . }}-lb
  labels:
    {{- include "yb-amp-controller.uiSelectorLabels" . | nindent 4 }}
  {{- if and (eq .Values.ui.service.type "internal-lb") .Values.ui.service.annotations }}
  annotations:
    {{- include "yb-amp-controller.kvAnnotations" (dict "items" .Values.ui.service.annotations) | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  selector:
    {{- include "yb-amp-controller.uiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
{{- end }}
{{- end }}
