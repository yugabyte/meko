apiVersion: v2
name: yb-amp-controller
description: >-
  The amp controller (cAmp control plane + its managed controller) and
  its MCP server, deployed together. The controller drives endpoint workloads
  via the Kubernetes/Helm driver and exposes a REST API; the MCP server is a
  thin, stateless wrapper of that API for AI agents. Backed by an external
  YugabyteDB.
type: application
# cert-manager is NOT a subchart here. It issues the controller's client
# certificate and every endpoint's, but `deploy/tls/trust-root.sh` installs it
# (and trust-manager, and the issuer) for every deploy that needs it. Declaring
# it as a dependency would make `helm dependency build` a hard precondition for
# every consumer of this chart even with the condition false — including ones
# that only ever paste a `helm upgrade` line. The preflight in
# templates/cert-manager-preflight.yaml is what turns a missing cert-manager
# into a legible error instead.
# Chart version — bump on chart changes.
version: 0.260714.5
# Tracks the amp controller app; image tags fall back to this when neither the
# per-image tag nor imageTag is set.
appVersion: "0.260714.0"
keywords:
  - amp
  - yb-amp
  - controller
  - mcp
  - yugabytedb
home: https://github.com/yugabyte/amp
sources:
  - https://github.com/yugabyte/amp
maintainers:
  - name: yb-amp
