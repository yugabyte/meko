{{- if and .Values.proxyProtocol.enabled (not .Values.proxyProtocol.trustedIPs) }}
{{- fail "proxyProtocol.enabled needs proxyProtocol.trustedIPs — the load balancer's range and nothing wider. Empty would trust every peer's claimed client address, and a per-endpoint allowlist would then match whatever a caller asserts" }}
{{- end }}
{{- $gw := int .Values.documentdbGateway.port }}
{{- if and (ge $gw (int .Values.ports.lo)) (le $gw (int .Values.ports.hi)) }}
{{- fail (printf "documentdbGateway.port %d lies inside ports %d-%d: an endpoint allocated that port would share its listener with every endpoint's documentdb gateway" $gw (int .Values.ports.lo) (int .Values.ports.hi)) }}
{{- end }}
{{- $ports := include "yb-amp-ingress.ports" . | fromJsonArray }}
{{- /*
Traefik rendered directly rather than through its chart as a subchart: the
entryPoint set is a templated RANGE, and subchart values cannot be templated.
Doing it here also means the entryPoint names come out of one definition, so they
match what the controller renders on each endpoint's route (deploy.EntryPointName).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yb-amp-ingress.fullname" . }}
  labels:
    {{- include "yb-amp-ingress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.traefik.deployment.replicas }}
  {{- /*
  Surge before terminating: the default 25% maxUnavailable would drop the shard
  to one replica mid-update, which is the case that saturates a replica's CPU
  limit and takes p99 with it. maxSurge 1 keeps capacity whole throughout.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "yb-amp-ingress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yb-amp-ingress.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "yb-amp-ingress.fullname" . }}
      {{- /* Matches the proxy's own drain window; see graceTimeOut below. */}}
      terminationGracePeriodSeconds: {{ add .Values.traefik.drainTimeoutSeconds 10 }}
      {{- /*
      Spread across zones so losing one does not take the shard's endpoints with
      it. ScheduleAnyway rather than DoNotSchedule: a shard that will not schedule
      is worse than one briefly unbalanced.
      */}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "yb-amp-ingress.selectorLabels" . | nindent 14 }}
      {{- /*
      The Traefik image is the one thing in this chart pulled from a public
      registry, so an operator who mirrors it into the ECR the rest of the stack
      uses needs somewhere to say so — every other amp chart takes this and the
      deploy scripts pass it on every install. Without it the only option is an
      anonymous Docker Hub pull, rate-limited, for a proxy that sits in the
      connection path of every endpoint on the shard.
      */}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: traefik
          image: "{{ .Values.traefik.image.repository }}:{{ .Values.traefik.image.tag }}"
          imagePullPolicy: {{ .Values.traefik.image.pullPolicy }}
          args:
            - --entryPoints.traefik.address=:9000
            - --ping=true
            - --ping.entryPoint=traefik
            - --providers.kubernetescrd=true
            - --providers.kubernetescrd.namespaces={{ .Release.Namespace }}
            - --providers.kubernetescrd.allowCrossNamespace=false
            {{- /*
            The provider builds an informer per watched type and fails its cache
            sync if any one of them cannot list — and a Node informer is among
            them, which a namespaced Role can never satisfy. The sync failing
            means NO configuration is ever published: the proxy comes up healthy,
            listens on all its ports, answers the load balancer's health check,
            and routes nothing. Off is safe here because what it disables is
            IngressClasses and NodePortLB, neither of which this design uses.
            */}}
            - --providers.kubernetescrd.disableClusterScopeResources=true
            {{- /*
            Scoped to THIS shard's routes, and load-bearing rather than tidy.
            Endpoint releases and every shard live in one namespace (the route is
            rendered into the endpoint's release, and allowCrossNamespace is
            false), and every shard is built from the same --deploy-ingress-port-
            range — so pgin-0 and pgin-0-ext both declare pg-20000..pg-20048.
            Without this selector each shard's proxy would program EVERY
            endpoint's route: an ingress_internal endpoint would answer on the
            external shard's internet-facing load balancer, and two endpoints
            allocated the same port on different shards would shadow each other,
            one client reaching the other's database. That is the failure
            ingress_allocations_slot_live is unique per (shard, port) to prevent,
            and it only holds if the data plane can tell shards apart.
            */}}
            - --providers.kubernetescrd.labelSelector=amp.yugabyte.com/ingress-shard={{ .Values.shardName }}
            {{- /*
            How long a draining proxy keeps established connections before
            cutting them. Traefik's default is 10s, which is an HTTP request's
            lifetime — a Postgres session is hours, so every rolling update
            severs the draining replica's sessions ten seconds in. There is no
            value that never cuts a session: this only buys clients time to
            finish and reconnect, and the kubelet kills the pod at
            terminationGracePeriodSeconds regardless, which is why the two are
            set from the same value.
            */}}
            {{- range $p := $ports }}
            - --entryPoints.pg-{{ $p }}.transport.lifeCycle.graceTimeOut={{ $.Values.traefik.drainTimeoutSeconds }}s
            {{- end }}
            - --entryPoints.documentdb.transport.lifeCycle.graceTimeOut={{ .Values.traefik.drainTimeoutSeconds }}s
            - --log.level={{ .Values.traefik.logLevel }}
            {{- range $p := $ports }}
            - --entryPoints.pg-{{ $p }}.address=:{{ $p }}
            {{- if $.Values.proxyProtocol.enabled }}
            {{- /*
            Without this Traefik sees the load balancer as the client, and every
            per-endpoint allowlist matches the wrong address. trustedIPs is the
            load balancer's range and nothing wider: a trusted peer may claim to
            be any client it likes.
            */}}
            - --entryPoints.pg-{{ $p }}.proxyProtocol.trustedIPs={{ join "," $.Values.proxyProtocol.trustedIPs }}
            {{- end }}
            {{- end }}
            {{- /*
            The documentdb gateway's entryPoint, shared by every endpoint on the
            shard: each endpoint's route matches its own name by SNI. The load
            balancer sends PROXY protocol on every port, so this one trusts it too.
            The name is deploy.DocumentDBEntryPoint on the controller side.
            */}}
            - --entryPoints.documentdb.address=:{{ .Values.documentdbGateway.port }}
            {{- if .Values.proxyProtocol.enabled }}
            - --entryPoints.documentdb.proxyProtocol.trustedIPs={{ join "," .Values.proxyProtocol.trustedIPs }}
            {{- end }}
          env:
            {{- /*
            The Go runtime sizes its scheduler from the NODE's CPU count, not the
            cgroup quota, so on a 4- or 8-core node a 1-CPU container runs 4-8
            Ps against one CPU's worth of quota. Every P stalls together at the
            period boundary, which shows up as tail latency rather than reduced
            throughput. Measured on one saturated replica: p99 13-35ms with the
            default, ~2.4ms with this set, at 15-19% higher throughput and the
            same limit.

            resourceFieldRef rounds a CPU limit UP to the nearest integer, so a
            fractional limit still yields at least 1.
            */}}
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: traefik
                  resource: limits.cpu
                  divisor: "1"
          ports:
            - name: traefik
              containerPort: 9000
            {{- range $p := $ports }}
            - name: pg-{{ $p }}
              containerPort: {{ $p }}
              protocol: TCP
            {{- end }}
            - name: documentdb
              containerPort: {{ .Values.documentdbGateway.port }}
              protocol: TCP
          readinessProbe:
            httpGet: { path: /ping, port: 9000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- /*
          Deliberately tolerant. /ping answers OK whenever the process is alive
          and says nothing about whether the provider ever published a
          configuration — the state this shard was actually broken in — so
          liveness cannot detect the failure that matters, while a restart drops
          every session on the replica. Kept only to recover a wedged process,
          at a threshold that will not fire on a GC pause or a CPU-starved
          moment.
          */}}
          livenessProbe:
            httpGet: { path: /ping, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.traefik.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
