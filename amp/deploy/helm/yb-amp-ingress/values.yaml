# Values for one ingress shard (controller/architecture/ac-ingress.md).

# -- Shard name. Must match the ingress_shards row the controller registers and
# the `shard` each endpoint's route is rendered with — it is how the two halves
# find each other.
shardName: pgin-0

# -- Which exposure this shard provides: "internal" (reachable from the
# surrounding network) or "external" (internet-facing). A property of the load
# balancer, which is why it belongs to the shard rather than to an endpoint: it
# is what stops an internal endpoint ever landing on a public address.
family: internal

# -- Which cloud's load-balancer annotations to render: aws, gcp or azure.
# REQUIRED, for both families. Internal without it defaults to internet-facing
# and publishes what was meant to stay private; external without it gets a
# classic load balancer on AWS rather than the NLB this design needs for TCP
# passthrough and PROXY protocol. A shard is shared, so either mistake is made
# once and paid for by every endpoint on it.
cloud: ""

ports:
  # -- The listener range this shard serves, provisioned in FULL at install.
  # Provisioned once so that creating an endpoint never mutates a load balancer
  # that live connections are sitting behind — an endpoint create only adds a
  # route inside the cluster. Its width is how many endpoints one shard holds.
  #
  # 49 wide, not 50: the documentdb gateway takes one more listener, and an AWS
  # Network Load Balancer holds 50. The chart refuses more on aws.
  lo: 20000
  hi: 20048

# -- The documentdb gateway's listener. ONE port for every endpoint on the shard,
# unlike Postgres's one per endpoint: a MongoDB driver opens TLS on its first byte
# and sends SNI, so each endpoint's route matches its own published name and the
# session is passed through untouched. Must equal the gateway's own port, because
# the API reports an endpoint's documentdb_address as its name on that port, and
# must lie outside `ports`.
documentdbGateway:
  port: 10260

# -- CIDRs allowed to reach the shard's load balancer. A coarse outer gate only:
# it is per-Service and a shard is shared, so per-endpoint filtering is done by
# the middleware in each endpoint's own release. Set this to the union the shard
# should ever serve (a VPC, say) and let the middleware do the rest.
allowedCidrs: []

# -- Trust PROXY protocol on every Postgres entryPoint. Needed behind a cloud
# load balancer that preserves the client address that way: without it Traefik
# sees the load balancer as the client and every per-endpoint allowlist matches
# the wrong thing. The load balancer must be configured to send it.
proxyProtocol:
  enabled: false
  # -- Who may assert a client address. REQUIRED when proxyProtocol.enabled, and
  # it must be the load balancer's own range and nothing wider: a trusted peer
  # may claim to be any client it likes, so anything in this list can walk
  # straight past every per-endpoint allowlist on the shard.
  #
  # Deliberately empty rather than defaulted to the cluster CIDR. A default like
  # 10.0.0.0/8 covers the pods and nodes themselves, which would make any
  # in-cluster peer able to forge a client address — the exact bypass the
  # allowlists exist to stop, shipped on by default.
  trustedIPs: []

# -- The shard Service's externalTrafficPolicy: Cluster or Local. Cluster lets a
# node forward to a proxy on another node, SNATing the client to a node address,
# so every per-endpoint allowlist matches the node instead of the client. Local
# keeps the client address on GCP and Azure, whose passthrough load balancers
# cannot send PROXY protocol, at the cost of the load balancer reaching only
# nodes that run a proxy replica. On AWS the shard uses IP targets, which bypass
# kube-proxy, so this has no effect there and proxyProtocol is the fix.
externalTrafficPolicy: Cluster

# -- Pull secrets for the Traefik image, as every other amp chart takes. Needed
# when it is mirrored into a private registry — which is the normal case here,
# since this is the only public-registry image in amp/deploy and an anonymous
# Docker Hub pull is rate-limited.
imagePullSecrets: []

traefik:
  image:
    repository: docker.io/traefik
    # -- Pinned: the proxy is in the connection path of every endpoint on the
    # shard, so the version it runs is not something to inherit from a tag that
    # moves underneath us.
    #
    # The matching CRDs ship in the CONTROLLER chart's crds/, copied from
    # traefik-helm-chart v37.1.2 — its own CHART version series, not this image's
    # — so bumping this tag means refreshing them from the chart tag that ships
    # this proxy version.
    tag: "v3.7.13"
    pullPolicy: IfNotPresent
  deployment:
    # -- Two by default so a rollout or a node loss does not take the shard's
    # endpoints with it. This is the blast radius consolidation buys us, and the
    # floor it should not go below.
    #
    # Two is also what keeps a replica off its CPU limit: measured at 16
    # connections, the pair serves ~19k tps between them, while a single replica
    # carrying the same load saturates and its p99 goes to ~13ms. A rolling
    # update produces exactly that single-replica case, which is what
    # maxUnavailable: 0 below is for.
    replicas: 2
  # -- How long a draining proxy keeps established connections before cutting
  # them, and (plus a margin) the pod's terminationGracePeriodSeconds. Traefik's
  # own default is 10s, which is sized for an HTTP request; a Postgres session
  # is not. Nothing here can avoid cutting a session eventually — this buys
  # clients a window to finish and reconnect, at the cost of making a rolling
  # update take at least this long per replica.
  drainTimeoutSeconds: 300
  logLevel: INFO
  # -- Request == limit, so the proxy is Guaranteed-QoS and cannot be evicted
  # under node pressure while it is carrying customer connections.
  #
  # The memory figure is measured: ~70 MiB per replica at 200 routes
  # (amp/test/ingress-bakeoff), so 256Mi is roughly 3x headroom.
  #
  # The CPU is measured too, and the floor matters more than the number. At 200m
  # — the earlier unmeasured guess — pgbench at 16 connections through one
  # endpoint pinned both replicas at their limit and the shard delivered 4.3k
  # tps at 3.7ms, against 21k tps at 0.76ms straight to the pod: a fifth of the
  # throughput, for the whole shard and every endpoint on it. The cliff is the
  # limit, not the proxy. Unthrottled, the replicas draw 0.34-0.58 CPU each at
  # that load and land within ~15% of talking to the pod directly, so 1 covers it
  # with headroom.
  #
  # That load was ONE endpoint's client, on a shard built to hold 50. It sets a
  # floor, not a ceiling: a shard carrying many busy endpoints wants more, and
  # request == limit means whatever is set here is reserved on the node.
  resources:
    requests:
      cpu: "1"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 256Mi
