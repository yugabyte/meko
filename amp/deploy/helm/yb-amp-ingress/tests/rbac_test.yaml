suite: shard RBAC
templates:
  - templates/rbac.yaml
tests:
  # Namespaced, deliberately. A ClusterRole here would let every shard read
  # Secrets across the whole cluster rather than in its own namespace, which is
  # already more than this design wants (see the Secrets test below). Pinned
  # because the upstream Traefik chart ships cluster-scoped RBAC by default, so
  # this is the kind of thing a later "align with upstream" quietly undoes — and
  # staying namespaced is what makes the deployment's
  # disableClusterScopeResources flag load-bearing rather than cosmetic.
  - it: grants namespaced RBAC only, never cluster-scoped
    set:
      cloud: aws
    asserts:
      - hasDocuments:
          count: 3
      - notFailedTemplate: {}
  - it: the Role is a Role
    documentIndex: 1
    set:
      cloud: aws
    asserts:
      - isKind:
          of: Role
      - equal:
          path: apiVersion
          value: rbac.authorization.k8s.io/v1
  - it: the binding is a RoleBinding pointing at a Role
    documentIndex: 2
    set:
      cloud: aws
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.kind
          value: Role
  # Secrets and ConfigMaps, though nothing in this design reads either: TLS is
  # passed through to the pod rather than terminated here. Traefik's CRD provider
  # builds an informer for both unconditionally and fails its whole cache sync if
  # either cannot list — and a provider that has not synced publishes no
  # configuration, so the shard serves NO routes while looking healthy. Pinned
  # because removing the grant on the reasoning that nothing uses it is exactly
  # the change that would silently break every endpoint on the shard.
  - it: grants Secrets and ConfigMaps, which the provider watches whether or not we use them
    documentIndex: 1
    set:
      cloud: aws
    asserts:
      - contains:
          path: rules[1].resources
          content: secrets
      - contains:
          path: rules[1].resources
          content: configmaps
  # Read-only. The proxy discovers routes; nothing about serving traffic needs
  # to create or mutate anything, and a write verb here would let a compromised
  # proxy rewrite the routes that decide which database a client reaches.
  - it: is read-only on every resource it can reach
    documentIndex: 1
    set:
      cloud: aws
    asserts:
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]
      - equal:
          path: rules[1].verbs
          value: [get, list, watch]
      - equal:
          path: rules[2].verbs
          value: [get, list, watch]
      - equal:
          path: rules[3].verbs
          value: [get, list, watch]
