suite: shard proxy deployment
templates:
  - templates/deployment.yaml
tests:
  # The entryPoint names are the join between this release and every endpoint
  # route that lands on it — the controller spells the same name from
  # deploy.EntryPointName. A route naming one that does not exist is accepted by
  # Traefik and then silently serves nothing, so the spelling is pinned here.
  - it: declares one entryPoint per port in the range
    set:
      cloud: aws
      ports.lo: 20000
      ports.hi: 20002
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.pg-20000.address=:20000
      - contains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.pg-20002.address=:20002

  # The Go runtime reads the NODE's CPU count, not the cgroup quota, so without
  # this a 1-CPU container on a 4-core node runs 4 Ps against one CPU of quota
  # and stalls them together at each period boundary. Measured on a saturated
  # replica: p99 13-35ms without, ~2.4ms with.
  - it: sizes the Go scheduler from the CPU limit, not the node
    set:
      cloud: aws
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: GOMAXPROCS
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.resourceFieldRef.resource
          value: limits.cpu

  # A Postgres session outlives an HTTP request by hours, and Traefik's default
  # graceTimeOut is 10s. The pod's own grace period has to exceed the proxy's or
  # the kubelet kills it mid-drain, which is the thing the drain exists to avoid.
  - it: drains for longer than an HTTP request, and outlives the proxy's own window
    set:
      cloud: aws
      traefik.drainTimeoutSeconds: 300
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.pg-20000.transport.lifeCycle.graceTimeOut=300s
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 310

  # A rollout that drops the shard to one replica puts that replica on its CPU
  # limit; surging keeps capacity whole.
  - it: never rolls down to a single replica
    set:
      cloud: aws
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0

  # Guaranteed QoS: equal request and limit is what stops the kubelet evicting a
  # proxy that is carrying customer connections under node pressure. The CPU
  # figure itself is sized in values.yaml against a measurement; what is pinned
  # here is that the two stay equal, since raising only the limit silently drops
  # the pod to Burstable.
  - it: reserves CPU and memory equally, so the proxy is Guaranteed QoS
    set:
      cloud: aws
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  # The provider fails its cache sync if any watched type cannot be listed, and
  # it watches Nodes — a cluster-scoped resource the namespaced Role in
  # rbac.yaml can never cover. A failed sync publishes no configuration at all,
  # so the proxy listens on every port and routes nothing while its probes pass.
  # Pinned here because that failure is invisible from the outside: the port
  # accepts the connection either way.
  - it: disables cluster-scoped lookups, which a namespaced Role cannot satisfy
    set:
      cloud: aws
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --providers.kubernetescrd.disableClusterScopeResources=true

  # The selector is what stops this shard programming another shard's routes.
  # Without it an ingress_internal endpoint would also be served by the external
  # shard's internet-facing load balancer, and two endpoints allocated the same
  # port on different shards would shadow each other.
  - it: watches only its own shard's routes
    set:
      cloud: aws
      shardName: pgin-0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --providers.kubernetescrd.labelSelector=amp.yugabyte.com/ingress-shard=pgin-0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --providers.kubernetescrd.allowCrossNamespace=false

  - it: a second shard selects its own name, not the first one's
    set:
      cloud: aws
      shardName: pgin-0-ext
      family: external
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --providers.kubernetescrd.labelSelector=amp.yugabyte.com/ingress-shard=pgin-0-ext

  # PROXY protocol with no trusted range would let any peer assert a client
  # address and walk past every per-endpoint allowlist on the shard.
  - it: refuses PROXY protocol with no trusted range
    set:
      cloud: aws
      proxyProtocol.enabled: true
      proxyProtocol.trustedIPs: []
    asserts:
      - failedTemplate:
          errorMessage: proxyProtocol.enabled needs proxyProtocol.trustedIPs — the load balancer's range and nothing wider. Empty would trust every peer's claimed client address, and a per-endpoint allowlist would then match whatever a caller asserts

  - it: trusts only the range it is given
    set:
      cloud: aws
      proxyProtocol.enabled: true
      proxyProtocol.trustedIPs: [10.1.2.0/24]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.pg-20000.proxyProtocol.trustedIPs=10.1.2.0/24

  - it: renders no proxyProtocol args when it is off
    set:
      cloud: aws
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.pg-20000.proxyProtocol.trustedIPs=

  # --- the documentdb gateway entryPoint --------------------------------------
  # Its name is the join with every endpoint's gateway route, spelled on the
  # controller side as deploy.DocumentDBEntryPoint.
  - it: declares one shared documentdb entryPoint on the gateway port
    set:
      cloud: aws
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.documentdb.address=:10260
      - contains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.documentdb.transport.lifeCycle.graceTimeOut=300s
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: documentdb
            containerPort: 10260
            protocol: TCP

  # The load balancer sends PROXY protocol on every port once it is on, so a
  # gateway entryPoint that did not expect it would read the header as TLS.
  - it: trusts PROXY protocol on the gateway entryPoint too
    set:
      cloud: aws
      proxyProtocol.enabled: true
      proxyProtocol.trustedIPs: [10.1.2.0/24]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --entryPoints.documentdb.proxyProtocol.trustedIPs=10.1.2.0/24

  - it: refuses a gateway port inside the Postgres range
    set:
      cloud: aws
      ports.lo: 10250
      ports.hi: 10299
    asserts:
      - failedTemplate:
          errorMessage: "documentdbGateway.port 10260 lies inside ports 10250-10299: an endpoint allocated that port would share its listener with every endpoint's documentdb gateway"
