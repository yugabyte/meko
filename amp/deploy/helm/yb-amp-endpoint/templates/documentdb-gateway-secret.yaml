{{- if eq (include "yb-amp-endpoint.documentdbGatewayEnabled" .) "true" }}
# The gateway reads its backend URL from a file (DOCUMENTDB_PG_URL_FILE), not an
# environment variable, so it is mounted rather than injected. A Secret rather
# than a ConfigMap because the same key is where a password would go if the
# loopback path ever stops being trust-auth — the value here carries none.
#
# localhost, not the Service: the gateway is a sidecar in the compute's own pod,
# so it reaches Postgres over the shared loopback the way postgres_exporter does.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}-documentdb-gateway
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
type: Opaque
stringData:
  pg-url: "postgresql://{{ .Values.documentdbGateway.user }}@localhost:{{ .Values.endpoint.computePort }}/{{ .Values.documentdbGateway.dbname }}?sslmode=disable"
{{- end }}
