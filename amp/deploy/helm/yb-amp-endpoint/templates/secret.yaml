{{- /*
The chart-managed Secret. It carries the YB password (inline only — an
`existingSecret` is read in place instead) and the compute's default-user
password, so it renders when either is set.
*/}}
{{- $ybInline := and .Values.yugabyte.password (not .Values.yugabyte.existingSecret) }}
{{- if or $ybInline .Values.endpoint.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ybInline }}
  password: {{ .Values.yugabyte.password | quote }}
  {{- end }}
  {{- if .Values.endpoint.password }}
  # The compute's default user's password, as pg_authid stores it. See
  # endpoint.password in values.yaml for why this is a verifier, not a plaintext.
  computePassword: {{ .Values.endpoint.password | quote }}
  {{- end }}
{{- end }}
