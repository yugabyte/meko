{{- if and .Values.yugabyte.password (not .Values.yugabyte.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.yugabyte.password | quote }}
{{- end }}
