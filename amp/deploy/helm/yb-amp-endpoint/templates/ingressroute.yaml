{{- if or (eq .Values.service.connectivity "ingress_internal") (eq .Values.service.connectivity "ingress_external") }}
{{- /*
This endpoint's place on a SHARED ingress shard — one load balancer and a Traefik
deployment fronting many endpoints — instead of a load balancer of its own
(controller/architecture/ac-ingress.md).

Up to four objects, all in THIS endpoint's release: the route, the documentdb
gateway's route, their allowlist middleware, and the DNS record. That is the property the whole design leans on —
retiring the endpoint is still one `helm uninstall` and nothing is orphaned
behind it, exactly as for the ClusterIP and nlb_* modes.

The route and its middleware are unconditional; the gateway route and the DNS
record appear only where the deployment has a zone to publish in — without one
(kind, CI, anywhere with no external-dns) the endpoint is addressed by its
shard's host and port, which is where it answers regardless.

The controller allocates the shard and port before the deploy and passes them in;
nothing here chooses either, because two endpoints choosing the same port is a
connection reaching another customer's database.
*/}}
{{- $ing := required "service.ingress is required for the ingress_* connectivity modes" .Values.service.ingress }}
{{- if not $ing.shard }}{{ fail "service.ingress.shard is empty: the controller allocates it, so an empty value means the endpoint was rendered without a slot and would not be routable" }}{{ end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
    {{- /*
    The shard this endpoint was allocated on. Its proxy selects on exactly this
    label, so the route is served by that shard and no other — without it every
    shard in the namespace programs every route, and an internal endpoint ends up
    answering on the external shard's public load balancer.
    */}}
    amp.yugabyte.com/ingress-shard: {{ $ing.shard }}
spec:
  {{- /*
  The entryPoint is this endpoint's own port on the shard, declared by the shard's
  release. A route naming one that does not exist is accepted and then never
  serves, so both spellings come from deploy.EntryPointName rather than being
  written twice.
  */}}
  entryPoints:
    - {{ $ing.entryPoint }}
  routes:
    {{- /*
    HostSNI(`*`) and no `tls` block: a non-TLS TCP router in Traefik may only
    match the wildcard, because here the PORT is the discriminator. That is also
    what keeps TLS end-to-end — Traefik forwards bytes and never terminates, so
    nothing in the path can read the session.
    */}}
    - match: HostSNI(`*`)
      services:
        - name: {{ include "yb-amp-endpoint.fullname" . }}
          port: {{ .Values.endpoint.computePort }}
      middlewares:
        - name: {{ include "yb-amp-endpoint.fullname" $ }}-allow
{{- /*
The documentdb gateway's route. Unlike Postgres it needs no port of its own: a
MongoDB driver opens TLS on its first byte and sends SNI, so every endpoint on the
shard shares one gateway entryPoint and the published NAME is the discriminator.
Traefik reads the ClientHello and passes the session through, still never
terminating it.

Hence only for a published name. Without one the client connects to the shard's
own host, which every endpoint on the shard shares, so there is nothing to route
on and the API reports no documentdb_address.
*/}}
{{- if and $ing.dnsName (eq (include "yb-amp-endpoint.documentdbGatewayEnabled" .) "true") }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}-documentdb
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
    amp.yugabyte.com/ingress-shard: {{ $ing.shard }}
spec:
  entryPoints:
    - {{ required "service.ingress.documentdbEntryPoint is required to route the documentdb gateway" $ing.documentdbEntryPoint }}
  routes:
    - match: HostSNI(`{{ $ing.dnsName }}`)
      services:
        - name: {{ include "yb-amp-endpoint.fullname" . }}
          port: {{ .Values.documentdbGateway.port }}
      middlewares:
        - name: {{ include "yb-amp-endpoint.fullname" $ }}-allow
  tls:
    passthrough: true
{{- end }}
---
{{- /*
Per-endpoint source filtering. loadBalancerSourceRanges cannot do this once the
load balancer is shared — it is a per-Service field and a shard has one Service —
so the allowlist moves into a middleware bound to this endpoint's routes alone.
It filters on the address Traefik sees, which is the client's only on a shard
installed to keep it (PROXY protocol on AWS, externalTrafficPolicy: Local on GCP
and Azure); the controller refuses allowed_cidrs here unless the deployment says
its shards do.

Rendered for every ingress endpoint, unrestricted ones included, so that changing
the list later is a patch to this one object (deploy.UpdateIngressAllowlist)
rather than objects created and deleted outside the release. Traefik refuses an
empty ipAllowList, so "everyone" is spelled out.
*/}}
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: {{ include "yb-amp-endpoint.fullname" $ }}-allow
  labels:
    {{- include "yb-amp-endpoint.labels" $ | nindent 4 }}
    {{- /* Selected by the same per-shard selector as the route above; without
    this label the shard's proxy cannot see the middleware its own route names. */}}
    amp.yugabyte.com/ingress-shard: {{ $ing.shard }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml (.Values.service.allowedCidrs | default (list "0.0.0.0/0" "::/0")) | nindent 6 }}
{{- /*
Rendered only for a name that can actually be published. The controller passes
an empty dnsName for one minted where its family had no zone (an unqualified
`ep-xxxxxxxx`), on a create and on a redeploy alike — publishability is read from
the stored name's shape, not decided by the caller. A record for an unqualified
name would be one external-dns cannot place in the zone it is pinned to.
*/}}
{{- if $ing.dnsName }}
---
{{- /*
The endpoint's own DNS name, stated outright as a DNSEndpoint rather than
inferred by external-dns from an annotation on some other object. Stating it
keeps the record independent of what external-dns can read out of a Traefik CRD,
and makes retire withdraw it with the rest of the release.

Rendered only when there is a name to publish. A deployment with no DNS zone —
kind, CI, anywhere without external-dns — still routes perfectly well; its
endpoints are simply addressed by their shard's host and port instead, which is
where they answer anyway.

recordType follows the cloud: a CNAME where the load balancer has a hostname
(AWS), an A where it has an address (GCP, Azure). The controller reads which off
the shard, once, when the shard is built.
*/}}
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
    {{- /* Which shard's address this record points at — read by operators, not
    by external-dns, which selects on nothing here. */}}
    amp.yugabyte.com/ingress-shard: {{ $ing.shard }}
spec:
  endpoints:
    - dnsName: {{ $ing.dnsName }}
      recordType: {{ $ing.recordType | default "CNAME" }}
      targets:
        - {{ required "service.ingress.shardHost is required: the record needs somewhere to point" $ing.shardHost }}
      {{- /*
      Short on purpose. A released port is quarantined before reuse and an
      endpoint can be moved between shards, so a long TTL is how a client ends up
      holding an address that has moved on.
      */}}
      recordTTL: 60
{{- end }}
{{- end }}
