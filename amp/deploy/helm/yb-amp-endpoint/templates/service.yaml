apiVersion: v1
kind: Service
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "yb-amp-endpoint.selectorLabels" . | nindent 4 }}
  ports:
    {{- if eq (include "yb-amp-endpoint.documentdbGatewayEnabled" .) "true" }}
    # The gateway port. Named `documentdb` so a client sees what it is; the number is the
    # gateway's own default (10260), not MongoDB's conventional 27017.
    - name: documentdb
      port: {{ .Values.documentdbGateway.port }}
      targetPort: documentdb
      protocol: TCP
    {{- end }}
    - name: pg-compute
      port: {{ .Values.endpoint.computePort }}
      targetPort: pg-compute
      protocol: TCP
    {{- if or .Values.service.exposeInternalHttp .Values.controller.url }}
    - name: ps-http
      port: {{ .Values.ports.pageserverHttp }}
      targetPort: ps-http
      protocol: TCP
    - name: sk-http
      port: {{ .Values.ports.safekeeperHttp }}
      targetPort: sk-http
      protocol: TCP
    {{- if .Values.controller.url }}
    - name: sup-http
      port: {{ .Values.ports.supervisorHttp }}
      targetPort: sup-http
      protocol: TCP
    {{- end }}
    {{- end }}
