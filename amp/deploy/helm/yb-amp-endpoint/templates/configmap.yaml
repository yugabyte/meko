apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
data:
  # --- YugabyteDB connection (the external durable backend) ---
  YB_HOST_PORTS: {{ .Values.yugabyte.hostPorts | quote }}
  YB_USER: {{ .Values.yugabyte.user | quote }}
  YB_DBNAME: {{ .Values.yugabyte.dbname | quote }}
  YB_SSLMODE: {{ .Values.yugabyte.sslmode | quote }}
  YB_SSLROOTCERT: {{ .Values.yugabyte.sslrootcert | quote }}
  {{- if include "yb-amp-endpoint.hasPassword" . }}
  # Name of the env var carrying the YB password (injected from a Secret).
  YB_PASSWORD_ENV: "YB_PASSWORD"
  {{- end }}

  # --- Endpoint / compute settings ---
  ENDPOINT_PG_VERSION: {{ .Values.endpoint.pgVersion | quote }}
  COMPUTE_PORT: {{ .Values.endpoint.computePort | quote }}
  BRANCH_ID: {{ .Values.endpoint.branchId | quote }}
  {{- /*
    Extensions mounted as ImageVolumes contribute two things:
      * their library name to shared_preload_libraries (preload: true only), and
      * their share/ + lib/ dirs to extension_control_path / dynamic_library_path
        (prepended with the PG18 defaults $system / $libdir so the built-in and
        remote-downloaded extensions still resolve).
    extension_control_path entries are sharedir bases: PG18 appends "/extension"
    to each non-$system entry itself (get_extension_control_directories), so we
    pass .../share/postgresql, NOT .../share/postgresql/extension.
  */ -}}
  {{- $preload := .Values.endpoint.sharedPreloadLibraries }}
  {{- $extra := deepCopy .Values.endpoint.extraSettings }}
  {{- if .Values.endpoint.extensions }}
  {{- $ctrlPaths := list "$system" }}
  {{- $libPaths := list "$libdir" }}
  {{- range .Values.endpoint.extensions }}
  {{- $ctrlPaths = append $ctrlPaths (printf "/extensions/%s/share/postgresql" .name) }}
  {{- $libPaths = append $libPaths (printf "/extensions/%s/lib/postgresql" .name) }}
  {{- if .preload }}
  {{- $preload = printf "%s,%s" $preload (default .name .library) }}
  {{- end }}
  {{- end }}
  {{- $_ := set $extra "extension_control_path" (join ":" $ctrlPaths) }}
  {{- $_ := set $extra "dynamic_library_path" (join ":" $libPaths) }}
  {{- end }}
  SHARED_PRELOAD_LIBRARIES: {{ $preload | quote }}
  COMPUTE_EXTRA_SETTINGS_JSON: {{ $extra | toJson | quote }}

  {{- if .Values.controller.url }}
  # --- Controller coordination ---
  # The endpoint runs its branch bookkeeping against this controller.
  # CONTROLLER_REACHABLE_HOST (the stable Service DNS the controller dials back, so a
  # rescheduled pod re-registers the same address — #121) is set in the
  # Deployment; the *_PUB ports default to the internal ports. The controller
  # dials the pageserver/safekeeper HTTP ports, which the Service publishes when
  # SC-coordinated (the PG ports stay pod-local, reached by the compute over
  # loopback).
  CONTROLLER_URL: {{ .Values.controller.url | quote }}
  {{- end }}

  # --- Internal service ports ---
  PAGESERVER_PG_PORT: {{ .Values.ports.pageserverPg | quote }}
  PAGESERVER_HTTP_PORT: {{ .Values.ports.pageserverHttp | quote }}
  PAGESERVER_GRPC_PORT: {{ .Values.ports.pageserverGrpc | quote }}
  SAFEKEEPER_PG_PORT: {{ .Values.ports.safekeeperPg | quote }}
  SAFEKEEPER_HTTP_PORT: {{ .Values.ports.safekeeperHttp | quote }}
  ENDPOINT_STORAGE_HTTP_PORT: {{ .Values.ports.endpointStorageHttp | quote }}
  COMPUTE_CTL_HTTP_PORT: {{ .Values.ports.computeCtlHttp | quote }}

  # --- Supervisor behaviour ---
  SUPERVISOR_RESTART_BACKOFF_SECONDS: {{ .Values.supervisor.restartBackoffSeconds | quote }}
  SUPERVISOR_MAX_RESTARTS: {{ .Values.supervisor.maxRestarts | quote }}
  SUPERVISOR_RESTART_WINDOW_SECONDS: {{ .Values.supervisor.restartWindowSeconds | quote }}
