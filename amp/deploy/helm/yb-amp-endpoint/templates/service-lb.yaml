{{- if or (eq .Values.service.connectivity "nlb_internal") (eq .Values.service.connectivity "nlb_external") }}
{{- /*
A SECOND Service, fronted by the cloud's L4 load balancer, so clients outside
the cluster can reach this endpoint's Postgres at a stable address. The
ClusterIP Service in service.yaml stays as it is: the controller reaches the
pageserver/safekeeper over it by DNS, and the tailnet proxy fronts it.

Postgres only, deliberately. service.yaml publishes ps-http (9898), sk-http
(7676) and sup-http (9899) alongside pg-compute, and the supervisor's settings
API is unauthenticated and can reload config and restart Postgres — so
converting THAT Service to a LoadBalancer would put a restart button on the
network. Hence a separate Service with one port rather than a type change.

`loadBalancerSourceRanges` below is a core Service field, so the allow-list works
the same on every cloud. Everything a provider disagrees about is an annotation,
which is why they are selected by `service.cloud` rather than hardcoded.
*/}}
{{- $internal := eq .Values.service.connectivity "nlb_internal" }}
{{- $cloud := .Values.service.cloud | default "" }}
{{- /*
An unknown cloud is fatal for an INTERNAL load balancer and only for that: every
provider defaults a LoadBalancer Service to internet-facing, so guessing wrong
means handing out a public address for something the caller asked to keep
private. Failing the render is the only safe answer. An external LB needs no
annotation anywhere, so it renders fine without knowing the cloud.
*/}}
{{- if and $internal (not (has $cloud (list "aws" "gcp" "azure"))) }}
{{- fail (printf "service.connectivity=nlb_internal needs service.cloud to be one of aws, gcp, azure (got %q) — without it the Service would default to an internet-facing load balancer" $cloud) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}-lb
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
  annotations:
    {{- if eq $cloud "aws" }}
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ if $internal }}internal{{ else }}internet-facing{{ end }}
    {{- /*
    Register the pod rather than the node, so there is no kube-proxy hop and the
    load balancer controller re-targets a replaced pod — which is what makes this
    address outlive the pod behind it.
    */}}
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    {{- /*
    An endpoint is a single pod in a single AZ, but the NLB gets an interface in
    every subnet. With cross-zone off (the AWS load balancer controller's default)
    an interface in another AZ has no target to forward to, so a client that
    resolves to it fails outright — two AZs out of three, for a one-replica
    backend. GCP and Azure L4 load balancers are regional and do not need this.
    */}}
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    {{- else if eq $cloud "gcp" }}
    {{- if $internal }}
    {{- /*
    GKE's passthrough NLB is what a LoadBalancer Service gets by default, and it
    is EXTERNAL unless this says otherwise. Reachable from the cluster's own
    region only; add
    networking.gke.io/internal-load-balancer-allow-global-access: "true" if
    clients live in another region.
    */}}
    networking.gke.io/load-balancer-type: Internal
    {{- end }}
    {{- else if eq $cloud "azure" }}
    {{- if $internal }}
    {{- /* Azure's Standard Load Balancer is L4 already; this makes it internal. */}}
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    {{- end }}
    {{- end }}
spec:
  type: LoadBalancer
  selector:
    {{- include "yb-amp-endpoint.selectorLabels" . | nindent 4 }}
  {{- with .Values.service.allowedCidrs }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: pg-compute
      port: {{ .Values.endpoint.computePort }}
      targetPort: pg-compute
      protocol: TCP
{{- end }}
