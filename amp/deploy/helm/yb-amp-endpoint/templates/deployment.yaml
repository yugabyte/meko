apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The Deployment's own give-up clock, which Kubernetes defaults to 600s. It has
  # to outlast the startupProbe budget below: otherwise a pod the kubelet is
  # still legitimately waiting on gets Progressing=False/ProgressDeadlineExceeded
  # at 10m, and anything waiting on condition=Available — `helm --wait`, the
  # controller's deployer, the test harness — calls a healthy bootstrap a failed
  # rollout.
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  # An endpoint is a single-writer compute: two pods for the same endpoint must
  # never run at once, or the surged pod fights the old one for the storage
  # layer's writer fence and crash-loops until the old is gone. So redeploy with
  # Recreate (stop the old pod before starting the new) rather than the default
  # RollingUpdate, regardless of whether /data is a PVC or emptyDir. (A PVC is
  # also ReadWriteOnce, which independently forbids a surged second attach.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "yb-amp-endpoint.selectorLabels" . | nindent 6 }}
  # PGDATA is ephemeral (compute_ctl re-fetches a basebackup each start) and all
  # durable state lives in YugabyteDB; the /data volume (emptyDir or a PVC) is
  # local scratch + cache, so replacing the pod is safe.
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.postgresExporter.enabled }}
        # Let a Prometheus/OTel Collector with pod service-discovery scrape the
        # postgres_exporter sidecar. Kept off the Service so metrics aren't
        # published on a (possibly LoadBalancer/tailnet-exposed) endpoint Service.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.postgresExporter.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- with include "yb-amp-endpoint.commonLabels" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "yb-amp-endpoint.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: endpoint
          image: {{ include "yb-amp-endpoint.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The image ENTRYPOINT is `tini -- /usr/local/bin/endpoint-supervisor`.
          envFrom:
            - configMapRef:
                name: {{ include "yb-amp-endpoint.fullname" . }}
          {{- $extEnv := dict }}
          {{- range .Values.endpoint.extensions }}
          {{- $mount := printf "/extensions/%s" .name }}
          {{- range $k, $v := .envPaths }}
          {{- $_ := set $extEnv $k (printf "%s/%s" $mount $v) }}
          {{- end }}
          {{- end }}
          {{- if or (include "yb-amp-endpoint.hasPassword" .) .Values.controller.url $extEnv .Values.endpoint.password }}
          env:
          {{- if $extEnv }}
          # Data directories an externalized extension's libraries read at
          # runtime, each resolved against that extension's ImageVolume mount
          # (e.g. PROJ_DATA for PostGIS's coordinate database). Set here rather
          # than in the ConfigMap because these are process environment, not GUCs.
          {{- end }}
          {{- range $k, $v := $extEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          {{- if include "yb-amp-endpoint.hasPassword" . }}
            - name: YB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yb-amp-endpoint.secretName" . }}
                  key: {{ include "yb-amp-endpoint.secretKey" . }}
          {{- end }}
          {{- if .Values.endpoint.password }}
            # The compute's default-user password. Always the chart-managed
            # Secret, never yugabyte.existingSecret: that one belongs to whoever
            # runs the YB universe and holds only the YB password.
            - name: COMPUTE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yb-amp-endpoint.fullname" . }}
                  key: computePassword
          {{- end }}
          {{- if .Values.controller.url }}
            # The address the controller dials back to reach this
            # endpoint's pageserver/safekeeper. Use the endpoint's own Service DNS
            # (stable) rather than the pod IP: a rescheduled pod (new IP) then
            # re-registers the SAME address, so the controller's node-register
            # stays UpToDate instead of returning 409 (#121). kube-proxy routes
            # the Service to whichever pod currently backs it.
            - name: CONTROLLER_REACHABLE_HOST
              value: {{ include "yb-amp-endpoint.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
          {{- end }}
          {{- end }}
          ports:
            - name: pg-compute
              containerPort: {{ .Values.endpoint.computePort }}
              protocol: TCP
            {{- if or .Values.service.exposeInternalHttp .Values.controller.url }}
            - name: ps-http
              containerPort: {{ .Values.ports.pageserverHttp }}
              protocol: TCP
            - name: sk-http
              containerPort: {{ .Values.ports.safekeeperHttp }}
              protocol: TCP
            {{- if .Values.controller.url }}
            - name: sup-http
              containerPort: {{ .Values.ports.supervisorHttp }}
              protocol: TCP
            {{- end }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          # Bootstrap can take a long time and is NOT bounded by initdb: an
          # endpoint coming up on a branch that already has data rebuilds from
          # YugabyteDB — the pageserver re-attaches and pulls the branch's pages
          # and WAL before Postgres listens. On a /data emptyDir that happens on
          # every pod, so a resumed or rescheduled endpoint pays it in full.
          #
          # Without a startupProbe the liveness probe below owns that window, and
          # it is sized for a HEALTHY compute (90s): a slower bootstrap gets the
          # container killed and restarted — and since compute_ctl recreates
          # pgdata on every start, the next attempt redoes the same work and is
          # killed at the same point. A startupProbe suspends liveness until it
          # first succeeds, which is exactly the distinction: "still starting" is
          # not "hung".
          startupProbe:
            tcpSocket:
              port: pg-compute
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: pg-compute
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: pg-compute
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.endpoint.resources }}
          {{- if and .cpu .memory }}
          # request == limit for both cpu and memory => the pod is scheduled with
          # the Guaranteed QoS class (kubelet never evicts it under node pressure
          # and it can't burst past its reservation). NB: every OTHER container in
          # this pod must ALSO set request == limit or the pod drops to Burstable.
          # ephemeralStorage is set only for the emptyDir backing: sizeLimit is an
          # eviction ceiling that reserves nothing, so the request is what makes
          # the scheduler count this volume against the node's disk and stop
          # co-tenants oversubscribing it. A PVC leaves it unset — that disk is
          # its own device, not the node's.
          resources:
            requests:
              cpu: {{ .cpu | quote }}
              memory: {{ .memory | quote }}
              {{- with .ephemeralStorage }}
              ephemeral-storage: {{ . | quote }}
              {{- end }}
            limits:
              cpu: {{ .cpu | quote }}
              memory: {{ .memory | quote }}
              {{- with .ephemeralStorage }}
              ephemeral-storage: {{ . | quote }}
              {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.endpoint.resizePolicy }}
          # In-place vertical resize policy (k8s 1.33+ beta, InPlacePodVerticalScaling).
          # Governs whether a live CPU/memory change (applied via the pod's `resize`
          # subresource by the controller) needs a container restart. `NotRequired`
          # lets the kubelet adjust the cgroup live with no restart. Resource
          # request==limit is kept above so a resize never changes the pod's
          # (Guaranteed) QoS class, which in-place resize forbids.
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: run
              mountPath: /data
            {{- if .Values.tls.enabled }}
            # Whole-directory mounts (no subPath): the kubelet only propagates a
            # renewed Secret or ConfigMap into a directory mount.
            - name: yb-client-tls
              mountPath: /etc/amp/tls/client
              readOnly: true
            - name: yb-ca-bundle
              mountPath: /etc/amp/tls/ca
              readOnly: true
            {{- end }}
            {{- if .Values.computeTls.enabled }}
            # The compute's own server certificate. Directory mount for the same
            # reason: a renewal reaches the pod, and Postgres re-reads
            # ssl_cert_file on reload.
            - name: compute-tls
              mountPath: /etc/amp/tls/compute
              readOnly: true
            {{- end }}
            {{- range .Values.endpoint.extensions }}
            # Extension ImageVolume: read-only tree with share/ (control+SQL)
            # and lib/ (the .so). extension_control_path / dynamic_library_path
            # (derived in the ConfigMap) point PostgreSQL at these subdirs. The
            # volume name is sanitized (DNS-1123) but the mount path keeps the raw
            # extension name.
            - name: {{ include "yb-amp-endpoint.extVolumeName" . }}
              mountPath: /extensions/{{ .name }}
              readOnly: true
            {{- end }}
        {{- if .Values.metrics.postgresExporter.enabled }}
        # postgres_exporter sidecar: scrapes the compute's Postgres over the pod's
        # shared loopback and exposes Prometheus metrics for the amp metrics
        # pipeline (controller/architecture/ac-metrics.md). Mirrors the VM-image
        # exporter: cloud_admin via trust auth (no password), database collector
        # off (it errors against the storage layer), statement collector on when
        # pg_stat_statements is preloaded.
        - name: postgres-exporter
          image: "{{ .Values.metrics.postgresExporter.image.repository }}:{{ .Values.metrics.postgresExporter.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.postgresExporter.image.pullPolicy }}
          {{- with .Values.metrics.postgresExporter.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --web.listen-address=:{{ .Values.metrics.postgresExporter.port }}
            - --no-collector.database
            {{- if contains "pg_stat_statements" .Values.endpoint.sharedPreloadLibraries }}
            # Query-level metrics. Gated on the preload list: without the library
            # the view does not exist and the collector errors every scrape.
            - --collector.stat_statements
            {{- end }}
            {{- range .Values.metrics.postgresExporter.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: DATA_SOURCE_NAME
              value: "host=localhost port={{ .Values.endpoint.computePort }} user={{ .Values.metrics.postgresExporter.user }} dbname={{ .Values.metrics.postgresExporter.dbname }} sslmode=disable application_name=postgres-exporter options='-c pgaudit.log=none'"
          ports:
            - name: pg-metrics
              containerPort: {{ .Values.metrics.postgresExporter.port }}
              protocol: TCP
          {{- with .Values.metrics.postgresExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metrics.postgresExporter.resizePolicy }}
          # Mirror the endpoint container's in-place resize policy so a pod resize
          # never trips over this sidecar (QoS class is pod-wide).
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if eq (include "yb-amp-endpoint.documentdbGatewayEnabled" .) "true" }}
        # documentdb gateway sidecar: terminates the MongoDB wire protocol and
        # translates to SQL against this pod's compute over the shared loopback,
        # the same path postgres_exporter takes. A sidecar rather than its own
        # deployment because it is per-endpoint state — one gateway fronts exactly
        # one compute — and loopback keeps that traffic off the network.
        - name: documentdb-gateway
          image: "{{ .Values.documentdbGateway.image.repository }}:{{ .Values.documentdbGateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.documentdbGateway.image.pullPolicy }}
          args: ["run"]
          env:
            - name: DOCUMENTDB_LISTEN_ADDR
              value: ":{{ .Values.documentdbGateway.port }}"
            # The gateway reads the backend URL from a FILE, not a variable.
            - name: DOCUMENTDB_PG_URL_FILE
              value: /etc/documentdb/pg-url
            - name: DOCUMENTDB_LOG_LEVEL
              value: {{ .Values.documentdbGateway.logLevel | quote }}
            # Self-signed on first start into an emptyDir: MongoDB drivers expect
            # TLS, and the cert is per-pod and disposable.
            - name: DOCUMENTDB_TLS_AUTO_GENERATE
              value: "true"
            - name: DOCUMENTDB_TLS_STATE_DIR
              value: /var/lib/documentdb/tls
          ports:
            - name: documentdb
              containerPort: {{ .Values.documentdbGateway.port }}
              protocol: TCP
          # tcpSocket, deliberately, and NOT `documentdb-gateway check`.
          #
          # Readiness here is pod-wide: a failing probe on this sidecar pulls the
          # whole pod out of the Service, taking Postgres and the controller's
          # safekeeper round trip (verifyReady, #724) with it. `check` verifies
          # the documentdb EXTENSION is loaded, and nothing in the product
          # creates it — compute_ctl auto-creates only PRELOADED_EXTENSIONS
          # ("pg_stat_statements"), and mounting the ImageVolume only makes the
          # extension available for the user's own CREATE EXTENSION. Gating
          # readiness on it meant no documentdb endpoint could reach Ready at
          # all: helm --wait failed every create, on a healthy compute.
          #
          # So probe what this container is responsible for — its own listener —
          # exactly as the endpoint container probes pg-compute.
          #
          # The gateway does NOT bind at once: it binds only after its startup
          # has found the documentdb schema, retrying every 10s until then. That
          # schema is created by compute_ctl once the compute is up (it creates
          # the documentdb database and the extension in it whenever
          # pg_documentdb is preloaded). So this probe waits on the compute's
          # bootstrap too, and its budget follows the endpoint container's,
          # which the controller sizes from its deploy timeout.
          startupProbe:
            tcpSocket:
              port: documentdb
            periodSeconds: {{ .Values.documentdbGateway.startupProbe.periodSeconds | default .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.documentdbGateway.startupProbe.failureThreshold | default .Values.startupProbe.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: documentdb
            periodSeconds: {{ .Values.documentdbGateway.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.documentdbGateway.readinessProbe.failureThreshold }}
          {{- with .Values.documentdbGateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: documentdb-gateway-conf
              mountPath: /etc/documentdb
              readOnly: true
            - name: documentdb-gateway-tls
              mountPath: /var/lib/documentdb/tls
          {{- with .Values.documentdbGateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.documentdbGateway.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        {{- if eq (include "yb-amp-endpoint.documentdbGatewayEnabled" .) "true" }}
        - name: documentdb-gateway-conf
          secret:
            secretName: {{ include "yb-amp-endpoint.fullname" . }}-documentdb-gateway
        - name: documentdb-gateway-tls
          emptyDir: {}
        {{- end }}
        - name: run
        {{- if .Values.persistence.storageClass }}
          persistentVolumeClaim:
            claimName: {{ include "yb-amp-endpoint.fullname" . }}-data
        {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.runDir.sizeLimit }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: yb-client-tls
          secret:
            secretName: {{ include "yb-amp-endpoint.tlsSecretName" . }}
            defaultMode: 0440
        - name: yb-ca-bundle
          configMap:
            name: {{ .Values.tls.caBundleConfigMap }}
        {{- end }}
        {{- if .Values.computeTls.enabled }}
        # 0440 with the pod's fsGroup: the kubelet lands Secret files owned by
        # root, and Postgres refuses a key file that is group- or world-readable
        # UNLESS it is root-owned and at most 0640 (be-secure-common.c). A
        # root-owned 0440 is the one shape that satisfies both that check and a
        # non-root server reading it through its group.
        - name: compute-tls
          secret:
            secretName: {{ include "yb-amp-endpoint.computeTlsSecretName" . }}
            defaultMode: 0440
        {{- end }}
        {{- range .Values.endpoint.extensions }}
        # OCI ImageVolume (k8s 1.33+ beta, feature gate ImageVolume): mounts the
        # extension image's filesystem read-only. Built by deploy/extensions. The
        # volume name is sanitized to a valid DNS-1123 label (see helper).
        - name: {{ include "yb-amp-endpoint.extVolumeName" . }}
          image:
            reference: {{ .image | quote }}
            pullPolicy: IfNotPresent
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
