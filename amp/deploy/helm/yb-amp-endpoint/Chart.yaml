apiVersion: v2
name: yb-amp-endpoint
description: >-
  A yb-amp endpoint as a single pod: pageserver, safekeeper, endpoint_storage,
  and a Postgres compute (compute_ctl) supervised in one container, backed by an
  external YugabyteDB. Connection config is passed in via a ConfigMap.
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# Tracks the yb-amp app; the image tag defaults to this when not overridden.
appVersion: "0.1.0"
keywords:
  - yb-amp
  - neon
  - yugabytedb
  - postgres
home: https://github.com/yugabyte/amp
sources:
  - https://github.com/yugabyte/amp
maintainers:
  - name: yb-amp
