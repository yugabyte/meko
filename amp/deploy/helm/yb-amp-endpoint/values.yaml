# Default values for yb-amp-endpoint.

# -- Number of endpoint pods. Each pod is an independent endpoint with its own
# tenant/timeline; durable state lives in the shared external YugabyteDB.
replicaCount: 1

image:
  # -- Endpoint image repository (built from deploy/endpoint/Dockerfile).
  repository: yb-amp/neon-endpoint
  # -- Image tag. Empty string defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# YugabyteDB connection — the external, durable backend every storage service
# talks to. This block is rendered verbatim into the ConfigMap consumed by the
# pod. yb-amp does NOT run YugabyteDB itself; point this at your cluster.
yugabyte:
  # -- CSV of YB tserver endpoints: "host:port[,host:port,...]" (default port 5433).
  hostPorts: "yb-tserver:5433"
  # -- YB role to connect as.
  user: "yugabyte"
  # -- YB database that holds all yb-amp schemas.
  dbname: "yb_storage"
  # -- TLS mode: "" or "disable" => no TLS; "require"/"verify-ca"/"verify-full" => TLS.
  sslmode: ""
  # -- Path (inside the container) to a PEM CA bundle, for verify-ca/verify-full.
  sslrootcert: ""
  # -- Paths (inside the container) to the PEM client certificate and key the
  # daemons present on both lanes; both or neither. The controller sets them to
  # the `tls` mounts below.
  sslcert: ""
  sslkey: ""
  # Password delivery. Either set `password` (rendered into a chart-managed
  # Secret) or point `existingSecret`/`existingSecretKey` at your own Secret.
  # -- Inline password (dev/test only). Rendered into a Secret.
  password: ""
  # -- Name of a pre-existing Secret holding the YB password. Takes precedence over `password`.
  existingSecret: ""
  # -- Key within `existingSecret` holding the password.
  existingSecretKey: "password"

# Certificate authentication to YugabyteDB (controller/architecture/ac-endpoint-tls.md).
# When enabled the chart renders a cert-manager Certificate for this release
# (CN = yugabyte.user, client auth) and mounts its Secret at /etc/amp/tls/client
# and the CA bundle ConfigMap at /etc/amp/tls/ca, whole-directory mounts so
# renewals reach the pod. Point yugabyte.sslrootcert/sslcert/sslkey at those
# paths. Needs cert-manager and an issuer in the cluster (deploy/tls/trust-root.sh).
tls:
  enabled: false
  issuerRef:
    kind: ClusterIssuer
    name: amp-ca
    group: cert-manager.io
  # -- ConfigMap in the release namespace holding the CA bundle under key ca.crt
  # (trust-manager keeps it current).
  caBundleConfigMap: amp-ca-bundle
  certificate:
    duration: 720h
    renewBefore: 240h
    algorithm: ECDSA
    size: 256

# The server certificate the compute's Postgres listener presents to CLIENTS
# (controller/architecture/ac-compute-tls.md). The opposite direction from `tls`
# above, which is the client certificate this pod presents to YugabyteDB, and
# independent of it: either can be on without the other.
#
# Enabling this turns `ssl = on` in the compute, so a client may connect with
# `sslmode=verify-full` against a name in `dnsNames`. TLS stays OPTIONAL on the
# wire — pg_hba still accepts plaintext — so turning this on breaks no existing
# client. The documentdb gateway, when rendered, serves the same certificate
# instead of self-signing one.
#
# Two issuance shapes, because the two issuer families have opposite costs:
#   mode: issue            one cert-manager Certificate per endpoint, from
#                          `issuerRef`. What a private CA (the `amp-ca`
#                          ClusterIssuer deploy/tls/trust-root.sh bootstraps)
#                          wants: issuance is local, instant and unmetered.
#   mode: existingSecret   mount a Secret somebody else owns, typically one
#                          wildcard `*.<zone>` certificate shared by every
#                          endpoint in a family. What Let's Encrypt wants: ACME
#                          allows 50 NEW certificates per registered domain per
#                          week (renewals exempt, so it caps creates, not fleet
#                          size). In BYOC the zone is the CUSTOMER's, so that
#                          budget is theirs alone — per-endpoint ACME is viable
#                          below ~50 creates a week, if they delegate DNS-01 and
#                          are not already spending it elsewhere.
#                          deploy/tls/acme-issuer.sh issues that wildcard.
computeTls:
  enabled: false
  # -- issue | existingSecret. See above.
  mode: issue
  # -- Issuer for `mode: issue`. `amp-ca` is the private CA; point it at an ACME
  # ClusterIssuer only for a deployment small enough to stay under the rate limit.
  issuerRef:
    kind: ClusterIssuer
    name: amp-ca
    group: cert-manager.io
  # -- The Secret to mount for `mode: existingSecret`. Must hold tls.crt and
  # tls.key, and must already exist in this namespace — the chart does not create
  # it, and a missing one leaves the pod stuck mounting rather than starting
  # without TLS.
  existingSecret: ""
  # -- Names to put in the certificate, beyond the two the chart adds itself:
  # the compute Service's in-cluster DNS name (unless includeServiceDns is false)
  # and service.ingress.dnsName / service.dns.name when the endpoint has a
  # published name.
  # The controller adds the endpoint's own client-facing address here when that
  # address is a NAME it only learns after the Service exists — an nlb_* load
  # balancer with a hostname, or an ingress shard reached by its hostname.
  dnsNames: []
  # -- IP addresses to put in the certificate, as IP SANs. The two cases the
  # chart cannot derive: an nlb_* endpoint, whose load-balancer IP the cloud
  # assigns only after the Service exists, and an ingress_* endpoint in a
  # deployment with no DNS zone, where clients are handed the shard's address
  # rather than a name. Without these the certificate covers only the in-cluster
  # Service DNS, and a client dialling the external address gets `require` and no
  # better. libpq matches an IP SAN, so `verify-full` against a bare address works.
  ipAddresses: []
  # -- Include the in-cluster Service DNS name. Keep it on for a private CA, so
  # an in-cluster client can also verify-full. Turn it OFF for an ACME issuer:
  # no public CA can validate a `.svc.cluster.local` name, so its presence fails
  # the whole order.
  includeServiceDns: true
  certificate:
    # -- Certificate lifetime. Leave EMPTY for ACME: Let's Encrypt fixes it at 90
    # days and cert-manager only warns that the request was ignored.
    duration: "2160h"
    renewBefore: "720h"
    algorithm: ECDSA
    size: 256

# Endpoint / compute settings.
# Distributed tracing for the compute's OTLP span exporter.
tracing:
  # -- OTLP/HTTP endpoint for compute_ctl's span exporter. Empty (the default)
  # sets OTEL_SDK_DISABLED=true instead: compute_ctl otherwise defaults to
  # http://localhost:4318, where nothing listens in an endpoint pod, and the
  # retry loop emits a BatchSpanProcessor.ExportError every few seconds. Set
  # this only when a collector with an OTLP traces pipeline actually exists.
  otlpEndpoint: ""

endpoint:
  # -- Postgres major version for the compute. The image ships v18 only; this
  # locates the install at `pg_install/v{N}`, so anything else points at a
  # directory that isn't there.
  pgVersion: "18"
  # -- Postgres port the compute listens on (exposed by the Service).
  computePort: 55433
  # -- Branch id to serve. Empty => the pod bootstraps a fresh branch on first start.
  branchId: ""
  # -- This endpoint's `amp_registry.endpoints.id`. Set by the controller; lets
  # the supervisor read the endpoint's own override columns (pg_settings /
  # pageserver_settings / safekeeper_settings) from the registry at start. Empty
  # => no override lookup, derived defaults only.
  endpointId: ""
  # -- Password for the compute's default user (`cloud_admin`, the superuser
  # initdb created), set by the supervisor once Postgres answers so clients
  # arriving from outside the pod can authenticate. Rendered into the release's
  # Secret and delivered as COMPUTE_PASSWORD.
  #
  # Given as the verifier `pg_authid` stores, not the plaintext:
  # `SCRAM-SHA-256$<iterations>:<salt>$<StoredKey>:<ServerKey>`. Postgres stores
  # a value of that shape verbatim instead of hashing it again, so the control
  # plane never has to hand the pod a password it could read back. A plaintext
  # value also works — Postgres hashes it, to SCRAM, per the compute spec's
  # `password_encryption`.
  #
  # Empty means the supervisor leaves the role's password exactly as the
  # branch's catalog already has it. It does NOT fall back to a default: the
  # control plane sends this on the create and on nothing else, so a redeploy
  # and a fleet roll both arrive with it empty and must change nothing.
  password: ""
  # -- Override for the compute's base shared_preload_libraries. Empty uses the
  # endpoint image's own list (`yb_amp,pg_stat_statements,pgsentinel` today),
  # which names only libraries that image ships — a name whose library is
  # missing stops the postmaster, and the controller renders this chart against
  # endpoint images of any version. Extensions with `preload: true` below are
  # appended either way. Leaving `pg_stat_statements` out of an override also
  # turns off the exporter's stat_statements collector.
  sharedPreloadLibraries: ""
  # -- Externalized extensions to mount as read-only Kubernetes ImageVolumes
  # (built from deploy/extensions). Each mounts at /extensions/<name>, and its
  # share/ + lib/ subdirs are appended to extension_control_path /
  # dynamic_library_path so `CREATE EXTENSION <name>` resolves. A restart is
  # required to add or remove one (the volume set is fixed at pod start; a
  # `preload: true` extension also needs the postmaster restart to load).
  # Each entry:
  #   name    extension name; also the mount subdir and the CREATE EXTENSION name
  #   image   OCI image reference (repo:tag) built from deploy/extensions, or a
  #           third-party image laid out per the paths below
  #   preload add the library to shared_preload_libraries (default false)
  #   library shared-library name if it differs from `name` (default `name`)
  #
  # The rest describe a non-amp in-image layout. Each path is relative to the
  # entry's mount root, /extensions/<name>, and the defaults are what
  # deploy/extensions builds — an amp-built extension sets none of them.
  #   sharePath      dir appended to extension_control_path. This is the sharedir
  #                  BASE: PG18 appends "/extension" itself. Default
  #                  "share/postgresql"; the CloudNativePG images use "share".
  #   libPath        dir appended to dynamic_library_path. Default
  #                  "lib/postgresql"; the CloudNativePG images use "lib".
  #   libraryPath    list of dirs holding system shared libraries the extension's
  #                  .so links (geos/proj/gdal for PostGIS). Rendered into
  #                  EXTENSION_LIBRARY_PATH, which the supervisor appends to
  #                  LD_LIBRARY_PATH. Default none.
  #   envPaths       map of env var to a data dir the extension reads at runtime
  #                  (PROJ_DATA, GDAL_DATA). Rendered as container env with the
  #                  mount root prefixed. Default none.
  #   abiExtraExempt list of module names (no file extension) allowed to differ
  #                  from the server in FMGR_ABI_EXTRA — for an image built
  #                  against stock PG18. Rendered into
  #                  yb_amp_abi_extra_exempt_libraries. Default none; every other
  #                  magic-block field is still enforced.
  extensions: []
  # -- Compute reserved for the endpoint container. Each value is a Kubernetes
  # resource quantity and is rendered as BOTH a request and a limit, so the pod
  # is scheduled with the Guaranteed QoS class. Defaults to 2 cores / 16Gi — the
  # 8 GiB per vCPU the control plane holds every endpoint to, since a core
  # without the memory to feed it gives Postgres a cache it cannot keep.
  resources:
    # -- CPU cores (request == limit). e.g. "2", "1500m".
    cpu: "2"
    # -- Memory (request == limit). e.g. "16Gi", "512Mi".
    memory: "16Gi"
    # -- Ephemeral storage for the emptyDir /data (request == limit), e.g. "10Gi".
    # The controller sets it to the same figure as runDir.sizeLimit, which is an
    # eviction ceiling only: this request is what the scheduler accounts against
    # the node's disk. Leave empty for a PVC-backed endpoint — that volume is its
    # own device — and empty requests no ephemeral storage at all.
    ephemeralStorage: ""
  # -- In-place vertical resize policy for the endpoint container (k8s 1.33+
  # InPlacePodVerticalScaling). Per-resource `restartPolicy` for a live resize
  # the controller applies via the pod's `resize` subresource. `NotRequired`
  # (default) adjusts the cgroup with no container restart; set memory to
  # `RestartContainer` if a Postgres restart is preferred on a memory change.
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: NotRequired

# Controller coordination. Empty url => the endpoint runs
# controller-free. Set => the endpoint runs its branch bookkeeping against the
# controller; the controller
# reaches this endpoint at its stable Service DNS (set as CONTROLLER_REACHABLE_HOST), so
# a rescheduled pod re-registers the same address (#121).
controller:
  # -- URL the endpoint uses to reach the controller (e.g.
  # http://amp-controller.<ns>.svc.cluster.local:50051). Empty = controller-free.
  url: ""

# DocumentDB gateway: the MongoDB wire-protocol front end for the documentdb
# extension. It terminates the wire protocol and translates to SQL against this
# endpoint's Postgres over the pod's shared loopback, so it runs as a sidecar
# here rather than as its own deployment.
documentdbGateway:
  # -- Run the gateway. Unset (the default) follows the extension: on wherever
  # `documentdb` is in endpoint.extensions, off otherwise — the gateway has
  # nothing to front without it. Set true/false to override.
  enabled: ~
  image:
    repository: quay.io/yugabyte/amp-documentdb-gateway
    # -- Image tag. An empty value falls back to the chart appVersion, which is
    # a trap for controller-driven deploys: the controller resolves the ENDPOINT
    # image tag in Go for exactly this reason (kubernetes.go — "the chart reads
    # an empty tag as its own appVersion"), and it now resolves this one the
    # same way. Left empty so a bare `helm install` still gets a default.
    tag: ""
    pullPolicy: IfNotPresent
  # -- The gateway port, exposed on the Service. 10260 is the gateway's own
  # default; MongoDB's conventional 27017 is not used, so a client must be
  # pointed at this port explicitly.
  port: 10260
  # -- Startup probe for the gateway's own listener, a tcpSocket check. The
  # gateway binds only once the documentdb schema exists, which compute_ctl
  # creates after the compute is up, so an unset value follows the endpoint
  # container's startupProbe (sized from the controller's --deploy-timeout).
  startupProbe:
    periodSeconds: ~
    failureThreshold: ~
  # -- Readiness for the same listener. NOT a functional check: readiness is
  # pod-wide, so failing it would pull Postgres out of the Service too.
  readinessProbe:
    periodSeconds: 30
    failureThreshold: 3
  # -- Sidecar security context, matching the postgres_exporter sidecar. The
  # image already runs as uid 10001, which covers non-root but not privilege
  # escalation or capability drop.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # -- Database the gateway connects to on the local compute: the one
  # compute_ctl creates the documentdb extension in.
  dbname: documentdb
  # -- Role it connects as. cloud_admin is the compute superuser and reaches it
  # over loopback trust auth, the same path postgres_exporter uses.
  user: cloud_admin
  # -- Tracing filter for the gateway (info, debug, ...).
  logLevel: info
  # -- Compute for the sidecar. Rendered as BOTH request and limit: QoS is
  # pod-wide, so a sidecar without matching values would drop the whole pod out
  # of Guaranteed (deploy/helm/yb-amp-endpoint/tests/guaranteed-qos.sh).
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  # -- In-place resize policy, mirroring the endpoint container's so a pod-wide
  # resize never trips over this sidecar.
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: NotRequired

# Internal listen ports for the co-located services. One endpoint per pod, so
# these are fixed defaults; override only on conflict.
ports:
  pageserverPg: 64000
  pageserverHttp: 9898
  pageserverGrpc: 51051
  safekeeperPg: 5454
  safekeeperHttp: 7676
  computeCtlHttp: 3080
  # -- The supervisor's settings API, which the controller calls after it edits
  # an endpoint's or branch's settings so a running endpoint re-reads them.
  # Served only when `controller.url` is set: with no controller there is nobody
  # to call it, and an unused listener is surface for nothing.
  supervisorHttp: 9899

# LFC prewarm: compute_ctl saves the local file cache's contents to YugabyteDB
# and loads them back on start, so a restarted endpoint is not cold.
lfc:
  # -- Load the previously saved LFC state when the compute starts.
  autoprewarm: false
  # -- Save the LFC state this often, in seconds. Empty = never save.
  offloadIntervalSeconds: ""

# Supervisor (the in-pod process manager, PID 1 under tini) behaviour.
supervisor:
  # -- Seconds to back off before restarting a crashed service.
  restartBackoffSeconds: 2
  # -- Max restarts per service within the window before the pod exits (k8s then restarts it).
  maxRestarts: 5
  # -- Sliding window (seconds) over which maxRestarts is counted.
  restartWindowSeconds: 180
  # -- Hold a YSQL lease on the branch and pass it to the services as their
  # write deadline, so at most one endpoint can ever write it
  # (compute/architecture/compute-fencing.md). Nothing starts before the lease
  # is held; losing it stops every service and the pod waits for its turn.
  # Setting this false runs the endpoint unfenced — only safe for a topology
  # that is single-writer by construction.
  requireWriteToken: true
  # -- Lease length in milliseconds. The token is a deadline the safekeeper
  # enforces against its own clock, so this bounds how long a stranded endpoint
  # can keep writing. Sized against a late renewal rather than a healthy one:
  # at 10000 with 8s renewals the margin was ~2s, and a routine load spike
  # overshot it by 45ms and killed the safekeeper (#813).
  writeTokenTtlMs: 15000
  # -- How often to renew, in seconds. Must leave slack under the TTL: the
  # difference is how long a failing renewal may be retried before anything
  # downstream stops writing. At 5s against a 15s TTL two renewals can fail
  # outright before the lease is spent.
  writeTokenRenewSeconds: 5

# Metrics: expose the compute's Postgres stats for the amp metrics pipeline
# (controller/architecture/ac-metrics.md). The Neon-derived services in this pod
# (pageserver/safekeeper/compute_ctl) already serve Prometheus
# on their HTTP ports; this adds the one missing source — Postgres itself.
metrics:
  # postgres_exporter runs as a sidecar, connecting to the compute's Postgres
  # over the pod's shared loopback (same trust-auth path the VM-image exporter
  # uses) and serving Prometheus on :port. The Collector scrapes it via the pod
  # scrape annotations added when this is enabled.
  postgresExporter:
    # -- Run the postgres_exporter sidecar.
    enabled: true
    image:
      # -- postgres_exporter image repository.
      repository: quay.io/prometheuscommunity/postgres-exporter
      # -- Image tag (matches the exporter baked into the compute VM image).
      tag: v0.17.1
      pullPolicy: IfNotPresent
    # -- Port the exporter serves /metrics on (also the pod scrape-annotation port).
    port: 9187
    # -- Postgres role the exporter connects as over loopback. cloud_admin is a
    # superuser, so it sees every stats view; loopback uses trust auth (no password).
    user: cloud_admin
    # -- Database the exporter connects to.
    dbname: postgres
    # -- Extra postgres_exporter flags. The template already passes
    # --collector.stat_statements (pg_stat_statements is preloaded unless
    # endpoint.sharedPreloadLibraries leaves it out) and --no-collector.database (the
    # database collector errors on the storage layer).
    extraArgs: []
    # -- Sidecar resources. Set request == limit (cpu + memory) so the sidecar
    # is Guaranteed-QoS like the endpoint container; otherwise the whole pod
    # drops to Burstable (enforced by tests/guaranteed-qos.sh). At 100m the
    # sidecar was CFS-throttled in up to 45% of its periods under the 15s scrape.
    resources:
      requests:
        cpu: "250m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"
    # -- In-place resize policy for the sidecar, mirroring the endpoint
    # container's so a pod-wide resize never trips over it (QoS is pod-level).
    resizePolicy:
      - resourceName: cpu
        restartPolicy: NotRequired
      - resourceName: memory
        restartPolicy: NotRequired
    # -- Sidecar security context. The image already runs as nobody; keep it
    # non-root and drop privileges.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

service:
  # -- Service type: ClusterIP (default), NodePort, or LoadBalancer.
  type: ClusterIP
  # -- Annotations for the Service. For an internal LoadBalancer on GKE, set e.g.
  # networking.gke.io/load-balancer-type: Internal (+ ...allow-global-access).
  annotations: {}
  # -- Also publish the internal HTTP APIs (pageserver/safekeeper) on the Service.
  exposeInternalHttp: false
  # -- Client reachability for the Postgres port. `cluster_ip` (default) leaves
  # the endpoint reachable only in-cluster (and over the tailnet, if the Service
  # is tailnet-exposed). `ingress_internal` / `ingress_external` put it on a
  # SHARED ingress shard — a port on a load balancer many endpoints sit behind —
  # so creating one provisions no cloud resource at all; the slot arrives in
  # `service.ingress`. `nlb_internal` / `nlb_external` add a SECOND Service
  # fronted by an AWS Network Load Balancer — internal (VPC-routable) or
  # internet-facing — carrying Postgres and, where the gateway runs, the
  # documentdb port. The pageserver/safekeeper/supervisor ports are deliberately
  # never published on it: the supervisor's settings API is unauthenticated and
  # can restart Postgres.
  connectivity: cluster_ip
  # -- Which cloud's load-balancer annotations to render for the `nlb_*` modes:
  # `aws`, `gcp` or `azure`. The controller sets it — from its own `--deploy-cloud`,
  # or detected from the cluster's nodes when that is empty (needs `nodes get,
  # list`). Give it by hand for a bare `helm install`.
  # Required for `nlb_internal` — every provider defaults a LoadBalancer Service
  # to internet-facing, so an unknown cloud would silently publish something the
  # caller asked to keep private, and the render fails instead.
  cloud: ""
  # -- The shared-ingress slot, for the `ingress_*` modes only. The controller
  # allocates it before the deploy and passes it in; nothing chooses a shard or
  # port here, because two endpoints on one port is a connection reaching another
  # customer's database. Empty for every other mode.
  #   shard       the Traefik release fronting this endpoint
  #   entryPoint  the listener its port is bound to on that release
  #   port        the port clients connect to
  #   dnsName     this endpoint's own published name
  #   documentdbEntryPoint  the shard's shared gateway listener, routed by
  #               dnsName over SNI; used only when the gateway runs and dnsName is set
  #   shardHost   where that name points: the shard load balancer's address
  #   recordType  CNAME where the cloud gave a hostname, A where it gave an address
  ingress: {}
  # -- The published name for the `nlb_*` modes only, set by the controller.
  # The name goes in the certificate as soon as it is set. The DNSEndpoint
  # pointing it at the load balancer is rendered only once `target` is known,
  # because the cloud assigns that address after the Service exists.
  #   name        this endpoint's own published name
  #   target      the load balancer's hostname or address
  #   recordType  CNAME for a hostname, A for an address
  dns: {}
  # -- CIDRs allowed to reach the load balancer (`loadBalancerSourceRanges`).
  # Portable: a core Service field, honoured on every cloud.
  # Empty means no restriction, which for `nlb_external` puts Postgres on the
  # public internet behind password auth alone — set this for anything but a
  # deliberate open test endpoint.
  allowedCidrs: []

# Endpoint data volume (/data: the compute's pgdata, the LFC cache, logs and
# pidfiles). All durable state is in YugabyteDB, so by default this is ephemeral
# scratch (emptyDir). Set persistence.storageClass to back /data with a
# PersistentVolumeClaim of that class (a network block volume — EBS on AWS,
# Persistent Disk on GCP) instead. The Deployment always uses the Recreate
# strategy (an endpoint is single-writer; a redeploy must not surge a second
# pod) — with a PVC the ReadWriteOnce volume also attaches to one pod at a time.
persistence:
  # -- StorageClass for the /data PersistentVolumeClaim. Empty => an ephemeral
  # emptyDir (no persistent volume).
  storageClass: ""
  # -- Requested size of the /data PVC when storageClass is set.
  size: 10Gi

# Ephemeral scratch for /data when persistence.storageClass is unset.
runDir:
  # -- emptyDir size limit for the scratch volume.
  sizeLimit: 10Gi

# How long the compute gets to come up before the liveness probe starts judging
# it. While this is failing, liveness is suspended; once it first passes,
# liveness takes over.
#
# The budget the kubelet enforces is periodSeconds * (failureThreshold - 1), not
# * failureThreshold: the prober probes immediately on entering its loop and only
# then waits on the period, so N failures span N-1 periods. Here 10 * 60 = 600s,
# a round 10 minutes, matching the controller's default deploy timeout — past
# which the deployer gives up anyway.
#
# The controller overrides failureThreshold per deploy, from its own
# --deploy-timeout, so the two cannot drift. This value is what a standalone
# `helm install` gets, and it doubles as the controller's floor.
startupProbe:
  enabled: true
  # Short period so the kubelet notices a compute that has come up promptly (the
  # database listens ~3-4s after the container starts); the threshold carries the
  # ~10m floor budget instead: 2 * (301 - 1) = 600s.
  periodSeconds: 2
  failureThreshold: 301
# progressDeadlineSeconds is the Deployment's own give-up clock. Kubernetes
# defaults it to 600s, which would flip Progressing=False while the kubelet is
# still legitimately inside a longer startup budget — anything waiting on
# condition=Available then reports a failed rollout for a pod that is fine. Kept
# a fixed margin above the startup budget — it also has to cover pre-container
# overhead (scheduling, image pull, volume attach) that the Progressing timer
# counts but the startup budget does not, so it is NOT scaled with the probe
# period. The controller overrides it too.
progressDeadlineSeconds: 610
# Liveness and readiness are tcpSocket probes on the compute port.
livenessProbe:
  enabled: true
  # Only consulted once startupProbe has succeeded, so this is sized for a
  # running compute going unresponsive, not for a slow bootstrap.
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 4
readinessProbe:
  enabled: true
  # Readiness is gated behind the startupProbe and probes the same compute port,
  # so once startup succeeds the port is already open and readiness passes on its
  # next tick. initialDelaySeconds counts from container start (not from startup
  # success), so it just needs to be small enough not to become the gate itself;
  # periodSeconds is what bounds how long after startup the pod is marked Ready.
  # failureThreshold is scaled with the period so the unready-before-eviction
  # window stays the original 60s (5 * 12), not 30s (5 * 6).
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 12

podAnnotations: {}
podLabels: {}
# -- Labels on every object of the release, the pod included, never on a
# selector. The controller sets the endpoint's amp.yugabyte.com/ identity labels
# and its tags (its cluster's merged with its own). Keys the chart sets itself
# are dropped.
commonLabels: {}
# -- Node labels the endpoint pod must schedule onto. The controller sets this
# per-deployment (from AMP_DEPLOY_NODE_SELECTOR); override here for a standalone
# install — e.g. {cloud.google.com/gke-ephemeral-storage-local-ssd: "true"} to
# pin the pod (and its emptyDir /data) to a local-NVMe-SSD pool. {} = anywhere.
nodeSelector: {}
tolerations: []
affinity: {}
securityContext: {}
# Run the pageserver and safekeeper as the storage user and the compute as its
# own user, so a compromised Postgres cannot read the YugabyteDB client key
# (compute/architecture/single-container-endpoint.md). The container then runs
# the supervisor as root with only SETUID, SETGID, CHOWN and KILL. Assumes the
# foundation enforces client certificates; without that, hiding the key does not
# keep the compute out. storageGid must equal podSecurityContext.fsGroup, which is
# the group the key Secret is readable by.
userSplit:
  enabled: false
  storageUid: 1000
  storageGid: 1000
  computeUid: 1001
  computeGid: 1001
# Pod-level security context. fsGroup defaults to the endpoint image's "yugabyte"
# gid (uid/gid 1000 in deploy/endpoint/Dockerfile): a provisioned PVC for /data
# mounts root-owned, and this gid makes it group-writable for the non-root
# process (an emptyDir is world-writable and unaffected). Keep it matching the
# image's run-as group.
podSecurityContext:
  fsGroup: 1000
