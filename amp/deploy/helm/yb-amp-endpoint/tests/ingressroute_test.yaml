suite: shared-ingress route, allowlist and DNS record
templates:
  - templates/ingressroute.yaml
tests:
  - it: renders nothing by default (cluster_ip)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing for the dedicated load-balancer modes
    set:
      service.connectivity: nlb_internal
      service.cloud: aws
    asserts:
      - hasDocuments:
          count: 0

  # The endpoint is unroutable without a slot, so the render must fail rather
  # than produce an endpoint that deploys and is then unreachable.
  - it: refuses an ingress mode with no slot allocated
    set:
      service.connectivity: ingress_internal
    asserts:
      - failedTemplate:
          errorMessage: "service.ingress.shard is empty: the controller allocates it, so an empty value means the endpoint was rendered without a slot and would not be routable"

  # No zone is a supported shape, not an error: a cluster with no external-dns
  # (kind, CI) routes identically and is addressed by its shard instead. The
  # route must still render; only the DNS record goes away.
  - it: renders the route but no DNS record when there is no name to publish
    set:
      service.connectivity: ingress_internal
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        port: 20007
        shardHost: 10.0.5.20
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: IngressRouteTCP
        documentIndex: 0
      - equal:
          path: spec.entryPoints[0]
          value: pg-20007
        documentIndex: 0
      - isKind:
          of: MiddlewareTCP
        documentIndex: 1

  - it: still renders the allowlist with no zone, since filtering is not DNS
    set:
      service.connectivity: ingress_internal
      service.allowedCidrs: ["10.0.0.0/8"]
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        port: 20007
        shardHost: 10.0.5.20
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: MiddlewareTCP
        documentIndex: 1

  - it: binds the route to this endpoint's own entryPoint and pod
    set:
      service.connectivity: ingress_internal
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: lb-0.example
        recordType: CNAME
    documentIndex: 0
    asserts:
      - isKind:
          of: IngressRouteTCP
      - equal:
          path: spec.entryPoints[0]
          value: pg-20007
      # The wildcard, and no tls block: the PORT is the discriminator here, and
      # not terminating is what keeps the session end-to-end encrypted.
      - equal:
          path: spec.routes[0].match
          value: HostSNI(`*`)
      - notExists:
          path: spec.routes[0].tls
      - equal:
          path: spec.routes[0].services[0].port
          value: 55433

  # The whole point of the per-endpoint middleware: a shared load balancer cannot
  # express a per-endpoint allowlist through loadBalancerSourceRanges.
  - it: carries the endpoint's own allowlist into a middleware bound to its route
    set:
      service.connectivity: ingress_internal
      service.allowedCidrs: ["10.0.0.0/16", "192.168.1.0/24"]
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: lb-0.example
        recordType: CNAME
    documentIndex: 1
    asserts:
      - isKind:
          of: MiddlewareTCP
      - equal:
          path: spec.ipAllowList.sourceRange
          value: ["10.0.0.0/16", "192.168.1.0/24"]

  # Present when unrestricted too, so a later allowlist is a patch to this object
  # (deploy.UpdateIngressAllowlist). Traefik refuses an empty sourceRange, and a
  # route naming a middleware that failed to build stops serving.
  - it: binds an unrestricted endpoint to a middleware that admits everyone
    set:
      service.connectivity: ingress_internal
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        port: 20007
        shardHost: 10.0.5.20
    asserts:
      - equal:
          path: spec.routes[0].middlewares[0].name
          value: RELEASE-NAME-yb-amp-endpoint-allow
        documentIndex: 0
      - isKind:
          of: MiddlewareTCP
        documentIndex: 1
      - equal:
          path: spec.ipAllowList.sourceRange
          value: ["0.0.0.0/0", "::/0"]
        documentIndex: 1

  - it: publishes the endpoint's own name at its shard, with a short TTL
    set:
      service.connectivity: ingress_external
      service.ingress:
        shard: pgin-1
        entryPoint: pg-20031
        port: 20031
        dnsName: ep-77aa.external.example
        shardHost: lb-1.elb.amazonaws.com
        recordType: CNAME
    documentIndex: 2
    asserts:
      - isKind:
          of: DNSEndpoint
      - equal:
          path: spec.endpoints[0].dnsName
          value: ep-77aa.external.example
      - equal:
          path: spec.endpoints[0].targets[0]
          value: lb-1.elb.amazonaws.com
      # Short because a released port is quarantined and an endpoint can move
      # shards; a long TTL is how a client keeps an address that has moved on.
      - equal:
          path: spec.endpoints[0].recordTTL
          value: 60

  - it: publishes an A record where the cloud gave the shard an address
    set:
      service.connectivity: ingress_internal
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: 10.0.5.20
        recordType: A
    documentIndex: 2
    asserts:
      - equal:
          path: spec.endpoints[0].recordType
          value: A

  # --- the documentdb gateway ------------------------------------------------
  # Every endpoint on a shard shares one gateway entryPoint, so the published
  # name, read from the ClientHello's SNI, is what picks the endpoint.
  - it: routes the documentdb gateway by the endpoint's published name, passed through
    set:
      service.connectivity: ingress_internal
      documentdbGateway.enabled: true
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        documentdbEntryPoint: documentdb
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: lb-0.example
        recordType: CNAME
    documentIndex: 1
    asserts:
      - isKind:
          of: IngressRouteTCP
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-endpoint-documentdb
      - equal:
          path: metadata.labels["amp.yugabyte.com/ingress-shard"]
          value: pgin-0
      - equal:
          path: spec.entryPoints
          value: [documentdb]
      - equal:
          path: spec.routes[0].match
          value: HostSNI(`ep-3f9a2c41.internal.example`)
      - equal:
          path: spec.routes[0].services[0].port
          value: 10260
      # Passthrough is what keeps the gateway's TLS end to end; terminating here
      # would put a key on the proxy.
      - equal:
          path: spec.tls.passthrough
          value: true
      - equal:
          path: spec.routes[0].middlewares[0].name
          value: RELEASE-NAME-yb-amp-endpoint-allow

  - it: follows the extension when the gateway is not set explicitly
    set:
      service.connectivity: ingress_internal
      endpoint.extensions:
        - name: documentdb
          image: quay.io/yugabyte/amp-ext-documentdb:x
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        documentdbEntryPoint: documentdb
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: lb-0.example
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-endpoint-documentdb

  - it: binds the gateway route to the same allowlist as Postgres
    set:
      service.connectivity: ingress_internal
      documentdbGateway.enabled: true
      service.allowedCidrs: ["10.0.0.0/16"]
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        documentdbEntryPoint: documentdb
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: lb-0.example
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: spec.routes[0].middlewares[0].name
          value: RELEASE-NAME-yb-amp-endpoint-allow
        documentIndex: 0
      - equal:
          path: spec.routes[0].middlewares[0].name
          value: RELEASE-NAME-yb-amp-endpoint-allow
        documentIndex: 1
      - isKind:
          of: MiddlewareTCP
        documentIndex: 2

  # No name means the client dials the shard's own host, which every endpoint on
  # the shard shares: there is nothing to route the gateway on.
  - it: renders no gateway route without a published name
    set:
      service.connectivity: ingress_internal
      documentdbGateway.enabled: true
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        documentdbEntryPoint: documentdb
        port: 20007
        shardHost: 10.0.5.20
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.routes[0].match
          value: HostSNI(`*`)
        documentIndex: 0

  - it: renders no gateway route for an endpoint without the gateway
    set:
      service.connectivity: ingress_internal
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        documentdbEntryPoint: documentdb
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: lb-0.example
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: DNSEndpoint
        documentIndex: 2

  - it: refuses a gateway route with no entryPoint to bind it to
    set:
      service.connectivity: ingress_internal
      documentdbGateway.enabled: true
      service.ingress:
        shard: pgin-0
        entryPoint: pg-20007
        port: 20007
        dnsName: ep-3f9a2c41.internal.example
        shardHost: lb-0.example
    asserts:
      - failedTemplate:
          errorMessage: "service.ingress.documentdbEntryPoint is required to route the documentdb gateway"
