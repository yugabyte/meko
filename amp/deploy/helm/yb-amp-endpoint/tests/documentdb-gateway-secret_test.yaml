suite: documentdb gateway backend URL
templates:
  - templates/documentdb-gateway-secret.yaml
tests:
  # The gateway serves the database compute_ctl creates the extension in, not
  # the default `postgres`: nothing else would find documentdb's schema there.
  - it: points the gateway at the documentdb database over loopback
    set:
      endpoint.extensions:
        - name: documentdb
          image: quay.io/yugabyte/amp-ext-documentdb:0.116-0-r3
          preload: true
          library: pg_documentdb_core,pg_documentdb
    asserts:
      - equal:
          path: stringData.pg-url
          value: "postgresql://cloud_admin@localhost:55433/documentdb?sslmode=disable"

  - it: renders no gateway Secret without the extension
    asserts:
      - hasDocuments:
          count: 0
