suite: deployment
# configmap.yaml is listed so the deployment's `checksum/config` include resolves;
# each test scopes its asserts to the Deployment via `template:`.
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
tests:
  - it: renders a Deployment wired to the ConfigMap
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-yb-amp-endpoint

  - it: defaults the image tag to the chart appVersion
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: yb-amp/neon-endpoint:0.1.0

  - it: honours image repository and tag overrides
    template: templates/deployment.yaml
    set:
      image:
        repository: registry.example.com/yb/endpoint
        tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/yb/endpoint:1.2.3

  - it: mounts no TLS material by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: yb-client-tls
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: yb-ca-bundle
          any: true

  - it: mounts the client certificate Secret and the CA bundle as directories when TLS is on
    template: templates/deployment.yaml
    set:
      tls.enabled: true
      tls.caBundleConfigMap: amp-ca-bundle
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: yb-client-tls
            secret:
              secretName: RELEASE-NAME-yb-amp-endpoint-yb-client-tls
              defaultMode: 0440
      - contains:
          path: spec.template.spec.volumes
          content:
            name: yb-ca-bundle
            configMap:
              name: amp-ca-bundle
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: yb-client-tls
            mountPath: /etc/amp/tls/client
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: yb-ca-bundle
            mountPath: /etc/amp/tls/ca
            readOnly: true

  - it: injects the YB password from a Secret when configured
    template: templates/deployment.yaml
    set:
      yugabyte.password: hunter2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: YB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-yb-amp-endpoint
                key: password

  - it: references an existing Secret + key when provided
    template: templates/deployment.yaml
    set:
      yugabyte.existingSecret: my-yb-secret
      yugabyte.existingSecretKey: yb-pass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: YB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-yb-secret
                key: yb-pass

  - it: defines no password env when no password is configured
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: exposes the compute Postgres port
    template: templates/deployment.yaml
    set:
      endpoint.computePort: 5599
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: pg-compute
            containerPort: 5599
            protocol: TCP

  - it: does not expose internal HTTP ports by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ps-http
            containerPort: 9898
            protocol: TCP

  - it: exposes internal HTTP ports when enabled
    template: templates/deployment.yaml
    set:
      service.exposeInternalHttp: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ps-http
            containerPort: 9898
            protocol: TCP

  - it: mounts an emptyDir scratch volume at /data by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: run
            mountPath: /data
      - equal:
          path: spec.template.spec.volumes[0].name
          value: run
      - exists:
          path: spec.template.spec.volumes[0].emptyDir
      # Single-writer compute => Recreate even for an emptyDir endpoint, so a
      # redeploy never surges a second pod against the storage writer fence.
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: mounts no extension ImageVolumes by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ext-vector
            mountPath: /extensions/vector
            readOnly: true

  - it: mounts each extension as a read-only ImageVolume
    template: templates/deployment.yaml
    set:
      endpoint:
        extensions:
          - name: vector
            image: quay.io/yugabyte/amp-ext-pgvector:0.8.2
            preload: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ext-vector
            mountPath: /extensions/vector
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ext-vector
            image:
              reference: quay.io/yugabyte/amp-ext-pgvector:0.8.2
              pullPolicy: IfNotPresent

  - it: sanitizes the volume name for extension names with underscores
    template: templates/deployment.yaml
    set:
      endpoint:
        extensions:
          - name: pg_cron
            image: quay.io/yugabyte/amp-ext-pg_cron:1.6
            preload: true
    asserts:
      # Volume + mount names must be RFC 1123 labels: '_' -> '-'. The mount path
      # keeps the raw extension name so extension_control_path still resolves.
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ext-pg-cron
            mountPath: /extensions/pg_cron
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ext-pg-cron
            image:
              reference: quay.io/yugabyte/amp-ext-pg_cron:1.6
              pullPolicy: IfNotPresent

  - it: sets fsGroup from podSecurityContext (the image's gid) by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: backs /data with a PVC and Recreate when a storage class is set
    template: templates/deployment.yaml
    set:
      persistence.storageClass: yb-standard
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.volumes[0].name
          value: run
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-yb-amp-endpoint-data
      - notExists:
          path: spec.template.spec.volumes[0].emptyDir
      # fsGroup still makes the root-owned PVC writable (from podSecurityContext).
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: rolls pods when the ConfigMap changes (checksum annotation)
    template: templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: wires startup + liveness + readiness probes to the compute port
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: pg-compute
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: pg-compute
      # The startupProbe is what keeps a slow bootstrap from being mistaken for a
      # hung compute. An endpoint coming up on a branch that already has data
      # rebuilds it from YugabyteDB before Postgres listens, which can far exceed
      # the liveness budget; without this the container is killed mid-bootstrap,
      # restarts from scratch, and loops forever.
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: pg-compute
      # periodSeconds * (failureThreshold - 1) is the bootstrap budget — the
      # prober probes immediately and only then waits on the period, so N
      # failures span N-1 periods. 2 * 300 = 600s. The period is kept short so
      # the kubelet notices a compute that came up promptly; the threshold
      # carries the length. It must stay at or above the controller's deploy
      # timeout, or the kubelet gives up on a pod the controller is still
      # waiting for.
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 2
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 301
      # And the Deployment's own clock has to outlast that budget, or a pod the
      # kubelet is still waiting on is reported as a failed rollout at the k8s
      # default of 600s. A fixed 10s margin above the 600s budget — it also covers
      # pre-container overhead (scheduling, image pull, volume attach) and so is
      # not scaled with the probe period.
      - equal:
          path: spec.progressDeadlineSeconds
          value: 610

  - it: runs the postgres_exporter sidecar by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: postgres-exporter
      - equal:
          path: spec.template.spec.containers[1].image
          value: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            name: pg-metrics
            containerPort: 9187
            protocol: TCP
      # Disables the database collector, matching the VM-image exporter.
      - contains:
          path: spec.template.spec.containers[1].args
          content: --no-collector.database
      # pg_stat_statements is preloaded by default, so the collector is on.
      - contains:
          path: spec.template.spec.containers[1].args
          content: --collector.stat_statements
      # Connects over loopback to the compute port as cloud_admin (trust auth).
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: DATA_SOURCE_NAME
            value: "host=localhost port=55433 user=cloud_admin dbname=postgres sslmode=disable application_name=postgres-exporter options='-c pgaudit.log=none'"
      # Runs non-root with privileges dropped.
      - equal:
          path: spec.template.spec.containers[1].securityContext.runAsNonRoot
          value: true

  - it: annotates the pod for Prometheus scraping when the exporter is on
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9187"

  - it: tracks the compute port in the exporter connection string
    template: templates/deployment.yaml
    set:
      endpoint.computePort: 5599
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: DATA_SOURCE_NAME
            value: "host=localhost port=5599 user=cloud_admin dbname=postgres sslmode=disable application_name=postgres-exporter options='-c pgaudit.log=none'"

  - it: drops the stat_statements collector when the library is not preloaded
    template: templates/deployment.yaml
    set:
      endpoint.sharedPreloadLibraries: "yb_amp"
    asserts:
      # Without the library the view does not exist, so the collector would
      # error on every scrape.
      - notContains:
          path: spec.template.spec.containers[1].args
          content: --collector.stat_statements

  - it: appends extra exporter args
    template: templates/deployment.yaml
    set:
      metrics.postgresExporter.extraArgs:
        - --collector.long_running_transactions
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --collector.long_running_transactions

  - it: omits the sidecar and scrape annotations when disabled
    template: templates/deployment.yaml
    set:
      metrics.postgresExporter.enabled: false
    asserts:
      # Only the endpoint container remains.
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]

  - it: reserves 2 cores / 16Gi with request == limit (Guaranteed QoS) by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "16Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "16Gi"

  # Both values differ from the chart's defaults on purpose: an override that
  # happens to equal the default cannot tell "honoured" from "ignored".
  - it: honours an explicit resources override, keeping request == limit
    template: templates/deployment.yaml
    set:
      endpoint.resources.cpu: "8"
      endpoint.resources.memory: 64Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "8"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "8"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "64Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "64Gi"

  - it: omits resources entirely when cpu/memory are cleared
    template: templates/deployment.yaml
    set:
      endpoint.resources.cpu: ""
      endpoint.resources.memory: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: sets an in-place resize policy on the endpoint container (cpu+memory NotRequired) by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].resizePolicy
          content:
            resourceName: cpu
            restartPolicy: NotRequired
      - contains:
          path: spec.template.spec.containers[0].resizePolicy
          content:
            resourceName: memory
            restartPolicy: NotRequired

  - it: sets a matching resize policy on the postgres-exporter sidecar
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].resizePolicy
          content:
            resourceName: memory
            restartPolicy: NotRequired

  - it: honours a memory RestartContainer resize policy override
    template: templates/deployment.yaml
    set:
      endpoint.resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: RestartContainer
    asserts:
      - contains:
          path: spec.template.spec.containers[0].resizePolicy
          content:
            resourceName: memory
            restartPolicy: RestartContainer

  # ephemeral-storage is the emptyDir's scheduler-visible reservation: sizeLimit
  # alone is an eviction ceiling that reserves nothing, so without the request a
  # node can be given more endpoints than its disk can back.
  - it: requests and limits ephemeral-storage when the controller sets it
    template: templates/deployment.yaml
    set:
      endpoint.resources.ephemeralStorage: "20Gi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: "20Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: "20Gi"

  # A PVC is its own device, so claiming it against the node's ephemeral budget
  # would reserve the same bytes twice; the controller leaves the field empty.
  - it: omits ephemeral-storage when unset
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage

  # envPaths become container env, and their position matters: they are rendered
  # AFTER envFrom: configMapRef, so a registration's key would win over the
  # ConfigMap. That ordering is the whole reason extensions.Validate refuses a
  # variable the endpoint owns.
  - it: renders a registered extension's envPaths as container env, after envFrom
    template: templates/deployment.yaml
    set:
      endpoint:
        extensions:
          - name: postgis
            image: ghcr.io/example/postgis:3.6.2
            envPaths:
              PROJ_DATA: share/proj
              GDAL_DATA: share/gdal
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROJ_DATA
            value: /extensions/postgis/share/proj
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GDAL_DATA
            value: /extensions/postgis/share/gdal
      # The ImageVolume is still mounted at the raw name.
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ext-postgis
            mountPath: /extensions/postgis
            readOnly: true

  - it: renders no extension env for a built-in
    template: templates/deployment.yaml
    set:
      endpoint:
        extensions:
          - name: vector
            image: quay.io/yugabyte/amp-ext-pgvector:0.8.2
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROJ_DATA
            value: /extensions/vector/share/proj

  # The compute password is injected from the chart-managed Secret, never from
  # yugabyte.existingSecret: that one is the YB operator's and holds only the YB
  # password, so pointing at it would make the pod fail to start on a missing key.
  - it: injects the compute password from the chart-managed Secret
    template: templates/deployment.yaml
    set:
      yugabyte.existingSecret: my-yb-secret
      endpoint:
        password: "SCRAM-SHA-256$4096:c2FsdHNhbHRzYWx0c2Ex$c3RvcmVka2V5c3RvcmVka2V5c3RvcmVkazA=:c2VydmVya2V5c2VydmVya2V5c2VydmVyazA="
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPUTE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-yb-amp-endpoint
                key: computePassword

  # A redeploy renders no password (nothing stores the verifier), and so does a
  # pre-credentials endpoint. Either way the env var must be absent rather than
  # referencing a Secret key that is not there — the supervisor then leaves the
  # role's password exactly as the branch's catalog has it.
  - it: omits the compute password when none is set
    template: templates/deployment.yaml
    # controller.url only so an `env:` block renders at all — the assertion is
    # that the password is absent from one that exists, not that nothing does.
    set:
      controller:
        url: http://amp-controller:50051
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROLLER_REACHABLE_HOST
            value: RELEASE-NAME-yb-amp-endpoint.NAMESPACE.svc.cluster.local
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPUTE_PASSWORD
          any: true

  # The gateway sidecar. Its probes must NOT be the functional `check`: readiness
  # is pod-wide, and `check` verifies the documentdb extension is loaded, which
  # nothing in the product creates — gating on it kept every documentdb endpoint
  # out of Ready and failed helm --wait on a healthy compute.
  - it: renders the documentdb gateway sidecar when the branch has documentdb
    template: templates/deployment.yaml
    set:
      endpoint.extensions:
        - name: documentdb
          image: quay.io/yugabyte/amp-ext-documentdb:0.116-0
          preload: true
          library: pg_documentdb_core,pg_documentdb
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 3
      - contains:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].ports
          content:
            name: documentdb
            containerPort: 10260
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].startupProbe.tcpSocket.port
          value: documentdb
      - equal:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].readinessProbe.tcpSocket.port
          value: documentdb
      - isNull:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].readinessProbe.exec
      - isNull:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].startupProbe.exec
      # It binds only after compute_ctl has created the extension, so its startup
      # budget is the endpoint container's, not a short one of its own.
      - equal:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].startupProbe.periodSeconds
          value: 2
      - equal:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].startupProbe.failureThreshold
          value: 301
      - equal:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[?(@.name=="documentdb-gateway")].securityContext.runAsNonRoot
          value: true

  - it: renders no gateway sidecar without documentdb
    template: templates/deployment.yaml
    set:
      endpoint.extensions:
        - name: pgvector
          image: quay.io/yugabyte/amp-ext-pgvector:0.8.2
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2

  - it: lets documentdbGateway.enabled override the extension default off
    template: templates/deployment.yaml
    set:
      endpoint.extensions:
        - name: documentdb
          image: quay.io/yugabyte/amp-ext-documentdb:0.116-0
      documentdbGateway.enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2

  - it: lets documentdbGateway.enabled override it on
    template: templates/deployment.yaml
    set:
      documentdbGateway.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 3
