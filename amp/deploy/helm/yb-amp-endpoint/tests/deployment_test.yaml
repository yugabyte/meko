suite: deployment
# configmap.yaml is listed so the deployment's `checksum/config` include resolves;
# each test scopes its asserts to the Deployment via `template:`.
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
tests:
  - it: renders a Deployment wired to the ConfigMap
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-yb-amp-endpoint

  - it: defaults the image tag to the chart appVersion
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: yb-amp/neon-endpoint:0.1.0

  - it: honours image repository and tag overrides
    template: templates/deployment.yaml
    set:
      image:
        repository: registry.example.com/yb/endpoint
        tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/yb/endpoint:1.2.3

  - it: injects the YB password from a Secret when configured
    template: templates/deployment.yaml
    set:
      yugabyte.password: hunter2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: YB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-yb-amp-endpoint
                key: password

  - it: references an existing Secret + key when provided
    template: templates/deployment.yaml
    set:
      yugabyte.existingSecret: my-yb-secret
      yugabyte.existingSecretKey: yb-pass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: YB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-yb-secret
                key: yb-pass

  - it: defines no password env when no password is configured
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: exposes the compute Postgres port
    template: templates/deployment.yaml
    set:
      endpoint.computePort: 5599
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: pg-compute
            containerPort: 5599
            protocol: TCP

  - it: does not expose internal HTTP ports by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ps-http
            containerPort: 9898
            protocol: TCP

  - it: exposes internal HTTP ports when enabled
    template: templates/deployment.yaml
    set:
      service.exposeInternalHttp: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ps-http
            containerPort: 9898
            protocol: TCP

  - it: mounts an emptyDir scratch volume at /data by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: run
            mountPath: /data
      - equal:
          path: spec.template.spec.volumes[0].name
          value: run
      - exists:
          path: spec.template.spec.volumes[0].emptyDir
      # Single-writer compute => Recreate even for an emptyDir endpoint, so a
      # redeploy never surges a second pod against the storage writer fence.
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: mounts no extension ImageVolumes by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ext-vector
            mountPath: /extensions/vector
            readOnly: true

  - it: mounts each extension as a read-only ImageVolume
    template: templates/deployment.yaml
    set:
      endpoint:
        extensions:
          - name: vector
            image: quay.io/yugabyte/amp-ext-pgvector:0.8.2
            preload: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ext-vector
            mountPath: /extensions/vector
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ext-vector
            image:
              reference: quay.io/yugabyte/amp-ext-pgvector:0.8.2
              pullPolicy: IfNotPresent

  - it: sanitizes the volume name for extension names with underscores
    template: templates/deployment.yaml
    set:
      endpoint:
        extensions:
          - name: pg_cron
            image: quay.io/yugabyte/amp-ext-pg_cron:1.6
            preload: true
    asserts:
      # Volume + mount names must be RFC 1123 labels: '_' -> '-'. The mount path
      # keeps the raw extension name so extension_control_path still resolves.
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ext-pg-cron
            mountPath: /extensions/pg_cron
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ext-pg-cron
            image:
              reference: quay.io/yugabyte/amp-ext-pg_cron:1.6
              pullPolicy: IfNotPresent

  - it: sets fsGroup from podSecurityContext (the image's gid) by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: backs /data with a PVC and Recreate when a storage class is set
    template: templates/deployment.yaml
    set:
      persistence.storageClass: yb-standard
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.volumes[0].name
          value: run
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-yb-amp-endpoint-data
      - notExists:
          path: spec.template.spec.volumes[0].emptyDir
      # fsGroup still makes the root-owned PVC writable (from podSecurityContext).
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: rolls pods when the ConfigMap changes (checksum annotation)
    template: templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: wires startup + liveness + readiness probes to the compute port
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: pg-compute
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: pg-compute
      # The startupProbe is what keeps a slow bootstrap from being mistaken for a
      # hung compute. An endpoint coming up on a branch that already has data
      # rebuilds it from YugabyteDB before Postgres listens, which can far exceed
      # the liveness budget; without this the container is killed mid-bootstrap,
      # restarts from scratch, and loops forever.
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: pg-compute
      # periodSeconds * (failureThreshold - 1) is the bootstrap budget — the
      # prober probes immediately and only then waits on the period, so N
      # failures span N-1 periods. 10 * 60 = 600s. It must stay at or above the
      # controller's deploy timeout, or the kubelet gives up on a pod the
      # controller is still waiting for.
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 61
      # And the Deployment's own clock has to outlast that budget, or a pod the
      # kubelet is still waiting on is reported as a failed rollout at the k8s
      # default of 600s.
      - equal:
          path: spec.progressDeadlineSeconds
          value: 610

  - it: runs the postgres_exporter sidecar by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: postgres-exporter
      - equal:
          path: spec.template.spec.containers[1].image
          value: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            name: pg-metrics
            containerPort: 9187
            protocol: TCP
      # Disables the database collector, matching the VM-image exporter.
      - contains:
          path: spec.template.spec.containers[1].args
          content: --no-collector.database
      # pg_stat_statements is preloaded by default, so the collector is on.
      - contains:
          path: spec.template.spec.containers[1].args
          content: --collector.stat_statements
      # Connects over loopback to the compute port as cloud_admin (trust auth).
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: DATA_SOURCE_NAME
            value: "host=localhost port=55433 user=cloud_admin dbname=postgres sslmode=disable application_name=postgres-exporter options='-c pgaudit.log=none'"
      # Runs non-root with privileges dropped.
      - equal:
          path: spec.template.spec.containers[1].securityContext.runAsNonRoot
          value: true

  - it: annotates the pod for Prometheus scraping when the exporter is on
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9187"

  - it: tracks the compute port in the exporter connection string
    template: templates/deployment.yaml
    set:
      endpoint.computePort: 5599
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: DATA_SOURCE_NAME
            value: "host=localhost port=5599 user=cloud_admin dbname=postgres sslmode=disable application_name=postgres-exporter options='-c pgaudit.log=none'"

  - it: drops the stat_statements collector when the library is not preloaded
    template: templates/deployment.yaml
    set:
      endpoint.sharedPreloadLibraries: "yb_amp"
    asserts:
      # Without the library the view does not exist, so the collector would
      # error on every scrape.
      - notContains:
          path: spec.template.spec.containers[1].args
          content: --collector.stat_statements

  - it: appends extra exporter args
    template: templates/deployment.yaml
    set:
      metrics.postgresExporter.extraArgs:
        - --collector.long_running_transactions
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --collector.long_running_transactions

  - it: omits the sidecar and scrape annotations when disabled
    template: templates/deployment.yaml
    set:
      metrics.postgresExporter.enabled: false
    asserts:
      # Only the endpoint container remains.
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]

  - it: reserves 2 cores / 16Gi with request == limit (Guaranteed QoS) by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "16Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "16Gi"

  # Both values differ from the chart's defaults on purpose: an override that
  # happens to equal the default cannot tell "honoured" from "ignored".
  - it: honours an explicit resources override, keeping request == limit
    template: templates/deployment.yaml
    set:
      endpoint.resources.cpu: "8"
      endpoint.resources.memory: 64Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "8"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "8"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "64Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "64Gi"

  - it: omits resources entirely when cpu/memory are cleared
    template: templates/deployment.yaml
    set:
      endpoint.resources.cpu: ""
      endpoint.resources.memory: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: sets an in-place resize policy on the endpoint container (cpu+memory NotRequired) by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].resizePolicy
          content:
            resourceName: cpu
            restartPolicy: NotRequired
      - contains:
          path: spec.template.spec.containers[0].resizePolicy
          content:
            resourceName: memory
            restartPolicy: NotRequired

  - it: sets a matching resize policy on the postgres-exporter sidecar
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].resizePolicy
          content:
            resourceName: memory
            restartPolicy: NotRequired

  - it: honours a memory RestartContainer resize policy override
    template: templates/deployment.yaml
    set:
      endpoint.resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: RestartContainer
    asserts:
      - contains:
          path: spec.template.spec.containers[0].resizePolicy
          content:
            resourceName: memory
            restartPolicy: RestartContainer

  # ephemeral-storage is the emptyDir's scheduler-visible reservation: sizeLimit
  # alone is an eviction ceiling that reserves nothing, so without the request a
  # node can be given more endpoints than its disk can back.
  - it: requests and limits ephemeral-storage when the controller sets it
    template: templates/deployment.yaml
    set:
      endpoint.resources.ephemeralStorage: "20Gi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: "20Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: "20Gi"

  # A PVC is its own device, so claiming it against the node's ephemeral budget
  # would reserve the same bytes twice; the controller leaves the field empty.
  - it: omits ephemeral-storage when unset
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
