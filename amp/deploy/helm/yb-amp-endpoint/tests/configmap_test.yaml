suite: configmap
templates:
  - templates/configmap.yaml
tests:
  - it: renders a ConfigMap named after the release
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-endpoint

  - it: passes the endpoint id through so overrides can be looked up
    set:
      endpoint:
        endpointId: 3f2b1c4e-0000-4000-8000-000000000001
    asserts:
      - equal:
          path: data.ENDPOINT_ID
          value: "3f2b1c4e-0000-4000-8000-000000000001"

  # Without an id the supervisor must not attempt a lookup at all, so the key is
  # omitted rather than set empty.
  - it: omits the endpoint id when unset
    asserts:
      - notExists:
          path: data.ENDPOINT_ID

  # The supervisor sizes shared_buffers, the parallel-worker GUCs and the
  # pageserver/safekeeper scale_factor from these. They are its FALLBACK — it
  # prefers the container's cgroup limits, which stay correct across an in-place
  # resize — so they must keep matching the requests/limits the Deployment
  # renders from the same values.
  - it: echoes the endpoint's cpu/memory reservation for derived sizing
    set:
      endpoint:
        resources:
          cpu: "4"
          memory: "8Gi"
    asserts:
      - equal:
          path: data.ENDPOINT_CPU
          value: "4"
      - equal:
          path: data.ENDPOINT_MEMORY
          value: "8Gi"

  - it: defaults the reservation echo to the chart's 2 cores / 4Gi
    asserts:
      - equal:
          path: data.ENDPOINT_CPU
          value: "2"
      - equal:
          path: data.ENDPOINT_MEMORY
          value: "4Gi"

  # The LFC must stay inside the /data budget. On the emptyDir path statvfs
  # reports the whole node filesystem (sizeLimit is kubelet-enforced, not a fs
  # quota), so the budget has to be declared here or the cache grows past
  # sizeLimit and the pod is evicted for exceeding ephemeral-storage.
  - it: declares the data-volume budget from the emptyDir sizeLimit by default
    set:
      runDir:
        sizeLimit: 20Gi
    asserts:
      - equal:
          path: data.ENDPOINT_DATA_VOLUME_SIZE
          value: "20Gi"

  - it: declares the data-volume budget from the PVC size when a storage class is set
    set:
      persistence:
        storageClass: standard-rwo
        size: 40Gi
      runDir:
        sizeLimit: 10Gi
    asserts:
      - equal:
          path: data.ENDPOINT_DATA_VOLUME_SIZE
          value: "40Gi"

  - it: carries the YugabyteDB connection block from values
    set:
      yugabyte:
        hostPorts: "ts1:5433,ts2:5433"
        user: yb_admin
        dbname: yb_storage_prod
        sslmode: require
        sslrootcert: /etc/ssl/yb/ca.crt
    asserts:
      - equal:
          path: data.YB_HOST_PORTS
          value: "ts1:5433,ts2:5433"
      - equal:
          path: data.YB_USER
          value: "yb_admin"
      - equal:
          path: data.YB_DBNAME
          value: "yb_storage_prod"
      - equal:
          path: data.YB_SSLMODE
          value: "require"
      - equal:
          path: data.YB_SSLROOTCERT
          value: "/etc/ssl/yb/ca.crt"

  - it: sets YB_PASSWORD_ENV only when a password is configured
    set:
      yugabyte.password: hunter2
    asserts:
      - equal:
          path: data.YB_PASSWORD_ENV
          value: "YB_PASSWORD"

  - it: omits YB_PASSWORD_ENV when no password is configured
    asserts:
      - notExists:
          path: data.YB_PASSWORD_ENV

  - it: sets YB_PASSWORD_ENV when using an existing secret
    set:
      yugabyte.existingSecret: my-yb-secret
    asserts:
      - equal:
          path: data.YB_PASSWORD_ENV
          value: "YB_PASSWORD"

  - it: propagates endpoint + compute settings
    set:
      endpoint:
        pgVersion: "17"
        computePort: 5599
        branchId: "deadbeefdeadbeefdeadbeefdeadbeef"
        sharedPreloadLibraries: "yb_amp,pg_stat_statements"
    asserts:
      - equal:
          path: data.ENDPOINT_PG_VERSION
          value: "17"
      - equal:
          path: data.COMPUTE_PORT
          value: "5599"
      - equal:
          path: data.BRANCH_ID
          value: "deadbeefdeadbeefdeadbeefdeadbeef"
      - equal:
          path: data.SHARED_PRELOAD_LIBRARIES
          value: "yb_amp,pg_stat_statements"
      # User GUCs are NOT carried by the chart: they live on the endpoint's and
      # its branch's pg_settings in amp_registry, which the supervisor reads at
      # start. Only chart-derived extension paths may appear here.
      - equal:
          path: data.COMPUTE_EXTRA_SETTINGS_JSON
          value: "{}"

  - it: leaves preload + settings untouched when no extensions are mounted
    asserts:
      - equal:
          path: data.SHARED_PRELOAD_LIBRARIES
          value: "yb_amp"
      - equal:
          path: data.COMPUTE_EXTRA_SETTINGS_JSON
          value: "{}"

  - it: derives extension_control_path and dynamic_library_path from mounted extensions
    set:
      endpoint:
        extensions:
          - name: vector
            image: quay.io/yugabyte/amp-ext-pgvector:0.8.2
            preload: false
    asserts:
      # A non-preload extension does not touch shared_preload_libraries.
      - equal:
          path: data.SHARED_PRELOAD_LIBRARIES
          value: "yb_amp"
      # The two path GUCs are prepended with the PG18 defaults, then the mount.
      - matchRegex:
          path: data.COMPUTE_EXTRA_SETTINGS_JSON
          pattern: '"extension_control_path":"\$system:/extensions/vector/share/postgresql"'
      - matchRegex:
          path: data.COMPUTE_EXTRA_SETTINGS_JSON
          pattern: '"dynamic_library_path":"\$libdir:/extensions/vector/lib/postgresql"'

  - it: appends preload extensions (using library override) to shared_preload_libraries
    set:
      endpoint:
        extensions:
          - name: pg_cron
            image: quay.io/yugabyte/amp-ext-pg_cron:1.6
            preload: true
          - name: vector
            image: quay.io/yugabyte/amp-ext-pgvector:0.8.2
            preload: false
    asserts:
      - equal:
          path: data.SHARED_PRELOAD_LIBRARIES
          value: "yb_amp,pg_cron"
      - matchRegex:
          path: data.COMPUTE_EXTRA_SETTINGS_JSON
          pattern: '/extensions/pg_cron/share/postgresql:/extensions/vector/share/postgresql'

  - it: applies internal service port overrides
    set:
      ports:
        pageserverHttp: 19898
        safekeeperPg: 15454
    asserts:
      - equal:
          path: data.PAGESERVER_HTTP_PORT
          value: "19898"
      - equal:
          path: data.SAFEKEEPER_PG_PORT
          value: "15454"

  - it: carries supervisor restart policy
    set:
      supervisor:
        restartBackoffSeconds: 3
        maxRestarts: 9
        restartWindowSeconds: 120
    asserts:
      - equal:
          path: data.SUPERVISOR_RESTART_BACKOFF_SECONDS
          value: "3"
      - equal:
          path: data.SUPERVISOR_MAX_RESTARTS
          value: "9"
      - equal:
          path: data.SUPERVISOR_RESTART_WINDOW_SECONDS
          value: "120"
