suite: service
templates:
  - templates/service.yaml
tests:
  - it: exposes the compute Postgres port
    set:
      endpoint.computePort: 5599
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: pg-compute
            port: 5599
            targetPort: pg-compute
            protocol: TCP

  - it: only publishes the compute port by default
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1

  # The gateway port follows the extension: nothing to publish without a gateway
  # to publish it for, and no endpoint should carry a port that reaches nothing.
  - it: publishes no gateway port when the branch has no documentdb
    set:
      endpoint.extensions:
        - name: pgvector
          image: quay.io/yugabyte/amp-ext-pgvector:0.8.2
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - notContains:
          path: spec.ports
          content:
            name: documentdb

  - it: publishes the gateway port when the branch has documentdb
    set:
      endpoint.extensions:
        - name: documentdb
          image: quay.io/yugabyte/amp-ext-documentdb:0.116-0
          preload: true
          library: pg_documentdb_core,pg_documentdb
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - contains:
          path: spec.ports
          content:
            name: documentdb
            port: 10260
            targetPort: documentdb
            protocol: TCP

  - it: honours an explicit documentdbGateway.enabled override in both directions
    set:
      endpoint.extensions:
        - name: documentdb
          image: quay.io/yugabyte/amp-ext-documentdb:0.116-0
      documentdbGateway.enabled: false
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - notContains:
          path: spec.ports
          content:
            name: documentdb

  - it: publishes the gateway port when forced on without the extension
    set:
      documentdbGateway.enabled: true
    asserts:
      - contains:
          path: spec.ports
          content:
            name: documentdb
            port: 10260
            targetPort: documentdb
            protocol: TCP

  - it: publishes internal HTTP ports when enabled
    set:
      service.exposeInternalHttp: true
    asserts:
      # The compute plus the two daemons that serve HTTP. There is no
      # endpoint_storage port: compute_ctl reads and writes LFC state in YB
      # directly, so nothing in the pod serves that surface.
      - lengthEqual:
          path: spec.ports
          count: 3
      - contains:
          path: spec.ports
          content:
            name: sk-http
            port: 7676
            targetPort: sk-http
            protocol: TCP
      - notContains:
          path: spec.ports
          content:
            name: es-http
            port: 9993
            targetPort: es-http
            protocol: TCP

  - it: honours the service type override
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
