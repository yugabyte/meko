suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders a Secret with the inline password
    set:
      yugabyte.password: hunter2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.password
          value: hunter2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-amp-endpoint

  - it: renders nothing when no password is set
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render a chart-managed Secret when an existing Secret is referenced
    set:
      yugabyte.password: hunter2
      yugabyte.existingSecret: my-yb-secret
    asserts:
      - hasDocuments:
          count: 0

  # The compute password lives in the chart-managed Secret, so it has to render
  # even when the YB password is not inline — including alongside an
  # existingSecret, which belongs to whoever runs the YB universe and holds only
  # the YB password.
  - it: renders the compute password
    set:
      endpoint:
        password: "SCRAM-SHA-256$4096:c2FsdHNhbHRzYWx0c2Ex$c3RvcmVka2V5c3RvcmVka2V5c3RvcmVkazA=:c2VydmVya2V5c2VydmVya2V5c2VydmVyazA="
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.computePassword
          value: "SCRAM-SHA-256$4096:c2FsdHNhbHRzYWx0c2Ex$c3RvcmVka2V5c3RvcmVka2V5c3RvcmVkazA=:c2VydmVya2V5c2VydmVya2V5c2VydmVyazA="
      - notExists:
          path: stringData.password

  - it: carries both secrets when the YB password is inline too
    set:
      yugabyte.password: hunter2
      endpoint:
        password: "SCRAM-SHA-256$4096:c2FsdHNhbHRzYWx0c2Ex$c3RvcmVka2V5c3RvcmVka2V5c3RvcmVkazA=:c2VydmVya2V5c2VydmVya2V5c2VydmVyazA="
    asserts:
      - equal:
          path: stringData.password
          value: hunter2
      - equal:
          path: stringData.computePassword
          value: "SCRAM-SHA-256$4096:c2FsdHNhbHRzYWx0c2Ex$c3RvcmVka2V5c3RvcmVka2V5c3RvcmVkazA=:c2VydmVya2V5c2VydmVya2V5c2VydmVyazA="

  - it: renders the compute password alongside an existing YB Secret
    set:
      yugabyte.existingSecret: my-yb-secret
      endpoint:
        password: "SCRAM-SHA-256$4096:c2FsdHNhbHRzYWx0c2Ex$c3RvcmVka2V5c3RvcmVka2V5c3RvcmVkazA=:c2VydmVya2V5c2VydmVya2V5c2VydmVyazA="
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.computePassword
          value: "SCRAM-SHA-256$4096:c2FsdHNhbHRzYWx0c2Ex$c3RvcmVka2V5c3RvcmVka2V5c3RvcmVkazA=:c2VydmVya2V5c2VydmVya2V5c2VydmVyazA="
      - notExists:
          path: stringData.password
