# Stable in-namespace name for this LRU's amp endpoint. up.sh sets externalName
# to the yb-ep-<id> Service once the endpoint exists, so no manifest here
# carries an endpoint id.
apiVersion: v1
kind: Service
metadata:
  name: small-temporal-endpoint
  namespace: amp-lru
  labels:
    lru: small_temporal
spec:
  type: ExternalName
  externalName: placeholder.amp-dev.svc.cluster.local
  ports:
    - name: pg
      port: 55433
