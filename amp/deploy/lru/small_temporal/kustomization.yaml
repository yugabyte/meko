# One LRU: the Temporal server, its Omes load, its health checker, its
# dashboard. Depends on ../monitoring having been applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amp-lru
resources:
  - temporal-dynamicconfig.yaml
  - temporal.yaml
  - temporal-ui.yaml
  - omes.yaml
  - checker.yaml
configMapGenerator:
  - name: small-temporal-checker
    files: [checker/check.py]
  # The shared Grafana's sidecar picks up any ConfigMap with this label.
  - name: small-temporal-dashboard
    # The sidecar names the file on disk after the ConfigMap key, and every LRU
    # writes into one shared directory, so a plain `dashboard.json` means the
    # LRUs silently overwrite each other's dashboard once a minute.
    files: [small-temporal-dashboard.json=dashboard.json]
    options:
      labels:
        grafana_dashboard: "1"
        lru: small_temporal
generatorOptions:
  disableNameSuffixHash: true
