apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidgate-checker
  namespace: amp-lru
  labels:
    app: checker
    lru: solidgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checker
      lru: solidgate
  template:
    metadata:
      labels:
        app: checker
        lru: solidgate
      annotations:
        prometheus.io/scrape: "true"
    spec:
      enableServiceLinks: false
      containers:
        - name: checker
          image: python:3.12-alpine
          # The hourly sync reads the verdict with `kubectl exec ... -- curl`, and
          # this image has none. Installing it here rather than pointing the sync
          # at the driver pod keeps the verdict independent of the driver: a
          # crashlooping workload should read not_ok, not error.
          command: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec python3 -u /app/check.py"]
          env:
            - name: LRU_NAME
              value: solidgate
            # The endpoint id is resolved from the controller by pool, so a
            # recreated endpoint needs no redeploy and no id is tracked in git.
            - name: AMP_POOL
              value: lru-solidgate
            # Read from the workload's own ConfigMap so the rules and the load
            # they are judged against can never drift apart.
            - name: WORKLOAD_DB
              valueFrom:
                configMapKeyRef: { name: solidgate-runner, key: CARD_DB }
            - name: WORKERS
              valueFrom:
                configMapKeyRef: { name: solidgate-runner, key: CONCURRENCY }
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: solidgate-checker
