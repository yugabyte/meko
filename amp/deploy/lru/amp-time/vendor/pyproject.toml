[project]
name = "amp-time"
version = "0.5.9"
description = "PostgreSQL pg_stat_statements timeslices, EXPLAIN, DDL, and statistics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
amp-time = "amp_time.cli:main"
amp-showcase = "amp_showcase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amp_time*", "amp_showcase*"]

[tool.setuptools.package-data]
amp_time = ["web/*"]
amp_showcase = ["web/*"]
