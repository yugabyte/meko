# One LRU: the anonymised ledger payment workload, its health checker, its
# dashboard. Depends on ../monitoring having been applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amp-lru
# `kubectl get all -l lru=transferwise` has to return the whole LRU, generated
# ConfigMaps included. Not a selector: it would rewrite the Deployments'.
labels:
  - pairs:
      lru: transferwise
    includeSelectors: false
resources:
  - runner.yaml
  - checker.yaml
configMapGenerator:
  - name: transferwise-checker
    files: [checker/check.py]
  - name: transferwise-exporter
    files: [exporter.py]
  # main.go carries the schema in string literals, so the converter travels with
  # the driver rather than with a schema file.
  - name: transferwise-driver
    files:
      - workload/main.go
      - workload/go.mod
      - workload/go.sum
      - workload/to_amp_ddl.py
  - name: transferwise-dashboard
    files: [transferwise-dashboard.json=dashboard.json]
    options:
      labels:
        grafana_dashboard: "1"
        lru: transferwise
generatorOptions:
  disableNameSuffixHash: true
