# The transferwise workload: the customer's anonymised ledger payment
# transaction (yugabyte/ledger_bench) run in cycles that never end.
#
# Two things shape this pod. The driver prints only an end-of-run summary, so the
# cycle is short enough that app-side metrics move often. And its -init drops and
# recreates the workload tables, so it runs exactly once, gated on the schema
# being absent rather than on a flag someone has to remember.
apiVersion: v1
kind: ConfigMap
metadata:
  name: transferwise-runner
  namespace: amp-lru
  labels:
    lru: transferwise
data:
  PGHOST: transferwise-endpoint
  PGPORT: "55433"
  PGUSER: cloud_admin
  PGPASSWORD: cloud_admin
  LEDGER_DB: transferwise_lru
  # The driver's own name for its Postgres schema inside that database.
  LEDGER_SCHEMA: ledger_bench
  # A write workflow is one transaction that records a job, a transaction,
  # idempotence rows, financial steps, balance changes, six ledger legs, an audit
  # event, a snapshot and an outgoing message.
  #
  # One thread, down from four. At four this wrote ~86 GB a day, crossed the
  # endpoint's 43 GB file cache inside a day and lost 44% of its throughput over
  # the next fourteen hours. One thread is ~50 payments/s and ~21 GB a day, which
  # buys about a week before the same crossing - long enough to watch it happen
  # rather than to find it afterwards. ledger_bench has no pacing flag, so
  # -threads is the only rate knob there is.
  THREADS: "1"
  POOL_MIN: "1"
  POOL_MAX: "1"
  NON_TX_READERS: "2"
  ACCOUNTS: "20000"
  SETTLEMENT_ACCOUNTS: "1000"
  WRITE_LOCK_MODE: for-update
  # An hour, not fifteen minutes: the driver's per-cycle ANALYZE pass costs five
  # minutes at this table size, and the cost is fixed per cycle. See FINDINGS.
  CYCLE_DURATION: 60m
  # Retention, copied from what TransferWise actually deletes and nothing more:
  # the outbox, and jobs once they are processed. Everything else in this schema
  # accumulates, which is the point - real customers do not delete either, and
  # this is only 12% of the growth.
  RETENTION_INTERVAL_SEC: "60"
  # out_msg_0 is an outbox: a publisher drains it continuously, so minutes is the
  # faithful window, not days.
  OUTBOX_RETENTION: 15 minutes
  # op_job/op_job_blob outlive the outbox because the read workload looks jobs up
  # by id, and a day still keeps every job a reader can hold.
  JOB_RETENTION: 24 hours
  RETENTION_BATCH: "5000"
  retention.sh: |
    #!/bin/sh
    # Deletes in bounded batches so no single statement is long enough to matter
    # to the workload sharing this endpoint, and caps a pass so a long outage
    # cannot turn into one enormous catch-up delete.
    set -eu
    export PGPASSWORD
    export PGOPTIONS="-c search_path=$LEDGER_SCHEMA"
    db() {
      psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$LEDGER_DB" \
           -v ON_ERROR_STOP=1 -X -A -t --no-psqlrc -c "$1" | sed -n 's/^DELETE //p'
    }

    until psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$LEDGER_DB" -X -A -t -c \
          "select 1 from information_schema.tables
           where table_schema = '$LEDGER_SCHEMA' and table_name = 'op_job'" | grep -q 1; do
      echo "waiting for the schema"; sleep 30
    done

    # Both statements pick their victims through an index and then delete
    # through a primary key. The obvious `delete ... where id in (select ...)`
    # does not: the planner hash-joins the subquery against a sequential scan of
    # all 23 million rows, once a minute, forever.
    OUTBOX_SQL="delete from out_msg_0
                where message_id <= (
                  select max(message_id) from (
                    select message_id from out_msg_0
                    where created_at < now() - interval '$OUTBOX_RETENTION'
                    order by message_id limit $RETENTION_BATCH) t)"
    # op_job.txn_id is a nanosecond clock reading, so the (job_status, txn_id)
    # index answers "old and finished" directly and no extra index is needed.
    # The ids are collected once into an array so the blob and the job rows
    # cannot disagree about which jobs are going.
    JOBS_SQL="with doomed as materialized (
                select array_agg(job_id) as ids from (
                  select job_id from op_job
                  where job_status = 'SETTLED'
                    and txn_id < (extract(epoch from now() - interval '$JOB_RETENTION') * 1e9)::bigint
                  order by txn_id limit $RETENTION_BATCH) t),
              blobs as (
                delete from op_job_blob o using doomed d where o.job_id = any(d.ids))
              delete from op_job o using doomed d where o.job_id = any(d.ids)"

    while true; do
      pass=0
      i=0
      while [ "$i" -lt 20 ]; do
        m=$(db "$OUTBOX_SQL"); : "${m:=0}"
        j=$(db "$JOBS_SQL"); : "${j:=0}"
        pass=$((pass + m + j))
        [ "$((m + j))" -gt 0 ] || break
        i=$((i + 1))
      done
      echo "$(date -u +%H:%M:%S) deleted $pass rows"
      sleep "$RETENTION_INTERVAL_SEC"
    done
  seed.sh: |
    #!/bin/sh
    # Decides whether the driver's -init may run. -init drops and recreates the
    # workload tables, so it must happen once in the life of this LRU and never
    # on a pod restart, which would throw away the history it exists to build.
    set -eu
    export PGPASSWORD
    admin() { psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 "$@"; }
    db() { psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$LEDGER_DB" -v ON_ERROR_STOP=1 "$@"; }

    for i in $(seq 1 60); do
      admin -Atqc 'select 1' >/dev/null 2>&1 && break
      echo "waiting for $PGHOST:$PGPORT ($i)"; sleep 5
    done

    if [ -z "$(admin -Atqc "select 1 from pg_database where datname = '$LEDGER_DB'")" ]; then
      admin -c "CREATE DATABASE $LEDGER_DB"
      echo "created database $LEDGER_DB"
    fi

    # pg_stat_statements records no search_path, so amp-time cannot EXPLAIN a
    # statement written against this schema without one on the connection. The
    # database default is the only place every client picks it up.
    admin -c "ALTER DATABASE $LEDGER_DB SET search_path = $LEDGER_SCHEMA, public"

    rm -f /work/needs-init
    if [ -z "$(db -Atqc "select 1 from information_schema.tables where table_schema = '$LEDGER_SCHEMA' and table_name = 'core_account'")" ]; then
      touch /work/needs-init
      echo "no schema yet: the driver will initialise and seed once"
    else
      echo "schema already present, leaving data alone"
    fi
  run.sh: |
    #!/bin/sh
    # Truncating the log per cycle is what the exporter reads as a cycle boundary.
    set -eu
    export HOME=/work GOPATH=/work/go GOCACHE=/work/gocache GOFLAGS=-mod=mod
    export LEDGER_BENCH_DSN="host=$PGHOST port=$PGPORT user=$PGUSER dbname=$LEDGER_DB sslmode=disable connect_timeout=10"

    mkdir -p /work/src
    # The schema lives in Go string literals rather than a .sql file, so the
    # YB-to-Postgres rewrite runs over main.go itself. The converted copy still
    # compiles; keeping the vendored original untouched is what makes a refresh
    # from upstream a plain cp.
    cp /workload/go.mod /workload/go.sum /work/src/
    cp /work/main.pg.go /work/src/main.go
    cd /work/src && go build -trimpath -o /work/bin/ledger_bench .

    SEED_FLAGS="-accounts $ACCOUNTS -settlement-accounts $SETTLEMENT_ACCOUNTS"
    if [ -f /work/needs-init ]; then
      echo "=== one-time init and seed"
      /work/bin/ledger_bench -schema "$LEDGER_SCHEMA" -init -run=false $SEED_FLAGS
      # pg_stat_statements records no search_path, so amp-time cannot EXPLAIN a
    # statement written against this schema without one on the connection. The
    # database default is the only place every client picks it up.
    admin -c "ALTER DATABASE $LEDGER_DB SET search_path = $LEDGER_SCHEMA, public"

    rm -f /work/needs-init
    fi

    while true; do
      : > /work/ledger.log
      echo "=== cycle $(date -u +%Y-%m-%dT%H:%M:%SZ) threads=$THREADS duration=$CYCLE_DURATION" | tee -a /work/ledger.log
      /work/bin/ledger_bench \
        -schema "$LEDGER_SCHEMA" \
        -duration "$CYCLE_DURATION" \
        -threads "$THREADS" \
        -pool-min-conns "$POOL_MIN" \
        -pool-max-conns "$POOL_MAX" \
        -non-tx-readers "$NON_TX_READERS" \
        -write-lock-mode "$WRITE_LOCK_MODE" \
        $SEED_FLAGS \
        2>&1 | tee -a /work/ledger.log || echo "=== cycle exited with $?" | tee -a /work/ledger.log
      sleep 30
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transferwise-runner
  namespace: amp-lru
  labels:
    app: ledger
    lru: transferwise
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ledger
      lru: transferwise
  template:
    metadata:
      labels:
        app: ledger
        lru: transferwise
      annotations:
        prometheus.io/scrape: "true"
    spec:
      enableServiceLinks: false
      initContainers:
        - name: convert-ddl
          image: python:3.12-alpine
          command:
            - /bin/sh
            - -c
            - python3 /workload/to_amp_ddl.py /workload/main.go > /work/main.pg.go
          volumeMounts:
            - { name: driver, mountPath: /workload/main.go, subPath: main.go }
            - { name: driver, mountPath: /workload/to_amp_ddl.py, subPath: to_amp_ddl.py }
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
        - name: seed-gate
          image: postgres:18-alpine
          command: ["/bin/sh", "/etc/ledger/seed.sh"]
          envFrom:
            - configMapRef:
                name: transferwise-runner
          volumeMounts:
            - { name: run, mountPath: /etc/ledger }
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      containers:
        - name: ledger
          image: golang:1.26
          command: ["/bin/sh", "/etc/ledger/run.sh"]
          envFrom:
            - configMapRef:
                name: transferwise-runner
          volumeMounts:
            - { name: run, mountPath: /etc/ledger }
            - { name: driver, mountPath: /workload/go.mod, subPath: go.mod }
            - { name: driver, mountPath: /workload/go.sum, subPath: go.sum }
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
        - name: retention
          image: postgres:18-alpine
          command: ["/bin/sh", "/etc/ledger/retention.sh"]
          envFrom:
            - configMapRef:
                name: transferwise-runner
          volumeMounts:
            - { name: run, mountPath: /etc/ledger }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
        - name: exporter
          image: python:3.12-alpine
          command: [python3, -u, /app/exporter.py]
          env:
            - name: LEDGER_LOG
              value: /work/ledger.log
          ports:
            - name: metrics
              containerPort: 9095
          volumeMounts:
            - { name: exporter, mountPath: /app }
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: run
          configMap: { name: transferwise-runner }
        - name: driver
          configMap: { name: transferwise-driver }
        - name: exporter
          configMap: { name: transferwise-exporter }
        - name: work
          emptyDir: { sizeLimit: 10Gi }
