apiVersion: apps/v1
kind: Deployment
metadata:
  name: transferwise-checker
  namespace: amp-lru
  labels:
    app: checker
    lru: transferwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checker
      lru: transferwise
  template:
    metadata:
      labels:
        app: checker
        lru: transferwise
      annotations:
        prometheus.io/scrape: "true"
    spec:
      enableServiceLinks: false
      containers:
        - name: checker
          image: python:3.12-alpine
          # The hourly sync reads the verdict with `kubectl exec ... -- curl`, and
          # this image has none. Installing it here rather than pointing the sync
          # at the driver pod keeps the verdict independent of the driver: a
          # crashlooping workload should read not_ok, not error.
          command: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec python3 -u /app/check.py"]
          env:
            - name: LRU_NAME
              value: transferwise
            # The endpoint id is resolved from the controller by pool, so a
            # recreated endpoint needs no redeploy and no id is tracked in git.
            - name: AMP_POOL
              value: lru-transferwise
            # Read from the workload's own ConfigMap so the rules and the load
            # they are judged against can never drift apart.
            - name: WORKLOAD_DB
              valueFrom:
                configMapKeyRef: { name: transferwise-runner, key: LEDGER_DB }
            - name: WORKERS
              valueFrom:
                configMapKeyRef: { name: transferwise-runner, key: THREADS }
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        # Everything amp's own exporter does not publish: the checkpointer, per
        # table size and analyze staleness. Those were the series that explained
        # the transferwise slide, and they had to be fetched by hand at the time.
        - name: pgstats
          image: python:3.12-alpine
          command: ["/bin/sh", "-c", "apk add --no-cache postgresql-client >/dev/null && exec python3 -u /app/pgstats.py"]
          env:
            - name: PGHOST
              value: transferwise-endpoint
            - name: PGPORT
              value: "55433"
            - name: PGUSER
              value: cloud_admin
            - name: PGPASSWORD
              value: cloud_admin
            - name: PGDATABASE
              value: transferwise_lru
            - name: PGSCHEMA
              value: ledger_bench
          ports:
            - name: metrics-pg
              containerPort: 9096
          volumeMounts:
            - name: pgstats
              mountPath: /app
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: transferwise-checker
        - name: pgstats
          configMap:
            name: transferwise-pgstats
