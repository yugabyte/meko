# The shared base every LRU plugs into: the namespace, one Prometheus, one
# Grafana. Apply once; each LRU directory applies on top of it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amp-lru
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus/prometheus.yml]
  - name: grafana-datasources
    files: [grafana/datasource.yaml]
  - name: grafana-dashboard-providers
    files: [grafana/dashboards.yaml]
generatorOptions:
  disableNameSuffixHash: true
