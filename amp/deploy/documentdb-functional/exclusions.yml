# Upstream functional tests that are allowlisted upstream but fail on amp, and
# why. amp_gate.py removes them from the allowlist before the gate runs; every
# other allowlisted test must pass (README.md).
#
# One entry per test, by the allowlist's own node ID:
#
#   - id: compatibility/tests/core/.../test_x.py::test_y[param]
#     reason: what differs on amp, and the issue that tracks it
#
# An entry is a known gap, not a waiver: it needs a reason a reviewer can check,
# and it goes when the gap closes. An entry that no longer names an allowlisted
# test fails the run.
# https://github.com/yugabyte/meko/issues/1519 tracks every entry below: geospatial on
# documentdb without postgis.
exclusions:
  - id: compatibility/tests/core/indexes/commands/listIndexes/test_listIndexes_index_types.py::test_listIndexes_index_type[2d]
    reason: 2d/2dsphere indexes cannot be created without postgis's GIST support, so listIndexes cannot list one (#1519)
  - id: compatibility/tests/core/indexes/commands/listIndexes/test_listIndexes_index_types.py::test_listIndexes_index_type[2dsphere]
    reason: 2d/2dsphere indexes cannot be created without postgis's GIST support, so listIndexes cannot list one (#1519)
  - id: compatibility/tests/core/operator/query/geospatial/geoIntersects/test_smoke_geoIntersects.py::test_smoke_geoIntersects
    reason: geospatial needs postgis, which amp does not ship (GPL); documentdb-no-postgis.patch removes its geo GIST operator classes (#1519)
