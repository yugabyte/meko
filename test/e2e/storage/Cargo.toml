# End-to-end test harness. A driver binary (not a `cargo test` target):
# the suite shares one cluster across all scenarios and must run them in
# a fixed order with a corruption-marker gate after each, which the
# default test harness (parallel, unordered) can't express. Invoked as
# `cargo run -p e2e_tests -- fast|slow|all`, or via `test/e2e/storage/run.sh`.
[package]
name = "e2e_tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "e2e_tests"
path = "main.rs"

[dependencies]
e2e_common = { path = "../libs/e2e_common" }
anyhow.workspace = true
nix.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
tokio-postgres.workspace = true
reqwest = { workspace = true, features = ["json"] }
# Direct pageserver GetPage@LSN testing (direct_getpage scenario).
pageserver_client_grpc.workspace = true
pageserver_page_api.workspace = true
pageserver_api.workspace = true
utils.workspace = true
bytes.workspace = true
workspace_hack.workspace = true
