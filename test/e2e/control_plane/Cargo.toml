# controller-on-Docker e2e suite. A thin driver binary that drives controller's REST
# API (user -> storage pool -> project -> branch -> endpoint) and runs Postgres
# against the endpoints controller provisions, validating copy-on-write branch
# isolation. Invoked via test/e2e/control_plane/run-controller.sh, which starts
# controller in Docker and passes its base URL in AMP_BASE_URL.
[package]
name = "e2e_control_plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "e2e_control_plane"
path = "main.rs"

[dependencies]
e2e_common = { path = "../libs/e2e_common" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { workspace = true, features = ["json"] }
workspace_hack.workspace = true
