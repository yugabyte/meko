# End-to-end test harness. A driver binary (not a `cargo test` target):
# the suite shares one cluster across all scenarios and must run them in
# a fixed order with a corruption-marker gate after each, which the
# default test harness (parallel, unordered) can't express. Invoked as
# `cargo run -p e2e_tests -- fast|slow|all`, or via `test/e2e/run.sh`.
[package]
name = "e2e_tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "e2e_tests"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
tokio-postgres.workspace = true
reqwest = { workspace = true, features = ["json"] }
workspace_hack.workspace = true
