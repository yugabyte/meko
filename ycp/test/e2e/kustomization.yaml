# E2E overlay: the ycp-demo manifest, adapted to run on a throwaway kind cluster
# from locally-built images.
#
# It patches rather than copies ycp-demo.yaml so the thing under test stays the
# real deploy manifest — if the demo drifts, the e2e drifts with it.
#
# Three differences from the demo:
#   1. Real images instead of the `alpine` wait-then-exec shim, so no `kubectl cp`
#      step: the container's own ENTRYPOINT runs. This is what makes the e2e a
#      test of the images we publish to ECR.
#   2. ClusterIP instead of LoadBalancer — kind has no cloud LB, so the console is
#      reached by port-forward. The GKE internal-LB annotation goes with it.
#   3. DPMCP_IMAGE points at the locally-built dpmcp so nothing is pulled from a
#      registry the kind node cannot reach.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../deploy

patches:
  - target:
      kind: Deployment
      name: ycp
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ycp
        namespace: ycp-demo
      spec:
        template:
          spec:
            containers:
              - name: ycp
                image: ycp:e2e
                command: null
                args: null

  - target:
      kind: Deployment
      name: meko-agent
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: meko-agent
        namespace: ycp-demo
      spec:
        template:
          spec:
            containers:
              - name: agent
                image: meko-agent:e2e
                command: null
                args: null
                env:
                  - name: DPMCP_IMAGE
                    value: dpmcp:e2e

  # A JSON patch, not a strategic merge: annotations are map[string]string, so a
  # `key: null` merge would set the literal string "null" instead of removing it.
  - target:
      version: v1
      kind: Service
      name: ycp
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /metadata/annotations/networking.gke.io~1load-balancer-type
