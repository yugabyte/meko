# The meko-agent under test, enrolling into the control plane in controlplane.yaml.
#
# Applied by run.sh only AFTER an environment has been registered through the fleet
# API with this run's api_key_id. The agent authenticates with the dev-mode headers
# (admin secret + that id) — there is no YBM in this cluster to mint or validate a
# real key. run.sh substitutes __API_KEY_ID__ before applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meko-agent
  namespace: ycp-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meko-agent-e2e
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  # services/secrets/configmaps cover the Meko stack (database, mcp-server,
  # rag-worker) and the agent's own meko-agent-state Secret (identity + outage
  # caches, no credential). update is what lets it replace that state in place.
  # patch is server-side apply, which is how the stack reconcilers converge —
  # without it a declared component is created once and never updated again.
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meko-agent-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meko-agent-e2e
subjects:
  - kind: ServiceAccount
    name: meko-agent
    namespace: ycp-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-agent
  namespace: ycp-e2e
  labels: { app: meko-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: meko-agent } }
  template:
    metadata:
      labels: { app: meko-agent }
    spec:
      serviceAccountName: meko-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: meko-agent
          image: meko-agent:e2e
          imagePullPolicy: Never
          env:
            # Carries the subpath the control plane is mounted under (see
            # MEKO_YCP_BASE_PATH in controlplane.yaml) plus the /api/v1 base the
            # agent routes hang off — the direct-to-meko shape. run.sh
            # substitutes __BASE_PATH__ from $BASE before applying.
            - { name: YCP_URL, value: "http://meko-api-server.ycp-e2e.svc.cluster.local:80__BASE_PATH__/api/v1" }
            - { name: ENV_NAME, value: "e2e-cell" }
            - { name: ENV_PLACEMENT, value: "cloud" }
            - { name: ENV_PROVIDER, value: "kind" }
            - { name: ENV_REGION, value: "local" }
            # Dev-mode identity: no YBM here, so the agent sends these as the
            # headers YBM would have stamped after validating a real key.
            - name: YCP_DEV_ADMIN_SECRET
              valueFrom: { secretKeyRef: { name: ycp-e2e-secrets, key: admin-api-key } }
            - { name: YCP_DEV_API_KEY_ID, value: "__API_KEY_ID__" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
