openapi: 3.0.3

info:
  title: amp controller API
  version: 0.1.0
  description: |
    Control-plane REST API for the **amp controller** (amp-controller): the
    control plane for a single placement group. See `controller/architecture/`.

    The resource ladder is **storage pool → cluster → branch → endpoint**. Users
    are a basic, *unauthenticated* notion of an identity; there is no auth yet
    (the user/grant model is designed but authentication is deferred).

    - **Users** — created and fetched by id, and listed. A user owns the storage
      pools it creates.
    - **Storage pools** — *top-level* resources (not nested under a user): any
      user can create a pool (passing its `owner_user_id`) and becomes its owner.
      Pool sharing (pool grants) is out of scope here, but a pool is addressed by
      its own id because multiple users will eventually act on it. Listing
      returns every pool.
    - **Clusters** — a cluster (a "database") in a pool. Create and delete are
      **asynchronous** (`202` + a `Task` + a `Location: /api/v1/tasks/{id}`
      header): the worker creates the cluster **and its default branch** (and the
      controller's pending-init recipe), or cascades the delete to the
      cluster's branches and endpoints. The default branch id is the storage-layer
      branch id verbatim (the storage layer is flat — a cluster maps to no storage
      object). Poll the task, then read the cluster to see its `default_branch`.
    - **Branches** — create / list / get / delete a branch in a cluster. Create
      and delete are **asynchronous** (`202` + a `Task` + a `Location` header).
      *Create* forks an existing branch (the parent, defaulting to the cluster's
      default branch) into a new branch, recording its fork ancestry
      (`parent_branch_id`, `fork_lsn`) and inheriting the parent's Postgres
      version. Branches can fork off the default branch or off another branch.
      *Delete* cascades to the branch's endpoints.
    - **Endpoints** — the compute bound to a branch; listed under the branch.
      Create and delete are **asynchronous** (`202` + a `Task` + a `Location`
      header): the worker deploys (resp. retires) one container/pod per endpoint.
    - **Tasks** — the write-ahead log of long-running operations. Every mutation
      above returns a `Task`; poll `getTask` (or `listTasks`) until it reaches a
      terminal status (`succeeded` / `failed`).

    **Pagination.** List endpoints take `limit` and `offset` query parameters
    (values outside the documented range are clamped) and return a `total` (the
    count of *all* matching items, ignoring `limit`/`offset`) alongside a `count`
    (the number of items in *this* response).

    Every non-2xx response uses the same `Error` envelope. `500` is possible on
    any operation; it is documented per operation so generated clients get a
    typed handle.

    The spec is the source of truth: server stubs and the Go client are
    generated from this file (`oapi-codegen`), and the controller serves both
    this document (`GET /api/v1/openapi.yaml`) and an interactive explorer
    (`GET /api/v1/docs`).

servers:
  - url: /api/v1
    description: Versioned API root (the controller serves the API under /api/v1).

tags:
  - name: users
    description: A basic, unauthenticated notion of a user.
  - name: storage-pools
    description: Storage pools (≈ a Meko datapack); top-level, created and owned by a user.
  - name: clusters
    description: Clusters (databases) in a pool. Create and delete are async (202 + Task); create records the cluster and its default branch, delete cascades to its branches and endpoints.
  - name: branches
    description: Branches (timelines) in a cluster. Create and delete are async (202 + Task); create forks an existing branch, delete cascades to the branch's endpoints.
  - name: endpoints
    description: Compute endpoints bound to a branch; create/delete are asynchronous tasks (202 + Task + Location) — one container/pod per endpoint.
  - name: tasks
    description: Status of long-running operations (the write-ahead task log).
  - name: migrations
    description: Voyager database migrations — assess a source Postgres, provision an AMP target, and run the offline migration. Reads derive live status; mutations (assess/target/migrate) are async (202 + Task).

paths:
  /version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: Controller build version
      description: Returns the controller's semantic version, git commit, and build date (stamped at build time).
      responses:
        '200':
          description: Build version info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: Creates a user and returns it. No authentication; the new id is how a caller addresses resources as this user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools:
    post:
      tags: [storage-pools]
      operationId: createStoragePool
      summary: Create a storage pool
      description: Creates a storage pool owned by the user named in `owner_user_id`. Pool names are unique across the placement group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoragePoolRequest'
      responses:
        '201':
          description: Storage pool created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [storage-pools]
      operationId: listStoragePools
      summary: List storage pools
      description: Lists every storage pool in the placement group. Owner filtering is out of scope for now (pool sharing is deferred).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of storage pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePoolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
    get:
      tags: [storage-pools]
      operationId: getStoragePool
      summary: Get a storage pool
      responses:
        '200':
          description: The storage pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [storage-pools]
      operationId: updateStoragePool
      summary: Rename a storage pool
      description: >-
        Renames the pool. Allowed at any time and on any pool — a name is a label,
        not an identity, and nothing addresses a pool by it. `409` if another live
        pool already holds the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoragePoolRequest'
      responses:
        '200':
          description: The renamed storage pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [storage-pools]
      operationId: deleteStoragePool
      summary: Delete an empty storage pool
      description: |
        Deletes the pool and frees its name for reuse. Synchronous — a pool with
        nothing in it owns no compute to retire, so there is no task to poll.

        `409` while the pool still holds a live cluster; delete those first. A
        cluster that has already been deleted does **not** block this, even though
        its row survives: clusters are tombstoned rather than removed, and waiting
        on a tombstone would make the pool permanently undeletable.

        The pool is itself tombstoned rather than removed, for the same reason its
        clusters are — their rows keep a `storage_pool_id` referencing it. It stops
        appearing in `listStoragePools`, `getStoragePool` returns `404`, and its
        name is immediately available to a new pool.
      responses:
        '204':
          description: The storage pool was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters:
    parameters:
      - $ref: '#/components/parameters/PoolId'
    post:
      tags: [clusters]
      operationId: createCluster
      summary: Create a cluster (and its default branch) in a pool
      description: |
        Plans an asynchronous task that creates a cluster (a "database") in the
        pool together with its default branch and the storage
        controller's pending-init recipe, and returns `202` + the `Task` with a
        `Location` header pointing at it. The default branch id is the storage-layer
        branch id verbatim (the storage layer is flat — a cluster maps to no storage
        object). Poll the task, then read the cluster to see its `default_branch`.
        Cheap validation is synchronous (`400` bad body / unsupported `pg_version`,
        `404` unknown pool); a duplicate cluster name surfaces as a `failed` task,
        not a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [clusters]
      operationId: listClusters
      summary: List the clusters in a pool
      description: >-
        Lists the clusters in the pool, each with its default branch. By default
        the list is scoped to usable clusters; pass `include_failed=true` (e.g.
        from an operator's fleet view) to also surface clusters whose creation
        failed, so they can be seen and deleted. Returns 404 if the pool does not
        exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/IncludeFailed'
      responses:
        '200':
          description: A page of clusters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
    get:
      tags: [clusters]
      operationId: getCluster
      summary: Get a cluster
      description: Returns the cluster (with its default branch). Returns 404 if the pool or cluster does not exist.
      responses:
        '200':
          description: The cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [clusters]
      operationId: deleteCluster
      summary: Delete a cluster
      description: |
        Plans an asynchronous `delete_cluster` cascade task that retires the
        cluster's endpoints, drops its branches, then drops the cluster row, and
        returns `202` + the `Task` with a `Location` header. A cheap synchronous
        pre-check returns `404` if the pool or cluster does not exist.
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches/{branchId}/extensions:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/BranchId'
    post:
      tags: [branches]
      operationId: addBranchExtensions
      summary: Enable externalized extensions on a branch
      description: |
        Plans an asynchronous `add_branch_extensions` task that unions the given
        extensions into this branch's set and redeploys every endpoint on the
        branch so the new ImageVolume mounts take effect, returning `202` + the
        `Task` with a `Location` header. Adding extensions is per branch. Idempotent
        (an already-enabled extension is a no-op). Cheap validation is synchronous:
        `400` for an empty list, an unknown extension name, or when externalized
        extensions are unavailable (e.g. the Docker driver); `404` if the pool,
        cluster, or branch does not exist. **First-writer-wins**: while an add for
        this branch is in flight, a concurrent one is rejected with `409` until the
        first reaches a terminal state — the task redeploys every endpoint on the
        branch, so two at once would run concurrent upgrades of the same release.
        See compute/architecture/extensions.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBranchExtensionsRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
    post:
      tags: [branches]
      operationId: createBranch
      summary: Branch (fork) a branch into a new branch
      description: |
        Plans an asynchronous task that forks a branch (the parent) in the cluster
        into a new branch, and returns `202` + the `Task` with a `Location` header.
        The parent defaults to the cluster's default branch; pass
        `parent_branch_id` to fork off another branch (branch-of-branch). The new
        branch records its fork ancestry (`parent_branch_id`, `fork_lsn`) and
        inherits the parent's Postgres version. The fork point defaults to the
        parent's latest LSN; pass `fork_point_lsn` to branch at an earlier point.
        Like create-cluster, the branch is recorded as a recipe and materialized
        lazily by the first endpoint deployed on it — no compute is started here.
        Cheap validation is synchronous (`400` bad body / bad `fork_point_lsn` /
        no endpoint on the parent, `404` unknown pool / cluster / parent); a
        duplicate branch name surfaces as a `failed` task, not a `409`. A parent
        whose endpoint is deployed but whose safekeeper is not answering yet gets
        `503` — the fork is valid, just not resolvable yet, so retry it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [branches]
      operationId: listBranches
      summary: List the branches in a cluster
      description: Lists the branches in the cluster (the default branch plus its forks). Returns 404 if the pool or cluster does not exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/BranchId'
    get:
      tags: [branches]
      operationId: getBranch
      summary: Get a branch
      description: Returns the branch. Returns 404 if the pool, cluster, or branch does not exist.
      responses:
        '200':
          description: The branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [branches]
      operationId: deleteBranch
      summary: Delete a branch
      description: |
        Plans an asynchronous `delete_branch` cascade task that retires the
        branch's endpoints, then drops the branch row, and returns `202` + the
        `Task` with a `Location` header. Cheap synchronous pre-checks return `404`
        if the pool / cluster / branch does not exist, or `409` if the branch has
        child branches (the parent FK is `RESTRICT`, so the delete would be doomed).
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches/{branchId}/settings:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/BranchId'
    patch:
      tags: [branches]
      operationId: updateBranchSettings
      summary: Update a branch's settings
      description: |
        Replaces the branch-wide settings named in the body and leaves the rest
        alone — an omitted field is "do not touch", not "clear", so a caller that
        knows about one surface cannot blank another it has never heard of. To
        clear a surface, send it as `{}`.

        These are the **baseline** for every compute on the branch; an endpoint's
        own `pg_settings` merge over them and win on a shared key.

        Applied to running endpoints on a best-effort basis: the controller
        writes the row, then asks each of the branch's endpoints to re-read it.
        Each endpoint applies what it can in place and restarts only what it
        must: a Postgres setting that can change while the server is running is
        reloaded (`reloaded`), one fixed at server start restarts the compute
        (`restarted`, with `restart_forced_by` naming the setting), and a change
        to a storage daemon's config is a restart because those have no reload
        path. A setting nothing can apply — compiled in, or a name Postgres does
        not know — is reported in `not_applied` rather than restarted for, since
        a restart would not put it in force either. A write that renders identical config does nothing. An endpoint
        that cannot be reached is reported in `unreachable`; the row is still
        written, so it picks the change up when it next starts.


        **A setting Postgres will not take is refused, not stored.** Before the
        row is written the branch's `read_write` endpoint is asked whether its
        Postgres would accept the names and values, and a `400` names each one it
        would not, with why. Only that endpoint can answer: the version judging
        them is the one in its image, and an extension's setting does not exist
        until that extension is loaded.

        The check is skipped when there is no writer to ask — a branch whose
        endpoints are all read replicas, or which has none yet, is still
        configurable, because its settings are the baseline whatever starts on it
        next will use. It is also skipped when the writer cannot be reached, so a
        write is never blocked on a compute being up; anything unusable then comes
        back in `not_applied` as before.

        `404` if the pool, cluster, or branch does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchSettingsRequest'
      responses:
        '200':
          description: The settings now stored, and what they could not be applied to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches/{branchId}/endpoints:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/BranchId'
    post:
      tags: [endpoints]
      operationId: createEndpoint
      summary: Create and deploy an endpoint on a branch
      description: |
        Plans an asynchronous task that records an endpoint on the addressed
        branch, deploys it (one container/pod per endpoint), and records its
        `address`; returns `202` + the `Task` with a `Location` header. Poll the
        task, then read the endpoint to see its id + `address`. A branch admits at
        most one `read_write` endpoint (the single-writer rule); a second one
        surfaces as a `failed` task, not a `409`. Requires the endpoint deployer
        (`--deploy`); returns `501` otherwise. `404` if the pool / cluster / branch
        does not exist.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [endpoints]
      operationId: listEndpoints
      summary: List the endpoints bound to a branch
      description: Lists the compute endpoints bound to the branch. Returns 404 if the pool, cluster, or branch does not exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches/{branchId}/endpoints/{endpointId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/EndpointId'
    get:
      tags: [endpoints]
      operationId: getEndpoint
      summary: Get an endpoint
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [endpoints]
      operationId: deleteEndpoint
      summary: Retire an endpoint
      description: |
        Plans an asynchronous `delete_endpoint` task that removes the endpoint's
        running instance and then deletes the endpoint record, and returns `202` +
        the `Task` with a `Location` header. Requires the endpoint deployer
        (`--deploy`); returns `501` otherwise. `404` if the pool / cluster / branch
        / endpoint does not exist.
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches/{branchId}/endpoints/{endpointId}/settings:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/EndpointId'
    patch:
      tags: [endpoints]
      operationId: updateEndpointSettings
      summary: Update an endpoint's settings
      description: |
        Replaces the endpoint's settings named in the body and leaves the rest
        alone — an omitted field is "do not touch", not "clear". To clear a
        surface, send it as `{}`.

        `pg_settings` merge over the branch's and win on a shared key;
        `pageserver_settings` and `safekeeper_settings` are this endpoint's
        alone.

        Applied on a best-effort basis: the controller writes the row, then asks
        the endpoint to re-read it. The endpoint reloads what can change while
        the server is running (`reloaded`) and restarts only what cannot
        (`restarted`, with `restart_forced_by` naming the Postgres setting that
        forced it); a storage daemon's config has no reload path, so a change
        there is a restart. A setting nothing can apply — compiled in, or a name
        Postgres does not know — is reported in `not_applied` rather than
        restarted for. A write that renders identical config does nothing.
        An endpoint that cannot be reached is reported in `unreachable`; the row
        is still written, so it picks the change up when it next starts.


        **A setting Postgres will not take is refused, not stored.** Before the
        row is written this endpoint is asked whether its Postgres would accept
        the names and values — it is the pod that will apply them, and for a read
        replica it may be the only one up — and a `400` names each one it would
        not, with why. If it cannot be reached the write goes ahead unchecked
        rather than being blocked on a compute being up.

        `404` if the pool, cluster, branch, or endpoint does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpointSettingsRequest'
      responses:
        '200':
          description: The settings now stored, and what they could not be applied to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/clusters/{clusterId}/branches/{branchId}/endpoints/{endpointId}/resize:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/EndpointId'
    post:
      tags: [endpoints]
      operationId: resizeEndpoint
      summary: Resize an endpoint's compute (in place)
      description: |
        Plans an asynchronous `resize_endpoint` task that changes the endpoint's
        CPU/memory reservation. It persists the new size (so a redeploy keeps it),
        updates the workload's desired resources, and resizes the **running pod in
        place** via the Kubernetes `resize` subresource (no restart when the node
        has capacity). Returns `202` + the `Task` with a `Location` header; poll
        the task, whose result reports whether the in-place resize completed
        (`completed`), was deferred (`pending`), could not be satisfied
        (`infeasible`), or is unsupported by the runtime (`unsupported`, e.g. the
        Docker deployer). CPU/memory are applied as request == limit (Guaranteed
        QoS preserved). **First-writer-wins**: while a resize of this endpoint is
        in flight, a concurrent resize is rejected with `409` until the first
        reaches a terminal state. Requires the endpoint deployer (`--deploy`);
        returns `501` otherwise. `404` if the pool / cluster / branch / endpoint
        does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeEndpointRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /endpoint-upgrades:
    post:
      tags: [endpoints]
      operationId: upgradeEndpoints
      summary: Roll endpoints onto a target version
      description: |
        Plans an asynchronous `upgrade_endpoints` task that moves every live
        endpoint — or the subset named by `endpoint_ids` — onto `version` (an
        opaque string the deployer knows how to run; today the endpoint image
        tag). Returns `202` + the `Task` with a `Location` header.

        The task is one parent that owns a child per endpoint and runs them
        itself, at most `max_parallel` at a time, persisting the target version
        and redeploying each endpoint — so the pod is replaced and the endpoint
        is briefly down. Poll the task: its result carries one line per endpoint
        (`upgraded` / `skipped` / `failed` / `unattempted`), and
        `GET /tasks/{taskId}/subtasks` has each child's own status, result and
        error. Children are not tasks, so a roll of N endpoints adds one row to
        `GET /tasks`, not N.

        **Fail-fast**: the first child failure stops new children from starting;
        the ones already running finish, and the task fails. **One roll at a
        time**: a second roll WAITS on the fleet lock rather than being refused,
        so re-firing a half-failed roll queues behind the first.

        A whole-fleet roll skips endpoints already recorded at `version`; an
        endpoint named in `endpoint_ids` is **never** skipped, which is how an
        operator re-runs what a partial roll left behind (the recorded version is
        what was asked for, not what is running). Only the request is validated —
        an id that no longer exists comes back as a `skipped` line, not a `404`,
        since a roll is never refused because one of its endpoints cannot move.
        `400` for a missing `version` or an out-of-range `max_parallel`. Requires
        the endpoint deployer (`--deploy`); returns `501` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeEndpointsRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks
      description: Lists write-ahead tasks, most recent first, optionally filtered by status, kind, or cluster.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          required: false
          description: Only return tasks in this status.
          schema:
            type: string
            enum: [pending, running, succeeded, failed]
        - name: kind
          in: query
          required: false
          description: Only return tasks of this kind (e.g. create_cluster, delete_branch).
          schema:
            type: string
        - name: cluster_id
          in: query
          required: false
          description: Only return tasks scoped to this cluster.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get the status of a task
      description: Returns the status of a write-ahead task so a caller can poll a long-running operation.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}/subtasks:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskSubtasks
      summary: List a task's subtasks
      description: |
        Returns the children a fan-out task owns — one per endpoint for an
        `upgrade_endpoints` roll — each with its own status, result and error.
        This is where a roll's per-endpoint detail lives; the parent's `result`
        summarizes it. Oldest first, and not paginated: a parent's children come
        back whole. Empty for a task that fanned out to none. `404` if the task
        does not exist.
      responses:
        '200':
          description: The task's subtasks, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /migrations/connectivity-checks:
    post:
      tags: [migrations]
      operationId: checkMigrationConnectivity
      summary: Test source database reachability
      description: |
        Dials the source Postgres directly (from inside the cluster) and reports
        whether it is reachable, its server version, SSL state, and round-trip
        latency. Stateless — nothing is persisted, and it may be called before any
        migration exists. A source that cannot be reached is still a `200` with
        `reachable=false` and a redacted `error`; only a malformed request is
        `400`. Credentials are never persisted or echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationConnectivityRequest'
      responses:
        '200':
          description: The connectivity probe result (reachable or not).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationConnectivity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /migrations:
    post:
      tags: [migrations]
      operationId: createMigration
      summary: Create a migration
      description: |
        Records a migration entity from a name and a source Postgres
        configuration, and returns it synchronously (`201`). No side effects: the
        export volume and any target compute are created later by the assess /
        target / migrate operations. The source password is stored for the Voyager
        jobs but never returned in any response. `400` if the body is malformed or
        the source is not a supported `postgresql` database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMigrationRequest'
      responses:
        '201':
          description: Migration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Migration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [migrations]
      operationId: listMigrations
      summary: List migrations
      description: |
        Lists migrations, most recent first. Lightweight: `state` is derived from
        persisted rows only (no live deployer calls), so it may lag a per-migration
        GET until the next status read.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of migrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /migrations/{migrationId}:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [migrations]
      operationId: getMigration
      summary: Get a migration's status
      description: |
        The primary polling surface. Derives status on read: merges the migration
        row, the latest run per operation, the live deployer job state, and
        Voyager's visualizer rows (phases + per-table data progress). Passwords
        never appear in the response. `404` if the migration does not exist.
      responses:
        '200':
          description: The migration and its derived status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Migration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /migrations/{migrationId}/assessment:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [migrations]
      operationId: getMigrationAssessment
      summary: Get the parsed assessment report
      description: |
        Returns the agent-relevant projection of the latest completed assessment
        (Voyager's `AssessMigrationPayloadYugabyteD`): migration complexity, source
        database size facts, a compute sizing recommendation, and the flattened
        issues — enough to size the migration target. `404` if no completed
        assessment exists for the migration yet.
      responses:
        '200':
          description: The parsed assessment report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationAssessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /migrations/{migrationId}/assess:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      operationId: startMigrationAssessment
      summary: Start an assessment run
      description: |
        Plans an asynchronous launcher task that records an assess run and submits
        the Voyager assess job, and returns `202` + the `Task` with a `Location`
        header. Poll `GET /migrations/{migrationId}` (not the task) to track the
        job — the task only covers the launch. `404` if the migration does not
        exist; `409` if a run is already in flight for it. Requires the Voyager
        job runner; returns `501` otherwise.
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /migrations/{migrationId}/provision-target:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      operationId: provisionMigrationTarget
      summary: Provision and attach the migration target
      description: |
        Plans an asynchronous task that provisions a right-sized AMP compute (a
        project, its default branch, and a read_write endpoint) and attaches it to
        the migration as its target, and returns `202` + the `Task` with a
        `Location` header. Size the target with `vcpu` (chosen by the agent from
        the assessment). `404` if the migration does not exist; `409` if a target
        is already attached or a provision task is already in flight. Requires the
        endpoint deployer; returns `501` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionMigrationTargetRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /migrations/{migrationId}/migrate:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      operationId: startMigration
      summary: Start the offline migration
      description: |
        Plans an asynchronous launcher task that records a migrate run and submits
        the Voyager migrate job, and returns `202` + the `Task` with a `Location`
        header. Requires a target to be attached first (`409 target_not_attached`
        otherwise). Optional `parallel_jobs` tunes `import data --parallel-jobs`
        (defaults to `8`). Poll `GET /migrations/{migrationId}`
        to track the job. `404` if the migration does not exist; `409` if a run is
        already in flight. Requires the Voyager job runner; returns `501` otherwise.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMigrationRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: The user's id.
      schema:
        type: string
        format: uuid
    PoolId:
      name: poolId
      in: path
      required: true
      description: The storage pool's id.
      schema:
        type: string
        format: uuid
    ClusterId:
      name: clusterId
      in: path
      required: true
      description: The cluster's id (a control-plane id; maps to no storage object).
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: path
      required: true
      description: The branch's id (the storage-layer branch id verbatim).
      schema:
        type: string
        format: uuid
    EndpointId:
      name: endpointId
      in: path
      required: true
      description: The endpoint's id.
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      description: The task's id.
      schema:
        type: string
        format: uuid
    MigrationId:
      name: migrationId
      in: path
      required: true
      description: The migration's id.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Clamped to 1..1000; defaults to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip from the start of the result set. Negative values are clamped to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    IncludeFailed:
      name: include_failed
      in: query
      required: false
      description: >-
        Whether to include clusters whose creation failed (an orphan left behind
        when a `create_cluster` task failed mid-provisioning). Defaults to
        `false` — the list is scoped to usable clusters, which is what a picker,
        a count, or a client that operates on each result wants. Pass `true`
        (e.g. from an operator's fleet view) to also surface the failed orphans so
        they can be seen and deleted. Affects both the returned page and its total
        count, so pagination stays consistent.
      schema:
        type: boolean
        default: false

  responses:
    Accepted:
      description: The request was accepted; a task was planned to perform the work.
      headers:
        Location:
          description: The URL of the planned task (poll it for status).
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Task'
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with existing state (e.g. a duplicate name).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: >-
        The request is valid but cannot be served yet; retry it. Either a
        dependency the request needs is not answering yet (a parent branch's
        safekeeper on `createBranch`), or the controller's state store was
        unreachable — a transient condition that clears, as opposed to the `500`
        that means the controller itself is at fault.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: An unexpected error occurred serving the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Version:
      type: object
      required: [version, git_commit, build_date]
      properties:
        version:
          type: string
          description: 'Hybrid CalVer version from the repo-root VERSION file (MAJOR.YYMMDD.PATCH, e.g. "0.260714.0"); "dev" for an un-stamped build.'
        git_commit:
          type: string
          description: Short git commit the binary was built from.
        build_date:
          type: string
          description: UTC RFC-3339 build timestamp.
    User:
      type: object
      required: [id, is_admin, created_at]
      properties:
        id:
          type: string
          format: uuid
        is_admin:
          type: boolean
          description: Admins skip all pool/cluster grants. Until auth lands, anyone may create an admin.
        created_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Optional explicit id — e.g. an external identity subject (the Meko
            user id) so AMP and the caller share one identity. Omit to
            auto-generate. Idempotent: re-creating an existing id is a no-op.
        is_admin:
          type: boolean
          default: false
          description: Create the user as an admin.

    UserList:
      type: object
      required: [users, total, count]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    StoragePool:
      type: object
      required: [id, name, owner_user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    StoragePoolList:
      type: object
      required: [storage_pools, total, count]
      properties:
        storage_pools:
          type: array
          items:
            $ref: '#/components/schemas/StoragePool'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateStoragePoolRequest:
      type: object
      required: [name, owner_user_id]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Optional explicit id — e.g. a Meko datapack UUID, so the pool and
            the datapack share one id (no separate mapping). Omit to
            auto-generate. Idempotent: re-creating a live pool's id returns it.
            An id belonging to a deleted pool is a `409` — a tombstone keeps the
            primary key, so ids are never reusable the way names are.
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: Pool name; unique across the placement group.
        owner_user_id:
          type: string
          format: uuid
          description: The user that will own the pool.

    UpdateStoragePoolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: The pool's new name; unique among live pools.

    CreateClusterRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Cluster (database) name; unique within the pool. The cluster's default branch is always named "main".
        pg_version:
          type: integer
          description: Postgres major version for the cluster's default branch. Defaults to 18.
        with_writer:
          type: boolean
          description: When true, also create and deploy the default branch's read_write (write) endpoint in the same task, so the new cluster is immediately connectable ("create cluster" = the cluster + its writer). Compute size comes from `resources`. When false (default), no endpoint is created — compute is provisioned separately.
        resources:
          $ref: '#/components/schemas/EndpointResources'
        engine:
          type: string
          enum: [postgres, aidb, oracle]
          default: postgres
          description: |
            The database engine to provision as — a named bundle of externalized
            extensions. `postgres` (the default) seeds none, `aidb` seeds
            pgvector + age + pg_cron, and `oracle` seeds hexabridge. The bundle is
            unioned with `extensions` and written onto the default branch, and the
            engine is recorded on the cluster and returned by getCluster /
            listClusters. An unknown engine is rejected (400), as is any non-default
            engine when externalized extensions are unavailable (e.g. the Docker
            driver). Recording it is provenance, not a constraint: extensions stay
            add-only per branch, so the bundle remains a subset of what the branch
            carries. See compute/architecture/extensions.md.
        extensions:
          type: array
          items:
            type: string
          description: |
            Externalized PostgreSQL extensions to enable on the cluster's default
            branch ("main"), by catalog name (e.g. `pgvector`). Every endpoint on
            that branch mounts them, and a fork inherits the set; add more to a
            branch later with addBranchExtensions. An unknown name is rejected
            (400), as is any value when externalized extensions are unavailable
            (e.g. the Docker driver). Empty/omitted enables only the catalog
            defaults. See compute/architecture/extensions.md.

    Cluster:
      type: object
      required: [id, storage_pool_id, name, created_at, default_branch]
      properties:
        id:
          type: string
          format: uuid
          description: The cluster id (a control-plane id; maps to no storage object).
        storage_pool_id:
          type: string
          format: uuid
          description: The storage pool this cluster belongs to.
        name:
          type: string
        created_at:
          type: string
          format: date-time
        default_branch:
          $ref: '#/components/schemas/Branch'
        engine:
          type: string
          description: |
            The engine the cluster was provisioned as (`postgres`, `aidb`,
            `oracle`) — see createCluster. Provenance: it named the extensions
            seeded at create, and is not re-derived when a branch adds more.
        extensions:
          type: array
          items:
            type: string
          description: |
            Externalized PostgreSQL extensions enabled on the cluster's default
            branch ("main"), by catalog name (e.g. `pgvector`), surfaced here as
            the cluster's set. Each branch carries its own set (a fork inherits its
            parent's; see getBranch and addBranchExtensions). Set at createCluster;
            empty when none. Excludes the catalog defaults, which are added per
            endpoint at deploy time.

    AddBranchExtensionsRequest:
      type: object
      required: [extensions]
      properties:
        extensions:
          type: array
          items:
            type: string
          minItems: 1
          description: |
            Externalized PostgreSQL extensions to enable on this branch, by catalog
            name (e.g. `pgvector`). Unioned into the branch's set (idempotent); an
            unknown name is rejected (400). Every existing endpoint on the branch is
            redeployed to mount the new set. See compute/architecture/extensions.md.
        ycp_generation:
          $ref: '#/components/schemas/YCPGenerationApplied'

    ClusterList:
      type: object
      required: [clusters, total, count]
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    Branch:
      type: object
      required: [cluster_id, branch_id, name, pg_version, is_default, created_at]
      properties:
        cluster_id:
          type: string
          format: uuid
          description: The cluster (control-plane grouping) this branch belongs to.
        branch_id:
          type: string
          format: uuid
          description: The branch id (the storage-layer branch id verbatim).
        name:
          type: string
        pg_version:
          type: integer
        is_default:
          type: boolean
          description: True for a cluster's default (root) branch.
        parent_branch_id:
          type: string
          format: uuid
          nullable: true
          description: The branch this one was forked from, or null for a cluster's default branch. Always in the same cluster.
        fork_lsn:
          type: string
          nullable: true
          description: The ancestor LSN this branch was forked at (storage-layer "X/X" form), or null for a default branch.
        extensions:
          type: array
          items:
            type: string
          description: |
            Externalized PostgreSQL extensions enabled on this branch, by catalog
            name (e.g. `pgvector`); the names every endpoint on it mounts. A fork
            inherits its ancestor's set at fork time, and addBranchExtensions adds
            more to this branch. Excludes the catalog defaults, which are added per
            endpoint at deploy time. Empty when none.
        pg_settings:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra PostgreSQL settings applied to every compute on this branch, as
            `{name: value}`. A fork inherits its ancestor's. An endpoint's own
            `pg_settings` merge over these and win on a key both define.
        write_token_settings:
          $ref: '#/components/schemas/WriteTokenSettings'
        ycp_generation:
          $ref: '#/components/schemas/YCPGenerationObserved'
        created_at:
          type: string
          format: date-time

    BranchList:
      type: object
      required: [branches, total, count]
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Name for the new branch; unique within the cluster.
        parent_branch_id:
          type: string
          format: uuid
          description: The branch to fork from. Defaults to the cluster's default branch; set it to branch off another branch.
        fork_point_lsn:
          type: string
          description: |
            The ancestor LSN to branch at (storage-layer "X/X" form, e.g.
            "0/16ABCD0"). Omit to branch at the parent's latest LSN.
        pg_settings:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra PostgreSQL settings for the new branch, as `{name: value}`.
            They merge over what the branch inherits from its ancestor and win on
            a key both define. Omit to inherit unchanged.

    Endpoint:
      type: object
      required: [id, cluster_id, branch_id, role, name, address, tailnet_address, created_at]
      properties:
        id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
          description: The cluster (control-plane grouping) this endpoint is bound to.
        branch_id:
          type: string
          format: uuid
          description: The branch (storage-layer branch id) this endpoint is bound to.
        role:
          type: string
          enum: [read_write, read_only]
        name:
          type: string
          description: 'The caller''s handle for this endpoint, unique among its branch''s endpoints. Empty when the endpoint was created without one.'
        address:
          type: string
          description: 'Client connection address (host:port) for the Postgres wire protocol (user cloud_admin, database postgres). Empty until the endpoint is deployed.'
        tailnet_address:
          type: string
          description: 'Tailscale (tailnet) connection address (host:port), when the endpoint Service is exposed on the tailnet. Empty when not tailnet-exposed.'
        resources:
          $ref: '#/components/schemas/EndpointResources'
          description: |
            The endpoint's current compute reservation (cpu/memory), as stored in
            its config. Fields are empty for endpoints created before resource
            tracking. Use POST .../resize to change it.
        extended_config:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            The `extended_config` this endpoint was created with, verbatim, or
            `null` if it has none. Opaque — the control plane stores and forwards
            it without interpreting it.
        pg_settings:
          type: object
          additionalProperties:
            type: string
          description: |
            This endpoint's OWN extra PostgreSQL settings. The settings its
            compute actually runs with are its branch's merged with these, these
            winning on a key both define — so read the branch's too if you want
            the effective set.
        pageserver_settings:
          $ref: '#/components/schemas/DaemonSettings'
          description: This endpoint's pageserver overrides, as stored.
        safekeeper_settings:
          $ref: '#/components/schemas/DaemonSettings'
          description: This endpoint's safekeeper overrides, as stored.
        version:
          type: string
          description: |
            The version this endpoint is recorded as running — an opaque string
            the deployer knows how to run (today the endpoint image tag). Absent
            when unknown: the endpoint predates version tracking, or nothing has
            reported one. Never guessed from the controller's configured default.
        ycp_generation:
          $ref: '#/components/schemas/YCPGenerationObserved'
        created_at:
          type: string
          format: date-time

    UpdateBranchSettingsRequest:
      type: object
      description: |
        Branch-wide settings to replace. Every field is optional and an omitted
        one is left as it is; send `{}` for a surface to clear it.
      properties:
        pg_settings:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra PostgreSQL settings as `{name: value}`. Replaces what is
            stored; `{}` clears them.
        write_token_settings:
          $ref: '#/components/schemas/WriteTokenSettings'

    UpdateEndpointSettingsRequest:
      type: object
      description: |
        This endpoint's settings to replace. Every field is optional and an
        omitted one is left as it is; send `{}` for a surface to clear it.
      properties:
        pg_settings:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra PostgreSQL settings as `{name: value}`. Replaces what is
            stored; `{}` clears them.
        pageserver_settings:
          $ref: '#/components/schemas/DaemonSettings'
        safekeeper_settings:
          $ref: '#/components/schemas/DaemonSettings'

    YCPGenerationApplied:
      type: integer
      format: int64
      nullable: true
      description: |
        The YCP (Yugabyte Control Plane) desired-state generation this call
        applies. Recorded on the target resource by the task worker once every step
        of the task has succeeded, and echoed back as the resource's
        `ycp_generation` — so the reconcile agent can tell an update that landed
        from one whose asynchronous task never finished. Omit it: it is for the
        reconcile agent, and any other caller leaves the recorded value untouched.

    YCPGenerationObserved:
      type: integer
      format: int64
      nullable: true
      description: |
        The highest YCP desired-state generation fully applied to this resource,
        written by the task worker only after every step of the task carrying it
        succeeded — so it means the work landed, not that a `202` was returned.
        Monotonic: a task carrying an older generation that completes after a newer
        one leaves the newer value standing. `null` when no YCP update has ever been
        applied, which is every resource YCP does not manage and every one it has
        only created.

    WriteTokenSettings:
      type: object
      additionalProperties: true
      description: |
        How the supervisor holds this branch's write lease
        (`compute/architecture/compute-fencing.md`). `ttl_ms` is the lease
        length; `renew_seconds` is how often it is renewed, and must be under
        the TTL — the gap is how long a failing renewal may be retried before
        anything stops writing.

        On the branch and not the endpoint because the lease is one row per
        branch: every endpoint on it contends for that row, so two endpoints
        disagreeing about the TTL would not be an override, just whichever
        renewed last.

        Empty means the supervisor's own defaults. Read when an endpoint
        starts.
      example:
        ttl_ms: 15000
        renew_seconds: 5

    SettingsUpdateResult:
      type: object
      required: [applied]
      description: |
        What was stored, and what could not be applied to a running endpoint.
        The row is written either way — an endpoint that could not be told
        picks the change up when it next starts.
      properties:
        applied:
          type: boolean
          description: Whether the settings were persisted. False never appears with a 200.
        endpoints:
          type: array
          description: |
            One entry per running endpoint the change was pushed to. Absent for
            a branch with no endpoints.
          items:
            $ref: '#/components/schemas/EndpointSettingsOutcome'

    SettingNotApplied:
      type: object
      required: [name, reason]
      description: One stored setting that is not in force, and why.
      properties:
        name:
          type: string
          description: The setting's name, as it was stored.
        reason:
          type: string
          description: |
            Why it is not in force. A fixed phrase, safe to show a person and
            safe to compare on:

            - `unrecognized parameter` — Postgres does not know this name,
              usually a typo. Never an extension's setting: a name with a dot in
              it is always accepted.
            - `invalid value` — the name is real, the value is not usable for it.
            - `cannot be set in a configuration file` — compiled into the binary
              (`pg_settings.context = 'internal'`), like `block_size`.
            - `refused by Postgres` — refused for a reason none of the above
              covers. The endpoint's log carries Postgres's own message.
            - `nothing applies this setting` — Postgres accepts it in the file,
              but neither a reload nor a restart puts it in force.

    EndpointSettingsOutcome:
      type: object
      required: [endpoint_id]
      description: What one endpoint did with the change.
      properties:
        endpoint_id:
          type: string
          format: uuid
        reloaded:
          type: array
          description: |
            Services that took the change in place, without an interruption.
            For the compute this means Postgres reloaded its configuration and
            kept its connections.
          items:
            type: string
        restart_forced_by:
          type: array
          description: |
            The Postgres settings that forced a restart. Postgres fixes these at
            server start (`pg_settings.context = 'postmaster'`), so they cannot
            be applied any other way — naming them explains a cost that would
            otherwise look arbitrary.
          items:
            type: string
        restarted:
          type: array
          description: |
            Services the endpoint restarted onto the new config. Empty means
            nothing changed for that endpoint — a settings write that renders
            identical config costs nothing, so only what actually moved is
            bounced.

            Restarting the compute bounces Postgres, so this is the field to
            watch: a setting Postgres fixes at server start interrupts that
            endpoint's connections, and `restart_forced_by` names it. A setting
            that can change while the server is running is reloaded instead and
            appears in `reloaded`.
          items:
            type: string
        not_applied:
          type: array
          description: |
            Settings that are stored but not in force, and never will be until
            they are changed. Two reasons, both reported here:

            Postgres refuses the setting — a name it does not recognise, or a
            value it cannot parse. These are deliberately left out of the config
            file the compute reads, because a file containing one does not load:
            a reload of it applies nothing, and the next start fails outright. A
            setting like this cannot break the endpoint, but it also does nothing.

            Or nothing applies it: a `pg_settings.context = 'internal'` setting
            is compiled into the binary, so neither a reload nor a restart can
            change it.

            Either way the endpoint is not interrupted, which makes this field
            the only signal that the edit had no effect.

            A name with a dot in it is always written — Postgres takes it as a
            placeholder — so it is never refused. It does appear here with
            `nothing applies this setting` while the extension that defines it is
            not loaded, because until then Postgres does not report the setting
            and nothing can put the value in force.
          items:
            $ref: '#/components/schemas/SettingNotApplied'
        unreachable:
          type: string
          description: |
            Why this endpoint could not be told, when it could not be. The
            settings are still stored.

    DaemonSettings:
      type: object
      additionalProperties: true
      description: |
        Overrides for one of the two storage daemons in an endpoint's pod, as a
        flat `{key: value}` object merged into that daemon's toml at pod start.
        They beat every resource-derived default the supervisor computes.

        **Keys may be dotted paths.** `a.b` addresses a nested toml table, which
        is how the pageserver's GC knobs are reached at all — they live in
        `tenant_config`, not at the top level:

        ```json
        {"tenant_config.enable_gc": true, "tenant_config.pitr_interval": "7 days"}
        ```

        **Values must be scalars** (boolean, integer, float, string). The nesting
        is expressed entirely in the key; a nested object as a *value* is
        rejected. Durations and byte sizes are strings in the daemons' own format
        (`"7 days"`, `"1 GiB"`).

        Validated against a key set generated from the daemons' own config types,
        so an unknown key, a wrong-typed value, or a protected identity/wiring key
        (`branch_id`, the `listen_*` addresses, `yb_storage_conn`,
        `pg_distrib_dir`, `control_plane_api`, `safekeeper_pg_addr`) is a `400`
        rather than a pod that will not start.

        Applied at pod start, so a change takes effect on the endpoint's next
        start — there is no live-reload path today.

    EndpointList:
      type: object
      required: [endpoints, total, count]
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateEndpointRequest:
      type: object
      properties:
        name:
          type: string
          description: |
            A handle for the endpoint, unique among its branch's endpoints (two
            branches may each have a `primary`). Optional — an endpoint is always
            addressable by its `id`. `409` if the name is already taken on the
            branch.
        role:
          type: string
          enum: [read_write, read_only]
          default: read_write
          description: The endpoint's role. A branch admits at most one read_write endpoint.
        pg_settings:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra PostgreSQL settings for THIS endpoint, as `{name: value}`.
            They merge over the branch's `pg_settings` and win on a key both
            define, so this is the per-endpoint override of a branch-wide
            baseline.
        pageserver_settings:
          $ref: '#/components/schemas/DaemonSettings'
          description: |
            Overrides for the pageserver running in this endpoint's pod, merged
            into its `pageserver.toml` at pod start. See `DaemonSettings` for the
            key form — in particular, the GC knobs are nested and must be given
            as dotted paths (`tenant_config.enable_gc`).
        safekeeper_settings:
          $ref: '#/components/schemas/DaemonSettings'
          description: |
            Overrides for the safekeeper running in this endpoint's pod, merged
            into its `safekeeper.toml` at pod start. See `DaemonSettings`.
        extended_config:
          type: object
          additionalProperties: true
          description: |
            Per-endpoint compute configuration the control plane stores and
            passes to the deployer **without interpreting**: extra PostgreSQL
            settings, and for a locally-deployed compute
            (`--deploy-driver=local`) the ports it binds. Kept verbatim under
            `config.extended`, nested so a key here can never collide with a
            field the control plane owns.

            Opaque by design — the control plane makes no promise about what any
            key means; that is a contract between the caller and whatever
            deploys the compute.
        disk_type:
          type: string
          enum: [network, local]
          default: network
          description: |
            Backing disk for the endpoint's data volume. `network` (the default)
            provisions a network-attached block volume from the controller's
            configured storage class (e.g. EBS on AWS, Persistent Disk on GCP).
            `local` (a node-local instance SSD, typically NVMe) is not yet
            supported and is rejected with 400.
        resources:
          $ref: '#/components/schemas/EndpointResources'

    EndpointResources:
      type: object
      description: |
        CPU + memory reserved for the endpoint's compute pod. Each value is a
        Kubernetes resource quantity and is applied as BOTH the request and the
        limit on the endpoint container, so the pod is scheduled with the
        **Guaranteed** QoS class. Omit the object (or either field) to take the
        defaults of 2 CPU cores and the memory those cores are owed (16Gi at the
        standard 8 GiB per vCPU).
      properties:
        cpu:
          type: string
          default: "2"
          description: |
            CPU reservation as a Kubernetes quantity (e.g. "2", "1500m",
            "500m"). Applied as both the request and the limit. Defaults to "2"
            (2 cores) when omitted.
        memory:
          type: string
          # Deliberately no `default:`. It is not a constant — it is `cpu` times
          # the control plane's ratio — so declaring one would be false, and any
          # consumer that honours spec defaults (a generated client, a validator
          # added later) would send 16Gi alongside a cpu of 4 and get the 400
          # this field exists to avoid.
          description: |
            Memory reservation as a Kubernetes quantity, with an explicit unit
            of Mi or larger (e.g. "16Gi", "512Mi", "1500M"). Applied as both the
            request and the limit. A unitless value is a byte count, so "4" would
            reserve four bytes and leave the endpoint unresizable; it is rejected
            with 400, as are the milli suffix and Ki/k.

            Omitted, it follows `cpu` at the control plane's memory-per-vCPU
            ratio — 8 GiB per core by default, so the 2-core default gets 16Gi
            and 8 cores get 64Gi. Naming only `cpu` is therefore enough.

            That ratio is also a **floor**: less memory per core is a `400`
            naming the minimum for the CPU asked for. More is accepted — a
            working set that needs it is a real request; less produces an
            endpoint that starts and then cannot hold its own cache, which
            surfaces as a slow database rather than a wrong request.

    ResizeEndpointRequest:
      type: object
      required: [resources]
      description: |
        Request to change an existing endpoint's compute reservation. cpu/memory
        are applied as request == limit, so the pod keeps its Guaranteed QoS class
        (a prerequisite for in-place resize).
      properties:
        resources:
          $ref: '#/components/schemas/EndpointResources'
        ycp_generation:
          $ref: '#/components/schemas/YCPGenerationApplied'

    UpgradeEndpointsRequest:
      type: object
      required: [version]
      description: |
        Request to move endpoints onto a target version. The version is opaque to
        the controller — the deployer decides what it selects; today it is the
        endpoint image tag verbatim.
      properties:
        version:
          type: string
          description: |
            The target version. Required and non-empty: an empty version would
            clear the endpoint's pinned desired state rather than leave it alone.
        endpoint_ids:
          type: array
          description: |
            The endpoints to roll. Absent or empty means the whole fleet.
            Repeated ids are collapsed. An endpoint named here is rolled even if
            it is already recorded at the target, which is what makes this the
            remedy after a partial roll.
          items:
            type: string
            format: uuid
        max_parallel:
          type: integer
          minimum: 1
          maximum: 50
          default: 4
          description: |
            How many endpoints to roll at once. An upgrade replaces the pod, so
            this is how much of the fleet is down at a time. It is also the only
            bound on a roll's concurrency — the children run in-process off the
            parent's single execution slot, so `--task-max-concurrent` does not
            apply to them. Defaults to 4; 0 is rejected rather than read as
            unbounded.

    Task:
      type: object
      required: [id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        cluster_id:
          type: string
          format: uuid
          nullable: true
        target_ref:
          type: string
          nullable: true
        params:
          description: The originating request, as opaque JSON.
        result:
          description: |
            The task's final step result, as opaque JSON — the user-facing
            outcome once the task has run. For a `resize_endpoint` task it carries
            `in_place_resize` (`completed` | `pending` | `infeasible` |
            `unsupported`) and `in_place_message`. For a succeeded
            `upgrade_endpoints` roll it carries `version`, the `upgraded` /
            `skipped` / `failed` / `unattempted` counts, and an `endpoints` array
            of `{endpoint_id, outcome, reason, subtask_id}` lines. Absent until a
            step records a result — including on a FAILED task, whose account is
            its `error` plus `GET /tasks/{taskId}/subtasks`.
        error:
          type: string
          nullable: true
        ycp_generation:
          type: integer
          format: int64
          nullable: true
          description: |
            The YCP desired-state generation this task applies to its target, when
            it was planned from YCP desired state; `null` for a task an operator or
            the UI planned directly. Stamped onto the target resource (as its own
            `ycp_generation`) once every step has succeeded, so a task that is
            `failed` here has NOT advanced it. `kind` and `target_ref` say which
            resource.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskStatus:
      type: string
      description: |
        The lifecycle state of a task, or of one of its subtasks — they share it,
        because a subtask is one step with durable status.
      enum: [pending, running, succeeded, failed]

    TaskList:
      type: object
      required: [tasks, total, count]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    Subtask:
      type: object
      required: [id, task_id, kind, status, created_at, updated_at]
      description: |
        One child of a fan-out task: a single registered step with durable
        status, not a task with a step list. `kind` is a **step** kind (e.g.
        `upgrade_endpoint`), never a task kind, and a subtask never appears in
        `GET /tasks`.
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: The parent task this child belongs to.
        kind:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        args:
          description: |
            The child's inputs, as opaque JSON — for an `upgrade_endpoint` child,
            its `endpoint_id` and `version`.
        result:
          description: The child's step result, as opaque JSON. Absent until it succeeds.
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubtaskList:
      type: object
      required: [subtasks, count]
      properties:
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/Subtask'
        count:
          type: integer
          description: The number of subtasks returned (all of the parent's; this list is not paginated).

    TotalCount:
      type: integer
      description: The number of items matching the request across all pages (ignores limit/offset).

    PageCount:
      type: integer
      description: The number of items returned in this response (this page).

    MigrationState:
      type: string
      description: |
        The migration's lifecycle state, derived on read from the migration row,
        its runs, and the live Voyager job.
      enum:
        - created
        - assessing
        - assessed
        - provisioning_target
        - target_ready
        - migrating
        - completed
        - failed

    MigrationSourceRequest:
      type: object
      description: The source database connection, as supplied by the caller. The password is stored for the Voyager jobs but is never returned in any response.
      required: [db_type, host, port, username, password, database, schemas]
      properties:
        db_type:
          type: string
          enum: [postgresql]
          description: Source database engine. Only `postgresql` is supported.
        host:
          type: string
          minLength: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
        password:
          type: string
          description: Source password. Stored for the Voyager jobs; never returned.
        database:
          type: string
          minLength: 1
        schemas:
          type: array
          items:
            type: string
          minItems: 1
          description: Schemas to migrate. Required — list at least one schema explicitly (e.g. `[public]`), matching the Voyager CLI's explicit-scope behavior.

    MigrationSource:
      type: object
      description: The source database connection as returned in responses — the password is intentionally omitted.
      required: [db_type, host, port, username, database]
      properties:
        db_type:
          type: string
          enum: [postgresql]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        database:
          type: string
        schemas:
          type: array
          items:
            type: string

    MigrationTarget:
      type: object
      description: The attached AMP compute the migrate job imports into. Populated once a target is provisioned and attached; the password is never returned.
      required: [endpoint_id, cluster_id, pool_id, host, port, username, database]
      properties:
        endpoint_id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        pool_id:
          type: string
          format: uuid
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        database:
          type: string

    MigrationRunDeployerMetadata:
      type: object
      description: |
        Safe, credential-free runtime reference to the deployer job backing a run
        (e.g. the Kubernetes namespace/job or the Docker container). Shape varies
        by deployer; common Kubernetes fields are documented below.
      additionalProperties: true
      properties:
        namespace:
          type: string
        job_name:
          type: string
        job_uid:
          type: string
        volume:
          type: string
        container_id:
          type: string

    MigrationRun:
      type: object
      description: One assess or migrate attempt. Credentials never appear here.
      required: [operation, attempt, status]
      properties:
        operation:
          type: string
          enum: [assess, migrate]
        attempt:
          type: integer
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        deployer_type:
          type: string
          nullable: true
          description: The deployer that ran the job (e.g. `kubernetes`, `docker`); null until the job is launched.
        deployer_metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/MigrationRunDeployerMetadata'
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
          description: The launcher task that owns this run.
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_summary:
          type: string
          nullable: true
          description: A short, credential-free failure summary; null unless the run failed.

    MigrationVoyagerPhase:
      type: object
      description: One Voyager workflow phase (Voyager's fixed phase number and its name), with its latest status.
      required: [phase, name, status]
      properties:
        phase:
          type: integer
          description: Voyager's fixed phase identifier (non-contiguous — e.g. import-schema is 5, export-data is 4).
        name:
          type: string
          description: 'Human phase name (e.g. export-schema, import-data).'
        status:
          type: string
          enum: [not_started, in_progress, completed]
        updated_at:
          type: string
          format: date-time

    MigrationTableProgress:
      type: object
      description: Per-table row progress for a data phase (row counts only — Voyager does not emit byte counts).
      required: [schema, table, status, rows_completed, rows_total]
      properties:
        schema:
          type: string
        table:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, done, completed]
        rows_completed:
          type: integer
          format: int64
        rows_total:
          type: integer
          format: int64

    MigrationPhaseDataProgress:
      type: object
      description: Aggregate and per-table row progress for one data direction (export or import).
      required: [rows_completed, rows_total, tables]
      properties:
        rows_completed:
          type: integer
          format: int64
        rows_total:
          type: integer
          format: int64
        tables:
          type: array
          items:
            $ref: '#/components/schemas/MigrationTableProgress'

    MigrationDataProgress:
      type: object
      description: Data-copy progress for the migrate operation. Each direction is null until that phase produces rows.
      properties:
        export:
          type: object
          allOf:
            - $ref: '#/components/schemas/MigrationPhaseDataProgress'
          nullable: true
        import:
          type: object
          allOf:
            - $ref: '#/components/schemas/MigrationPhaseDataProgress'
          nullable: true

    MigrationVoyager:
      type: object
      description: Voyager's own view of the migration, read from its visualizer tables. Null before the first run writes any rows.
      required: [phases]
      properties:
        phases:
          type: array
          items:
            $ref: '#/components/schemas/MigrationVoyagerPhase'
        data_progress:
          type: object
          allOf:
            - $ref: '#/components/schemas/MigrationDataProgress'
          nullable: true

    Migration:
      type: object
      description: A migration and its derived status.
      required: [id, name, state, detail, source, runs, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: '#/components/schemas/MigrationState'
        detail:
          type: string
          description: Human-readable, chat-ready status detail (e.g. "importing data (4,103/6,704 rows)").
        source:
          $ref: '#/components/schemas/MigrationSource'
        target:
          type: object
          allOf:
            - $ref: '#/components/schemas/MigrationTarget'
          nullable: true
          description: The attached target compute; null until a target is provisioned.
        runs:
          type: array
          description: The latest attempt per operation (assess and/or migrate).
          items:
            $ref: '#/components/schemas/MigrationRun'
        voyager:
          type: object
          allOf:
            - $ref: '#/components/schemas/MigrationVoyager'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MigrationSummary:
      type: object
      description: The lightweight migration projection used in list responses (persisted state only).
      required: [id, name, state, detail, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: '#/components/schemas/MigrationState'
        detail:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MigrationList:
      type: object
      required: [migrations, total, count]
      properties:
        migrations:
          type: array
          items:
            $ref: '#/components/schemas/MigrationSummary'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateMigrationRequest:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
          minLength: 1
          description: Human name for the migration.
        source:
          $ref: '#/components/schemas/MigrationSourceRequest'

    MigrationConnectivityRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/MigrationSourceRequest'

    MigrationConnectivity:
      type: object
      description: The result of a source-connectivity probe. `reachable=false` is still a 200; the failure detail is in `error` (credentials redacted).
      required: [reachable]
      properties:
        reachable:
          type: boolean
        server_version:
          type: string
          nullable: true
          description: The source server version string, when reachable.
        ssl:
          type: boolean
          nullable: true
          description: Whether the connection negotiated SSL, when reachable.
        latency_ms:
          type: integer
          format: int64
          nullable: true
          description: Connect + probe round-trip latency in milliseconds, when reachable.
        error:
          type: string
          nullable: true
          description: A redacted failure reason when `reachable=false`.

    ProvisionMigrationTargetRequest:
      type: object
      required: [pool_id]
      properties:
        pool_id:
          type: string
          format: uuid
          description: The storage pool to create the target project in.
        vcpu:
          type: integer
          minimum: 0
          description: Target compute size in vCPU (chosen by the agent from the assessment). Zero/omitted leaves the deployer default.
        project_name:
          type: string
          description: Name for the target project. Defaults to the migration name when omitted.

    StartMigrationRequest:
      type: object
      properties:
        parallel_jobs:
          type: integer
          minimum: 1
          description: Value for `import data --parallel-jobs`. Defaults to `8` when omitted.

    MigrationAssessmentSourceEnvironment:
      type: object
      description: Source host environment facts. Voyager payload v1.8 does not currently populate these, so they are normally zero.
      properties:
        total_vcpu:
          type: number
        total_memory:
          type: integer
          format: int64
        total_disk_size:
          type: integer
          format: int64

    MigrationAssessmentSourceDatabaseStats:
      type: object
      description: Size and row-count facts from the source database.
      properties:
        total_table_size_bytes:
          type: integer
          format: int64
        total_index_size_bytes:
          type: integer
          format: int64
        table_row_count:
          type: integer
          format: int64

    MigrationSizingRecommendation:
      type: object
      description: Voyager's compute-sizing recommendation, projected to the fields the agent needs.
      properties:
        num_nodes:
          type: number
        vcpu_per_node:
          type: integer
        memory_per_node_gb:
          type: integer
        colocated_tables:
          type: array
          items:
            type: string
        sharded_tables:
          type: array
          items:
            type: string
        summary:
          type: string

    MigrationAssessmentIssue:
      type: object
      description: A flattened, agent-readable assessment issue.
      properties:
        category:
          type: string
        type:
          type: string
        name:
          type: string
        description:
          type: string
        impact:
          type: string
        object_type:
          type: string
        object_name:
          type: string
        docs_link:
          type: string

    MigrationAssessment:
      type: object
      description: The parsed, agent-oriented projection of Voyager's completed assessment payload.
      required:
        - voyager_version
        - migration_complexity
        - migration_complexity_explanation
        - source_environment
        - source_database
        - sizing_recommendation
        - issues
        - notes
      properties:
        voyager_version:
          type: string
        migration_complexity:
          type: string
          description: 'Voyager''s complexity rating (e.g. LOW, MEDIUM, HIGH).'
        migration_complexity_explanation:
          type: string
        source_environment:
          $ref: '#/components/schemas/MigrationAssessmentSourceEnvironment'
        source_database:
          $ref: '#/components/schemas/MigrationAssessmentSourceDatabaseStats'
        sizing_recommendation:
          $ref: '#/components/schemas/MigrationSizingRecommendation'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/MigrationAssessmentIssue'
        notes:
          type: array
          items:
            type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
