# Minimal YCP demo for the itest-mcs cluster.
# Pods run a stock public alpine image that waits for a binary to be injected via
# `kubectl cp`, then execs it (no registry / no image build needed).
apiVersion: v1
kind: Namespace
metadata:
  name: ycp-demo
  labels:
    app.kubernetes.io/part-of: ycp
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meko-agent
  namespace: ycp-demo
---
# Shared enrollment token: YCP seeds the itest-mcs environment with this token's
# hash; the agent presents the same token to complete the enrollment handshake (#1).
apiVersion: v1
kind: Secret
metadata:
  name: ycp-tokens
  namespace: ycp-demo
type: Opaque
stringData:
  enroll-token: "mko_enr_itestmcs_demo_5f3c9a"
---
# The agent reads cluster facts (version, nodes) and lists namespaces (as datapacks),
# and creates labeled namespaces to reconcile desired datapacks (#2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ycp-agent-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  # per-datapack service workloads the agent provisions into datapack namespaces
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ycp-agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ycp-agent-reader
subjects:
  - kind: ServiceAccount
    name: meko-agent
    namespace: ycp-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ycp
  namespace: ycp-demo
  labels: { app: ycp }
spec:
  replicas: 1
  selector: { matchLabels: { app: ycp } }
  template:
    metadata:
      labels: { app: ycp }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ycp
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            # Loop-and-retry (not exec-and-die): a missing or partially-copied binary
            # must not crash the container, or kubectl cp/exec can't reach it to fix it.
            - 'echo "waiting for /app/ycp"; while true; do if [ -x /app/ycp ]; then echo starting; /app/ycp -addr :8080; echo "ycp exited rc=$?"; fi; sleep 3; done'
          env:
            - { name: YCP_DATABASE_URL, value: "postgres://ycp:ycp@postgres.ycp-demo.svc.cluster.local:5432/ycp?sslmode=disable" }
            - { name: YCP_SEED_ENV_NAME, value: "itest-mcs" }
            - name: YCP_SEED_ENV_TOKEN
              valueFrom: { secretKeyRef: { name: ycp-tokens, key: enroll-token } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app }
      volumes:
        - { name: app, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: ycp
  namespace: ycp-demo
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector: { app: ycp }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-agent
  namespace: ycp-demo
  labels: { app: meko-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: meko-agent } }
  template:
    metadata:
      labels: { app: meko-agent }
    spec:
      serviceAccountName: meko-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'echo "waiting for /app/agent"; while true; do if [ -x /app/agent ]; then echo starting; /app/agent; echo "agent exited rc=$?"; fi; sleep 3; done'
          env:
            - { name: YCP_URL, value: "http://ycp.ycp-demo.svc.cluster.local" }
            - { name: ENV_NAME, value: "itest-mcs" }
            - { name: ENV_PLACEMENT, value: "cloud" }
            - { name: ENV_PROVIDER, value: "gke" }
            - { name: ENV_REGION, value: "us-west1" }
            - { name: MANAGED_NS_PREFIX, value: "ycp-dp-" }
            - { name: AGENT_VERSION, value: "v1.4.2" }
            # Data-plane database (customer's YugabyteDB in production). The agent
            # provisions one real database per datapack here.
            - { name: DP_DB_URL, value: "postgres://dp:dp@dp-postgres.ycp-demo.svc.cluster.local:5432/postgres?sslmode=disable" }
            # Per-datapack MCP server image (built via Cloud Build, public-readable).
            - { name: DPMCP_IMAGE, value: "us-west1-docker.pkg.dev/yugabyte-cloud-dev/meko-demo/dpmcp:v1" }
            - name: ENROLLMENT_TOKEN
              valueFrom: { secretKeyRef: { name: ycp-tokens, key: enroll-token } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app }
      volumes:
        - { name: app, emptyDir: {} }
---
# ---- vanilla Postgres for durable YCP state ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ycp-pg-data
  namespace: ycp-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ycp-demo
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: "ycp" }
            - { name: POSTGRES_PASSWORD, value: "ycp" }
            - { name: POSTGRES_DB, value: "ycp" }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U ycp -d ycp"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ycp-pg-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ycp-demo
spec:
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
# ---- data-plane Postgres: stands in for the customer's YugabyteDB. The agent
#      provisions one real database per datapack here (kept separate from YCP's
#      control DB, which holds only metadata). ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dp-pg-data
  namespace: ycp-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-postgres
  namespace: ycp-demo
  labels: { app: dp-postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dp-postgres } }
  template:
    metadata:
      labels: { app: dp-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: "dp" }
            - { name: POSTGRES_PASSWORD, value: "dp" }
            - { name: POSTGRES_DB, value: "postgres" }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            # -d postgres: without it pg_isready connects to a database named after
            # the user ("dp"), which does not exist here (POSTGRES_DB=postgres), and
            # the probe logs a FATAL on every tick.
            exec: { command: ["sh", "-c", "pg_isready -U dp -d postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: dp-pg-data }
---
apiVersion: v1
kind: Service
metadata:
  name: dp-postgres
  namespace: ycp-demo
spec:
  selector: { app: dp-postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
