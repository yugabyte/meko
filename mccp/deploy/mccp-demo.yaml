# Minimal MCCP demo for the itest-mcs cluster.
# Pods run a stock public alpine image that waits for a binary to be injected via
# `kubectl cp`, then execs it (no registry / no image build needed).
apiVersion: v1
kind: Namespace
metadata:
  name: mccp-demo
  labels:
    app.kubernetes.io/part-of: mccp
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meko-agent
  namespace: mccp-demo
---
# Shared enrollment token: MCCP seeds the itest-mcs environment with this token's
# hash; the agent presents the same token to complete the enrollment handshake (#1).
apiVersion: v1
kind: Secret
metadata:
  name: mccp-tokens
  namespace: mccp-demo
type: Opaque
stringData:
  enroll-token: "mko_enr_itestmcs_demo_5f3c9a"
---
# The agent reads cluster facts (version, nodes) and lists namespaces (as datapacks),
# and creates labeled namespaces to reconcile desired datapacks (#2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mccp-agent-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  # per-datapack service workloads the agent provisions into datapack namespaces
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mccp-agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mccp-agent-reader
subjects:
  - kind: ServiceAccount
    name: meko-agent
    namespace: mccp-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mccp
  namespace: mccp-demo
  labels: { app: mccp }
spec:
  replicas: 1
  selector: { matchLabels: { app: mccp } }
  template:
    metadata:
      labels: { app: mccp }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mccp
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            # Loop-and-retry (not exec-and-die): a missing or partially-copied binary
            # must not crash the container, or kubectl cp/exec can't reach it to fix it.
            - 'echo "waiting for /app/mccp"; while true; do if [ -x /app/mccp ]; then echo starting; /app/mccp -addr :8080; echo "mccp exited rc=$?"; fi; sleep 3; done'
          env:
            - { name: MCCP_DATABASE_URL, value: "postgres://mccp:mccp@postgres.mccp-demo.svc.cluster.local:5432/mccp?sslmode=disable" }
            - { name: MCCP_SEED_ENV_NAME, value: "itest-mcs" }
            - name: MCCP_SEED_ENV_TOKEN
              valueFrom: { secretKeyRef: { name: mccp-tokens, key: enroll-token } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app }
      volumes:
        - { name: app, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mccp
  namespace: mccp-demo
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector: { app: mccp }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-agent
  namespace: mccp-demo
  labels: { app: meko-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: meko-agent } }
  template:
    metadata:
      labels: { app: meko-agent }
    spec:
      serviceAccountName: meko-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'echo "waiting for /app/agent"; while true; do if [ -x /app/agent ]; then echo starting; /app/agent; echo "agent exited rc=$?"; fi; sleep 3; done'
          env:
            - { name: MCCP_URL, value: "http://mccp.mccp-demo.svc.cluster.local" }
            - { name: ENV_NAME, value: "itest-mcs" }
            - { name: ENV_PLACEMENT, value: "cloud" }
            - { name: ENV_PROVIDER, value: "gke" }
            - { name: ENV_REGION, value: "us-west1" }
            - { name: MANAGED_NS_PREFIX, value: "mccp-dp-" }
            - { name: AGENT_VERSION, value: "v1.4.2" }
            # Data-plane database (customer's YugabyteDB in production). The agent
            # provisions one real database per datapack here.
            - { name: DP_DB_URL, value: "postgres://dp:dp@dp-postgres.mccp-demo.svc.cluster.local:5432/postgres?sslmode=disable" }
            # Per-datapack MCP server image (built via Cloud Build, public-readable).
            - { name: DPMCP_IMAGE, value: "us-west1-docker.pkg.dev/yugabyte-cloud-dev/meko-demo/dpmcp:v1" }
            - name: ENROLLMENT_TOKEN
              valueFrom: { secretKeyRef: { name: mccp-tokens, key: enroll-token } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app }
      volumes:
        - { name: app, emptyDir: {} }
---
# ---- vanilla Postgres for durable MCCP state ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mccp-pg-data
  namespace: mccp-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mccp-demo
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: "mccp" }
            - { name: POSTGRES_PASSWORD, value: "mccp" }
            - { name: POSTGRES_DB, value: "mccp" }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U mccp -d mccp"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mccp-pg-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mccp-demo
spec:
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
# ---- data-plane Postgres: stands in for the customer's YugabyteDB. The agent
#      provisions one real database per datapack here (kept separate from MCCP's
#      control DB, which holds only metadata). ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dp-pg-data
  namespace: mccp-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-postgres
  namespace: mccp-demo
  labels: { app: dp-postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dp-postgres } }
  template:
    metadata:
      labels: { app: dp-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: "dp" }
            - { name: POSTGRES_PASSWORD, value: "dp" }
            - { name: POSTGRES_DB, value: "postgres" }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U dp"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: dp-pg-data }
---
apiVersion: v1
kind: Service
metadata:
  name: dp-postgres
  namespace: mccp-demo
spec:
  selector: { app: dp-postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
