services:
  # Meko application container (served on internal port 5000)
  meko-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:-https://auth.mekodev.com}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-4kipguff8t7fphhee3dktt9ihn}
        VITE_COGNITO_REDIRECT_URI: ${VITE_COGNITO_REDIRECT_URI:-http://localhost:5000/signin}
        VITE_OBSERVE_EMBED_PATH: ${VITE_OBSERVE_EMBED_PATH:-/observe/}
    image: meko-ui:local
    container_name: meko-ui
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: dev
      PORT: 5000
    networks:
      - meko_net

  # Single entrypoint reverse proxy:
  # / -> meko-ui, /observe + Langfuse paths -> langfuse-web
  meko-proxy:
    image: nginx:1.27-alpine
    container_name: meko-proxy
    restart: unless-stopped
    depends_on:
      - meko-ui
    ports:
      - "5000:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      # Reach meko-ui via internal project network
      - meko_net
      # Reach existing langfuse-web service on external network
      - langfuse_net

networks:
  # Internal network for this compose project
  meko_net:
    driver: bridge
  # External network from Langfuse compose stack
  langfuse_net:
    external: true
    name: ${LANGFUSE_DOCKER_NETWORK:-langfuse_default}
