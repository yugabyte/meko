# Handle Connection header correctly for websocket upgrades
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Langfuse upstream — change this single value to switch between
# local Docker (langfuse-web:3000) and remote EKS deployment.
upstream langfuse_backend {
  server langfuse-web:3000;
}

server {
  # Nginx listens on container port 80 (mapped to host 5000 by compose)
  listen 80;
  server_name _;

  # Allow moderate payloads for API requests/uploads
  client_max_body_size 25m;

  # Preserve original request host/port/proto for upstream redirects and logs
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Do not expose raw Langfuse route directly.
  location = /observe {
    return 302 $scheme://$http_host/observe-hub;
  }

  # Do not expose raw Langfuse trailing-slash route directly.
  location = /observe/ {
    return 302 $scheme://$http_host/observe-hub;
  }

  # Embedded Observe path. Redirect browser path so Next.js route `as`
  # matches href under basePath "/observe" (avoids /embed incompatibility).
  location ^~ /observe/embed/ {
    rewrite ^/observe/embed/(.*)$ $scheme://$http_host/observe/$1 redirect;
  }

  # Langfuse assets and API under Next.js basePath.
  location ^~ /observe/_next/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  location = /observe/icon.svg {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  # NextAuth/tRPC/admin/public API endpoints for Langfuse under /observe.
  location ^~ /observe/api/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  # All remaining Langfuse app routes under /observe/* (e.g. /observe/organization/*).
  # Keep this after the exact /observe and /observe/ handlers above.
  location ^~ /observe/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://langfuse_backend;
  }

  # Meko API server (Go backend) for auth/datapacks/observe bootstrap.
  # Reaches host process via Docker host-gateway mapping.
  location ^~ /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Login returns multiple auth cookies; increase upstream header buffer.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;
    proxy_pass http://host.docker.internal:25433;
  }

  # Keep project routes under /observe/embed for iframe consistency.
  # Langfuse may navigate to /project/... internally; redirect those back.
  location ^~ /project/ {
    return 302 $scheme://$http_host/observe/embed$uri$is_args$args;
  }

  # Fallback: everything else is served by Meko UI
  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://meko-ui:5000/;
  }
}
