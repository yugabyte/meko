# The foundation the amp controller runs on: one YugabyteDB universe managed by
# the YugabyteDB Kubernetes Operator, in the same namespace as the amp stack.
#
#   foundation render -c examples/foundation-cli.yaml -o manifests/   # manifests, no cluster
#   foundation up     -c examples/foundation-cli.yaml                 # first bring-up
#   foundation apply  -c examples/foundation-cli.yaml                 # converge after an edit
#
# Every day-2 change — scale, software upgrade, gflags, disk grow, pause — is an
# edit to this file followed by `apply`.
#
# The same foundation as an OBJECT, for the in-cluster pod to converge, is
# examples/foundation-cr.yaml. It carries the same settings in the `resources:`
# list form, and a test pins that the two agree on everything that decides what
# the universe is — encryption, sslMode and gflags.
#
# REMOVING a CR key deletes the object on the next `apply`: this file is the
# source of truth, so omission is deletion. Only objects this deployer created
# are candidates (they carry app.kubernetes.io/managed-by=meko-foundation), and
# `--no-prune` opts out.
#
# Each CR is an UPPERCASE top-level key naming its kind, with {name, spec}
# under it — see YBProvider and YBUniverse below. The spec body is VERBATIM, so
# anything the pinned CRD has is settable with no code change, and nothing here
# re-implements the CRD's schema: a typo, a wrong type or a bad enum is
# rejected by the API server on apply (".spec.numNodez: field not declared in
# schema"). The old lowercase `provider:`/`universe:` keys are rejected at
# parse time, naming their replacement.
#
# Moving chartVersion means moving the universe's ybSoftwareVersion with it,
# since the yugaware that chart installs bundles only its own DB release.

kubeContext: ""            # empty = current context
namespace: amp             # yugaware + operator + CRs + DB pods + amp pods

# Doubles as the release-bucket key and as the git ref for the CRD bundle, so
# it must resolve as both. A full build resolves as both when the build was
# tagged in yugabyte/charts, which is what lets this be an unpublished one.
#
# 2026.1.3.0-b21 for TLS. The CRD bundle is byte-identical to 2026.1.2's — the
# same 15 kinds, KMSConfig, TelemetryProvider, UniverseKeyRotation and
# YBCertificate included — so nothing below depends on the bump except the
# universe chart, which gains tls.extraSANs. That is the field that lets the
# node certificates name the endpoint Service, and without it a verify-full
# consumer cannot connect to the only address this foundation hands out. See
# kubernetesOverrides.tls below.
chartVersion: "2026.1.3.0-b21"

# Where the yugaware chart comes from, and what yba.chart means for each:
#
#   repo   yba.chart is a chart NAME in charts.yugabyte.com ("yugabytedb/yugaware").
#          chartVersion is REQUIRED — it is the published version helm resolves,
#          and only RELEASED lines are there (2026.1.2 is the newest).
#   path   yba.chart is anything helm takes: a packaged .tgz, an unpacked chart
#          directory (the one holding Chart.yaml, under any name), or an http(s)
#          URL. chartVersion is then only the CRD git ref, and crdPath overrides
#          even that.
#
# An UNPUBLISHED build is just a URL under path — see yba.chart below. There
# is no separate source for the release bucket: it is public for reads, helm
# fetches a URL itself, and a second enum value would be a second name for the
# same thing. (The bucket denies LIST, so a key that does not exist answers
# 403 rather than 404 — a 403 means the version is wrong, not that you lack
# access.)
#
# A build tagged in yugabyte/charts (this one is) resolves as a git ref too, so
# the CRDs come from the same version and crdPath is unnecessary. Set crdPath
# when it does not, or when the cluster has no egress to raw.githubusercontent.
#
# Entirely local instead — an air-gapped run, or a chart under test:
#
#   chartSource: path
#   crdPath: /home/me/yb/concatenated_crd.yaml   # or a directory of manifests
#   yba:
#     chart: /home/me/yb/yugaware-2026.1.2.tgz   # or the untarred directory
#
# A leading ~ is expanded. Anything else relative resolves against the process
# CWD, not against this file. A crdPath directory is applied NON-recursively.
#
# This file is the deployer's only input — there are no flags that override
# any of it. CI deploys a different build by writing a spec, not by passing
# one.
chartSource: path

yba:
  # The release bucket, which is where an unpublished build lives. Just a URL:
  # it is public for reads and helm fetches a chart from a URL itself, so
  # there is nothing to download first and no credentials involved. A released
  # line would instead be chartSource: repo with chart: yugabytedb/yugaware,
  # which is the default.
  chart: https://releases.yugabyte.com/2026.1.3.0-b21/helm/yugaware-2026.1.3.tgz
  # yugaware chart values verbatim — the whole chart surface is available here.
  # Three settings are NOT: the deployer appends
  # yugaware.kubernetesOperatorEnabled, yugaware.kubernetesOperatorNamespace and
  # yugaware.defaultUser.enabled as `--set` afterwards, which helm gives
  # precedence over this file, because a foundation with any of them off does
  # not work at all. Everything else here wins.
  values:
    # The operator reconciles CRs through ClusterRoles the chart makes, so this
    # has to be on. Set here rather than forced by the deployer because it is
    # already the chart's default and the chart fails loudly without it — and
    # because the one cluster that legitimately needs it OFF (no permission to
    # create cluster-scoped RBAC, a pre-made yugaware.serviceAccount instead)
    # must be able to say so.
    rbac:
      create: true
    # YBA's OWN image, which is a different one from the DB image the provider
    # names. The chart defaults to the public quay.io/yugabyte/yugaware, which
    # carries released builds only; the itest registry carries unreleased ones
    # too, and it is what ampqa uses against this cluster. Being private, it
    # then needs the pull secret — the same one, which must already exist in
    # the namespace.
    #
    # image.tag is deliberately left to the chart: it ships the build that
    # release was cut with, and pinning a tag here means maintaining a second
    # version alongside chartVersion.
    image:
      repository: quay.io/yugabyte/yugaware-itest
      pullSecret: quay-pull-secret
      # 2026.1.2 moved these two to quay.io/yugabyte/hardened-*, which the
      # pull secret above cannot reach; put back on the public images.
      # Prometheus needs its TAG too, not just the registry — the public repo
      # prefixes versions with `v` and the hardened one does not.
      #
      # Drop these once the robot can pull hardened-*; a hardened build is
      # presumably the point.
      #
      # After ANY chart bump, check every image at once by rendering:
      #   helm template t <chart> -f <these values> | grep -oE '^ *image: .*'
      # A values diff misses subcharts, which bring their own.
      postgres:
        registry: ""
        name: postgres
      prometheus:
        registry: ""
        name: prom/prometheus
        tag: v3.13.2

    # Arbitrary YBA runtime config, written into application.docker.conf.
    #
    # yb.universe.otel_collector_enabled gates the OTel collector sidecar YBA
    # injects into the DB pods, and it defaults OFF — with it off, a universe
    # declaring telemetry gets no collector and no error. It has to be set here
    # rather than later because YBA reads its runtime config at startup, and
    # nothing on this path can call YBA's API to change one afterwards (the
    # operator reconciles CRs under its own ServiceAccount; no API token
    # exists here).
    #
    # This only ENABLES the mechanism. Nothing is scraped or exported until a
    # universe declares spec.telemetry.metrics with an exporter — see the
    # comment on YBUniverse below. The two companion flags,
    # yb.universe.metrics_export_enabled and yb.telemetry.allow_otlp, both
    # default true and are not set here.
    #
    # yb.universe.create_yb_storage_db has YBA create the yb_storage database as
    # a subtask of universe CREATE, which is what the consumer would otherwise
    # do over `kubectl exec` (amp/deploy/yb-database.sh). GLOBAL, INTERNAL and
    # defaults FALSE, so it has to be set here. Two things about it:
    #
    #   - CREATE-time only. It runs in the ConfigureUniverse phase of
    #     CreateUniverse/CreateKubernetesUniverse, so turning it on for a
    #     universe that already exists does nothing.
    #   - It needs YBA from yugabyte-db 2026.1 at eab8d8b1d (2026-10-05) or
    #     later. Chart 2026.1.3.0-b48 was cut on 2026-10-01 and predates it, so
    #     on the build pinned above this key is inert and yb-database.sh is
    #     still what creates the database. Setting it now is harmless — an
    #     unknown runtime key is ignored — and makes the next chart bump the
    #     only step needed.
    additionalAppConf:
      nonStringConf:
        "yb.universe.otel_collector_enabled": true
        "yb.universe.create_yb_storage_db": true

    # Perf Advisor is new in 2026.1.2: a subchart, enabled by default, whose
    # image pulls under its OWN imagePullSecretName (yugabyte-k8s-pull-secret)
    # that nothing here creates. `helm --wait` waits for every workload in the
    # release, so its one pod times the whole install out with yugaware up and
    # healthy.
    #
    # Off because a foundation has no use for YBA's query-tuning UI. Enabling
    # it means creating that secret and a second ~2 CPU pod.
    perf-advisor-chart:
      yugaware:
        enabled: false
    yugaware:
      # NOT just a UI login. YBA's operator refuses every CR unless YBA has
      # EXACTLY ONE customer, and the chart's customer-create post-install Job
      # is the only thing that creates one — without it the provider CR sits
      # with an empty status while the operator logs "Customer list does not
      # have exactly one customer" on every pass.
      #
      # That Job is gated on defaultUser.enabled, which the chart defaults OFF
      # and the deployer forces on (see HelmSets) — so these fields are what
      # make it work, not what turns it on. password has no chart default and
      # the template hard-fails on an empty one.
      #
      # Nothing automated logs in: the operator reconciles CRs under its own
      # ServiceAccount, so no YBA API token exists on this path.
      defaultUser:
        username: admin
        email: amp@yugabyte.com
        password: Password#123
      # ClusterIP, not the chart's LoadBalancer default — that default gives the
      # YBA console a PUBLIC IP with the password above on it. Nothing outside
      # the cluster needs it (the customer-create Job reaches the UI service by
      # in-cluster DNS), so port-forward when a human wants the console.
      service:
        type: ClusterIP
      # The UI and an internal LoadBalancer would both be deployed for nobody.
      enableProxyMetricsAuth: false
      # yugaware's OWN PVC, which is a different class from the universe's —
      # unset it takes the cluster default, and on a multi-zone cluster an
      # Immediate-binding default provisions the disk first and zone-pins the
      # ~4.5 CPU yugaware pod before it can schedule.
      storageClass: yb-standard

# An UPPERCASE top-level key is an operator CR kind, and its value is
# {name, spec}: name is metadata.name, spec is the CR's spec body VERBATIM. Any
# kind in the bundle works this way with no code change — use a list under the
# key for several objects of one kind.
#
# Keys are applied TOP TO BOTTOM and deleted bottom to top, so put a thing above
# whatever references it. YBUniverse is required; every other kind, YBProvider
# included, is optional — but a provider must come above the universe when it
# is there.
#
# A provider is optional because the operator has an auto-provider and a
# universe can also name one somebody else registered. Declaring one is how you
# take control: it carries what the operator's auto-provider cannot infer AND what
# the universe cannot override — the DB image registry (k8s universes pull the
# DB image from a registry, not a release tarball), its pull secret, and the
# per-zone storage class, which takes PRECEDENCE over any storageClass on the
# universe's volumes.
# The CA YBA signs this universe's node certificates from, named by
# YBUniverse.rootCA below — and only by it; the provider zones name the
# ClusterIssuer that signs, which is a different object. Above both because keys
# apply top to bottom and Validate requires it above the universe.
#
# certType K8S_CERT_MANAGER means YBA does not hold a key: it trusts this CA and
# lets cert-manager issue, which is how the universe ends up chaining to the
# same root the amp endpoints and the controller already use
# (amp/deploy/tls/trust-root.sh). The alternative, SELF_SIGNED, would have YBA
# invent a CA nobody else trusts, and the DSN could then only ever be
# sslmode=require.
#
# The Secret carries ca.crt and nothing else. trust-manager syncs that CA into
# every namespace it labels as a ConfigMap, which a CR cannot reference, so
# up-gke.sh copies it into this Secret before `foundation up`. Creating it is
# the deploy script's job because the CA belongs to the cluster, not to this
# universe.
YBCertificate:
  name: amp-ca
  spec:
    certType: K8S_CERT_MANAGER
    certificateSecretRef:
      name: amp-ca-bundle-tls

YBProvider:
  name: foundation
  spec:
    cloudInfo:
      kubernetesProvider: gke
      # k8s universes pull the DB image from here. The itest registry carries
      # unreleased builds; Docker Hub has released ones only.
      kubernetesImageRegistry: quay.io/yugabyte/yugabyte-itest
      # Omitted on purpose: "will use in-cluster credentials if empty", which is
      # what the operator's own ServiceAccount already has.
      # kubeConfigSecret: {name: ..., namespace: ...}
    regions:
      - code: us-west1
        zones:
          - code: us-west1-b
            cloudInfo:
              # itest-dev's class, and the one that actually decides — a
              # storageClass on the universe's volumes loses to this.
              kubernetesStorageClass: yb-standard
              # Who SIGNS the node certificates. Per zone, because that is where
              # the CRD puts these three; the CRD also requires the name
              # whenever the kind is set.
              #
              # A ClusterIssuer, not an Issuer: YBA installs the universe chart
              # into the universe's namespace, and a namespaced Issuer living in
              # cert-manager's namespace would be unreachable from there.
              # amp-ca is what trust-root.sh bootstraps.
              certManagerIssuerKind: ClusterIssuer
              certManagerIssuerName: amp-ca
              certManagerIssuerGroup: cert-manager.io

# No telemetry here, deliberately — metrics export is turned on AFTER this
# universe is up, not with it (meko#1405).
#
# The exporter references a TelemetryProvider, whose credential is a Secret
# (byoc-metrics-auth) that does not exist yet: the install hint creates it in this
# namespace, from a password only the operator has. Declaring the provider here would apply
# it against a missing Secret and leave it in Error. And the identity the series
# must carry — environment_id, account_id — is not known until that same step.
#
# So the install hint prints these, with the ids filled in, to be added to this
# file and applied. What arrives looks like:
#
#   TelemetryProvider:          # above YBUniverse — keys apply top to bottom
#     name: byoc-metrics
#     spec:
#       provider: OTLP
#       otlp: {...}             # the BYOC door, password by secretKeyRef
#
#   YBUniverse:
#     spec:
#       telemetry:
#         metrics:
#           collectionLevel: MINIMAL          # the smallest set that takes effect
#           scrapeConfigTargets: [MASTER_EXPORT, TSERVER_EXPORT, YSQL_EXPORT]
#           exporters:
#             - telemetryProvider: byoc-metrics
#               additionalTags: {source: amp, environment_id: ..., account_id: ...}
#
# examples/resources.yaml carries the full worked version. Nothing collects until
# the exporters list is non-empty: an empty one is not "scrape but do not ship",
# it is no collector at all.
YBUniverse:
  name: foundation
  spec:
    universeName: foundation   # defaulted from the entry's name when omitted
    providerName: foundation   # defaulted from the YBProvider entry's name
    numNodes: 3
    replicationFactor: 3
    # The DB release, which must be BOTH a release this YBA knows and a tag in the
    # provider's kubernetesImageRegistry. Not optional and not blankable: YBA
    # parses it against its own version, so "" fails with "Unable to parse YB
    # version strings" and the universe comes back "Error Creating" carrying no
    # reason at all — the explanation is only in the yugaware log.
    #
    # This is the release the chart bundles — it equals the chart's appVersion,
    # `ls /opt/yugabyte/releases` in the yugaware pod prints exactly this one,
    # and checkDBRelease verifies it immediately before the YBUniverse is
    # applied (from applyCRs, so a Release key above has already had its
    # chance to import one). It must also be a tag in the provider's
    # kubernetesImageRegistry.
    #
    # A PUBLISHED chart version is mutable, so this can drift with nothing here
    # changing: 2026.1.1 was re-cut on 2026-09-10 with appVersion
    # 2026.1.1.1-b2 -> 2026.1.1.2-b9, which moved the yugaware image and with
    # it the bundled release, and YBA then rejected the universe with "Helm
    # Package path not found for release: 2026.1.1.1-b2". A full build like the
    # one above is immutable and cannot drift, but the check stays because
    # chartVersion can go back to a published line at any time.
    ybSoftwareVersion: "2026.1.3.0-b21"

    # RF3 over three nodes in one zone, which is what itest-dev has — the cluster
    # is single-zone, so spreading across three would place nodes nowhere.
    # Declared rather than left to YBA so the layout is reviewable in the diff and
    # a zone typo fails validation instead of a task tens of minutes in; the codes
    # must be ones the provider above defines. Whether the counts add up is YBA's
    # to judge, not ours.
    placementInfo:
      regions:
        - code: us-west1
          zones:
            - code: us-west1-b
              numNodes: 3

    # Replaces deviceInfo, which the CRD declares mutually exclusive with it.
    tserverVolume:
      volumeSize: 100

    enableYSQLAuth: false      # keeps the existing passwordless yugabyte DSNs working

    # TLS on both hops. The CRD defaults both to true, so this block is saying
    # out loud what would happen anyway — worth it because both are create-time
    # only (self == oldSelf): turning either on or off later REBUILDS the
    # universe rather than editing it, so it is a property of the universe's
    # identity and not a setting.
    #
    # Client-to-node encrypts YSQL on 5433, and with rootCA below the deployer
    # reports sslmode=verify-full — the server is authenticated, not merely
    # encrypted. Node-to-node encrypts the tserver RPC port, which the compute
    # hot path speaks pggate to directly; that is the half that used to be
    # impossible, because nothing could hand those daemons cert material. It can
    # now: the endpoint chart issues each pod a client certificate from the same
    # CA (meko#1114).
    enableNodeToNodeEncrypt: true
    enableClientToNodeEncrypt: true

    # The CA to sign node certificates from — the YBCertificate above, by its
    # metadata.name. Empty would mean YBA invents its own, which nothing else
    # trusts, and the best DSN available would be sslmode=require.
    rootCA: amp-ca

    # NOT public exposure. The chart wraps its entire serviceEndpoints template
    # in this flag, so without it the Service below is never created; and since
    # declaring the endpoint list REPLACES it, the chart's three default
    # LoadBalancer endpoints are dropped by that same declaration.
    enableLoadBalancer: true

    # No Image.pullSecretName here on purpose, though the DB registry above is
    # private. YBA derives the DB pull secret from its OWN (yba.values.image
    # .pullSecret) and propagates it into the namespace it deploys nodes into —
    # the only thing that can work, since the YBProvider CRD has no field for
    # pull-secret content, so a CR could name a Secret but never put one there.
    # Naming one here just risks naming something absent beside the DB pods.
    #
    # The robot behind that yugaware secret therefore needs pull access to the DB
    # image repo as well as the YBA one.
    #
    # kubernetesOverrides is otherwise free: helm values for the universe's own
    # chart, passed through verbatim.
    kubernetesOverrides:
      # THE ADDRESS CONTRACT: this one Service is everything consumers get, and
      # every spec needs it — the deployer applies only what is written here and
      # adds nothing, so a spec without this block gets no Service at all (the
      # CRD defaults enableLoadBalancer to false). `foundation validate` refuses
      # one that leaves it out.
      #
      # Both client ports on ONE Service: the YSQL pool dials the host as given,
      # and the direct-RPC lane cannot be addressed at all — it DERIVES its
      # address by appending 9100 to the same host, because nothing in the
      # deploy path can set tserver_rpc_addrs. A Service with only 5433 passes
      # every other check and then compute fails to open its table handles.
      #
      # scope Namespaced makes it one Service shared by every release in the
      # namespace, so the name survives a full move. The name is deliberately
      # not the chart's own yb-tserver-service: this list replaces the chart's
      # defaults, and had the override ever failed to apply, a default endpoint
      # of that name would sit there as a LoadBalancer with no 9100.
      #
      # YBA prefixes the rendered name with the universe name it generated, so
      # the Service is found by label (serviceName=, scope=), never by name.
      serviceEndpoints:
        - name: yb-tserver-conn
          type: ClusterIP
          scope: Namespaced
          app: yb-tserver
          ports:
            tcp-ysql-port: "5433"
            tcp-rpc-port: "9100"
          # Reachable from another cluster: emit a ServiceExport (KEP-1645) so
          # the ClusterSet's DNS resolves this name to the pods in every member
          # cluster. Off because it needs a multi-cluster services
          # implementation (GKE MCS, Submariner, Cilium ClusterMesh) — with
          # none, the object is inert.
          #
          # It supplies DISCOVERY, not connectivity: pod-level reachability
          # between the clusters has to already exist. And the YSQL smart driver
          # uses the configured name only to bootstrap, then addresses tservers
          # by the per-pod hostnames yb_servers() reports, so that lane also
          # needs multicluster.createServiceExports. The direct-RPC lane never
          # leaves the configured address. The other route to the same place is
          # an internal LoadBalancer: type: LoadBalancer here plus the cloud's
          # internal-LB annotations.
          # exportService: true

      # The endpoint Service, by name, in the node certificates. Required: the
      # DSN this foundation reports is sslmode=verify-full against exactly that
      # name, and the name is in none of the SANs the chart computes on its own
      # — those are the per-pod names and a wildcard over the HEADLESS Service.
      #
      # A template because the name cannot be written down: YBA generates the
      # prefix, and the chart renders this with tpl, so it computes the name it
      # created. Chart 2026.1.3 or later.
      tls:
        extraSANs:
          dnsNames:
            - '{{ include "yugabyte.servicename" (dict "root" . "endpoint" (dict "name" "yb-tserver-conn") "scope" "Namespaced") }}.{{ .Release.Namespace }}.svc.{{ .Values.domainName }}'

    # MAGE is seeded at CREATE because it is a start-time gflag on both processes:
    # the extension will not install without it, and turning it on later is a
    # rolling restart of the universe. `ysql_yb_enable_mage` is a preview flag, so
    # YBA rejects it unless allowed_preview_flags_csv names it — that CSV is
    # itself an ordinary gflag, and it must list EVERY preview flag in use, so
    # adding a second one means rewriting the value to carry both rather than
    # adding a key. YBA is what enforces this; nothing in the deployer does.
    #
    # No ysql_hba_conf_csv, and no node_to_node_encryption_use_client_certificates.
    # ac-endpoint-tls.md asks for both and deploy/tls/yugabyte-tls.sh sets them,
    # which is right on the yugabyted lane because amp is the only client there.
    # On a YBA-MANAGED universe YBA is a client too — its WaitForServer subtask
    # probes tserver RPC on 9100 and health-checks postgres as `yugabyte`, with
    # no certificate for either — so each of them leaves the universe stuck in
    # Error Creating: `WaitForServer ... completed 3 out of 3 tasks failed`, at
    # positions 5 and 14 of CreateKubernetesUniverse respectively (meko#1241).
    #
    # Beyond that, login policy is not this file's to set. The universe is the
    # universe; who connects and how they prove it is the consumer's, and a
    # foundation that legislates it breaks the one thing that has to manage it.
    # A deployment that wants certificate logins adds the rules itself, having
    # first worked out how YBA authenticates.
    #
    # What this leaves: both hops encrypted, the server authenticated
    # (sslmode=verify-full, which is what tls.extraSANs above is for), and
    # clients not authenticated by certificate. enableYSQLAuth is off, so
    # YugabyteDB's own default rules admit them.

    gFlags:
      masterGFlags:
        allowed_preview_flags_csv: ysql_yb_enable_mage
        ysql_yb_enable_mage: "true"
      tserverGFlags:
        allowed_preview_flags_csv: ysql_yb_enable_mage
        ysql_yb_enable_mage: "true"
