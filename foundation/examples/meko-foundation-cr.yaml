# The universe a meko BYOC data plane runs on (MEKO-916): RF3, so meko_system is
# replicated, with the meko chart's bootstrap-databases putting the data-plane
# database on an RF1 tablespace inside it — the same split SaaS runs.
#
#   kubectl apply -n <meko namespace> -f meko-foundation-cr.yaml
#   kubectl -n <meko namespace> wait foundation/foundation \
#     --for=jsonpath='{.status.phase}'=Ready --timeout=50m
#   kubectl -n <meko namespace> get foundation foundation \
#     -o jsonpath='{.status.address.ysql_host_ports}'   # host:5433 -> database.host
#
# examples/foundation-cr.yaml is amp's foundation and carries the reasoning for
# every block; this file differs from it in three ways:
#   - no TLS: values-byoc.yaml connects with sslmode=disable. Both encryption
#     flags are CREATE-TIME ONLY, so turning TLS on later rebuilds the universe.
#   - ysql_enable_colocated_tables_with_tablespaces, without which every vector
#     index in the RF1 tablespace is refused (below).
#   - no yb_storage database, which is amp's.
#
# REPLACE BEFORE USING: the registries and pull secret, the yugaware password, the
# region/zone codes and storage classes. Each is marked below.
apiVersion: meko.yugabyte.com/v1alpha1
kind: Foundation
metadata:
  name: foundation
  # No namespace: `kubectl apply -n` picks it, and spec.namespace defaults to it.
spec:
  deletionPolicy: Retain
  chartVersion: "2026.1.3.0-b21"
  chartSource: path

  yba:
    chart: https://releases.yugabyte.com/2026.1.3.0-b21/helm/yugaware-2026.1.3.tgz
    values:
      rbac:
        create: true
      image:
        # REPLACE: the robot behind this Secret needs pull on the DB image repo
        # named by the provider below as well as this one. quay-registry-creds is
        # the Secret the meko install hint already creates in this namespace.
        repository: quay.io/yugabyte/yugaware-itest
        pullSecret: quay-registry-creds
        postgres:
          registry: ""
          name: postgres
        prometheus:
          registry: ""
          name: prom/prometheus
          tag: v3.13.2
      perf-advisor-chart:
        yugaware:
          enabled: false
      yugaware:
        defaultUser:
          # REPLACE. YBA's single customer; the operator refuses every CR without
          # exactly one.
          username: admin
          email: meko@yugabyte.com
          password: Password#123
        service:
          type: ClusterIP
        enableProxyMetricsAuth: false
        # REPLACE: yugaware's own PVC class.
        storageClass: yb-standard

  resources:
    - kind: YBProvider
      name: foundation
      spec:
        cloudInfo:
          # REPLACE: gke | aks | eks | custom.
          kubernetesProvider: gke
          # REPLACE. ybSoftwareVersion below must be a tag here. The stock build
          # carries pg_dist_rag, vector and mage, which the data migrations need.
          kubernetesImageRegistry: quay.io/yugabyte/yugabyte-itest
        regions:
          # REPLACE: your region and zones; placementInfo below must name them.
          - code: us-west1
            zones:
              - code: us-west1-b
                cloudInfo:
                  # REPLACE.
                  kubernetesStorageClass: yb-standard

    - kind: YBUniverse
      name: foundation
      spec:
        universeName: foundation
        providerName: foundation
        numNodes: 3
        replicationFactor: 3
        ybSoftwareVersion: "2026.1.3.0-b21"
        placementInfo:
          regions:
            - code: us-west1
              zones:
                - code: us-west1-b
                  numNodes: 3
        tserverVolume:
          volumeSize: 100
        enableYSQLAuth: false
        enableNodeToNodeEncrypt: false
        enableClientToNodeEncrypt: false
        enableLoadBalancer: true
        kubernetesOverrides:
          # The address contract: the one Service consumers get, found by label
          # because YBA prefixes its name. Its host is the chart's database.host.
          serviceEndpoints:
            - name: yb-tserver-conn
              type: ClusterIP
              scope: Namespaced
              app: yb-tserver
              ports:
                tcp-ysql-port: "5433"
                tcp-rpc-port: "9100"
        # ysql_enable_colocated_tables_with_tablespaces: YB stores a vector index
        # colocated with its table, and refuses any colocated index with a
        # tablespace ("TABLESPACE is not supported for indexes on colocated
        # tables") unless this is on. The data database's default_tablespace gives
        # every hnsw index one. A start-time flag on both processes, and not a
        # preview flag, so it stays out of allowed_preview_flags_csv.
        gFlags:
          masterGFlags:
            allowed_preview_flags_csv: ysql_yb_enable_mage
            ysql_yb_enable_mage: "true"
            ysql_enable_colocated_tables_with_tablespaces: "true"
          tserverGFlags:
            allowed_preview_flags_csv: ysql_yb_enable_mage
            ysql_yb_enable_mage: "true"
            ysql_enable_colocated_tables_with_tablespaces: "true"
