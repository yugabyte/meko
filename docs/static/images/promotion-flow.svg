<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22223e"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <filter id="cardshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" rx="12" fill="url(#bg)"/>

  <!-- Zone labels -->
  <text x="280" y="36" text-anchor="middle" fill="#74b9ff" font-size="10" font-weight="700" letter-spacing="1.5">PER-AGENT &#183; ISOLATED BY AGENT IDENTITY</text>
  <text x="830" y="36" text-anchor="middle" fill="#55efc4" font-size="10" font-weight="700" letter-spacing="1.5">INSTITUTIONAL &#183; AVAILABLE TO ALL AGENTS</text>

  <!-- Subtle vertical zone separator -->
  <line x1="700" y1="55" x2="700" y2="270" stroke="#2d2d4a" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- Conversations -->
  <g filter="url(#cardshadow)">
    <rect x="40" y="80" width="140" height="160" rx="10" fill="url(#card)" stroke="#0984e3" stroke-width="2"/>
  </g>
  <circle cx="110" cy="115" r="12" fill="#0984e3"/>
  <text x="110" y="170" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Conversations</text>
  <rect x="86" y="200" width="48" height="22" rx="11" fill="#0984e3" opacity="0.18" stroke="#0984e3" stroke-width="1"/>
  <text x="110" y="215" text-anchor="middle" fill="#74b9ff" font-size="11" font-weight="600" letter-spacing="0.5">raw</text>

  <!-- Arrow 1: Conversations -> Memories (single integrated shape with embedded label) -->
  <path d="M 190 150 L 270 150 L 283 160 L 270 170 L 190 170 Q 180 170 180 160 Q 180 150 190 150 Z" fill="#ff6b35"/>
  <text x="223" y="164" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="0.8">EXTRACT</text>

  <!-- Memories -->
  <g filter="url(#cardshadow)">
    <rect x="285" y="80" width="140" height="160" rx="10" fill="url(#card)" stroke="#3498db" stroke-width="2"/>
  </g>
  <circle cx="355" cy="115" r="12" fill="#3498db"/>
  <text x="355" y="170" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Memories</text>
  <rect x="328" y="200" width="54" height="22" rx="11" fill="#3498db" opacity="0.18" stroke="#3498db" stroke-width="1"/>
  <text x="355" y="215" text-anchor="middle" fill="#74b9ff" font-size="11" font-weight="600" letter-spacing="0.5">private</text>

  <!-- Arrow 2: Memories -> Learnings (single integrated shape with embedded label) -->
  <path d="M 435 150 L 515 150 L 528 160 L 515 170 L 435 170 Q 425 170 425 160 Q 425 150 435 150 Z" fill="#ff6b35"/>
  <text x="468" y="164" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="0.8">EXTRACT</text>

  <!-- Learnings (dashed = review process, not a storage primitive) -->
  <rect x="530" y="80" width="140" height="160" rx="10" fill="none" stroke="#a29bfe" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="600" cy="115" r="12" fill="#6c5ce7"/>
  <text x="600" y="170" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Learnings</text>
  <rect x="572" y="200" width="56" height="22" rx="11" fill="#6c5ce7" opacity="0.22" stroke="#a29bfe" stroke-width="1"/>
  <text x="600" y="215" text-anchor="middle" fill="#a29bfe" font-size="11" font-weight="600" letter-spacing="0.5">review</text>

  <!-- Arrow 3: Learnings -> PROMOTE label -> fork to two destinations -->
  <!-- Capsule body with PROMOTE label, ends flat at fork point x=775 -->
  <path d="M 680 150 L 775 150 L 775 170 L 680 170 Q 670 170 670 160 Q 670 150 680 150 Z" fill="#ff6b35"/>
  <text x="720" y="164" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="0.8">PROMOTE</text>
  <!-- Vertical fork line at x=775 -->
  <line x1="775" y1="120" x2="775" y2="200" stroke="#ff6b35" stroke-width="2.5"/>
  <!-- Branch up to Collective Memory -->
  <line x1="775" y1="120" x2="810" y2="120" stroke="#ff6b35" stroke-width="2.5"/>
  <polygon points="806,114 820,120 806,126" fill="#ff6b35"/>
  <!-- Branch down to Shared Knowledge -->
  <line x1="775" y1="200" x2="810" y2="200" stroke="#ff6b35" stroke-width="2.5"/>
  <polygon points="806,194 820,200 806,206" fill="#ff6b35"/>

  <!-- Collective Memory -->
  <g filter="url(#cardshadow)">
    <rect x="825" y="82" width="150" height="76" rx="10" fill="url(#card)" stroke="#55efc4" stroke-width="2"/>
  </g>
  <text x="900" y="115" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Collective Memory</text>
  <text x="900" y="135" text-anchor="middle" fill="#8b9bb0" font-size="11">graph + vector</text>

  <!-- Shared Knowledge -->
  <g filter="url(#cardshadow)">
    <rect x="825" y="162" width="150" height="76" rx="10" fill="url(#card)" stroke="#00b894" stroke-width="2"/>
  </g>
  <text x="900" y="195" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Shared Knowledge</text>
  <text x="900" y="215" text-anchor="middle" fill="#8b9bb0" font-size="11">RAG over docs + facts</text>

  <!-- Caption -->
  <text x="500" y="290" text-anchor="middle" fill="#666680" font-size="10" font-style="italic">Memory begins per-agent. Promotion is the only path that crosses the line.</text>
</svg>
