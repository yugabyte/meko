<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="mekoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="mekoAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e85d26"/>
    </linearGradient>
    <linearGradient id="layerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e36"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="dbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#0f1a0f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#mekoBg)"/>

  <!-- ═══════════ TOP: Agent SDKs ═══════════ -->
  <rect x="60" y="24" width="680" height="52" rx="8" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="46" text-anchor="middle" fill="#b0b0c0" font-size="11" font-weight="500">AGENT SDKs &amp; AI TOOLS</text>
  <text x="400" y="64" text-anchor="middle" fill="#8888a0" font-size="10">CrewAI · LangChain · LangGraph · Cursor · Claude Code · OpenAI Agents</text>

  <!-- Arrow down -->
  <line x1="400" y1="76" x2="400" y2="100" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="394,97 400,107 406,97" fill="#ff6b35"/>
  <text x="418" y="94" fill="#ff6b35" font-size="9" font-weight="600">MCP</text>

  <!-- ═══════════ MEKO CORE ═══════════ -->
  <rect x="40" y="108" width="720" height="280" rx="10" fill="none" stroke="url(#mekoAccent)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="108" width="720" height="280" rx="10" fill="url(#mekoBg)" opacity="0.7"/>

  <!-- MEKO label -->
  <rect x="340" y="98" width="120" height="22" rx="4" fill="url(#mekoAccent)"/>
  <text x="400" y="114" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" letter-spacing="2">MEKO</text>

  <!-- ── Layer 1: Inference ── -->
  <rect x="68" y="136" width="664" height="50" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="68" y="136" width="6" height="50" rx="3" fill="#6c5ce7"/>
  <text x="94" y="157" fill="#a29bfe" font-size="11" font-weight="600">INFERENCE</text>
  <text x="94" y="174" fill="#8888a0" font-size="10">LLMs (Llama, OpenAI, HuggingFace)</text>
  <rect x="390" y="148" width="70" height="22" rx="4" fill="#2d2d4a" stroke="#6c5ce7" stroke-width="0.5"/>
  <text x="425" y="163" text-anchor="middle" fill="#a29bfe" font-size="9">vLLM *</text>
  <rect x="470" y="148" width="110" height="22" rx="4" fill="#2d2d4a" stroke="#6c5ce7" stroke-width="0.5"/>
  <text x="525" y="163" text-anchor="middle" fill="#a29bfe" font-size="9">LMCache / KDN *</text>

  <!-- ── Layer 2: Knowledge ── -->
  <rect x="68" y="196" width="664" height="50" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="68" y="196" width="6" height="50" rx="3" fill="#00b894"/>
  <text x="94" y="217" fill="#55efc4" font-size="11" font-weight="600">KNOWLEDGE</text>
  <text x="94" y="234" fill="#8888a0" font-size="10">pg_dist_rag · data lineage</text>
  <rect x="320" y="208" width="100" height="22" rx="4" fill="#2d2d4a" stroke="#00b894" stroke-width="0.5"/>
  <text x="370" y="223" text-anchor="middle" fill="#55efc4" font-size="9">MCP Server *</text>
  <rect x="430" y="208" width="90" height="22" rx="4" fill="#2d2d4a" stroke="#00b894" stroke-width="0.5"/>
  <text x="475" y="223" text-anchor="middle" fill="#55efc4" font-size="9">Reranking **</text>

  <!-- ── Layer 3: Database ── -->
  <rect x="68" y="256" width="664" height="50" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="68" y="256" width="6" height="50" rx="3" fill="#0984e3"/>
  <text x="94" y="277" fill="#74b9ff" font-size="11" font-weight="600">DATABASE</text>
  <text x="94" y="294" fill="#8888a0" font-size="10">YugabyteDB YSQL · pgvector</text>
  <rect x="330" y="268" width="105" height="22" rx="4" fill="#2d2d4a" stroke="#0984e3" stroke-width="0.5"/>
  <text x="382" y="283" text-anchor="middle" fill="#74b9ff" font-size="9">Apache AGE **</text>
  <rect x="445" y="268" width="70" height="22" rx="4" fill="#2d2d4a" stroke="#0984e3" stroke-width="0.5"/>
  <text x="480" y="283" text-anchor="middle" fill="#74b9ff" font-size="9">BM25 **</text>
  <rect x="525" y="268" width="70" height="22" rx="4" fill="#2d2d4a" stroke="#0984e3" stroke-width="0.5"/>
  <text x="560" y="283" text-anchor="middle" fill="#74b9ff" font-size="9">Valkey **</text>

  <!-- ── Layer 4: Observability ── -->
  <rect x="68" y="316" width="664" height="50" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="68" y="316" width="6" height="50" rx="3" fill="#fdcb6e"/>
  <text x="94" y="337" fill="#ffeaa7" font-size="11" font-weight="600">OBSERVABILITY</text>
  <text x="94" y="354" fill="#8888a0" font-size="10">Audit trails · RBAC · Chain-of-Thought logging</text>
  <rect x="420" y="328" width="90" height="22" rx="4" fill="#2d2d4a" stroke="#fdcb6e" stroke-width="0.5"/>
  <text x="465" y="343" text-anchor="middle" fill="#ffeaa7" font-size="9">LangFuse *</text>

  <!-- Arrow down from MEKO -->
  <line x1="400" y1="388" x2="400" y2="416" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="394,413 400,423 406,413" fill="#ff6b35"/>
  <text x="418" y="408" fill="#ff6b35" font-size="9" font-weight="600">YSQL</text>

  <!-- ═══════════ BOTTOM: YugabyteDB ═══════════ -->
  <rect x="140" y="424" width="520" height="52" rx="8" fill="url(#dbBg)" stroke="#2d6a2d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="448" text-anchor="middle" fill="#55efc4" font-size="13" font-weight="600">YugabyteDB</text>
  <text x="400" y="466" text-anchor="middle" fill="#7fad7f" font-size="10">Distributed PostgreSQL — local, cloud, on-prem, or air-gapped</text>

  <!-- ═══════════ LEGEND ═══════════ -->
  <text x="68" y="504" fill="#666680" font-size="9">* in progress</text>
  <text x="170" y="504" fill="#666680" font-size="9">** roadmap</text>

  <!-- Right side: Developer access labels -->
  <rect x="680" y="148" width="46" height="80" rx="4" fill="none" stroke="#2d2d4a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="703" y="175" text-anchor="middle" fill="#666680" font-size="8" transform="rotate(90 703 175)">CLI · API · SQL</text>
</svg>