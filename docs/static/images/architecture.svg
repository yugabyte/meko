<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="mekoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="mekoAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e85d26"/>
    </linearGradient>
    <linearGradient id="layerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e36"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="12" fill="url(#mekoBg)"/>

  <!-- ═══════════ TOP: Agent SDKs ═══════════ -->
  <rect x="60" y="24" width="680" height="52" rx="8" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="46" text-anchor="middle" fill="#b0b0c0" font-size="11" font-weight="500">AGENT SDKs &amp; AI TOOLS</text>
  <text x="400" y="64" text-anchor="middle" fill="#8888a0" font-size="10">CrewAI · LangChain · LangGraph · Cursor · Claude Code · OpenAI Agents</text>

  <!-- Arrow down -->
  <line x1="400" y1="76" x2="400" y2="100" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="394,97 400,107 406,97" fill="#ff6b35"/>
  <text x="418" y="94" fill="#ff6b35" font-size="9" font-weight="600">MCP</text>

  <!-- ═══════════ MEKO CORE ═══════════ -->
  <rect x="40" y="108" width="720" height="220" rx="10" fill="none" stroke="url(#mekoAccent)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="108" width="720" height="220" rx="10" fill="url(#mekoBg)" opacity="0.7"/>

  <!-- MEKO label -->
  <rect x="340" y="98" width="120" height="22" rx="4" fill="url(#mekoAccent)"/>
  <text x="400" y="114" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" letter-spacing="2">MEKO</text>

  <!-- ── Knowledge layer ── -->
  <rect x="68" y="136" width="562" height="50" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="68" y="136" width="6" height="50" rx="3" fill="#00b894"/>
  <text x="94" y="157" fill="#55efc4" font-size="11" font-weight="600">KNOWLEDGE</text>
  <text x="94" y="174" fill="#8888a0" font-size="10">pg_dist_rag · data lineage</text>
  <rect x="310" y="148" width="100" height="22" rx="4" fill="#2d2d4a" stroke="#00b894" stroke-width="0.5"/>
  <text x="360" y="163" text-anchor="middle" fill="#55efc4" font-size="9">MCP Server *</text>
  <rect x="420" y="148" width="90" height="22" rx="4" fill="#2d2d4a" stroke="#00b894" stroke-width="0.5"/>
  <text x="465" y="163" text-anchor="middle" fill="#55efc4" font-size="9">Reranking **</text>

  <!-- ── Memory layer ── -->
  <rect x="68" y="196" width="562" height="50" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="68" y="196" width="6" height="50" rx="3" fill="#6c5ce7"/>
  <text x="94" y="217" fill="#a29bfe" font-size="11" font-weight="600">MEMORY</text>
  <text x="94" y="234" fill="#8888a0" font-size="10">Entity and relationship extraction · graph storage</text>
  <rect x="370" y="208" width="90" height="22" rx="4" fill="#2d2d4a" stroke="#6c5ce7" stroke-width="0.5"/>
  <text x="415" y="223" text-anchor="middle" fill="#a29bfe" font-size="9">Meko Graph</text>
  <rect x="470" y="208" width="90" height="22" rx="4" fill="#2d2d4a" stroke="#6c5ce7" stroke-width="0.5"/>
  <text x="515" y="223" text-anchor="middle" fill="#a29bfe" font-size="9">Memory Store</text>

  <!-- ── Database layer ── -->
  <rect x="68" y="256" width="562" height="50" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="68" y="256" width="6" height="50" rx="3" fill="#0984e3"/>
  <text x="94" y="277" fill="#74b9ff" font-size="11" font-weight="600">DATABASE</text>
  <text x="94" y="294" fill="#8888a0" font-size="10">YugabyteDB YSQL · pgvector</text>
  <rect x="290" y="268" width="80" height="22" rx="4" fill="#2d2d4a" stroke="#0984e3" stroke-width="0.5"/>
  <text x="330" y="283" text-anchor="middle" fill="#74b9ff" font-size="9">Meko AGE</text>
  <rect x="380" y="268" width="80" height="22" rx="4" fill="#2d2d4a" stroke="#0984e3" stroke-width="0.5"/>
  <text x="420" y="283" text-anchor="middle" fill="#74b9ff" font-size="9">Vector Store</text>
  <rect x="470" y="268" width="55" height="22" rx="4" fill="#2d2d4a" stroke="#0984e3" stroke-width="0.5"/>
  <text x="497" y="283" text-anchor="middle" fill="#74b9ff" font-size="9">YSQL</text>
  <rect x="535" y="268" width="55" height="22" rx="4" fill="#2d2d4a" stroke="#0984e3" stroke-width="0.5"/>
  <text x="562" y="283" text-anchor="middle" fill="#74b9ff" font-size="9">Vector</text>

  <!-- ── Observability vertical layer ── -->
  <rect x="642" y="136" width="86" height="170" rx="6" fill="url(#layerBg)" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="642" y="136" width="86" height="6" rx="3" fill="#fdcb6e"/>
  <text x="685" y="172" text-anchor="middle" fill="#ffeaa7" font-size="7.5" font-weight="600">OBSERVABILITY</text>
  <text x="685" y="246" text-anchor="middle" fill="#8888a0" font-size="6">Audit trails · RBAC</text>
  <text x="685" y="263" text-anchor="middle" fill="#8888a0" font-size="6">Chain-of-Thought logging</text>

  <!-- ═══════════ LEGEND ═══════════ -->
  <text x="68" y="358" fill="#666680" font-size="9">* in progress</text>
  <text x="170" y="358" fill="#666680" font-size="9">** roadmap</text>
</svg>
