<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534" width="800" height="534" font-family="DM Sans, system-ui, sans-serif" role="img" aria-labelledby="arch-intro-title arch-intro-desc">
  <title id="arch-intro-title">Meko architecture: agents, MCP server, datapack, and storage</title>
  <desc id="arch-intro-desc">Agents A, B, and C connect through an MCP server to a Datapack containing memory, knowledge, and traces; storage is YugabyteDB with S3 tiering.</desc>

  <rect width="800" height="534" fill="#0d1117"/>

  <defs>
    <marker id="arch-intro-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6e7681"/>
    </marker>
  </defs>

  <!-- Agents — tighter spacing: three 156px boxes with 18px gaps, centered -->
  <g transform="translate(0,28)">
    <rect x="148" y="0" width="156" height="44" rx="10" fill="#0d1117" stroke="#484f58" stroke-width="1.2"/>
    <text x="226" y="29" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Agent A</text>
    <rect x="322" y="0" width="156" height="44" rx="10" fill="#0d1117" stroke="#484f58" stroke-width="1.2"/>
    <text x="400" y="29" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Agent B</text>
    <rect x="496" y="0" width="156" height="44" rx="10" fill="#0d1117" stroke="#484f58" stroke-width="1.2"/>
    <text x="574" y="29" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Agent C</text>
    <line x1="226" y1="44" x2="226" y2="76" stroke="#6e7681" stroke-width="1.25" marker-end="url(#arch-intro-arr)"/>
    <line x1="400" y1="44" x2="400" y2="76" stroke="#6e7681" stroke-width="1.25" marker-end="url(#arch-intro-arr)"/>
    <line x1="574" y1="44" x2="574" y2="76" stroke="#6e7681" stroke-width="1.25" marker-end="url(#arch-intro-arr)"/>
  </g>

  <!-- MCP server -->
  <g transform="translate(0,120)">
    <rect x="260" y="0" width="280" height="46" rx="10" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
    <rect x="260" y="0" width="5" height="46" rx="2.5" fill="#38bdf8"/>
    <text x="400" y="30" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">MCP server</text>
    <line x1="400" y1="46" x2="400" y2="78" stroke="#6e7681" stroke-width="1.25" marker-end="url(#arch-intro-arr)"/>
  </g>

  <!-- Datapack container -->
  <g transform="translate(100,206)">
    <rect width="600" height="218" rx="14" fill="#0d1117" stroke="#f97316" stroke-width="1.5"/>
    <g transform="translate(240,-14)">
      <rect width="120" height="28" rx="14" fill="#f97316"/>
      <text x="60" y="19" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="700" letter-spacing="1.2">DATAPACK</text>
    </g>

    <g transform="translate(20,36)">
      <!-- Memory -->
      <rect width="560" height="48" rx="8" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <rect width="4" height="48" rx="2" fill="#8b5cf6"/>
      <text x="20" y="31" fill="#8b5cf6" font-size="16" font-weight="700">Memory</text>

      <!-- Knowledge -->
      <g transform="translate(0,58)">
        <rect width="560" height="48" rx="8" fill="#06b6d4" fill-opacity="0.10" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
        <rect width="4" height="48" rx="2" fill="#06b6d4"/>
        <text x="20" y="31" fill="#06b6d4" font-size="16" font-weight="700">Knowledge</text>
      </g>

      <!-- Traces -->
      <g transform="translate(0,116)">
        <rect width="560" height="48" rx="8" fill="#eab308" fill-opacity="0.08" stroke="#eab308" stroke-opacity="0.4" stroke-width="1"/>
        <rect width="4" height="48" rx="2" fill="#eab308"/>
        <text x="20" y="31" fill="#eab308" font-size="16" font-weight="700">Traces</text>
      </g>
    </g>
  </g>

  <!-- Storage tier -->
  <g transform="translate(100,440)">
    <rect width="600" height="38" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">YugabyteDB + S3-tier</text>
  </g>

  <line x1="400" y1="424" x2="400" y2="440" stroke="#6e7681" stroke-width="1.25" marker-end="url(#arch-intro-arr)"/>
</svg>
