<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="DM Sans, system-ui, sans-serif">

  <rect width="1200" height="460" fill="#0d1117"/>

  <!-- Three agents -->
  <g transform="translate(300, 30)">
    <rect width="160" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="80" y="32" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Agent A</text>
  </g>
  <g transform="translate(520, 30)">
    <rect width="160" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="80" y="32" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Agent B</text>
  </g>
  <g transform="translate(740, 30)">
    <rect width="160" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="80" y="32" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Agent C</text>
  </g>

  <!-- Convergent dashed lines: agents → merge → MCP -->
  <g stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 5" fill="none">
    <line x1="380" y1="80" x2="380" y2="125"/>
    <line x1="600" y1="80" x2="600" y2="125"/>
    <line x1="820" y1="80" x2="820" y2="125"/>
    <line x1="380" y1="125" x2="820" y2="125"/>
    <line x1="600" y1="125" x2="600" y2="160"/>
  </g>
  <path d="M 594 156 L 600 162 L 606 156" fill="none" stroke="#f97316" stroke-width="1.5"/>

  <!-- MCP Server pill -->
  <g transform="translate(420, 165)">
    <rect width="360" height="48" rx="10" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
    <text x="180" y="20" text-anchor="middle" fill="#f97316" font-size="10" font-family="monospace, monospace" font-weight="500" letter-spacing="1.2">MODEL CONTEXT PROTOCOL</text>
    <text x="180" y="38" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">MCP Server</text>
  </g>

  <!-- Arrow MCP → Datapack -->
  <g transform="translate(600, 213)">
    <line x1="0" y1="0" x2="0" y2="44" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M -6 40 L 0 48 L 6 40" fill="none" stroke="#f97316" stroke-width="1.5"/>
  </g>

  <!-- ═══ DATAPACK CONTAINER ═══ -->
  <g transform="translate(160, 270)">
    <rect width="880" height="170" rx="14" fill="#0d1117" stroke="#f97316" stroke-width="1.5"/>
    <!-- DATAPACK badge -->
    <g transform="translate(380, -16)">
      <rect width="120" height="32" rx="16" fill="#f97316"/>
      <text x="60" y="21" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" letter-spacing="1.5">DATAPACK</text>
    </g>

    <!-- Memory (purple) -->
    <g transform="translate(28, 32)">
      <rect width="265" height="110" rx="10" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <rect width="5" height="110" rx="2.5" fill="#8b5cf6"/>
      <text x="20" y="32" fill="#8b5cf6" font-size="16" font-weight="700">Memory</text>
      <text x="20" y="60" fill="#e6edf3" font-size="12">Per-agent recall extracted</text>
      <text x="20" y="78" fill="#e6edf3" font-size="12">from conversations</text>
      <text x="20" y="100" fill="#8b949e" font-size="11" font-family="monospace, monospace">vector + graph search</text>
    </g>

    <!-- Knowledge (cyan) -->
    <g transform="translate(307, 32)">
      <rect width="265" height="110" rx="10" fill="#06b6d4" fill-opacity="0.10" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
      <rect width="5" height="110" rx="2.5" fill="#06b6d4"/>
      <text x="20" y="32" fill="#06b6d4" font-size="16" font-weight="700">Knowledge</text>
      <text x="20" y="60" fill="#e6edf3" font-size="12">Documents and facts shared</text>
      <text x="20" y="78" fill="#e6edf3" font-size="12">across all agents</text>
      <text x="20" y="100" fill="#8b949e" font-size="11" font-family="monospace, monospace">RAG · semantic search</text>
    </g>

    <!-- Traces (yellow) -->
    <g transform="translate(586, 32)">
      <rect width="265" height="110" rx="10" fill="#eab308" fill-opacity="0.10" stroke="#eab308" stroke-opacity="0.4" stroke-width="1"/>
      <rect width="5" height="110" rx="2.5" fill="#eab308"/>
      <text x="20" y="32" fill="#eab308" font-size="16" font-weight="700">Traces</text>
      <text x="20" y="60" fill="#e6edf3" font-size="12">Decision logs linked back</text>
      <text x="20" y="78" fill="#e6edf3" font-size="12">to source reasoning</text>
      <text x="20" y="100" fill="#8b949e" font-size="11" font-family="monospace, monospace">chain-of-thought · audit</text>
    </g>
  </g>
</svg>
