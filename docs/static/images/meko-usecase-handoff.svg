<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="DM Sans, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e" fill-opacity="0.7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444" fill-opacity="0.5"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#f97316" font-size="12" font-weight="600" letter-spacing="1.5">USE CASE</text>
  <text x="600" y="76" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">Multi-agent handoff without losing context</text>

  <!-- ═══ WITH MEKO ═══ -->
  <g transform="translate(60,120)">
    <text x="0" y="0" fill="#22c55e" font-size="13" font-weight="600" letter-spacing="0.5">✓  WITH MEKO</text>

    <!-- Agent A -->
    <g transform="translate(0,16)">
      <rect width="190" height="100" rx="12" fill="#161b22" stroke="#8b5cf6" stroke-opacity="0.4"/>
      <text x="20" y="32" fill="#8b5cf6" font-size="11" font-weight="600" letter-spacing="0.5">AGENT A</text>
      <text x="20" y="56" fill="#e6edf3" font-size="14" font-weight="600">Researches</text>
      <text x="20" y="76" fill="#8b949e" font-size="13">Gathers &amp; classifies</text>
    </g>

    <!-- Arrow -->
    <line x1="190" y1="66" x2="268" y2="66" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrGreen)"/>

    <!-- Transfers box -->
    <g transform="translate(278,16)">
      <rect width="500" height="100" rx="12" fill="#22c55e" fill-opacity="0.06" stroke="#22c55e" stroke-opacity="0.3"/>
      <rect width="4" height="100" rx="2" fill="#22c55e"/>
      <text x="24" y="26" fill="#22c55e" font-size="11" font-weight="600" letter-spacing="1">TRANSFERS VIA SHARED DATAPACK</text>
      <text x="24" y="54" fill="#e6edf3" font-size="15">Knowledge  ·  Memory  ·  Conversations</text>
      <text x="24" y="78" fill="#e6edf3" font-size="15">Traces  ·  Learnings  ·  Full reasoning chain</text>
    </g>

    <!-- Arrow -->
    <line x1="778" y1="66" x2="856" y2="66" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrGreen)"/>

    <!-- Agent B -->
    <g transform="translate(866,16)">
      <rect width="214" height="100" rx="12" fill="#161b22" stroke="#22c55e" stroke-opacity="0.4"/>
      <text x="20" y="32" fill="#22c55e" font-size="11" font-weight="600" letter-spacing="0.5">AGENT B</text>
      <text x="20" y="56" fill="#22c55e" font-size="14" font-weight="600">Continues with</text>
      <text x="20" y="76" fill="#22c55e" font-size="14" font-weight="600">full context</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="100" y1="280" x2="1100" y2="280" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ═══ WITHOUT MEKO ═══ -->
  <g transform="translate(60,320)" opacity="0.7">
    <text x="0" y="0" fill="#ef4444" font-size="13" font-weight="600" letter-spacing="0.5">✗  WITHOUT MEKO</text>

    <!-- Agent A -->
    <g transform="translate(0,16)">
      <rect width="190" height="100" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="32" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="0.5">AGENT A</text>
      <text x="20" y="56" fill="#e6edf3" font-size="14" font-weight="600">Researches</text>
      <text x="20" y="76" fill="#8b949e" font-size="13">Gathers &amp; classifies</text>
    </g>

    <!-- Arrow -->
    <line x1="190" y1="66" x2="268" y2="66" stroke="#30363d" stroke-width="1.2" marker-end="url(#arrRed)"/>

    <!-- Lost box -->
    <g transform="translate(278,16)">
      <rect width="500" height="100" rx="12" fill="#ef4444" fill-opacity="0.05" stroke="#ef4444" stroke-opacity="0.25"/>
      <rect width="4" height="100" rx="2" fill="#ef4444"/>
      <text x="24" y="26" fill="#ef4444" font-size="11" font-weight="600" letter-spacing="1">LOST IN HANDOFF</text>
      <text x="24" y="54" fill="#e6edf3" font-size="15">Output only  ·  Reasoning lost</text>
      <text x="24" y="78" fill="#e6edf3" font-size="15">Memory gone  ·  Context diluted  ·  No traces</text>
    </g>

    <!-- Arrow -->
    <line x1="778" y1="66" x2="856" y2="66" stroke="#30363d" stroke-width="1.2" marker-end="url(#arrRed)"/>

    <!-- Agent B -->
    <g transform="translate(866,16)">
      <rect width="214" height="100" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="32" fill="#ef4444" font-size="11" font-weight="600" letter-spacing="0.5">AGENT B</text>
      <text x="20" y="56" fill="#ef4444" font-size="14" font-weight="600">Starts from</text>
      <text x="20" y="76" fill="#ef4444" font-size="14" font-weight="600">scratch</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="600" text-anchor="middle" fill="#484f58" font-size="12" font-family="monospace, monospace">© 2026 All Rights Reserved</text>
</svg>
