{{/* Right rail (xl+): Feedback top-right; optional print link */ -}}
<div class="td-page-meta td-page-meta--docs-feedback pb-1 pt-2 d-print-none text-start">
  {{ partial "docs-feedback-dropdown.html" . }}
  {{ if .File -}}
  {{ with .CurrentSection.AlternativeOutputFormats.Get "print" -}}
  <div class="mt-2 text-end">
    <a id="print" href="{{ .RelPermalink | safeURL }}"><i class="fa-solid fa-print fa-fw"></i> {{ T "print_entire_section" }}</a>
  </div>
  {{ end -}}
  {{ end -}}
</div>
