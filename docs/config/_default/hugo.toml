baseURL = 'https://docs.mekodata.ai/'
languageCode = 'en-us'
resourceDir = 'docs/resources'

[markup.goldmark.renderer]
  unsafe = true

# Publish docs pages/sections at site root (no /docs prefix).
[permalinks.page]
  docs = "/:sections[1:]/:contentbasename/"

[permalinks.section]
  docs = "/:sections[1:]"

# Make home pages link-only so docs section landing pages can own root URLs
[cascade.build]
  render = "link"

[cascade.target]
  path = "/"
