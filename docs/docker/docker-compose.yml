services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meko-docs-dev
    ports:
      - "13131:13131"
    volumes:
      # Whole repo (Hugo needs repo root for resourceDir)
      - ../../:/workspace
      # Named volume overlays node_modules (avoids platform mismatch)
      - docs_node_modules:/workspace/docs/node_modules
      # Persist Go module cache (Docsy theme)
      - go_mod_cache:/go/pkg/mod
      # Persist Hugo module cache
      - hugo_cache:/tmp/hugo_cache
      # Mount GitHub CLI config for authentication
      - ~/.config/gh:/root/.config/gh:ro
    environment:
      - MEKO_HUGO_BASE=http://localhost:13131
      # Enable polling for file changes (needed for Colima/non-VirtioFS bind mounts)
      - HUGO_POLL=700ms
    working_dir: /workspace/docs
    stdin_open: true
    tty: true

volumes:
  docs_node_modules:
  go_mod_cache:
  hugo_cache:
