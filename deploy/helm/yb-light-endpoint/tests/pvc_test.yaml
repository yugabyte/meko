suite: pvc
templates:
  - templates/pvc.yaml
tests:
  - it: renders no PVC by default (emptyDir scratch)
    template: templates/pvc.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ReadWriteOnce PVC of the configured class and size
    template: templates/pvc.yaml
    set:
      persistence.storageClass: yb-standard
      persistence.size: 20Gi
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-yb-light-endpoint-data
      - equal:
          path: spec.storageClassName
          value: yb-standard
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi
