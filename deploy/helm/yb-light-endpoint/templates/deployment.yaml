apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yb-light-endpoint.fullname" . }}
  labels:
    {{- include "yb-light-endpoint.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.storageClass }}
  # The /data PVC is ReadWriteOnce — it attaches to one pod at a time — so a new
  # pod can't mount it while the old one still holds it. Recreate (stop the old
  # pod before starting the new one) instead of surging a second pod.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "yb-light-endpoint.selectorLabels" . | nindent 6 }}
  # PGDATA is ephemeral (compute_ctl re-fetches a basebackup each start) and all
  # durable state lives in YugabyteDB; the /data volume (emptyDir or a PVC) is
  # local scratch + cache, so replacing the pod is safe.
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.postgresExporter.enabled }}
        # Let a Prometheus/OTel Collector with pod service-discovery scrape the
        # postgres_exporter sidecar. Kept off the Service so metrics aren't
        # published on a (possibly LoadBalancer/tailnet-exposed) endpoint Service.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.postgresExporter.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "yb-light-endpoint.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: endpoint
          image: {{ include "yb-light-endpoint.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The image ENTRYPOINT is `tini -- python3 .../supervisor.py`.
          envFrom:
            - configMapRef:
                name: {{ include "yb-light-endpoint.fullname" . }}
          {{- if or (include "yb-light-endpoint.hasPassword" .) .Values.controller.url }}
          env:
          {{- if include "yb-light-endpoint.hasPassword" . }}
            - name: YB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yb-light-endpoint.secretName" . }}
                  key: {{ include "yb-light-endpoint.secretKey" . }}
          {{- end }}
          {{- if .Values.controller.url }}
            # The address the controller dials back to reach this
            # endpoint's pageserver/safekeeper. Use the endpoint's own Service DNS
            # (stable) rather than the pod IP: a rescheduled pod (new IP) then
            # re-registers the SAME address, so the controller's node-register
            # stays UpToDate instead of returning 409 (#121). kube-proxy routes
            # the Service to whichever pod currently backs it.
            - name: CONTROLLER_REACHABLE_HOST
              value: {{ include "yb-light-endpoint.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
          {{- end }}
          {{- end }}
          ports:
            - name: pg-compute
              containerPort: {{ .Values.endpoint.computePort }}
              protocol: TCP
            {{- if or .Values.service.exposeInternalHttp .Values.controller.url }}
            - name: ps-http
              containerPort: {{ .Values.ports.pageserverHttp }}
              protocol: TCP
            - name: sk-http
              containerPort: {{ .Values.ports.safekeeperHttp }}
              protocol: TCP
            - name: es-http
              containerPort: {{ .Values.ports.endpointStorageHttp }}
              protocol: TCP
            {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: pg-compute
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: pg-compute
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.endpoint.resources }}
          {{- if and .cpu .memory }}
          # request == limit for both cpu and memory => the pod is scheduled with
          # the Guaranteed QoS class (kubelet never evicts it under node pressure
          # and it can't burst past its reservation). NB: every OTHER container in
          # this pod must ALSO set request == limit or the pod drops to Burstable.
          resources:
            requests:
              cpu: {{ .cpu | quote }}
              memory: {{ .memory | quote }}
            limits:
              cpu: {{ .cpu | quote }}
              memory: {{ .memory | quote }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: run
              mountPath: /data
        {{- if .Values.metrics.postgresExporter.enabled }}
        # postgres_exporter sidecar: scrapes the compute's Postgres over the pod's
        # shared loopback and exposes Prometheus metrics for the amp metrics
        # pipeline (controller/architecture/ac-metrics.md). Mirrors the VM-image
        # exporter: cloud_admin via trust auth (no password), database collector
        # off (it errors against the storage layer).
        - name: postgres-exporter
          image: "{{ .Values.metrics.postgresExporter.image.repository }}:{{ .Values.metrics.postgresExporter.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.postgresExporter.image.pullPolicy }}
          {{- with .Values.metrics.postgresExporter.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --web.listen-address=:{{ .Values.metrics.postgresExporter.port }}
            - --no-collector.database
            {{- range .Values.metrics.postgresExporter.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: DATA_SOURCE_NAME
              value: "host=localhost port={{ .Values.endpoint.computePort }} user={{ .Values.metrics.postgresExporter.user }} dbname={{ .Values.metrics.postgresExporter.dbname }} sslmode=disable application_name=postgres-exporter options='-c pgaudit.log=none'"
          ports:
            - name: pg-metrics
              containerPort: {{ .Values.metrics.postgresExporter.port }}
              protocol: TCP
          {{- with .Values.metrics.postgresExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: run
        {{- if .Values.persistence.storageClass }}
          persistentVolumeClaim:
            claimName: {{ include "yb-light-endpoint.fullname" . }}-data
        {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.runDir.sizeLimit }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
