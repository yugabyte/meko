{{- if .Values.persistence.storageClass }}
# The endpoint's /data volume, backed by a network block volume of the given
# storage class (EBS on AWS, Persistent Disk on GCP). One pod per endpoint, so a
# single ReadWriteOnce claim suffices; it is part of the release and is removed
# with it on `helm uninstall` (endpoint retire frees the volume).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yb-amp-endpoint.fullname" . }}-data
  labels:
    {{- include "yb-amp-endpoint.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
