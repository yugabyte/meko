suite: ui
templates:
  - templates/ui-deployment.yaml
  - templates/ui-service.yaml
tests:
  - it: renders the UI Deployment pointing CONTROLLER_URL at the controller Service
    template: templates/ui-deployment.yaml
    release:
      namespace: amp
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: amp-controller-ui
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROLLER_URL
            value: http://amp-controller.amp.svc.cluster.local:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UI_PORT
            value: "80"

  - it: honours an explicit ui.controllerUrl override
    template: templates/ui-deployment.yaml
    set:
      ui.controllerUrl: http://my-controller:9000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROLLER_URL
            value: http://my-controller:9000

  - it: defaults the UI image tag to the chart appVersion and honours overrides
    template: templates/ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: amp/controller-ui:0.1.0

  - it: exposes the http container port and HTTP /healthz probes
    template: templates/ui-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 80
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http

  # The UI is exposed on its OWN Service via ui.service.type (default internal-lb),
  # independent of the controller. An in-cluster ClusterIP is always present.
  - it: always renders the in-cluster UI ClusterIP Service on the http port
    template: templates/ui-service.yaml
    set:
      ui.service.type: none
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: amp-controller-ui
        documentIndex: 0
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 0
      - contains:
          path: spec.ports
          content:
            name: http
            port: 80
            targetPort: http
        documentIndex: 0

  - it: gives the UI its own internal LoadBalancer by default (ui.service.type=internal-lb)
    template: templates/ui-service.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: amp-controller-ui-lb
        documentIndex: 1
      - equal:
          path: spec.type
          value: LoadBalancer
        documentIndex: 1
      - equal:
          path: metadata.annotations["networking.gke.io/load-balancer-type"]
          value: Internal
        documentIndex: 1

  - it: exposes the UI as NodePort when ui.service.type=nodeport
    template: templates/ui-service.yaml
    set:
      ui.service.type: nodeport
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: amp-controller-ui-np
        documentIndex: 1
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 1

  - it: gives the UI an internal LB independent of the controller (controller nodeport)
    template: templates/ui-service.yaml
    set:
      controller.service.type: nodeport
      ui.service.type: internal-lb
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: amp-controller-ui-lb
        documentIndex: 1
      - equal:
          path: spec.type
          value: LoadBalancer
        documentIndex: 1

  - it: honours custom ui.service.annotations on the UI LoadBalancer
    template: templates/ui-service.yaml
    set:
      ui.service.type: internal-lb
      ui.service.annotations:
        - "networking.gke.io/load-balancer-type=Internal"
        - "example.com/team=amp"
    asserts:
      - equal:
          path: metadata.annotations["example.com/team"]
          value: amp
        documentIndex: 1

  - it: drops the UI Deployment when ui.enabled=false
    template: templates/ui-deployment.yaml
    set:
      ui.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: drops the UI Service when ui.enabled=false
    template: templates/ui-service.yaml
    set:
      ui.enabled: false
    asserts:
      - hasDocuments:
          count: 0
