suite: rbac
templates:
  - templates/rbac.yaml
tests:
  - it: renders the ServiceAccount, Role, RoleBinding, ClusterRole, ClusterRoleBinding
    release:
      namespace: amp
    asserts:
      - hasDocuments:
          count: 5
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: amp-controller
        documentIndex: 0
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-controller
        documentIndex: 1
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-controller
        documentIndex: 2
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-amp-controller-namespaces
        documentIndex: 3
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-amp-controller-namespaces
        documentIndex: 4

  - it: grants namespaced workload + cluster-scoped namespace/node access
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: [deployments, replicasets, statefulsets]
            verbs: ["*"]

  - it: binds the ClusterRole to the controller ServiceAccount in the release namespace
    release:
      namespace: amp
    documentIndex: 4
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: amp-controller
            namespace: amp

  # rbac.clusterScoped=false drops the two cluster-scoped documents (for
  # namespace-scoped installs on shared clusters); the namespaced SA/Role/RoleBinding
  # stay.
  - it: omits the cluster-scoped docs when rbac.clusterScoped is false
    release:
      namespace: amp
    set:
      rbac.clusterScoped: false
    asserts:
      - hasDocuments:
          count: 3
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: amp-controller
        documentIndex: 0
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-controller
        documentIndex: 1
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: amp-controller
        documentIndex: 2

  # The ClusterRole/ClusterRoleBinding are cluster-scoped, so their names are
  # namespace-prefixed to stay unique when the chart is installed into more than
  # one namespace.
  - it: namespace-prefixes the cluster-scoped names so releases don't collide
    release:
      namespace: staging
    asserts:
      - equal:
          path: metadata.name
          value: staging-amp-controller-namespaces
        documentIndex: 3
      - equal:
          path: metadata.name
          value: staging-amp-controller-namespaces
        documentIndex: 4
