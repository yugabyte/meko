{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yb-amp-controller.mcpName" . }}
  labels:
    {{- include "yb-amp-controller.mcpSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "yb-amp-controller.mcpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yb-amp-controller.mcpSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "yb-amp-controller.mcpImage" . }}
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
          env:
            - name: AMP_CONTROLLER_URL
              value: {{ include "yb-amp-controller.mcpControllerUrl" . | quote }}
            - name: AMP_MCP_TRANSPORT
              value: {{ .Values.mcp.transport | quote }}
            - name: AMP_MCP_HOST
              value: "0.0.0.0"
            - name: AMP_MCP_PORT
              value: {{ .Values.mcp.port | quote }}
          # The server serves GET /healthz on the HTTP port (only meaningful in
          # http transport, which this pod always runs), so probe it directly —
          # an HTTP 200 confirms the MCP app is actually serving, not just that
          # the port is bound.
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: {{ .Values.mcp.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcp.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: {{ .Values.mcp.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcp.livenessProbe.periodSeconds }}
          {{- with .Values.mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
