apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yb-amp-controller.controllerName" . }}
  labels:
    {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yb-amp-controller.controllerSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yb-amp-controller.controllerName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "yb-amp-controller.controllerImage" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.controller.ports.api }}
            - name: sc
              containerPort: {{ .Values.controller.ports.sc }}
          env:
            - name: AMP_DATABASE_URL
              value: {{ .Values.controller.databaseUrl | quote }}
            - name: AMP_DB_SCHEMA
              value: {{ .Values.controller.dbSchema | quote }}
            - name: AMP_LOG_FORMAT
              value: {{ .Values.controller.logFormat | quote }}
            # Managed storage controller (in-pod subprocess), dev mode (no auth).
            - name: AMP_STORAGE_CONTROLLER_DEV
              value: {{ .Values.controller.storageController.dev | quote }}
            - name: AMP_STORAGE_CONTROLLER_LISTEN
              value: "0.0.0.0:{{ .Values.controller.ports.sc }}"
            # Endpoint deployer. This chart only ever runs on Kubernetes, so the
            # driver is fixed to the Kubernetes/Helm driver (not a value).
            - name: AMP_DEPLOY
              value: "true"
            - name: AMP_DEPLOY_DRIVER
              value: "kubernetes"
            - name: AMP_DEPLOY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AMP_ENDPOINT_IMAGE_REPO
              value: {{ .Values.controller.endpoint.image.repository | quote }}
            - name: AMP_ENDPOINT_IMAGE_TAG
              value: {{ .Values.controller.endpoint.image.tag | default .Chart.AppVersion | quote }}
            {{- with .Values.imagePullSecrets }}
            - name: AMP_DEPLOY_PULL_SECRET
              value: {{ (first .).name | quote }}
            {{- end }}
            - name: AMP_DEPLOY_YB_HOST_PORTS
              value: {{ .Values.controller.endpoint.ybHostPorts | quote }}
            - name: AMP_DEPLOY_YB_USER
              value: {{ .Values.controller.endpoint.ybUser | quote }}
            - name: AMP_DEPLOY_YB_DBNAME
              value: {{ .Values.controller.endpoint.ybDbname | quote }}
            # The in-cluster URL endpoints use to reach this controller's SC.
            - name: AMP_DEPLOY_STORAGE_CONTROLLER_URL
              value: {{ include "yb-amp-controller.storageControllerUrl" . | quote }}
            - name: AMP_DEPLOY_BOOTSTRAP
              value: {{ .Values.controller.endpoint.bootstrap | quote }}
            # Endpoint Service exposure. ClusterIP (default) avoids a per-endpoint
            # cloud LB; LoadBalancer uses the annotations (e.g. internal-LB). The
            # controller parses the annotations as a "k=v,k=v" CSV.
            - name: AMP_DEPLOY_SERVICE_TYPE
              value: {{ .Values.controller.endpoint.service.type | quote }}
            - name: AMP_DEPLOY_SERVICE_ANNOTATIONS
              value: {{ join "," .Values.controller.endpoint.service.annotations | quote }}
            # Endpoint data volume: a PVC of this storage class (empty => emptyDir).
            - name: AMP_DEPLOY_STORAGE_CLASS
              value: {{ .Values.controller.endpoint.storageClass | quote }}
            - name: AMP_DEPLOY_DISK_SIZE
              value: {{ .Values.controller.endpoint.diskSize | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: {{ .Values.controller.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.controller.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: {{ .Values.controller.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.controller.livenessProbe.periodSeconds }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
