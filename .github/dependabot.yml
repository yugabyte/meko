# Dependabot version updates, assigned to the maintainer.
#
# Commit prefixes follow the title rules (scripts/check-title.sh) and the release rules
# (scripts/release/release-notes.sh), and name the component: Dependabot adds the `: `.
# Every AgentK npm bump is `deps(agentk): ...`, so it cuts a release once merged to main: the web
# UI's libraries (react, xterm, marked, dompurify) are devDependencies that Vite bundles into the
# release. Action bumps are `ci(repo): ...` and ship with the next release. Meko's bumps are
# `deps(meko): ...` (Go modules) and `deps(meko/memory-engine): ...` (the memory engine's
# production npm packages, which its tarballs bundle), so they cut a Meko release
# (meko-release.yml); the memory engine's dev-only bumps are `chore(meko/memory-engine): ...`.
# The web UI's (backend/web_ui) are `deps(meko/web-ui): ...` for its dependencies (react,
# react-dom, lucide-react, qrcode), which Vite bundles into the web_ui/dist that Meko's release
# serves, so they cut a Meko release; and `chore(meko/web-ui): ...` for its devDependencies (the
# Vite and Tailwind build, TypeScript, types, Vitest and happy-dom), which run only at build and
# test time and ship with the next Meko release rather than cutting one each. A grouped PR with
# both kinds (react with @types/react) takes the `deps` prefix.
# No `include: scope`: it would add `(deps)`, giving `deps(agentk)(deps): ...`.
# extensions/agentk/test/unit/dependabot.test.ts checks this against both scripts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /extensions/agentk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    assignees:
      - hari90
    commit-message:
      prefix: deps(agentk)
      prefix-development: deps(agentk)
    ignore:
      # Types track the Node major we run on (engines, .nvmrc, the bundled runtime).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 ships no compiler API, and typescript-eslint 8 refuses it (peer range
      # <6.1.0, and a throw at load). Drop this once typescript-eslint supports TS 7:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # A package goes into the first group it matches. Packages that must move together
    # (peer ranges) share a group for every update type, majors included, so a stuck bump
    # only holds back its own family. Everything else: one PR per dependency type for minor
    # and patch bumps, and one PR per major.
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      xterm:
        patterns: ["@xterm/*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest"]
      typescript:
        patterns: ["typescript", "typescript-eslint"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Meko's Go modules. CI's Backend job builds and tests each PR.
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    assignees:
      - hari90
    commit-message:
      prefix: deps(meko)
    ignore:
      # go.mod replaces mattn/go-sqlite3 with a tag of the yugabyte/go-sqlite3 fork (SQLite with
      # sqlite-vec), so a bump of the require line would change nothing: upgrade the fork's tag by hand.
      - dependency-name: "github.com/mattn/go-sqlite3"
    groups:
      # Minor and patch bumps together; each major gets its own PR.
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  # Meko's memory engine (Node). Its dependencies are pinned exactly, and Dependabot keeps them so.
  - package-ecosystem: npm
    directory: /backend/memory_engine
    schedule:
      interval: weekly
      day: monday
    assignees:
      - hari90
    commit-message:
      prefix: deps(meko/memory-engine)
      prefix-development: chore(meko/memory-engine)
    ignore:
      # Types track the Node major the memory engine runs on (engines: >=22.13).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The memory engine registers its providers by wrapping mem0's internal factories, so mem0ai comes
      # alone: a bump that breaks that seam doesn't hold back the others.
      mem0ai:
        patterns: ["mem0ai"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Meko's web UI (React, Vite, Tailwind). Its dependencies are pinned exactly, and Dependabot keeps them so.
  - package-ecosystem: npm
    directory: /backend/web_ui
    schedule:
      interval: weekly
      day: monday
    assignees:
      - hari90
    commit-message:
      prefix: deps(meko/web-ui)
      prefix-development: chore(meko/web-ui)
    # As in AgentK's entry: families with peer ranges on each other share a group for every update
    # type, and everything else gets one PR per dependency type for minor and patch bumps.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest"]
      # tailwindcss and its Vite plugin are released together, at the same version.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees:
      - hari90
    commit-message:
      prefix: ci(repo)
    groups:
      # Minor and patch bumps together; each major gets its own PR.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
