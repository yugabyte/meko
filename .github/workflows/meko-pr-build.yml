name: Meko CI

# Per-component PR validation, gated on which files actually changed:
#   meko_api_server — Go REST API: `go build` (fail fast), `go vet`,
#                     golangci-lint (non-blocking for now), then `go test ./...`.
#                     Tests are mocked; the few DB-backed tests self-skip when no
#                     YugabyteDB is present, so no database is needed in CI.
#   meko_migration_versions — checks migration files this PR adds/renumbers against
#                     main's tip: version+direction collisions (with main and with
#                     this PR's own other added files), version-sequence gaps, and
#                     every version having both an up.sql and a down.sql. Fires only
#                     when internal/db/migrations/** changes.
#   meko_migrations_recheck — push-to-main only: when main's own migrations change,
#                     re-runs meko_migration_versions (and so meko_ci_gate) on every
#                     other open PR that also touches migrations, so a PR whose check
#                     already passed doesn't merge on a now-stale result. Excluded
#                     from meko_ci_gate since it never runs on the pull_request event
#                     that gate is evaluated on.
#   meko_inference  — inference_gateway (Python): install with the dev extra, run
#                     pytest. All upstream (LLM / MCP) calls are mocked — no creds.
#   meko_ui         — meko_ui: `npm ci`, `npm run check` (tsc), unit tests
#                     (vitest), and the production build.
#   meko_ycp        — ycp (the BYOC agent + dpmcp): gofmt, `go build`, `go vet`,
#                     `go test ./...`, and a check that the client generated from
#                     the amp spec vendored at ycp/internal/ampclient/ is current
#                     (the spec copy itself is guarded by a unit test). Also fires
#                     on that spec, since a controller-only PR is what leaves the
#                     copy stale.
#   meko_ycp_e2e    — YCP build + deploy smoke test: builds the api-server and
#                     agent images and deploys them to a throwaway kind cluster,
#                     asserting the control plane migrates and serves, an agent
#                     enrolls and reports READY, and a restarted agent enrolls
#                     again and keeps reporting. Publishing the agent image is a
#                     separate workflow (ycp-reconciler-agent-image.yml) that runs
#                     only on merge to main.
#                     Fires on `ycp/**` and on the meko/api_server files that make up
#                     the control plane (see the meko_ycp_cp filter).
#   meko_docs       — Public MCP docs surface check: tool count vs reference rows,
#                     and required companion guides for documented tool prefixes
#                     (memory_*, knowledgebase_*, artifact_*). Fires on docs and
#                     on this workflow file — including docs-only PRs.
#
# Docs-only PRs (only *.md changed) skip the heavy jobs via the `meko_code` filter;
# meko_docs is the exception and still runs when docs change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# The anchor makes meko_migration_versions's `name:` and
# meko_migrations_recheck's job-lookup string the same literal value at YAML
# parse time -- meko_migrations_recheck finds the other job by matching this
# name against the GitHub API's job list, which has no other handle back to
# a specific job in this file, so the two can't be allowed to drift apart.
env:
  MEKO_MIGRATION_CHECK_JOB_NAME: &migration_check_job_name "Meko API Server — migration version check"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      meko_api_server: ${{ steps.filter.outputs.meko_api_server }}
      meko_migrations: ${{ steps.filter.outputs.meko_migrations }}
      meko_inference: ${{ steps.filter.outputs.meko_inference }}
      meko_ui: ${{ steps.filter.outputs.meko_ui }}
      meko_ycp: ${{ steps.filter.outputs.meko_ycp }}
      meko_foundation: ${{ steps.filter.outputs.meko_foundation }}
      meko_ycp_cp: ${{ steps.filter.outputs.meko_ycp_cp }}
      meko_docs: ${{ steps.filter.outputs.meko_docs }}
      meko_code: ${{ steps.code.outputs.meko_code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            meko_api_server:
              - 'meko/api_server/**'
              - '.github/workflows/meko-pr-build.yml'
              # Not api_server sources, but the two other copies of the EnvState
              # list that TestEnvStateListsAgreeAcrossTheRepo compares against.
              # A new state naturally gets written in one of these FIRST, and
              # without them such a PR skips this job and merges with the copies
              # disagreeing -- which is the one case the test exists to catch.
              - 'ycp/internal/api/types.go'
              - 'meko/design/ycp-openapi.yaml'
            # Scoped narrower than meko_api_server: this job diffs against
            # main and only cares about the migrations tree (plus the tool
            # that checks it), not every api_server PR.
            # Unlike every other filter here, this one deliberately omits
            # the workflow file itself: meko_migration_versions should only
            # fire when the migrations folder is touched, not on every edit
            # to this file (most of which are unrelated to it).
            meko_migrations:
              - 'meko/api_server/internal/db/migrations/**'
            meko_inference:
              - 'meko/inference_gateway/**'
              - '.github/workflows/meko-pr-build.yml'
            meko_ui:
              - 'meko/meko_ui/**'
              - '.github/workflows/meko-pr-build.yml'
            # The amp spec is here because ycp vendors a copy of it: a PR that
            # edits only the controller's spec is exactly the one that leaves the
            # copy stale, and it touches nothing under ycp/.
            meko_ycp:
              - 'ycp/**'
              - 'amp/controller/internal/api/openapi_spec.yaml'
              - '.github/workflows/meko-pr-build.yml'
            meko_foundation:
              - 'foundation/**'
              - '.github/workflows/meko-pr-build.yml'
            meko_docs:
              - 'meko/docs/content/docs/**'
              - 'meko/docs/static/llms.txt'
              - 'meko/docs/scripts/check-mcp-docs.py'
              - '.github/workflows/meko-pr-build.yml'
            # The e2e runs api_server --control-plane-mode, so control-plane
            # changes have to trigger it too -- otherwise the one test that covers
            # the real control plane never runs when the control plane changes.
            # Deliberately narrower than 'meko/api_server/**': this job builds two
            # images and a kind cluster, and most api_server PRs touch none of
            # the YCP surface. The internal/api package is taken whole, though —
            # routing, ServerConfig and the base-path mount are split across
            # several files there, and listing them one at a time meant a change
            # to the one that wasn't listed skipped the e2e.
            meko_ycp_cp:
              - 'ycp/**'
              - 'meko/api_server/main.go'
              - 'meko/api_server/Dockerfile'
              - 'meko/api_server/internal/api/**'
              - 'meko/api_server/internal/service/environment_*.go'
              - 'meko/api_server/internal/repository/environment_*.go'
              - 'meko/api_server/internal/handlers/environment_*.go'
              - 'meko/api_server/internal/handlers/console*.go'
              - 'meko/api_server/internal/handlers/web/**'
              - 'meko/api_server/internal/db/**'
              - 'meko/api_server/internal/auth/internal_auth.go'   # RequireAdminSecret
              - '.github/workflows/meko-pr-build.yml'
      # A change counts as "code" if at least one changed file is not a markdown
      # doc; the jobs gate on it so a docs-only PR skips build/test while a PR
      # touching both code and docs still builds.
      #
      # `predicate-quantifier: every` combines the patterns *within this rule*
      # for a single file: a file matches only if it is under '**' AND is not
      # '**/*.md'. It does NOT mean "every changed file must match" — the filter
      # output is still true when any one file matches. That distinction is why
      # this must stay a negated pattern: a bare positive '**/*.md' rule is true
      # whenever a PR touches even one markdown file, which silently skipped CI
      # on every mixed code+docs PR.
      - uses: dorny/paths-filter@v4
        id: code
        with:
          predicate-quantifier: 'every'
          filters: |
            meko_code:
              - '**'
              - '!**/*.md'

  meko_api_server:
    name: Meko API Server — build, vet & tests
    needs: changes
    if: needs.changes.outputs.meko_api_server == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: meko/api_server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: meko/api_server/go.mod
          cache-dependency-path: meko/api_server/go.sum

      # Build first so a compile break fails fast with a clear message before
      # tests run.
      - name: Build
        run: go build ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      # Non-blocking: the baseline is ~490 findings (mostly lll, errcheck and
      # govet's stricter enable-all set), so this surfaces findings without
      # failing the PR. Flip to blocking once that is worked down.
      #
      # Both versions are pinned on purpose. The config file format is itself
      # versioned — `.golangci.yml` declares `version: "2"` — and action v7+
      # runs golangci-lint v2 only, so an unpinned `latest` silently stops
      # matching the config the day a new major ships. That already happened:
      # this step ran `latest` (v2) against a v1 config under a v1-only action
      # and errored on every run, invisible because of continue-on-error.
      # Keep the version in step with GOLANGCI_LINT_VERSION in
      # meko/meko-provisioner/Makefile so the whole repo lints identically.
      - name: Lint (golangci-lint)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          working-directory: meko/api_server

      # Unit tests are mocked; the few DB-backed tests self-skip when no
      # YugabyteDB is reachable, so this runs without a database.
      - name: Tests
        run: go test ./...

  # A PR branch cut before some other, already-merged PR added its own
  # same-numbered migration to main never has both files in its own history
  # — nothing collides within that branch's tree — yet the two land on main
  # together the moment this PR merges. internal/db/migrations/checkmigrations
  # catches that by diffing this branch against main's tip fetched fresh in
  # this job, not whatever commit the PR's merge-ref happened to snapshot
  # when the run started.
  meko_migration_versions:
    name: *migration_check_job_name
    needs: changes
    if: needs.changes.outputs.meko_migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: meko/api_server
    steps:
      # Full history: merge-base needs to find where this branch actually
      # diverged from main, which a shallow (default depth-1) checkout of
      # just the PR's merge-ref can't answer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: meko/api_server/go.mod
          cache-dependency-path: meko/api_server/go.sum

      - name: Fetch main's current tip
        run: git fetch origin main

      - name: Check migration versions against main
        # No path argument: checkmigrations' own default is already
        # repo-root-relative ("meko/api_server/internal/db/migrations"), and
        # this step's working-directory is meko/api_server -- passing a
        # working-directory-relative path here would resolve to nothing
        # under checkAgainstRef's `git -C <repo root>`, making every run a
        # silent, always-passing no-op.
        run: go run ./internal/db/migrations/checkmigrations origin/main

  # meko_migration_versions above only re-checks a PR when the PR itself
  # pushes. If PR A merges a migration after PR B (open since before that,
  # also touching migrations) already passed its own check, B's result goes
  # stale -- nothing re-runs it, and the ruleset does not require branches to
  # be up to date before merging. Push-triggered only: whenever main's own
  # migrations change, re-run meko_migration_versions on every other open PR
  # that also touches migrations, so its result reflects the new main instead
  # of whatever main looked like at B's last push. A job rerun cascades to
  # whatever depends on it, so this also re-runs meko_ci_gate -- the PR's
  # actual required check updates, not just an internal job nobody reads.
  # Also leaves a PR comment: a check rerun alone doesn't notify anyone the
  # way a comment does, so B's author would otherwise only learn about a
  # failure by noticing the Checks tab or trying to merge.
  meko_migrations_recheck:
    name: Meko API Server — re-check open PRs' migration versions
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.meko_migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Re-run the migration version check on every open PR touching migrations
        run: |
          set -euo pipefail

          prs=$(gh pr list --repo "$REPO" --state open --json number,headRefName --jq '.[] | @base64')

          for row in $prs; do
            pr=$(echo "$row" | base64 -d | jq -r '.number')
            branch=$(echo "$row" | base64 -d | jq -r '.headRefName')

            # .sql specifically, not the whole folder: it also holds the
            # checkmigrations tool and its tests, and a PR that only touched
            # those has no added/renamed migration for a collision to hide
            # in, so there's nothing here worth re-checking or commenting on.
            files=$(gh api --method GET "repos/$REPO/pulls/$pr/files" --paginate --jq '.[].filename')
            if ! grep -qE '^meko/api_server/internal/db/migrations/.*\.sql$' <<<"$files"; then
              continue
            fi
            echo "PR #$pr ($branch) touches migrations -- re-checking against the new main"

            run_id=$(gh api --method GET "repos/$REPO/actions/workflows/meko-pr-build.yml/runs" \
              -f event=pull_request -f branch="$branch" -f status=completed \
              --jq '.workflow_runs[0].id // empty')
            if [ -z "$run_id" ]; then
              echo "  no completed meko-pr-build.yml run found for $branch yet, skipping"
              continue
            fi

            job_id=$(gh api --method GET "repos/$REPO/actions/runs/$run_id/jobs" --paginate \
              --jq ".jobs[] | select(.name == \"$MEKO_MIGRATION_CHECK_JOB_NAME\") | .id")
            if [ -z "$job_id" ]; then
              echo "  run $run_id has no migration version check job (filter was false then), skipping"
              continue
            fi

            gh api -X POST "repos/$REPO/actions/jobs/$job_id/rerun"

            # A rerun alone only flips a check in the PR's Checks tab --
            # nothing pings the author the way a PR comment does. Post one
            # so a failure here isn't discovered only when they try to merge.
            comment_body=$(printf "main's migrations changed since this PR's last CI run, so the migration version check is being re-run against the new main:\n%s\n\nIf it fails, another PR claimed a version number this PR also used -- rebase onto main and renumber to the next free version." \
              "https://github.com/$REPO/actions/runs/$run_id/job/$job_id")
            gh pr comment "$pr" --repo "$REPO" --body "$comment_body"
          done

  meko_inference:
    name: Meko Inference Gateway — tests
    needs: changes
    if: needs.changes.outputs.meko_inference == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meko/inference_gateway
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install (with dev extra)
        run: pip install -e ".[dev]"

      # All upstream calls are mocked — no network / no creds needed.
      - name: Tests
        run: pytest -q

  meko_ui:
    name: Meko UI — typecheck, tests & build
    needs: changes
    if: needs.changes.outputs.meko_ui == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: meko/meko_ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meko/meko_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  meko_ycp:
    name: Meko YCP — build, vet & tests
    needs: changes
    if: needs.changes.outputs.meko_ycp == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ycp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ycp/go.mod
          cache-dependency-path: ycp/go.sum

      # Blocking from the start: this module is formatted and vet-clean as of the
      # commit that added this job, so there is no baseline to grandfather in.
      - name: Format (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # The spec copy itself is guarded by a unit test (spec_vendor_test.go), so
      # this step is here for the other half: that ampclient.gen.go was actually
      # regenerated from it. Regenerates into a scratch tree, so it reports drift
      # without touching the checkout.
      - name: Generated amp client in sync
        run: ./internal/ampclient/sync-spec.sh --check

      - name: Build
        run: go build ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Tests
        run: go test ./...

  meko_foundation:
    name: Meko foundation — build, vet & tests
    needs: changes
    if: needs.changes.outputs.meko_foundation == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foundation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: foundation/go.mod
          cache-dependency-path: foundation/go.sum

      # Blocking from the start: this module is formatted and vet-clean as of the
      # commit that added this job, so there is no baseline to grandfather in.
      - name: Format (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      # The tests need no cluster: they compare rendered manifests against
      # golden files and exercise the deployer through its command-runner seam.
      # Field names and types are NOT checked here — the API server rejects
      # those on apply — so a golden-file diff is the signal to read closely.
      - name: Tests
        run: go test -race ./...

  meko_ycp_e2e:
    name: Meko YCP — build & deploy (kind)
    needs: changes
    if: needs.changes.outputs.meko_ycp_cp == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    # Image builds + a kind cluster + Postgres reaching ready is the slow part.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: helm/kind-action@v1
        with:
          cluster_name: ycp-e2e
          # The script creates and tears down its own cluster; this action is here
          # to install the kind binary and nothing else.
          install_only: true

      # Builds the api-server and meko-agent images, loads them into a throwaway
      # kind cluster, and drives the real bring-up against api_server
      # --control-plane-mode: controlplane migrations on plain Postgres, health,
      # the admin-secret gate, register -> enroll -> READY, then a restart that
      # must check in again on its api key and keep reporting.
      # Dumps pod state, logs and events on failure.
      - name: Build & deploy smoke test
        run: ./test/e2e/run.sh
        working-directory: ycp

  meko_docs:
    name: Meko docs — MCP tool surface
    needs: changes
    # Docs-only PRs skip the code jobs; this one must still run when docs change.
    if: needs.changes.outputs.meko_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check MCP docs tool surface
        run: python3 meko/docs/scripts/check-mcp-docs.py

  # The single required check for this workflow. The `main-branch` ruleset requires
  # "Meko CI gate" and nothing else from here, so adding a job above never means
  # touching repository settings — add it to `needs` and it is gated. The gate's own
  # step audits that: a job missing from `needs` fails the PR that added it.
  meko_ci_gate:
    name: Meko CI gate
    # See .github/actions/ci-gate: always() is load-bearing, and skipped passes.
    if: always()
    needs:
      - changes
      - meko_api_server
      - meko_migration_versions
      - meko_inference
      - meko_ui
      - meko_ycp
      - meko_foundation
      - meko_ycp_e2e
      - meko_docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Needed only to make the local composite action below available.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
          # Push-only (see its own comment above): always skipped on the
          # pull_request event this gate itself runs on, so it can never
          # contribute a real result to this PR's own gate.
          exclude: meko_migrations_recheck
