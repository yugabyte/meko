name: Release

# Versions are 0.<UTC date YYYYMMDD>.<n>, n counting from 0 for each release that day, tagged
# agentk-v<version> (v<version> before releases were tagged by product).
# A push to main cuts a release when it contains AgentK's feat/fix/perf/deps commits (component
# agentk or repo; meko commits release Meko, in meko-release.yml) since the last release tag and
# the tests pass. The release scripts are the repo root's scripts/release/*.sh --product agentk.
# Run the workflow by hand to force a release, or to rebuild the assets of an existing tag (one
# from after the move to extensions/agentk).
#
# AgentK Local lives in extensions/agentk: jobs that run its scripts or npm work there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if there are no feat/fix/perf/deps commits
        type: boolean
        default: false
      tag:
        description: Rebuild assets for this existing tag instead (one from after the move to extensions/agentk)
        required: false

# Read-only by default: only publish, which runs none of the dependency installs or tests,
# gets to write releases and attestations.
permissions:
  contents: read

# One release at a time, so two pushes on the same day can't claim the same number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Bundled runtime. Bump deliberately; the SHASUMS256 check below pins the bytes.
  NODE_VERSION: 22.18.0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/agentk
    outputs:
      release: ${{ steps.p.outputs.release }}
      rebuild: ${{ steps.p.outputs.rebuild }}
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: p
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eu
          if [ -n "${DISPATCH_TAG:-}" ]; then
            # Only AgentK's own tags: a meko-v… tag is Meko's release (meko-release.yml), and this would
            # replace its installer and checksums.
            case $DISPATCH_TAG in
              v[0-9]*) ;;
              *) echo "$DISPATCH_TAG isn't an AgentK Local release tag (v<version>)"; exit 1 ;;
            esac
            git rev-parse -q --verify "refs/tags/$DISPATCH_TAG" >/dev/null || { echo "no such tag: $DISPATCH_TAG"; exit 1; }
            # This workflow builds from extensions/agentk; older tags have AgentK at the repo root.
            git cat-file -e "$DISPATCH_TAG:extensions/agentk/package.json" 2>/dev/null ||
              { echo "$DISPATCH_TAG is from before AgentK Local moved to extensions/agentk and can't be rebuilt"; exit 1; }
            # AgentK's tags are agentk-v<version>, or v<version> from before releases were tagged by product.
            case $DISPATCH_TAG in
              agentk-v[0-9]*|v[0-9]*) ;;
              *) echo "$DISPATCH_TAG isn't an AgentK Local release tag (agentk-v<version> or v<version>)"; exit 1 ;;
            esac
            version=${DISPATCH_TAG#agentk-v}
            version=${version#v}
            { echo "release=true"; echo "rebuild=true"; echo "tag=$DISPATCH_TAG"; echo "version=$version"; echo "ref=$DISPATCH_TAG"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if sh ../../scripts/release/release-notes.sh --product agentk > /dev/null || [ "${FORCE:-false}" = "true" ]; then
            version=$(sh ../../scripts/release/next-version.sh --product agentk)
            echo "Releasing $version"
            { echo "release=true"; echo "rebuild=false"; echo "tag=agentk-v$version"; echo "version=$version"; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release: no feat/fix/perf/deps commits since the last release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.rebuild == 'false'
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the release concurrency group for GitHub's 6h default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/agentk
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/agentk/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git build-essential
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Four files at once, as in ci.yml: by default this 2-CPU runner runs one at a time.
      - run: npm test -- --maxWorkers=4

  build:
    needs: [plan, test]
    if: always() && needs.plan.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 8 = glibc 2.28, so the native node-pty build loads on RHEL 8 devservers.
    container: almalinux:8
    timeout-minutes: 40
    defaults:
      run:
        working-directory: extensions/agentk
    # Plan outputs reach the shell through the environment, never pasted into scripts.
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
      # The usage stats collector, written into the tarball as CALL_HOME_URL (empty: none).
      AK_CALL_HOME_URL: ${{ vars.CALL_HOME_URL }}
    steps:
      - name: Install build toolchain
        # Before checkout: extensions/agentk doesn't exist yet.
        working-directory: .
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc-toolset-13-gcc-c++ make python3.11 git tar xz findutils which
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Download Node ${{ env.NODE_VERSION }}
        run: |
          set -eu
          dist="node-v${NODE_VERSION}-linux-${ARCH}"
          cd /tmp
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${dist}.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep " ${dist}.tar.xz\$" SHASUMS256.txt | sha256sum -c -
          tar -xJf "${dist}.tar.xz"
          echo "NODE_DIR=/tmp/${dist}" >> "$GITHUB_ENV"
          echo "/tmp/${dist}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (gcc-toolset-13 for node-pty)
        run: |
          set -eu
          export CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc
          export CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++
          export npm_config_python=/usr/bin/python3.11
          node --version
          npm ci

      - name: Stamp version
        run: npm pkg set version="$VERSION"

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: |
          sh scripts/package-release.sh "$VERSION" "$ARCH" "$NODE_DIR" out

      - name: Smoke-test the tarball
        run: |
          set -eu
          mkdir -p /tmp/smoke
          tar -xzf out/*.tar.gz -C /tmp/smoke
          v=$(/tmp/smoke/agent-k-local-*/bin/agent-k-local version)
          test "$v" = "$VERSION"
          /tmp/smoke/agent-k-local-*/bin/agent-k-local selftest

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-linux-${{ matrix.arch }}
          path: extensions/agentk/out/*.tar.gz
          if-no-files-found: error

  # macOS on Apple Silicon. No container: the runner's Xcode clang builds node-pty.
  build-macos:
    needs: [plan, test]
    if: always() && needs.plan.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: extensions/agentk
    env:
      ARCH: arm64
      VERSION: ${{ needs.plan.outputs.version }}
      AK_CALL_HOME_URL: ${{ vars.CALL_HOME_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Download Node ${{ env.NODE_VERSION }}
        run: |
          set -eu
          dist="node-v${NODE_VERSION}-darwin-${ARCH}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${dist}.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep " ${dist}.tar.gz\$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "${dist}.tar.gz"
          echo "NODE_DIR=$RUNNER_TEMP/${dist}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/${dist}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (node-pty built from source)
        env:
          # node-pty ships a prebuilt macOS binary; build our own like on Linux.
          npm_config_build_from_source: 'true'
        run: |
          node --version
          npm ci

      - name: Stamp version
        run: npm pkg set version="$VERSION"

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: |
          sh scripts/package-release.sh "$VERSION" "$ARCH" "$NODE_DIR" out
          ls out/*-darwin-"$ARCH".tar.gz

      - name: Smoke-test the tarball
        run: |
          set -eu
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf out/*.tar.gz -C "$smoke"
          v=$("$smoke"/agent-k-local-*/bin/agent-k-local version)
          test "$v" = "$VERSION"
          "$smoke"/agent-k-local-*/bin/agent-k-local selftest

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-darwin-arm64
          path: extensions/agentk/out/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, build, build-macos]
    # Any build failure stops the release, so SHA256SUMS never loses an existing tarball.
    if: always() && needs.build.result == 'success' && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and release, upload assets, prune old releases
      id-token: write # attest build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes with git

      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: dist-release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cp ../extensions/agentk/scripts/install.sh install.sh
          cat SHA256SUMS

      - name: Create the release
        if: needs.plan.outputs.rebuild == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.ref }}
        run: |
          set -eu
          sh scripts/release/release-notes.sh --product agentk > notes.md || echo "Maintenance release." > notes.md
          # Not "latest": the repo's latest release is Meko's (meko-release.yml), whose installer
          # is the one-line install. AgentK's install.sh finds the newest AgentK release by tag.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md --latest=false --repo "$GITHUB_REPOSITORY" \
            dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/install.sh

      - name: Replace assets on an existing release
        if: needs.plan.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/install.sh --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attest build provenance
        # Artifact attestations need GitHub Enterprise Cloud for internal repos.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/*.tar.gz

      - name: Delete releases beyond the newest 5 in each lane
        if: needs.plan.outputs.rebuild == 'false'
        # A failed prune never fails the release; the next one tries again.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 5
        run: sh scripts/release/prune-releases.sh --product agentk
