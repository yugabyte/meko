name: Meko release

# Meko (src/meko) releases on its own train, beside AgentK's (agentk-release.yml). Versions are
# 0.<UTC date YYYYMMDD>.<n>, tagged meko-v<version>. A push to main that changes src/meko cuts a
# release when it contains meko feat/fix/perf/deps commits (naming meko, alone or in a list such as
# agentk,meko) since the last Meko tag and the tests pass. The release scripts are the repo root's
# scripts/release/*.sh --product meko. Meko's releases are the repo's "latest": their install.sh is
# the one-line install. Run the workflow by hand to force a release, or to rebuild the assets of an
# existing meko-v tag.

on:
  push:
    branches: [main]
    paths:
      - 'src/meko/**'
      - 'scripts/release/**'
      - '.github/workflows/meko-release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Release even if there are no meko feat/fix/perf/deps commits
        type: boolean
        default: false
      tag:
        description: Rebuild assets for this existing meko-v tag instead
        required: false

# Read-only by default: only publish gets to write releases and attestations.
permissions:
  contents: read

# One Meko release at a time, so two pushes on the same day can't claim the same number.
concurrency:
  group: meko-release
  cancel-in-progress: false

env:
  # Meko's own Node, bundled in each tarball. Bump deliberately; the SHASUMS256 check pins the bytes.
  NODE_VERSION: 22.18.0
  # onnxruntime-node's install script would download a CUDA provider Meko doesn't use.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.p.outputs.release }}
      rebuild: ${{ steps.p.outputs.rebuild }}
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: p
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eu
          if [ -n "${DISPATCH_TAG:-}" ]; then
            case $DISPATCH_TAG in
              meko-v[0-9]*) ;;
              *) echo "$DISPATCH_TAG isn't a Meko release tag (meko-v<version>)"; exit 1 ;;
            esac
            git rev-parse -q --verify "refs/tags/$DISPATCH_TAG" >/dev/null || { echo "no such tag: $DISPATCH_TAG"; exit 1; }
            # This workflow builds from src/meko; older tags have Meko in backend/.
            git cat-file -e "$DISPATCH_TAG:src/meko/go.mod" 2>/dev/null ||
              { echo "$DISPATCH_TAG is from before Meko moved to src/meko and can't be rebuilt"; exit 1; }
            { echo "release=true"; echo "rebuild=true"; echo "tag=$DISPATCH_TAG"; echo "version=${DISPATCH_TAG#meko-v}"; echo "ref=$DISPATCH_TAG"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if sh scripts/release/release-notes.sh --product meko > /dev/null || [ "${FORCE:-false}" = "true" ]; then
            version=$(sh scripts/release/next-version.sh --product meko)
            echo "Releasing Meko $version"
            { echo "release=true"; echo "rebuild=false"; echo "tag=meko-v$version"; echo "version=$version"; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release: no meko feat/fix/perf/deps commits since the last Meko release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.rebuild == 'false'
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the release concurrency group for GitHub's 6h default.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/meko
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/meko/go.mod
          cache-dependency-path: |
            src/meko/go.mod
            src/meko/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/meko/context_engine/package-lock.json
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: src/meko/context_engine/.models
          key: embedding-model-all-MiniLM-L6-v2-751bff3-q8
      # Normally 2 minutes, npm installs included.
      - run: make test
        timeout-minutes: 20

  # Linux x64 and arm64, built in AlmaLinux 8 (glibc 2.28) so they run on RHEL 8 and newer.
  build:
    needs: [plan, test]
    if: always() && needs.plan.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src/meko
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
      CC: /opt/rh/gcc-toolset-13/root/usr/bin/gcc
    steps:
      - name: Install build toolchain
        # Before checkout: src/meko doesn't exist yet.
        working-directory: .
        # Normally under a minute; a slow mirror would otherwise hold the release group.
        timeout-minutes: 10
        run: |
          # dnf's default minrate (1000 B/s) let a mirror crawl through BaseOS's 100+ MB of metadata for
          # 20 minutes: drop a mirror slower than 1 MiB/s for 30s and try the next, up to 10 of them.
          dnf install -y --setopt=install_weak_deps=False \
            --setopt=minrate=1M --setopt=timeout=30 --setopt=retries=10 \
            gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ make git tar xz gzip findutils which procps-ng
          git config --global --add safe.directory '*'

      # The workflow's own commit first, for scripts/release/fetch-node.sh: a tag being rebuilt can
      # be older than the script. A rebuild then checks out its tag for the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Node ${{ env.NODE_VERSION }}
        timeout-minutes: 10
        run: |
          set -eu
          dir=$(sh ../../scripts/release/fetch-node.sh "$NODE_VERSION" "/tmp" "linux-$ARCH")
          echo "NODE_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        if: needs.plan.outputs.rebuild == 'true'
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/meko/go.mod
          cache-dependency-path: |
            src/meko/go.mod
            src/meko/go.sum

      - name: Build
        # Normally under 30s, npm installs included.
        timeout-minutes: 15
        run: |
          set -eu
          make build VERSION="$VERSION"
          # npm's registry fetches can time out on a runner: try twice.
          make context_engine || { rm -rf context_engine/node_modules; make context_engine; }
          make web_ui || { rm -rf web_ui/node_modules; make web_ui; }
          (cd context_engine && npm prune --omit=dev)

      - name: Package
        run: sh scripts/package-release.sh "$VERSION" "$ARCH" "$NODE_DIR" out

      - name: Smoke-test the tarball
        run: sh scripts/smoke-release.sh out/meko-"$VERSION"-linux-"$ARCH".tar.gz "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: meko-tarball-linux-${{ matrix.arch }}
          path: src/meko/out/*.tar.gz
          if-no-files-found: error

  # macOS on Apple Silicon, for macOS 14 and newer.
  build-macos:
    needs: [plan, test]
    if: always() && needs.plan.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src/meko
    env:
      ARCH: arm64
      VERSION: ${{ needs.plan.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      # The workflow's own commit first, for scripts/release/fetch-node.sh: a tag being rebuilt can
      # be older than the script. A rebuild then checks out its tag for the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Node ${{ env.NODE_VERSION }}
        timeout-minutes: 10
        run: |
          set -eu
          dir=$(sh ../../scripts/release/fetch-node.sh "$NODE_VERSION" "$RUNNER_TEMP" "darwin-$ARCH")
          echo "NODE_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        if: needs.plan.outputs.rebuild == 'true'
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/meko/go.mod
          cache-dependency-path: |
            src/meko/go.mod
            src/meko/go.sum

      - name: Build
        # Normally under 30s, npm installs included.
        timeout-minutes: 15
        run: |
          set -eu
          make build VERSION="$VERSION"
          make context_engine || { rm -rf context_engine/node_modules; make context_engine; }
          make web_ui || { rm -rf web_ui/node_modules; make web_ui; }
          (cd context_engine && npm prune --omit=dev)

      - name: Package
        run: sh scripts/package-release.sh "$VERSION" "$ARCH" "$NODE_DIR" out

      - name: Smoke-test the tarball
        run: sh scripts/smoke-release.sh out/meko-"$VERSION"-darwin-"$ARCH".tar.gz "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: meko-tarball-darwin-arm64
          path: src/meko/out/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, build, build-macos]
    # Any build failure stops the release, so SHA256SUMS never loses a tarball.
    if: always() && needs.build.result == 'success' && needs.build-macos.result == 'success'
    # The release environment holds the signing key, and only main can use it.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and release, upload assets, prune old releases
      id-token: write # attest build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes with git

      - uses: actions/download-artifact@v8
        with:
          pattern: meko-tarball-*
          path: dist-release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cp ../src/meko/scripts/install.sh install.sh
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        # Meko installs a release only when a line of SHA256SUMS.sig verifies with one of its keys
        # (src/meko/internal/update/keys). The key is a secret of the release environment, which only
        # main can use; RELEASE_SIGNING_KEY_OLD is set only while a new key replaces it.
        working-directory: dist-release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY_OLD: ${{ secrets.RELEASE_SIGNING_KEY_OLD }}
        run: |
          set -eu
          umask 077
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "RELEASE_SIGNING_KEY is empty: only a run from main gets the release environment's key" >&2; exit 1; }
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          : > SHA256SUMS.sig
          for k in "$RELEASE_SIGNING_KEY" "${RELEASE_SIGNING_KEY_OLD:-}"; do
            [ -n "$k" ] || continue
            printf '%s\n' "$k" > "$tmp/key.pem"
            # The key id: the first 8 bytes of the sha256 of the raw public key (its DER's last 32 bytes).
            openssl pkey -in "$tmp/key.pem" -pubout -outform DER -out "$tmp/pub.der"
            id=$(tail -c 32 "$tmp/pub.der" | openssl dgst -sha256 -r | cut -c1-16)
            openssl pkeyutl -sign -inkey "$tmp/key.pem" -rawin -in SHA256SUMS -out "$tmp/sig.bin"
            printf '%s %s\n' "$id" "$(openssl base64 -A -in "$tmp/sig.bin")" >> SHA256SUMS.sig
          done
          cat SHA256SUMS.sig

      - name: Check the signature against Meko's keys
        # A secret that isn't the key Meko has would publish a release every Meko refuses. The first
        # line is RELEASE_SIGNING_KEY's. The keys come from this workflow's commit on main, not the
        # checkout: a rebuild checks out an older tag, which may lack a newer key.
        run: |
          set -eu
          keys=src/meko/internal/update/keys
          sigs=dist-release/SHA256SUMS.sig
          id=$(head -n 1 "$sigs" | cut -d ' ' -f 1)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          head -n 1 "$sigs" | cut -d ' ' -f 2 | openssl base64 -d -A -out "$tmp/sig.bin"
          for f in $(git ls-tree --name-only "$GITHUB_SHA" "$keys/"); do
            case $f in *.pub) ;; *) continue ;; esac
            git show "$GITHUB_SHA:$f" > "$tmp/key.pub"
            kid=$(openssl pkey -pubin -in "$tmp/key.pub" -outform DER | tail -c 32 | openssl dgst -sha256 -r | cut -c1-16)
            [ "$kid" = "$id" ] || continue
            openssl pkeyutl -verify -pubin -inkey "$tmp/key.pub" -rawin -in dist-release/SHA256SUMS -sigfile "$tmp/sig.bin" >/dev/null && exit 0
            echo "SHA256SUMS.sig doesn't verify with $f" >&2
            exit 1
          done
          echo "RELEASE_SIGNING_KEY (key id $id) isn't one of Meko's keys in $keys: every Meko would refuse this release" >&2
          exit 1

      - name: Create the release
        if: needs.plan.outputs.rebuild == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.ref }}
        run: |
          set -eu
          sh scripts/release/release-notes.sh --product meko > notes.md || echo "Maintenance release." > notes.md
          # The repo's latest release: its install.sh is the one-line install
          # (mekodata.ai/install.sh redirects to it). AgentK's releases are published --latest=false.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md --latest --repo "$GITHUB_REPOSITORY" \
            dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/SHA256SUMS.sig dist-release/install.sh

      - name: Replace assets on an existing release
        if: needs.plan.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/SHA256SUMS.sig dist-release/install.sh --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attest build provenance
        # Artifact attestations need GitHub Enterprise Cloud for internal repos.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/*.tar.gz

      - name: Delete Meko releases beyond the newest 5
        if: needs.plan.outputs.rebuild == 'false'
        # A failed prune never fails the release; the next one tries again.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 5
        run: sh scripts/release/prune-releases.sh --product meko
