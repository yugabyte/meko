name: Reconcile-agent image

# Builds the reconcile-agent image (ycp/cmd/reconcile-agent) and pushes it to
# Quay (quay.io/yugabyte/ycp-reconciler-agent) so it can be deployed on
# Kubernetes beside an amp controller.
#
# It is a thin wrapper around ycp/build-reconciler-agent-image.sh: the script is
# the source of truth for how the image is built and tagged, and stays runnable
# locally (./build-reconciler-agent-image.sh [--no-push]). CI only supplies
# credentials and calls it.
#
# Auth is a Quay robot account, delivered as repo secrets. When they are absent
# (a fork, or before they are configured) the job still BUILDS the image with
# --no-push and stays green, so main cannot go red waiting on secret setup.
#
#   - QUAY_AMP_TOKEN — the robot pair as "user:token", the secret every pushing
#     workflow here uses. QUAY_USER stays unset; the build script splits the pair.
#
# The Quay repository must exist and the robot must have write on it before the
# first push.
#
# Published to Quay rather than the ECR registry the other ycp images use
# (ycp-images.yml), so a cluster can pull it without ECR cross-account
# pull-secret setup — the same reason the control plane ships on Quay.
on:
  push:
    branches: [main]
    paths:
      - 'ycp/**'
      - '.github/workflows/ycp-reconciler-agent-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build & push reconcile-agent image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Push only when the robot credentials are present; otherwise build-only so
      # the job is still a real compile+package check on forks and before setup.
      - name: Build and push
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
        run: |
          # Only a main build may move the floating `latest` tag: a no-TAG
          # amp/deploy/up-gke.sh deploy resolves it, so a dispatch from a branch
          # would otherwise become what that deploy pulls.
          latest=()
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            latest=(--no-latest)
            echo "::notice::not on main — tagging custom-<sha> only, leaving :latest alone"
          fi
          if [ -n "${QUAY_TOKEN}" ]; then
            echo "::notice::pushing quay.io/yugabyte/ycp-reconciler-agent"
            ./ycp/build-reconciler-agent-image.sh "${latest[@]}"
          else
            echo "::warning::QUAY_AMP_TOKEN not set — building the reconcile-agent image but skipping the push"
            ./ycp/build-reconciler-agent-image.sh --no-push "${latest[@]}"
          fi
