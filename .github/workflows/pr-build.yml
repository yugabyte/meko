name: CI

# Per-component PR validation, gated on which files actually changed:
#   meko_api_server — Go REST API: `go build` (fail fast), `go vet`,
#                     golangci-lint (non-blocking for now), then `go test ./...`.
#                     Tests are mocked; the few DB-backed tests self-skip when no
#                     YugabyteDB is present, so no database is needed in CI.
#   meko_inference  — inference_gateway (Python): install with the dev extra, run
#                     pytest. All upstream (LLM / MCP) calls are mocked — no creds.
#   meko_ui         — meko_ui: `npm ci`, `npm run check` (tsc), unit tests
#                     (vitest), and the production build.
#   meko_ycp        — ycp (the BYOC agent + dpmcp): gofmt, `go build`, `go vet`,
#                     `go test ./...`.
#   meko_ycp_e2e    — YCP build + deploy smoke test: builds the api-server and
#                     agent images and deploys them to a throwaway kind cluster,
#                     asserting the control plane migrates and serves, an agent
#                     enrolls and reports READY, and a restarted agent resumes
#                     without re-enrolling. Publishing images to ECR is a separate
#                     workflow (ycp-images.yml) that runs only on merge to main.
#                     Fires on `ycp/**` and on the api_server files that make up
#                     the control plane (see the meko_ycp_cp filter).
#
# Docs-only PRs (only *.md changed) skip the heavy jobs via the `meko_code` filter.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      meko_api_server: ${{ steps.filter.outputs.meko_api_server }}
      meko_inference: ${{ steps.filter.outputs.meko_inference }}
      meko_ui: ${{ steps.filter.outputs.meko_ui }}
      meko_ycp: ${{ steps.filter.outputs.meko_ycp }}
      meko_ycp_cp: ${{ steps.filter.outputs.meko_ycp_cp }}
      meko_code: ${{ steps.code.outputs.meko_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            meko_api_server:
              - 'api_server/**'
              - '.github/workflows/pr-build.yml'
            meko_inference:
              - 'inference_gateway/**'
              - '.github/workflows/pr-build.yml'
            meko_ui:
              - 'meko_ui/**'
              - '.github/workflows/pr-build.yml'
            meko_ycp:
              - 'ycp/**'
              - '.github/workflows/pr-build.yml'
            # The e2e runs api_server --control-plane-mode, so control-plane
            # changes have to trigger it too -- otherwise the one test that covers
            # the real control plane never runs when the control plane changes.
            # Deliberately a file list rather than 'api_server/**': this job builds
            # two images and a kind cluster, and most api_server PRs touch none of
            # the YCP surface.
            meko_ycp_cp:
              - 'ycp/**'
              - 'api_server/main.go'
              - 'api_server/Dockerfile'
              - 'api_server/internal/api/router.go'
              - 'api_server/internal/service/environment_*.go'
              - 'api_server/internal/repository/environment_*.go'
              - 'api_server/internal/handlers/environment_*.go'
              - 'api_server/internal/handlers/console*.go'
              - 'api_server/internal/handlers/web/**'
              - 'api_server/internal/db/**'
              - 'api_server/internal/auth/internal_auth.go'   # RequireAdminSecret
              - '.github/workflows/pr-build.yml'
      # A change counts as "code" if at least one changed file is not a markdown
      # doc; the jobs gate on it so a docs-only PR skips build/test while a PR
      # touching both code and docs still builds.
      #
      # `predicate-quantifier: every` combines the patterns *within this rule*
      # for a single file: a file matches only if it is under '**' AND is not
      # '**/*.md'. It does NOT mean "every changed file must match" — the filter
      # output is still true when any one file matches. That distinction is why
      # this must stay a negated pattern: a bare positive '**/*.md' rule is true
      # whenever a PR touches even one markdown file, which silently skipped CI
      # on every mixed code+docs PR.
      - uses: dorny/paths-filter@v3
        id: code
        with:
          predicate-quantifier: 'every'
          filters: |
            meko_code:
              - '**'
              - '!**/*.md'

  meko_api_server:
    name: Meko API Server — build, vet & tests
    needs: changes
    if: needs.changes.outputs.meko_api_server == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api_server/go.mod
          cache-dependency-path: api_server/go.sum

      # Build first so a compile break fails fast with a clear message before
      # tests run.
      - name: Build
        run: go build ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      # Non-blocking for now: this is the first time golangci-lint runs in CI,
      # so surface findings without failing the PR. Flip to blocking once the
      # baseline is clean.
      - name: Lint (golangci-lint)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: api_server

      # Unit tests are mocked; the few DB-backed tests self-skip when no
      # YugabyteDB is reachable, so this runs without a database.
      - name: Tests
        run: go test ./...

  meko_inference:
    name: Meko Inference Gateway — tests
    needs: changes
    if: needs.changes.outputs.meko_inference == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: inference_gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install (with dev extra)
        run: pip install -e ".[dev]"

      # All upstream calls are mocked — no network / no creds needed.
      - name: Tests
        run: pytest -q

  meko_ui:
    name: Meko UI — typecheck, tests & build
    needs: changes
    if: needs.changes.outputs.meko_ui == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: meko_ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meko_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  meko_ycp:
    name: Meko YCP — build, vet & tests
    needs: changes
    if: needs.changes.outputs.meko_ycp == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ycp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ycp/go.mod
          cache-dependency-path: ycp/go.sum

      # Blocking from the start: this module is formatted and vet-clean as of the
      # commit that added this job, so there is no baseline to grandfather in.
      - name: Format (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Tests
        run: go test ./...

  meko_ycp_e2e:
    name: Meko YCP — build & deploy (kind)
    needs: changes
    if: needs.changes.outputs.meko_ycp_cp == 'true' && needs.changes.outputs.meko_code == 'true'
    runs-on: ubuntu-latest
    # Image builds + a kind cluster + Postgres reaching ready is the slow part.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: ycp-e2e
          # The script creates and tears down its own cluster; this action is here
          # to install the kind binary and nothing else.
          install_only: true

      # Builds the api-server and meko-agent images, loads them into a throwaway
      # kind cluster, and drives the real bring-up against api_server
      # --control-plane-mode: controlplane migrations on plain Postgres, health,
      # the admin-secret gate, register -> enroll -> READY, then a restart that
      # must resume on the persisted status token instead of re-enrolling.
      # Dumps pod state, logs and events on failure.
      - name: Build & deploy smoke test
        run: ./test/e2e/run.sh
        working-directory: ycp
