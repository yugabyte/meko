name: CI

# Per-component PR validation, gated on which files actually changed:
#   meko_api_server — Go REST API: `go build` (fail fast), `go vet`,
#                     golangci-lint (non-blocking for now), then `go test ./...`.
#                     Tests are mocked; the few DB-backed tests self-skip when no
#                     YugabyteDB is present, so no database is needed in CI.
#   meko_inference  — inference_gateway (Python): install with the dev extra, run
#                     pytest. All upstream (LLM / MCP) calls are mocked — no creds.
#   meko_ui         — meko_ui: `npm ci`, `npm run check` (tsc), unit tests
#                     (vitest), and the production build.
#
# Docs-only PRs (only *.md changed) skip the heavy jobs via the `docs` filter.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      meko_api_server: ${{ steps.filter.outputs.meko_api_server }}
      meko_inference: ${{ steps.filter.outputs.meko_inference }}
      meko_ui: ${{ steps.filter.outputs.meko_ui }}
      meko_docs_only: ${{ steps.docs.outputs.meko_docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            meko_api_server:
              - 'api_server/**'
              - '.github/workflows/pr-build.yml'
            meko_inference:
              - 'inference_gateway/**'
              - '.github/workflows/pr-build.yml'
            meko_ui:
              - 'meko_ui/**'
              - '.github/workflows/pr-build.yml'
      # A PR is docs-only when *every* changed file is a markdown doc — hence
      # `every` over a positive '**/*.md' pattern. The jobs gate on this being
      # false, so a docs-only PR skips build/test while a PR that touches both
      # code and docs still builds.
      - uses: dorny/paths-filter@v3
        id: docs
        with:
          predicate-quantifier: 'every'
          filters: |
            meko_docs_only:
              - '**/*.md'

  meko_api_server:
    name: Meko API Server — build, vet & tests
    needs: changes
    if: needs.changes.outputs.meko_api_server == 'true' && needs.changes.outputs.meko_docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api_server/go.mod
          cache-dependency-path: api_server/go.sum

      # Build first so a compile break fails fast with a clear message before
      # tests run.
      - name: Build
        run: go build ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      # Non-blocking for now: this is the first time golangci-lint runs in CI,
      # so surface findings without failing the PR. Flip to blocking once the
      # baseline is clean.
      - name: Lint (golangci-lint)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: api_server

      # Unit tests are mocked; the few DB-backed tests self-skip when no
      # YugabyteDB is reachable, so this runs without a database.
      - name: Tests
        run: go test ./...

  meko_inference:
    name: Meko Inference Gateway — tests
    needs: changes
    if: needs.changes.outputs.meko_inference == 'true' && needs.changes.outputs.meko_docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: inference_gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install (with dev extra)
        run: pip install -e ".[dev]"

      # All upstream calls are mocked — no network / no creds needed.
      - name: Tests
        run: pytest -q

  meko_ui:
    name: Meko UI — typecheck, tests & build
    needs: changes
    if: needs.changes.outputs.meko_ui == 'true' && needs.changes.outputs.meko_docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: meko_ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meko_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
