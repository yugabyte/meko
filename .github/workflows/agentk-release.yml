name: AgentK release

# Versions are 0.<UTC date YYYYMMDD>.<n>, n counting from 0 for each release that day, tagged
# agentk-v<version> (v<version> before releases were tagged by product).
# A push to main cuts a release when it contains AgentK's feat/fix/perf/deps commits (component
# agentk or repo, alone or in a list such as agentk,meko; commits naming only meko release Meko, in
# meko-release.yml, only presenter Presenter, in presenter-release.yml, and only meko and presenter
# both of those, never AgentK) since the last
# release tag and the tests pass. The release scripts are the repo
# root's scripts/release/*.sh --product agentk.
# Run the workflow by hand to force a release, or to rebuild the assets of an existing tag (one
# from after the move to extensions/agentk).
#
# AgentK lives in extensions/agentk: jobs that run its scripts or npm work there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if there are no feat/fix/perf/deps commits
        type: boolean
        default: false
      tag:
        description: Rebuild assets for this existing agentk-v or v tag instead (one from after the move to extensions/agentk)
        required: false

# Read-only by default: only publish, which runs none of the dependency installs or tests,
# gets to write releases and attestations.
permissions:
  contents: read

# One release at a time, so two pushes on the same day can't claim the same number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Bundled runtime. Bump deliberately; the SHASUMS256 check below pins the bytes.
  NODE_VERSION: 22.18.0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/agentk
    outputs:
      release: ${{ steps.p.outputs.release }}
      rebuild: ${{ steps.p.outputs.rebuild }}
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: p
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eu
          if [ -n "${DISPATCH_TAG:-}" ]; then
            # Only AgentK's own tags: agentk-v<version>, or v<version> from before releases were tagged by
            # product. A meko-v… tag is Meko's release (meko-release.yml), and this would replace its
            # installer and checksums.
            case $DISPATCH_TAG in
              agentk-v[0-9]*|v[0-9]*) ;;
              *) echo "$DISPATCH_TAG isn't an AgentK release tag (agentk-v<version> or v<version>)"; exit 1 ;;
            esac
            git rev-parse -q --verify "refs/tags/$DISPATCH_TAG" >/dev/null || { echo "no such tag: $DISPATCH_TAG"; exit 1; }
            # This workflow builds from extensions/agentk; older tags have AgentK at the repo root.
            git cat-file -e "$DISPATCH_TAG:extensions/agentk/package.json" 2>/dev/null ||
              { echo "$DISPATCH_TAG is from before AgentK moved to extensions/agentk and can't be rebuilt"; exit 1; }
            version=${DISPATCH_TAG#agentk-v}
            version=${version#v}
            { echo "release=true"; echo "rebuild=true"; echo "tag=$DISPATCH_TAG"; echo "version=$version"; echo "ref=$DISPATCH_TAG"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if sh ../../scripts/release/release-notes.sh --product agentk > /dev/null || [ "${FORCE:-false}" = "true" ]; then
            version=$(sh ../../scripts/release/next-version.sh --product agentk)
            echo "Releasing $version"
            { echo "release=true"; echo "rebuild=false"; echo "tag=agentk-v$version"; echo "version=$version"; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release: no feat/fix/perf/deps commits since the last release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.rebuild == 'false'
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the release concurrency group for GitHub's 6h default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/agentk
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/agentk/package-lock.json
      - timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git build-essential
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - timeout-minutes: 10
        run: |
          # node-gyp builds node-pty (no linux-x64 prebuild) against this Node's own headers instead
          # of downloading them from nodejs.org.
          npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")
          export npm_config_nodedir
          npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Four files at once, as in ci.yml: by default this 2-CPU runner runs one at a time.
      - run: npm test -- --maxWorkers=4

  build:
    needs: [plan, test]
    if: always() && needs.plan.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 8 = glibc 2.28, so the native node-pty build loads on RHEL 8 devservers.
    container: almalinux:8
    timeout-minutes: 40
    defaults:
      run:
        working-directory: extensions/agentk
    # Plan outputs reach the shell through the environment, never pasted into scripts.
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
      # The usage stats collector, written into the tarball as CALL_HOME_URL (empty: none).
      AK_CALL_HOME_URL: ${{ vars.CALL_HOME_URL }}
    steps:
      - name: Install build toolchain
        # Before checkout: extensions/agentk doesn't exist yet.
        working-directory: .
        # Normally under a minute; a slow mirror would otherwise hold the release group.
        timeout-minutes: 10
        run: |
          # dnf's default minrate (1000 B/s) let a mirror crawl through BaseOS's 100+ MB of metadata for
          # 20 minutes: drop a mirror slower than 1 MiB/s for 30s and try the next, up to 10 of them.
          dnf install -y --setopt=install_weak_deps=False \
            --setopt=minrate=1M --setopt=timeout=30 --setopt=retries=10 \
            gcc-toolset-13-gcc-c++ make python3.11 git tar xz findutils which
          git config --global --add safe.directory '*'

      # The workflow's own commit first, for scripts/release/fetch-node.sh: a tag being rebuilt can
      # be older than the script. A rebuild then checks out its tag for the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Node ${{ env.NODE_VERSION }}
        timeout-minutes: 10
        run: |
          set -eu
          dir=$(sh ../../scripts/release/fetch-node.sh "$NODE_VERSION" "/tmp" "linux-$ARCH")
          echo "NODE_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        if: needs.plan.outputs.rebuild == 'true'
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Install dependencies (gcc-toolset-13 for node-pty)
        timeout-minutes: 10
        run: |
          set -eu
          export CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc
          export CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++
          export npm_config_python=/usr/bin/python3.11
          # node-gyp builds node-pty against the headers in the Node tarball above, checked against
          # SHASUMS256, instead of downloading them from nodejs.org.
          export npm_config_nodedir="$NODE_DIR"
          node --version
          npm ci

      - name: Stamp version
        run: npm pkg set version="$VERSION"

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: |
          sh scripts/package-release.sh "$VERSION" "$ARCH" "$NODE_DIR" out

      - name: Smoke-test the tarball
        run: |
          set -eu
          mkdir -p /tmp/smoke
          tar -xzf out/agentk-*.tar.gz -C /tmp/smoke
          v=$(/tmp/smoke/agentk-*/bin/agentk version)
          test "$v" = "$VERSION"
          /tmp/smoke/agentk-*/bin/agentk selftest
          # The copy under the old name, by the path installs from before the rename to AgentK run.
          tar -xzf out/agent-k-local-*.tar.gz -C /tmp/smoke
          /tmp/smoke/agent-k-local-*/bin/agent-k-local selftest

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-linux-${{ matrix.arch }}
          path: extensions/agentk/out/*.tar.gz
          if-no-files-found: error

  # macOS on Apple Silicon. No container: the runner's Xcode clang builds node-pty.
  build-macos:
    needs: [plan, test]
    if: always() && needs.plan.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: extensions/agentk
    env:
      ARCH: arm64
      VERSION: ${{ needs.plan.outputs.version }}
      AK_CALL_HOME_URL: ${{ vars.CALL_HOME_URL }}
    steps:
      # The workflow's own commit first, for scripts/release/fetch-node.sh: a tag being rebuilt can
      # be older than the script. A rebuild then checks out its tag for the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Node ${{ env.NODE_VERSION }}
        timeout-minutes: 10
        run: |
          set -eu
          dir=$(sh ../../scripts/release/fetch-node.sh "$NODE_VERSION" "$RUNNER_TEMP" "darwin-$ARCH")
          echo "NODE_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        if: needs.plan.outputs.rebuild == 'true'
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Install dependencies (node-pty built from source)
        timeout-minutes: 10
        env:
          # node-pty ships a prebuilt macOS binary; build our own like on Linux.
          npm_config_build_from_source: 'true'
        run: |
          # Against the headers in the Node tarball above, not ones node-gyp would download.
          export npm_config_nodedir="$NODE_DIR"
          node --version
          npm ci

      - name: Stamp version
        run: npm pkg set version="$VERSION"

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: |
          sh scripts/package-release.sh "$VERSION" "$ARCH" "$NODE_DIR" out
          ls out/*-darwin-"$ARCH".tar.gz

      - name: Smoke-test the tarball
        run: |
          set -eu
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf out/agentk-*.tar.gz -C "$smoke"
          v=$("$smoke"/agentk-*/bin/agentk version)
          test "$v" = "$VERSION"
          "$smoke"/agentk-*/bin/agentk selftest
          # The copy under the old name, by the path installs from before the rename to AgentK run.
          tar -xzf out/agent-k-local-*.tar.gz -C "$smoke"
          "$smoke"/agent-k-local-*/bin/agent-k-local selftest

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-darwin-arm64
          path: extensions/agentk/out/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, build, build-macos]
    # Any build failure stops the release, so SHA256SUMS never loses an existing tarball.
    if: always() && needs.build.result == 'success' && needs.build-macos.result == 'success'
    # The release environment holds the signing key, and only main can use it.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and release, upload assets, prune old releases
      id-token: write # attest build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes with git

      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: dist-release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cp ../extensions/agentk/scripts/install.sh install.sh
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        # Meko installs a release only when a line of SHA256SUMS.sig verifies with one of its keys
        # (backend/internal/update/keys). The key is a secret of the release environment, which only
        # main can use; RELEASE_SIGNING_KEY_OLD is set only while a new key replaces it.
        working-directory: dist-release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY_OLD: ${{ secrets.RELEASE_SIGNING_KEY_OLD }}
        run: |
          set -eu
          umask 077
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "RELEASE_SIGNING_KEY is empty: only a run from main gets the release environment's key" >&2; exit 1; }
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          : > SHA256SUMS.sig
          for k in "$RELEASE_SIGNING_KEY" "${RELEASE_SIGNING_KEY_OLD:-}"; do
            [ -n "$k" ] || continue
            printf '%s\n' "$k" > "$tmp/key.pem"
            # The key id: the first 8 bytes of the sha256 of the raw public key (its DER's last 32 bytes).
            openssl pkey -in "$tmp/key.pem" -pubout -outform DER -out "$tmp/pub.der"
            id=$(tail -c 32 "$tmp/pub.der" | openssl dgst -sha256 -r | cut -c1-16)
            openssl pkeyutl -sign -inkey "$tmp/key.pem" -rawin -in SHA256SUMS -out "$tmp/sig.bin"
            printf '%s %s\n' "$id" "$(openssl base64 -A -in "$tmp/sig.bin")" >> SHA256SUMS.sig
          done
          cat SHA256SUMS.sig

      - name: Check the signature against Meko's keys
        # A secret that isn't the key Meko has would publish a release every Meko refuses. The first
        # line is RELEASE_SIGNING_KEY's. The keys come from this workflow's commit on main, not the
        # checkout: a rebuild checks out an older tag, which may lack a newer key.
        run: |
          set -eu
          keys=backend/internal/update/keys
          sigs=dist-release/SHA256SUMS.sig
          id=$(head -n 1 "$sigs" | cut -d ' ' -f 1)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          head -n 1 "$sigs" | cut -d ' ' -f 2 | openssl base64 -d -A -out "$tmp/sig.bin"
          for f in $(git ls-tree --name-only "$GITHUB_SHA" "$keys/"); do
            case $f in *.pub) ;; *) continue ;; esac
            git show "$GITHUB_SHA:$f" > "$tmp/key.pub"
            kid=$(openssl pkey -pubin -in "$tmp/key.pub" -outform DER | tail -c 32 | openssl dgst -sha256 -r | cut -c1-16)
            [ "$kid" = "$id" ] || continue
            openssl pkeyutl -verify -pubin -inkey "$tmp/key.pub" -rawin -in dist-release/SHA256SUMS -sigfile "$tmp/sig.bin" >/dev/null && exit 0
            echo "SHA256SUMS.sig doesn't verify with $f" >&2
            exit 1
          done
          echo "RELEASE_SIGNING_KEY (key id $id) isn't one of Meko's keys in $keys: every Meko would refuse this release" >&2
          exit 1

      - name: Create the release
        if: needs.plan.outputs.rebuild == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.ref }}
        run: |
          set -eu
          sh scripts/release/release-notes.sh --product agentk > notes.md || echo "Maintenance release." > notes.md
          # Not "latest": the repo's latest release is Meko's (meko-release.yml), whose installer
          # is the one-line install. Meko installs AgentK from these tarballs; install.sh is a stub
          # that tells an older Meko, which still runs it, to update first.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md --latest=false --repo "$GITHUB_REPOSITORY" \
            dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/SHA256SUMS.sig dist-release/install.sh

      - name: Replace assets on an existing release
        if: needs.plan.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/SHA256SUMS.sig dist-release/install.sh --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attest build provenance
        # Artifact attestations need GitHub Enterprise Cloud for internal repos.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/*.tar.gz

      - name: Delete releases beyond the newest 5 in each lane
        if: needs.plan.outputs.rebuild == 'false'
        # A failed prune never fails the release; the next one tries again.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 5
        run: sh scripts/release/prune-releases.sh --product agentk
