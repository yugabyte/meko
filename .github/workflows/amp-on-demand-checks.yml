name: Amp on-demand checks

# Opt-in, heavy CI jobs that the regular per-component CI (pr-build.yml) does
# NOT run on every PR, requested from the PR description with `/ci <suite>`
# directive lines, e.g.
#
#   /ci amp_integration_slow
#   /ci amp_integration_slow amp_generate_image
#
# Recognized suites (one or more per line, space/comma separated) — the
# human-facing list and "when to request each" live in docs/ci-directives.md:
#   amp_integration_slow  — the slow integration scenario suite (run.sh slow). Also
#                       runs daily on main via the `schedule` trigger below. The
#                       unit + fast suites run on every compute PR/push via
#                       pr-build.yml, so this + that == full coverage.
#   amp_generate_image    — build the controller container image (deploy/controller)
#   amp_extensions_local  — the local-deploy extension end-to-end test
#                       (test/integration/compute/extensions.sh): builds the real
#                       extension docker image and runs each extension's own
#                       upstream regression suite (#608) against a yb_amp_local
#                       cluster. A REGISTERED third-party image is covered by
#                       amp_deploy_gke_extensions instead, on the real endpoint
#                       image with real ImageVolumes — a bookworm-built image
#                       cannot be faithfully loaded on an ubuntu runner. Also
#                       automatic when the diff touches
#                       deploy/extensions/ (the pipeline it exercises), and nightly on
#                       main; the GKE twin is amp_deploy_gke_extensions over in
#                       amp-control-plane-gke.yml.
#
# When it fires:
#   * the daily `schedule` fires — runs amp_integration_slow + amp_generate_image +
#     amp_extensions_local on main (default branch). A scheduled run reads no PR
#     body: `decide` marks every owned suite true, so all three run unconditionally.
#   * a new commit is pushed (`synchronize`) or the PR opens/reopens — every
#     directive currently in the body applies, so a persisted `/ci` line re-runs
#     its suite on each new commit. Two suites also self-trigger from the diff, no
#     `/ci` line needed, because each is what exercises the files it watches:
#     amp_integration_slow when it touches test/integration/compute/slow/, and
#     amp_extensions_local when it touches deploy/extensions/ (the extension build
#     pipeline).
#
# Description `edited` is deliberately NOT a trigger, so a directive added to a PR
# that is already up needs a commit to fire — `git commit --allow-empty -m "ci:
# rerun" && git push`. That is a real `synchronize`: right head sha, native check
# runs, and the per-job concurrency below supersedes anything in flight. To re-run
# what already ran, use "Re-run jobs" (it reuses the run, so it cannot mask itself).
#
# Why not `edited`: an edit that added no directive still produced a run whose
# suite jobs `skipped`, and a skipped check run permanently supersedes the live one
# of the same name in the PR's checks list — verified on #437, where the slow
# suite, the image build and the GKE smoke test all passed on the push run and all
# four read `Skipping` on the PR, before and after they finished. The list never
# recovers, so a red suite would hide exactly as well as a green one.
#
# The rule itself lives in .github/actions/ci-directives — one implementation shared
# with every other workflow that has opt-in suites, so `/ci amp_deploy_gke` over in
# control-plane-gke.yml behaves exactly like `/ci amp_integration_slow` does here.
#
# SECURITY: the PR body is untrusted. It is read only inside that action's
# github-script, which turns it into booleans against the fixed allowlist passed in
# below, and is NEVER interpolated into a `run:` shell step. Keep it that way — do
# not `echo "${{ github.event.pull_request.body }}"`.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  schedule:
    # Daily on main: the slow integration suite + the controller image build
    # (scheduled runs only fire on the default branch). 07:17 UTC — off the top
    # of the hour to dodge cron congestion.
    - cron: '17 7 * * *'

# NB: there is deliberately NO workflow-level `concurrency` here — it lives on the
# heavy jobs instead (see `integration` / `amp_generate_image` below).
#
# A workflow-level group has to serve two jobs it cannot serve at once. Cancelling
# is right for the 3h suite (latest commit wins) but wrong for `decide`, which is
# 20s and must ALWAYS report: GitHub keeps only one *pending* run per group, so
# two pushes in quick succession cancel the first while it is still queued, and a
# run cancelled before it starts never creates its job check runs at all — the
# suite then vanishes from the PR's checks list rather than reporting. Per-job
# groups let `decide` always run while the heavy jobs still supersede each other
# across commits.

permissions:
  contents: read

jobs:
  decide:
    name: Amp on-demand — decide which suites to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suites: ${{ steps.gate.outputs.decided }}
    steps:
      # Needed only to make the local composite action below available.
      - uses: actions/checkout@v7

      - id: gate
        uses: ./.github/actions/ci-directives
        with:
          suites: '["amp_integration_slow", "amp_generate_image", "amp_extensions_local"]'
          auto-paths: |
            {
              "amp_integration_slow": "amp/test/integration/compute/slow/",
              "amp_extensions_local": "amp/deploy/extensions/"
            }

  integration:
    name: Amp on-demand — integration (slow)
    needs: decide
    if: fromJSON(needs.decide.outputs.suites).amp_integration_slow && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      # Latest commit wins: a newer run's slow suite cancels the one still going for
      # an older commit, whichever event started it. `decide` is outside this group
      # so it always reports. No queueing happens here — cancel-in-progress means an
      # incoming job cancels rather than waits, so nothing sits pending waiting to be
      # cancelled before it starts.
      group: on-demand-slow-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: amp
    steps:
      # Runs before checkout, so it must not inherit the job's working-directory:
      # amp/ does not exist yet at this point.
      - name: Free up runner disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      - name: Fetch the PostgreSQL submodule
        uses: ./.github/actions/fetch-pg-submodule
        with:
          private-key: ${{ secrets.AGENTK_PRIVATE_KEY }}

      - name: Versions (amp/versions.txt)
        uses: ./.github/actions/yb-version

      - name: Start YugabyteDB
        run: |
          docker run -d --name yb --network host "$YB_IMAGE" \
            bin/yugabyted start --advertise_address=127.0.0.1 --background=false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool libreadline-dev zlib1g-dev flex bison \
            libseccomp-dev libssl-dev clang pkg-config libpq-dev cmake \
            protobuf-compiler libprotobuf-dev libcurl4-openssl-dev libicu-dev \
            libxml2-dev postgresql-client

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Parallelize make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: amp

      - name: Compute PostgreSQL cache key
        id: pgrev
        run: echo "rev=$(git rev-parse HEAD:amp/compute/vendor/postgres-v18)" >> "$GITHUB_OUTPUT"

      - name: Cache PostgreSQL install
        uses: actions/cache@v6
        with:
          path: amp/pg_install
          key: pg-v18-${{ runner.os }}-${{ steps.pgrev.outputs.rev }}-${{ hashFiles('amp/Makefile', 'amp/postgres.mk', 'amp/compute/pgxn/**') }}

      - name: Wait for YugabyteDB
        run: |
          for i in $(seq 1 120); do
            pg_isready -h 127.0.0.1 -p 5433 -q && exit 0
            sleep 2
          done
          echo "YugabyteDB never became ready" >&2
          docker logs yb
          exit 1

      # The storage crates link the prebuilt yb_thin_client shim; fetch it and
      # make it findable at build (YB_THIN_CLIENT_LIB_DIR) and at runtime for
      # the daemons the tests spawn (LD_LIBRARY_PATH). No stub fallback.
      - name: Fetch yb_thin_client shim
        run: |
          DIR="$(scripts/fetch-yb-thin-client.sh)"
          echo "YB_THIN_CLIENT_LIB_DIR=$DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Integration tests (slow suite)
        run: test/integration/compute/run.sh slow

      - name: Collect YugabyteDB logs
        if: failure()
        # yugabyted writes master/tserver/postgres logs under <base_dir>/logs
        # inside the container; pull them next to the run logs so the artifact
        # carries the server side of a failure (a hang in the thin-client path
        # shows only there).
        run: |
          dir=$(docker exec yb sh -c 'ls -d "$HOME"/var/logs /home/yugabyte/var/logs /root/var/logs 2>/dev/null' | head -1)
          mkdir -p .integration-tests
          if [ -n "$dir" ]; then docker cp "yb:$dir" .integration-tests/yb-logs; else echo "no yugabyted log dir found" >&2; fi
          # glog's yb-master.INFO-style pointers are symlinks, and upload-artifact
          # follows symlinks: one that does not resolve after the copy fails the
          # whole upload, taking the run logs with it. The files they point at
          # are copied anyway.
          [ -d .integration-tests/yb-logs ] && find .integration-tests/yb-logs -type l -delete || true

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: on-demand-integration-logs-${{ github.run_id }}
          # *.walredo alongside the logs for the same reason as the fast suite:
          # `record_and_log`'s log line names a dump that otherwise dies with
          # the runner. The poison scenario runs here, not in fast.
          path: |
            amp/.integration-tests/**/*.log
            amp/.integration-tests/**/*.walredo
            amp/.integration-tests/yb-logs/**
          include-hidden-files: true
          if-no-files-found: ignore

  amp_generate_image:
    name: Amp on-demand — controller image build
    needs: decide
    if: fromJSON(needs.decide.outputs.suites).amp_generate_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: on-demand-image-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: amp
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: amp/controller/go.mod

      # controller-bundle-only is Go-only: no Rust toolchain and no
      # amp-postgres submodule, so this image build is self-contained.
      - name: Bundle controller binary
        run: make controller-bundle-only

      - name: Build controller image
        run: docker build -t yb-amp/controller:ci -f deploy/controller/Dockerfile .

  # Local-deploy extension end-to-end test: build the real extension docker image
  # (deploy/extensions/build.sh) and assert CREATE EXTENSION + a query against a
  # throwaway yb_amp_local cluster. Same build env as the slow integration job
  # (YugabyteDB + Postgres + Rust bins), plus docker/buildx for the image build.
  # Runs when a PR carries `/ci amp_extensions_local` OR its diff touches
  # deploy/extensions/ (see the decide auto-paths), and nightly on main (the daily
  # `schedule` marks every owned suite true, so it needs no guard). The ABI-anchor
  # base is the heavy part: ~30 min only when cold, a few minutes once the shared
  # registry layer cache is warm (--cache, below) — the nightly run keeps that cache
  # fresh for PRs. The 120-min timeout is headroom for a fully cold first run
  # (base + Postgres + Rust).
  amp_extensions_local:
    name: Amp on-demand — local extension test
    needs: decide
    if: >-
      fromJSON(needs.decide.outputs.suites).amp_extensions_local
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: on-demand-ext-local-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      # From secrets so the base-image buildx layer cache
      # (quay.io/.../amp-pg18-build:buildcache, shared with the GKE extensions job)
      # can be reused. Empty on forks (which get no secrets) → the Quay login below
      # skips and extensions.sh builds the base cold, without --cache.
      QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
      # Authenticates the private hexabridge source fetch (build.sh -> gh_token
      # BuildKit secret). Empty on forks → the hexabridge step below skips.
      AMP_EXT_GH_TOKEN: ${{ secrets.HEXABRIDGE_GH_PULL }}
    defaults:
      run:
        working-directory: amp
    steps:
      # Runs before checkout, so it must not inherit the job's working-directory:
      # amp/ does not exist yet at this point.
      - name: Free up runner disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      - name: Fetch the PostgreSQL submodule
        uses: ./.github/actions/fetch-pg-submodule
        with:
          private-key: ${{ secrets.AGENTK_PRIVATE_KEY }}

      - name: Versions (amp/versions.txt)
        uses: ./.github/actions/yb-version

      # docker-container builder so build.sh --cache can export the base layer
      # cache to the registry (install:false, so plain `docker build` for the
      # extension image still uses the classic builder and sees the --load'ed base).
      - uses: docker/setup-buildx-action@v4

      # Optional: reuse the shared base-image layer cache. Skipped with no token
      # (forks) — `cache` is then unset and extensions.sh runs without --cache.
      - name: Quay login (base build cache)
        id: quay
        if: env.QUAY_TOKEN != ''
        run: |
          echo "${QUAY_TOKEN#*:}" | docker login quay.io -u "${QUAY_TOKEN%%:*}" --password-stdin
          echo "cache=--cache" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: amp/controller/go.mod
          cache-dependency-path: amp/controller/go.sum

      - name: Start YugabyteDB
        run: |
          docker run -d --name yb --network host "$YB_IMAGE" \
            bin/yugabyted start --advertise_address=127.0.0.1 --background=false

      # postgresql-client for pg_isready; python3-yaml for extensions.sh's manifest
      # parse. libxml2-dev pulls in the libxml2 runtime the host compute needs to
      # load hexabridge.so (which links libxml2 for dbms_xmldom); libcurl/openssl/
      # zlib runtimes come with their -dev packages already listed.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool libreadline-dev zlib1g-dev flex bison \
            libseccomp-dev libssl-dev clang pkg-config libpq-dev cmake \
            protobuf-compiler libprotobuf-dev libcurl4-openssl-dev libicu-dev \
            libxml2-dev postgresql-client python3-yaml

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Parallelize make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: amp

      - name: Compute PostgreSQL cache key
        id: pgrev
        run: echo "rev=$(git rev-parse HEAD:amp/compute/vendor/postgres-v18)" >> "$GITHUB_OUTPUT"

      - name: Cache PostgreSQL install
        uses: actions/cache@v6
        with:
          path: amp/pg_install
          key: pg-v18-${{ runner.os }}-${{ steps.pgrev.outputs.rev }}-${{ hashFiles('amp/Makefile', 'amp/postgres.mk', 'amp/compute/pgxn/**') }}

      - name: Wait for YugabyteDB
        run: |
          for i in $(seq 1 120); do
            pg_isready -h 127.0.0.1 -p 5433 -q && exit 0
            sleep 2
          done
          echo "YugabyteDB never became ready" >&2
          docker logs yb
          exit 1

      # The storage crates link the prebuilt yb_thin_client shim; fetch it and
      # make it findable at build (YB_THIN_CLIENT_LIB_DIR) and at runtime for
      # the daemons the test spawns (LD_LIBRARY_PATH). No stub fallback.
      - name: Fetch yb_thin_client shim
        run: |
          DIR="$(scripts/fetch-yb-thin-client.sh)"
          echo "YB_THIN_CLIENT_LIB_DIR=$DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # --cache only when the Quay login above ran (steps.quay.outputs.cache); on a
      # fork it is empty and the base is built cold. extensions.sh tests one
      # extension per run (--ext, default pgvector), so run each manifest
      # extension explicitly: the ABI-anchor base is built once (the second run
      # reuses it), then each brings up its own throwaway yb_amp_local cluster.
      # --regress runs each extension's OWN upstream regression suite against the
      # mounted ImageVolume — pgvector,pg_cron,... via pg_regress,
      # hexabridge via its scripts/regression.sh — instead of the built-in smoke.
      # The runs share one job and run sequentially, so pin each to a distinct port
      # block (each spans base..base+700). The bases sit BELOW the ephemeral floor
      # (~32768) that pick_base enforces: a block up in the ephemeral range can lose
      # a lane to an outbound connection between the probe and the bind, which is
      # how the controller's base port failed to bind mid-run.
      - name: Local extension regression suite (pgvector)
        env:
          INTEGRATION_PORT_BASE: "18000"
        run: test/integration/compute/extensions.sh --ext pgvector --regress ${{ steps.quay.outputs.cache }}

      - name: Local extension regression suite (pg_cron)
        env:
          INTEGRATION_PORT_BASE: "19000"
        run: test/integration/compute/extensions.sh --ext pg_cron --regress ${{ steps.quay.outputs.cache }}

      # hexabridge's source is private, so this needs AMP_EXT_GH_TOKEN — skipped on
      # forks (no secrets), where the env var is empty. Distinct port block again
      # (20000..20700) so it can't collide with the two runs above.
      - name: Local extension regression suite (hexabridge)
        if: env.AMP_EXT_GH_TOKEN != ''
        env:
          INTEGRATION_PORT_BASE: "20000"
        run: test/integration/compute/extensions.sh --ext hexabridge --regress ${{ steps.quay.outputs.cache }}

      # age (Apache AGE) via its own pg_regress suite. Distinct port block again
      # (21000..21700), below the ephemeral floor, so it can't collide with the
      # runs above.
      - name: Local extension regression suite (age)
        env:
          INTEGRATION_PORT_BASE: "21000"
        run: test/integration/compute/extensions.sh --ext age --regress ${{ steps.quay.outputs.cache }}

      - name: Collect YugabyteDB logs
        if: failure()
        # yugabyted writes master/tserver/postgres logs under <base_dir>/logs
        # inside the container; pull them next to the run logs so the artifact
        # carries the server side of a failure (a hang in the thin-client path
        # shows only there).
        run: |
          dir=$(docker exec yb sh -c 'ls -d "$HOME"/var/logs /home/yugabyte/var/logs /root/var/logs 2>/dev/null' | head -1)
          mkdir -p .integration-tests
          if [ -n "$dir" ]; then docker cp "yb:$dir" .integration-tests/yb-logs; else echo "no yugabyted log dir found" >&2; fi
          # glog's yb-master.INFO-style pointers are symlinks, and upload-artifact
          # follows symlinks: one that does not resolve after the copy fails the
          # whole upload, taking the run logs with it. The files they point at
          # are copied anyway.
          [ -d .integration-tests/yb-logs ] && find .integration-tests/yb-logs -type l -delete || true

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: on-demand-extensions-local-logs-${{ github.run_id }}
          path: |
            amp/.integration-tests/**/*.log
            amp/.integration-tests/**/*.walredo
            amp/.integration-tests/yb-logs/**
          include-hidden-files: true
          if-no-files-found: ignore

  # The single required check for this workflow. `decide` always runs and the heavy
  # suites skip unless asked for, so on a PR carrying no `/ci` line this gate is
  # green in ~30s. When a suite IS requested, its failure blocks the merge — which
  # is the point: an opt-in suite you asked for is a test like any other.
  amp_on_demand_gate:
    name: Amp on-demand gate
    # See .github/actions/ci-gate: always() is load-bearing, and skipped passes.
    if: always()
    needs:
      - decide
      - integration
      - amp_generate_image
      - amp_extensions_local
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Needed only to make the local composite action below available.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
