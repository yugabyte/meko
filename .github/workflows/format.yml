name: Format

# The repo's one formatting gate: .github/scripts/format.sh --check, which runs
# gofmt on every tracked .go file, `cargo fmt --check` on the amp Rust workspace,
# `ruff format --diff` on every tracked .py file, shfmt on every shell script and
# prettier on every .ts/.tsx/.js/.jsx/.mjs/.cjs/.css/.scss file. The steps before
# it only install the pinned tools; format.sh fetches ruff, shfmt and prettier at
# the versions it pins. Nothing needs a build, so the job takes a minute or two.
#
# A required check of the `main-branch` ruleset, by its job name: keep the
# name, and never add a `paths:` filter — a workflow that doesn't run never
# reports, and a required check then waits forever.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # gofmt's output is pinned by the Go release, so pin it to a module's
      # go.mod rather than float with `stable`.
      - uses: actions/setup-go@v7
        with:
          go-version-file: meko/api_server/go.mod
          cache: false

      - name: Install pinned Rust toolchain
        working-directory: amp
        # Reads rust-toolchain.toml (channel + rustfmt component).
        run: rustup toolchain install

      # format.sh runs ruff through uvx at the version it pins.
      - uses: astral-sh/setup-uv@v7

      # ...and prettier through npx.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check formatting
        run: .github/scripts/format.sh --check
