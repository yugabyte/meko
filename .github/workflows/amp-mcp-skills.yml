# Validate + build the amp MCP Agent Skill bundle. Build-only: no secrets, no
# external publish (that step is infra-gated — see controller/mcp/skills/README.md).
name: Amp MCP skills

on:
  push:
    paths:
      - "amp/controller/mcp/skills/**"
      - "amp/.claude-plugin/marketplace.json"
      - ".github/workflows/amp-mcp-skills.yml"
  pull_request:
    paths:
      - "amp/controller/mcp/skills/**"
      - "amp/.claude-plugin/marketplace.json"
      - ".github/workflows/amp-mcp-skills.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Amp MCP skills — validate & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate marketplace.json
        run: |
          python3 -c "import json,sys; json.load(open('amp/.claude-plugin/marketplace.json')); print('marketplace.json OK')"

      - name: Build skill bundle
        run: bash amp/controller/mcp/skills/scripts/package-skill.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: amp-mcp-skills
          path: amp/controller/mcp/skills/*.skill
          if-no-files-found: error
