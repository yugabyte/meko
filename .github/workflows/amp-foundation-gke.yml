name: Amp foundation GKE (itest-dev)

# Stands the amp stack up on an OPERATOR-MANAGED foundation — a real YugabyteDB
# universe reconciled by the YugabyteDB Kubernetes Operator, declared as a
# Foundation custom resource and converged by the foundation pod — and asserts
# the amp reconcile-agent converges against it.
#
# This is the only place the operator path runs. Every other deploy
# (amp-control-plane-gke.yml, amp/deploy/up.sh, meko's deploy-gke.sh,
# ycp/cmd/agent) still brings up its own single-node yugabyted, deliberately:
# YBA adds a ~4.5 CPU yugaware pod and tens of minutes of install, which is far
# too heavy for kind and too heavy to put on every deploy before it has soaked.
#
# The foundation runs as a POD here, not as the CLI: this lane installs the two
# charts, applies a Foundation object and waits for its status. That is what a
# customer does, and it is the only place any of it runs — the CLI's own path is
# covered by unit tests and render goldens, which need no cluster.
#
# Flow:
#   images     — build + push the amp images, the YCP control-plane and
#                reconcile-agent images, and the foundation image, tagged
#                custom-<short-sha>.
#   foundation — write the itest-dev kubeconfig; install the CRD and the
#                foundation controller; stand up the certificate trust root and
#                copy the CA into the Secret the YBCertificate names; stand up
#                an ephemeral YCP control plane; apply the Foundation and wait
#                for Ready; read the address off its status and hand that to
#                up-gke.sh (FOUNDATION=external) with the endpoint user split on;
#                run the agent-driven reconcile smoke and the user-split smoke;
#                then DELETE the object and assert it left nothing behind.
#
# Deleting the Foundation runs as its own step rather than only in teardown: the
# teardown path deletes the namespace, which would hide a broken teardown
# forever. It is also the only thing that exercises the finalizer — the example
# ships deletionPolicy Retain, so the step flips it to Delete first, and the
# universe going away is what proves the policy is tracked rather than fixed at
# creation. Checking for orphaned ClusterRoles afterwards is what keeps that
# honest, which is why this workflow is ephemeral per run rather than reusing a
# standing foundation.
#
# Placement — separate from amp-control-plane-gke.yml, and on its own cron, so
# two heavy GKE runs never contend for itest-dev. It fires only:
#   * nightly on main (schedule), at 03:17 UTC — deliberately away from the
#     07:17 slot amp-control-plane-gke.yml and on-demand-checks.yml share;
#   * on manual dispatch;
#   * on a PR carrying `/ci amp_deploy_gke_foundation` in its description
#     (.github/actions/ci-directives, see amp/docs/ci-directives.md). Adding the
#     line to a PR already up needs a commit to fire — an empty one is enough.
#
# It touches the itest cluster and needs org secrets (KUBECONFIG_ITEST_DEV,
# QUAY_AMP_TOKEN), so fork PRs (which get no secrets) are always skipped.
#
# SECURITY: the PR body is untrusted. It is read only inside the ci-directives
# action's github-script, which turns it into a boolean against the fixed suite
# allowlist passed below, and is NEVER interpolated into a `run:` shell step.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      chart_version:
        description: >-
          Full yugaware build to deploy, e.g. 2026.1.3.0-b21. Its tarball is
          downloaded from releases.yugabyte.com and handed to the deployer as
          a local path, and the same string is the CRD bundle's git ref; it
          must also be pinned in amp/downloads_checksum.txt. 2026.1.3.0-b21 or
          LATER only: the spec this lane deploys is encrypted and needs the
          universe chart's tls.extraSANs, which arrived in 2026.1.3 — an older
          chart renders no SAN for the endpoint Service and every verify-full
          consumer then fails the hostname check. Empty deploys whatever the
          spec file names.
        required: false
        type: string
      db_version:
        description: >-
          universe ybSoftwareVersion, overriding the spec. Leave empty with a
          chart_version set and the chart's own appVersion is used, which is
          the release its yugaware image bundles.
        required: false
        type: string
  pull_request:
    branches: [main]
    # No paths filter: the `/ci amp_deploy_gke_foundation` directive is the
    # switch. `edited` is deliberately absent — see the note in
    # on-demand-checks.yml.
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  QUAY_NS: quay.io/yugabyte

jobs:
  decide:
    name: Amp foundation — decide whether to deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suites: ${{ steps.gate.outputs.decided }}
    steps:
      # Needed only to make the local composite action below available.
      - uses: actions/checkout@v7

      - id: gate
        uses: ./.github/actions/ci-directives
        with:
          suites: '["amp_deploy_gke_foundation"]'
          # Nightly and a manual dispatch both mean "run it", so they skip the
          # body entirely. Unlike the extensions/ycp supersets over in
          # amp-control-plane-gke.yml, this one IS unconditional on schedule:
          # a nightly is the whole point of this workflow.
          unconditional-events: schedule workflow_dispatch

  images:
    name: Amp foundation — build + push images (Quay)
    needs: decide
    if: >-
      fromJSON(needs.decide.outputs.suites).amp_deploy_gke_foundation &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Shared with the foundation job below so a newer run supersedes an older
      # run's whole pipeline, and one FIXED group across all runs (not per-PR):
      # a foundation holds a ~5 CPU yugaware pod, and two at once would starve
      # itest-dev.
      group: foundation-gke
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      # compute/vendor/postgres-v18 is the private yugabyte/amp-postgres repo,
      # which the default GITHUB_TOKEN cannot read. Feeds the endpoint build.
      - name: Fetch the PostgreSQL submodule
        uses: ./.github/actions/fetch-pg-submodule
        with:
          private-key: ${{ secrets.AGENTK_PRIVATE_KEY }}

      - uses: docker/setup-buildx-action@v4

      - name: Quay login
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
        run: echo "${QUAY_TOKEN#*:}" | docker login quay.io -u "${QUAY_TOKEN%%:*}" --password-stdin

      - name: Deploy tag (custom-<short commit id>)
        id: tag
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "tag=custom-${SHA:0:12}" >> "$GITHUB_OUTPUT"

      # NB: these build steps mirror amp-control-plane-gke.yml's images job and
      # must stay in step with it. They share its registry layer cache
      # (amp-endpoint:buildcache), so building the same commit twice is cheap —
      # but a Dockerfile or build-flag change made there and not here will drift.
      - name: Endpoint image
        run: |
          EP="$QUAY_NS/amp-endpoint"
          docker buildx build --push -f amp/deploy/endpoint/Dockerfile amp \
            -t "$EP:${{ steps.tag.outputs.tag }}" \
            --cache-from type=registry,ref="$EP:buildcache" \
            --cache-to   type=registry,ref="$EP:buildcache",mode=max

      - uses: actions/setup-go@v7
        with:
          go-version-file: amp/controller/go.mod
          cache-dependency-path: amp/controller/go.sum

      - name: Controller image
        run: |
          make -C amp controller-bundle-only
          docker buildx build --push -f amp/deploy/controller/Dockerfile amp \
            -t "$QUAY_NS/amp-controller:${{ steps.tag.outputs.tag }}"

      - name: MCP image
        run: |
          docker buildx build --push -f amp/controller/mcp/Dockerfile \
            -t "$QUAY_NS/amp-mcp:${{ steps.tag.outputs.tag }}" amp/controller/mcp

      # The reconcile smoke drives the stack through YCP, so both halves of that
      # path are built from this commit: the control plane the agent talks to,
      # and the agent itself.
      - name: YCP api-server image
        run: |
          docker buildx build --push --platform linux/amd64 \
            -f meko/api_server/Dockerfile \
            -t "$QUAY_NS/ycp-api-server:${{ steps.tag.outputs.tag }}" \
            meko/api_server

      - name: Reconcile-agent image
        run: |
          docker buildx build --push --platform linux/amd64 \
            -f ycp/Dockerfile.reconcile-agent \
            -t "$QUAY_NS/ycp-reconciler-agent:${{ steps.tag.outputs.tag }}" \
            ycp

      # The foundation itself, which on this lane is a POD rather than the CLI:
      # the deploy below installs the chart and applies a Foundation, so the
      # image has to exist at this commit's tag before it can. --no-latest
      # because `latest` belongs to main's own workflow, not to a PR.
      #
      # Through build-image.sh rather than a buildx line like the others, so the
      # Dockerfile, the pinned kubectl/helm versions and the tag scheme stay in
      # one place that is also runnable locally.
      - name: Foundation image
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
        run: |
          # From the tag step's own output, not from the SHA again: that step
          # truncates to 12 and the deploy job pins THAT, so computing it twice
          # is how the image lands under a tag nothing references.
          TAG='${{ steps.tag.outputs.tag }}'
          IMAGE="$QUAY_NS/meko-foundation" SHA="${TAG#custom-}" \
            foundation/build-image.sh --no-latest

  foundation:
    name: Amp foundation — deploy on an operator-managed universe
    needs: [decide, images]
    runs-on: ubuntu-latest
    # A yugaware install alone is given 40 minutes, and the universe create,
    # controller deploy, reconcile smoke and teardown follow it. The
    # control-plane deploy job's 45 does not fit.
    timeout-minutes: 90
    concurrency:
      group: foundation-gke
      cancel-in-progress: true
    env:
      # ci-pr-fnd-<n> rather than a prefix of its own: the reaper in
      # amp-control-plane-gke-cleanup.yml sweeps ci-pr-*, so a hard-cancelled run
      # still gets its namespace collected.
      NS: ci-pr-fnd-${{ github.event.pull_request.number || github.run_id }}
      PULL_SECRET: quay-pull-secret
      TAG: ${{ needs.images.outputs.tag }}
      FOUNDATION_CR: foundation/examples/foundation-cr.yaml
    steps:
      - uses: actions/checkout@v7

      # No Go toolchain: this job no longer builds or runs the foundation CLI.
      # The deployer reaches the cluster as the image built above, driven by a
      # Foundation object.
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo '${{ secrets.KUBECONFIG_ITEST_DEV }}' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6

      # `validate` parses the spec and applies its semantic rules — the ones YBA
      # would otherwise reject asynchronously, tens of minutes in. Schema errors
      # are not its job: the API server rejects an undeclared field or a bad enum
      # on apply. It then reports the storage classes, which is why this does not
      # read the YAML directly: a class is settable on the universe's volumes AND
      # on the provider's zones, and the provider's wins, so parsing one path
      # would check the wrong class.
      # The foundation as a POD, which is what this lane exists to exercise:
      # the CRD once per cluster, the controller in this namespace, and a
      # Foundation object it converges onto. No `foundation` CLI anywhere —
      # the same Go runs, reached through the loop instead.
      #
      # The CRD release is cluster-scoped and shared, so it is upgraded rather
      # than installed: a concurrent run on another namespace may already own it.
      # BEFORE the chart, because the foundation image is private and the chart
      # names this secret: without it the pod sits in ImagePullBackOff and the
      # install times out on --wait with nothing but "context deadline exceeded".
      # up-gke.sh mints the same secret later for the amp images; applying it
      # here first is idempotent, and the yugaware chart the POD installs reads
      # it too (yba.values.image.pullSecret).
      - name: Namespace and pull secret
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
        run: |
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          AUTH=$(printf '%s' "$QUAY_TOKEN" | base64 -w0)
          CFG=$(mktemp)
          printf '{"auths":{"quay.io":{"auth":"%s"}}}' "$AUTH" > "$CFG"
          kubectl -n "$NS" create secret generic "$PULL_SECRET" \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=.dockerconfigjson="$CFG" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$CFG"

      - name: Install the foundation CRD and controller
        run: |
          helm upgrade --install meko-foundation-crd \
            foundation/deploy/helm/meko-foundation-crd --wait
          helm upgrade --install fdn foundation/deploy/helm/meko-foundation \
            -n "$NS" \
            --set image.tag="$TAG" \
            --set "imagePullSecrets[0].name=$PULL_SECRET" \
            --wait --timeout 5m
          kubectl -n "$NS" rollout status deploy/fdn-meko-foundation --timeout=5m

      # The trust root BEFORE the object: YBA reads the YBCertificate's Secret as
      # it applies the CR, and signs node certificates from the ClusterIssuer the
      # provider names. Standing it up afterwards leaves the universe signed by
      # nothing. up-gke.sh runs the same script again later for the controller's
      # own certificate; it is idempotent.
      - name: Certificate trust root, and the CA for YBA
        run: |
          TLS_ISSUER_NAME=amp-ca TLS_ISSUER_KIND=ClusterIssuer \
          TLS_ISSUER_GROUP=cert-manager.io TLS_TRUST_NAMESPACES="$NS" \
            amp/deploy/tls/trust-root.sh

          # trust-manager publishes the CA as a ConfigMap and a CR can only name
          # a Secret, so copy it. Through a file with the trailing newline put
          # back: command substitution strips it and YBA rejects a PEM without
          # one, writing the reason to the YBCertificate's status where nothing
          # else would look.
          CA=$(kubectl -n "$NS" get configmap amp-ca-bundle -o jsonpath='{.data.ca\.crt}')
          [ -n "$CA" ] || { echo "::error::amp-ca-bundle has no ca.crt in $NS"; exit 1; }
          F=$(mktemp); printf '%s\n' "$CA" > "$F"
          kubectl -n "$NS" create secret generic amp-ca-bundle-tls \
            --from-file=ca.crt="$F" --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$F"

      - name: YCP control plane + register
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
          # The door this control plane issues. Set in both steps from the same
          # value so the hint it prints and the endpoint the data plane deploys
          # with cannot disagree.
          YCP_BYOC_METRICS_URL: ${{ vars.BYOC_METRICS_URL || 'https://byoc.devcloud.yugabyte.com/api/v1/otlp/metrics' }}
        run: |
          AUTH="$(printf '%s' "$QUAY_TOKEN" | base64 -w0)"
          export PULL_SECRET_DOCKERCONFIGJSON="{\"auths\":{\"quay.io\":{\"auth\":\"${AUTH}\"}}}"
          NS="$NS" \
          YCP_IMAGE="$QUAY_NS/ycp-api-server:$TAG" \
          PULL_SECRET="$PULL_SECRET" \
          YCP_ENV_NAME="foundation-smoke" \
          YCP_BYOC_METRICS_URL="$YCP_BYOC_METRICS_URL" \
          amp/deploy/ycp-up.sh

      # No FOUNDATION=operator here any more: the universe is stood up by the
      # POD, above, and up-gke.sh is pointed at the result with
      # FOUNDATION=external and the address read off status.address — which is
      # the shape a customer gets, since nothing of ours runs in their cluster
      # but the pod.
      # The BYOC telemetry credentials, for the same reason the control-plane
      # workflow carries them: YCP_ENABLED=1 means agent.enabled=true, which is a
      # YCP-managed environment, and one that ships no telemetry comes up DEGRADED
      # — which the reconcile smoke below asserts against.
      # A dispatch can name a build the example does not. The object is the
      # deployer's only input, so this writes one: the example with three values
      # replaced, which FOUNDATION_CR then points at.
      #
      # The release bucket is public, so the download needs no credentials,
      # and nothing in the deployer has to know where charts come from. It is
      # verified against amp/downloads_checksum.txt like every other download,
      # and a chart with no pin there fails here: pin it first, with
      # `amp/scripts/safe_curl.sh add <url>` (the error prints the URL).
      - name: Build a spec for this chart
        if: inputs.chart_version != ''
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
          DB_VERSION: ${{ inputs.db_version }}
        run: |
          LINE=$(echo "$CHART_VERSION" | cut -d- -f1 | cut -d. -f1-3)
          URL="https://releases.yugabyte.com/$CHART_VERSION/helm/yugaware-${LINE}.tgz"
          echo "fetching $URL"
          # A chart that is not pinned fails before anything is downloaded
          # from it, with the one-line fix.
          sh amp/scripts/safe_curl.sh lookup "$URL" >/dev/null || {
            echo "::error::$URL is not pinned in amp/downloads_checksum.txt — run amp/scripts/safe_curl.sh add '$URL' and commit the line"
            exit 1
          }
          # LIST is denied on the bucket, so a build that does not exist
          # answers 403 rather than 404 — curl's --fail turns either into a
          # named failure here instead of helm choking on an XML error document.
          sh amp/scripts/safe_curl.sh fetch "$URL" /tmp/yugaware.tgz || {
            echo "::error::$URL did not fetch or did not match its pin (403 here usually means the build does not exist)"
            exit 1
          }

          # The DB release a yugaware has is decided by its image, which the
          # chart pins with appVersion — so the chart is the authority on what
          # the universe may ask for. Without this, naming only a chart runs
          # it against the spec's DB version and the release check fails
          # twenty minutes in, correctly but expensively.
          if [ -z "$DB_VERSION" ]; then
            CHART_YAML=$(tar tzf /tmp/yugaware.tgz | grep -m1 -E '^[^/]+/Chart.yaml$')
            DB_VERSION=$(tar xzOf /tmp/yugaware.tgz "$CHART_YAML" \
              | awk '/^appVersion:/{print $2}' | tr -d '"')
            [ -n "$DB_VERSION" ] || { echo "::error::no appVersion in $CHART_YAML"; exit 1; }
            echo "db_version not given; using the chart's appVersion $DB_VERSION"
          fi

          # Written next to the example, so a path relative to the repo root
          # reaches it from every later step.
          OUT=foundation/examples/.ci-dispatch.yaml
          # The CR's CRs are a LIST, so the universe is found by kind rather
          # than by key. Written as one line because this sits in an indented
          # YAML block and a heredoc body would carry that indentation into the
          # Python source.
          # yba.chart is the URL, not the file just downloaded: the deployer is a
          # POD, and /tmp on this runner is not a path it can see. helm fetches a
          # URL like any other chart, and the release bucket is public for reads,
          # so the pod needs no credentials. The download above is still what
          # proves the URL is pinned and what the appVersion was read from.
          CHART_VERSION="$CHART_VERSION" DB_VERSION="$DB_VERSION" OUT="$OUT" URL="$URL" python3 -c 'import os,sys,yaml; d=yaml.safe_load(open(sys.argv[1])); s=d["spec"]; s["chartVersion"]=os.environ["CHART_VERSION"]; s["chartSource"]="path"; s.setdefault("yba",{})["chart"]=os.environ["URL"]; u=[r for r in s["resources"] if r["kind"]=="YBUniverse"][0]; u["spec"]["ybSoftwareVersion"]=os.environ["DB_VERSION"]; yaml.safe_dump(d,open(os.environ["OUT"],"w"),sort_keys=False)' "$FOUNDATION_CR"

          echo "FOUNDATION_CR=$OUT" >> "$GITHUB_ENV"
          echo "chart=$CHART_VERSION db=$DB_VERSION cr=$OUT"

      - name: Apply the Foundation and wait for it
        run: |
          kubectl apply -n "$NS" -f "$FOUNDATION_CR"
          # Ready means REACHABLE, not merely applied: every declared CR is
          # ready AND there is an address. A spec the pod's preflight rejects
          # never gets there, so the dump below prints the conditions, which is
          # where that reason lands.
          if ! kubectl wait --for=jsonpath='{.status.phase}'=Ready \
                 -n "$NS" foundation/foundation --timeout=50m; then
            echo "::error::the Foundation never became Ready"
            kubectl -n "$NS" get foundation foundation -o yaml || true
            kubectl -n "$NS" logs deploy/fdn-meko-foundation --tail=200 || true
            exit 1
          fi

      # The facts later assertions need, read off the object rather than
      # re-derived: the universe namespace is wherever the provider zones put
      # the DB pods, and the sslmode is what the universe's create-time
      # encryption flags imply. Both are what a consumer would read.
      - name: Read the address off the Foundation
        run: |
          UNIVERSE_NS=$(kubectl -n "$NS" get foundation foundation \
            -o jsonpath='{.status.address.universe_namespace}')
          YB_HOST_PORTS=$(kubectl -n "$NS" get foundation foundation \
            -o jsonpath='{.status.address.ysql_host_ports}')
          YB_SSLMODE=$(kubectl -n "$NS" get foundation foundation \
            -o jsonpath='{.status.address.ssl_mode}')
          for v in UNIVERSE_NS YB_HOST_PORTS YB_SSLMODE; do
            eval "val=\$$v"
            [ -n "$val" ] || { echo "::error::the Foundation status has no $v"; exit 1; }
            echo "$v=$val" >> "$GITHUB_ENV"
            echo "$v=$val"
          done
          # This lane asserts a verify-full session and a SAN naming the
          # endpoint Service; an unencrypted universe would make both vacuous.
          [ "$YB_SSLMODE" = "verify-full" ] || {
            echo "::error::expected a verify-full universe, got $YB_SSLMODE"; exit 1; }

      - name: Deploy amp onto the universe the Foundation built (up-gke.sh)
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
          YCP_BYOC_METRICS_URL: ${{ vars.BYOC_METRICS_URL || 'https://byoc.devcloud.yugabyte.com/api/v1/otlp/metrics' }}
          YCP_BYOC_PASSWORD: ${{ secrets.BYOC_METRICS_PASSWORD }}
          YCP_DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          AUTH="$(printf '%s' "$QUAY_TOKEN" | base64 -w0)"
          export PULL_SECRET_DOCKERCONFIGJSON="{\"auths\":{\"quay.io\":{\"auth\":\"${AUTH}\"}}}"
          NS="$NS" \
          FOUNDATION=external \
          YB_HOST_PORTS="$YB_HOST_PORTS" \
          YB_SSLMODE="$YB_SSLMODE" \
          YB_UNIVERSE_NAMESPACE="$UNIVERSE_NS" \
          REGISTRY="$QUAY_NS" \
          CONTROLLER_IMAGE_REPO=amp-controller \
          ENDPOINT_IMAGE_REPO=amp-endpoint \
          MCP_IMAGE_REPO=amp-mcp \
          UI_ENABLED=false \
          TAG="$TAG" \
          PULL_SECRET="$PULL_SECRET" \
          CONTROLLER_EXPOSE=none \
          ENDPOINT_SERVICE_TYPE=ClusterIP \
          YCP_ENABLED=1 \
          YCP_BYOC_METRICS_URL="$YCP_BYOC_METRICS_URL" \
          YCP_BYOC_PASSWORD="$YCP_BYOC_PASSWORD" \
          YCP_DATADOG_API_KEY="$YCP_DATADOG_API_KEY" \
          EXTRA_HELM_SET="controller.endpoint.userSplit=true" \
          amp/deploy/up-gke.sh

      # What the foundation is FOR: the agent declares desired state through YCP
      # and the controller builds it on the operator-managed universe. This is
      # the existing smoke, unchanged — the foundation is the variable.
      - name: Reconcile smoke (agent-driven)
        # This lane deploys endpoints with the storage/compute user split
        # (AMP-84), since it has the client-certificate auth the split relies
        # on; amp_deploy_gke keeps single-user mode covered. The reconcile smoke
        # proves split endpoints serve, and runs user-split-smoke.sh on them
        # before it withdraws them.
        run: |
          NS="$NS" YCP_ENV_ID="$YCP_ENV_ID" YCP_ADMIN_KEY="$YCP_ADMIN_KEY" \
          BEFORE_WITHDRAW=amp/deploy/user-split-smoke.sh \
          amp/deploy/ycp-reconcile-smoke.sh

      # One ClusterIP carries BOTH client ports, and both compute lanes come off
      # it: the YSQL pool connects to 5433 as given, and the direct-RPC lane
      # derives the same host on 9100 (the deploy path cannot set
      # tserver_rpc_addrs, so that derivation is the only route). So this Service
      # missing either port breaks one lane.
      #
      # The chart creates it from the kubernetesOverrides.serviceEndpoints entry
      # in the CR — nothing in foundation/ creates it. Two chart values gate it
      # and neither is ours to set, so this step is where we find out they held:
      # enableLoadBalancer (the CR sets it) and oldNamingStyle off (YBA's choice,
      # absent from the CRD's kubernetesOverrides schema, so unforceable).
      #
      # An empty endpoint list means the chart's own selector matched no pods;
      # the symptom in production is compute daemons failing to open their table
      # handles at startup, with nothing pointing back here.
      - name: Check the tserver Service has both ports and endpoints
        run: |
          # Found by label, never by name. YBA prefixes a Namespaced endpoint
          # with the universe name it GENERATED ("foundation-1954916679-..."),
          # so there is no name to construct — but `serviceName` and `scope` are
          # written from values the CR sets, so they are a stable identity.
          SVC=$(kubectl -n "$UNIVERSE_NS" get svc \
            -l serviceName=yb-tserver-conn,scope=Namespaced \
            -o jsonpath='{.items[0].metadata.name}')
          [ -n "$SVC" ] || {
            echo "::error::nothing matched serviceName=yb-tserver-conn,scope=Namespaced in $UNIVERSE_NS"
            kubectl -n "$UNIVERSE_NS" get svc --show-labels
            exit 1
          }
          echo "tserver Service: $SVC (namespace $UNIVERSE_NS)"
          kubectl -n "$UNIVERSE_NS" get svc,endpoints "$SVC" -o wide
          # Both ports, or one lane has nowhere to connect.
          for PORT in 5433 9100; do
            kubectl -n "$UNIVERSE_NS" get svc "$SVC" -o jsonpath='{.spec.ports[*].port}' \
              | tr ' ' '\n' | grep -qx "$PORT" \
              || { echo "::error::$SVC does not expose port $PORT"; exit 1; }
          done
          echo "$SVC exposes 5433 and 9100"
          IPS=$(kubectl -n "$UNIVERSE_NS" get endpoints "$SVC" \
            -o jsonpath='{.subsets[*].addresses[*].ip}' | wc -w)
          echo "$SVC has $IPS endpoint(s)"
          [ "$IPS" -gt 0 ] || {
            echo "::error::no endpoints — the chart's serviceEndpoint selector matched no pods"
            kubectl -n "$UNIVERSE_NS" get svc "$SVC" -o jsonpath='{.spec.selector}'; echo
            kubectl -n "$UNIVERSE_NS" get pods --show-labels | grep tserver || true
            exit 1
          }

      # The encryption assertions. All three fail differently and none of them
      # can be made offline: the spec ASKS for a SAN through
      # kubernetesOverrides.tls.extraSANs, and whether YBA passes that through
      # when it writes the universe chart's own tls block is YBA's business.
      # Without it everything still looks healthy — Service, endpoints, Ready
      # universe — and every verify-full consumer fails a hostname check.
      - name: Check the universe is really encrypted and the Service name verifies
        run: |
          SVC=$(kubectl -n "$UNIVERSE_NS" get svc \
            -l serviceName=yb-tserver-conn,scope=Namespaced \
            -o jsonpath='{.items[0].metadata.name}')
          FQDN="$SVC.$UNIVERSE_NS.svc.cluster.local"

          # 1. the SAN landed. Read off the Certificate rather than the spec,
          #    because the spec is the request and this is the result.
          SANS=$(kubectl -n "$UNIVERSE_NS" get certificate \
            -o jsonpath='{.items[*].spec.dnsNames}' 2>/dev/null || true)
          echo "certificate dnsNames: $SANS"
          case "$SANS" in
            *"$FQDN"*) echo "node certificates name $FQDN" ;;
            *) echo "::error::no node certificate names $FQDN, but every consumer dials exactly"
               echo "::error::that name with sslmode=verify-full. tls.extraSANs did not take."
               kubectl -n "$UNIVERSE_NS" get certificate -o yaml || true
               exit 1 ;;
          esac

          # 2. the name verifies AND the session is really TLS. One command
          #    from inside a tserver pod, which already holds the CA and a
          #    client certificate: ysqlsh with verify-full against the Service
          #    FQDN fails the handshake on a bad SAN, and pg_stat_ssl then says
          #    whether what got established was actually encrypted. A server
          #    that quietly fell back to plaintext fails the second; a wrong SAN
          #    fails the first.
          SEL=$(kubectl -n "$UNIVERSE_NS" get svc "$SVC" -o jsonpath='{.spec.selector}' \
            | python3 -c "import json,sys; print(','.join('%s=%s' % kv for kv in sorted(json.load(sys.stdin).items())))")
          POD=$(kubectl -n "$UNIVERSE_NS" get pods -l "$SEL" -o jsonpath='{.items[0].metadata.name}')
          # 2. the SAN resolves in a real handshake, not just on paper.
          #    verify-full fails on a name the certificate does not carry, so a
          #    connection that succeeds is the assertion.
          #
          #    The CA comes from the amp-ca-bundle ConfigMap — the one every amp
          #    pod trusts — copied into the tserver pod, because a YBA-managed
          #    pod does not expose its own /root/.yugabytedb to an exec. That is
          #    also what makes this worth running: it verifies the way a
          #    CONSUMER would, with the consumer's trust store.
          #
          #    Nothing here tests client authentication: this spec sets no hba
          #    rules, so there is no rule to prove. See examples/foundation-cli.yaml.
          CA=$(kubectl -n "$NS" get configmap amp-ca-bundle -o jsonpath='{.data.ca\.crt}')
          [ -n "$CA" ] || { echo "::error::no amp-ca-bundle in $NS to verify against"; exit 1; }
          kubectl -n "$UNIVERSE_NS" exec -i "$POD" -c yb-tserver -- bash -s <<EOF || {
          set -euo pipefail
          cat > /tmp/amp-ca.crt <<'CAEOF'
          $CA
          CAEOF
          Y=\$(ls /home/yugabyte/tserver/postgres/bin/ysqlsh 2>/dev/null || command -v ysqlsh)
          "\$Y" "host=$FQDN port=5433 user=yugabyte dbname=yb_storage sslmode=verify-full \
            sslrootcert=/tmp/amp-ca.crt" -tAc "SELECT 1"
          EOF
            echo "::error::verify-full to $FQDN failed against the amp-ca bundle. The name IS in"
            echo "::error::the certificate (checked above), so this is the chain or the handshake:"
            echo "::error::read the ysqlsh error, and check the universe was signed by amp-ca."
            exit 1
          }
          echo "$FQDN verifies against the CA amp pods trust"

          # 3. the DSN the controller was actually given. The deploy assembles
          #    it from `foundation connstr` plus the consumer's own cert paths,
          #    so this is where the two halves are proved to have met.
          DSN=$(kubectl -n "$NS" get deploy amp-controller \
            -o jsonpath='{.spec.template.spec.containers[*].env[?(@.name=="AMP_DATABASE_URL")].value}')
          echo "controller DSN: $DSN"
          for WANT in "sslmode=verify-full" "sslrootcert=" "sslcert=" "sslkey="; do
            case "$DSN" in
              *"$WANT"*) ;;
              *) echo "::error::the controller DSN is missing $WANT"; exit 1 ;;
            esac
          done

      # Metrics export is declared on the CRs and everything after that belongs to
      # somebody else — the operator turns them into YBA config, YBA renders a
      # collector config, the DB chart injects it — and every one of those links
      # fails quietly. This is the only place a real universe exists to check
      # them against (meko#1405).
      #
      # DB_NS because the universe lands in the provider zones' kubeNamespace,
      # which on this path is whatever that resolved to.
      - name: Check YugabyteDB metrics export is on
        run: NS="$NS" DB_NS="$UNIVERSE_NS" amp/deploy/yb-metrics-smoke.sh

      # An explicit down, then proof it reclaimed the cluster-scoped RBAC. The
      # chart names a ClusterRole and ClusterRoleBinding after the helm release,
      # and a namespace delete never reclaims a cluster-scoped object — so
      # without this the leak is invisible until it collides with a later run.
      # What an operator actually sees. A printer column whose jsonPath names
      # a field nothing writes is an error NOWHERE — kubectl just prints an
      # empty cell — so only reading the real output catches it.
      - name: kubectl get and describe show the foundation
        run: |
          echo "== kubectl get foundation"
          kubectl -n "$NS" get foundation
          # Two guards, because a broken column fails two different ways. A
          # path that resolves to nothing prints <none>, which keeps the field
          # count right — so the per-column checks catch that; a path kubectl
          # cannot evaluate drops the cell entirely, which the count catches.
          ROW=$(kubectl -n "$NS" get foundation --no-headers)
          echo "   row: $ROW"
          set -- $ROW
          # NAME PHASE YBA UNIVERSE PROVIDER READY AGE
          [ "$#" -eq 7 ] || {
            echo "::error::expected 7 columns, got $# — a blank cell collapses the row"; exit 1; }
          [ "$2" = "Ready" ] || { echo "::error::PHASE is '$2', want Ready"; exit 1; }
          [ "$4" = "Ready" ] || { echo "::error::UNIVERSE is '$4', want Ready"; exit 1; }
          [ "$5" = "Ready" ] || { echo "::error::PROVIDER is '$5', want Ready"; exit 1; }
          [ "$6" = "True" ]  || { echo "::error::READY is '$6', want True"; exit 1; }

          echo "== kubectl describe foundation"
          kubectl -n "$NS" describe foundation foundation
          # Events are the record of what happened; the conditions only say
          # what is true now. An operator looks here first, so an empty Events
          # section is a real gap however good the status is.
          # By the object's KIND rather than a field selector: we write
          # events.k8s.io/v1 Events with `regarding`, which the core v1 API
          # surfaces as involvedObject — reading it this way does not depend on
          # which of the two kubectl picked.
          REASONS=$(kubectl -n "$NS" get events -o jsonpath='{range .items[?(@.involvedObject.kind=="Foundation")]}{.reason}{" "}{end}')
          echo "   event reasons: ${REASONS:-<none>}"
          EV=$(printf '%s' "$REASONS" | wc -w)
          [ "$EV" -gt 0 ] || {
            echo "::error::no events were recorded about the Foundation"
            kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -30 || true
            exit 1
          }

      # Everything above proves the happy path. This proves the two things a
      # real foundation actually spends its life doing: rejecting a bad edit
      # without damage, and converging the fix.
      #
      # The failure is a CR-application one and is deliberately harmless — an
      # undeclared field, which the API server refuses under the strict
      # validation `kubectl apply` sends, so the universe is never touched. The
      # cert and provider ahead of it in the list apply fine; only the universe
      # is rejected. That is the shape of a real typo.
      - name: A bad edit is reported, and the fix converges
        run: |
          # Waits for a jsonpath to equal a value, printing the object when it
          # does not. The loop polls every 30s, so nothing here is instant.
          wait_for() {
            local path="$1" want="$2" secs="${3:-180}" got=
            for _ in $(seq 1 $((secs / 5))); do
              got=$(kubectl -n "$NS" get foundation foundation -o jsonpath="$path" 2>/dev/null || true)
              [ "$got" = "$want" ] && { echo "   $path = $got"; return 0; }
              sleep 5
            done
            echo "::error::$path was '$got' after ${secs}s, want '$want'"
            kubectl -n "$NS" get foundation foundation -o yaml || true
            kubectl -n "$NS" logs deploy/fdn-meko-foundation --tail=120 || true
            return 1
          }

          GEN_BEFORE=$(kubectl -n "$NS" get foundation foundation -o jsonpath='{.metadata.generation}')
          echo "generation before the bad edit: $GEN_BEFORE"

          # `test` first, so a reordered resources list fails loudly here rather
          # than silently patching the wrong CR.
          kubectl -n "$NS" patch foundation foundation --type=json -p '[
            {"op":"test","path":"/spec/resources/2/kind","value":"YBUniverse"},
            {"op":"add","path":"/spec/resources/2/spec/numNodez","value":3}]'

          # The loop has to NOTICE, report, and keep the foundation usable.
          # Wait on the REASON, not the status. Converged passes through False
          # twice: once as Converging while the converge is in flight, then as
          # ConvergeFailed when it ends. Waiting for the status matches the
          # first and reads a reason that has not settled — which is exactly
          # what this step did on its first run.
          echo "== waiting for the rejection to be reported"
          wait_for '{.status.conditions[?(@.type=="Converged")].reason}' ConvergeFailed 240
          STATUS=$(kubectl -n "$NS" get foundation foundation \
            -o jsonpath='{.status.conditions[?(@.type=="Converged")].status}')
          MSG=$(kubectl -n "$NS" get foundation foundation \
            -o jsonpath='{.status.conditions[?(@.type=="Converged")].message}')
          echo "   status=$STATUS"
          echo "   message=$MSG"
          [ "$STATUS" = "False" ] || {
            echo "::error::Converged status is '$STATUS', want False"; exit 1; }
          # The API server's own words, carried through rather than swallowed —
          # a reader has to be able to see WHICH field was refused.
          case "$MSG" in
            *numNodez*) ;;
            *) echo "::error::the message does not name the field the API server refused"; exit 1 ;;
          esac
          # The universe is untouched: a rejected apply must not take the
          # foundation's address away from the consumer that is using it.
          ADDR=$(kubectl -n "$NS" get foundation foundation \
            -o jsonpath='{.status.address.ysql_host_ports}')
          [ "$ADDR" = "$YB_HOST_PORTS" ] || {
            echo "::error::the address changed under a rejected edit: '$ADDR'"; exit 1; }
          echo "   address still $ADDR"

          echo "== fixing the spec"
          kubectl -n "$NS" patch foundation foundation --type=json -p '[
            {"op":"remove","path":"/spec/resources/2/spec/numNodez"}]'

          # A new generation clears the backoff, so this must NOT wait out the
          # exponential retry the failure started. On the reason again, for the
          # same reason as above.
          wait_for '{.status.conditions[?(@.type=="Converged")].reason}' Converged 300
          wait_for '{.status.conditions[?(@.type=="Converged")].status}' True 60
          wait_for '{.status.phase}' Ready 300

          GEN=$(kubectl -n "$NS" get foundation foundation -o jsonpath='{.metadata.generation}')
          OBS=$(kubectl -n "$NS" get foundation foundation -o jsonpath='{.status.observedGeneration}')
          echo "generation=$GEN observedGeneration=$OBS (was $GEN_BEFORE)"
          [ "$GEN" != "$GEN_BEFORE" ] || {
            echo "::error::the edits did not bump metadata.generation"; exit 1; }
          # The gap between these two is the only way a reader can tell whether
          # their edit has been acted on, so it has to close.
          [ "$OBS" = "$GEN" ] || {
            echo "::error::observedGeneration $OBS never caught up to generation $GEN"; exit 1; }

      # The failure that found itself. The autoscaler evicted this pod during a
      # helm upgrade, leaving the yugaware release at pending-upgrade — a lock
      # every later `helm upgrade` refuses, which nothing clears on its own, so
      # the foundation retried forever. Provoked deliberately now, because the
      # fix is otherwise only unit-tested and an eviction will not oblige twice.
      #
      # Wedged by killing a real helm client mid-operation rather than by
      # editing helm's storage: it is the actual mechanism, and a hand-written
      # release record would prove only that we can parse what we wrote.
      - name: A wedged helm release is rolled back, not retried forever
        run: |
          REL="${NS}-yugaware"
          CHART=$(kubectl -n "$NS" get foundation foundation -o jsonpath='{.spec.yba.chart}')
          BEFORE=$(helm history "$REL" -n "$NS" -o json | python3 -c \
            'import json,sys; print(json.load(sys.stdin)[-1]["revision"])')
          echo "last revision before: $BEFORE"

          # --reuse-values so the attempt that gets killed cannot change what
          # the release holds; all it is here for is the pending record helm
          # writes before it starts work.
          helm upgrade "$REL" "$CHART" -n "$NS" --reuse-values --wait --timeout 15m &
          HPID=$!
          STUCK=""
          for _ in $(seq 1 40); do
            ST=$(helm history "$REL" -n "$NS" -o json 2>/dev/null | python3 -c \
              'import json,sys; print(json.load(sys.stdin)[-1]["status"])' 2>/dev/null || true)
            case "$ST" in pending-*) STUCK="$ST"; break ;; esac
            sleep 2
          done
          kill -9 "$HPID" 2>/dev/null || true
          wait "$HPID" 2>/dev/null || true
          [ -n "$STUCK" ] || {
            echo "::error::could not wedge the release; helm never reported a pending revision"
            helm history "$REL" -n "$NS" || true
            exit 1
          }
          echo "release is wedged at $STUCK"
          # Prove it really is a wedge: an upgrade now has to be refused, or
          # the recovery below would pass without anything to recover from.
          # Redirected, NOT piped into tee: `if cmd | tee` tests the exit status
          # of tee, which is always 0, so the refusal this is looking for read as
          # an acceptance and failed the step on its own evidence.
          if helm upgrade "$REL" "$CHART" -n "$NS" --reuse-values --timeout 30s \
               > /tmp/wedged.txt 2>&1; then
            cat /tmp/wedged.txt
            echo "::error::helm accepted an upgrade, so the release was not wedged"; exit 1
          fi
          cat /tmp/wedged.txt
          grep -q "in progress" /tmp/wedged.txt || {
            echo "::error::the refusal was not the lock we meant to create:"; cat /tmp/wedged.txt; exit 1; }

          # A generation bump is what makes the loop converge now rather than on
          # its own schedule. An unknown key under yba.values: helm passes it
          # through and the chart ignores it, so the universe is untouched.
          kubectl -n "$NS" patch foundation foundation --type=json -p '[
            {"op":"add","path":"/spec/yba/values/ciWedgeProbe","value":"1"}]'

          echo "== waiting for the loop to clear it and converge"
          for _ in $(seq 1 90); do
            PHASE=$(kubectl -n "$NS" get foundation foundation -o jsonpath='{.status.phase}' 2>/dev/null || true)
            LAST=$(helm history "$REL" -n "$NS" -o json 2>/dev/null | python3 -c \
              'import json,sys; print(json.load(sys.stdin)[-1]["status"])' 2>/dev/null || true)
            [ "$PHASE" = "Ready" ] && [ "$LAST" = "deployed" ] && break
            sleep 10
          done
          helm history "$REL" -n "$NS" || true
          [ "$PHASE" = "Ready" ] || {
            echo "::error::the foundation never recovered from the wedged release (phase=$PHASE)"
            kubectl -n "$NS" get foundation foundation -o yaml || true
            kubectl -n "$NS" logs deploy/fdn-meko-foundation --tail=200 || true
            exit 1
          }
          [ "$LAST" = "deployed" ] || {
            echo "::error::the release is still at '$LAST', not deployed"; exit 1; }

          # It has to have ROLLED BACK rather than uninstalled: an uninstall
          # takes the operator holding every CR's finalizer with it.
          kubectl -n "$NS" logs deploy/fdn-meko-foundation --tail=400 > /tmp/fdnlog.txt || true
          grep -q "rolling back to revision" /tmp/fdnlog.txt || {
            echo "::error::the release was cleared some other way than a rollback:"
            grep -iE "wedg|rollback|uninstall" /tmp/fdnlog.txt || true
            exit 1
          }
          echo "   recovered by rollback, and the universe is still here"
          # The probe key stays. Removing it would bump the generation again and
          # buy another full converge, on an object the next step deletes.

      # Teardown through the OBJECT, which is the only thing that exercises the
      # finalizer. The example ships deletionPolicy Retain, which is the right
      # default for a customer — deleting it there leaves the universe running —
      # so this flips it first. That the flip takes effect at all is the
      # finalizer tracking the policy rather than being set once.
      - name: Delete the Foundation (tears the universe down)
        run: |
          kubectl -n "$NS" patch foundation foundation --type=merge \
            -p '{"spec":{"deletionPolicy":"Delete"}}'

          # WAIT for the finalizer before deleting. The loop adds it on its next
          # pass, up to one poll interval away, and an object deleted before it
          # lands simply goes — taking nothing down with it and leaving the
          # yugaware release and its cluster RBAC behind. That is not a
          # hypothetical: it is what this step did on its first run, and what
          # the leak assertion below caught.
          #
          # Waiting also ASSERTS the finalizer is added, which nothing else does.
          for i in $(seq 1 60); do
            FIN=$(kubectl -n "$NS" get foundation foundation \
              -o jsonpath='{.metadata.finalizers}' 2>/dev/null || true)
            case "$FIN" in *meko.yugabyte.com/teardown*) break ;; esac
            [ "$i" -lt 60 ] || {
              echo "::error::the loop never added its finalizer after the policy changed to Delete"
              kubectl -n "$NS" get foundation foundation -o yaml || true
              kubectl -n "$NS" logs deploy/fdn-meko-foundation --tail=100 || true
              exit 1
            }
            sleep 5
          done
          echo "finalizer present; deleting"

          if ! kubectl -n "$NS" delete foundation foundation --timeout=25m; then
            echo "::error::the Foundation did not go; its finalizer is still held"
            kubectl -n "$NS" get foundation foundation -o yaml || true
            kubectl -n "$NS" logs deploy/fdn-meko-foundation --tail=200 || true
            exit 1
          fi
          helm uninstall fdn -n "$NS" || true

      - name: Assert nothing leaked
        run: |
          LEAKED=$(kubectl get clusterrole,clusterrolebinding -o name \
            | grep -- "${NS}-yugaware" || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::foundation down left cluster-scoped objects behind:"; echo "$LEAKED"
            exit 1
          fi
          echo "no cluster-scoped RBAC left behind"

          # Both CRs carry the operator's finalizer, and only the operator can
          # clear it. One left behind after `down` means the namespace can never
          # finish Terminating — unrecoverable, and NS is per-PR, so the next
          # push would land on it.
          # Every kind the operator has, not just the two this deployer used
          # to be able to declare: a spec can now name any of them, so a
          # leaked StorageConfig or KMSConfig strands the namespace exactly
          # like a leaked universe would, and naming two kinds here made that
          # invisible.
          KINDS=$(kubectl api-resources --api-group=operator.yugabyte.io \
            --namespaced=true -o name 2>/dev/null | paste -sd, -)
          [ -n "$KINDS" ] || { echo "::error::could not list operator.yugabyte.io kinds"; exit 1; }
          LEFT=$(kubectl -n "$NS" get "$KINDS" -o name 2>/dev/null || true)
          if [ -n "$LEFT" ]; then
            echo "::error::foundation down left CRs behind; their finalizers will strand $NS:"
            echo "$LEFT"
            exit 1
          fi

          # The tserver Service carries helm.sh/resource-policy: keep, so
          # `helm uninstall` will not remove it — its lifecycle is the
          # UNIVERSE's, and YBA is expected to delete it when the universe goes.
          # foundation down deliberately does not touch it (deleting it could
          # race YBA, and a Namespaced service is shared across releases by
          # design). This is the check that YBA actually does reclaim it; if it
          # does not, the Service has to be deleted explicitly instead.
          if [ -n "$(kubectl -n "${UNIVERSE_NS:-$NS}" get svc -l serviceName=yb-tserver-conn,scope=Namespaced \
                       -o name 2>/dev/null)" ]; then
            echo "::error::YBA did not reclaim the tserver-conn Service on universe delete;"
            echo "::error::foundation down must delete it explicitly (see down.go)"
            exit 1
          fi
          echo "the tserver-RPC Service was reclaimed with the universe"

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all || true
          # status.actions[] on either CR is where YBA puts the failing task and
          # its message; a rejected spec explains itself there and nowhere else.
          kubectl -n "$NS" get ybprovider,ybuniverse,ybcertificate -o yaml || true
          # cert-manager's side of an encrypted universe: the Certificate YBA
          # asked for, the request it turned into, and the issuer's own log.
          kubectl -n "$UNIVERSE_NS" get certificate,certificaterequest -o wide || true
          kubectl -n cert-manager logs deploy/cert-manager --tail=100 || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -60 || true
          kubectl -n "$NS" logs deploy/amp-controller --tail=200 || true
          kubectl -n "$NS" logs deploy/amp-reconcile-agent --tail=200 || true
          kubectl -n "$NS" logs deploy/meko-api-server --tail=200 || true
          # The operator's own log is where a rejected CR spec explains itself —
          # including "Customer list does not have exactly one customer", which
          # appears NOWHERE else because the reconciler throws before it can
          # write a CR status.
          #
          # `release=`, not app.kubernetes.io/*: the yugaware chart sets only the
          # old Helm labels, and a selector that matches nothing makes
          # `kubectl logs -l` exit 0 with no output — so this step looked fine
          # while dumping nothing at all.
          kubectl -n "$NS" logs "statefulset/${NS}-yugaware-yugaware" \
            --tail=300 --all-containers --prefix || \
            kubectl -n "$NS" logs -l "release=${NS}-yugaware" --tail=300 --all-containers || true

      # Belt and braces over the explicit `down` above: a run cancelled or failed
      # earlier never reaches it, and the reaper only collects namespaces.
      #
      # The YBUniverse CR goes FIRST, and the order is load-bearing rather than
      # tidy. The CR carries the operator's finalizer, and only the operator can
      # clear it — so uninstalling yugaware first and then deleting the namespace
      # strands a finalizer with nothing left to satisfy it, and the namespace
      # hangs in Terminating forever. Nothing recovers that: the reaper's
      # `kubectl delete ns` is a no-op on a Terminating namespace. Since NS is
      # per-PR, the next push would land on a permanently-stuck namespace.
      #
      # --wait=false plus a bounded poll rather than a blocking delete, so a
      # genuinely wedged operator costs a couple of minutes here instead of the
      # job timeout, and the sweep below still runs.
      - name: Teardown
        if: always()
        run: |
          # Every operator kind, not just the two a spec used to be able to
          # declare: a leaked StorageConfig or KMSConfig strands the namespace
          # exactly like a leaked universe would, and it is this step — not
          # `foundation down`, which a failed run never reaches — that is the
          # belt-and-braces path before the helm uninstall and the namespace
          # delete below.
          #
          # Ordered so the universe goes first and the provider last, the same
          # reason `down` has: the operator deletes the DB before its RBAC
          # disappears, and the provider can only go once the universe
          # referencing it has. Everything else is a registration in between.
          KINDS=$(kubectl api-resources --api-group=operator.yugabyte.io \
            --namespaced=true -o name 2>/dev/null | grep -vxE 'ybuniverses|ybproviders' | tr '\n' ' ')
          #
          # Six minutes, not two: deleting a Ready universe is a YBA task, and
          # a budget shorter than the task guarantees the warning below on
          # every failed run rather than only on a genuinely stuck one.
          for KIND in ybuniverses $KINDS ybproviders; do
            kubectl -n "$NS" delete "$KIND" --all --wait=false --ignore-not-found || true
            for _ in $(seq 1 72); do
              kubectl -n "$NS" get "$KIND" -o name 2>/dev/null | grep -q . || break
              sleep 5
            done
            # Last resort, and deliberately destructive. Only the operator can
            # clear its finalizer, so anything still holding one here will hold
            # it forever — the namespace never finishes Terminating, and NS is
            # derived from the PR number, so EVERY later run on this PR dies on
            # a namespace it cannot create into. Orphaning whatever the
            # finalizer was tearing down is the lesser harm: the namespace is
            # going away regardless, and this runs only on the way out.
            if kubectl -n "$NS" get "$KIND" -o name 2>/dev/null | grep -q .; then
              echo "::warning::$KIND still present after 6m; removing its finalizer so the namespace can drain"
              for OBJ in $(kubectl -n "$NS" get "$KIND" -o name); do
                kubectl -n "$NS" patch "$OBJ" --type merge \
                  -p '{"metadata":{"finalizers":null}}' || true
              done
            fi
          done

          helm -n "$NS" uninstall yb-amp-controller || true
          helm -n "$NS" uninstall "${NS}-yugaware" || true
          # By name only. The chart renders its ClusterRole with NO labels at
          # all, so no label selector can reach it — an earlier
          # app.kubernetes.io/instance selector here was a silent no-op.
          kubectl delete clusterrole "${NS}-yugaware" --ignore-not-found || true
          kubectl delete clusterrolebinding "${NS}-yugaware" --ignore-not-found || true
          kubectl delete ns "$NS" --wait=false || true
