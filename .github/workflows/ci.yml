name: CI

# One job per component, each run only when a PR changes it (scripts/ci-scope.sh decides), and
# a gate over them all. No paths filter: a run that never starts leaves the required gate pending.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which components this change touches. A push to main checks everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agentk: ${{ steps.scope.outputs.agentk }}
      backend: ${{ steps.scope.outputs.backend }}
      presenter: ${{ steps.scope.outputs.presenter }}
    steps:
      # A PR runs on GitHub's merge commit, whose first parent is the base branch: two commits
      # are enough to diff it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # Through files, not pipes: run steps have no pipefail, and a failed diff piped in would read
      # as no changes, skip every component and pass the gate.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            sh scripts/ci-scope.sh < "$RUNNER_TEMP/changed" > "$RUNNER_TEMP/scope"
          else
            sh scripts/ci-scope.sh --all > "$RUNNER_TEMP/scope"
          fi
          cat "$RUNNER_TEMP/scope" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/scope"

  # AgentK (extensions/agentk).
  agentk:
    name: AgentK (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.agentk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # AgentK lives in extensions/agentk; its package.json and scripts are there.
    defaults:
      run:
        working-directory: extensions/agentk
    steps:
      - uses: actions/checkout@v7

      # AgentK needs no tmux. Linux gets it only for the tests of moving older installs off
      # it (extensions/agentk/test/integration/move-off-tmux.test.ts, skipped without tmux); drop
      # it with them.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux git build-essential python3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/agentk/package-lock.json

      - name: Configure git for tests
        run: |
          git config --global user.name "agent-k-local CI"
          git config --global user.email "ci@agent-k-local.invalid"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # By default Vitest runs one test file fewer than there are CPUs at once. ubuntu-latest has 2 CPUs
      # for this repo, so that was one file at a time (677 s); the tests mostly wait on the fake Claude,
      # and 4 at once fit on 2 CPUs (233 s; 8 was slower). macos-15 already ran about 4 at once. On
      # both, the run now ends with test/integration/lifecycle.test.ts, the longest file.
      - run: npm test -- --maxWorkers=4
        env:
          TERM: xterm-256color

  # Meko's Go backend (backend/). cgo builds natively on each platform, so both run here.
  backend:
    name: Backend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # go.mod is always there; go.sum only once there are dependencies.
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum

      # The memory engine (backend/memory_engine) is TypeScript on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/memory_engine/package-lock.json

      # The Go end-to-end tests use the real embedding model (about 23 MB, from Hugging Face): keep it.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: backend/memory_engine/.models
          key: models-all-MiniLM-L6-v2-751bff3-q8-ms-marco-MiniLM-L-6-v2-a091443-q8

      - run: make build memory_engine
      - run: ./bin/meko version

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend

      - run: go vet -tags sqlite_fts5,sqlite_vec ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: npm run typecheck
        working-directory: backend/memory_engine
      - run: make test

  # Presenter (extensions/presenter).
  presenter:
    name: Presenter (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.presenter == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/presenter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/presenter/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Merging into main requires this check and `PR title` by name: renaming it means updating the
  # branch rules. It passes when every job in needs passed or was skipped, so a new component's
  # job goes into needs (extensions/agentk/test/unit/ci-scope.test.ts checks).
  gate:
    name: CI gate
    if: always()
    needs: [changes, agentk, backend, presenter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *' failure '* | *' cancelled '*) exit 1 ;;
          esac
