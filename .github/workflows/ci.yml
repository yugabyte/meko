name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux git build-essential python3

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure git for tests
        run: |
          git config --global user.name "agent-k-local CI"
          git config --global user.email "ci@agent-k-local.invalid"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TERM: xterm-256color
