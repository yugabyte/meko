name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: a retitled PR reruns the title check.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # A push or a new base branch supersedes the last run, so it cancels it. Any other edit runs
  # only the title check, on the same commit: each such run gets a group of its own, so it
  # neither cancels the tests nor gets cancelled by the next edit (a cancelled check on the
  # head commit would read as failing CI).
  group: ci-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edited-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # PRs are squash-merged with the PR title as the commit subject, which the release workflow
  # reads. The `base` ruleset requires this check by name, so keep the name in step with it.
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-title.sh
          sparse-checkout-cone-mode: false
      # The title reaches the shell through the environment, never pasted into the script.
      # Dependabot's subjects run long, so its PRs skip the length limit.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            sh scripts/check-title.sh --no-length "$TITLE"
          else
            sh scripts/check-title.sh "$TITLE"
          fi

  test:
    # Editing a PR's title or description changes no code; a new base branch does.
    if: github.event.action != 'edited' || github.event.changes.base
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux git build-essential python3

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure git for tests
        run: |
          git config --global user.name "agent-k-local CI"
          git config --global user.email "ci@agent-k-local.invalid"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TERM: xterm-256color
