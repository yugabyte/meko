name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Merging into main requires both `test (...)` checks by name: renaming the job or a matrix
  # entry means updating the branch rules.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # AgentK Local needs no tmux. Linux gets it only for the tests of moving older installs off
      # it (test/integration/move-off-tmux.test.ts, skipped without tmux); drop it with them.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux git build-essential python3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure git for tests
        run: |
          git config --global user.name "agent-k-local CI"
          git config --global user.email "ci@agent-k-local.invalid"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # By default Vitest runs one test file fewer than there are CPUs, and ubuntu-latest has 2 CPUs
      # for this repo: one file at a time. The integration tests mostly wait on the fake Claude, so 4
      # at once fit on 2 CPUs (8 was slower).
      - run: npm test -- --maxWorkers=4
        env:
          TERM: xterm-256color
