name: CI

on:
  push:
    branches: [main, ak_hari90/why-are-tests-in-ci-so-slow]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Merging into main requires both `test (...)` checks by name: renaming the job or a matrix
  # entry means updating the branch rules.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        workers: [2, 4, 8]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # AgentK Local needs no tmux. Linux gets it only for the tests of moving older installs off
      # it (test/integration/move-off-tmux.test.ts, skipped without tmux); drop it with them.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux git build-essential python3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure git for tests
        run: |
          git config --global user.name "agent-k-local CI"
          git config --global user.email "ci@agent-k-local.invalid"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: nproc; node -p 'require("os").availableParallelism()'
      - run: npm test -- --maxWorkers=${{ matrix.workers }}
        env:
          TERM: xterm-256color
