# Release version bump — human-triggered, CI-performed, merged via PR. A
# maintainer runs this workflow ("release this code"); CI rolls the CalVer
# VERSION file on a release/<version> branch, opens a PR to main, and turns on
# auto-merge. When the PR merges, that commit is the release commit: the
# amp-build job (SCM polling on main) builds/pushes the images off it, and the
# Makefile stamps the short commit id, so the released image tag is
# <VERSION>-<short-commit> (e.g. 0.260722.0-1bc8b3d). The VERSION file holds only
# the base MAJOR.YYMMDD.PATCH — the commit id lives on the build, not the file.
#
#   date  (default) — roll YYMMDD to today, PATCH -> 0 (or +1 PATCH if VERSION
#                     is already dated today: 0.260722.0 -> 0.260722.1).
#   patch           — re-cut the current date (a hotfix on an existing release).
#   major           — bump the epoch; reserved for a deliberate reset.
#
# Not automatic on every merge: a version is minted only when someone decides to
# release, matching "we release when we have to" — most days none, some days
# more than one.
#
# Goes through a PR (not a direct push to main), so main's "require a pull
# request" rule is honoured — no branch-protection bypass or PAT needed. The PR
# auto-merges once its required checks pass; if the ruleset requires an approval,
# the PR waits for one. Needs "Allow auto-merge" enabled in repo settings and
# workflow permissions = read and write.
name: Release — bump VERSION

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Which part to bump'
        type: choice
        default: date
        options: [date, patch, major]

permissions:
  contents: write
  pull-requests: write

# One release bump at a time.
concurrency:
  group: release-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Bump VERSION, open PR, enable auto-merge
        env:
          PART: ${{ inputs.part }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD="$(scripts/version.sh)"
          scripts/version.sh bump "${PART}"
          NEW="$(scripts/version.sh)"
          if [ "${OLD}" = "${NEW}" ]; then
            echo "VERSION unchanged (${OLD}); nothing to release." >&2
            exit 1
          fi
          BRANCH="release/${NEW}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add VERSION deploy/helm/yb-amp-controller/Chart.yaml
          git commit -m "release: ${NEW} (${PART} bump, triggered by ${ACTOR})"
          git push origin "${BRANCH}"

          PR_URL="$(gh pr create --base main --head "${BRANCH}" \
            --title "release: ${NEW}" \
            --body "Automated release version bump: \`VERSION\` ${OLD} -> ${NEW} (${PART}, triggered by @${ACTOR}). On merge, amp-build builds and pushes ${NEW}-<short-commit>.")"
          echo "opened ${PR_URL}"

          # Auto-merge (squash) once required checks pass. Do not fail the run if
          # auto-merge can't be enabled (e.g. the setting is off) — the PR stays
          # open for a manual merge.
          gh pr merge "${PR_URL}" --auto --squash --delete-branch \
            || echo "could not enable auto-merge; merge ${PR_URL} manually"

          {
            echo "### Release ${NEW}"
            echo ""
            echo "- \`VERSION\`: ${OLD} -> ${NEW}"
            echo "- PR: ${PR_URL} (auto-merge enabled)"
            echo "- On merge, amp-build publishes ${NEW}-<short-commit>."
          } >> "${GITHUB_STEP_SUMMARY}"
