name: Amp control-plane GKE (itest-dev)

# Deploys the amp control plane to the GKE cluster itest-dev and runs the
# deployment smoke test against it (amp/deploy/smoke-test.sh) — the "k8s" half of the
# control-plane deploy integration, complementing the docker-driver e2e in
# test/e2e/control_plane.
#
# Flow:
#   images  — build + push the four images to Quay (quay.io/yugabyte/amp-*),
#             tagged custom-<short-sha>. The ~30-min endpoint image uses a
#             registry layer cache (:buildcache) so unchanged inputs finish in
#             minutes; controller/ui/mcp are cheap and built every run.
#   deploy  — authenticate to itest-dev with a static kubeconfig, mint the Quay
#             pull secret in a per-PR namespace, deploy via amp/deploy/up-gke.sh, run
#             the smoke test, then always tear the namespace down.
#
# Placement — this is expensive (a ~30-min cold endpoint build + a live GKE
# deploy), so it deliberately does NOT run on every PR. It fires only:
#   * nightly on main (schedule) — against the default-branch head. Same 07:17 UTC
#     slot as the slow integration suite (on-demand-checks.yml);
#   * on manual dispatch (workflow_dispatch);
#   * on a PR that opts in with a `/ci amp_deploy_gke` line in the PR description.
#     The rule is literally the same code on-demand-checks.yml runs —
#     .github/actions/ci-directives, see docs/ci-directives.md: the line deploys on
#     each new commit while it is present. Adding it to a PR already up needs a
#     commit to fire — an empty one is enough.
#   * `/ci amp_deploy_gke_extensions` — a superset of `amp_deploy_gke` (it implies
#     the deploy) that ALSO builds + pushes the externalized-extension images
#     (amp/deploy/extensions/build.sh --push --cache: the ABI-anchor PG18 base +
#     every manifest extension) to Quay, and runs the smoke test with
#     SMOKE_EXTENSIONS=1 so it exercises each extension's ImageVolume opt-in +
#     fork inheritance. The first run
#     pays a cold PG18 base build (~30 min) on top of amp_deploy_gke; --cache
#     (:buildcache) then restores it in minutes, so it is PR-directive-only:
#     nightly does NOT rebuild it.
#   * `/ci amp_deploy_gke_ycp` — another superset of `amp_deploy_gke` that ALSO
#     builds+pushes the YCP control-plane image (meko/api_server ->
#     quay.io/yugabyte/ycp-api-server) from PR source, stands up an ephemeral
#     control plane in the CI namespace (amp/deploy/ycp-up.sh: Postgres +
#     api_server --control-plane-mode), registers an amp environment, wires the
#     controller's controller.ycp.* Helm values + enrollment secret, and runs the
#     smoke test with YCP_ASSERT=1 so it also proves the created endpoint shows up
#     in GET /api/v1/environments. Directive/dispatch-only; NOT nightly.
# It touches the itest cluster and needs org secrets (KUBECONFIG_ITEST_DEV,
# QUAY_AMP_TOKEN), so fork PRs (which get no secrets) are always skipped.
# Stale ci-pr-* namespaces are swept by control-plane-gke-cleanup.yml.
#
# SECURITY: the PR body is untrusted. It is read only inside that action's
# github-script, which turns it into a boolean against the fixed suite allowlist
# passed in below, and is NEVER interpolated into a `run:` shell step.
on:
  schedule:
    # Nightly on main (scheduled runs fire only on the default branch). 07:17 UTC,
    # the same slot as the slow integration suite (on-demand-checks.yml).
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      push_extensions:
        description: 'Also build+push the extension images and run the extension smoke checks'
        type: boolean
        default: false
      push_ycp:
        description: 'Also build+push the YCP control-plane image and run the register + endpoint-inventory assertion'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    # No paths filter: the `/ci amp_deploy_gke` directive in the body (resolved by the
    # decide job) is the switch. `synchronize` re-runs a PR that already carries it.
    # `edited` is deliberately absent — see the note in on-demand-checks.yml: an
    # edit that adds nothing still emits skipped check runs that mask a live suite
    # of the same name. Add a directive late, then push an empty commit to fire it.
    types: [opened, reopened, synchronize]

# NB: there is deliberately NO workflow-level `concurrency` here — it lives on the
# heavy jobs below, matching on-demand-checks.yml. One workflow-level group cannot
# serve both `decide` and the deploy: cancelling is right for a superseded deploy,
# fatal for `decide`, which must always report. GitHub keeps only one *pending* run
# per group, so a second event cancels the first while it is still queued, and a run
# cancelled before it starts never creates its job check runs at all — the deploy
# then vanishes from the PR's checks list rather than reporting.

permissions:
  contents: read

env:
  QUAY_NS: quay.io/yugabyte    # repos: amp-{controller,endpoint,controller-ui,mcp}

jobs:
  decide:
    name: Amp GKE — decide whether to deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suites: ${{ steps.gate.outputs.decided }}
      ext: ${{ steps.gate_ext.outputs.decided }}
      ycp: ${{ steps.gate_ycp.outputs.decided }}
    steps:
      # Needed only to make the local composite action below available.
      - uses: actions/checkout@v7

      - id: gate
        uses: ./.github/actions/ci-directives
        with:
          suites: '["amp_deploy_gke"]'
          # A manual dispatch means "deploy now", so it skips the body entirely.
          unconditional-events: schedule workflow_dispatch

      # amp_deploy_gke_extensions is a superset of amp_deploy_gke (see the
      # images/deploy gates below, which OR it in) that also builds+pushes the
      # extension images. It is NOT unconditional on schedule — nightly must not eat
      # the ~30-min PG18 base build; only a PR `/ci amp_deploy_gke_extensions` line
      # (or the manual push_extensions dispatch input, OR'd in downstream) turns it on.
      - id: gate_ext
        uses: ./.github/actions/ci-directives
        with:
          suites: '["amp_deploy_gke_extensions"]'
          unconditional-events: ''

      # amp_deploy_gke_ycp is a superset of amp_deploy_gke (the images/deploy gates
      # OR it in) that also builds the YCP control-plane image and runs the register
      # + endpoint-inventory assertion. Directive/dispatch-only — NOT unconditional
      # on schedule, so nightly stays a plain deploy.
      - id: gate_ycp
        uses: ./.github/actions/ci-directives
        with:
          suites: '["amp_deploy_gke_ycp"]'
          unconditional-events: ''

  images:
    name: Amp GKE — build + push images (Quay)
    needs: decide
    # Nightly, manual, or a same-repo PR whose body carries `/ci amp_deploy_gke`.
    # The head-repo check excludes fork PRs (they get no secrets); non-PR events
    # (schedule / dispatch) pass it trivially.
    if: >-
      (fromJSON(needs.decide.outputs.suites).amp_deploy_gke ||
       fromJSON(needs.decide.outputs.ext).amp_deploy_gke_extensions ||
       fromJSON(needs.decide.outputs.ycp).amp_deploy_gke_ycp ||
       github.event.inputs.push_extensions == 'true' ||
       github.event.inputs.push_ycp == 'true') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Shared with the deploy job below, so a newer run supersedes an older run's
      # whole images->deploy pipeline. That also keeps two deploys off the shared
      # ci-pr-<n> namespace at once. No self-cancellation: within one run these two
      # are sequential, so only ever one of them is in flight.
      group: cp-gke-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      # compute/vendor/postgres-v18 is the private yugabyte/amp-postgres repo,
      # which the default GITHUB_TOKEN can't read — a plain `submodules: recursive`
      # checkout 404s ("repository not found"). Fetch it via the App token, same
      # as pr-build.yml / on-demand-checks.yml. Feeds the endpoint image build.
      - name: Fetch the PostgreSQL submodule
        uses: ./.github/actions/fetch-pg-submodule
        with:
          private-key: ${{ secrets.AGENTK_PRIVATE_KEY }}

      - uses: docker/setup-buildx-action@v4

      # Quay auth for `docker push`. QUAY_AMP_TOKEN is a "robot-user:token" pair; split
      # on the first colon and log in. The same secret builds the in-cluster pull
      # secret in the deploy job (its .dockerconfigjson auth is base64(QUAY_AMP_TOKEN)).
      # This login also authorizes pulling the PRIVATE quay.io/yugabyte/amp-build-tools
      # base that the endpoint/extension images build `FROM` (buildx reuses this auth).
      - name: Quay login
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
        run: echo "${QUAY_TOKEN#*:}" | docker login quay.io -u "${QUAY_TOKEN%%:*}" --password-stdin

      # The deploy tag is a custom-<short-sha> tag (the amp custom-build
      # convention). On pull_request, github.sha is the merge commit, so use the
      # PR head sha to match the code.
      - name: Deploy tag (custom-<short commit id>)
        id: tag
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "tag=custom-${SHA:0:12}" >> "$GITHUB_OUTPUT"

      # Endpoint image: the only expensive build (~30 min cold). A registry layer
      # cache (:buildcache, mode=max) makes unchanged inputs finish in minutes —
      # the final push is a re-tag of already-present layers. Only the commit-id
      # tag lands on the repo (plus the :buildcache helper tag).
      - name: Endpoint image
        run: |
          EP="$QUAY_NS/amp-endpoint"
          docker buildx build --push -f amp/deploy/endpoint/Dockerfile amp \
            -t "$EP:${{ steps.tag.outputs.tag }}" \
            --cache-from type=registry,ref="$EP:buildcache" \
            --cache-to   type=registry,ref="$EP:buildcache",mode=max

      # Controller image packages the Go controller bundle (Go-only, no Rust/PG
      # headers — the deployed controller runs storage_controller too, but the
      # bundle-only image is what up-gke.sh's chart expects with SC managed).
      - uses: actions/setup-go@v7
        with:
          go-version-file: amp/controller/go.mod
          cache-dependency-path: amp/controller/go.sum

      - name: Controller image
        run: |
          make -C amp controller-bundle-only
          docker buildx build --push -f amp/deploy/controller/Dockerfile amp \
            -t "$QUAY_NS/amp-controller:${{ steps.tag.outputs.tag }}"

      - name: UI image
        run: |
          docker buildx build --push \
            -t "$QUAY_NS/amp-controller-ui:${{ steps.tag.outputs.tag }}" amp/amp_ui

      - name: MCP image
        run: |
          docker buildx build --push -f amp/controller/mcp/Dockerfile \
            -t "$QUAY_NS/amp-mcp:${{ steps.tag.outputs.tag }}" amp/controller/mcp

      # YCP control-plane image (amp_deploy_gke_ycp only): meko/api_server, the
      # thing the amp controller registers against, built from THIS PR's source and
      # tagged with the same custom-<sha> as the amp images so the deploy job pulls a
      # matching pair. The Quay login above authorizes the push; the QUAY_AMP_TOKEN
      # robot needs push+pull on quay.io/yugabyte/ycp-api-server for this to land.
      - name: YCP api-server image
        if: fromJSON(needs.decide.outputs.ycp).amp_deploy_gke_ycp || github.event.inputs.push_ycp == 'true'
        run: |
          docker buildx build --push --platform linux/amd64 \
            -f meko/api_server/Dockerfile \
            -t "$QUAY_NS/ycp-api-server:${{ steps.tag.outputs.tag }}" \
            meko/api_server

      # Externalized-extension images (amp_deploy_gke_extensions only): builds the
      # ABI-anchor PG18 base locally (~30 min cold, to compile against) and pushes
      # ONLY each manifest extension to Quay under
      # quay.io/yugabyte/amp-ext-<name>:<version> (--no-base-push: nothing pulls
      # the base back, so it isn't published). Version-tagged (not the commit tag),
      # so they're stable and the deployed controller's catalog (ExtensionRegistry
      # default quay.io/yugabyte) resolves them as-is. --cache gives the base the
      # same kind of registry layer cache as the endpoint image above (a :buildcache
      # tag, not the base image), so unchanged inputs skip the ~30-min cold rebuild.
      # NB: export is best-effort — it only populates once QUAY_AMP_TOKEN has push
      # access to the amp-pg18-build repo (unlike amp-endpoint, that repo has never
      # been published, so grant it or the base rebuilds cold every run).
      - name: Extension images
        if: fromJSON(needs.decide.outputs.ext).amp_deploy_gke_extensions || github.event.inputs.push_extensions == 'true'
        run: |
          python3 -m pip install --user pyyaml
          amp/deploy/extensions/build.sh --push --no-base-push --cache --registry "$QUAY_NS"

  deploy:
    name: Amp GKE — deploy to itest-dev + smoke test
    needs: [decide, images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cp-gke-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      NS: ci-pr-${{ github.event.pull_request.number || github.run_id }}
      PULL_SECRET: quay-pull-secret
      TAG: ${{ needs.images.outputs.tag }}
      # '1' for the amp_deploy_gke_ycp superset (directive or manual push_ycp),
      # gating the control-plane bring-up, the controller's ycp.* Helm wiring, and
      # the smoke test's YCP_ASSERT block. '0' for a plain amp_deploy_gke.
      YCP: ${{ (fromJSON(needs.decide.outputs.ycp).amp_deploy_gke_ycp || github.event.inputs.push_ycp == 'true') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      # Static kubeconfig for itest-dev (a ServiceAccount-token kubeconfig, base64
      # in the secret) — no GCP auth / gke-gcloud-auth-plugin needed. See
      # amp/deploy/README.md "Running in CI (itest-dev)" for how to mint it.
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo '${{ secrets.KUBECONFIG_ITEST_DEV }}' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6

      # YCP smoke only: stand up an ephemeral control plane (Postgres + api_server
      # --control-plane-mode) in this namespace, register an amp environment, and
      # drop the enrollment token into the Secret the controller chart reads. Runs
      # BEFORE up-gke.sh so the controller enrolls on first boot. ycp-up.sh appends
      # YCP_URL / YCP_ENV_ID / YCP_ADMIN_KEY / YCP_ENROLL_SECRET to $GITHUB_ENV for
      # the up-gke.sh (Helm values) and smoke-test.sh (assertion) steps below.
      - name: YCP control plane + register (amp_deploy_gke_ycp)
        if: env.YCP == '1'
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
        run: |
          AUTH="$(printf '%s' "$QUAY_TOKEN" | base64 -w0)"
          export PULL_SECRET_DOCKERCONFIGJSON="{\"auths\":{\"quay.io\":{\"auth\":\"${AUTH}\"}}}"
          NS="$NS" \
          YCP_IMAGE="$QUAY_NS/ycp-api-server:$TAG" \
          PULL_SECRET="$PULL_SECRET" \
          YCP_ENV_NAME="gke-smoke" \
          amp/deploy/ycp-up.sh

      # up-gke.sh runs deploy-only (no BUILD=1, so it never calls gcloud
      # configure-docker): it creates the (fresh, per-run) namespace, mints the
      # Quay pull secret in it (PULL_SECRET + PULL_SECRET_DOCKERCONFIGJSON mode —
      # the namespace need not exist first), stands up a single-node YugabyteDB +
      # yb_storage, and helm-installs the controller/MCP/UI from the Quay images.
      # CLUSTER is empty → it uses the kubeconfig written above.
      #
      # The pull secret carries the same QUAY_AMP_TOKEN robot creds used to push: a
      # dockerconfigjson whose quay.io "auth" is base64("robot-user:token") —
      # which is exactly base64(QUAY_AMP_TOKEN), since it already is that pair.
      - name: Deploy (amp/deploy/up-gke.sh)
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_AMP_TOKEN }}
        run: |
          AUTH="$(printf '%s' "$QUAY_TOKEN" | base64 -w0)"
          export PULL_SECRET_DOCKERCONFIGJSON="{\"auths\":{\"quay.io\":{\"auth\":\"${AUTH}\"}}}"
          NS="$NS" \
          REGISTRY="$QUAY_NS" \
          CONTROLLER_IMAGE_REPO=amp-controller \
          ENDPOINT_IMAGE_REPO=amp-endpoint \
          UI_IMAGE_REPO=amp-controller-ui \
          MCP_IMAGE_REPO=amp-mcp \
          TAG="$TAG" \
          PULL_SECRET="$PULL_SECRET" \
          CONTROLLER_EXPOSE=none \
          ENDPOINT_SERVICE_TYPE=ClusterIP \
          YCP_ENABLED="$YCP" \
          amp/deploy/up-gke.sh

      # With amp_deploy_gke_extensions, the extension images were pushed above and
      # the controller's catalog resolves them — so exercise the ImageVolume
      # opt-in + fork inheritance (SMOKE_EXTENSIONS=1). Requires the cluster's
      # ImageVolume feature gate to be enabled on itest-dev.
      - name: Smoke test (amp/deploy/smoke-test.sh)
        env:
          SMOKE_EXTENSIONS: ${{ (fromJSON(needs.decide.outputs.ext).amp_deploy_gke_extensions || github.event.inputs.push_extensions == 'true') && '1' || '0' }}
        run: NS="$NS" SMOKE_EXTENSIONS="$SMOKE_EXTENSIONS" YCP_ASSERT="$YCP" amp/deploy/smoke-test.sh

      - name: Dump controller/endpoint state on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all || true
          # Events outlive the pods the smoke test deletes, so they are the only
          # record of a container that crash-looped earlier in the run.
          kubectl -n "$NS" get events --sort-by=.lastTimestamp || true
          for p in $(kubectl -n "$NS" get pods -o name | grep yb-ep- || true); do
            kubectl -n "$NS" describe "$p" || true
            kubectl -n "$NS" logs "$p" -c endpoint --tail=200 || true
            kubectl -n "$NS" logs "$p" -c endpoint --previous --tail=200 || true
          done
          kubectl -n "$NS" logs deploy/amp-controller --tail=200 || true
          # YCP smoke: the control plane and what it thinks the fleet looks like.
          if [ "${YCP:-0}" = 1 ]; then
            kubectl -n "$NS" logs deploy/meko-api-server --tail=200 || true
            kubectl -n "$NS" logs deploy/postgres --tail=50 || true
            ( kubectl -n "$NS" port-forward svc/meko-api-server 18099:80 >/tmp/cp-pf.log 2>&1 & \
              PF=$!; sleep 4; \
              curl -sf -H "X-Meko-Admin-Secret: ${YCP_ADMIN_KEY:-}" \
                http://127.0.0.1:18099/api/v1/environments | jq . || true; \
              kill "$PF" 2>/dev/null || true )
          fi

      - name: Teardown
        if: always()
        run: |
          helm -n "$NS" uninstall yb-amp-controller || true
          kubectl delete ns "$NS" --wait=false || true
