name: Presenter release

# Presenter (src/extensions/present) releases on its own train, beside AgentK's and Meko's.
# Versions are 0.<UTC date YYYYMMDD>.<n>, tagged present-v<version>. A push to main that changes
# src/extensions/present cuts a release when it contains present feat/fix/perf/deps commits
# (naming present, alone or in a list such as present,meko) since the last Presenter tag and the
# tests pass. The release scripts are the repo root's scripts/release/*.sh --product present.
# A release carries present-<version>-<os>-<arch>.tar.gz and SHA256SUMS, no installer: Meko
# installs and updates them itself (meko extension install present, meko extension update
# present). Run the workflow by hand to force a release, or to rebuild the assets of an existing
# present-v tag.
#
# Presenter has no native modules, so one Linux job builds it once and packages every platform,
# each with its own Node; a macOS runner smoke-tests the darwin tarball.

on:
  push:
    branches: [main]
    paths:
      - 'src/extensions/present/**'
      - 'scripts/release/**'
      - '.github/workflows/present-release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Release even if there are no present feat/fix/perf/deps commits
        type: boolean
        default: false
      tag:
        description: Rebuild assets for this existing present-v tag instead
        required: false

# Read-only by default: only publish gets to write releases and attestations.
permissions:
  contents: read

# One release at a time, so two pushes on the same day can't claim the same number. Its own group:
# it never waits for AgentK's or Meko's.
concurrency:
  group: present-release
  cancel-in-progress: false

env:
  # Bundled runtime. Bump deliberately; the SHASUMS256 check below pins the bytes.
  NODE_VERSION: 22.18.0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.p.outputs.release }}
      rebuild: ${{ steps.p.outputs.rebuild }}
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: p
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eu
          if [ -n "${DISPATCH_TAG:-}" ]; then
            # Only Presenter's own tags: another product's would get Presenter's tarballs and checksums.
            case $DISPATCH_TAG in
              present-v[0-9]*) ;;
              *) echo "$DISPATCH_TAG isn't a Presenter release tag (present-v<version>)"; exit 1 ;;
            esac
            git rev-parse -q --verify "refs/tags/$DISPATCH_TAG" >/dev/null || { echo "no such tag: $DISPATCH_TAG"; exit 1; }
            # This workflow builds from src/extensions/present; older tags have Presenter in
            # extensions/present.
            git cat-file -e "$DISPATCH_TAG:src/extensions/present/package.json" 2>/dev/null ||
              { echo "$DISPATCH_TAG is from before Presenter moved to src/extensions/present and can't be rebuilt"; exit 1; }
            version=${DISPATCH_TAG#present-v}
            { echo "release=true"; echo "rebuild=true"; echo "tag=$DISPATCH_TAG"; echo "version=$version"; echo "ref=$DISPATCH_TAG"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if sh scripts/release/release-notes.sh --product present > /dev/null || [ "${FORCE:-false}" = "true" ]; then
            version=$(sh scripts/release/next-version.sh --product present)
            echo "Releasing $version"
            { echo "release=true"; echo "rebuild=false"; echo "tag=present-v$version"; echo "version=$version"; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release: no present feat/fix/perf/deps commits since the last release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.rebuild == 'false'
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the release concurrency group for GitHub's 6h default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/extensions/present
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/extensions/present/package-lock.json
      - run: npm ci
        timeout-minutes: 10
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: [plan, test]
    if: always() && needs.plan.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/extensions/present
    # Plan outputs reach the shell through the environment, never pasted into scripts.
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # The workflow's own commit first, for scripts/release/fetch-node.sh: a tag being rebuilt can
      # be older than the script. A rebuild then checks out its tag for the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Node ${{ env.NODE_VERSION }} for each platform
        timeout-minutes: 15
        run: sh ../../../scripts/release/fetch-node.sh "$NODE_VERSION" "$RUNNER_TEMP" linux-x64 linux-arm64 darwin-arm64

      - uses: actions/checkout@v7
        if: needs.plan.outputs.rebuild == 'true'
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/extensions/present/package-lock.json

      - run: npm ci
        timeout-minutes: 10

      - name: Stamp version
        run: npm pkg set version="$VERSION"

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: |
          set -eu
          for dist in linux-x64 linux-arm64 darwin-arm64; do
            sh scripts/package-release.sh "$VERSION" "${dist%-*}" "${dist#*-}" "$RUNNER_TEMP/node-v${NODE_VERSION}-${dist}" out
          done

      - name: Smoke-test the linux-x64 tarball
        run: sh scripts/smoke-release.sh out/present-"$VERSION"-linux-x64.tar.gz "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: present-tarballs
          path: src/extensions/present/out/*.tar.gz
          if-no-files-found: error

  smoke-macos:
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/extensions/present
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: present-tarballs
          path: src/extensions/present/out

      - name: Smoke-test the darwin-arm64 tarball
        run: sh scripts/smoke-release.sh out/present-"$VERSION"-darwin-arm64.tar.gz "$VERSION"

  publish:
    needs: [plan, build, smoke-macos]
    # Any failure stops the release, so SHA256SUMS never loses a tarball.
    if: always() && needs.build.result == 'success' && needs.smoke-macos.result == 'success'
    # The release environment holds the signing key, and only main can use it.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and release, upload assets, prune old releases
      id-token: write # attest build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes with git

      - uses: actions/download-artifact@v8
        with:
          name: present-tarballs
          path: dist-release

      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        # Meko installs a release only when a line of SHA256SUMS.sig verifies with one of its keys
        # (src/meko/internal/update/keys). The key is a secret of the release environment, which only
        # main can use; RELEASE_SIGNING_KEY_OLD is set only while a new key replaces it.
        working-directory: dist-release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY_OLD: ${{ secrets.RELEASE_SIGNING_KEY_OLD }}
        run: |
          set -eu
          umask 077
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "RELEASE_SIGNING_KEY is empty: only a run from main gets the release environment's key" >&2; exit 1; }
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          : > SHA256SUMS.sig
          for k in "$RELEASE_SIGNING_KEY" "${RELEASE_SIGNING_KEY_OLD:-}"; do
            [ -n "$k" ] || continue
            printf '%s\n' "$k" > "$tmp/key.pem"
            # The key id: the first 8 bytes of the sha256 of the raw public key (its DER's last 32 bytes).
            openssl pkey -in "$tmp/key.pem" -pubout -outform DER -out "$tmp/pub.der"
            id=$(tail -c 32 "$tmp/pub.der" | openssl dgst -sha256 -r | cut -c1-16)
            openssl pkeyutl -sign -inkey "$tmp/key.pem" -rawin -in SHA256SUMS -out "$tmp/sig.bin"
            printf '%s %s\n' "$id" "$(openssl base64 -A -in "$tmp/sig.bin")" >> SHA256SUMS.sig
          done
          cat SHA256SUMS.sig

      - name: Check the signature against Meko's keys
        # A secret that isn't the key Meko has would publish a release every Meko refuses. The first
        # line is RELEASE_SIGNING_KEY's. The keys come from this workflow's commit on main, not the
        # checkout: a rebuild checks out an older tag, which may lack a newer key.
        run: |
          set -eu
          keys=src/meko/internal/update/keys
          sigs=dist-release/SHA256SUMS.sig
          id=$(head -n 1 "$sigs" | cut -d ' ' -f 1)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          head -n 1 "$sigs" | cut -d ' ' -f 2 | openssl base64 -d -A -out "$tmp/sig.bin"
          for f in $(git ls-tree --name-only "$GITHUB_SHA" "$keys/"); do
            case $f in *.pub) ;; *) continue ;; esac
            git show "$GITHUB_SHA:$f" > "$tmp/key.pub"
            kid=$(openssl pkey -pubin -in "$tmp/key.pub" -outform DER | tail -c 32 | openssl dgst -sha256 -r | cut -c1-16)
            [ "$kid" = "$id" ] || continue
            openssl pkeyutl -verify -pubin -inkey "$tmp/key.pub" -rawin -in dist-release/SHA256SUMS -sigfile "$tmp/sig.bin" >/dev/null && exit 0
            echo "SHA256SUMS.sig doesn't verify with $f" >&2
            exit 1
          done
          echo "RELEASE_SIGNING_KEY (key id $id) isn't one of Meko's keys in $keys: every Meko would refuse this release" >&2
          exit 1

      - name: Create the release
        if: needs.plan.outputs.rebuild == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.ref }}
        run: |
          set -eu
          sh scripts/release/release-notes.sh --product present > notes.md || echo "Maintenance release." > notes.md
          # Not "latest": the repo's latest release is Meko's (meko-release.yml), whose installer is
          # the one-line install. Meko finds Presenter's newest release by its tag.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md --latest=false --repo "$GITHUB_REPOSITORY" \
            dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/SHA256SUMS.sig

      - name: Replace assets on an existing release
        if: needs.plan.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/SHA256SUMS.sig --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attest build provenance
        # Artifact attestations need GitHub Enterprise Cloud for internal repos.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/*.tar.gz

      - name: Delete Presenter releases beyond the newest 5
        if: needs.plan.outputs.rebuild == 'false'
        # A failed prune never fails the release; the next one tries again.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 5
        run: sh scripts/release/prune-releases.sh --product present
