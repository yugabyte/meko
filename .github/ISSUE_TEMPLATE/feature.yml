# The issue skill (.claude/skills/issue/SKILL.md) writes agents' feature requests with these
# headings: change both together.
name: Feature request
description: Something Meko, AgentK or Present should do, or do differently.
type: Feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the [existing issues](https://github.com/yugabyte/meko/issues?q=is%3Aissue) first.
        This repo is public: leave out tokens, API keys, internal hostnames, private paths and personal data (names, emails, user names, customer names, your prompts or memories).
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Meko
        - AgentK
        - Present
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. Commands, screens or settings help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including workarounds you use now.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we'll know it's done, as outcomes someone can check.
      placeholder: |
        -
