openapi: 3.0.3

info:
  title: amp controller API
  version: 0.1.0
  description: |
    Control-plane REST API for the **amp controller** (amp-controller): the
    control plane for a single placement group. See `controller/architecture/`.

    The resource ladder is **storage pool → project → branch → endpoint**. Users
    are a basic, *unauthenticated* notion of an identity; there is no auth yet
    (the user/grant model is designed but authentication is deferred).

    - **Users** — created and fetched by id, and listed. A user owns the storage
      pools it creates.
    - **Storage pools** — *top-level* resources (not nested under a user): any
      user can create a pool (passing its `owner_user_id`) and becomes its owner.
      Pool sharing (pool grants) is out of scope here, but a pool is addressed by
      its own id because multiple users will eventually act on it. Listing
      returns every pool.
    - **Projects** — a project (a "database") in a pool. Create and delete are
      **asynchronous** (`202` + a `Task` + a `Location: /api/v1/tasks/{id}`
      header): the worker creates the project **and its default branch** (and the
      controller's pending-init recipe), or cascades the delete to the
      project's branches and endpoints. The default branch id is the storage-layer
      branch id verbatim (the storage layer is flat — a project maps to no storage
      object). Poll the task, then read the project to see its `default_branch`.
    - **Branches** — create / list / get / delete a branch in a project. Create
      and delete are **asynchronous** (`202` + a `Task` + a `Location` header).
      *Create* forks an existing branch (the parent, defaulting to the project's
      default branch) into a new branch, recording its fork ancestry
      (`parent_branch_id`, `fork_lsn`) and inheriting the parent's Postgres
      version. Branches can fork off the default branch or off another branch.
      *Delete* cascades to the branch's endpoints.
    - **Endpoints** — the compute bound to a branch; listed under the branch.
      Create and delete are **asynchronous** (`202` + a `Task` + a `Location`
      header): the worker deploys (resp. retires) one container/pod per endpoint.
    - **Tasks** — the write-ahead log of long-running operations. Every mutation
      above returns a `Task`; poll `getTask` (or `listTasks`) until it reaches a
      terminal status (`succeeded` / `failed`).

    **Pagination.** List endpoints take `limit` and `offset` query parameters
    (values outside the documented range are clamped) and return a `total` (the
    count of *all* matching items, ignoring `limit`/`offset`) alongside a `count`
    (the number of items in *this* response).

    Every non-2xx response uses the same `Error` envelope. `500` is possible on
    any operation; it is documented per operation so generated clients get a
    typed handle.

    The spec is the source of truth: server stubs and the Go client are
    generated from this file (`oapi-codegen`), and the controller serves both
    this document (`GET /api/v1/openapi.yaml`) and an interactive explorer
    (`GET /api/v1/docs`).

servers:
  - url: /api/v1
    description: Versioned API root (the controller serves the API under /api/v1).

tags:
  - name: users
    description: A basic, unauthenticated notion of a user.
  - name: storage-pools
    description: Storage pools (≈ a Meko datapack); top-level, created and owned by a user.
  - name: projects
    description: Projects (databases) in a pool. Create and delete are async (202 + Task); create records the project and its default branch, delete cascades to its branches and endpoints.
  - name: branches
    description: Branches (PG cluster timelines) in a project. Create and delete are async (202 + Task); create forks an existing branch, delete cascades to the branch's endpoints.
  - name: endpoints
    description: Compute endpoints bound to a branch; create/delete are asynchronous tasks (202 + Task + Location) — one container/pod per endpoint.
  - name: tasks
    description: Status of long-running operations (the write-ahead task log).

paths:
  /version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: Controller build version
      description: Returns the controller's semantic version, git commit, and build date (stamped at build time).
      responses:
        '200':
          description: Build version info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: Creates a user and returns it. No authentication; the new id is how a caller addresses resources as this user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools:
    post:
      tags: [storage-pools]
      operationId: createStoragePool
      summary: Create a storage pool
      description: Creates a storage pool owned by the user named in `owner_user_id`. Pool names are unique across the placement group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoragePoolRequest'
      responses:
        '201':
          description: Storage pool created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [storage-pools]
      operationId: listStoragePools
      summary: List storage pools
      description: Lists every storage pool in the placement group. Owner filtering is out of scope for now (pool sharing is deferred).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of storage pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePoolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
    get:
      tags: [storage-pools]
      operationId: getStoragePool
      summary: Get a storage pool
      responses:
        '200':
          description: The storage pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/projects:
    parameters:
      - $ref: '#/components/parameters/PoolId'
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (and its default branch) in a pool
      description: |
        Plans an asynchronous task that creates a project (a "database") in the
        pool together with its default branch (a PG cluster) and the storage
        controller's pending-init recipe, and returns `202` + the `Task` with a
        `Location` header pointing at it. The default branch id is the storage-layer
        branch id verbatim (the storage layer is flat — a project maps to no storage
        object). Poll the task, then read the project to see its `default_branch`.
        Cheap validation is synchronous (`400` bad body / unsupported `pg_version`,
        `404` unknown pool); a duplicate project name surfaces as a `failed` task,
        not a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [projects]
      operationId: listProjects
      summary: List the projects in a pool
      description: >-
        Lists the projects in the pool, each with its default branch. By default
        the list is scoped to usable clusters; pass `include_failed=true` (e.g.
        from an operator's fleet view) to also surface projects whose creation
        failed, so they can be seen and deleted. Returns 404 if the pool does not
        exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/IncludeFailed'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project
      description: Returns the project (with its default branch). Returns 404 if the pool or project does not exist.
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Plans an asynchronous `delete_project` cascade task that retires the
        project's endpoints, drops its branches, then drops the project row, and
        returns `202` + the `Task` with a `Location` header. A cheap synchronous
        pre-check returns `404` if the pool or project does not exist.
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/projects/{projectId}/branches:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [branches]
      operationId: createBranch
      summary: Branch (fork) a branch into a new branch
      description: |
        Plans an asynchronous task that forks a branch (the parent) in the project
        into a new branch, and returns `202` + the `Task` with a `Location` header.
        The parent defaults to the project's default branch; pass
        `parent_branch_id` to fork off another branch (branch-of-branch). The new
        branch records its fork ancestry (`parent_branch_id`, `fork_lsn`) and
        inherits the parent's Postgres version. The fork point defaults to the
        parent's latest LSN; pass `fork_point_lsn` to branch at an earlier point.
        Like create-project, the branch is recorded as a recipe and materialized
        lazily by the first endpoint deployed on it — no compute is started here.
        Cheap validation is synchronous (`400` bad body / bad or unresolvable
        `fork_point_lsn`, `404` unknown pool / project / parent); a duplicate branch
        name surfaces as a `failed` task, not a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [branches]
      operationId: listBranches
      summary: List the branches in a project
      description: Lists the branches in the project (the default branch plus its forks). Returns 404 if the pool or project does not exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/projects/{projectId}/branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BranchId'
    get:
      tags: [branches]
      operationId: getBranch
      summary: Get a branch
      description: Returns the branch. Returns 404 if the pool, project, or branch does not exist.
      responses:
        '200':
          description: The branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [branches]
      operationId: deleteBranch
      summary: Delete a branch
      description: |
        Plans an asynchronous `delete_branch` cascade task that retires the
        branch's endpoints, then drops the branch row, and returns `202` + the
        `Task` with a `Location` header. Cheap synchronous pre-checks return `404`
        if the pool / project / branch does not exist, or `409` if the branch has
        child branches (the parent FK is `RESTRICT`, so the delete would be doomed).
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/projects/{projectId}/branches/{branchId}/endpoints:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BranchId'
    post:
      tags: [endpoints]
      operationId: createEndpoint
      summary: Create and deploy an endpoint on a branch
      description: |
        Plans an asynchronous task that records an endpoint on the addressed
        branch, deploys it (one container/pod per endpoint), and records its
        `address`; returns `202` + the `Task` with a `Location` header. Poll the
        task, then read the endpoint to see its id + `address`. A branch admits at
        most one `read_write` endpoint (the single-writer rule); a second one
        surfaces as a `failed` task, not a `409`. Requires the endpoint deployer
        (`--deploy`); returns `501` otherwise. `404` if the pool / project / branch
        does not exist.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [endpoints]
      operationId: listEndpoints
      summary: List the endpoints bound to a branch
      description: Lists the compute endpoints bound to the branch. Returns 404 if the pool, project, or branch does not exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /storage-pools/{poolId}/projects/{projectId}/branches/{branchId}/endpoints/{endpointId}:
    parameters:
      - $ref: '#/components/parameters/PoolId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/EndpointId'
    get:
      tags: [endpoints]
      operationId: getEndpoint
      summary: Get an endpoint
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [endpoints]
      operationId: deleteEndpoint
      summary: Retire an endpoint
      description: |
        Plans an asynchronous `delete_endpoint` task that removes the endpoint's
        running instance and then deletes the endpoint record, and returns `202` +
        the `Task` with a `Location` header. Requires the endpoint deployer
        (`--deploy`); returns `501` otherwise. `404` if the pool / project / branch
        / endpoint does not exist.
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks
      description: Lists write-ahead tasks, most recent first, optionally filtered by status, kind, or project.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          required: false
          description: Only return tasks in this status.
          schema:
            type: string
            enum: [pending, running, succeeded, failed]
        - name: kind
          in: query
          required: false
          description: Only return tasks of this kind (e.g. create_project, delete_branch).
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          description: Only return tasks scoped to this project.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get the status of a task
      description: Returns the status of a write-ahead task so a caller can poll a long-running operation.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: The user's id.
      schema:
        type: string
        format: uuid
    PoolId:
      name: poolId
      in: path
      required: true
      description: The storage pool's id.
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: The project's id (a control-plane id; maps to no storage object).
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: path
      required: true
      description: The branch's id (the storage-layer branch id verbatim).
      schema:
        type: string
        format: uuid
    EndpointId:
      name: endpointId
      in: path
      required: true
      description: The endpoint's id.
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      description: The task's id.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Clamped to 1..1000; defaults to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip from the start of the result set. Negative values are clamped to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    IncludeFailed:
      name: include_failed
      in: query
      required: false
      description: >-
        Whether to include projects whose creation failed (an orphan left behind
        when a `create_project` task failed mid-provisioning). Defaults to
        `false` — the list is scoped to usable clusters, which is what a picker,
        a count, or a client that operates on each result wants. Pass `true`
        (e.g. from an operator's fleet view) to also surface the failed orphans so
        they can be seen and deleted. Affects both the returned page and its total
        count, so pagination stays consistent.
      schema:
        type: boolean
        default: false

  responses:
    Accepted:
      description: The request was accepted; a task was planned to perform the work.
      headers:
        Location:
          description: The URL of the planned task (poll it for status).
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Task'
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with existing state (e.g. a duplicate name).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: An unexpected error occurred serving the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Version:
      type: object
      required: [version, git_commit, build_date]
      properties:
        version:
          type: string
          description: 'Hybrid CalVer version from the repo-root VERSION file (MAJOR.YYMMDD.PATCH, e.g. "0.260714.0"); "dev" for an un-stamped build.'
        git_commit:
          type: string
          description: Short git commit the binary was built from.
        build_date:
          type: string
          description: UTC RFC-3339 build timestamp.
    User:
      type: object
      required: [id, is_admin, created_at]
      properties:
        id:
          type: string
          format: uuid
        is_admin:
          type: boolean
          description: Admins skip all pool/project grants. Until auth lands, anyone may create an admin.
        created_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Optional explicit id — e.g. an external identity subject (the Meko
            user id) so AMP and the caller share one identity. Omit to
            auto-generate. Idempotent: re-creating an existing id is a no-op.
        is_admin:
          type: boolean
          default: false
          description: Create the user as an admin.

    UserList:
      type: object
      required: [users, total, count]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    StoragePool:
      type: object
      required: [id, name, owner_user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    StoragePoolList:
      type: object
      required: [storage_pools, total, count]
      properties:
        storage_pools:
          type: array
          items:
            $ref: '#/components/schemas/StoragePool'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateStoragePoolRequest:
      type: object
      required: [name, owner_user_id]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Optional explicit id — e.g. a Meko datapack UUID, so the pool and
            the datapack share one id (no separate mapping). Omit to
            auto-generate. Idempotent: re-creating an existing id returns it.
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: Pool name; unique across the placement group.
        owner_user_id:
          type: string
          format: uuid
          description: The user that will own the pool.

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Project (database) name; unique within the pool. The project's default branch is always named "main".
        pg_version:
          type: integer
          description: Postgres major version for the project's default branch. Defaults to 18.

    Project:
      type: object
      required: [id, storage_pool_id, name, created_at, default_branch]
      properties:
        id:
          type: string
          format: uuid
          description: The project id (a control-plane id; maps to no storage object).
        storage_pool_id:
          type: string
          format: uuid
          description: The storage pool this project belongs to.
        name:
          type: string
        created_at:
          type: string
          format: date-time
        default_branch:
          $ref: '#/components/schemas/Branch'

    ProjectList:
      type: object
      required: [projects, total, count]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    Branch:
      type: object
      required: [project_id, branch_id, name, pg_version, is_default, created_at]
      properties:
        project_id:
          type: string
          format: uuid
          description: The project (control-plane grouping) this branch belongs to.
        branch_id:
          type: string
          format: uuid
          description: The branch id (the storage-layer branch id verbatim).
        name:
          type: string
        pg_version:
          type: integer
        is_default:
          type: boolean
          description: True for a project's default (root) branch.
        parent_branch_id:
          type: string
          format: uuid
          nullable: true
          description: The branch this one was forked from, or null for a project's default branch. Always in the same project.
        fork_lsn:
          type: string
          nullable: true
          description: The ancestor LSN this branch was forked at (storage-layer "X/X" form), or null for a default branch.
        created_at:
          type: string
          format: date-time

    BranchList:
      type: object
      required: [branches, total, count]
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Name for the new branch; unique within the project.
        parent_branch_id:
          type: string
          format: uuid
          description: The branch to fork from. Defaults to the project's default branch; set it to branch off another branch.
        fork_point_lsn:
          type: string
          description: |
            The ancestor LSN to branch at (storage-layer "X/X" form, e.g.
            "0/16ABCD0"). Omit to branch at the parent's latest LSN.

    Endpoint:
      type: object
      required: [id, project_id, branch_id, role, address, tailnet_address, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          description: The project (control-plane grouping) this endpoint is bound to.
        branch_id:
          type: string
          format: uuid
          description: The branch (storage-layer branch id) this endpoint is bound to.
        role:
          type: string
          enum: [read_write, read_only]
        address:
          type: string
          description: 'Client connection address (host:port) for the Postgres wire protocol (user cloud_admin, database postgres). Empty until the endpoint is deployed.'
        tailnet_address:
          type: string
          description: 'Tailscale (tailnet) connection address (host:port), when the endpoint Service is exposed on the tailnet. Empty when not tailnet-exposed.'
        created_at:
          type: string
          format: date-time

    EndpointList:
      type: object
      required: [endpoints, total, count]
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    CreateEndpointRequest:
      type: object
      properties:
        role:
          type: string
          enum: [read_write, read_only]
          default: read_write
          description: The endpoint's role. A branch admits at most one read_write endpoint.
        disk_type:
          type: string
          enum: [network, local]
          default: network
          description: |
            Backing disk for the endpoint's data volume. `network` (the default)
            provisions a network-attached block volume from the controller's
            configured storage class (e.g. EBS on AWS, Persistent Disk on GCP).
            `local` (a node-local instance SSD, typically NVMe) is not yet
            supported and is rejected with 400.
        resources:
          $ref: '#/components/schemas/EndpointResources'

    EndpointResources:
      type: object
      description: |
        CPU + memory reserved for the endpoint's compute pod. Each value is a
        Kubernetes resource quantity and is applied as BOTH the request and the
        limit on the endpoint container, so the pod is scheduled with the
        **Guaranteed** QoS class. Omit the object (or either field) to take the
        defaults of 2 CPU cores and 4Gi of memory.
      properties:
        cpu:
          type: string
          default: "2"
          description: |
            CPU reservation as a Kubernetes quantity (e.g. "2", "1500m",
            "500m"). Applied as both the request and the limit. Defaults to "2"
            (2 cores) when omitted.
        memory:
          type: string
          default: "4Gi"
          description: |
            Memory reservation as a Kubernetes quantity (e.g. "4Gi", "512Mi").
            Applied as both the request and the limit. Defaults to "4Gi" when
            omitted.

    Task:
      type: object
      required: [id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        project_id:
          type: string
          format: uuid
          nullable: true
        target_ref:
          type: string
          nullable: true
        params:
          description: The originating request, as opaque JSON.
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskList:
      type: object
      required: [tasks, total, count]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          $ref: '#/components/schemas/TotalCount'
        count:
          $ref: '#/components/schemas/PageCount'

    TotalCount:
      type: integer
      description: The number of items matching the request across all pages (ignores limit/offset).

    PageCount:
      type: integer
      description: The number of items returned in this response (this page).

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
